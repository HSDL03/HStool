  function drawWeapon() {
    if (player.dead) return;
    const w = weapon();
    if (w.melee) { drawFist(); return; }
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(aimAngle);
    drawGunShape(w.id, gunRecoil, player.size);
    ctx.restore();
  }

  function drawSlashTrails() {
    for (let i = 0; i < slashTrails.length; i++) {
      const t = slashTrails[i];
      const a = Math.max(0, t.life);
      const half = t.arcSize * 0.5;
      ctx.save();
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = t.w * a;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.size * 0.5 + t.reach * (1.05 - a * 0.35), t.angle - half, t.angle + half);
      ctx.stroke();
      ctx.globalAlpha = a * 0.22;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = t.w * a * 0.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.size * 0.5 + t.reach * (1.05 - a * 0.35), t.angle - half * 0.75, t.angle + half * 0.75);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawMuzzleFlash() {
    if (!muzzleFlash) return;
    const mf = muzzleFlash;
    const r = mf.size * mf.life;
    ctx.save();
    ctx.globalAlpha = mf.life;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mf.x, mf.y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.translate(mf.x, mf.y); ctx.rotate(aimAngle);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 1.3, 0); ctx.stroke();
    ctx.restore();
  }
  function drawBullets() {
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.save();
      ctx.strokeStyle = b.hostile ? '#555' : '#000';
      ctx.lineWidth = b.width; ctx.lineCap = 'round';
      ctx.globalAlpha = Math.min(1, 0.35 + b.life * 0.65);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * b.len, b.y - b.vy * b.len);
      ctx.stroke();
      ctx.restore();
    }
  }
  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      const s = Math.max(0.5, p.size * p.life);
      if (p.stretch && p.stretch > 1) ctx.fillRect(-s * p.stretch / 2, -s / 2, s * p.stretch, s);
      else ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawCursor() {
    if (showTouchUI || aiming) return;
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.lineTo(-3, 0); ctx.moveTo(3, 0); ctx.lineTo(11, 0);
    ctx.moveTo(0, -11); ctx.lineTo(0, -3); ctx.moveTo(0, 3); ctx.lineTo(0, 11);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 1.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fill();
    ctx.restore();
  }
  function drawScopeOverlay() {
    if (!aiming) return;
    const scoped = isScopedWeapon();
    const cx = W / 2, cy = H / 2;
    const innerR = scoped ? Math.min(W, H) * 0.34 : Math.min(W, H) * 0.52;
    const outerR = Math.max(W, H) * 0.82;
    const g = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, scoped ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.28)');
    ctx.save();
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.72)'; ctx.lineWidth = 1.2;
    if (scoped) {
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.62)'; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(cx - innerR, cy); ctx.lineTo(cx - 14, cy);
      ctx.moveTo(cx + 14, cy); ctx.lineTo(cx + innerR, cy);
      ctx.moveTo(cx, cy - innerR); ctx.lineTo(cx, cy - 14);
      ctx.moveTo(cx, cy + 14); ctx.lineTo(cx, cy + innerR);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(cx - 1.2, cy - 1.2, 2.4, 2.4);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 1; k <= 4; k++) { const off = k * 26; const ln = (k === 2 || k === 4) ? 9 : 5; ctx.moveTo(cx - ln, cy + off); ctx.lineTo(cx + ln, cy + off); }
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx - 13, cy); ctx.lineTo(cx - 3, cy);
      ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + 13, cy);
      ctx.moveTo(cx, cy - 13); ctx.lineTo(cx, cy - 3);
      ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + 13);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    }
    ctx.restore();
  }
  function drawHUD() {
    const bw = 168, bh = 11, bx = 18, by = H - 34;
    const ratio = Math.max(0, player.hp / player.maxHp);
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    if (ratio > 0) { ctx.fillStyle = '#000'; ctx.fillRect(bx + 2, by + 2, (bw - 4) * ratio, bh - 4); }
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('HP ' + Math.round(player.hp) + ' / ' + player.maxHp, bx, by - 4);
    ctx.textAlign = 'right';
    if (gameMode === 'ai') ctx.fillText('击倒 ' + enemyKills, bx + bw, by - 4);
    else if (gameMode === 'mp') ctx.fillText('联机 ' + (Object.keys(remotePlayers).length + 1) + ' 人', bx + bw, by - 4);
    ctx.restore();
    if (player.dead) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.font = '600 15px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('被击倒 · 正在重生…', W / 2, H / 2);
      ctx.restore();
    }
    if (aiming) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(isScopedWeapon() ? '瞄准镜 · 松开右键射击' : '瞄准中 · 松开右键射击', W / 2, 30);
      ctx.restore();
    }
  }
  function drawTouchControls() {
    if (!showTouchUI || !gameRunning) return;
    const jx = joy.active ? joy.baseX : joy.defaultX;
    const jy = joy.active ? joy.baseY : joy.defaultY;
    const R0 = joy.maxR;
    ctx.save();
    ctx.globalAlpha = joy.active ? 0.10 : 0.055;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(jx, jy, R0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = joy.active ? 0.45 : 0.18;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jx, jy, R0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = joy.active ? 0.30 : 0.12;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(jx - R0 * 0.55, jy); ctx.lineTo(jx + R0 * 0.55, jy);
    ctx.moveTo(jx, jy - R0 * 0.55); ctx.lineTo(jx, jy + R0 * 0.55);
    ctx.stroke();
    let kx = jx, ky = jy;
    if (joy.active) {
      let dx = joy.x - joy.baseX, dy = joy.y - joy.baseY;
      const d = Math.hypot(dx, dy);
      if (d > R0) { dx = dx / d * R0; dy = dy / d * R0; }
      kx = jx + dx; ky = jy + dy;
    }
    const sprinting = joy.active && joy.mag > 0.90;
    ctx.globalAlpha = joy.active ? (sprinting ? 0.92 : 0.62) : 0.24;
    ctx.fillStyle = sprinting ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(kx, ky, 25, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = joy.active ? 0.9 : 0.3;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 25, 0, Math.PI * 2); ctx.stroke();
    if (sprinting) {
      ctx.globalAlpha = 0.85; ctx.fillStyle = '#000';
      ctx.font = '600 11px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('疾跑', jx, jy - R0 - 15);
    }
    if (!joy.active) {
      ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('移动', jx, jy + R0 + 16);
    }
    ctx.restore();

    const fx = fireBtn.x, fy = fireBtn.y, fr = fireBtn.r;
    ctx.save();
    ctx.globalAlpha = fireBtn.pressed ? 0.92 : 0.55;
    ctx.fillStyle = fireBtn.pressed ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = fireBtn.pressed ? 0.95 : 0.65;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = fireBtn.pressed ? 0.35 : 0.22;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(fx, fy, fr - 8, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    const isMelee = weapon().melee;
    if (isMelee) {
      ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.fillRect(fx - 9, fy - 9, 18, 18);
      ctx.strokeStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.lineWidth = 1.5; ctx.strokeRect(fx - 9, fy - 9, 18, 18);
      ctx.beginPath(); ctx.moveTo(fx - 6, fy); ctx.lineTo(fx + 6, fy); ctx.stroke();
    } else {
      ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(fx - 12, fy - 2, 24, 4);
    }
    ctx.globalAlpha = fireBtn.pressed ? 0.85 : 0.4;
    ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('开火', fx, fy + fr + 14);
    ctx.restore();

    const ax = aimBtn.x, ay = aimBtn.y, ar = aimBtn.r;
    ctx.save();
    ctx.globalAlpha = aimBtn.pressed ? 0.9 : 0.45;
    ctx.fillStyle = aimBtn.pressed ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = aimBtn.pressed ? 0.95 : 0.55;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = aimBtn.pressed ? 0.9 : 0.55;
    ctx.strokeStyle = aimBtn.pressed ? '#ffffff' : '#000'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ax - 12, ay); ctx.lineTo(ax - 4, ay);
    ctx.moveTo(ax + 4, ay); ctx.lineTo(ax + 12, ay);
    ctx.moveTo(ax, ay - 12); ctx.lineTo(ax, ay - 4);
    ctx.moveTo(ax, ay + 4); ctx.lineTo(ax, ay + 12);
    ctx.stroke();
    ctx.globalAlpha = aimBtn.pressed ? 0.85 : 0.4;
    ctx.fillStyle = aimBtn.pressed ? '#ffffff' : '#000';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('瞄准', ax, ay + ar + 12);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    if (!gameRunning) return;
    const sx = (Math.random() - 0.5) * 2 * shake;
    const sy = (Math.random() - 0.5) * 2 * shake;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cam.x, -cam.y);
    drawGrid();
    drawWorldBorder();
    drawObstacles();
    drawBulletMarks();
    drawAimLine();
    drawAimPreview();
    drawShells();
    drawSlashTrails();
    drawRings();
    drawSprintAura();
    if (gameMode === 'ai') drawEnemies();
    if (gameMode === 'mp') drawRemotePlayers();
    drawPlayer();
    drawWeapon();
    drawMuzzleFlash();
    drawBullets();
    drawParticles();
    ctx.restore();
    drawScopeOverlay();
    drawCursor();
    drawHUD();
    drawTouchControls();
  }

  let lastTime = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 16.6667;
    lastTime = now;
    if (dt > 3) dt = 3;
    if (dt <= 0) dt = 1;
    update(dt, now);
    render();
  }
  requestAnimationFrame(loop);

  showStartScreen();
  if (!sb) console.warn('Supabase 未加载，联机模式不可用');
})();
</script>
</body>
</html>
