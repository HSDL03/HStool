  /* ============================================================
     输入
  ============================================================ */
  window.addEventListener('contextmenu', e => e.preventDefault());
  function dist2(x1, y1, x2, y2) { const dx = x1 - x2, dy = y1 - y2; return dx * dx + dy * dy; }

  window.addEventListener('wheel', e => {
    if (gameMode === 'menu') return;
    e.preventDefault();
    if (e.deltaY > 0) cycleWeapon(1);
    else if (e.deltaY < 0) cycleWeapon(-1);
  }, { passive: false });

  window.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch') {
      lastPointerType = 'touch'; showTouchUI = true;
      document.body.classList.remove('mouse-mode');
      if (e.pointerId === joy.pointerId) { joy.x = e.clientX; joy.y = e.clientY; updateJoy(); }
      else if (e.pointerId === touchAim.id) { touchAim.x = e.clientX; touchAim.y = e.clientY; }
      return;
    }
    lastPointerType = 'mouse'; showTouchUI = false;
    document.body.classList.add('mouse-mode');
    mouse.x = e.clientX; mouse.y = e.clientY;
  });

  window.addEventListener('pointerdown', e => {
    const target = e.target;
    if (target && target !== cv) {
      if (target.closest && target.closest('.overlay, button, input, select, textarea, label, .weapon-hud, .sound-btn, .menu-btn, .hint, .net-status')) return;
    }
    if (!gameRunning) return;

    if (e.pointerType === 'touch') {
      lastPointerType = 'touch'; showTouchUI = true;
      document.body.classList.remove('mouse-mode');

      if (aimBtn.pointerId === null && dist2(e.clientX, e.clientY, aimBtn.x, aimBtn.y) <= (aimBtn.r + 14) * (aimBtn.r + 14)) {
        aimBtn.pointerId = e.pointerId; aimBtn.pressed = true; aiming = true; return;
      }
      if (fireBtn.pointerId === null && dist2(e.clientX, e.clientY, fireBtn.x, fireBtn.y) <= (fireBtn.r + 14) * (fireBtn.r + 14)) {
        fireBtn.pointerId = e.pointerId; fireBtn.pressed = true; firing = true;
        if (weapon().melee) punch(); else fireGun();
        return;
      }
      if (e.clientX < W * 0.46 && joy.pointerId === null) {
        joy.pointerId = e.pointerId;
        joy.baseX = e.clientX; joy.baseY = e.clientY;
        joy.x = e.clientX; joy.y = e.clientY;
        joy.active = true; updateJoy();
        return;
      }
      if (touchAim.id === null) { touchAim.id = e.pointerId; touchAim.x = e.clientX; touchAim.y = e.clientY; touchAim.active = true; }
      return;
    }

    lastPointerType = 'mouse'; showTouchUI = false;
    document.body.classList.add('mouse-mode');
    mouse.x = e.clientX; mouse.y = e.clientY;

    if (e.button === 2) { aiming = true; return; }
    if (e.button !== 0) return;
    if (weapon().melee) punch();
    else { firing = true; fireGun(); }
  });

  window.addEventListener('pointerup', e => {
    const upTarget = e.target;
    if (upTarget && upTarget !== cv) {
      if (upTarget.closest && upTarget.closest('.overlay, button, input, select, textarea, label')) return;
    }
    if (e.pointerType === 'touch') {
      if (e.pointerId === aimBtn.pointerId) { aimBtn.pointerId = null; aimBtn.pressed = false; aiming = false; }
      if (e.pointerId === fireBtn.pointerId) { fireBtn.pointerId = null; fireBtn.pressed = false; firing = false; }
      if (e.pointerId === joy.pointerId) resetJoy();
      if (e.pointerId === touchAim.id) { touchAim.id = null; touchAim.active = false; }
      return;
    }
    if (e.button === 2) {
      if (aiming) {
        aiming = false;
        if (gameRunning && !weapon().melee && !player.dead) fireGun();
      }
      return;
    }
    firing = false;
  });

  window.addEventListener('pointercancel', e => {
    if (e.pointerType === 'touch') {
      if (e.pointerId === aimBtn.pointerId) { aimBtn.pointerId = null; aimBtn.pressed = false; aiming = false; }
      if (e.pointerId === fireBtn.pointerId) { fireBtn.pointerId = null; fireBtn.pressed = false; firing = false; }
      if (e.pointerId === joy.pointerId) resetJoy();
      if (e.pointerId === touchAim.id) { touchAim.id = null; touchAim.active = false; }
      return;
    }
    aiming = false; firing = false;
  });

  window.addEventListener('blur', () => {
    firing = false; aiming = false; resetJoy();
    touchAim.active = false; touchAim.id = null;
    fireBtn.pointerId = null; fireBtn.pressed = false;
    aimBtn.pointerId = null; aimBtn.pressed = false;
  });

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (!gameRunning) return;
    if (e.code === 'Space') { e.preventDefault(); if (weapon().melee) punch(); else { firing = true; fireGun(); } }
    if (e.code === 'KeyQ') cycleWeapon(1);
    if (e.code === 'Digit1') setWeaponIndex(0);
    if (e.code === 'Digit2') setWeaponIndex(10);
    if (e.code === 'Digit3') setWeaponIndex(22);
    if (e.code === 'Escape') { leaveChannel(); showStartScreen(); }
    if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (e.code === 'Space') firing = false;
  });

  function updateJoy() {
    const dx = joy.x - joy.baseX, dy = joy.y - joy.baseY;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) { joy.dx = dx / d; joy.dy = dy / d; joy.mag = Math.min(d, joy.maxR) / joy.maxR; }
    else { joy.dx = 0; joy.dy = 0; joy.mag = 0; }
  }
  function resetJoy() { joy.active = false; joy.pointerId = null; joy.dx = 0; joy.dy = 0; joy.mag = 0; }

  /* ============================================================
     更新
  ============================================================ */
  function collidePlayer() {
    const half = player.size / 2;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      const ox = Math.min(player.x + half, o.x + o.w) - Math.max(player.x - half, o.x);
      const oy = Math.min(player.y + half, o.y + o.h) - Math.max(player.y - half, o.y);
      if (ox > 0 && oy > 0) {
        if (ox < oy) { player.x += (player.x < o.x + o.w / 2) ? -ox : ox; player.vx *= -0.2; }
        else { player.y += (player.y < o.y + o.h / 2) ? -oy : oy; player.vy *= -0.2; }
      }
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      const damp = Math.pow(0.92, dt);
      p.vx *= damp; p.vy *= damp;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= 0.055 * dt;
      if (r.life <= 0) rings.splice(i, 1);
      else r.radius = r.maxR * (1 - Math.pow(r.life, 2));
    }
  }
  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const speed = Math.hypot(b.vx, b.vy);
      const steps = Math.max(1, Math.ceil(speed * dt / 8));
      const stepDt = dt / steps;
      let dead = false;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx * stepDt; b.y += b.vy * stepDt;
        b.life -= b.decay * stepDt;
        if (b.life <= 0 || b.x < -40 || b.x > WORLD_W + 40 || b.y < -40 || b.y > WORLD_H + 40) { dead = true; break; }
        if (pointInObstacle(b.x, b.y)) {
          addBulletMark(b.x, b.y, b.vx, b.vy, b.width / 2.4);
          if (b.pierce > 0) {
            b.pierce--;
            let guard = 0;
            while (pointInObstacle(b.x, b.y) && guard++ < 80) { b.x += b.vx * 0.35; b.y += b.vy * 0.35; }
          } else {
            spawnImpact(b.x, b.y, Math.atan2(-b.vy, -b.vx), 8);
            shake = Math.max(shake, 2.2);
            playHitSound();
            dead = true; break;
          }
        }
        if (b.visual) continue;
        if (b.hostile) {
          if (gameMode === 'ai' && !player.dead && player.invuln <= 0) {
            const dx = b.x - player.x, dy = b.y - player.y;
            const rr = (player.size / 2 + 4);
            if (dx * dx + dy * dy < rr * rr) { damagePlayer(b.damage); dead = true; break; }
          }
          continue;
        }
        if (gameMode === 'ai') {
          let hit = false;
          for (let ei = 0; ei < enemies.length; ei++) {
            const e = enemies[ei];
            if (!e.alive) continue;
            const dx = b.x - e.x, dy = b.y - e.y;
            const rr = (e.size / 2 + 4);
            if (dx * dx + dy * dy < rr * rr) {
              damageEnemy(e, b.damage, b.x, b.y, false, null);
              if (b.pierce > 0) b.pierce--;
              else dead = true;
              hit = true; break;
            }
          }
          if (dead) break;
          if (hit) continue;
        }
        if (gameMode === 'mp') {
          let hitRemote = false;
          for (const rid in remotePlayers) {
            const rp = remotePlayers[rid];
            if (rp.dead || rp.fading) continue;
            const dx = b.x - rp.x, dy = b.y - rp.y;
            const rr = (rp.size || 34) / 2 + 4;
            if (dx * dx + dy * dy < rr * rr) {
              if (channel) channel.send({ type: 'broadcast', event: 'hit', payload: { target: rid, damage: b.damage || 14, from: myId } });
              spawnHitBurst(rp.x, rp.y, Math.atan2(-b.vy, -b.vx), 10, false);
              if (b.pierce > 0) b.pierce--;
              else dead = true;
              hitRemote = true; break;
            }
          }
          if (dead) break;
          if (hitRemote) continue;
        }
      }
      if (dead) bullets.splice(i, 1);
    }
  }
  function updateCamera(dt) {
    if (aiming && isScopedWeapon()) targetZoom = 0.52;
    else if (aiming) targetZoom = 0.82;
    else targetZoom = 1;
    zoom += (targetZoom - zoom) * Math.min(1, 0.16 * dt);
    if (Math.abs(zoom - targetZoom) < 0.002) zoom = targetZoom;
    const viewW = W / zoom, viewH = H / zoom;
    let lookX = 0, lookY = 0;
    if (showTouchUI) {
      if (touchAim.active) {
        lookX = ((touchAim.x / W) - 0.5) * viewW * LOOKAHEAD;
        lookY = ((touchAim.y / H) - 0.5) * viewH * LOOKAHEAD;
      }
    } else {
      lookX = ((mouse.x / W) - 0.5) * viewW * LOOKAHEAD;
      lookY = ((mouse.y / H) - 0.5) * viewH * LOOKAHEAD;
    }
    const tx = clampCam(player.x - viewW / 2 + lookX, WORLD_W, viewW);
    const ty = clampCam(player.y - viewH / 2 + lookY, WORLD_H, viewH);
    if (!cam.ready) { cam.x = tx; cam.y = ty; cam.ready = true; return; }
    const k = Math.min(1, 0.14 * dt);
    cam.x += (tx - cam.x) * k;
    cam.y += (ty - cam.y) * k;
  }

  function update(dt, now) {
    if (!gameRunning) return;
    if (hitStop > 0) {
      hitStop -= dt;
      updateParticles(dt);
      updateSlashTrails(dt);
      updateRemotePlayers(dt);
      shake *= Math.pow(0.80, dt);
      if (shake < 0.08) shake = 0;
      return;
    }
    if (player.dead) { player.respawnTimer -= dt; if (player.respawnTimer <= 0) respawnPlayer(); }
    if (player.invuln > 0) player.invuln -= dt;

    let mx = 0, my = 0;
    if (!player.dead) {
      if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
      if (keys['KeyW'] || keys['ArrowUp'])    my -= 1;
      if (keys['KeyS'] || keys['ArrowDown'])  my += 1;
      if (joy.active && joy.mag > 0.12) { mx += joy.dx * joy.mag; my += joy.dy * joy.mag; }
    }
    const inMag = Math.hypot(mx, my);
    if (inMag > 1) { mx /= inMag; my /= inMag; }

    let sprint = !!(keys['ShiftLeft'] || keys['ShiftRight']);
    if (joy.active && joy.mag > 0.90) sprint = true;

    let accelNow = player.accel * (sprint ? SPRINT_MULT_ACCEL : 1);
    let maxSpNow = player.maxSpeed * (sprint ? SPRINT_MULT_SPEED : 1);
    if (aiming) { accelNow *= 0.62; maxSpNow *= 0.48; }

    if (mx || my) { player.vx += mx * accelNow * dt; player.vy += my * accelNow * dt; }
    const fr = Math.pow(player.friction, dt);
    player.vx *= fr; player.vy *= fr;
    const sp = Math.hypot(player.vx, player.vy);
    if (sp > maxSpNow) { player.vx *= maxSpNow / sp; player.vy *= maxSpNow / sp; }
    player.x += player.vx * dt; player.y += player.vy * dt;

    const m = player.size / 2 + 2;
    if (player.x < m) { player.x = m; player.vx = Math.abs(player.vx) * 0.3; }
    if (player.x > WORLD_W - m) { player.x = WORLD_W - m; player.vx = -Math.abs(player.vx) * 0.3; }
    if (player.y < m) { player.y = m; player.vy = Math.abs(player.vy) * 0.3; }
    if (player.y > WORLD_H - m) { player.y = WORLD_H - m; player.vy = -Math.abs(player.vy) * 0.3; }

    collidePlayer();

    let px, py;
    if (touchAim.active) { px = touchAim.x; py = touchAim.y; }
    else { px = mouse.x; py = mouse.y; }
    const worldMouseX = cam.x + px / zoom;
    const worldMouseY = cam.y + py / zoom;
    const targetAngle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
    let diff = targetAngle - aimAngle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const turnSpeed = aiming ? 0.30 : (touchAim.active ? 0.55 : 0.42);
    aimAngle += diff * Math.min(1, turnSpeed * dt);

    const w = weapon();
    const durLocal = w.melee && w.dur ? w.dur : PUNCH_DUR;
    const t = (now - punchStart) / durLocal;
    let ext = 0;
    if (t >= 0 && t <= 1) {
      if (t < PUNCH_OUT) ext = 1 - Math.pow(1 - t / PUNCH_OUT, 4);
      else { const p = (t - PUNCH_OUT) / (1 - PUNCH_OUT); ext = 1 - (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); }
    }
    state.ext = ext;
    const reach = (w.melee && w.range ? w.range : 40);
    const dist = player.size / 2 + 4 + ext * reach;
    state.fx = player.x + Math.cos(aimAngle) * dist;
    state.fy = player.y + Math.sin(aimAngle) * dist;

    if (w.melee && !hitFired && ext > 0.60) {
      hitFired = true;
      const hitObs = pointInObstacle(state.fx, state.fy);
      const dmgVal = w.dmg || 22;
      let hitSomething = false;

      if (gameMode === 'ai') {
        const coneHalf = 0.55;
        for (let ei = 0; ei < enemies.length; ei++) {
          const e = enemies[ei];
          if (!e.alive) continue;
          const dx = e.x - player.x, dy = e.y - player.y;
          const edist = Math.hypot(dx, dy);
          if (edist > reach + e.size * 0.6) continue;
          let ea = Math.atan2(dy, dx) - aimAngle;
          ea = Math.atan2(Math.sin(ea), Math.cos(ea));
          if (Math.abs(ea) > coneHalf) continue;
          if (!hasLineOfSight(player.x, player.y, e.x, e.y)) continue;
          damageEnemy(e, dmgVal, e.x, e.y, true, w);
          hitSomething = true; break;
        }
      } else if (gameMode === 'mp') {
        const coneHalf = 0.55;
        for (const rid in remotePlayers) {
          const rp = remotePlayers[rid];
          if (rp.dead || rp.fading) continue;
          const dx = rp.x - player.x, dy = rp.y - player.y;
          const rdist = Math.hypot(dx, dy);
          if (rdist > reach + 22) continue;
          let ra = Math.atan2(dy, dx) - aimAngle;
          ra = Math.atan2(Math.sin(ra), Math.cos(ra));
          if (Math.abs(ra) > coneHalf) continue;
          if (!hasLineOfSight(player.x, player.y, rp.x, rp.y)) continue;
          if (channel) channel.send({ type: 'broadcast', event: 'hit', payload: { target: rid, damage: dmgVal, from: myId } });
          spawnMeleeHit(rp.x, rp.y, aimAngle, w);
          hitSomething = true; break;
        }
      }

      if (hitSomething) {
        const hsBase = { fist:5, knuckle:5, dagger:4, shortsword:5, nunchaku:3, chainsaw:2, katana:7, spear:6, axe:9, hammer:11 }[w.id] || 5;
        hitStop = hsBase;
        shake = Math.max(shake, { fist:5.5, knuckle:6, dagger:4.5, shortsword:5.5, nunchaku:4, chainsaw:3, katana:8.5, spear:7.5, axe:10.5, hammer:13 }[w.id] || 5);
        playMeleeHitSound(w);
      } else if (hitObs) {
        spawnMeleeHit(state.fx, state.fy, aimAngle, w);
        addBulletMark(state.fx, state.fy, Math.cos(aimAngle), Math.sin(aimAngle), 1.4);
        shake = Math.max(shake, { katana:6, spear:5.5, axe:8, hammer:9 }[w.id] || 4);
        playHitSound();
      } else {
        spawnImpact(state.fx, state.fy, aimAngle, 6);
      }
    }

    if (burstLeft > 0 && w.burst && now >= burstNext) { burstLeft--; burstNext = now + (w.burstDelay || 60); shootOne(); }
    if (firing && !player.dead) { if (w.melee) punch(); else fireGun(); }

    updateBullets(dt);
    if (gameMode === 'ai') updateEnemies(dt);
    if (gameMode === 'mp') updateRemotePlayers(dt);
    updateShells(dt);
    updateParticles(dt);
    updateSlashTrails(dt);
    updateCamera(dt);

    if (gameMode === 'mp') {
      mpSendAccum += dt;
      if (mpSendAccum >= MP_SEND_INTERVAL) { mpSendAccum = 0; sendMyState(false); }
    }

    gunRecoil *= Math.pow(0.72, dt);
    if (gunRecoil < 0.05) gunRecoil = 0;
    if (muzzleFlash) { muzzleFlash.life -= 0.14 * dt; if (muzzleFlash.life <= 0) muzzleFlash = null; }
    shake *= Math.pow(0.80, dt);
    if (shake < 0.08) shake = 0;
  }

  /* ============================================================
     绘制
  ============================================================ */
  function drawGrid() {
    const G = 50;
    const x0 = Math.floor(cam.x / G) * G, y0 = Math.floor(cam.y / G) * G;
    const x1 = cam.x + W / zoom + G, y1 = cam.y + H / zoom + G;
    ctx.strokeStyle = 'rgba(0,0,0,0.045)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += G) { ctx.moveTo(x + 0.5, y0); ctx.lineTo(x + 0.5, y1); }
    for (let y = y0; y <= y1; y += G) { ctx.moveTo(x0, y + 0.5); ctx.lineTo(x1, y + 0.5); }
    ctx.stroke();
  }
  function drawWorldBorder() {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.strokeRect(-3, -3, WORLD_W + 6, WORLD_H + 6);
  }
  function drawObstacles() {
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      ctx.fillStyle = '#f6f6f6'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.save();
      ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = -o.h; k < o.w; k += 13) { ctx.moveTo(o.x + k, o.y + o.h); ctx.lineTo(o.x + k + o.h, o.y); }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    }
  }
  function drawBulletMarks() {
    for (let i = 0; i < marks.length; i++) {
      const mk = marks[i];
      if (mk.x < cam.x - 24 || mk.x > cam.x + W / zoom + 24 || mk.y < cam.y - 24 || mk.y > cam.y + H / zoom + 24) continue;
      ctx.save();
      ctx.translate(mk.x, mk.y); ctx.rotate(mk.rot);
      ctx.globalAlpha = mk.a; ctx.fillStyle = '#000';
      ctx.fillRect(-mk.r, -mk.r, mk.r * 2, mk.r * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawAimLine() {
    if (aiming) return;
    const wx = cam.x + (touchAim.active ? touchAim.x : mouse.x) / zoom;
    const wy = cam.y + (touchAim.active ? touchAim.y : mouse.y) / zoom;
    ctx.save(); ctx.setLineDash([3, 8]);
    ctx.strokeStyle = 'rgba(0,0,0,0.09)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(wx, wy); ctx.stroke();
    ctx.restore();
  }
  function drawAimPreview() {
    if (!aiming) return;
    const maxDist = 1200;
    const hit = raycastHit(player.x, player.y, aimAngle, maxDist);
    ctx.save();
    ctx.setLineDash([6, 9]);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(hit.x, hit.y); ctx.stroke();
    ctx.setLineDash([]);
    const ps = 9;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(hit.x - ps / 2, hit.y - ps / 2, ps, ps);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
    ctx.strokeRect(hit.x - ps / 2, hit.y - ps / 2, ps, ps);
    const pulse = 1 + Math.sin(performance.now() / 260) * 0.16;
    ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(hit.x, hit.y, ps * 1.7 * pulse, 0, Math.PI * 2); ctx.stroke();
    const label = Math.round(hit.dist) + ' m';
    ctx.save();
    ctx.translate(hit.x, hit.y - 22);
    ctx.scale(1 / zoom, 1 / zoom);
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.font = '600 12px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0);
    ctx.restore();
    if (gameMode === 'ai') {
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive) continue;
        if (!hasLineOfSight(player.x, player.y, e.x, e.y)) continue;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d > maxDist) continue;
        ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
        ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(e.x, e.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.85, 0, Math.PI * 2); ctx.stroke();
        break;
      }
    }
    if (gameMode === 'mp') {
      for (const rid in remotePlayers) {
        const rp = remotePlayers[rid];
        if (rp.dead || rp.fading) continue;
        if (!hasLineOfSight(player.x, player.y, rp.x, rp.y)) continue;
        ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
        ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rp.x, rp.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, 30, 0, Math.PI * 2); ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }
  function drawRings() {
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, r.life) * 0.85;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = (r.lineW || 1.2) + r.life * 2.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  function drawShells() {
    for (let i = 0; i < shells.length; i++) {
      const s = shells[i];
      ctx.save();
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.globalAlpha = Math.min(1, s.life * 4);
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, 1);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawSprintAura() {
    const sp = Math.hypot(player.vx, player.vy);
    if (sp < player.maxSpeed * 1.06) return;
    ctx.save();
    ctx.globalAlpha = 0.16; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.arc(player.x, player.y, player.size * 1.15, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function drawPlayer() {
    if (player.dead) return;
    const ext = state.ext;
    const recoil = ext * 4 + gunRecoil * 0.35;
    const bx = player.x - Math.cos(aimAngle) * recoil;
    const by = player.y - Math.sin(aimAngle) * recoil;
    const s = player.size;
    if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.save();
    ctx.translate(bx, by);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawRemotePlayers() {
    const now = performance.now();
    for (const rid in remotePlayers) {
      const rp = remotePlayers[rid];
      const s = 34;
      let alpha = 1;
      if (rp.fading) {
        const fadeAge = now - rp.fadeStart;
        alpha = Math.max(0, 1 - fadeAge / REMOTE_FADE_MS) * 0.55;
      }
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(rp.x, rp.y);
      if (rp.dead) {
        ctx.fillStyle = '#888';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
        ctx.beginPath();
        ctx.moveTo(-s / 4, -s / 4); ctx.lineTo(s / 4, s / 4);
        ctx.moveTo(s / 4, -s / 4); ctx.lineTo(-s / 4, s / 4);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(rp.name || '玩家', 0, -s / 2 - 6);
        ctx.restore();
        continue;
      }
      ctx.fillStyle = '#000000';
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
      ctx.save();
      ctx.rotate(rp.angle);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(s / 2 - 3, -3, 5, 6);
      ctx.restore();
      ctx.save();
      ctx.rotate(rp.angle);
      const rw = WEAPONS[rp.weapon];
      if (rw && !rw.melee) { ctx.fillStyle = '#ffffff'; ctx.fillRect(s / 2 - 4, -2, 20, 4); }
      else if (rw && rw.melee) { ctx.fillStyle = '#ffffff'; ctx.fillRect(s / 2, -2, 8 + rp.ext * 12, 4); }
      ctx.restore();
      if (rp.hp < rp.maxHp) {
        const bw = s + 4, bh = 4, by = -s / 2 - 12;
        const ratio = Math.max(0, rp.hp / rp.maxHp);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(-bw / 2, by, bw, bh);
        ctx.fillStyle = '#000';
        ctx.fillRect(-bw / 2, by, bw * ratio, bh);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(-bw / 2 + 0.5, by + 0.5, bw - 1, bh - 1);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(rp.name || '玩家', 0, -s / 2 - 16);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawEnemies() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const s = e.size;
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.hitFlash > 0.05) { ctx.fillStyle = 'rgba(255,255,255,' + (e.hitFlash * 0.9).toFixed(3) + ')'; ctx.fillRect(-s / 2 - 3, -s / 2 - 3, s + 6, s + 6); }
      ctx.fillStyle = '#000000'; ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(s / 2 - 3, -3, 5, 6);
      if (e.hp < e.maxHp) {
        const bw = s + 4, bh = 4, by = -s / 2 - 10;
        const ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(-bw / 2, by, bw, bh);
        ctx.fillStyle = '#000'; ctx.fillRect(-bw / 2, by, bw * ratio, bh);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(-bw / 2 + 0.5, by + 0.5, bw - 1, bh - 1);
      }
      if (e.state === 'chase') {
        const blink = Math.sin(performance.now() / 180) > 0;
        if (blink) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, -s / 2 - 20, 3.2, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.restore();
    }
  }

  /* ============================================================
     近战绘制（10 种独立造型）
  ============================================================ */
  function drawMeleeShape(style) {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const s = 20;

    switch (style) {
      case 'fist':
        ctx.beginPath(); ctx.rect(-s/2, -s/2, s, s); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s/2+4, 0); ctx.lineTo(s/2-4, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s/2, -s/4); ctx.lineTo(s/2, -s/4); ctx.stroke();
        break;
      case 'knuckle': {
        ctx.beginPath(); ctx.rect(-s/2, -s/2, s, s); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s/2, 0); ctx.lineTo(s/2, 0); ctx.stroke();
        /* 4个金属刺 */
        for (let i = 0; i < 4; i++) {
          const x = -s/2 + 4 + i * (s-8)/3;
          ctx.beginPath();
          ctx.moveTo(x, -s/2);
          ctx.lineTo(x, -s/2 - 5);
          ctx.lineTo(x + 3, -s/2 - 3);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
        break;
      }
      case 'dagger':
        ctx.beginPath(); ctx.rect(-s*0.9, -s*0.14, s*0.6, s*0.28); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(-s*0.32, -s*0.3, s*0.16, s*0.6); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s*0.16, -s*0.14); ctx.lineTo(s*0.9, -s*0.05);
        ctx.lineTo(s*1.05, 0); ctx.lineTo(s*0.9, s*0.05);
        ctx.lineTo(-s*0.16, s*0.14); ctx.closePath();
        ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-s*0.1, 0); ctx.lineTo(s*0.75, 0); ctx.stroke();
        break;
      case 'shortsword':
        ctx.beginPath(); ctx.rect(-s*1.0, -s*0.15, s*0.5, s*0.3); ctx.fill(); ctx.stroke();
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(-s*0.95 + i*s*0.15, -s*0.15);
          ctx.lineTo(-s*0.85 + i*s*0.15, s*0.15);
          ctx.stroke();
        }
        ctx.beginPath(); ctx.rect(-s*0.55, -s*0.35, s*0.13, s*0.7); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s*0.42, -s*0.14); ctx.lineTo(s*0.95, -s*0.07);
        ctx.lineTo(s*1.1, 0); ctx.lineTo(s*0.95, s*0.07);
        ctx.lineTo(-s*0.42, s*0.14); ctx.closePath();
        ctx.fill(); ctx.stroke();
        break;
      case 'nunchaku':
        ctx.beginPath(); ctx.rect(-s*0.95, -s*0.13, s*0.55, s*0.26); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.setLineDash([3, 3]); ctx.moveTo(-s*0.4, 0); ctx.lineTo(s*0.15, 0);
        ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.rect(s*0.15, -s*0.13, s*0.9, s*0.26); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.35, -s*0.13); ctx.lineTo(s*0.35, s*0.13); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.85, -s*0.13); ctx.lineTo(s*0.85, s*0.13); ctx.stroke();
        break;
      case 'chainsaw':
        ctx.beginPath(); ctx.rect(-s*0.85, -s*0.28, s*1.8, s*0.56); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i < 7; i++) {
          const x = -s*0.85 + i * (s*1.8/7);
          const ww = s*1.8/14;
          ctx.moveTo(x, -s*0.28); ctx.lineTo(x+ww, -s*0.5); ctx.lineTo(x+ww*2, -s*0.28); ctx.closePath();
        }
        ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(-s*1.05, -s*0.15, s*0.35, s*0.3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(s*0.9, 0, s*0.18, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        break;
      case 'katana':
        ctx.beginPath(); ctx.rect(-s*1.15, -s*0.1, s*0.55, s*0.2); ctx.fill(); ctx.stroke();
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(-s*1.1 + i*s*0.13, -s*0.1);
          ctx.lineTo(-s*1.0 + i*s*0.13, s*0.1);
          ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(-s*0.55, 0, s*0.16, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s*0.4, -s*0.07);
        ctx.quadraticCurveTo(s*0.4, -s*0.18, s*1.5, -s*0.24);
        ctx.lineTo(s*1.55, -s*0.14);
        ctx.quadraticCurveTo(s*0.4, -s*0.08, -s*0.4, s*0.07);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s*0.3, -s*0.02);
        ctx.quadraticCurveTo(s*0.4, -s*0.13, s*1.45, -s*0.19);
        ctx.stroke();
        break;
      case 'spear':
        /* 长柄 */
        ctx.beginPath(); ctx.rect(-s*1.5, -s*0.06, s*2.6, s*0.12); ctx.fill(); ctx.stroke();
        /* 握把纹路 */
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(-s*1.4 + i*s*0.2, -s*0.06);
          ctx.lineTo(-s*1.4 + i*s*0.2, s*0.06);
          ctx.stroke();
        }
        /* 三角矛头 */
        ctx.beginPath();
        ctx.moveTo(s*1.1, -s*0.4);
        ctx.lineTo(s*1.6, 0);
        ctx.lineTo(s*1.1, s*0.4);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        /* 矛头与杆连接 */
        ctx.beginPath(); ctx.rect(s*0.95, -s*0.08, s*0.16, s*0.16); ctx.fill(); ctx.stroke();
        break;
      case 'axe':
        /* 柄 */
        ctx.beginPath(); ctx.rect(-s*1.15, -s*0.09, s*1.8, s*0.18); ctx.fill(); ctx.stroke();
        /* 战斧头（单刃大弧） */
        ctx.beginPath();
        ctx.moveTo(s*0.35, -s*0.55);
        ctx.lineTo(s*1.15, -s*0.6);
        ctx.quadraticCurveTo(s*1.4, 0, s*1.15, s*0.6);
        ctx.lineTo(s*0.35, s*0.55);
        ctx.quadraticCurveTo(s*0.55, 0, s*0.35, -s*0.55);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        /* 斧刃高光线 */
        ctx.beginPath();
        ctx.moveTo(s*1.1, -s*0.5);
        ctx.quadraticCurveTo(s*1.3, 0, s*1.1, s*0.5);
        ctx.stroke();
        break;
      case 'hammer':
        ctx.beginPath(); ctx.rect(-s*1.15, -s*0.1, s*1.4, s*0.2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(-s*1.3, -s*0.16, s*0.18, s*0.32); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.rect(s*0.25, -s*0.55, s*1.05, s*1.1); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.6, -s*0.55); ctx.lineTo(s*0.6, s*0.55); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(s*0.95, -s*0.55); ctx.lineTo(s*0.95, s*0.55); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s*0.25, -s*0.4); ctx.lineTo(s*0.4, -s*0.55);
        ctx.moveTo(s*0.25, s*0.4); ctx.lineTo(s*0.4, s*0.55);
        ctx.stroke();
        break;
    }
  }

  function drawFist() {
    const w = weapon();
    const ext = state.ext;
    const scale = 1 + ext * 0.3;
    ctx.save();
    ctx.translate(state.fx, state.fy);
    ctx.rotate(aimAngle);
    ctx.scale(scale, scale);
    drawMeleeShape(w.style || 'fist');
    ctx.restore();
  }

  /* ============================================================
     远程绘制（参数化，每种武器外观不同）
  ============================================================ */
  function drawGunShape(w, recoil, s) {
    const h = s / 2;
    const r = recoil;
    const style = w.style;
    const v = w.variant || 0;

    /* 变体参数：不同组合生成不同外观 */
    const stockT = v % 3;                 // 0=无, 1=标准托, 2=折叠托
    const magT = ((v / 3) | 0) % 4;       // 0=短, 1=标准, 2=长, 3=弹鼓
    const scopeT = ((v / 12) | 0) % 3;    // 0=无, 1=小, 2=大

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;

    const B = (x, y, ww, hh) => {
      if (ww < 1) ww = 1; if (hh < 1) hh = 1;
      ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.fill(); ctx.stroke();
    };
    const T = (x1, y1, x2, y2, x3, y3) => {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    };
    const C = (cx, cy, cr) => {
      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    };

    /* 各种风格的基础框架 */
    let bodyX = h - 4, bodyY = -5, bodyW = 20, bodyH = 11;
    let barrelLen = 12, barrelY = -3, barrelH = 6;
    let gripX = h + 2, gripY = 6, gripW = 9, gripH = 13;
    let magX = h + 1, magY = 7, magW = 9, magH = 18;
    let scopeW = 0;

    switch (style) {
      case 'pistol':
        bodyX = h - 6; bodyY = -5; bodyW = 14; bodyH = 10;
        barrelLen = 4; barrelY = -2.5; barrelH = 5;
        gripX = h - 11; gripY = 4; gripW = 9; gripH = 13;
        magW = 0; magH = 0; scopeW = 0;
        break;
      case 'smg':
        bodyX = h - 6; bodyY = -6; bodyW = 20; bodyH = 12;
        barrelLen = 8; barrelY = -3; barrelH = 6;
        gripX = h - 8; gripY = 6; gripW = 8; gripH = 12;
        magX = h + 4; magY = 6; magW = 8; magH = 16;
        break;
      case 'rifle':
        bodyX = h - 4; bodyY = -5; bodyW = 22; bodyH = 11;
        barrelLen = 14; barrelY = -3; barrelH = 6;
        gripX = h + 2; gripY = 6; gripW = 9; gripH = 13;
        magX = h + 1; magY = 7; magW = 9; magH = 18;
        break;
      case 'shotgun':
        bodyX = h - 2; bodyY = -5; bodyW = 14; bodyH = 10;
        barrelLen = 20; barrelY = -4; barrelH = 8;
        gripX = h + 4; gripY = 5; gripW = 8; gripH = 11;
        magW = 0; magH = 0;
        break;
      case 'dmr':
        bodyX = h - 4; bodyY = -4; bodyW = 20; bodyH = 9;
        barrelLen = 18; barrelY = -3; barrelH = 5;
        gripX = h + 2; gripY = 5; gripW = 8; gripH = 12;
        magX = h + 1; magY = 6; magW = 8; magH = 15;
        scopeW = 16;
        break;
      case 'sniper':
        bodyX = h - 4; bodyY = -4; bodyW = 20; bodyH = 9;
        barrelLen = 24; barrelY = -3; barrelH = 5;
        gripX = h + 2; gripY = 5; gripW = 8; gripH = 12;
        magX = h + 1; magY = 6; magW = 8; magH = 14;
        scopeW = 22;
        break;
      case 'lmg':
        bodyX = h - 4; bodyY = -7; bodyW = 24; bodyH = 14;
        barrelLen = 16; barrelY = -4; barrelH = 7;
        gripX = h + 2; gripY = 7; gripW = 9; gripH = 14;
        magX = h + 1; magY = 8; magW = 10; magH = 16;
        break;
      case 'special':
        bodyX = h - 6; bodyY = -6; bodyW = 22; bodyH = 12;
        barrelLen = 18; barrelY = -4; barrelH = 8;
        gripX = h - 4; gripY = 6; gripW = 8; gripH = 12;
        magX = h + 4; magY = 6; magW = 8; magH = 14;
        scopeW = 14;
        break;
    }

    /* --- 枪托 --- */
    if (stockT === 1) {
      B(bodyX - 12, bodyY + 2, 14, bodyH - 6);
    } else if (stockT === 2) {
      B(bodyX - 9, bodyY + 2, 10, bodyH - 5);
      ctx.beginPath();
      ctx.moveTo(bodyX - 9, bodyY + bodyH * 0.5);
      ctx.lineTo(bodyX - 9, bodyY + bodyH - 3);
      ctx.stroke();
    }

    /* --- 机匣 --- */
    B(bodyX, bodyY, bodyW, bodyH);

    /* 机匣上的细节装饰 */
    if (v % 2 === 0) {
      /* 顶部导轨 */
      ctx.beginPath(); ctx.rect(bodyX + 4, bodyY - 2, bodyW - 8, 2); ctx.fill(); ctx.stroke();
    }
    if (v % 3 === 0 && style !== 'pistol') {
      /* 抛壳口 */
      ctx.beginPath(); ctx.rect(bodyX + bodyW * 0.5, bodyY + 1, 5, 3); ctx.fill(); ctx.stroke();
    }

    /* --- 枪管 --- */
    const bLen = Math.max(3, barrelLen - r * 0.4);
    B(bodyX + bodyW, barrelY, bLen, barrelH);
    /* 枪管口 */
    ctx.beginPath(); ctx.rect(bodyX + bodyW + bLen, barrelY, 3, barrelH); ctx.fill(); ctx.stroke();

    /* --- 握把 --- */
    B(gripX, gripY, gripW, gripH);
    /* 握把纹路 */
    if (v % 2 === 1) {
      ctx.beginPath(); ctx.moveTo(gripX + 2, gripY + 3); ctx.lineTo(gripX + gripW - 2, gripY + 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gripX + 2, gripY + 6); ctx.lineTo(gripX + gripW - 2, gripY + 6); ctx.stroke();
    }

    /* --- 弹匣 --- */
    if (magW > 0 && magH > 0) {
      if (magT === 3 && style !== 'pistol') {
        /* 弹鼓 */
        C(magX + magW / 2, magY + magH * 0.4, 8);
      } else {
        let mh = magH;
        if (magT === 0) mh *= 0.6;
        else if (magT === 2) mh *= 1.5;
        /* 弧形弹匣（rifle 特色） */
        if (style === 'rifle' && magT >= 1) {
          ctx.beginPath();
          ctx.moveTo(magX, magY);
          ctx.lineTo(magX + magW, magY);
          ctx.lineTo(magX + magW - 2, magY + mh);
          ctx.lineTo(magX - 2, magY + mh);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        } else {
          B(magX, magY, magW, mh);
        }
      }
    }

    /* --- 瞄准镜 --- */
    if (scopeW > 0) {
      if (scopeT === 0) {
        B(bodyX + 6, bodyY - 4, 5, 3);
      } else if (scopeT === 1) {
        B(bodyX + 3, bodyY - 7, 12, 4);
        B(bodyX + 5, bodyY - 3, 2, 4);
        B(bodyX + 12, bodyY - 3, 2, 4);
      } else {
        B(bodyX + 2, bodyY - 9, scopeW, 6);
        B(bodyX + 4, bodyY - 3, 2, 4);
        B(bodyX + 14, bodyY - 3, 2, 4);
        /* 大倍镜分划 */
        ctx.beginPath();
        ctx.moveTo(bodyX + 10, bodyY - 7);
        ctx.lineTo(bodyX + 10, bodyY - 5);
        ctx.stroke();
      }
    }

    /* --- 特殊武器装饰 --- */
    if (style === 'special') {
      /* 能量核心 */
      C(bodyX + bodyW * 0.5, bodyY + bodyH * 0.5, 3.5);
      /* 能量管 */
      if (v % 2 === 0) {
        ctx.beginPath(); ctx.rect(bodyX + 4, bodyY - 3, bodyW - 8, 2); ctx.fill(); ctx.stroke();
      }
    }

    /* --- 霰弹枪双管 --- */
    if (style === 'shotgun') {
      ctx.beginPath();
      ctx.rect(bodyX + bodyW, barrelY + barrelH + 1, bLen - 2, 3);
      ctx.fill(); ctx.stroke();
      /* 泵动护木 */
      ctx.beginPath(); ctx.rect(bodyX + bodyW + 2, barrelY + barrelH + 2, 10, 5); ctx.fill(); ctx.stroke();
    }
  }

  function drawWeapon() {
    if (player.dead) return;
    const w = weapon();
    if (w.melee) { drawFist(); return; }
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(aimAngle);
    drawGunShape(w, gunRecoil, player.size);
    ctx.restore();
  }

  function drawSlashTrails() {
    for (let i = 0; i < slashTrails.length; i++) {
      const t = slashTrails[i];
      const a = Math.max(0, t.life);
      const half = t.arcSize * 0.5;
      ctx.save();
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = t.w * a;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.size * 0.5 + t.reach * (1.05 - a * 0.35), t.angle - half, t.angle + half);
      ctx.stroke();
      ctx.globalAlpha = a * 0.22;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = t.w * a * 0.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.size * 0.5 + t.reach * (1.05 - a * 0.35), t.angle - half * 0.75, t.angle + half * 0.75);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawMuzzleFlash() {
    if (!muzzleFlash) return;
    const mf = muzzleFlash;
    const r = mf.size * mf.life;
    ctx.save();
    ctx.globalAlpha = mf.life;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mf.x, mf.y, r * 0.55, 0, Math.PI * 2); ctx.stroke();
    ctx.translate(mf.x, mf.y); ctx.rotate(aimAngle);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 1.3, 0); ctx.stroke();
    ctx.restore();
  }
  function drawBullets() {
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.save();
      ctx.strokeStyle = b.hostile ? '#555' : '#000';
      ctx.lineWidth = b.width; ctx.lineCap = 'round';
      ctx.globalAlpha = Math.min(1, 0.35 + b.life * 0.65);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * b.len, b.y - b.vy * b.len);
      ctx.stroke();
      ctx.restore();
    }
  }
  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      const s = Math.max(0.5, p.size * p.life);
      if (p.stretch && p.stretch > 1) ctx.fillRect(-s * p.stretch / 2, -s / 2, s * p.stretch, s);
      else ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawCursor() {
    if (showTouchUI || aiming) return;
    ctx.save();
    ctx.translate(mouse.x, mouse.y);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.lineTo(-3, 0); ctx.moveTo(3, 0); ctx.lineTo(11, 0);
    ctx.moveTo(0, -11); ctx.lineTo(0, -3); ctx.moveTo(0, 3); ctx.lineTo(0, 11);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 1.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fill();
    ctx.restore();
  }
  function drawScopeOverlay() {
    if (!aiming) return;
    const scoped = isScopedWeapon();
    const cx = W / 2, cy = H / 2;
    const innerR = scoped ? Math.min(W, H) * 0.34 : Math.min(W, H) * 0.52;
    const outerR = Math.max(W, H) * 0.82;
    const g = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, scoped ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.28)');
    ctx.save();
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(0,0,0,0.72)'; ctx.lineWidth = 1.2;
    if (scoped) {
      ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, innerR, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.62)'; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(cx - innerR, cy); ctx.lineTo(cx - 14, cy);
      ctx.moveTo(cx + 14, cy); ctx.lineTo(cx + innerR, cy);
      ctx.moveTo(cx, cy - innerR); ctx.lineTo(cx, cy - 14);
      ctx.moveTo(cx, cy + 14); ctx.lineTo(cx, cy + innerR);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(cx - 1.2, cy - 1.2, 2.4, 2.4);
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 1; k <= 4; k++) { const off = k * 26; const ln = (k === 2 || k === 4) ? 9 : 5; ctx.moveTo(cx - ln, cy + off); ctx.lineTo(cx + ln, cy + off); }
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx - 13, cy); ctx.lineTo(cx - 3, cy);
      ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + 13, cy);
      ctx.moveTo(cx, cy - 13); ctx.lineTo(cx, cy - 3);
      ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + 13);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(cx - 1, cy - 1, 2, 2);
    }
    ctx.restore();
  }
  function drawHUD() {
    const bw = 168, bh = 11, bx = 18, by = H - 34;
    const ratio = Math.max(0, player.hp / player.maxHp);
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.86)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6;
    ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    if (ratio > 0) { ctx.fillStyle = '#000'; ctx.fillRect(bx + 2, by + 2, (bw - 4) * ratio, bh - 4); }
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('HP ' + Math.round(player.hp) + ' / ' + player.maxHp, bx, by - 4);
    ctx.textAlign = 'right';
    if (gameMode === 'ai') ctx.fillText('击倒 ' + enemyKills, bx + bw, by - 4);
    else if (gameMode === 'mp') ctx.fillText('联机 ' + (Object.keys(remotePlayers).length + 1) + ' 人', bx + bw, by - 4);
    ctx.restore();
    if (player.dead) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.font = '600 15px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('被击倒 · 正在重生…', W / 2, H / 2);
      ctx.restore();
    }
    if (aiming) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(isScopedWeapon() ? '瞄准镜 · 松开右键射击' : '瞄准中 · 松开右键射击', W / 2, 30);
      ctx.restore();
    }
  }
  function drawTouchControls() {
    if (!showTouchUI || !gameRunning) return;
    const jx = joy.active ? joy.baseX : joy.defaultX;
    const jy = joy.active ? joy.baseY : joy.defaultY;
    const R0 = joy.maxR;
    ctx.save();
    ctx.globalAlpha = joy.active ? 0.10 : 0.055;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(jx, jy, R0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = joy.active ? 0.45 : 0.18;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(jx, jy, R0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = joy.active ? 0.30 : 0.12;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(jx - R0 * 0.55, jy); ctx.lineTo(jx + R0 * 0.55, jy);
    ctx.moveTo(jx, jy - R0 * 0.55); ctx.lineTo(jx, jy + R0 * 0.55);
    ctx.stroke();
    let kx = jx, ky = jy;
    if (joy.active) {
      let dx = joy.x - joy.baseX, dy = joy.y - joy.baseY;
      const d = Math.hypot(dx, dy);
      if (d > R0) { dx = dx / d * R0; dy = dy / d * R0; }
      kx = jx + dx; ky = jy + dy;
    }
    const sprinting = joy.active && joy.mag > 0.90;
    ctx.globalAlpha = joy.active ? (sprinting ? 0.92 : 0.62) : 0.24;
    ctx.fillStyle = sprinting ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(kx, ky, 25, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = joy.active ? 0.9 : 0.3;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 25, 0, Math.PI * 2); ctx.stroke();
    if (sprinting) {
      ctx.globalAlpha = 0.85; ctx.fillStyle = '#000';
      ctx.font = '600 11px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('疾跑', jx, jy - R0 - 15);
    }
    if (!joy.active) {
      ctx.globalAlpha = 0.22; ctx.fillStyle = '#000';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('移动', jx, jy + R0 + 16);
    }
    ctx.restore();

    const fx = fireBtn.x, fy = fireBtn.y, fr = fireBtn.r;
    ctx.save();
    ctx.globalAlpha = fireBtn.pressed ? 0.92 : 0.55;
    ctx.fillStyle = fireBtn.pressed ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = fireBtn.pressed ? 0.95 : 0.65;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = fireBtn.pressed ? 0.35 : 0.22;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(fx, fy, fr - 8, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    const isMelee = weapon().melee;
    if (isMelee) {
      ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.fillRect(fx - 9, fy - 9, 18, 18);
      ctx.strokeStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.lineWidth = 1.5; ctx.strokeRect(fx - 9, fy - 9, 18, 18);
      ctx.beginPath(); ctx.moveTo(fx - 6, fy); ctx.lineTo(fx + 6, fy); ctx.stroke();
    } else {
      ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
      ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(fx - 12, fy - 2, 24, 4);
    }
    ctx.globalAlpha = fireBtn.pressed ? 0.85 : 0.4;
    ctx.fillStyle = fireBtn.pressed ? '#ffffff' : '#000';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('开火', fx, fy + fr + 14);
    ctx.restore();

    const ax = aimBtn.x, ay = aimBtn.y, ar = aimBtn.r;
    ctx.save();
    ctx.globalAlpha = aimBtn.pressed ? 0.9 : 0.45;
    ctx.fillStyle = aimBtn.pressed ? '#000' : '#ffffff';
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = aimBtn.pressed ? 0.95 : 0.55;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = aimBtn.pressed ? 0.9 : 0.55;
    ctx.strokeStyle = aimBtn.pressed ? '#ffffff' : '#000'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ax - 12, ay); ctx.lineTo(ax - 4, ay);
    ctx.moveTo(ax + 4, ay); ctx.lineTo(ax + 12, ay);
    ctx.moveTo(ax, ay - 12); ctx.lineTo(ax, ay - 4);
    ctx.moveTo(ax, ay + 4); ctx.lineTo(ax, ay + 12);
    ctx.stroke();
    ctx.globalAlpha = aimBtn.pressed ? 0.85 : 0.4;
    ctx.fillStyle = aimBtn.pressed ? '#ffffff' : '#000';
    ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('瞄准', ax, ay + ar + 12);
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    if (!gameRunning) return;
    const sx = (Math.random() - 0.5) * 2 * shake;
    const sy = (Math.random() - 0.5) * 2 * shake;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(zoom, zoom);
    ctx.translate(-cam.x, -cam.y);
    drawGrid();
    drawWorldBorder();
    drawObstacles();
    drawBulletMarks();
    drawAimLine();
    drawAimPreview();
    drawShells();
    drawSlashTrails();
    drawRings();
    drawSprintAura();
    if (gameMode === 'ai') drawEnemies();
    if (gameMode === 'mp') drawRemotePlayers();
    drawPlayer();
    drawWeapon();
    drawMuzzleFlash();
    drawBullets();
    drawParticles();
    ctx.restore();
    drawScopeOverlay();
    drawCursor();
    drawHUD();
    drawTouchControls();
  }

  let lastTime = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 16.6667;
    lastTime = now;
    if (dt > 3) dt = 3;
    if (dt <= 0) dt = 1;
    update(dt, now);
    render();
  }
  requestAnimationFrame(loop);

  showStartScreen();
  if (!sb) console.warn('Supabase 未加载，联机模式不可用');
})();
</script>
</body>
</html>
