<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>方块战场</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#fff;overscroll-behavior:none}
  body{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    position:fixed;inset:0;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  canvas{display:block;width:100vw;height:100vh;touch-action:none;-webkit-tap-highlight-color:transparent}
  body.mouse-mode canvas{cursor:none}

  .overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(6px);
    padding:20px;
    transition:opacity .25s ease;
  }
  .overlay.hidden{display:none}
  .panel{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  .panel.wide{max-width:560px}

  .title{font-size:26px;font-weight:800;color:#000;letter-spacing:.14em;text-align:center}
  .sub{font-size:10px;color:rgba(0,0,0,.35);letter-spacing:.5em;text-align:center;margin-top:-6px;margin-bottom:8px;text-transform:uppercase}

  .mode-btn{
    display:flex;flex-direction:column;gap:4px;
    padding:18px 20px;border:2px solid #000;border-radius:12px;
    background:#fff;cursor:pointer;text-align:left;
    transition:background .18s ease, box-shadow .18s ease;
    -webkit-tap-highlight-color:transparent;
    font-family:inherit;
  }
  .mode-btn:hover{background:#000;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.18)}
  .mode-btn:hover .mode-title{color:#fff}
  .mode-btn:hover .mode-desc{color:rgba(255,255,255,.65)}
  .mode-title{font-size:16px;font-weight:800;color:#000;letter-spacing:.12em}
  .mode-desc{font-size:11px;color:rgba(0,0,0,.45);letter-spacing:.06em;line-height:1.5}

  .room-toolbar{display:flex;gap:8px;margin-bottom:4px}
  .room-filter{
    flex:1;padding:12px 15px;
    border:2px solid #000;border-radius:11px;
    background:#fff;font-family:inherit;font-size:13px;
    color:#000;outline:none;
  }
  .room-filter::placeholder{color:rgba(0,0,0,.28)}
  .icon-btn{
    width:44px;height:44px;flex-shrink:0;
    border:2px solid #000;border-radius:11px;
    background:#fff;color:#000;font-size:18px;line-height:1;
    cursor:pointer;transition:background .15s, color .15s;-webkit-tap-highlight-color:transparent;
  }
  .icon-btn:hover{background:#000;color:#fff}

  .room-list{
    display:flex;flex-direction:column;gap:8px;
    max-height:340px;overflow-y:auto;
    padding:10px;border:1.5px solid rgba(0,0,0,.12);
    border-radius:12px;background:rgba(0,0,0,.02);
  }
  .room-list::-webkit-scrollbar{width:5px}
  .room-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:3px}

  .room-card{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;border:1.6px solid rgba(0,0,0,.14);
    border-radius:10px;background:#fff;
    transition:border-color .14s, box-shadow .14s;cursor:pointer;
  }
  .room-card:hover{border-color:#000;box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .room-card.locked{opacity:.75}
  .room-card-main{flex:1;min-width:0}
  .room-card-name{
    font-size:14px;font-weight:700;color:#000;letter-spacing:.04em;
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .room-card-lock{font-size:11px;color:rgba(0,0,0,.5)}
  .room-card-meta{display:flex;gap:10px;font-size:10px;color:rgba(0,0,0,.42);letter-spacing:.08em;margin-top:3px}
  .room-card-count{
    font-size:13px;font-weight:700;color:#000;
    font-variant-numeric:tabular-nums;letter-spacing:.05em;white-space:nowrap;
  }
  .room-card-count .full{color:rgba(0,0,0,.28)}
  .room-card-status{width:8px;height:8px;border-radius:50%;background:#000;flex-shrink:0}
  .room-card-status.waiting{background:#000;animation:pulse 1.2s infinite}
  .room-card-status.playing{background:rgba(0,0,0,.35)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.18}}

  .room-empty{text-align:center;padding:36px 20px;font-size:12px;color:rgba(0,0,0,.35);letter-spacing:.14em}

  .create-panel{
    padding:16px;border:2px solid #000;border-radius:12px;background:#fff;
    display:flex;flex-direction:column;gap:12px;
  }
  .create-panel.hidden{display:none}
  .create-title{font-size:14px;font-weight:800;letter-spacing:.16em;text-align:center;margin-bottom:2px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field-label{font-size:10px;letter-spacing:.22em;color:rgba(0,0,0,.5);padding-left:2px}
  .field-input{
    padding:11px 14px;border:1.6px solid rgba(0,0,0,.35);
    border-radius:10px;background:#fff;font-family:inherit;
    font-size:13px;color:#000;outline:none;transition:border-color .15s;
  }
  .field-input:focus{border-color:#000}
  select.field-input{cursor:pointer}
  .create-actions{display:flex;gap:9px;margin-top:4px}

  .btn-ghost,.btn-primary{
    flex:1;padding:12px;border-radius:10px;
    font-family:inherit;font-size:13px;font-weight:700;
    letter-spacing:.14em;cursor:pointer;transition:background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-ghost{border:1.6px solid rgba(0,0,0,.2);background:#fff;color:rgba(0,0,0,.6)}
  .btn-ghost:hover{border-color:#000;color:#000}
  .btn-primary{border:2px solid #000;background:#000;color:#fff}
  .btn-primary:hover{background:#333}
  .btn-primary.big{padding:14px;font-size:14px;letter-spacing:.2em}
  .btn-primary:disabled,.btn-ghost:disabled{opacity:.4;cursor:not-allowed}

  .room-code-box{border:2px solid #000;border-radius:14px;padding:20px;text-align:center;background:#fff}
  .room-code-label{font-size:10px;color:rgba(0,0,0,.4);letter-spacing:.3em;margin-bottom:8px}
  .room-code{
    font-size:38px;font-weight:800;letter-spacing:.18em;color:#000;
    font-variant-numeric:tabular-nums;
    font-family:'SF Mono',Menlo,Consolas,monospace;line-height:1.1;
  }
  .room-code-tip{font-size:10px;color:rgba(0,0,0,.36);letter-spacing:.16em;margin-top:8px}

  .players-area{border:2px solid rgba(0,0,0,.14);border-radius:12px;padding:14px 16px;background:#fff}
  .players-title{font-size:11px;color:rgba(0,0,0,.5);letter-spacing:.2em;margin-bottom:10px}
  .players-count{float:right;font-variant-numeric:tabular-nums;color:rgba(0,0,0,.65);font-weight:700}
  #playersList{display:flex;flex-direction:column;gap:7px}
  .player-item{display:flex;align-items:center;gap:9px;font-size:13px;color:#000;letter-spacing:.05em}
  .player-dot{width:10px;height:10px;background:#000;flex-shrink:0}
  .player-dot.remote{background:#fff;border:2px solid #000}
  .player-tag{font-size:9px;color:rgba(0,0,0,.4);letter-spacing:.14em;margin-left:auto}

  .lobby-status{text-align:center;font-size:12px;color:rgba(0,0,0,.5);letter-spacing:.14em;padding:6px 0;min-height:22px}
  .lobby-status.ready{color:#000;font-weight:700}

  .cancel-btn{
    padding:12px;border:1.5px solid rgba(0,0,0,.2);border-radius:10px;
    background:#fff;color:rgba(0,0,0,.55);
    font-family:inherit;font-size:12px;letter-spacing:.2em;cursor:pointer;
    transition:border-color .16s, color .16s;-webkit-tap-highlight-color:transparent;
  }
  .cancel-btn:hover{border-color:#000;color:#000}

  .room-error{
    padding:11px 14px;border:1.5px solid rgba(0,0,0,.3);
    border-radius:10px;background:rgba(0,0,0,.04);
    font-size:11px;color:rgba(0,0,0,.7);letter-spacing:.06em;
    line-height:1.5;text-align:center;
  }
  .room-error.hidden{display:none}

  .countdown{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.94);
    font-size:80px;font-weight:800;color:#000;letter-spacing:.06em;
    pointer-events:none;
  }
  .countdown.hidden{display:none}

  .hint{
    position:fixed;left:50%;top:12px;transform:translateX(-50%);
    font-size:11px;line-height:1.6;letter-spacing:.14em;
    color:rgba(0,0,0,.26);pointer-events:none;
    user-select:none;white-space:nowrap;z-index:5;
    max-width:92vw;overflow:hidden;text-overflow:ellipsis;text-align:center;
  }
  .hint.hidden{display:none}

  .sound-btn{
    position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));
    width:40px;height:40px;
    border:1px solid rgba(0,0,0,.16);border-radius:10px;
    background:rgba(255,255,255,.88);color:rgba(0,0,0,.55);
    font-size:15px;line-height:1;cursor:pointer;z-index:6;
    transition:background .18s, color .18s, border-color .18s;-webkit-tap-highlight-color:transparent;
  }
  .sound-btn:hover{background:#000;color:#fff;border-color:#000}

  .weapon-hud{
    position:fixed;right:14px;
    top:calc(60px + env(safe-area-inset-top,0px));
    padding:8px 13px;border:1px solid rgba(0,0,0,.16);
    border-radius:10px;background:rgba(255,255,255,.9);
    text-align:right;cursor:pointer;z-index:5;
    user-select:none;-webkit-tap-highlight-color:transparent;
    transition:background .16s, border-color .16s;min-width:104px;
  }
  .weapon-hud:hover{background:#000;border-color:#000}
  .weapon-hud:hover .wname{color:#fff}
  .weapon-hud:hover .widx{color:rgba(255,255,255,.55)}
  .wname{font-size:13px;font-weight:600;color:#000;letter-spacing:.06em;line-height:1.25}
  .widx{font-size:11px;line-height:1.4;color:rgba(0,0,0,.4);letter-spacing:.1em}
  .weapon-hud.hidden,.sound-btn.hidden{display:none}

  .menu-btn{
    position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));
    padding:9px 14px;border:1px solid rgba(0,0,0,.16);
    border-radius:10px;background:rgba(255,255,255,.88);
    color:rgba(0,0,0,.55);font-family:inherit;font-size:11px;
    letter-spacing:.16em;cursor:pointer;z-index:6;
    transition:background .18s, color .18s, border-color .18s;-webkit-tap-highlight-color:transparent;
  }
  .menu-btn:hover{background:#000;color:#fff;border-color:#000}
  .menu-btn.hidden{display:none}

  .net-status{
    position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));
    padding:6px 11px;border-radius:8px;background:rgba(0,0,0,.75);
    color:#fff;font-size:10px;letter-spacing:.14em;
    z-index:6;pointer-events:none;transition:opacity .3s;
  }
  .net-status.hidden{display:none}
</style>
</head>
<body class="mouse-mode">
<canvas id="cv"></canvas>

<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="title">方块战场</div>
    <div class="sub">Square Arena</div>
    <button class="mode-btn" id="btnModeAI">
      <span class="mode-title">人机模式</span>
      <span class="mode-desc">与 AI 对手作战 · 8 名敌人巡逻追击</span>
    </button>
    <button class="mode-btn" id="btnModeMP">
      <span class="mode-title">真人模式</span>
      <span class="mode-desc">房间列表 · 创建或加入在线对局</span>
    </button>
  </div>
</div>

<div id="roomScreen" class="overlay hidden">
  <div class="panel wide">
    <div class="title" id="roomTitle">房间列表</div>
    <div class="sub">Room List</div>

    <div class="room-toolbar" id="roomToolbar">
      <input id="inputRoomFilter" class="room-filter" placeholder="筛选房间名 / 房主…" autocomplete="off">
      <button class="icon-btn" id="btnRefreshRooms" title="刷新">↻</button>
      <button class="icon-btn" id="btnCreateRoom" title="创建房间">+</button>
    </div>

    <div id="roomList" class="room-list">
      <div class="room-empty">正在加载房间…</div>
    </div>

    <div id="createPanel" class="create-panel hidden">
      <div class="create-title">创建房间</div>
      <label class="field">
        <span class="field-label">房间名</span>
        <input id="inputRoomName" class="field-input" maxlength="24" placeholder="例如：来打我啊" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">最大人数</span>
        <select id="inputRoomMax" class="field-input">
          <option value="2">2 人</option>
          <option value="4">4 人</option>
          <option value="6">6 人</option>
          <option value="8">8 人</option>
        </select>
      </label>
      <label class="field">
        <span class="field-label">密码（可选）</span>
        <input id="inputRoomPwd" class="field-input" maxlength="8" placeholder="留空则公开" autocomplete="off">
      </label>
      <div class="create-actions">
        <button class="btn-ghost" id="btnCancelCreate">取消</button>
        <button class="btn-primary" id="btnConfirmCreate">创建</button>
      </div>
    </div>

    <div id="roomLobby" class="hidden">
      <div class="room-code-box">
        <div class="room-code-label">房间码</div>
        <div class="room-code" id="roomCodeText">------</div>
        <div class="room-code-tip">分享给好友加入</div>
      </div>
      <div class="players-area" style="margin-top:12px">
        <div class="players-title">
          <span>玩家</span>
          <span class="players-count" id="playerCount">1 / 2</span>
        </div>
        <div id="playersList"></div>
      </div>
      <div id="lobbyStatus" class="lobby-status">等待玩家加入…</div>
      <button class="btn-primary big" id="btnForceStart" style="display:none;margin-top:10px">开始游戏（房主）</button>
    </div>

    <div id="roomError" class="room-error hidden"></div>
    <button class="cancel-btn" id="btnBackFromRoom">返回主菜单</button>
  </div>
</div>

<div id="countdown" class="countdown hidden">3</div>

<div class="hint hidden" id="hint">WASD 移动 · Shift 疾跑 · 左键攻击 · 右键瞄准松开射击 · 滚轮换枪</div>
<button class="menu-btn hidden" id="btnExitGame">← 退出</button>
<div class="weapon-hud hidden" id="weaponHud">
  <div class="wname" id="wname">拳头</div>
  <div class="widx" id="widx">1 / 38</div>
</div>
<button class="sound-btn hidden" id="soundBtn" title="音效开关">🔊</button>
<div class="net-status hidden" id="netStatus">连接中…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

  function clampCam(v, worldSize, viewSize) {
    if (worldSize <= viewSize) return (worldSize - viewSize) / 2;
    return Math.min(Math.max(v, 0), worldSize - viewSize);
  }
  function pointInObstacle(x, y) {
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      if (x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h) return o;
    }
    return null;
  }
  function hasLineOfSight(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy);
    if (dist < 1) return true;
    const steps = Math.ceil(dist / 14);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (pointInObstacle(x1 + dx * t, y1 + dy * t)) return false;
    }
    return true;
  }
  function raycastHit(x, y, angle, maxDist) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const step = 7;
    const steps = Math.ceil(maxDist / step);
    for (let i = 1; i <= steps; i++) {
      const d = i * step;
      const px = x + cos * d, py = y + sin * d;
      if (px < 0 || px > WORLD_W || py < 0 || py > WORLD_H) return { x: px, y: py, dist: d, hit: true };
      if (pointInObstacle(px, py)) return { x: px, y: py, dist: d, hit: true };
    }
    return { x: x + cos * maxDist, y: y + sin * maxDist, dist: maxDist, hit: false };
  }

  let audioCtx = null;
  function ensureCtx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;

  function noiseBuffer(c, dur, power) {
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, power);
    return buf;
  }
  function playMeleeSound(w) {

    const t = c.currentTime;
    const baseFreq = { fist: 520, dagger: 900, nunchaku: 1100, chainsaw: 180, katana: 700, hammer: 260 }[w.id] || 500;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = w.id === 'chainsaw' ? 'sawtooth' : 'triangle';
    osc.frequency.setValueAtTime(baseFreq, t);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.25, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(w.id === 'chainsaw' ? 0.06 : 0.10, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    osc.connect(g).connect(c.destination);
    osc.start(t); osc.stop(t + 0.18);
  }

  function spawnShell() {
    if (shells.length >= MAX_SHELLS) shells.shift();
    const sideA = aimAngle + Math.PI / 2;
    const sideSp = 1.6 + Math.random() * 2.0;
    const fwdSp = 0.4 + Math.random() * 1.0;
    const jitter = (Math.random() - 0.5) * 0.8;
    const ox = player.x + Math.cos(aimAngle) * (player.size * 0.5 + 3) + Math.cos(sideA) * 4;
    const oy = player.y + Math.sin(aimAngle) * (player.size * 0.5 + 3) + Math.sin(sideA) * 4;
    shells.push({
      x: ox, y: oy,
      vx: Math.cos(sideA + jitter) * sideSp + Math.cos(aimAngle) * fwdSp,
      vy: Math.sin(sideA + jitter) * sideSp + Math.sin(aimAngle) * fwdSp,
      rot: Math.random() * Math.PI * 2,

  function updateShells(dt) {
    for (let i = shells.length - 1; i >= 0; i--) {
      const s = shells[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (pointInObstacle(s.x, s.y)) { s.x -= s.vx * dt; s.y -= s.vy * dt; s.vx *= -0.25; s.vy *= -0.25; }
      const f = Math.pow(0.82, dt);
      s.vx *= f; s.vy *= f;
      s.rot += s.vr * dt; s.vr *= Math.pow(0.90, dt);
      if (Math.abs(s.vx) < 0.06 && Math.abs(s.vy) < 0.06) { s.vx = 0; s.vy = 0; s.vr = 0; }
      s.life -= s.decay * dt;
      if (s.life <= 0) shells.splice(i, 1);
    }
  }

  /* 残影 */
  function pushSlashTrail(w) {
    const reach = (w.range || 40) * 0.95;
    const arcSize = { fist: 0.9, dagger: 0.7, nunchaku: 1.2, chainsaw: 0.5, katana: 1.6, hammer: 1.3 }[w.id] || 1.0;
    slashTrails.push({
      x: player.x, y: player.y,
      angle: aimAngle, reach: reach, arcSize: arcSize,
      life: 1, decay: w.id === 'hammer' ? 0.06 : 0.09,
      w: w.id === 'hammer' ? 14 : (w.id === 'katana' ? 9 : 7)
    });
    if (slashTrails.length > 20) slashTrails.shift();
  }
  function updateSlashTrails(dt) {
    for (let i = slashTrails.length - 1; i >= 0; i--) {
      const t = slashTrails[i];
      t.life -= t.decay * dt;
      if (t.life <= 0) slashTrails.splice(i, 1);
    }
  }

  /* ============================================================
     玩家动作
  ============================================================ */
  function punch() {
    const w = weapon();
    if (!w || !w.melee) return;
    const now = performance.now();
    const dur = w.dur || PUNCH_DUR;
    const cd = w.cd || 0.38;
    if (now - punchStart < dur * cd) return;
    punchStart = now;
    hitFired = false;

    const pushBase = { fist: 2.4, dagger: 1.6, nunchaku: 1.2, chainsaw: 0.5, katana: 3.8, hammer: 6.2 }[w.id] || 2.4;
    const shakeBase = { fist: 2.8, dagger: 2.2, nunchaku: 1.8, chainsaw: 1.4, katana: 4.2, hammer: 6.5 }[w.id] || 2.8;

    shake = Math.max(shake, shakeBase);
    player.vx -= Math.cos(aimAngle) * pushBase;
    player.vy -= Math.sin(aimAngle) * pushBase;

    pushSlashTrail(w);
    playMeleeSound(w);
  }

  function shootOne() {
    const w = weapon();
    if (!w || w.melee) return;
    const pellets = w.pellets || 1;
    for (let p = 0; p < pellets; p++) {
      const a = aimAngle + (Math.random() - 0.5) * 2 * w.spread;
      let muzzleDist = player.size / 2 + 12;
      if (w.style === 'sniper') muzzleDist = player.size / 2 + 30;
      else if (w.style === 'heavy') muzzleDist = player.size / 2 + 24;
      else if (w.style === 'rifle') muzzleDist = player.size / 2 + 20;
      else if (w.style === 'shotgun') muzzleDist = player.size / 2 + 26;
      const mx = player.x + Math.cos(a) * muzzleDist;
      const my = player.y + Math.sin(a) * muzzleDist;
      bullets.push({
        x: mx, y: my,
        vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
        life: 1, decay: w.decay,
        width: w.width, len: w.len,
        pierce: w.pierce || 0,
        hostile: false, damage: w.dmg || 20
      });
    }
    let flashDist = player.size / 2 + 22;
    if (w.style === 'sniper') flashDist = player.size / 2 + 42;
    else if (w.style === 'heavy') flashDist = player.size / 2 + 34;
    muzzleFlash = { x: player.x + Math.cos(aimAngle) * flashDist, y: player.y + Math.sin(aimAngle) * flashDist, life: 1, size: w.style === 'sniper' ? 22 : (w.style === 'heavy' ? 20 : 15) };
    gunRecoil = Math.min(16, (w.push || 1) * 4.2);
    shake = Math.max(shake, w.shakeAmt);
    const pushBack = Math.min(6.5, w.push || 1);
    player.vx -= Math.cos(aimAngle) * pushBack;
    player.vy -= Math.sin(aimAngle) * pushBack;
    spawnShell();
    playGunSound(w);
    if (gameMode === 'mp' && channel) {
      channel.send({ type: 'broadcast', event: 'shoot', payload: { id: myId, x: player.x, y: player.y, angle: aimAngle, weapon: weaponIndex, count: pellets } });
    }
  }
  function fireGun() {
    const w = weapon();
    if (!w || w.melee) return;
    const now = performance.now();
    if (w.burst) {
      if (burstLeft > 0) return;
      if (now - lastShot < w.interval) return;
      lastShot = now;
      shootOne();
      burstLeft = w.burst - 1;
      burstNext = now + (w.burstDelay || 60);
      return;
    }
    if (now - lastShot < w.interval) return;
    lastShot = now;
    shootOne();
  }

  function damagePlayer(amount) {
    if (player.dead || player.invuln > 0) return;
    player.hp -= amount;
    player.invuln = 26;
    shake = Math.max(shake, 7);
    playHurtSound();
    spawnHitBurst(player.x, player.y, Math.random() * Math.PI * 2, 12, true);
    if (player.hp <= 0) {
      player.hp = 0; player.dead = true;
      player.respawnTimer = 90;
      spawnHitBurst(player.x, player.y, Math.random() * Math.PI * 2, 30, true);
      shake = Math.max(shake, 16);
    }
  }
  function respawnPlayer() {
    if (gameMode === 'mp') {
      player.x = isHost ? WORLD_W / 2 - 120 : WORLD_W / 2 + 120;
      player.y = WORLD_H / 2;
    } else {
      player.x = WORLD_W / 2; player.y = WORLD_H / 2;
    }
    player.vx = 0; player.vy = 0;
    player.hp = player.maxHp;
    player.dead = false;
    player.invuln = 120;
  }
  function damageEnemy(e, amount, hitX, hitY, isMelee, meleeW) {
    e.hp -= amount;
    e.hitFlash = 1;
    if (isMelee && meleeW) spawnMeleeHit(hitX, hitY, aimAngle, meleeW);
    else spawnHitBurst(hitX, hitY, Math.random() * Math.PI * 2, 9, false);
    if (e.hp <= 0) {
      e.alive = false;
      e.respawnTimer = ENEMY_RESPAWN_TIME / 16.67;
      enemyKills++;
      spawnHitBurst(e.x, e.y, Math.random() * Math.PI * 2, 22, true);
      shake = Math.max(shake, 5);
      playHitSound();
    }
  }

  /* ============================================================
     人机 AI
  ============================================================ */
  function enemyShoot(e) {
    const a = e.angle + (Math.random() - 0.5) * 0.14;
    const mx = e.x + Math.cos(e.angle) * (e.size * 0.5 + 12);
    const my = e.y + Math.sin(e.angle) * (e.size * 0.5 + 12);
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * 15, vy: Math.sin(a) * 15, life: 1, decay: 0.0048, width: 2.2, len: 0.9, pierce: 0, hostile: true, damage: 9 });
    rings.push({ x: mx, y: my, radius: 0, maxR: 16, life: 1, lineW: 1.2 });
  }
  function findEnemySpawn() {
    let best = null, bestD = -1;
    for (let i = 0; i < ENEMY_SPAWNS.length; i++) {
      const s = ENEMY_SPAWNS[i];
      const d = Math.hypot(s.x - player.x, s.y - player.y);
      if (d > bestD) { bestD = d; best = s; }
    }
    return best || ENEMY_SPAWNS[0];
  }
  function updateEnemy(e, dt) {
    if (!e.alive) {
      e.respawnTimer -= dt;
      if (e.respawnTimer <= 0 && enemies.length <= ENEMY_MAX) {
        const far = ENEMY_SPAWNS.filter(s => Math.hypot(s.x - player.x, s.y - player.y) > 600);
        const pick = far.length ? far[(Math.random() * far.length) | 0] : findEnemySpawn();
        e.x = pick.x; e.y = pick.y;
        e.vx = 0; e.vy = 0;
        e.hp = e.maxHp;
        e.alive = true; e.state = 'patrol';
        e.patrolTargetX = pick.x; e.patrolTargetY = pick.y;
        e.patrolTimer = 0; e.loseTimer = 0; e.hitFlash = 0;
        e.shootCooldown = 600 + Math.random() * 800;
      }
      return;
    }
    e.hitFlash *= Math.pow(0.88, dt);
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const canSee = !player.dead && dist < e.detectRange && hasLineOfSight(e.x, e.y, player.x, player.y);
    if (canSee) {
      e.lastSeenX = player.x; e.lastSeenY = player.y;
      e.loseTimer = 90; e.state = 'chase';
    } else {
      e.loseTimer -= dt;
      if (e.loseTimer <= 0 && e.state !== 'patrol') { e.state = 'patrol'; e.patrolTimer = 0; }
      else if (e.loseTimer > 0) e.state = 'search';
    }
    let moveX = 0, moveY = 0, speed = 0;
    if (e.state === 'chase') {
      const targetA = Math.atan2(dy, dx);
      let adiff = targetA - e.angle;
      adiff = Math.atan2(Math.sin(adiff), Math.cos(adiff));
      e.angle += adiff * Math.min(1, 0.16 * dt);
      if (dist > e.preferredDist * 1.15) { moveX = Math.cos(e.angle); moveY = Math.sin(e.angle); speed = e.speed; }
      else if (dist < e.preferredDist * 0.62) { moveX = -Math.cos(e.angle); moveY = -Math.sin(e.angle); speed = e.speed * 0.75; }
      else { const side = Math.sin((performance.now() / 900) + (e.x + e.y) * 0.01); moveX = -Math.sin(e.angle) * side; moveY = Math.cos(e.angle) * side; speed = e.speed * 0.5; }
      e.shootCooldown -= dt * 16.67;
      if (e.shootCooldown <= 0 && dist < e.attackRange && canSee) { enemyShoot(e); e.shootCooldown = 620 + Math.random() * 620; }
    } else if (e.state === 'search') {
      const tdx = e.lastSeenX - e.x, tdy = e.lastSeenY - e.y;
      const td = Math.hypot(tdx, tdy);
      if (td > 30) { e.angle = Math.atan2(tdy, tdx); moveX = tdx / td; moveY = tdy / td; speed = e.speed * 0.85; }
      e.shootCooldown -= dt * 16.67;
    } else {
      e.patrolTimer -= dt;
      const pdx = e.patrolTargetX - e.x, pdy = e.patrolTargetY - e.y;
      const pd = Math.hypot(pdx, pdy);
      if (pd < 26 || e.patrolTimer <= 0) {
        const ang = Math.random() * Math.PI * 2;
        const r = 180 + Math.random() * 340;
        let nx = e.x + Math.cos(ang) * r, ny = e.y + Math.sin(ang) * r;
        nx = Math.min(Math.max(nx, 60), WORLD_W - 60);
        ny = Math.min(Math.max(ny, 60), WORLD_H - 60);
        e.patrolTargetX = nx; e.patrolTargetY = ny;
        e.patrolTimer = 220 + Math.random() * 220;
      } else {
        const targetA = Math.atan2(pdy, pdx);
        let adiff = targetA - e.angle;
        adiff = Math.atan2(Math.sin(adiff), Math.cos(adiff));
        e.angle += adiff * Math.min(1, 0.07 * dt);
        moveX = pdx / pd; moveY = pdy / pd; speed = e.patrolSpeed;
      }
      e.shootCooldown -= dt * 16.67;
    }
    if (speed > 0) { e.vx += moveX * speed * 0.28 * dt; e.vy += moveY * speed * 0.28 * dt; }
    const fr = Math.pow(0.86, dt);
    e.vx *= fr; e.vy *= fr;
    const maxE = e.state === 'patrol' ? 2.0 : 3.6;
    const sp = Math.hypot(e.vx, e.vy);
    if (sp > maxE) { e.vx *= maxE / sp; e.vy *= maxE / sp; }
    e.x += e.vx * dt; e.y += e.vy * dt;
    const m = e.size / 2 + 2;
    if (e.x < m) { e.x = m; e.vx = Math.abs(e.vx) * 0.3; }
    if (e.x > WORLD_W - m) { e.x = WORLD_W - m; e.vx = -Math.abs(e.vx) * 0.3; }
    if (e.y < m) { e.y = m; e.vy = Math.abs(e.vy) * 0.3; }
    if (e.y > WORLD_H - m) { e.y = WORLD_H - m; e.vy = -Math.abs(e.vy) * 0.3; }
    const half = e.size / 2;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      const ox = Math.min(e.x + half, o.x + o.w) - Math.max(e.x - half, o.x);
      const oy = Math.min(e.y + half, o.y + o.h) - Math.max(e.y - half, o.y);
      if (ox > 0 && oy > 0) {
        if (ox < oy) { e.x += (e.x < o.x + o.w / 2) ? -ox : ox; e.vx *= -0.2; }
        else { e.y += (e.y < o.y + o.h / 2) ? -oy : oy; e.vy *= -0.2; }
      }
    }
    if (!player.dead) {
      const pdx = e.x - player.x, pdy = e.y - player.y;
      const pd = Math.hypot(pdx, pdy);
      const minD = (e.size + player.size) / 2;
      if (pd < minD && pd > 0.001) {
        const push = (minD - pd) * 0.5;
        e.x += (pdx / pd) * push; e.y += (pdy / pd) * push;
        player.x -= (pdx / pd) * push * 0.5;
        player.y -= (pdy / pd) * push * 0.5;
      }
    }
  }
  function updateEnemies(dt) {
    for (let i = 0; i < enemies.length; i++) updateEnemy(enemies[i], dt);
  }

  /* ============================================================
     房间列表
  ============================================================ */
  async function fetchRooms() {
    if (!sb) { roomListEl.innerHTML = '<div class="room-empty">云端不可用</div>'; return; }
    try {
      const { data, error } = await sb
        .from('brawl_rooms')
        .select('*')
        .in('status', ['waiting', 'playing'])
        .gt('expires_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(40);
      if (error) throw error;
      roomListData = data || [];
      renderRoomList();
    } catch (e) {
      console.warn('[房间列表] 拉取失败:', e);
      roomListEl.innerHTML = '<div class="room-empty">加载失败，请刷新</div>';
    }
  }
  function renderRoomList() {
    const filter = (inputRoomFilter.value || '').trim().toLowerCase();
    const filtered = roomListData.filter(r => {
      if (!filter) return true;
      return (r.name || '').toLowerCase().includes(filter) ||
             (r.host_name || '').toLowerCase().includes(filter) ||
             (r.code || '').toLowerCase().includes(filter);
    });
    if (filtered.length === 0) {
      roomListEl.innerHTML = filter ? '<div class="room-empty">没有匹配的房间</div>' : '<div class="room-empty">暂无房间 · 点击 + 创建</div>';
      return;
    }
    roomListEl.innerHTML = filtered.map(r => {
      const isFull = r.player_count >= r.max_players;
      const isLocked = !!r.password;
      const statusClass = r.status === 'playing' ? 'playing' : 'waiting';
      const lock = isLocked ? '<span class="room-card-lock">🔒</span>' : '';
      return `
        <div class="room-card ${statusClass}" data-code="${r.code}" data-locked="${isLocked ? '1' : '0'}" data-full="${isFull ? '1' : '0'}">
          <div class="room-card-status ${statusClass}"></div>
          <div class="room-card-main">
            <div class="room-card-name">${escapeHtml(r.name || '无名房间')}${lock}</div>
            <div class="room-card-meta">
              <span>房主 ${escapeHtml(r.host_name || '匿名')}</span>
              <span>${r.code}</span>
              <span>${r.status === 'playing' ? '游戏中' : '等待中'}</span>
            </div>
          </div>
          <div class="room-card-count ${isFull ? 'full' : ''}">${r.player_count}/${r.max_players}</div>
        </div>`;
    }).join('');
    roomListEl.querySelectorAll('.room-card').forEach(card => {
      card.addEventListener('click', () => {
        const code = card.dataset.code;
        const isLocked = card.dataset.locked === '1';
        const isFull = card.dataset.full === '1';
        if (isFull) { showRoomError('房间已满'); return; }
        if (isLocked) {
          const pwd = prompt('请输入房间密码：');
          if (pwd === null) return;
          joinRoomByCode(code, pwd);
        } else {
          joinRoomByCode(code, null);
        }
      });
    });
  }

  btnCreateRoom.addEventListener('click', () => {
    createPanel.classList.remove('hidden');
    inputRoomName.value = '房间 ' + Math.floor(Math.random() * 900 + 100);
    inputRoomPwd.value = '';
    inputRoomName.focus();
  });
  btnCancelCreate.addEventListener('click', () => createPanel.classList.add('hidden'));

  btnConfirmCreate.addEventListener('click', async () => {
    if (!sb) { showRoomError('云端不可用'); return; }
    const name = (inputRoomName.value || '').trim() || '无名房间';
    const maxP = parseInt(inputRoomMax.value, 10) || 2;
    const pwd = (inputRoomPwd.value || '').trim() || null;
    btnConfirmCreate.disabled = true;
    btnConfirmCreate.textContent = '创建中…';
    try {
      let code = null;
      for (let i = 0; i < 5; i++) {
        const c = randomRoomCode();
        const { data } = await sb.from('brawl_rooms').select('code').eq('code', c).maybeSingle();
        if (!data) { code = c; break; }
      }
      if (!code) throw new Error('房间码生成失败');
      const { error: e1 } = await sb.from('brawl_rooms').insert({
        code, name, host_id: myId, host_name: myName,
        max_players: maxP, player_count: 1,
        password: pwd, status: 'waiting'
      });
      if (e1) throw e1;
      const { error: e2 } = await sb.from('brawl_room_players').insert({
        room_code: code, user_id: myId, user_name: myName, is_host: true
      });
      if (e2) throw e2;
      const ok = await joinChannel(code);
      if (!ok) {
        await sb.from('brawl_rooms').delete().eq('code', code);
        throw new Error('实时连接失败');
      }
      isHost = true;
      roomCode = code;
      createPanel.classList.add('hidden');
      roomToolbar.style.display = 'none';
      roomListEl.style.display = 'none';
      roomLobby.classList.remove('hidden');
      roomTitle.textContent = '房间大厅';
      roomCodeEl.textContent = code;
      btnForceStart.style.display = 'block';
      updatePlayerListUI();
    } catch (err) {
      console.error('[创建房间]', err);
      showRoomError(err.message || '创建失败，请重试');
    } finally {
      btnConfirmCreate.disabled = false;
      btnConfirmCreate.textContent = '创建';
    }
  });

  async function joinRoomByCode(code, pwd) {
    if (!sb) { showRoomError('云端不可用'); return; }
    try {
      const { data: room, error } = await sb.from('brawl_rooms').select('*').eq('code', code).maybeSingle();
      if (error) throw error;
      if (!room) { showRoomError('房间不存在'); fetchRooms(); return; }
      if (room.status === 'closed') { showRoomError('房间已关闭'); fetchRooms(); return; }
      if (room.player_count >= room.max_players) { showRoomError('房间已满'); return; }
      if (room.password && room.password !== pwd) { showRoomError('密码错误'); return; }
      const { error: e2 } = await sb.from('brawl_room_players').upsert({
        room_code: code, user_id: myId, user_name: myName, is_host: false
      }, { onConflict: 'room_code,user_id' });
      if (e2) throw e2;
      const ok = await joinChannel(code);
      if (!ok) throw new Error('实时连接失败');
      isHost = false;
      roomCode = code;
      roomToolbar.style.display = 'none';
      roomListEl.style.display = 'none';
      roomLobby.classList.remove('hidden');
      roomTitle.textContent = '房间大厅';
      roomCodeEl.textContent = code;
      btnForceStart.style.display = 'none';
      updatePlayerListUI();
    } catch (err) {
      console.error('[加入房间]', err);
      showRoomError(err.message || '加入失败');
    }
  }

  btnForceStart.addEventListener('click', () => {
    if (!isHost) return;
    if (Object.keys(presenceSet).length < 2) { showRoomError('至少需要 2 名玩家'); return; }
    if (channel) channel.send({ type: 'broadcast', event: 'force_start', payload: {} });
    beginCountdown();
  });

  btnRefreshRooms.addEventListener('click', () => {
    roomListEl.innerHTML = '<div class="room-empty">刷新中…</div>';
    fetchRooms();
  });
  inputRoomFilter.addEventListener('input', renderRoomList);

  /* ============================================================
     联机频道
  ============================================================ */
  function updatePlayerListUI() {
    const ids = Object.keys(presenceSet);
    playerCount.textContent = ids.length + ' / ?';
    ids.sort((a, b) => {
      if (a === myId) return -1;
      if (b === myId) return 1;
      return (presenceSet[a].joinedAt || 0) - (presenceSet[b].joinedAt || 0);
    });
    playersList.innerHTML = '';
    ids.forEach((id, i) => {
      const div = document.createElement('div');
      div.className = 'player-item';
      const dot = document.createElement('div');
      dot.className = 'player-dot' + (id === myId ? '' : ' remote');
      const name = document.createElement('span');
      name.textContent = id === myId ? ('你 (' + myName + ')') : ('玩家 ' + (i + 1));
      const tag = document.createElement('span');
      tag.className = 'player-tag';
      tag.textContent = (i === 0 ? 'HOST' : 'REMOTE');
      div.appendChild(dot); div.appendChild(name); div.appendChild(tag);
      playersList.appendChild(div);
    });
    if (ids.length >= 2) {
      lobbyStatus.textContent = '玩家已到齐 · 房主可开始';
      lobbyStatus.classList.add('ready');
    } else {
      lobbyStatus.textContent = '等待玩家加入…';
      lobbyStatus.classList.remove('ready');
    }
  }

  async function joinChannel(code) {
    if (!sb) { showRoomError('云端未加载'); return false; }
    try {
      channel = sb.channel('brawl-' + code, {
        config: { broadcast: { self: false }, presence: { key: myId } }
      });
      channel.on('presence', { event: 'sync' }, () => {
        const st = channel.presenceState();
        const ids = Object.keys(st);
        for (const k in presenceSet) delete presenceSet[k];
        ids.forEach(id => {
          const arr = st[id];
          presenceSet[id] = { joinedAt: (arr?.[0]?.joinedAt) || Date.now() };
        });
        updatePlayerListUI();

        /* 修复：新玩家入房立刻广播一次完整状态 */
        if (gameRunning && gameMode === 'mp') {
          sendMyState(true);
        }
      });
      channel.on('presence', { event: 'leave' }, (payload) => {
        /* 只弹提示，不立刻删玩家（等超时自然清） */
        if (gameRunning && gameMode === 'mp') {
          setNetStatus('有玩家离开', true);
          setTimeout(() => setNetStatus('', false), 2500);
        }
        /* 如果离开的是远端玩家，标记一下 faded 让它自然淡出 */
        if (payload && payload.leftPresences) {
          payload.leftPresences.forEach(p => {
            if (p && p.id && remotePlayers[p.id]) {
              remotePlayers[p.id].fading = true;
              remotePlayers[p.id].fadeStart = performance.now();
            }
          });
        }
      });
      channel.on('broadcast', { event: 'state' }, msg => {
        const p = msg.payload;
        if (!p || p.id === myId) return;
        updateRemotePlayer(p);
      });
      channel.on('broadcast', { event: 'shoot' }, msg => {
        const p = msg.payload;
        if (!p || p.id === myId) return;
        spawnRemoteShot(p);
      });
      channel.on('broadcast', { event: 'hit' }, msg => {
        const p = msg.payload;
        if (!p || p.target !== myId) return;
        damagePlayer(p.damage || 10);
      });
      channel.on('broadcast', { event: 'force_start' }, () => {
        if (!mpStartHandled) { mpStartHandled = true; countdownEl.classList.add('hidden'); startMultiplayerGame(); }
      });
      const ok = await new Promise(resolve => {
        let settled = false;
        const done = v => { if (!settled) { settled = true; resolve(v); } };
        channel.subscribe(async status => {
          if (status === 'SUBSCRIBED') {
            try { await channel.track({ id: myId, joinedAt: Date.now() }); } catch (e) {}
            done(true);
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            done(false);
          }
        });
        setTimeout(() => done(false), 12000);
      });
      if (!ok) { showRoomError('实时连接失败'); try { sb.removeChannel(channel); } catch (e) {} channel = null; return false; }
      return true;
    } catch (err) {
      console.warn(err); showRoomError('连接出错'); return false;
    }
  }

  async function leaveChannel() {

        if (isHost) {

          await sb.from('brawl_room_players').delete().eq('room_code', roomCode);

  function updateRemotePlayer(p) {
    let rp = remotePlayers[p.id];
    if (!rp) {
      /* 新玩家：初始位置直接放到目标位置，避免从 0,0 飞过来 */
      rp = {
        id: p.id,
        x: p.x, y: p.y,
        prevX: p.x, prevY: p.y,
        tx: p.x, ty: p.y,
        angle: p.angle || 0, tangle: p.angle || 0,
        ext: 0, text: 0,
        hp: (typeof p.hp === 'number') ? p.hp : 100,
        maxHp: 100, size: 34,
        weapon: p.weapon || 1,
        dead: !!p.dead,
        lastSeen: performance.now(),
        lastUpdate: performance.now(),
        fading: false
      };
      remotePlayers[p.id] = rp;
    }
    /* 双缓冲：把当前值记为 prev，目标值设为新值 */
    rp.prevX = rp.x; rp.prevY = rp.y;
    rp.tx = p.x; rp.ty = p.y;
    rp.tangle = p.angle || 0;
    rp.text = p.ext || 0;
    rp.hp = (typeof p.hp === 'number') ? p.hp : rp.hp;
    rp.weapon = (typeof p.weapon === 'number') ? p.weapon : rp.weapon;
    rp.dead = !!p.dead;
    rp.lastSeen = performance.now();
    rp.lastUpdate = performance.now();
    rp.fading = false;
  }
  function spawnRemoteShot(p) {
    const w = WEAPONS[p.weapon] || WEAPONS[1];
    const count = p.count || 1;
    for (let i = 0; i < count; i++) {
      const a = p.angle + (Math.random() - 0.5) * 2 * (w.spread || 0.02);
      let muzzleDist = 24;
      if (w.style === 'sniper') muzzleDist = 42;
      else if (w.style === 'heavy') muzzleDist = 34;
      else if (w.style === 'shotgun') muzzleDist = 30;
      bullets.push({ x: p.x + Math.cos(a) * muzzleDist, y: p.y + Math.sin(a) * muzzleDist, vx: Math.cos(a) * (w.speed || 28), vy: Math.sin(a) * (w.speed || 28), life: 1, decay: w.decay || 0.006, width: w.width || 2.2, len: w.len || 1, pierce: 0, hostile: false, damage: 0, visual: true });
    }
    muzzleFlash = { x: p.x + Math.cos(p.angle) * 30, y: p.y + Math.sin(p.angle) * 30, life: 1, size: 16 };
  }
  function sendMyState(force) {
    if (!channel || gameMode !== 'mp') return;
    channel.send({ type: 'broadcast', event: 'state', payload: {
      id: myId,
      x: Math.round(player.x * 10) / 10,
      y: Math.round(player.y * 10) / 10,
      angle: Math.round(aimAngle * 1000) / 1000,
      hp: Math.round(player.hp),
      weapon: weaponIndex,
      ext: Math.round(state.ext * 100) / 100,
      dead: player.dead,
      force: !!force
    }});
  }
  function updateRemotePlayers(dt) {
    const now = performance.now();
    for (const id in remotePlayers) {
      const rp = remotePlayers[id];

      /* 断线余晖：fading 状态逐渐淡出，然后移除 */
      if (rp.fading) {
        const fadeAge = now - rp.fadeStart;
        if (fadeAge > REMOTE_FADE_MS) {
          delete remotePlayers[id];
          continue;
        }
        /* fading 期间冻结位置 */
        continue;
      }

      /* 超时保护：从 4s 提升到 15s */
      if (now - rp.lastSeen > REMOTE_TIMEOUT_MS) {
        delete remotePlayers[id];
        continue;
      }

      /* 若长时间没收到新状态（>500ms），标为断线淡出 */
      if (now - rp.lastUpdate > 3000 && !rp.fading) {
        rp.fading = true;
        rp.fadeStart = now;
        continue;
      }

      /* 双缓冲插值：向目标位置平滑移动 */
      const k = Math.min(1, 0.22 * dt);
      rp.x += (rp.tx - rp.x) * k;
      rp.y += (rp.ty - rp.y) * k;

      /* 朝向插值 */
      let dA = rp.tangle - rp.angle;
      dA = Math.atan2(Math.sin(dA), Math.cos(dA));
      rp.angle += dA * k;

      /* 出拳伸展插值 */
      rp.ext += (rp.text - rp.ext) * k;
    }
  }

  function updateJoy() {
    const dx = joy.x - joy.baseX, dy = joy.y - joy.baseY;
    const d = Math.hypot(dx, dy);
    if (d > 0.001) { joy.dx = dx / d; joy.dy = dy / d; joy.mag = Math.min(d, joy.maxR) / joy.maxR; }
    else { joy.dx = 0; joy.dy = 0; joy.mag = 0; }
  }
  function resetJoy() { joy.active = false; joy.pointerId = null; joy.dx = 0; joy.dy = 0; joy.mag = 0; }

  /* ============================================================
     更新
  ============================================================ */
  function collidePlayer() {
    const half = player.size / 2;
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      const ox = Math.min(player.x + half, o.x + o.w) - Math.max(player.x - half, o.x);
      const oy = Math.min(player.y + half, o.y + o.h) - Math.max(player.y - half, o.y);
      if (ox > 0 && oy > 0) {
        if (ox < oy) { player.x += (player.x < o.x + o.w / 2) ? -ox : ox; player.vx *= -0.2; }
        else { player.y += (player.y < o.y + o.h / 2) ? -oy : oy; player.vy *= -0.2; }
      }
    }
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      const damp = Math.pow(0.92, dt);
      p.vx *= damp; p.vy *= damp;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.life -= 0.055 * dt;
      if (r.life <= 0) rings.splice(i, 1);
      else r.radius = r.maxR * (1 - Math.pow(r.life, 2));
    }
  }
  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const speed = Math.hypot(b.vx, b.vy);
      const steps = Math.max(1, Math.ceil(speed * dt / 8));
      const stepDt = dt / steps;
      let dead = false;
      for (let s = 0; s < steps; s++) {
        b.x += b.vx * stepDt; b.y += b.vy * stepDt;
        b.life -= b.decay * stepDt;
        if (b.life <= 0 || b.x < -40 || b.x > WORLD_W + 40 || b.y < -40 || b.y > WORLD_H + 40) { dead = true; break; }
        if (pointInObstacle(b.x, b.y)) {
          addBulletMark(b.x, b.y, b.vx, b.vy, b.width / 2.4);
          if (b.pierce > 0) {
            b.pierce--;
            let guard = 0;
            while (pointInObstacle(b.x, b.y) && guard++ < 80) { b.x += b.vx * 0.35; b.y += b.vy * 0.35; }
          } else {
            spawnImpact(b.x, b.y, Math.atan2(-b.vy, -b.vx), 8);
            shake = Math.max(shake, 2.2);
            playHitSound();
            dead = true; break;
          }
        }
        if (b.visual) continue;
        if (b.hostile) {
          if (gameMode === 'ai' && !player.dead && player.invuln <= 0) {
            const dx = b.x - player.x, dy = b.y - player.y;
            const rr = (player.size / 2 + 4);
            if (dx * dx + dy * dy < rr * rr) { damagePlayer(b.damage); dead = true; break; }
          }
          continue;
        }
        if (gameMode === 'ai') {
          let hit = false;
          for (let ei = 0; ei < enemies.length; ei++) {
            const e = enemies[ei];
            if (!e.alive) continue;
            const dx = b.x - e.x, dy = b.y - e.y;
            const rr = (e.size / 2 + 4);
            if (dx * dx + dy * dy < rr * rr) {
              damageEnemy(e, b.damage, b.x, b.y, false, null);
              if (b.pierce > 0) b.pierce--;
              else dead = true;
              hit = true; break;
            }
          }
          if (dead) break;
          if (hit) continue;
        }
        if (gameMode === 'mp') {
          let hitRemote = false;
          for (const rid in remotePlayers) {
            const rp = remotePlayers[rid];
            if (rp.dead || rp.fading) continue;
            const dx = b.x - rp.x, dy = b.y - rp.y;
            const rr = (rp.size || 34) / 2 + 4;
            if (dx * dx + dy * dy < rr * rr) {
              if (channel) channel.send({ type: 'broadcast', event: 'hit', payload: { target: rid, damage: b.damage || 14, from: myId } });
              spawnHitBurst(rp.x, rp.y, Math.atan2(-b.vy, -b.vx), 10, false);
              if (b.pierce > 0) b.pierce--;
              else dead = true;
              hitRemote = true; break;
            }
          }
          if (dead) break;
          if (hitRemote) continue;
        }
      }
      if (dead) bullets.splice(i, 1);
    }
  }
  function updateCamera(dt) {
    if (aiming && isScopedWeapon()) targetZoom = 0.52;
    else if (aiming) targetZoom = 0.82;
    else targetZoom = 1;
    zoom += (targetZoom - zoom) * Math.min(1, 0.16 * dt);
    if (Math.abs(zoom - targetZoom) < 0.002) zoom = targetZoom;
    const viewW = W / zoom, viewH = H / zoom;
    let lookX = 0, lookY = 0;
    if (showTouchUI) {
      if (touchAim.active) {
        lookX = ((touchAim.x / W) - 0.5) * viewW * LOOKAHEAD;
        lookY = ((touchAim.y / H) - 0.5) * viewH * LOOKAHEAD;
      }
    } else {
      lookX = ((mouse.x / W) - 0.5) * viewW * LOOKAHEAD;
      lookY = ((mouse.y / H) - 0.5) * viewH * LOOKAHEAD;
    }
    const tx = clampCam(player.x - viewW / 2 + lookX, WORLD_W, viewW);
    const ty = clampCam(player.y - viewH / 2 + lookY, WORLD_H, viewH);
    if (!cam.ready) { cam.x = tx; cam.y = ty; cam.ready = true; return; }
    const k = Math.min(1, 0.14 * dt);
    cam.x += (tx - cam.x) * k;
    cam.y += (ty - cam.y) * k;
  }

  function update(dt, now) {
    if (!gameRunning) return;

    if (hitStop > 0) {
      hitStop -= dt;
      updateParticles(dt);
      updateSlashTrails(dt);
      updateRemotePlayers(dt);
      shake *= Math.pow(0.80, dt);
      if (shake < 0.08) shake = 0;
      return;
    }

    if (player.dead) { player.respawnTimer -= dt; if (player.respawnTimer <= 0) respawnPlayer(); }
    if (player.invuln > 0) player.invuln -= dt;

    let mx = 0, my = 0;
    if (!player.dead) {
      if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
      if (keys['KeyW'] || keys['ArrowUp'])    my -= 1;
      if (keys['KeyS'] || keys['ArrowDown'])  my += 1;
      if (joy.active && joy.mag > 0.12) { mx += joy.dx * joy.mag; my += joy.dy * joy.mag; }
    }
    const inMag = Math.hypot(mx, my);
    if (inMag > 1) { mx /= inMag; my /= inMag; }

    let sprint = !!(keys['ShiftLeft'] || keys['ShiftRight']);
    if (joy.active && joy.mag > 0.90) sprint = true;

    let accelNow = player.accel * (sprint ? SPRINT_MULT_ACCEL : 1);
    let maxSpNow = player.maxSpeed * (sprint ? SPRINT_MULT_SPEED : 1);
    if (aiming) { accelNow *= 0.62; maxSpNow *= 0.48; }

    if (mx || my) { player.vx += mx * accelNow * dt; player.vy += my * accelNow * dt; }
    const fr = Math.pow(player.friction, dt);
    player.vx *= fr; player.vy *= fr;
    const sp = Math.hypot(player.vx, player.vy);
    if (sp > maxSpNow) { player.vx *= maxSpNow / sp; player.vy *= maxSpNow / sp; }
    player.x += player.vx * dt; player.y += player.vy * dt;

    const m = player.size / 2 + 2;
    if (player.x < m) { player.x = m; player.vx = Math.abs(player.vx) * 0.3; }
    if (player.x > WORLD_W - m) { player.x = WORLD_W - m; player.vx = -Math.abs(player.vx) * 0.3; }
    if (player.y < m) { player.y = m; player.vy = Math.abs(player.vy) * 0.3; }
    if (player.y > WORLD_H - m) { player.y = WORLD_H - m; player.vy = -Math.abs(player.vy) * 0.3; }

    collidePlayer();

    let px, py;
    if (touchAim.active) { px = touchAim.x; py = touchAim.y; }
    else { px = mouse.x; py = mouse.y; }

    const worldMouseX = cam.x + px / zoom;
    const worldMouseY = cam.y + py / zoom;
    const targetAngle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);
    let diff = targetAngle - aimAngle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    const turnSpeed = aiming ? 0.30 : (touchAim.active ? 0.55 : 0.42);
    aimAngle += diff * Math.min(1, turnSpeed * dt);

    const w = weapon();
    const durLocal = w.melee && w.dur ? w.dur : PUNCH_DUR;
    const t = (now - punchStart) / durLocal;
    let ext = 0;
    if (t >= 0 && t <= 1) {
      if (t < PUNCH_OUT) ext = 1 - Math.pow(1 - t / PUNCH_OUT, 4);
      else { const p = (t - PUNCH_OUT) / (1 - PUNCH_OUT); ext = 1 - (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2); }
    }
    state.ext = ext;
    const reach = (w.melee && w.range ? w.range : 40);
    const dist = player.size / 2 + 4 + ext * reach;
    state.fx = player.x + Math.cos(aimAngle) * dist;
    state.fy = player.y + Math.sin(aimAngle) * dist;

    if (w.melee && !hitFired && ext > 0.60) {
      hitFired = true;
      const hitObs = pointInObstacle(state.fx, state.fy);
      const dmgVal = w.dmg || 22;
      let hitSomething = false;

      if (gameMode === 'ai') {
        const coneHalf = 0.55;
        for (let ei = 0; ei < enemies.length; ei++) {
          const e = enemies[ei];
          if (!e.alive) continue;
          const dx = e.x - player.x, dy = e.y - player.y;
          const edist = Math.hypot(dx, dy);
          if (edist > reach + e.size * 0.6) continue;
          let ea = Math.atan2(dy, dx) - aimAngle;
          ea = Math.atan2(Math.sin(ea), Math.cos(ea));
          if (Math.abs(ea) > coneHalf) continue;
          if (!hasLineOfSight(player.x, player.y, e.x, e.y)) continue;
          damageEnemy(e, dmgVal, e.x, e.y, true, w);
          hitSomething = true;
          break;
        }
      } else if (gameMode === 'mp') {
        const coneHalf = 0.55;
        for (const rid in remotePlayers) {
          const rp = remotePlayers[rid];
          if (rp.dead || rp.fading) continue;
          const dx = rp.x - player.x, dy = rp.y - player.y;
          const rdist = Math.hypot(dx, dy);
          if (rdist > reach + 22) continue;
          let ra = Math.atan2(dy, dx) - aimAngle;
          ra = Math.atan2(Math.sin(ra), Math.cos(ra));
          if (Math.abs(ra) > coneHalf) continue;
          if (!hasLineOfSight(player.x, player.y, rp.x, rp.y)) continue;
          if (channel) channel.send({ type: 'broadcast', event: 'hit', payload: { target: rid, damage: dmgVal, from: myId } });
          spawnMeleeHit(rp.x, rp.y, aimAngle, w);
          hitSomething = true;
          break;
        }
      }

      if (hitSomething) {
        const hsBase = { fist: 5, dagger: 4, nunchaku: 3, chainsaw: 2, katana: 7, hammer: 11 }[w.id] || 5;
        hitStop = hsBase;
        shake = Math.max(shake, { fist: 5.5, dagger: 4.5, nunchaku: 4, chainsaw: 3, katana: 8.5, hammer: 13 }[w.id] || 5);
        playMeleeHitSound(w);
      } else if (hitObs) {
        spawnMeleeHit(state.fx, state.fy, aimAngle, w);
        addBulletMark(state.fx, state.fy, Math.cos(aimAngle), Math.sin(aimAngle), 1.4);
        shake = Math.max(shake, { katana: 6, hammer: 9 }[w.id] || 4);
        playHitSound();
      } else {
        spawnImpact(state.fx, state.fy, aimAngle, 6);
      }
    }

    if (burstLeft > 0 && w.burst && now >= burstNext) { burstLeft--; burstNext = now + (w.burstDelay || 60); shootOne(); }

    if (firing && !player.dead) { if (w.melee) punch(); else fireGun(); }

    updateBullets(dt);
    if (gameMode === 'ai') updateEnemies(dt);
    if (gameMode === 'mp') updateRemotePlayers(dt);
    updateShells(dt);
    updateParticles(dt);
    updateSlashTrails(dt);
    updateCamera(dt);

    if (gameMode === 'mp') {
      mpSendAccum += dt;
      if (mpSendAccum >= MP_SEND_INTERVAL) { mpSendAccum = 0; sendMyState(false); }
    }

    gunRecoil *= Math.pow(0.72, dt);
    if (gunRecoil < 0.05) gunRecoil = 0;
    if (muzzleFlash) { muzzleFlash.life -= 0.14 * dt; if (muzzleFlash.life <= 0) muzzleFlash = null; }
    shake *= Math.pow(0.80, dt);
    if (shake < 0.08) shake = 0;
  }

  /* ============================================================
     绘制
  ============================================================ */
  function drawGrid() {
    const G = 50;
    const x0 = Math.floor(cam.x / G) * G, y0 = Math.floor(cam.y / G) * G;
    const x1 = cam.x + W / zoom + G, y1 = cam.y + H / zoom + G;
    ctx.strokeStyle = 'rgba(0,0,0,0.045)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += G) { ctx.moveTo(x + 0.5, y0); ctx.lineTo(x + 0.5, y1); }
    for (let y = y0; y <= y1; y += G) { ctx.moveTo(x0, y + 0.5); ctx.lineTo(x1, y + 0.5); }
    ctx.stroke();
  }
  function drawWorldBorder() {
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.strokeRect(-3, -3, WORLD_W + 6, WORLD_H + 6);
  }
  function drawObstacles() {
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      ctx.fillStyle = '#f6f6f6'; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.save();
      ctx.beginPath(); ctx.rect(o.x, o.y, o.w, o.h); ctx.clip();
      ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = -o.h; k < o.w; k += 13) { ctx.moveTo(o.x + k, o.y + o.h); ctx.lineTo(o.x + k + o.h, o.y); }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.strokeRect(o.x + 1, o.y + 1, o.w - 2, o.h - 2);
    }
  }
  function drawBulletMarks() {
    for (let i = 0; i < marks.length; i++) {
      const mk = marks[i];
      if (mk.x < cam.x - 24 || mk.x > cam.x + W / zoom + 24 || mk.y < cam.y - 24 || mk.y > cam.y + H / zoom + 24) continue;
      ctx.save();
      ctx.translate(mk.x, mk.y); ctx.rotate(mk.rot);
      ctx.globalAlpha = mk.a; ctx.fillStyle = '#000';
      ctx.fillRect(-mk.r, -mk.r, mk.r * 2, mk.r * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawAimLine() {
    if (aiming) return;
    const wx = cam.x + (touchAim.active ? touchAim.x : mouse.x) / zoom;
    const wy = cam.y + (touchAim.active ? touchAim.y : mouse.y) / zoom;
    ctx.save(); ctx.setLineDash([3, 8]);
    ctx.strokeStyle = 'rgba(0,0,0,0.09)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(wx, wy); ctx.stroke();
    ctx.restore();
  }
  function drawAimPreview() {
    if (!aiming) return;
    const maxDist = 1200;
    const hit = raycastHit(player.x, player.y, aimAngle, maxDist);
    ctx.save();
    ctx.setLineDash([6, 9]);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(hit.x, hit.y); ctx.stroke();
    ctx.setLineDash([]);
    const ps = 9;
    ctx.fillStyle = 'rgba(0,0,0,0.85)';
    ctx.fillRect(hit.x - ps / 2, hit.y - ps / 2, ps, ps);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6;
    ctx.strokeRect(hit.x - ps / 2, hit.y - ps / 2, ps, ps);
    const pulse = 1 + Math.sin(performance.now() / 260) * 0.16;
    ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(hit.x, hit.y, ps * 1.7 * pulse, 0, Math.PI * 2); ctx.stroke();
    const label = Math.round(hit.dist) + ' m';
    ctx.save();
    ctx.translate(hit.x, hit.y - 22);
    ctx.scale(1 / zoom, 1 / zoom);
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.font = '600 12px -apple-system,"PingFang SC",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0);
    ctx.restore();
    if (gameMode === 'ai') {
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.alive) continue;
        if (!hasLineOfSight(player.x, player.y, e.x, e.y)) continue;
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d > maxDist) continue;
        ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
        ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(e.x, e.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.85, 0, Math.PI * 2); ctx.stroke();
        break;
      }
    }
    if (gameMode === 'mp') {
      for (const rid in remotePlayers) {
        const rp = remotePlayers[rid];
        if (rp.dead || rp.fading) continue;
        if (!hasLineOfSight(player.x, player.y, rp.x, rp.y)) continue;
        ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 1;
        ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(rp.x, rp.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(rp.x, rp.y, 30, 0, Math.PI * 2); ctx.stroke();
        break;
      }
    }
    ctx.restore();
  }
  function drawRings() {
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, r.life) * 0.85;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = (r.lineW || 1.2) + r.life * 2.6;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  function drawShells() {
    for (let i = 0; i < shells.length; i++) {
      const s = shells[i];
      ctx.save();
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.globalAlpha = Math.min(1, s.life * 4);
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillRect(-s.w / 2, -s.h / 2, s.w, 1);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawSprintAura() {
    const sp = Math.hypot(player.vx, player.vy);
    if (sp < player.maxSpeed * 1.06) return;
    ctx.save();
    ctx.globalAlpha = 0.16; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 7]);
    ctx.beginPath(); ctx.arc(player.x, player.y, player.size * 1.15, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function drawPlayer() {
    if (player.dead) return;
    const ext = state.ext;
    const recoil = ext * 4 + gunRecoil * 0.35;
    const bx = player.x - Math.cos(aimAngle) * recoil;
    const by = player.y - Math.sin(aimAngle) * recoil;
    const s = player.size;
    if (player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.35;
    ctx.save();
    ctx.translate(bx, by);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function drawRemotePlayers() {
    const now = performance.now();
    for (const rid in remotePlayers) {
      const rp = remotePlayers[rid];
      const s = 34;
      /* 淡出余晖：fading 状态降低透明度 */
      let alpha = 1;
      if (rp.fading) {
        const fadeAge = now - rp.fadeStart;
        alpha = Math.max(0, 1 - fadeAge / REMOTE_FADE_MS) * 0.55;
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(rp.x, rp.y);

      /* 死亡玩家：灰色墓碑 */
      if (rp.dead) {
        ctx.fillStyle = '#888';
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
        ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
        ctx.beginPath();
        ctx.moveTo(-s / 4, -s / 4);
        ctx.lineTo(s / 4, s / 4);
        ctx.moveTo(s / 4, -s / 4);
        ctx.lineTo(-s / 4, s / 4);
        ctx.stroke();
        /* 名字 */
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(rp.name || '玩家', 0, -s / 2 - 6);
        ctx.restore();
        continue;
      }

      /* 正常玩家：黑底白边（与己方区分） */
      ctx.fillStyle = '#000000';
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);

      /* 朝向指示 */
      ctx.save();
      ctx.rotate(rp.angle);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(s / 2 - 3, -3, 5, 6);
      ctx.restore();

      /* 手持武器 */
      ctx.save();
      ctx.rotate(rp.angle);
      const rw = WEAPONS[rp.weapon];
      if (rw && !rw.melee) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s / 2 - 4, -2, 20, 4);
      } else if (rw && rw.melee) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s / 2, -2, 8 + rp.ext * 12, 4);
      }
      ctx.restore();

      /* 血条 */
      if (rp.hp < rp.maxHp) {
        const bw = s + 4, bh = 4, by = -s / 2 - 12;
        const ratio = Math.max(0, rp.hp / rp.maxHp);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(-bw / 2, by, bw, bh);
        ctx.fillStyle = '#000';
        ctx.fillRect(-bw / 2, by, bw * ratio, bh);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(-bw / 2 + 0.5, by + 0.5, bw - 1, bh - 1);
      }

      /* 名字 */
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.font = '600 10px -apple-system,"PingFang SC",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(rp.name || '玩家', 0, -s / 2 - 16);

      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function drawEnemies() {
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.alive) continue;
      const s = e.size;
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.hitFlash > 0.05) { ctx.fillStyle = 'rgba(255,255,255,' + (e.hitFlash * 0.9).toFixed(3) + ')'; ctx.fillRect(-s / 2 - 3, -s / 2 - 3, s + 6, s + 6); }
      ctx.fillStyle = '#000000'; ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.strokeRect(-s / 2 + 1, -s / 2 + 1, s - 2, s - 2);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(s / 2 - 3, -3, 5, 6);
      if (e.hp < e.maxHp) {
        const bw = s + 4, bh = 4, by = -s / 2 - 10;
        const ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fillRect(-bw / 2, by, bw, bh);
        ctx.fillStyle = '#000'; ctx.fillRect(-bw / 2, by, bw * ratio, bh);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(-bw / 2 + 0.5, by + 0.5, bw - 1, bh - 1);
      }
      if (e.state === 'chase') {
        const blink = Math.sin(performance.now() / 180) > 0;
        if (blink) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, -s / 2 - 20, 3.2, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.restore();
    }
  }

  /* ============================================================
     近战武器独立造型
  ============================================================ */
  function drawMeleeShape(style, ext, progress) {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const s = 20;

    if (style === 'fist') {
      ctx.beginPath(); ctx.rect(-s / 2, -s / 2, s, s); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s / 2 + 4, 0); ctx.lineTo(s / 2 - 4, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s / 2, -s / 4); ctx.lineTo(s / 2, -s / 4); ctx.stroke();
    }
    else if (style === 'dagger') {
      ctx.beginPath(); ctx.rect(-s * 0.9, -s * 0.14, s * 0.6, s * 0.28); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.rect(-s * 0.32, -s * 0.3, s * 0.16, s * 0.6); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-s * 0.16, -s * 0.14); ctx.lineTo(s * 0.9, -s * 0.05);
      ctx.lineTo(s * 1.05, 0); ctx.lineTo(s * 0.9, s * 0.05);
      ctx.lineTo(-s * 0.16, s * 0.14); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s * 0.1, 0); ctx.lineTo(s * 0.75, 0); ctx.stroke();
    }
    else if (style === 'nunchaku') {
      ctx.beginPath(); ctx.rect(-s * 0.95, -s * 0.13, s * 0.55, s * 0.26); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.setLineDash([3, 3]); ctx.moveTo(-s * 0.4, 0); ctx.lineTo(s * 0.15, 0);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.rect(s * 0.15, -s * 0.13, s * 0.9, s * 0.26); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 0.35, -s * 0.13); ctx.lineTo(s * 0.35, s * 0.13); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 0.85, -s * 0.13); ctx.lineTo(s * 0.85, s * 0.13); ctx.stroke();
    }
    else if (style === 'chainsaw') {
      ctx.beginPath(); ctx.rect(-s * 0.85, -s * 0.28, s * 1.8, s * 0.56); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        const x = -s * 0.85 + i * (s * 1.8 / 7);
        const ww = s * 1.8 / 14;

      ctx.quadraticCurveTo(s * 0.4, -s * 0.18, s * 1.5, -s * 0.24);

  function drawFist() {

  function drawGunShape(id, recoil, s) {

    };
    const T = (x1, y1, x2, y2, x3, y3) => {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);

      ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      case 'smg': { B(h - 5, -6, 22, 12); B(h + 17, -3, Math.max(6, 12 - r * 0.4), 6); B(h - 9, 6, 8, 12); B(h + 4, 6, 8, 20); B(h - 13, -3, 8, 6); break; }

      case 'vector': { B(h - 7, -6, 20, 12); B(h + 13, -3, Math.max(5, 8 - r * 0.3), 6); B(h - 10, 6, 8, 13); B(h + 2, 6, 8, 18); B(h - 15, -3, 8, 6); break; }
      case 'ak47': { B(h - 16, -3, 12, 7); B(h - 4, -5, 20, 11); B(h + 16, -3, Math.max(10, 14 - r * 0.5), 6); T(h - 1, 6, h + 10, 6, h + 8, 26, h - 3, 26); B(h - 2, 6, 9, 13); B(h + 14, -8, 12, 4); break; }
      case 'm4a1': { B(h - 16, -3, 12, 7); B(h - 4, -5, 20, 11); B(h + 16, -3, Math.max(11, 16 - r * 0.5), 6); B(h, 6, 8, 16); B(h - 2, 6, 9, 13); B(h + 2, -9, 16, 3); break; }
      case 'aug': { B(h - 10, -6, 26, 12); B(h + 16, -3, Math.max(9, 12 - r * 0.4), 6); B(h + 4, 6, 6, 12); B(h - 8, -12, 14, 5); B(h - 6, 6, 8, 16); break; }
      case 'scar': { B(h - 16, -3, 12, 7); B(h - 4, -5, 22, 11); B(h + 18, -3, Math.max(11, 14 - r * 0.5), 6); T(h, 6, h + 10, 6, h + 8, 24, h - 2, 24); B(h - 2, 6, 9, 13); break; }
      case 'famas': { B(h - 8, -5, 24, 11); B(h + 16, -3, Math.max(8, 10 - r * 0.4), 6); B(h - 2, -12, 11, 4); B(h + 6, 6, 5, 10); B(h - 6, 6, 8, 16); break; }

      case 'shotgun': { B(h - 18, -4, 16, 9); B(h - 2, -5, 12, 10); B(h + 10, -5, Math.max(18, 28 - r * 0.7), 6); B(h + 10, 2, Math.max(14, 22 - r * 0.5), 5); B(h + 8, 4, 12, 6); break; }

      case 'laser': { B(h - 6, -5, 20, 10); B(h + 14, -2, Math.max(12, 16 - r * 0.5), 4); T(h - 2, -5, h + 4, -12, h + 10, -5); B(h - 8, 5, 8, 12); C(h + 10, 0, 3); break; }

      case 'tesla': { B(h - 8, -5, 20, 10); C(h - 2, 0, 5); C(h + 6, 0, 5); for (let i = -1; i <= 1; i++) { L(h + 14, i * 4, h + 22, i * 6); L(h + 22, i * 6, h + 26, i * 4); } B(h - 10, 5, 8, 12); break; }
