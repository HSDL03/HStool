<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石的小站 · 工具与资源集散地</title>
<meta name="description" content="红石的小站 —— 一堆轻量、无依赖、点开即用的小工具，外加资源下载与个人 Wiki。">
<meta name="theme-color" content="#3d521f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<script>
/* 主题预置，避免刷新闪烁；兼容旧版键名 wiki-theme */
(function(){try{
  var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');
  var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
  if(t==='auto'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'mc-night':'mc-wiki';}
  if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<link rel="stylesheet" href="./assets/css/core.css">
<style>
/* ── 首页专属 ─────────────────────────────────────────────── */
.hero{padding:26px 0 26px;text-align:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:5px 14px;margin-bottom:16px;
  font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);
  background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);
  box-shadow:var(--bevel);
}
[data-theme^="github-"] .hero-badge{border-width:1px;border-radius:999px;box-shadow:none;letter-spacing:.02em}
.hero-badge .dot{position:relative;width:7px;height:7px;background:var(--ac);flex:none}
[data-theme^="github-"] .hero-badge .dot{border-radius:50%}
.hero-badge .dot::after{content:"";position:absolute;inset:0;background:var(--ac);animation:badgePulse 2s ease-out infinite}
[data-theme^="github-"] .hero-badge .dot::after{border-radius:50%}
@keyframes badgePulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}

.hero h1{
  margin:0 0 12px;font-size:clamp(2.05rem,5vw,3.4rem);font-weight:900;
  line-height:1.08;letter-spacing:-.035em;
}
/* 逐字动画：每个字的渐变位置由 JS 计算，拼起来是一条连续的渐变 */
.hero h1 .ch{
  display:inline-block;opacity:0;transform:translateY(26px) rotate(-10deg) scale(.9);
  animation:chIn .6s cubic-bezier(.34,1.56,.64,1) forwards;
  background-image:var(--hero-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
@keyframes chIn{60%{opacity:1}to{opacity:1;transform:none}}
.hero .sub{margin:0 auto;max-width:560px;font-size:14.5px;color:var(--muted);line-height:1.75}
.hero .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:680px;margin:26px auto 0}
.stat{
  padding:11px 8px;text-align:center;background:var(--bg2);
  border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s;
}
[data-theme^="github-"] .stat{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.stat:hover{transform:translateY(-3px);border-color:var(--ac)}
.stat b{display:block;font-size:20px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ac);letter-spacing:-.02em}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

/* 公告 */
.ann{max-width:780px;margin:0 auto 20px;display:flex;flex-direction:column;gap:8px}
.ann[hidden]{display:none}
.ann-item{
  position:relative;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);
  box-shadow:var(--bevel);overflow:hidden;transition:border-color .2s;
}
[data-theme^="github-"] .ann-item{border-width:1px;box-shadow:var(--sh-1)}
.ann-item[data-type="info"]{border-left:4px solid var(--ac)}
.ann-item[data-type="success"]{border-left:4px solid var(--ok)}
.ann-item[data-type="warn"]{border-left:4px solid var(--warn)}
.ann-item[data-type="danger"]{border-left:4px solid var(--dgr)}
.ann-head{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none;transition:background .15s}
.ann-head:hover{background:var(--bg3)}
.ann-ico{flex:none;font-size:17px;line-height:1}
.ann-title{flex:1;min-width:0;font-size:13.5px;font-weight:800;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ann-cat{flex:none;padding:0 7px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ac);background:var(--acs);border:1px solid var(--ac);border-radius:var(--r)}
.ann-arrow{flex:none;font-size:10px;color:var(--muted);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.ann-item.collapsed .ann-arrow{transform:rotate(-90deg)}
.ann-close{flex:none;width:22px;height:22px;display:grid;place-items:center;font-size:11px;color:var(--faint);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s}
.ann-close:hover{background:var(--bg);color:var(--dgr)}
.ann-wrap{overflow:hidden;max-height:900px;opacity:1;transition:max-height .35s cubic-bezier(.34,1.56,.64,1),opacity .25s}
.ann-item.collapsed .ann-wrap{max-height:0;opacity:0}
.ann-body{padding:0 13px 11px 39px;font-size:12.5px;color:var(--muted);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ann-link{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:12px;font-weight:800;color:var(--ac);border-bottom:1px dashed var(--ac)}
.ann-link:hover{border-bottom-style:solid}

/* 最近打开 */
.recent{max-width:1180px;margin:0 auto 18px}
.recent[hidden]{display:none}
.recent-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}
.recent-item{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  height:30px;padding:0 11px;font-size:12.5px;font-weight:700;color:var(--text);
  background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);
  box-shadow:var(--bevel);cursor:pointer;transition:all .16s;text-decoration:none;
}
[data-theme^="github-"] .recent-item{border-width:1px;box-shadow:none;border-radius:999px}
.recent-item:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.recent-item .ri{font-size:13px}

/* 工具栏 */
.filters{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.filters .row{gap:6px}
.filter-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.filter-head .sp{flex:1;min-width:8px}
.filters .label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}

/* 废弃区 */
.dep-wrap{margin-top:34px}
.dep-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;margin-bottom:12px}
.dep-head .toggle{
  width:20px;height:20px;display:grid;place-items:center;flex:none;
  font-size:9px;color:var(--muted);background:var(--bg2);
  border:1px solid var(--bd);border-radius:var(--r);transition:transform .25s;
}
.dep-wrap.closed .dep-head .toggle{transform:rotate(-90deg)}
.dep-body{overflow:hidden;transition:max-height .35s ease,opacity .25s;max-height:3000px;opacity:1}
.dep-wrap.closed .dep-body{max-height:0;opacity:0}
.dep-wrap.closed{margin-top:22px}
@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{padding:14px 0 18px}
}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar" id="topbar">
  <a class="brand" href="./index.html" aria-label="红石的小站 首页">
    <span class="ico">🧰</span><span class="txt">红石的小站</span>
  </a>
  <nav class="tnav" aria-label="主站导航">
    <a href="./index.html" aria-current="page">🏠 <span>首页</span></a>
    <a href="./wiki.html">📚 <span>Wiki</span></a>
    <a href="./download.html">📥 <span>下载</span></a>
  </nav>
  <span class="spacer"></span>
  <div class="searchbox">
    <span class="sico">⌕</span>
    <input id="q" type="search" placeholder="搜索工具…（按 / 聚焦）" autocomplete="off" aria-label="搜索工具">

<div class="decor" aria-hidden="true"></div>

<main class="wrap" id="main">

  <section class="hero">
    <div class="hero-badge"><span class="dot"></span>STATION · 在线 · <span id="stamp">2026</span></div>
    <h1 id="heroTitle">红石的小站</h1>
    <p class="sub">一堆轻量、无依赖、点开即用的小工具 —— 顺手再放点资源和笔记。</p>
    <div class="actions">
      <a class="btn primary" href="#tools">🔧 开始使用</a>

    <div class="stats">
      <div class="stat"><b id="nTools">–</b><span>工具</span></div>
      <div class="stat"><b id="nWiki">–</b><span>Wiki 条目</span></div>
      <div class="stat"><b id="nFiles">–</b><span>资源</span></div>
      <div class="stat"><b id="nTags">–</b><span>分类</span></div>
    </div>

  <div class="ann" id="annWrap" hidden></div>

  <div class="recent" id="recentWrap" hidden>

  <section id="tools">
    <div class="filters">
      <div class="filter-head">
        <div class="toolbar" style="margin:0" id="tagChips"></div>

      <div class="row">

        已废弃 / 测试中
        <span class="count" id="cntDep">0</span>
        <span class="right faint" style="font-size:11px;font-weight:600">点击折叠</span>

      <div class="dep-body"><div class="grid" id="gridDep"></div></div>

</main>

<footer class="foot">
  <div class="fl">

<script src="./assets/js/core.js"></script>
<script>
(function () {
  'use strict';
  var GH = 'HSDL03/HStool';

  /* 远程数据缺项时的兜底，保证核心入口永远在 */
  var FALLBACK = [
    { id: 'wiki', icon: '📚', name: '红石答辩wiki', desc: '个人知识库 · 条目式整理', tag: '知识', url: './wiki.html', category: 'noDB' },
    { id: 'download', icon: '📥', name: '下载站', desc: '资源文件 · 便捷下载', tag: '资源', url: './download.html', category: 'noDB' },
    { id: 'chat', icon: '💬', name: '聊天室', desc: '和朋友们聊天', tag: '社交', url: './chat.html', category: 'needDB' }
  ];

  var TOOLS = [];
  var K_RECENT = 'hs-recent';
  var state = {
    q: '', tag: '__all__', db: '__all__', sort: 'default',
    view: HS.store.get('hs-view', 'grid')
  };

  function norm(t, i) {
    if (!t || typeof t !== 'object') return null;
    var name = (typeof t.name === 'string' && t.name.trim()) ? t.name.trim() : ('未命名 ' + (i + 1));
    var cat = '';
    if (t.category === 'needDB' || t.category === 'noDB') cat = t.category;
    else if (typeof t.requiresDb === 'boolean') cat = t.requiresDb ? 'needDB' : 'noDB';
    return {
      id: (typeof t.id === 'string' && t.id.trim()) ? t.id.trim() : ('tool-' + (i + 1)),
      icon: (typeof t.icon === 'string' && t.icon.trim()) ? t.icon.trim() : '🧰',
      name: name,
      desc: typeof t.desc === 'string' ? t.desc : '',
      tag: (typeof t.tag === 'string' && t.tag.trim()) ? t.tag.trim() : '工具',
      url: typeof t.url === 'string' ? t.url : '',
      category: cat,
      deprecated: !!t.deprecated,
      disabled: !!t.disabled,
      hidden: !!t.hidden
    };
  }
  function normAll(arr) {
    var out = [], seen = {};
    (arr || []).forEach(function (t, i) {
      var n = norm(t, i);
      if (n && !seen[n.id]) { seen[n.id] = 1; out.push(n); }
    });
    return out;
  }
  function merge(remote, fallback) {
    var seenId = {}, seenUrl = {}, out = [];
    function add(t) {
      if (!t) return;
      var u = String(t.url || '').replace(/^\.\//, '').replace(/\/$/, '');
      if (seenId[t.id]) return;
      if (u && seenUrl[u]) return;
      seenId[t.id] = 1;
      if (u) seenUrl[u] = 1;
      out.push(t);
    }
    remote.forEach(add);
    fallback.forEach(add);
    return out;
  }
  function absUrl(u) {
    if (!u) return '';
    if (/^(https?:|mailto:|tel:|javascript:|data:|\/\/)/i.test(u)) return u;
    try { return new URL(u, location.href).href; } catch (e) { return u; }
  }
  function isExternal(u) { return /^https?:/i.test(u) && u.indexOf(location.host) === -1; }

  /* 标题逐字入场（渐变按字数切片，视觉上仍是连续的一条） */
  (function heroIn() {
    var h = document.getElementById('heroTitle');
    if (!h) return;
    var txt = h.textContent;
    var n = txt.length;
    h.textContent = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = txt[i] === ' ' ? '\u00a0' : txt[i];
      s.style.animationDelay = (i * 55 + 80) + 'ms';
      s.style.backgroundSize = (n * 100) + '% 100%';
      s.style.backgroundPosition = (n > 1 ? (i / (n - 1)) * 100 : 0) + '% 50%';
      frag.appendChild(s);
    }
    h.appendChild(frag);
    document.getElementById('stamp').textContent = new Date().getFullYear();
  })();

  /* ── 公告 ── */
  var dismissed = HS.store.json('hs-ann-dismissed', []);
  var collapseMap = HS.store.json('hs-ann-collapse', {});
  var annWrap = document.getElementById('annWrap');

  function loadAnnounce() {
    HS.fetchJSON('announcement.json', { remote: GH })
      .then(function (data) {
        var list = (Array.isArray(data) ? data : []).filter(function (it) {
          return it && it.enabled !== false && dismissed.indexOf(it.id) === -1;
        });
        renderAnnounce(list);
      })
      .catch(function () { annWrap.hidden = true; });
  }
  function renderAnnounce(list) {
    if (!list.length) { annWrap.hidden = true; annWrap.innerHTML = ''; return; }
    var html = '';
    list.forEach(function (it, i) {
      var type = it.type || 'info';
      var icon = it.icon || ({ warn: '⚠️', danger: '🚫', success: '✅' }[type] || '📢');
      var collapsed = collapseMap.hasOwnProperty(it.id) ? !!collapseMap[it.id] : it.collapsed === true;
      html += '<div class="ann-item' + (collapsed ? ' collapsed' : '') + '" data-type="' + HS.esc(type) + '"' +
        ' data-id="' + HS.esc(it.id || '') + '">' +
        '<div class="ann-head" data-toggle="' + HS.esc(it.id || '') + '">' +
        '<span class="ann-ico">' + HS.esc(icon) + '</span>' +
        '<span class="ann-title">' + HS.esc(it.title || '公告') + '</span>' +
        (it.category ? '<span class="ann-cat">' + HS.esc(it.category) + '</span>' : '') +
        '<span class="ann-arrow">▾</span>' +
        '<button class="ann-close" data-close="' + HS.esc(it.id || '') + '" title="关闭这条公告" aria-label="关闭公告">✕</button>' +
        '</div>' +
        '<div class="ann-wrap"><div class="ann-body">' + HS.esc(it.content || '') +
        (it.link ? '<div><a class="ann-link" href="' + HS.esc(absUrl(it.link)) + '" target="_blank" rel="noopener">' +
          HS.esc(it.linkText || '查看详情') + ' →</a></div>' : '') +
        '</div></div></div>';
    });
    annWrap.innerHTML = html;
    annWrap.hidden = false;
  }
  annWrap.addEventListener('click', function (e) {
    var closeBtn = e.target.closest('[data-close]');
    if (closeBtn) {
      e.stopPropagation();
      var id = closeBtn.getAttribute('data-close');
      if (id && dismissed.indexOf(id) === -1) dismissed.push(id);
      HS.store.setJson('hs-ann-dismissed', dismissed);
      var card = closeBtn.closest('.ann-item');
      if (card) {
        card.style.transition = 'opacity .25s,transform .25s';
        card.style.opacity = '0';
        card.style.transform = 'translateY(-6px)';
      }
      setTimeout(loadAnnounce, 240);
      HS.toast('已关闭这条公告', { icon: '✓' });
      return;
    }
    var head = e.target.closest('[data-toggle]');
    if (head) {
      var item = head.closest('.ann-item');
      if (!item) return;
      var wasClosed = item.classList.contains('collapsed');
      item.classList.toggle('collapsed');
      var id2 = head.getAttribute('data-toggle');
      if (id2) { collapseMap[id2] = !wasClosed; HS.store.setJson('hs-ann-collapse', collapseMap); }
    }
  });

  /* ── 卡片 ── */
  function cardHTML(t, delay) {
    var external = isExternal(t.url);
    var dbBadge = t.category === 'needDB'
      ? '<span class="badge muted" title="需要后端或账号">☁ 需后端</span>'
      : t.category === 'noDB' ? '<span class="badge ok" title="纯前端即可使用">⚡ 纯前端</span>' : '';
    return '<a class="card reveal" href="' + HS.esc(absUrl(t.url)) + '"' +
      (external ? ' target="_blank" rel="noopener"' : '') +
      ' data-id="' + HS.esc(t.id) + '" style="transition-delay:' + Math.min(delay, 280) + 'ms">' +
      '<span class="glow"></span>' +
      '<div class="card-body">' +
      '<div class="cico">' + HS.esc(t.icon) + '</div>' +
      '<div class="cinfo">' +
      '<div class="cname">' + HS.esc(t.name) + '</div>' +
      (t.desc ? '<div class="cdesc">' + HS.esc(t.desc) + '</div>' : '') +
      '<div class="cmeta"><span class="badge">' + HS.esc(t.tag) + '</span>' + dbBadge +
      (t.disabled ? '<span class="badge dgr">停用</span>' : '') +
      (external ? '<span class="badge muted">↗ 站外</span>' : '') +
      '</div></div>' +
      '<span class="carrow">→</span>' +
      '</div></a>';
  }
  function bindCardFx(root) {
    root.querySelectorAll('.card').forEach(function (c) {
      var glow = c.querySelector('.glow');
      if (glow) {
        c.addEventListener('mousemove', function (e) {
          var r = c.getBoundingClientRect();
          glow.style.left = (e.clientX - r.left) + 'px';
          glow.style.top = (e.clientY - r.top) + 'px';
        });
      }
      c.addEventListener('click', function () { pushRecent(c.getAttribute('data-id')); });
    });
  }

  /* ── 最近打开 ── */
  function pushRecent(id) {
    if (!id) return;
    var arr = HS.store.json(K_RECENT, []);
    arr = arr.filter(function (x) { return x !== id; });
    arr.unshift(id);
    HS.store.setJson(K_RECENT, arr.slice(0, 8));
  }
  function renderRecent() {
    var ids = HS.store.json(K_RECENT, []);
    var wrap = document.getElementById('recentWrap');
    var row = document.getElementById('recentRow');
    var items = ids.map(function (id) {
      return TOOLS.filter(function (t) { return t.id === id; })[0];
    }).filter(Boolean);
    if (!items.length) { wrap.hidden = true; return; }
    row.innerHTML = items.map(function (t) {
      return '<a class="recent-item" href="' + HS.esc(absUrl(t.url)) + '"' +
        (isExternal(t.url) ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<span class="ri">' + HS.esc(t.icon) + '</span>' + HS.esc(t.name) + '</a>';
    }).join('');
    wrap.hidden = false;
  }

  /* ── 筛选与渲染 ── */
  function visible() { return TOOLS.filter(function (t) { return !t.hidden; }); }

  function passed(t) {
    if (state.tag !== '__all__' && (t.tag || '工具') !== state.tag) return false;
    if (state.db === '__db__' && t.category !== 'needDB') return false;
    if (state.db === '__nodb__' && t.category !== 'noDB') return false;
    if (state.db === '__unset__' && t.category) return false;
    if (state.q) {
      var hay = (t.name + ' ' + (t.desc || '') + ' ' + (t.tag || '')).toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
    }
    return true;
  }
  function sortList(list) {
    var arr = list.slice();
    if (state.sort === 'name') arr.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    else if (state.sort === 'tag') arr.sort(function (a, b) {
      var c = (a.tag || '').localeCompare(b.tag || '', 'zh');
      return c !== 0 ? c : a.name.localeCompare(b.name, 'zh');
    });
    return arr;
  }

  function renderChips() {
    var list = visible();
    var tagCount = {}, dbYes = 0, dbNo = 0, dbUn = 0;
    list.forEach(function (t) {
      var g = t.tag || '工具';
      tagCount[g] = (tagCount[g] || 0) + 1;
      if (t.category === 'needDB') dbYes++;
      else if (t.category === 'noDB') dbNo++;
      else dbUn++;
    });
    var tags = Object.keys(tagCount).sort(function (a, b) { return a.localeCompare(b, 'zh'); });
    var h = '<span class="label">分类</span>' +
      '<button class="chip' + (state.tag === '__all__' ? ' active' : '') + '" data-tag="__all__">全部 <span class="n">' + list.length + '</span></button>';
    tags.forEach(function (g) {
      h += '<button class="chip' + (state.tag === g ? ' active' : '') + '" data-tag="' + HS.esc(g) + '">' +
        HS.esc(g) + ' <span class="n">' + tagCount[g] + '</span></button>';
    });
    document.getElementById('tagChips').innerHTML = h;

    var d = '<span class="label">运行</span>' +
      '<button class="chip' + (state.db === '__all__' ? ' active' : '') + '" data-db="__all__">全部</button>' +
      '<button class="chip' + (state.db === '__nodb__' ? ' active' : '') + '" data-db="__nodb__"><span class="dot" style="color:var(--ok)"></span>纯前端 <span class="n">' + dbNo + '</span></button>' +
      '<button class="chip' + (state.db === '__db__' ? ' active' : '') + '" data-db="__db__"><span class="dot" style="color:var(--ac)"></span>需后端 <span class="n">' + dbYes + '</span></button>';
    if (dbUn) d += '<button class="chip' + (state.db === '__unset__' ? ' active' : '') + '" data-db="__unset__">未标注 <span class="n">' + dbUn + '</span></button>';
    document.getElementById('dbChips').innerHTML = d;
  }

  function render() {
    var list = visible();
    var active = list.filter(function (t) { return !t.deprecated; });
    var dep = list.filter(function (t) { return t.deprecated; });
    var shown = sortList(active.filter(passed));

    var grid = document.getElementById('grid');
    grid.className = 'grid' + (state.view === 'list' ? ' list' : '');
    grid.innerHTML = shown.map(function (t, i) { return cardHTML(t, i * 20); }).join('');
    bindCardFx(grid);

    document.getElementById('cntActive').textContent = shown.length;
    document.getElementById('resultInfo').textContent =
      (state.q || state.tag !== '__all__' || state.db !== '__all__')
        ? '筛选出 ' + shown.length + ' / ' + active.length + ' 个'
        : '共 ' + active.length + ' 个工具';
    document.getElementById('emptyBox').hidden = shown.length > 0;

    var depWrap = document.getElementById('depWrap');
    var depShown = sortList(dep.filter(passed));
    if (depShown.length) {
      depWrap.hidden = false;
      document.getElementById('cntDep').textContent = depShown.length;
      var gd = document.getElementById('gridDep');
      gd.className = 'grid' + (state.view === 'list' ? ' list' : '');
      gd.innerHTML = depShown.map(function (t, i) { return cardHTML(t, i * 20); }).join('');
      bindCardFx(gd);
      gd.querySelectorAll('.card').forEach(function (c) { c.classList.add('dim'); });
    } else {
      depWrap.hidden = true;
    }

    renderChips();
    renderRecent();
    HS.reveal();
  }

  /* ── 事件 ── */
  document.getElementById('tagChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]');
    if (!b) return;
    state.tag = b.getAttribute('data-tag');
    render();
  });
  document.getElementById('dbChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-db]');
    if (!b) return;
    state.db = b.getAttribute('data-db');
    render();
  });
  document.getElementById('viewSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    if (!b) return;
    state.view = b.getAttribute('data-view');
    HS.store.set('hs-view', state.view);
    Array.prototype.forEach.call(document.querySelectorAll('#viewSwitch button'), function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    render();
  });
  document.getElementById('sortSel').addEventListener('change', function (e) {
    state.sort = e.target.value;
    render();
  });
  document.getElementById('btnReset').addEventListener('click', function () {
    state.q = ''; state.tag = '__all__'; state.db = '__all__';
    document.getElementById('q').value = '';
    render();
  });
  document.getElementById('depHead').addEventListener('click', function () {
    document.getElementById('depWrap').classList.toggle('closed');
  });
  document.getElementById('btnReload').addEventListener('click', function () {
    var btn = this;
    btn.classList.add('spinning');
    loadTools(true);
    setTimeout(function () { btn.classList.remove('spinning'); }, 900);
  });
  document.getElementById('btnPalette').addEventListener('click', function () { HS.palette.open(); });

  var qEl = document.getElementById('q');
  qEl.addEventListener('input', function () {
    state.q = this.value.trim();
    render();
  });
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
      e.preventDefault(); qEl.focus(); qEl.select();
    }
    if (e.key === 'Escape' && document.activeElement === qEl) {
      qEl.value = ''; state.q = ''; qEl.blur(); render();
    }
  });

  /* ── 数据 ── */
  function loadTools(force) {
    var cache = HS.store.json('hs-tools-cache', null);
    if (!force && cache && (Date.now() - cache.t) < 5 * 60 * 1000 && Array.isArray(cache.data) && cache.data.length) {
      TOOLS = merge(normAll(cache.data), normAll(FALLBACK));
      render();
      document.getElementById('dataState').textContent = '本地缓存';
      return;
    }
    HS.fetchJSON('tools-data.json', { remote: GH })
      .then(function (data) {
        TOOLS = merge(normAll(data), normAll(FALLBACK));
        HS.store.setJson('hs-tools-cache', { t: Date.now(), data: TOOLS });
        document.getElementById('dataState').textContent = '已同步';
        render();
        if (force) HS.toast('工具列表已刷新', { icon: '✓' });
      })
      .catch(function () {
        TOOLS = normAll(FALLBACK);
        document.getElementById('dataState').textContent = '离线模式';
        render();
        if (force) HS.toast('刷新失败，已使用内置列表', { icon: '⚠️' });
      });
  }

  function countUp(el, to) {
    if (HS.reduced) { el.textContent = to; return; }
    var t0 = performance.now(), dur = 700;
    function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function loadStats() {
    HS.fetchJSON('wiki-data.json', { remote: GH })
      .then(function (d) { countUp(document.getElementById('nWiki'), Array.isArray(d) ? d.length : 0); })
      .catch(function () { document.getElementById('nWiki').textContent = '0'; });
    HS.fetchJSON('download-data.json', { remote: GH })
      .then(function (d) {
        var n = Array.isArray(d) ? d.filter(function (x) { return x && !x.hidden; }).length : 0;
        countUp(document.getElementById('nFiles'), n);
      })
      .catch(function () { document.getElementById('nFiles').textContent = '0'; });
  }

  /* ── 命令面板 ── */
  HS.palette.init({
    actions: [
      { icon: '🎨', title: '切换风格', desc: '打开主题选择器', kbd: 'T', run: function () { HS.theme.open(); } },
      { icon: '🔄', title: '刷新工具列表', desc: '重新从仓库拉取数据', run: function () { loadTools(true); } },
      { icon: '📚', title: '打开 Wiki', desc: '个人知识库', run: function () { location.href = './wiki.html'; } },
      { icon: '📥', title: '打开下载站', desc: '资源文件列表', run: function () { location.href = './download.html'; } },
      { icon: '🗂️', title: '数据管理', desc: '编辑站点 JSON 数据', run: function () { location.href = './admin.html'; } }
    ],
    source: function () {
      return TOOLS.filter(function (t) { return !t.hidden; }).map(function (t) {
        return {
          icon: t.icon, title: t.name, desc: (t.desc || t.tag), group: '工具',
          keywords: t.tag + ' ' + (t.desc || ''), href: absUrl(t.url)
        };
      });
    }
  });

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if (e.key === 't' || e.key === 'T') HS.theme.open();
  });

  /* ── 启动 ── */
  Array.prototype.forEach.call(document.querySelectorAll('#viewSwitch button'), function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-view') === state.view ? 'true' : 'false');
  });
  loadTools(false);
  loadAnnounce();
  loadStats();
  HS.status.mount('tools-data.json');

  var statTimer = setInterval(function () {
    if (!TOOLS.length) return;
    clearInterval(statTimer);
    var tags = {};
    TOOLS.forEach(function (x) { if (!x.hidden) tags[x.tag || ''] = 1; });
    countUp(document.getElementById('nTools'),
      TOOLS.filter(function (x) { return !x.hidden && !x.deprecated; }).length);
    countUp(document.getElementById('nTags'), Object.keys(tags).length);
  }, 100);
})();
</script>
</body>
</html>
