<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>我的 Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --bg-subtle: #f6f8fa;
    --bg-hover: #eef1f4;
    --text: #1f2328;
    --text-muted: #59636e;
    --border: #d1d9e0;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --danger: #cf222e;
    --ok: #1a7f37;
    --code-bg: #f6f8fa;
    --shadow: 0 8px 24px rgba(31, 35, 40, .12);
    --topbar-h: 56px;
    --sidebar-w: 260px;
    --radius: 8px;
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-subtle: #161b22;
    --bg-hover: #21262d;
    --text: #e6edf3;
    --text-muted: #9198a1;
    --border: #30363d;
    --accent: #4493f8;
    --accent-soft: #16233a;
    --danger: #f85149;
    --ok: #3fb950;
    --code-bg: #161b22;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* 加载占位，脚本跑起来之前也能看到东西 */
  #boot {
    padding: 120px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  #boot .spin {
    display: inline-block;
    width: 18px; height: 18px;
    margin-right: 8px;
    vertical-align: -3px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    z-index: 50;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    letter-spacing: -.01em;
  }
  .search { position: relative; flex: 1; max-width: 420px; }
  .search svg {
    position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  .search input {
    width: 100%; height: 36px;
    padding: 0 12px 0 34px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--text-muted); }
  .search input:focus {
    background: var(--bg);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .icon-btn {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    flex: none;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .icon-btn.active { background: var(--accent-soft); color: var(--accent); }
  .menu-btn { display: none; }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: rgba(207, 34, 46, .1); }

  /* ---------- 侧边栏 ---------- */
  .sidebar {
    position: fixed;
    top: var(--topbar-h);
    bottom: 0;
    left: 0;
    width: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    padding: 16px 12px 12px;
    overflow-y: auto;
    background: var(--bg-subtle);
    border-right: 1px solid var(--border);
    z-index: 40;
  }
  #navList { flex: 1; min-height: 0; }
  .nav-group + .nav-group { margin-top: 20px; }
  .nav-group-title {
    padding: 0 10px 6px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .nav-item {
    display: block;
    padding: 6px 10px;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    border-radius: 6px;
    transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--bg-hover); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-empty { padding: 8px 10px; font-size: 13.5px; color: var(--text-muted); }

  /* ---------- 数据源卡片 ---------- */
  .file-card {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12.5px;
    transition: border-color .15s;
  }
  .file-card.clickable { cursor: pointer; border-color: var(--accent); }
  .file-card.clickable:hover { background: var(--bg-hover); }
  .file-card .row { display: flex; align-items: center; gap: 7px; }
  .file-dot {
    width: 8px; height: 8px; flex: none;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background .2s, box-shadow .2s;
  }
  .file-dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(26, 127, 55, .18); }
  .file-dot.warn { background: #d4a72c; box-shadow: 0 0 0 3px rgba(212,167,44,.22); }
  .file-name {
    flex: 1;
    min-width: 0;
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-x {
    width: 20px; height: 20px; flex: none;
    display: grid; place-items: center;
    font-size: 11px; font-family: inherit;
    color: var(--text-muted);
    background: none; border: none; border-radius: 4px;
    cursor: pointer;
  }
  .file-x:hover { background: var(--bg-hover); color: var(--danger); }
  .file-sub { margin-top: 3px; font-size: 11.5px; color: var(--text-muted); }

  @keyframes flashSync {
    0%   { background: rgba(26, 127, 55, .22); }
    100% { background: var(--bg); }
  }
  .file-card.synced { animation: flashSync .8s ease-out; }

  /* ---------- 侧边栏工具栏 ---------- */
  .sidebar-tools {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .sidebar-tools button {
    padding: 7px 4px;
    font-size: 12px;
    font-family: inherit;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .sidebar-tools button:hover {
    color: var(--text);
    background: var(--bg-hover);
    border-color: var(--text-muted);
  }

  /* ---------- 内容区 ---------- */
  .content {
    margin-left: var(--sidebar-w);
    padding: calc(var(--topbar-h) + 36px) 32px 96px;
    min-height: 100vh;
  }
  .article { max-width: 820px; margin: 0 auto; }
  .article h1 {
    margin: 0 0 6px;
    font-size: 2rem;
    line-height: 1.25;
    letter-spacing: -.022em;
  }
  .article .meta {
    margin-bottom: 26px;
    padding-bottom: 16px;
    font-size: 13px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .article .meta .edit-link {
    float: right;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .article .meta .edit-link:hover { text-decoration: underline; }

  .article-body h2 {
    margin: 38px 0 14px;
    padding-bottom: 7px;
    font-size: 1.32rem;
    letter-spacing: -.01em;
    border-bottom: 1px solid var(--border);
  }
  .article-body h3 { margin: 26px 0 8px; font-size: 1.1rem; }
  .article-body p { margin: 0 0 16px; }
  .article-body ul, .article-body ol { margin: 0 0 16px; padding-left: 1.5em; }
  .article-body li { margin: 4px 0; }
  .article-body a { color: var(--accent); }
  .article-body strong { font-weight: 650; }
  .article-body hr { margin: 32px 0; border: none; border-top: 1px solid var(--border); }
  .article-body blockquote {
    margin: 0 0 16px;
    padding: 4px 16px;
    color: var(--text-muted);
    border-left: 3px solid var(--border);
  }
  .article-body code {
    padding: .15em .4em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .875em;
    background: var(--code-bg);
    border-radius: 4px;
  }
  .article-body pre {
    margin: 0 0 18px;
    padding: 14px 16px;
    overflow-x: auto;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .article-body pre code {
    padding: 0;
    font-size: 13.5px;
    line-height: 1.65;
    background: none;
    border-radius: 0;
  }
  .article-body table {
    width: 100%;
    margin: 0 0 18px;
    border-collapse: collapse;
    font-size: 14.5px;
  }
  .article-body th, .article-body td {
    padding: 8px 12px;
    text-align: left;
    border: 1px solid var(--border);
  }
  .article-body th { background: var(--bg-subtle); font-weight: 650; }
  .article-body tbody tr:hover { background: var(--bg-subtle); }
  .article-body > :first-child { margin-top: 0; }

  .callout {
    display: flex;
    gap: 10px;
    margin: 0 0 18px;
    padding: 12px 16px;
    font-size: 14.5px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
  }
  .callout::before { content: "💡"; }
  .callout p:last-child { margin-bottom: 0; }

  /* ---------- 空状态 ---------- */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 72px 24px;
  }
  .empty-icon { font-size: 44px; line-height: 1; margin-bottom: 18px; opacity: .85; }
  .empty-state h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -.02em; }
  .empty-state .lead {
    max-width: 480px;
    margin: 0 0 28px;
    font-size: 15px;
    color: var(--text-muted);
  }
  .empty-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .empty-tips {
    max-width: 560px;
    width: 100%;
    text-align: left;
    padding: 16px 20px;
    font-size: 14px;
    color: var(--text-muted);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty-tips h3 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text);
  }
  .empty-tips ul { margin: 0; padding-left: 1.3em; }
  .empty-tips li { margin: 5px 0; }
  .empty-tips kbd {
    padding: 1px 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
  }

  /* ---------- 上一篇 / 下一篇 ---------- */
  .pager {
    display: flex;
    gap: 12px;
    margin-top: 52px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .pager a {
    flex: 1;
    padding: 12px 16px;
    color: var(--text);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color .15s, background .15s;
  }
  .pager a:hover { background: var(--bg-subtle); border-color: var(--accent); }
  .pager .dir { font-size: 12px; color: var(--text-muted); }
  .pager .t { font-size: 14.5px; font-weight: 600; }
  .pager .next { text-align: right; }
  .pager .spacer { flex: 1; }

  /* ---------- 编辑器 ---------- */
  .editor-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, .5);
    z-index: 100;
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
  }
  .editor-overlay.show { opacity: 1; visibility: visible; }

  .editor-panel {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1080px;
    height: 100%;
    max-height: 780px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transform: translateY(10px) scale(.99);
    transition: transform .2s;
  }
  .editor-overlay.show .editor-panel { transform: none; }

  .editor-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .editor-head strong { font-size: 15px; }
  .editor-head .spacer { flex: 1; }

  .editor-fields {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .field:first-child { flex: 2; }
  .field span {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .field input {
    height: 34px;
    padding: 0 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .editor-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 8px 16px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
  }
  .editor-toolbar button {
    min-width: 32px;
    height: 30px;
    padding: 0 8px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    cursor: pointer;
    transition: color .12s, border-color .12s, background .12s;
  }
  .editor-toolbar button:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .editor-main {
    display: flex;
    gap: 12px;
    flex: 1;
    min-height: 0;
    padding: 12px 16px;
  }
  .editor-main textarea {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    resize: none;
    outline: none;
    tab-size: 2;
    transition: border-color .15s, box-shadow .15s;
  }
  .editor-main textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .editor-preview {
    flex: 1;
    min-width: 0;
    padding: 12px 16px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: none;
    font-size: 15px;
  }
  .editor-main.preview-on .editor-preview { display: block; }

  .editor-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
  .editor-foot .spacer { flex: 1; }
  .editor-hint { font-size: 12px; color: var(--text-muted); }

  /* ---------- 提示条 ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    max-width: calc(100vw - 40px);
    padding: 10px 20px;
    font-size: 14px;
    color: var(--bg);
    background: var(--text);
    border-radius: 8px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateX(-50%) translateY(12px);
    transition: opacity .22s, transform .22s;
    pointer-events: none;
    z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 移动端 ---------- */
  .backdrop {
    position: fixed;
    inset: var(--topbar-h) 0 0 0;
    background: rgba(0, 0, 0, .45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
    z-index: 35;
  }
  .backdrop.show { opacity: 1; visibility: visible; }

  @media (max-width: 900px) {
    .menu-btn { display: grid; }
    .logo span { display: none; }
    .search { max-width: none; }
    .sidebar {
      width: 282px;
      transform: translateX(-100%);
      transition: transform .22s ease;
      box-shadow: var(--shadow);
    }
    .sidebar.open { transform: none; }
    .content {
      margin-left: 0;
      padding: calc(var(--topbar-h) + 24px) 20px 80px;
    }
    .article h1 { font-size: 1.7rem; }
    .empty-state { padding: 48px 16px; }
    .empty-icon { font-size: 36px; }
    .editor-overlay { padding: 0; }
    .editor-panel { max-height: none; border-radius: 0; border: none; }
    .editor-main { flex-direction: column; }
    .editor-fields { flex-direction: column; gap: 8px; }
    .field:first-child { flex: 1; }
    .editor-hint { display: none; }
  }

  @media (max-width: 560px) {
    .search input { font-size: 13px; }
    .pager { flex-direction: column; }
    .editor-head strong { font-size: 14px; }
    .empty-actions { flex-direction: column; width: 100%; }
    .empty-actions .btn { justify-content: center; }
  }

  @media print {
    .topbar, .sidebar, .backdrop, .pager, .editor-overlay, .toast { display: none; }
    .content { margin: 0; padding: 0; }
  }
</style>
</head>
<body>

<!-- 脚本执行前的占位，正常会被替换掉 -->
<div id="boot"><span class="spin"></span>正在加载…</div>

<header class="topbar" hidden>
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录">☰</button>
  <a class="logo" href="#" id="logoLink">📚<span>我的 Wiki</span></a>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="搜索条目…（按 / 聚焦）" autocomplete="off">
  </div>
  <button class="icon-btn" id="editBtn" title="编辑当前条目（E）" aria-label="编辑当前条目">✏️</button>
  <button class="icon-btn" id="newBtn" title="新建条目（N）" aria-label="新建条目">＋</button>
  <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">🌙</button>
</header>

<aside class="sidebar" id="sidebar" hidden>
  <nav id="navList"></nav>

  <div class="file-card" id="fileCard">
    <div class="row">
      <span class="file-dot" id="fileDot"></span>
      <span class="file-name" id="fileName">浏览器本地存储</span>
      <button class="file-x" id="fileUnbind" title="断开数据文件" hidden>✕</button>
    </div>
    <div class="file-sub" id="fileSub">改动只保存在本机</div>
  </div>

  <div class="sidebar-tools">
    <button id="btnOpenFile" title="打开一个 JSON 文件作为数据源">📂 打开</button>

  <article class="article" id="article"></article>
</main>

<!-- ---------- 编辑器 ---------- -->
<div class="editor-overlay" id="editorOverlay" role="dialog" aria-modal="true">
  <div class="editor-panel">
    <div class="editor-head">

    </div>
  </div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. 全局安全网
   —— 任何未捕获的错误都写到控制台，不阻塞页面
   ============================================================ */
window.addEventListener('error', function (e) {
  console.warn('[wiki] 运行时错误：', e.message || e.error);
});
window.addEventListener('unhandledrejection', function (e) {
  console.warn('[wiki] 未处理的 Promise 拒绝：', e.reason);
});

/* ============================================================
   1. 配置
   ============================================================ */
var SITE_NAME  = '我的 Wiki';
var STORE_KEY  = 'wiki-articles';
var THEME_KEY  = 'wiki-theme';
var IDB_NAME   = 'wiki-fs';
var IDB_STORE  = 'handles';
var IDB_KEY    = 'dataFile';

/* 默认内容为空 —— 首次打开就是空知识库 */
var DEFAULT_ARTICLES = [];

/* ============================================================
   2. 安全的存储工具
   —— localStorage / IndexedDB 都可能在隐私模式、iframe、旧浏览器里失效
   ============================================================ */
var storage = {
  get: function (key) {
    try { return window.localStorage.getItem(key); }
    catch (e) { console.warn('[wiki] 读取 localStorage 失败：', e); return null; }
  },
  set: function (key, val) {
    try { window.localStorage.setItem(key, val); return true; }
    catch (e) { console.warn('[wiki] 写入 localStorage 失败：', e); return false; }
  },
  remove: function (key) {
    try { window.localStorage.removeItem(key); return true; }
    catch (e) { console.warn('[wiki] 删除 localStorage 失败：', e); return false; }
  }
};

var idbAvailable = (function () {
  try { return typeof window.indexedDB !== 'undefined' && window.indexedDB !== null; }
  catch (e) { return false; }
})();

function openDB() {
  return new Promise(function (resolve, reject) {
    if (!idbAvailable) { reject(new Error('IndexedDB 不可用')); return; }
    var req;
    try { req = window.indexedDB.open(IDB_NAME, 1); }
    catch (e) { reject(e); return; }

    req.onupgradeneeded = function () {
      try {
        if (!req.result.objectStoreNames.contains(IDB_STORE)) {
          req.result.createObjectStore(IDB_STORE);
        }
      } catch (e) { /* 忽略 */ }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror   = function () { reject(req.error || new Error('打开 IndexedDB 失败')); };
    req.onblocked = function () { reject(new Error('IndexedDB 被阻塞')); };
  });
}

function idbSet(key, val) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror    = function () { db.close(); reject(tx.error); };
      tx.onabort    = function () { db.close(); reject(tx.error); };
    });
  });
}

function idbGet(key) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(IDB_STORE, 'readonly');
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function () { db.close(); resolve(req.result); };
      req.onerror   = function () { db.close(); reject(req.error); };
    });
  });
}

function idbDel(key) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror    = function () { db.close(); reject(tx.error); };
    });
  });
}

/* 文件系统 API 运行时检测（不要放在模块顶层缓存） */
function canUseFileSystem() {
  try {
    return typeof window.showSaveFilePicker === 'function'
        && typeof window.showOpenFilePicker === 'function';
  } catch (e) { return false; }
}

/* ============================================================
   3. 通用工具
   ============================================================ */
function stripTags(html) {
  return String(html == null ? '' : html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function slugify(title) {
  var s = String(title || '').toLowerCase()
    .replace(/[^\w\u4e00-\u9fa5]+/g, '-')
    .replace(/^-+|-+$/g, '');
  return s || 'entry';
}

function makeUniqueId(title, used) {
  var set = used || new Set(articles.map(function (a) { return a.id; }));
  var base = slugify(title);
  var id = base, n = 2;
  while (set.has(id)) { id = base + '-' + n; n++; }
  set.add(id);
  return id;
}

/* 把任意来源的数据规范成合法条目数组，尽力容错 */
function normalizeList(input) {
  if (!Array.isArray(input)) return [];
  var used = new Set();
  var out = [];

  input.forEach(function (raw, i) {
    if (!raw || typeof raw !== 'object') return;
    var title = (typeof raw.title === 'string' && raw.title.trim())
      ? raw.title.trim()
      : ('未命名 ' + (i + 1));

    var id = String(raw.id || '').trim();
    if (!id || used.has(id)) id = makeUniqueId(title, used);
    else used.add(id);

    out.push({
      id: id,
      title: title,
      category: (typeof raw.category === 'string' && raw.category.trim())
        ? raw.category.trim() : '未分类',
      content: typeof raw.content === 'string' ? raw.content : ''
    });
  });

  return out;
}

/* 从 JSON 文本解析，出错抛异常（导入时用） */
function parseArticles(text) {
  var parsed = JSON.parse(text);
  if (!Array.isArray(parsed)) throw new Error('顶层结构必须是数组');

  var used = new Set();
  return parsed.map(function (raw, i) {
    if (!raw || typeof raw !== 'object') throw new Error('第 ' + (i + 1) + ' 项不是对象');
    if (typeof raw.title !== 'string' || !raw.title.trim()) {
      throw new Error('第 ' + (i + 1) + ' 项缺少 title');
    }
    var id = String(raw.id || '').trim();
    if (!id || used.has(id)) id = makeUniqueId(raw.title, used);
    else used.add(id);

    return {
      id: id,
      title: raw.title.trim(),
      category: (typeof raw.category === 'string' && raw.category.trim())
        ? raw.category.trim() : '未分类',
      content: typeof raw.content === 'string' ? raw.content : ''
    };
  });
}

/* ============================================================
   4. 加载数据（完全容错）
   ============================================================ */
var articles = (function () {
  var raw = storage.get(STORE_KEY);
  if (raw) {
    try {
      var parsed = JSON.parse(raw);
      var list = normalizeList(parsed);
      if (list.length || (Array.isArray(parsed) && parsed.length === 0)) return list;
    } catch (e) {
      console.warn('[wiki] 本地数据损坏，已忽略：', e);
    }
  }
  return normalizeList(DEFAULT_ARTICLES);
})();

/* ============================================================
   5. 全局状态
   ============================================================ */
var state = { currentId: null, query: '' };
var editing = null;

var fileHandle      = null;
var fileNeedsPerm   = false;
var fileWriting     = false;
var fileWriteQueued = false;

/* ============================================================
   6. DOM 引用
   ============================================================ */
var $ = function (id) { return document.getElementById(id); };

var bootEl           = $('boot');
var topbarEl         = document.querySelector('.topbar');
var sidebarEl        = $('sidebar');
var contentMainEl    = $('contentMain');
var backdropEl       = $('backdrop');

var navList          = $('navList');
var articleEl        = $('article');
var searchEl         = $('search');
var menuBtn          = $('menuBtn');
var themeBtn         = $('themeBtn');
var editBtn          = $('editBtn');
var newBtn           = $('newBtn');
var logoLink         = $('logoLink');
var toastEl          = $('toast');

var fileCard         = $('fileCard');
var fileDot          = $('fileDot');
var fileNameEl       = $('fileName');
var fileSubEl        = $('fileSub');
var fileUnbindBtn    = $('fileUnbind');
var btnOpenFile      = $('btnOpenFile');
var btnSaveAs        = $('btnSaveAs');
var btnExport        = $('btnExport');
var btnClearAll      = $('btnClearAll');
var fileInput        = $('fileInput');

var editorOverlay    = $('editorOverlay');
var editorHeading    = $('editorHeading');
var editorToolbar    = $('editorToolbar');
var editorMain       = $('editorMain');
var editorPreview    = $('editorPreview');
var editTitleInput   = $('editTitle');
var editCatInput     = $('editCategory');
var editContentEl    = $('editContent');
var categoryList     = $('categoryList');
var btnSave          = $('editorSave');
var btnCancel        = $('editorCancel');
var btnDelete        = $('editorDelete');
var btnClose         = $('editorClose');
var btnPreviewTgl    = $('editorPreviewToggle');

/* ============================================================
   7. 提示条
   ============================================================ */
var toastTimer = null;
function toast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
}

function flashSync() {
  if (!fileCard) return;
  fileCard.classList.remove('synced');
  void fileCard.offsetWidth;
  fileCard.classList.add('synced');
  setTimeout(function () { fileCard.classList.remove('synced'); }, 850);
}

/* ============================================================
   8. 持久化
   ============================================================ */
function persist(skipFile) {
  storage.set(STORE_KEY, JSON.stringify(articles));

  if (!skipFile && fileHandle && !fileNeedsPerm) {
    return writeToFile().then(function (ok) { if (ok) flashSync(); });
  }
  return Promise.resolve();
}

function writeToFile() {
  if (!fileHandle) return Promise.resolve(false);
  if (fileWriting) { fileWriteQueued = true; return Promise.resolve(true); }
  fileWriting = true;

  return Promise.resolve()
    .then(function () {
      if (!fileHandle) throw new Error('没有绑定的文件');
      var opts = { mode: 'readwrite' };

      if (typeof fileHandle.queryPermission === 'function') {
        return fileHandle.queryPermission(opts).then(function (perm) {
          if (perm === 'granted') return 'granted';
          if (typeof fileHandle.requestPermission === 'function') {
            return fileHandle.requestPermission(opts);
          }
          return perm;
        });
      }
      return 'granted';
    })
    .then(function (perm) {
      if (perm !== 'granted') {
        fileNeedsPerm = true;
        updateFileUI();
        toast('没有文件写入权限，点卡片重新授权');
        return false;
      }
      return fileHandle.createWritable().then(function (writable) {
        return writable.write(JSON.stringify(articles, null, 2))
          .then(function () { return writable.close(); });
      }).then(function () {
        fileNeedsPerm = false;
        updateFileUI();
        return true;
      });
    })
    .catch(function (err) {
      console.warn('[wiki] 写入文件失败：', err);
      toast('写入文件失败：' + (err && err.message ? err.message : err));
      return false;
    })
    .then(function (result) {
      fileWriting = false;
      if (fileWriteQueued) {
        fileWriteQueued = false;
        setTimeout(function () { writeToFile(); }, 0);
      }
      return result;
    });
}

/* ============================================================
   9. 数据源卡片 UI
   ============================================================ */
function updateFileUI() {
  if (!fileCard) return;
  var bound = !!fileHandle;

  fileDot.className = 'file-dot';
  fileCard.classList.remove('clickable');
  fileCard.onclick = null;

  if (!bound) {
    fileNameEl.textContent = '浏览器本地存储';
    fileSubEl.textContent = canUseFileSystem()
      ? '改动只保存在本机 · 点「另存」绑定 JSON'
      : '改动只保存在本机 · 点「导出」下载 JSON';
    fileUnbindBtn.hidden = true;
    btnOpenFile.textContent = '📂 打开';
    btnSaveAs.textContent   = '💾 另存';
    return;
  }

  fileNameEl.textContent = fileHandle.name || '数据文件';
  fileUnbindBtn.hidden = false;

  if (fileNeedsPerm) {
    fileDot.classList.add('warn');
    fileSubEl.textContent = '点击卡片重新授权';
    fileCard.classList.add('clickable');
    fileCard.onclick = function (e) {
      if (e.target.closest('#fileUnbind')) return;
      reconnectFile();
    };
  } else if (fileWriting) {
    fileDot.classList.add('on');
    fileSubEl.textContent = '正在写入…';
  } else {
    fileDot.classList.add('on');
    fileSubEl.textContent = '自动同步中';
  }

  btnOpenFile.textContent = '📂 换一个';
  btnSaveAs.textContent   = '💾 重绑';
}

/* ============================================================
   10. 文件操作
   ============================================================ */
function openFilePicker() {
  if (!canUseFileSystem()) { fileInput.click(); return; }

  window.showOpenFilePicker({
    types: [{ description: 'JSON 数据文件', accept: { 'application/json': ['.json'] } }],
    multiple: false
  }).then(function (handles) {
    var handle = handles && handles[0];
    if (!handle) return;

    return handle.getFile().then(function (file) {
      return file.text().then(function (text) {
        fileHandle = handle;
        fileNeedsPerm = false;
        return idbSet(IDB_KEY, handle).catch(function (e) { console.warn(e); })
          .then(function () {
            if (text.trim()) {
              var list = parseArticles(text);
              return applyArticles(list, { skipFile: true }).then(function () {
                return writeToFile();
              }).then(function () {
                toast('已打开「' + handle.name + '」· ' + list.length + ' 个条目');
              });
            }
            return writeToFile().then(function () {
              toast('已绑定空文件「' + handle.name + '」');
            });
          });
      });
    });
  }).catch(function (err) {
    if (err && err.name === 'AbortError') return;
    console.warn(err);
    alert('打开失败：' + (err && err.message ? err.message : err));
  }).then(function () {
    updateFileUI();
  });
}

function saveAsFilePicker() {
  if (!canUseFileSystem()) { downloadJSON('wiki-data.json'); return; }

  window.showSaveFilePicker({
    suggestedName: 'wiki-data.json',
    types: [{ description: 'JSON 数据文件', accept: { 'application/json': ['.json'] } }]
  }).then(function (handle) {
    if (!handle) return;
    fileHandle = handle;
    fileNeedsPerm = false;

    return idbSet(IDB_KEY, handle).catch(function (e) { console.warn(e); })
      .then(function () { return writeToFile(); })
      .then(function (ok) {
        updateFileUI();
        toast(ok ? '已绑定「' + handle.name + '」，之后自动同步' : '已绑定，但写入失败');
      });
  }).catch(function (err) {
    if (err && err.name === 'AbortError') return;
    console.warn(err);
    alert('保存失败：' + (err && err.message ? err.message : err));
  });
}

function reconnectFile() {
  if (!fileHandle) return;
  Promise.resolve()
    .then(function () {
      if (typeof fileHandle.requestPermission !== 'function') return 'granted';
      return fileHandle.requestPermission({ mode: 'readwrite' });
    })
    .then(function (perm) {
      if (perm !== 'granted') {
        toast('未授予权限，仍然只能保存在浏览器里');
        return;
      }
      fileNeedsPerm = false;
      updateFileUI();
      return writeToFile().then(function () {
        toast('已重新连接「' + fileHandle.name + '」');
      });
    })
    .catch(function (err) {
      console.warn(err);
      alert('重新连接失败：' + (err && err.message ? err.message : err));
    });
}

function disconnectFile() {
  if (!fileHandle) return;
  var name = fileHandle.name;
  fileHandle = null;
  fileNeedsPerm = false;
  idbDel(IDB_KEY).catch(function (e) { console.warn(e); });
  updateFileUI();
  toast('已断开「' + name + '」，文件保持原样');
}

function restoreFileHandle() {
  if (!canUseFileSystem() || !idbAvailable) { updateFileUI(); return Promise.resolve(); }

  return idbGet(IDB_KEY).then(function (handle) {
    if (!handle) { updateFileUI(); return; }
    fileHandle = handle;

    return Promise.resolve().then(function () {
      if (typeof handle.queryPermission !== 'function') return 'granted';
      return handle.queryPermission({ mode: 'readwrite' });
    }).then(function (perm) {
      if (perm === 'granted') {
        fileNeedsPerm = false;
        updateFileUI();
        return handle.getFile().then(function (file) {
          return file.text().then(function (text) {
            if (!text.trim()) return;
            try {
              var list = parseArticles(text);
              return applyArticles(list, { skipFile: true }).then(function () {
                toast('已从「' + handle.name + '」恢复');
              });
            } catch (e) {
              console.warn('[wiki] 恢复文件内容失败：', e);
            }
          });
        });
      } else {
        fileNeedsPerm = true;
        updateFileUI();
      }
    });
  }).catch(function (e) {
    console.warn('[wiki] 恢复文件句柄失败：', e);
    fileNeedsPerm = true;
    updateFileUI();
  });
}

/* ============================================================
   11. 应用数据
   ============================================================ */
function applyArticles(list, opts) {
  opts = opts || {};
  articles = normalizeList(list);

  var savePromise;
  if (opts.skipFile) {
    storage.set(STORE_KEY, JSON.stringify(articles));
    savePromise = Promise.resolve();
  } else {
    savePromise = persist(false);
  }

  renderNav();

  if (articles.length === 0) {
    try { history.replaceState(null, '', location.pathname + location.search); }
    catch (e) { /* 某些环境可能不允许，忽略 */ }
    renderEmpty();
    return savePromise;
  }

  var stillThere = articles.some(function (a) { return a.id === state.currentId; });
  if (stillThere) {
    refreshCurrent();
    setActiveNav();
  } else {
    var first = articles[0];
    try { history.replaceState(null, '', '#' + encodeURIComponent(first.id)); }
    catch (e) { location.hash = '#' + encodeURIComponent(first.id); }
    openArticle(first);
  }
  return savePromise;
}

/* ============================================================
   12. 侧边栏渲染
   ============================================================ */
function renderNav() {
  if (!navList) return;
  if (articles.length === 0) {
    navList.innerHTML = '<p class="nav-empty">还没有条目</p>';
    return;
  }

  var q = state.query.trim().toLowerCase();
  var groups = new Map();

  articles.forEach(function (a) {
    if (q) {
      var hay = (a.title + ' ' + a.category + ' ' + stripTags(a.content)).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }
    if (!groups.has(a.category)) groups.set(a.category, []);
    groups.get(a.category).push(a);
  });

  if (groups.size === 0) {
    navList.innerHTML = '<p class="nav-empty">没有匹配的条目</p>';
    return;
  }

  var html = '';
  groups.forEach(function (list, cat) {
    html += '<div class="nav-group">';
    html += '<div class="nav-group-title">' + esc(cat) + '</div>';
    list.forEach(function (a) {
      html += '<a class="nav-item' + (a.id === state.currentId ? ' active' : '') + '"'
           + ' href="#' + encodeURIComponent(a.id) + '"'
           + ' data-id="' + esc(a.id) + '">' + esc(a.title) + '</a>';
    });
    html += '</div>';
  });
  navList.innerHTML = html;
}

function setActiveNav() {
  if (!navList) return;
  var items = navList.querySelectorAll('.nav-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('active', items[i].getAttribute('data-id') === state.currentId);
  }
}

/* ============================================================
   13. 正文渲染
   ============================================================ */
function renderArticle(a) {
  if (!articleEl || !a) return;
  var chars = stripTags(a.content).length;
  var minutes = Math.max(1, Math.round(chars / 280));

  articleEl.innerHTML =
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="meta">' +
      esc(a.category) + ' · 约 ' + minutes + ' 分钟读完' +
      '<a class="edit-link" data-action="edit" href="javascript:void(0)">编辑</a>' +
    '</div>' +
    '<div class="article-body">' + (a.content || '') + '</div>';

  var i = articles.indexOf(a);
  var prev = i > 0 ? articles[i - 1] : null;
  var next = i > -1 && i < articles.length - 1 ? articles[i + 1] : null;

  if (prev || next) {
    var pager = document.createElement('div');
    pager.className = 'pager';
    pager.innerHTML =
      (prev
        ? '<a class="prev" href="#' + encodeURIComponent(prev.id) + '">' +
            '<div class="dir">← 上一篇</div><div class="t">' + esc(prev.title) + '</div>' +
          '</a>'
        : '<span class="spacer"></span>') +
      (next
        ? '<a class="next" href="#' + encodeURIComponent(next.id) + '">' +
            '<div class="dir">下一篇 →</div><div class="t">' + esc(next.title) + '</div>' +
          '</a>'
        : '<span class="spacer"></span>');
    articleEl.appendChild(pager);
  }

  try { document.title = a.title + ' · ' + SITE_NAME; }
  catch (e) { /* 忽略 */ }
}

function renderEmpty() {
  if (!articleEl) return;
  state.currentId = null;

  var fileHint = fileHandle
    ? '当前已绑定数据文件 <strong>' + esc(fileHandle.name) + '</strong>，新建的条目会自动写入其中。'
    : (canUseFileSystem()
        ? '新建的条目会先保存在浏览器本地。想让改动同步到 JSON 文件，点左下角的「另存」。'
        : '新建的条目会保存在浏览器本地。可以用左下角的「导出」下载为 JSON 备份。');

  articleEl.innerHTML =
    '<div class="empty-state">' +
      '<div class="empty-icon">📖</div>' +
      '<h1>开始你的第一篇条目</h1>' +
      '<p class="lead">知识库还是空的。新建一篇，或者打开已有的 JSON 数据文件继续编辑。</p>' +
      '<div class="empty-actions">' +
        '<button class="btn primary" data-action="new">＋ 新建条目</button>' +
        '<button class="btn" data-action="open">📂 打开 JSON 文件</button>' +
      '</div>' +
      '<div class="empty-tips">' +
        '<h3>小提示</h3>' +
        '<ul>' +
          '<li>按 <kbd>N</kbd> 快速新建，按 <kbd>E</kbd> 编辑当前条目</li>' +
          '<li>按 <kbd>/</kbd> 聚焦搜索框，按 <kbd>Esc</kbd> 清空或关闭面板</li>' +
          '<li>' + fileHint + '</li>' +
        '</ul>' +
      '</div>' +
    '</div>';

  try { document.title = SITE_NAME; } catch (e) {}
}

function refreshCurrent() {
  var a = articles.find(function (x) { return x.id === state.currentId; });
  if (a) renderArticle(a);
}

/* ============================================================
   14. 路由
   ============================================================ */
function openArticle(a, scroll) {
  if (!a) return;
  state.currentId = a.id;
  setActiveNav();
  renderArticle(a);
  closeSidebar();
  if (scroll !== false) {
    try { window.scrollTo(0, 0); } catch (e) {}
  }
}

function onHashChange() {
  if (articles.length === 0) {
    renderEmpty();
    renderNav();
    return;
  }

  var id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); }
  catch (e) { id = location.hash.slice(1); }

  var found = articles.find(function (a) { return a.id === id; });

  if (!found) {
    var first = articles[0];
    try { history.replaceState(null, '', '#' + encodeURIComponent(first.id)); }
    catch (e) { location.hash = '#' + encodeURIComponent(first.id); }
    openArticle(first);
    return;
  }
  openArticle(found);
}

/* ============================================================
   15. 侧边栏抽屉 / 主题
   ============================================================ */
function openSidebar() {
  if (!sidebarEl || !backdropEl) return;
  sidebarEl.classList.add('open');
  backdropEl.classList.add('show');
}
function closeSidebar() {
  if (!sidebarEl || !backdropEl) return;
  sidebarEl.classList.remove('open');
  backdropEl.classList.remove('show');
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  if (themeBtn) {
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    themeBtn.title = t === 'dark' ? '切换到浅色' : '切换到深色';
  }
}

var currentTheme = (function () {
  var stored = storage.get(THEME_KEY);
  if (stored === 'dark' || stored === 'light') return stored;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      return 'dark';
    }
  } catch (e) {}
  return 'light';
})();

/* ============================================================
   16. 编辑器
   ============================================================ */
var TOOLS = [
  { label: 'H2', title: '二级标题', wrap: ['<h2>', '</h2>'] },
  { label: 'H3', title: '三级标题', wrap: ['<h3>', '</h3>'] },
  { label: 'B',  title: '加粗',     wrap: ['<strong>', '</strong>'] },
  { label: 'I',  title: '斜体',     wrap: ['<em>', '</em>'] },
  { label: '🔗', title: '链接',     wrap: ['<a href="https://">', '</a>'] },
  { label: '•',  title: '无序列表', wrap: ['<ul>\n  <li>', '</li>\n</ul>'] },
  { label: '1.', title: '有序列表', wrap: ['<ol>\n  <li>', '</li>\n</ol>'] },
  { label: '</>', title: '行内代码', wrap: ['<code>', '</code>'] },
  { label: '{ }', title: '代码块',  wrap: ['<pre><code>', '</code></pre>'] },
  { label: '❝',  title: '引用',     wrap: ['<blockquote>\n  ', '\n</blockquote>'] },
  { label: '💡', title: '提示框',   wrap: ['<div class="callout">\n  <div>', '</div>\n</div>'] },
  { label: '▦',  title: '表格',     snippet:
      '<table>\n  <thead>\n    <tr><th>列 1</th><th>列 2</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>内容</td><td>内容</td></tr>\n  </tbody>\n</table>' }
];

function buildToolbar() {
  if (!editorToolbar) return;
  var html = '';
  TOOLS.forEach(function (t, i) {
    html += '<button type="button" data-tool="' + i + '" title="' + esc(t.title) + '">'
          + esc(t.label) + '</button>';
  });
  editorToolbar.innerHTML = html;
}

function wrapSelection(before, after) {
  if (!editContentEl) return;
  var ta = editContentEl;
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var selected = ta.value.slice(start, end);
  ta.setRangeText(before + selected + after, start, end, 'end');
  if (!selected) {
    var pos = start + before.length;
    ta.setSelectionRange(pos, pos);
  }
}

function insertSnippet(text) {
  if (!editContentEl) return;
  var ta = editContentEl;
  ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
}

function syncPreview() {
  if (editorMain && editorMain.classList.contains('preview-on') && editorPreview && editContentEl) {
    editorPreview.innerHTML = editContentEl.value;
  }
}

function openEditor(article) {
  if (!editorOverlay) return;

  if (article) {
    editing = {
      id: article.id,
      title: article.title,
      category: article.category,
      content: article.content,
      isNew: false
    };
    editorHeading.textContent = '编辑条目';
    btnDelete.style.display = '';
  } else {
    editing = { id: '', title: '', category: '', content: '', isNew: true };
    editorHeading.textContent = '新建条目';
    btnDelete.style.display = 'none';
  }

  editTitleInput.value = editing.title;
  editCatInput.value = editing.category;
  editContentEl.value = editing.content;

  var cats = [];
  articles.forEach(function (a) {
    if (a.category && cats.indexOf(a.category) === -1) cats.push(a.category);
  });
  categoryList.innerHTML = cats.map(function (c) {
    return '<option value="' + esc(c) + '"></option>';
  }).join('');

  editorOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(function () { try { editTitleInput.focus(); } catch (e) {} }, 40);
}

function closeEditor() {
  if (!editorOverlay) return;
  editorOverlay.classList.remove('show');
  editorMain.classList.remove('preview-on');
  btnPreviewTgl.classList.remove('active');
  editorPreview.innerHTML = '';
  document.body.style.overflow = '';
  editing = null;
}

function saveEditor() {
  if (!editing) return;

  var title = editTitleInput.value.trim();
  var category = editCatInput.value.trim() || '未分类';
  var content = editContentEl.value;

  if (!title) {
    toast('标题不能为空');
    try { editTitleInput.focus(); } catch (e) {}
    return;
  }

  if (editing.isNew) {
    var id = makeUniqueId(title);
    articles.push({ id: id, title: title, category: category, content: content });
    persist(false).then(function () {
      renderNav();
      closeEditor();
      location.hash = '#' + encodeURIComponent(id);
      toast('已创建「' + title + '」');
    });
    return;
  }

  var idx = -1;
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].id === editing.id) { idx = i; break; }
  }
  if (idx === -1) { closeEditor(); return; }

  articles[idx] = {
    id: articles[idx].id,
    title: title,
    category: category,
    content: content
  };

  persist(false).then(function () {
    renderNav();
    refreshCurrent();
    closeEditor();
    toast('已保存');
  });
}

function deleteCurrent() {
  if (!editing || editing.isNew) return;
  if (!confirm('确定删除「' + editing.title + '」吗？此操作不可撤销。')) return;

  var idx = -1;
  for (var i = 0; i < articles.length; i++) {
    if (articles[i].id === editing.id) { idx = i; break; }
  }
  if (idx > -1) articles.splice(idx, 1);

  var wasCurrent = state.currentId === editing.id;
  var deletedTitle = editing.title;
  persist(false).then(function () {
    closeEditor();
    renderNav();

    if (articles.length === 0) {
      try { history.replaceState(null, '', location.pathname + location.search); }
      catch (e) {}
      renderEmpty();
    } else if (wasCurrent) {
      var fallback = articles[Math.min(idx, articles.length - 1)];
      location.hash = '#' + encodeURIComponent(fallback.id);
    }
    toast('已删除「' + deletedTitle + '」');
  });
}

/* ============================================================
   17. 导入 / 导出
   ============================================================ */
function downloadJSON(filename) {
  try {
    var blob = new Blob([JSON.stringify(articles, null, 2)], {
      type: 'application/json;charset=utf-8'
    });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename || ('wiki-' + new Date().toISOString().slice(0, 10) + '.json');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  } catch (e) {
    console.warn(e);
    alert('导出失败：' + e.message);
  }
}

/* ============================================================
   18. 绑定所有事件
   ============================================================ */
function bindEvents() {
  /* 搜索 */
  searchEl.addEventListener('input', function (e) {
    state.query = e.target.value || '';
    renderNav();
  });

  /* 导航点击 */
  navList.addEventListener('click', function (e) {
    var link = e.target.closest('.nav-item');
    if (!link) return;
    if (state.query) {
      state.query = '';
      searchEl.value = '';
      renderNav();
    }
    if (window.innerWidth <= 900) closeSidebar();
  });

  /* 抽屉 */
  menuBtn.addEventListener('click', function () {
    if (sidebarEl.classList.contains('open')) closeSidebar();
    else openSidebar();
  });
  backdropEl.addEventListener('click', closeSidebar);

  /* 主题 */
  themeBtn.addEventListener('click', function () {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(currentTheme);
    storage.set(THEME_KEY, currentTheme);
  });

  /* logo 回到第一篇 */
  logoLink.addEventListener('click', function (e) {
    e.preventDefault();
    if (articles.length === 0) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {}
      renderEmpty();
      closeSidebar();
    } else {
      location.hash = '#' + encodeURIComponent(articles[0].id);
    }
  });

  /* 顶栏按钮 */
  editBtn.addEventListener('click', function () {
    var current = articles.find(function (a) { return a.id === state.currentId; });
    if (current) openEditor(current);
    else if (articles.length) openEditor(articles[0]);
    else openEditor(null);
  });

  newBtn.addEventListener('click', function () {
    var current = articles.find(function (a) { return a.id === state.currentId; });
    openEditor(null);
    if (current) editCatInput.value = current.category;
  });

  /* 正文区按钮（事件委托） */
  articleEl.addEventListener('click', function (e) {
    var actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    var action = actionEl.getAttribute('data-action');
    if (action === 'edit') {
      var current = articles.find(function (a) { return a.id === state.currentId; });
      if (current) openEditor(current);
    } else if (action === 'new') {
      openEditor(null);
    } else if (action === 'open') {
      btnOpenFile.click();
    }
  });

  /* 编辑器工具栏 */
  editorToolbar.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tool]');
    if (!btn) return;
    var tool = TOOLS[parseInt(btn.getAttribute('data-tool'), 10)];
    if (!tool) return;
    if (tool.snippet) insertSnippet(tool.snippet);
    else wrapSelection(tool.wrap[0], tool.wrap[1]);
    try { editContentEl.focus(); } catch (err) {}
    syncPreview();
  });

  editContentEl.addEventListener('input', syncPreview);

  editContentEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    var ta = editContentEl;
    ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');
    syncPreview();
  });

  btnPreviewTgl.addEventListener('click', function () {
    var on = editorMain.classList.toggle('preview-on');
    btnPreviewTgl.classList.toggle('active', on);
    if (on) syncPreview();
  });

  btnSave.addEventListener('click', saveEditor);
  btnCancel.addEventListener('click', closeEditor);
  btnClose.addEventListener('click', closeEditor);
  btnDelete.addEventListener('click', deleteCurrent);

  /* 数据源按钮 */
  btnOpenFile.addEventListener('click', function () {
    openFilePicker();
  });

  btnSaveAs.addEventListener('click', function () {
    saveAsFilePicker();
  });

  fileUnbindBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    disconnectFile();
  });

  /* 降级：input[type=file] 读取 */
  fileInput.addEventListener('change', function () {
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      try {
        var list = parseArticles(String(reader.result));
        if (articles.length && !confirm('载入将覆盖当前的 ' + articles.length + ' 个条目，继续吗？')) return;
        applyArticles(list);
        toast('已载入 ' + list.length + ' 个条目（只读模式）');
      } catch (err) {
        alert('载入失败：' + err.message);
      }
    };
    reader.onerror = function () { alert('读取文件失败'); };
    reader.readAsText(file, 'utf-8');
  });

  /* 导出 */
  btnExport.addEventListener('click', function () {
    if (articles.length === 0) { toast('还没有内容可以导出'); return; }
    downloadJSON('wiki-' + new Date().toISOString().slice(0, 10) + '.json');
    toast('已导出 ' + articles.length + ' 个条目');
  });

  /* 清空 */
  btnClearAll.addEventListener('click', function () {
    if (articles.length === 0) { toast('已经是空的了'); return; }
    var tip = fileHandle
      ? '将删除全部 ' + articles.length + ' 个条目，并把空结果写入「' + fileHandle.name + '」。确定吗？'
      : '将删除全部 ' + articles.length + ' 个条目。确定吗？';
    if (!confirm(tip)) return;
    applyArticles([], {}).then(function () { toast('已清空'); });
  });

  /* 快捷键 */
  document.addEventListener('keydown', function (e) {
    if (editorOverlay.classList.contains('show')) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeEditor();
      } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveEditor();
      }
      return;
    }

    var tag = document.activeElement && document.activeElement.tagName;
    var typing = tag === 'INPUT' || tag === 'TEXTAREA';

    if (e.key === '/' && !typing) {
      e.preventDefault();
      searchEl.focus();
      searchEl.select();
      return;
    }

    if (e.key === 'Escape') {
      if (document.activeElement === searchEl && (searchEl.value || state.query)) {
        searchEl.value = '';
        state.query = '';
        renderNav();
      } else {
        try { searchEl.blur(); } catch (err) {}
        closeSidebar();
      }
      return;
    }

    if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var k = e.key.toLowerCase();
      if (k === 'e') { e.preventDefault(); editBtn.click(); }
      else if (k === 'n') { e.preventDefault(); newBtn.click(); }
    }
  });

  /* 离开前提醒编辑器未保存 */
  window.addEventListener('beforeunload', function (e) {
    if (editorOverlay.classList.contains('show')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

/* ============================================================
   19. 启动
   ============================================================ */
function boot() {
  /* 隐藏占位，显示界面 */
  if (bootEl) bootEl.parentNode.removeChild(bootEl);
  if (topbarEl) topbarEl.hidden = false;
  if (sidebarEl) sidebarEl.hidden = false;
  if (backdropEl) backdropEl.hidden = false;
  if (contentMainEl) contentMainEl.hidden = false;

  applyTheme(currentTheme);
  buildToolbar();
  bindEvents();
  updateFileUI();
  renderNav();
  onHashChange();

  window.addEventListener('hashchange', onHashChange);

  /* 异步恢复文件句柄，失败也不影响页面 */
  restoreFileHandle().catch(function (e) {
    console.warn('[wiki] 恢复文件句柄失败：', e);
  });
}

/* 用 try/catch 包住整个启动流程，万一初始化出错也能给出提示 */
try {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
} catch (e) {
  console.error('[wiki] 启动失败：', e);
  var bootFallback = document.getElementById('boot');
  if (bootFallback) {
    bootFallback.innerHTML =
      '页面初始化失败：' + (e && e.message ? e.message : e) +
      '<br><br>请打开浏览器控制台查看详细错误。';
  }
}
</script>
</body>
</html>
