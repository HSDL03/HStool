<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>我的 Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fff;--bg2:#f6f8fa;--bgh:#eef1f4;--text:#1f2328;--muted:#59636e;--bd:#d1d9e0;--ac:#0969da;--acs:#ddf4ff;--dgr:#cf222e;--ok:#1a7f37;--warn:#d4a72c;--cbg:#f6f8fa;--sh:0 8px 24px rgba(31,35,40,.12);--th:56px;--sw:260px;--r:8px}
[data-theme=dark]{--bg:#0d1117;--bg2:#161b22;--bgh:#21262d;--text:#e6edf3;--muted:#9198a1;--bd:#30363d;--ac:#4493f8;--acs:#16233a;--dgr:#f85149;--ok:#3fb950;--cbg:#161b22;--sh:0 8px 24px rgba(0,0,0,.5)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
#boot{padding:120px 24px;text-align:center;color:var(--muted);font-size:14px}
.spin{display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:-3px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--th);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--bd);z-index:50}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap}
.search{position:relative;flex:1;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:36px;padding:0 12px 0 34px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.icon{display:grid;place-items:center;width:36px;height:36px;flex:none;font-size:15px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.icon:hover{background:var(--bgh);color:var(--text)}
.icon.active{background:var(--acs);color:var(--ac)}
.menu{display:none}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;font-family:inherit;font-weight:600;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:6px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--bgh)}
.btn:active{transform:translateY(1px)}
.btn.p{color:#fff;background:var(--ac);border-color:var(--ac)}
.btn.p:hover{filter:brightness(1.08)}
.btn.d{color:var(--dgr)}
.btn.d:hover{background:rgba(207,34,46,.1)}

/* 侧栏 */
.sidebar{position:fixed;top:var(--th);bottom:0;left:0;width:var(--sw);display:flex;flex-direction:column;padding:16px 12px 12px;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--bd);z-index:40}
#navList{flex:1;min-height:0}
.grp+.grp{margin-top:20px}
.grp-t{padding:0 10px 6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.nav-i{display:block;padding:6px 10px;font-size:14px;color:var(--text);text-decoration:none;border-radius:6px;transition:background .12s,color .12s}
.nav-i:hover{background:var(--bgh)}
.nav-i.active{background:var(--acs);color:var(--ac);font-weight:600}
.nav-e{padding:8px 10px;font-size:13.5px;color:var(--muted)}

/* 卡片 */
.card{margin-top:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;font-size:12.5px;transition:border-color .15s}
.card.click{cursor:pointer;border-color:var(--ac)}
.card.click:hover{background:var(--bgh)}
.row{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--muted);transition:background .2s,box-shadow .2s}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(26,127,55,.18)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(212,167,44,.22)}
.dot.busy{background:var(--ac);box-shadow:0 0 0 3px var(--acs);animation:pls 1s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.4}}
.cname{flex:1;min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:12px;font-family:inherit;color:var(--muted);background:none;border:none;border-radius:4px;cursor:pointer}
.cx:hover{background:var(--bgh);color:var(--text)}
.csub{margin-top:3px;font-size:11.5px;color:var(--muted)}
.cacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cacts button{padding:5px 4px;font-size:11.5px;font-family:inherit;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:5px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.cacts button:hover{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.cacts button:disabled{opacity:.5;cursor:not-allowed}
@keyframes fl{0%{background:rgba(26,127,55,.22)}100%{background:var(--bg)}}
.card.synced{animation:fl .8s ease-out}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tools button{padding:7px 4px;font-size:12px;font-family:inherit;color:var(--muted);background:transparent;border:1px solid var(--bd);border-radius:6px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.tools button:hover{color:var(--text);background:var(--bgh);border-color:var(--muted)}

/* 内容 */
.content{margin-left:var(--sw);padding:calc(var(--th) + 36px) 32px 96px;min-height:100vh}
.art{max-width:820px;margin:0 auto}
.art h1{margin:0 0 6px;font-size:2rem;line-height:1.25}
.art .meta{margin-bottom:26px;padding-bottom:16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--bd)}
.art .meta .edit{float:right;color:var(--ac);cursor:pointer;text-decoration:none}
.art .meta .edit:hover{text-decoration:underline}
.ab h2{margin:38px 0 14px;padding-bottom:7px;font-size:1.32rem;border-bottom:1px solid var(--bd)}
.ab h3{margin:26px 0 8px;font-size:1.1rem}
.ab p{margin:0 0 16px}
.ab ul,.ab ol{margin:0 0 16px;padding-left:1.5em}
.ab li{margin:4px 0}
.ab a{color:var(--ac)}
.ab strong{font-weight:650}
.ab code{padding:.15em .4em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875em;background:var(--cbg);border-radius:4px}
.ab pre{margin:0 0 18px;padding:14px 16px;overflow-x:auto;background:var(--cbg);border:1px solid var(--bd);border-radius:var(--r)}
.ab pre code{padding:0;font-size:13.5px;background:none}
.ab table{width:100%;margin:0 0 18px;border-collapse:collapse;font-size:14.5px}
.ab th,.ab td{padding:8px 12px;text-align:left;border:1px solid var(--bd)}
.ab th{background:var(--bg2);font-weight:650}
.ab> :first-child{margin-top:0}
.callout{display:flex;gap:10px;margin:0 0 18px;padding:12px 16px;font-size:14.5px;background:var(--bg2);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r)}
.callout::before{content:"💡"}
.callout p:last-child{margin-bottom:0}

/* 空状态 */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 24px}
.empty-i{font-size:44px;line-height:1;margin-bottom:18px;opacity:.85}
.empty h1{margin:0 0 8px;font-size:1.6rem}
.empty .lead{max-width:480px;margin:0 0 28px;font-size:15px;color:var(--muted)}
.empty-a{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:40px}
.empty-t{max-width:560px;width:100%;text-align:left;padding:16px 20px;font-size:14px;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r)}
.empty-t h3{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.empty-t ul{margin:0;padding-left:1.3em}
.empty-t li{margin:5px 0}
.empty-t kbd{padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px}

/* 翻页 */
.pager{display:flex;gap:12px;margin-top:52px;padding-top:24px;border-top:1px solid var(--bd)}
.pager a{flex:1;padding:12px 16px;color:var(--text);text-decoration:none;border:1px solid var(--bd);border-radius:var(--r);transition:border-color .15s,background .15s}
.pager a:hover{background:var(--bg2);border-color:var(--ac)}
.pager .dir{font-size:12px;color:var(--muted)}
.pager .t{font-size:14.5px;font-weight:600}
.pager .next{text-align:right}
.pager .sp{flex:1}

/* 遮罩 & 面板 */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:1080px;height:100%;max-height:780px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden;transform:translateY(10px) scale(.99);transition:transform .2s}
.ov.show .pnl{transform:none}
.pnl.sm{max-width:540px;height:auto;max-height:calc(100vh - 48px)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.ph strong{font-size:15px}
.ph .sp{flex:1}
.pf{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.fld{display:flex;flex-direction:column;gap:4px;flex:1}
.fld:first-child{flex:2}
.fld span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input{height:34px;padding:0 10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.tb button{min-width:32px;height:30px;padding:0 8px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:5px;cursor:pointer;transition:color .12s,border-color .12s,background .12s}
.tb button:hover{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.pmain{display:flex;gap:12px;flex:1;min-height:0;padding:12px 16px}
.pmain textarea{flex:1;min-width:0;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);resize:none;outline:none;tab-size:2}
.pmain textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.pprev{flex:1;min-width:0;padding:12px 16px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);display:none;font-size:15px}
.pmain.pv .pprev{display:block}
.pfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bd)}
.pfoot .sp{flex:1}
.phint{font-size:12px;color:var(--muted)}

/* GH 配置 */
.ghb{padding:16px;overflow-y:auto}
.ghb .fld+.fld{margin-top:12px}
.ghh{margin-top:14px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:6px}
.ghh a{color:var(--ac)}
.ghh code{padding:1px 4px;font-size:11.5px;background:var(--bg);border-radius:3px;border:1px solid var(--bd)}
.ghh label{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text);cursor:pointer}
.ghh input[type=checkbox]{cursor:pointer}

/* 提示 */
.toast{position:fixed;left:50%;bottom:28px;max-width:calc(100vw - 40px);padding:10px 20px;font-size:14px;color:var(--bg);background:var(--text);border-radius:8px;box-shadow:var(--sh);opacity:0;transform:translateX(-50%) translateY(12px);transition:opacity .22s,transform .22s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 移动端 */
.bd{position:fixed;inset:var(--th) 0 0 0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:35}
.bd.show{opacity:1;visibility:visible}
@media(max-width:900px){
  .menu{display:grid}
  .logo span{display:none}
  .search{max-width:none}
  .sidebar{width:282px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh)}
  .sidebar.open{transform:none}
  .content{margin-left:0;padding:calc(var(--th) + 24px) 20px 80px}
  .art h1{font-size:1.7rem}
  .empty{padding:48px 16px}
  .ov{padding:0}
  .pnl{max-height:none;border-radius:0;border:none}
  .pnl.sm{max-height:none}
  .pmain{flex-direction:column}
  .pf{flex-direction:column;gap:8px}
  .fld:first-child{flex:1}
  .phint{display:none}
}
@media(max-width:560px){
  .search input{font-size:13px}
  .pager{flex-direction:column}
  .empty-a{flex-direction:column;width:100%}
  .empty-a .btn{justify-content:center}
}
@media print{
  .topbar,.sidebar,.bd,.pager,.ov,.toast{display:none}
  .content{margin:0;padding:0}
}
</style>
</head>
<body>

<div id="boot"><span class="spin"></span>正在加载…</div>

<header class="topbar" hidden>
  <button class="icon menu" id="menuBtn" aria-label="打开目录">☰</button>
  <a class="logo" href="#" id="logoLink">📚<span>我的 Wiki</span></a>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="搜索条目…（按 / 聚焦）" autocomplete="off">
  </div>
  <button class="icon" id="editBtn" title="编辑当前条目（E）">✏️</button>
  <button class="icon" id="newBtn" title="新建条目（N）">＋</button>
  <button class="icon" id="themeBtn" title="切换主题">🌙</button>
</header>

<aside class="sidebar" id="sidebar" hidden>
  <nav id="navList"></nav>

  <div class="card" id="cloudCard">
    <div class="row">
      <span class="dot" id="cloudDot"></span>
      <span class="cname" id="cloudName">未连接云端</span>
      <button class="cx" id="cloudCfgBtn" title="配置 GitHub 云端同步">⚙</button>
    </div>
    <div class="csub" id="cloudSub">用 GitHub Token 同步到仓库</div>
    <div class="cacts" id="cloudActs" hidden>
      <button id="btnPush" title="把当前内容提交到仓库">⬆ 推送</button>
      <button id="btnPull" title="从仓库读取内容覆盖本地">⬇ 拉取</button>
    </div>
  </div>

  <div class="tools">
    <button id="btnExport" title="下载当前全部条目为 JSON">⬇ 导出</button>
    <button id="btnImport" title="从 JSON 文件导入条目">📂 导入</button>
    <button id="btnClear" title="清空所有条目">🗑 清空</button>
    <button id="btnAutoPull" title="打开页面时自动从云端拉取最新数据" style="grid-column:span 2">🔄 自动拉取：开</button>
  </div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</aside>
<div class="bd" id="bd" hidden></div>

<main class="content" id="main" hidden>
  <article class="art" id="art"></article>
</main>

<!-- 条目编辑器 -->
<div class="ov" id="edOv">
  <div class="pnl">
    <div class="ph">
      <strong id="edTitle">新建条目</strong>
      <span class="sp"></span>
      <button class="icon" id="edPrevBtn" title="切换预览">👁</button>
      <button class="icon" id="edClose" title="关闭（Esc）">✕</button>
    </div>
    <div class="pf">
      <label class="fld"><span>标题</span><input id="edT" type="text" placeholder="条目标题" autocomplete="off"></label>
      <label class="fld"><span>分类</span><input id="edC" type="text" placeholder="如：CSS" list="catList" autocomplete="off"></label>
      <datalist id="catList"></datalist>
    </div>
    <div class="tb" id="edTb"></div>
    <div class="pmain" id="edMain">
      <textarea id="edContent" spellcheck="false" placeholder="正文，支持 HTML…"></textarea>
      <div class="pprev ab" id="edPrev"></div>
    </div>
    <div class="pfoot">
      <button class="btn d" id="edDel">删除条目</button>
      <span class="sp"></span>
      <span class="phint">Ctrl / ⌘ + S 保存</span>
      <button class="btn" id="edCancel">取消</button>
      <button class="btn p" id="edSave">保存</button>
    </div>
  </div>
</div>

<!-- GitHub 配置 -->
<div class="ov" id="ghOv">
  <div class="pnl sm">
    <div class="ph">
      <strong>连接 GitHub 云端</strong>
      <span class="sp"></span>
      <button class="icon" id="ghClose">✕</button>
    </div>
    <div class="ghb">
      <label class="fld"><span>Personal Access Token</span><input id="ghToken" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false"></label>
      <label class="fld"><span>Owner（用户名或组织）</span><input id="ghOwner" type="text" placeholder="HSDL03" autocomplete="off" spellcheck="false"></label>
      <label class="fld"><span>仓库名 Repo</span><input id="ghRepo" type="text" placeholder="HSwiki" autocomplete="off" spellcheck="false"></label>
      <label class="fld"><span>数据文件路径</span><input id="ghPath" type="text" placeholder="wiki-data.json" autocomplete="off" spellcheck="false"></label>
      <label class="fld"><span>分支 Branch</span><input id="ghBranch" type="text" placeholder="main" autocomplete="off" spellcheck="false"></label>

      <div class="ghh">
        <strong>Token 怎么建？</strong><br>
        打开 <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a> →
        生成新令牌 → Repository access 选 <code>Only select repositories</code> 勾选本仓库 →
        Permissions 加 <code>Contents: Read and write</code> → 生成后复制。<br>
        Token 只保存在你本机浏览器，不会上传。
        <label><input type="checkbox" id="ghAutoPush"> 保存后自动推送到云端</label>
        <label><input type="checkbox" id="ghAutoPull" checked> 打开页面时自动拉取最新数据</label>
      </div>
    </div>
    <div class="pfoot">
      <button class="btn d" id="ghDisconn" hidden>断开连接</button>
      <span class="sp"></span>
      <button class="btn" id="ghCancel">取消</button>
      <button class="btn p" id="ghSave">保存并连接</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. 安全网
   ============================================================ */
window.addEventListener('error', function(e){ console.warn('[wiki]', e.message || e.error); });
window.addEventListener('unhandledrejection', function(e){ console.warn('[wiki]', e.reason); });

/* ============================================================
   1. 常量
   ============================================================ */
var SITE_NAME = '我的 Wiki';
var K_ART = 'wiki-articles';
var K_THEME = 'wiki-theme';
var K_GH = 'wiki-gh';

/* ============================================================
   2. 安全存储
   ============================================================ */
var storage = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del: function(k){ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } }
};

/* ============================================================
   3. 工具
   ============================================================ */
function stripTags(h){ return String(h==null?'':h).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function slug(t){ var s=String(t||'').toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,''); return s||'entry'; }
function uniqId(t, used){
  var set = used || new Set(articles.map(function(a){ return a.id; }));
  var b = slug(t), id = b, n = 2;
  while (set.has(id)) { id = b+'-'+n; n++; }
  set.add(id);
  return id;
}
function normList(arr){
  if (!Array.isArray(arr)) return [];
  var used = new Set(), out = [];
  arr.forEach(function(r, i){
    if (!r || typeof r !== 'object') return;
    var t = (typeof r.title==='string' && r.title.trim()) ? r.title.trim() : ('未命名 '+(i+1));
    var id = String(r.id||'').trim();
    if (!id || used.has(id)) id = uniqId(t, used); else used.add(id);
    out.push({
      id: id, title: t,
      category: (typeof r.category==='string' && r.category.trim()) ? r.category.trim() : '未分类',
      content: typeof r.content==='string' ? r.content : ''
    });
  });
  return out;
}
function parseList(text){
  var p = JSON.parse(text);
  if (!Array.isArray(p)) throw new Error('顶层必须是数组');
  return normList(p);
}
function b64enc(s){
  var b = new TextEncoder().encode(String(s)), bin = '';
  for (var i=0;i<b.length;i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(String(b64).replace(/\s/g,''));
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var toastTimer = null;
function toast(m){
  if (!toastEl) return;
  toastEl.textContent = m;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}
function flashCard(el){
  if (!el) return;
  el.classList.remove('synced');
  void el.offsetWidth;
  el.classList.add('synced');
  setTimeout(function(){ el.classList.remove('synced'); }, 850);
}

/* ============================================================
   8. GitHub 同步
   ============================================================ */
function ghUrl(){
  return 'https://api.github.com/repos/'
    + encodeURIComponent(gh.owner) + '/'
    + encodeURIComponent(gh.repo) + '/contents/'
    + gh.path.split('/').map(encodeURIComponent).join('/');
}
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + gh.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

function pushCloud(silent){
  if (!gh || !gh.token) { toast('请先配置云端连接'); return Promise.resolve(false); }
  if (ghBusy) return Promise.resolve(false);
  ghBusy = true; updateCloudUI();

  var api = ghUrl();
  var branch = gh.branch || 'main';

  return fetch(api + '?ref=' + encodeURIComponent(branch), { headers: ghHeaders() })
    .then(function(r){
      if (r.status === 404) return null;
      if (!r.ok) return r.json().catch(function(){return{};}).then(function(e){ throw new Error(e.message || ('HTTP '+r.status)); });
      return r.json();
    })
    .then(function(info){
      var body = {
        message: '更新 wiki 数据 ' + new Date().toISOString().slice(0,19).replace('T',' '),
        content: b64enc(JSON.stringify(articles, null, 2)),
        branch: branch
      };
      if (info && info.sha) body.sha = info.sha;

      var h = ghHeaders();
      h['Content-Type'] = 'application/json';

      return fetch(api, { method: 'PUT', headers: h, body: JSON.stringify(body) })
        .then(function(r){
          if (!r.ok) return r.json().catch(function(){return{};}).then(function(e){ throw new Error(e.message || ('HTTP '+r.status)); });
          return r.json();
        });
    })
    .then(function(){
      ghBusy = false; updateCloudUI(); flashCard(cloudCard);
      if (!silent) toast('已推送到云端 · ' + articles.length + ' 个条目');
      return true;
    })
    .catch(function(err){
      ghBusy = false; updateCloudUI();
      console.warn('[wiki] 推送失败', err);
      if (!silent) toast('推送失败：' + err.message);
      return false;
    });
}

function pullCloud(silent){
  if (!gh || !gh.token) { toast('请先配置云端连接'); return Promise.resolve(false); }
  if (ghBusy) return Promise.resolve(false);
  ghBusy = true; updateCloudUI();

  var api = ghUrl();
  var branch = gh.branch || 'main';

  return fetch(api + '?ref=' + encodeURIComponent(branch), { headers: ghHeaders() })
    .then(function(r){
      if (r.status === 404) throw new Error('云端还没有这个文件，请先推送一次');
      if (!r.ok) return r.json().catch(function(){return{};}).then(function(e){ throw new Error(e.message || ('HTTP '+r.status)); });
      return r.json();
    })
    .then(function(info){
      var text = b64dec(info.content || '');
      var list = parseList(text);
      ghBusy = false;
      return applyArticles(list).then(function(){
        updateCloudUI(); flashCard(cloudCard);
        if (!silent) toast('已从云端拉取 ' + articles.length + ' 个条目');
        return true;
      });
    })
    .catch(function(err){
      ghBusy = false; updateCloudUI();
      console.warn('[wiki] 拉取失败', err);
      if (!silent) toast('拉取失败：' + err.message);
      return false;
    });
}

function updateCloudUI(){
  var conn = !!(gh && gh.token);
  cloudDot.className = 'dot';

  if (!conn) {
    cloudName.textContent = '未连接云端';
    cloudSub.textContent = '点 ⚙ 配置 GitHub Token';
    cloudActs.hidden = true;
    btnAutoPull.textContent = '🔄 自动拉取：关';
    return;
  }

  cloudName.textContent = gh.owner + '/' + gh.repo;
  cloudSub.textContent = (gh.path || 'wiki-data.json') + ' @ ' + (gh.branch || 'main');
  cloudActs.hidden = false;
  btnAutoPull.textContent = '🔄 自动拉取：' + (gh.autoPull !== false ? '开' : '关');

  if (ghBusy) {
    cloudDot.classList.add('busy');
    cloudSub.textContent = '同步中…';
    btnPush.disabled = true;
    btnPull.disabled = true;
  } else {
    cloudDot.classList.add('on');
    btnPush.disabled = false;
    btnPull.disabled = false;
  }
}

/* ============================================================
   10. 应用数据
   ============================================================ */
function applyArticles(list){
  articles = normList(list);
  persist();
  renderNav();

  if (articles.length === 0) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    renderEmpty();
    return Promise.resolve();
  }

  var exists = articles.some(function(a){ return a.id === state.currentId; });
  if (exists) {
    refreshCurrent(); setActiveNav();
  } else {
    var first = articles[0];
    try { history.replaceState(null, '', '#' + encodeURIComponent(first.id)); }
    catch(e){ location.hash = '#' + encodeURIComponent(first.id); }
    openArticle(first);
  }
  return Promise.resolve();
}

/* ============================================================
   11. 侧栏
   ============================================================ */
function renderNav(){
  if (articles.length === 0) {
    navList.innerHTML = '<p class="nav-e">还没有条目</p>';
    return;
  }

  var q = state.query.trim().toLowerCase();
  var grps = new Map();

  articles.forEach(function(a){
    if (q) {
      var hay = (a.title + ' ' + a.category + ' ' + stripTags(a.content)).toLowerCase();
      if (hay.indexOf(q) === -1) return;
    }
    if (!grps.has(a.category)) grps.set(a.category, []);
    grps.get(a.category).push(a);
  });

  if (grps.size === 0) {
    navList.innerHTML = '<p class="nav-e">没有匹配的条目</p>';
    return;
  }

  var html = '';
  grps.forEach(function(list, cat){
    html += '<div class="grp"><div class="grp-t">' + esc(cat) + '</div>';
    list.forEach(function(a){
      html += '<a class="nav-i' + (a.id === state.currentId ? ' active' : '') + '"'
            + ' href="#' + encodeURIComponent(a.id) + '"'
            + ' data-id="' + esc(a.id) + '">' + esc(a.title) + '</a>';
    });
    html += '</div>';
  });
  navList.innerHTML = html;
}

function setActiveNav(){
  var items = navList.querySelectorAll('.nav-i');
  for (var i=0;i<items.length;i++) {
    items[i].classList.toggle('active', items[i].getAttribute('data-id') === state.currentId);
  }
}

function renderArticle(a){
  if (!a) return;
  var mins = Math.max(1, Math.round(stripTags(a.content).length / 280));

  artEl.innerHTML =
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="meta">' +
      esc(a.category) + ' · 约 ' + mins + ' 分钟读完' +
      '<a class="edit" data-action="edit" href="javascript:void(0)">编辑</a>' +
    '</div>' +
    '<div class="ab">' + (a.content || '') + '</div>';

  var i = articles.indexOf(a);
  var prev = i > 0 ? articles[i-1] : null;
  var next = i > -1 && i < articles.length-1 ? articles[i+1] : null;

  if (prev || next) {
    var p = document.createElement('div');
    p.className = 'pager';
    p.innerHTML =
      (prev
        ? '<a href="#' + encodeURIComponent(prev.id) + '"><div class="dir">← 上一篇</div><div class="t">' + esc(prev.title) + '</div></a>'
        : '<span class="sp"></span>') +
      (next
        ? '<a class="next" href="#' + encodeURIComponent(next.id) + '"><div class="dir">下一篇 →</div><div class="t">' + esc(next.title) + '</div></a>'
        : '<span class="sp"></span>');
    artEl.appendChild(p);
  }

  try { document.title = a.title + ' · ' + SITE_NAME; } catch(e){}
}

function renderEmpty(){
  state.currentId = null;
  var hint = (gh && gh.token)
    ? '已连接云端 <strong>' + esc(gh.owner + '/' + gh.repo) + '</strong>，编辑保存后会自动同步。'
    : '知识库还是空的。新建一篇，或点 ⚙ 配置 GitHub 云端同步。';

  artEl.innerHTML =
    '<div class="empty">' +
      '<div class="empty-i">📖</div>' +
      '<h1>开始你的第一篇条目</h1>' +
      '<p class="lead">' + hint + '</p>' +
      '<div class="empty-a">' +
        '<button class="btn p" data-action="new">＋ 新建条目</button>' +
        '<button class="btn" data-action="pull">⬇ 从云端拉取</button>' +
      '</div>' +
      '<div class="empty-t">' +
        '<h3>快捷键</h3>' +
        '<ul>' +
          '<li>按 <kbd>N</kbd> 新建，按 <kbd>E</kbd> 编辑当前条目</li>' +
          '<li>按 <kbd>/</kbd> 聚焦搜索，按 <kbd>Esc</kbd> 关闭面板</li>' +
        '</ul>' +
      '</div>' +
    '</div>';

  try { document.title = SITE_NAME; } catch(e){}
}

function refreshCurrent(){
  var a = articles.find(function(x){ return x.id === state.currentId; });

}

function openArticle(a, scroll){
  if (!a) return;
  state.currentId = a.id;
  setActiveNav();
  renderArticle(a);
  closeSidebar();
  if (scroll !== false) { try { window.scrollTo(0,0); } catch(e){} }
}

function onHash(){
  if (articles.length === 0) { renderEmpty(); renderNav(); return; }
  var id = '';
  try { id = decodeURIComponent(location.hash.slice(1)); }
  catch(e){ id = location.hash.slice(1); }

  var found = articles.find(function(a){ return a.id === id; });
  if (!found) {
    var first = articles[0];
    try { history.replaceState(null, '', '#' + encodeURIComponent(first.id)); }
    catch(e){ location.hash = '#' + encodeURIComponent(first.id); }
    openArticle(first);
    return;
  }
  openArticle(found);
}

function wrapSel(a, b){
  var ta = edContent, s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  ta.setRangeText(a + sel + b, s, e, 'end');
  if (!sel) { var p = s + a.length; ta.setSelectionRange(p, p); }
}
function syncPreview(){
  if (edMain.classList.contains('pv')) edPrev.innerHTML = edContent.value;
}

function openEditor(a){
  if (a) {
    editing = { id: a.id, title: a.title, category: a.category, content: a.content, isNew: false };
    edTitle.textContent = '编辑条目';
    edDel.style.display = '';
  } else {
    editing = { id: '', title: '', category: '', content: '', isNew: true };
    edTitle.textContent = '新建条目';
    edDel.style.display = 'none';
  }
  edT.value = editing.title;
  edC.value = editing.category;
  edContent.value = editing.content;

  var cats = [];
  articles.forEach(function(x){ if (x.category && cats.indexOf(x.category) === -1) cats.push(x.category); });
  catList.innerHTML = cats.map(function(c){ return '<option value="' + esc(c) + '"></option>'; }).join('');

  edOv.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ try { edT.focus(); } catch(e){} }, 40);
}

function closeEditor(){
  edOv.classList.remove('show');
  edMain.classList.remove('pv');
  edPrevBtn.classList.remove('active');
  edPrev.innerHTML = '';
  if (!ghOv.classList.contains('show')) document.body.style.overflow = '';
  editing = null;
}

function saveEditor(){
  if (!editing) return;
  var t = edT.value.trim();
  var c = edC.value.trim() || '未分类';
  var content = edContent.value;

  if (!t) { toast('标题不能为空'); try { edT.focus(); } catch(e){} return; }

  if (editing.isNew) {
    var id = uniqId(t);
    articles.push({ id: id, title: t, category: c, content: content });
  } else {
    var idx = -1;
    for (var i=0;i<articles.length;i++) if (articles[i].id === editing.id) { idx = i; break; }
    if (idx === -1) { closeEditor(); return; }
    articles[idx] = { id: articles[idx].id, title: t, category: c, content: content };
  }

  persist();
  renderNav();
  closeEditor();

  if (editing && !editing.isNew) {
    refreshCurrent();
  } else {
    location.hash = '#' + encodeURIComponent(articles[articles.length-1].id);
  }

  toast('已保存');

  /* 自动推送 */
  if (gh && gh.token && gh.autoPush) {
    pushCloud(true).then(function(ok){
      if (ok) toast('已保存并同步到云端');
    });
  }
}

function deleteCurrent(){
  if (!editing || editing.isNew) return;
  if (!confirm('确定删除「' + editing.title + '」吗？')) return;

  var idx = -1;
  for (var i=0;i<articles.length;i++) if (articles[i].id === editing.id) { idx = i; break; }
  if (idx > -1) articles.splice(idx, 1);

  var was = state.currentId === editing.id;
  persist(); closeEditor(); renderNav();

  if (articles.length === 0) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
    renderEmpty();
  } else if (was) {
    var fb = articles[Math.min(idx, articles.length-1)];
    location.hash = '#' + encodeURIComponent(fb.id);
  }
  toast('已删除');

  if (gh && gh.token && gh.autoPush) pushCloud(true);
}

function guessDefaults(){
  var m = (location.hostname || '').match(/^([^.]+)\.github\.io$/i);
  var owner = m ? m[1] : '';
  var repo = (location.pathname.split('/').filter(Boolean)[0]) || '';
  return { owner: owner, repo: repo };
}

function openGhModal(){
  var d = guessDefaults();
  ghToken.value = gh ? (gh.token || '') : '';
  ghOwner.value = (gh && gh.owner) || d.owner;
  ghRepo.value  = (gh && gh.repo)  || d.repo;
  ghPath.value  = (gh && gh.path)  || 'wiki-data.json';
  ghBranch.value= (gh && gh.branch)|| 'main';
  ghAutoPush.checked = gh ? !!gh.autoPush : false;
  ghAutoPull.checked = gh ? (gh.autoPull !== false) : true;
  ghDisconn.hidden = !gh;
  ghOv.classList.add('show');
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ try { ghToken.focus(); } catch(e){} }, 40);
}
function closeGhModal(){
  ghOv.classList.remove('show');
  if (!edOv.classList.contains('show')) document.body.style.overflow = '';
}

   17. 事件绑定
   ============================================================ */
function bind(){
  searchEl.addEventListener('input', function(e){
    state.query = e.target.value || '';
    renderNav();
  });

  navList.addEventListener('click', function(e){
    var l = e.target.closest('.nav-i');
    if (!l) return;
    if (state.query) { state.query = ''; searchEl.value = ''; renderNav(); }
    if (window.innerWidth <= 900) closeSidebar();
  });

  menuBtn.addEventListener('click', function(){
    if (sidebarEl.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  bdEl.addEventListener('click', closeSidebar);

  themeBtn.addEventListener('click', function(){
    curTheme = curTheme === 'dark' ? 'light' : 'dark';
    applyTheme(curTheme);
    storage.set(K_THEME, curTheme);
  });

  logoLink.addEventListener('click', function(e){
    e.preventDefault();
    if (articles.length === 0) {
      try { history.replaceState(null, '', location.pathname + location.search); } catch(err){}
      renderEmpty(); closeSidebar();
    } else {
      location.hash = '#' + encodeURIComponent(articles[0].id);
    }
  });

  editBtn.addEventListener('click', function(){
    var cur = articles.find(function(a){ return a.id === state.currentId; });
    if (cur) openEditor(cur);
    else if (articles.length) openEditor(articles[0]);
    else openEditor(null);
  });

  newBtn.addEventListener('click', function(){
    var cur = articles.find(function(a){ return a.id === state.currentId; });
    openEditor(null);
    if (cur) edC.value = cur.category;
  });

  artEl.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var act = el.getAttribute('data-action');
    if (act === 'edit') {
      var cur = articles.find(function(a){ return a.id === state.currentId; });
      if (cur) openEditor(cur);
    } else if (act === 'new') {
      openEditor(null);
    } else if (act === 'pull') {
      if (!gh || !gh.token) { toast('请先配置云端'); openGhModal(); return; }
      pullCloud(false);
    }
  });

  /* 编辑器 */
  edTb.addEventListener('click', function(e){
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    var t = TOOLS[parseInt(b.getAttribute('data-t'), 10)];
    if (t) { wrapSel(t.w[0], t.w[1]); try { edContent.focus(); } catch(err){} syncPreview(); }
  });
  edContent.addEventListener('input', syncPreview);
  edContent.addEventListener('keydown', function(e){
    if (e.key !== 'Tab') return;
    e.preventDefault();
    var ta = edContent;
    ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');
    syncPreview();
  });
  edPrevBtn.addEventListener('click', function(){
    var on = edMain.classList.toggle('pv');
    edPrevBtn.classList.toggle('active', on);
    if (on) syncPreview();
  });
  edSave.addEventListener('click', saveEditor);
  edCancel.addEventListener('click', closeEditor);
  edClose.addEventListener('click', closeEditor);
  edDel.addEventListener('click', deleteCurrent);

  /* 云端卡片 */
  cloudCfgBtn.addEventListener('click', function(e){ e.stopPropagation(); openGhModal(); });
  btnPush.addEventListener('click', function(){ pushCloud(false); });
  btnPull.addEventListener('click', function(){ pullCloud(false); });

  /* 工具栏 */
  btnExport.addEventListener('click', function(){
    if (articles.length === 0) { toast('还没有内容'); return; }
    try {
      var blob = new Blob([JSON.stringify(articles, null, 2)], { type: 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'wiki-' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast('已导出 ' + articles.length + ' 个条目');
    } catch(err) { alert('导出失败：' + err.message); }
  });

  btnImport.addEventListener('click', function(){ fileInput.click(); });

  fileInput.addEventListener('change', function(){
    var f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var list = parseList(String(r.result));
        if (articles.length && !confirm('载入将覆盖当前的 ' + articles.length + ' 个条目，继续吗？')) return;
        applyArticles(list);
        toast('已载入 ' + list.length + ' 个条目');
      } catch(err) { alert('载入失败：' + err.message); }
    };
    r.readAsText(f, 'utf-8');
  });

  btnClear.addEventListener('click', function(){
    if (articles.length === 0) { toast('已经是空的了'); return; }
    if (!confirm('将删除全部 ' + articles.length + ' 个条目，确定吗？')) return;
    applyArticles([]);
    toast('已清空');
    if (gh && gh.token && gh.autoPush) pushCloud(true);
  });

  btnAutoPull.addEventListener('click', function(){
    if (!gh || !gh.token) { toast('请先配置云端'); openGhModal(); return; }
    gh.autoPull = !(gh.autoPull !== false);
    storage.set(K_GH, JSON.stringify(gh));
    updateCloudUI();
    toast('打开页面时自动拉取：' + (gh.autoPull ? '已开启' : '已关闭'));
  });

  /* GH 弹窗 */
  ghClose.addEventListener('click', closeGhModal);
  ghCancel.addEventListener('click', closeGhModal);
  ghSave.addEventListener('click', function(){
    var token = ghToken.value.trim();
    var owner = ghOwner.value.trim();
    var repo = ghRepo.value.trim();
    var path = ghPath.value.trim() || 'wiki-data.json';
    var branch = ghBranch.value.trim() || 'main';

    if (!token) { toast('请填写 Token'); return; }
    if (!owner || !repo) { toast('请填写 Owner 和 Repo'); return; }

    gh = { token: token, owner: owner, repo: repo, path: path, branch: branch,
           autoPush: ghAutoPush.checked, autoPull: ghAutoPull.checked };
    storage.set(K_GH, JSON.stringify(gh));
    updateCloudUI();
    closeGhModal();
    toast('已连接，正在拉取云端数据…');
    pullCloud(true).then(function(ok){
      if (ok) toast('已连接云端并同步完成');
      else toast('已连接，但拉取失败（首次使用可以先推送）');
    });
  });
  ghDisconn.addEventListener('click', function(){
    if (!confirm('断开云端连接？本地数据不受影响。')) return;
    gh = null;
    storage.del(K_GH);
    updateCloudUI();
    closeGhModal();
    toast('已断开云端');
  });

  /* 快捷键 */
  document.addEventListener('keydown', function(e){
    if (edOv.classList.contains('show')) {
      if (e.key === 'Escape') { e.preventDefault(); closeEditor(); }
      else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveEditor(); }
      return;
    }
    if (ghOv.classList.contains('show')) {
      if (e.key === 'Escape') { e.preventDefault(); closeGhModal(); }
      return;
    }

    var tag = document.activeElement && document.activeElement.tagName;
    var typing = tag === 'INPUT' || tag === 'TEXTAREA';

    if (e.key === '/' && !typing) { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
    if (e.key === 'Escape') {
      if (document.activeElement === searchEl && (searchEl.value || state.query)) {
        searchEl.value = ''; state.query = ''; renderNav();
      } else { try { searchEl.blur(); } catch(err){} closeSidebar(); }
      return;
    }
    if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      var k = e.key.toLowerCase();
      if (k === 'e') { e.preventDefault(); editBtn.click(); }
      else if (k === 'n') { e.preventDefault(); newBtn.click(); }
    }
  });

  window.addEventListener('beforeunload', function(e){
    if (edOv.classList.contains('show')) { e.preventDefault(); e.returnValue = ''; }
  });
}

/* ============================================================
   18. 启动
   ============================================================ */
function boot(){
  if (bootEl && bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
  topbarEl.hidden = false;
  sidebarEl.hidden = false;
  mainEl.hidden = false;
  bdEl.hidden = false;

  applyTheme(curTheme);
  buildToolbar();
  bind();
  updateCloudUI();
  renderNav();
  onHash();
  window.addEventListener('hashchange', onHash);

  /* 自动拉取：有配置且开启了自动拉取 */
  if (gh && gh.token && gh.autoPull !== false) {
    setTimeout(function(){
      pullCloud(true).then(function(ok){
        if (ok) toast('已从云端同步最新数据');
      });
    }, 300);
  } else if (!gh || !gh.token) {
    /* 首次访问：引导配置 */
    var seen = storage.get('wiki-seen');
    if (!seen) {
      storage.set('wiki-seen', '1');
      setTimeout(function(){
        toast('点侧栏 ⚙ 配置 GitHub Token 即可云端同步');
      }, 800);
    }
  }
}

try {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
} catch(e){
  console.error('[wiki] 启动失败', e);
  var b = document.getElementById('boot');
  if (b) b.innerHTML = '初始化失败：' + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
