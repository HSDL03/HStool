<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSwiki · 导航</title>
<script>
try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--panel:#f7f8fa;--card:#fff;--text:#16191d;--dim:#697386;
  --line:#e6e8ec;--accent:#3b6ef6;--accent-soft:#eef3ff;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
html[data-theme=dark]{
  --bg:#0e1116;--panel:#151a21;--card:#1a2029;--text:#e7eaf0;--dim:#8a94a6;
  --line:#242b36;--accent:#5b8cff;--accent-soft:#1a2438;--sh:0 1px 3px rgba(0,0,0,.5);
}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit;color:inherit}

header{
  position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:14px;
  padding:0 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.logo i{width:23px;height:23px;border-radius:7px;display:block;
  background:linear-gradient(135deg,var(--accent),#8b5cf6)}
.search{flex:1;max-width:400px;position:relative}
.search input{
  width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);outline:none;transition:.15s;font-size:14px;
}
.search input:focus{border-color:var(--accent);background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;
  color:var(--dim);transition:.15s;flex:none}
.icon-btn:hover{background:var(--panel);color:var(--text)}

main{max-width:1080px;margin:0 auto;padding:34px 20px 60px}
.hero{margin-bottom:26px}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--dim);font-size:13.5px;margin-top:5px}
.hero b{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;display:flex;gap:14px;transition:.18s;box-shadow:var(--sh);
}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:active{transform:none}
.c-icon{
  width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-size:23px;color:#fff;font-weight:800;overflow:hidden;
}
.c-icon img{width:100%;height:100%;object-fit:cover}
.c-icon .letter{font-size:20px;letter-spacing:-.5px}
.c-body{flex:1;min-width:0}
.c-name{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:7px}
.c-name .file{font-size:11px;font-weight:500;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);padding:1px 6px;border-radius:5px;flex:none}
.c-desc{font-size:13px;color:var(--dim);margin:6px 0 9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-tags{display:flex;flex-wrap:wrap;gap:6px}
.c-tags span{font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  padding:1px 8px;border-radius:99px}

.skeleton{height:104px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(90deg,var(--panel) 25%,var(--card) 37%,var(--panel) 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

.state{text-align:center;padding:70px 20px;color:var(--dim);font-size:14px}
.state button{margin-top:14px;padding:7px 18px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:13.5px;font-weight:600}

@media(max-width:640px){
  main{padding:22px 14px 40px}
  .grid{grid-template-columns:1fr}
  .logo span{display:none}
  .hero h1{font-size:22px}
}
</style>
</head>
<body>

<header>
  <div class="logo"><i></i><span>HSwiki</span></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="搜索页面…" autocomplete="off">
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeBtn" title="切换主题"></button>
</header>

<main>
  <div class="hero">
    <h1>站点导航</h1>
    <p id="stat">正在读取仓库…</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
/* ============ 配置 ============ */
const REPO     = 'HSDL03/HSwiki';
const BRANCHES = ['main', 'master'];
const RAW      = b => `https://raw.githubusercontent.com/${REPO}/${b}`;
const API      = b => `https://api.github.com/repos/${REPO}/contents/?ref=${b}`;

/* ============ 状态 ============ */
let apps = [];
let keyword = '';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ 读取 apps.json ============ */
async function loadMeta(){
  for (const b of BRANCHES){
    try{
      const r = await fetch(`${RAW(b)}/apps.json?t=${Date.now()}`, {cache:'no-store'});
      if (r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}

/* ============ 读取仓库 html 文件列表 ============ */
async function loadFiles(){
  for (const b of BRANCHES){
    try{
      const r = await fetch(API(b), {
        cache:'no-store',
        headers:{ 'Accept':'application/vnd.github+json' }
      });
      if (!r.ok) continue;
      const arr = await r.json();
      if (!Array.isArray(arr)) continue;
      return arr
        .filter(f => f.type === 'file' && /\.html?$/i.test(f.name))
        .map(f => f.name);
    }catch(e){}
  }
  return null;
}

/* ============ 合并元数据 ============ */
function merge(files, meta){
  const map = new Map();
  (meta?.apps || []).forEach(a => { if (a && a.file) map.set(a.file, a); });

  // 优先用仓库真实文件列表，取不到就用 json 里声明的
  let list = (files && files.length) ? files : [...map.keys()];
  // 把 json 里有、但仓库列表没返回的也补上
  map.forEach((_, f) => { if (!list.includes(f)) list.push(f); });

  const exclude = new Set(['index.html', ...(meta?.exclude || [])]);

  return list
    .filter(f => !exclude.has(f))
    .map(f => {
      const m = map.get(f) || {};
      return {
        file:  f,
        name:  m.name  || f.replace(/\.html?$/i, ''),
        desc:  m.desc  || '暂无介绍',
        icon:  m.icon  || '',
        color: m.color || '#3b6ef6',
        tags:  Array.isArray(m.tags) ? m.tags : [],
        order: typeof m.order === 'number' ? m.order : 999,
        hidden: !!m.hidden
      };
    })
    .filter(a => !a.hidden)
    .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'zh'));
}

/* ============ 图标 ============ */
function iconHTML(a){
  if (/^https?:\/\//i.test(a.icon))
    return `<img src="${esc(a.icon)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc((a.name[0]||'?'))}'))">`;
  if (a.icon) return esc(a.icon);
  return `<span class="letter">${esc((a.name.trim()[0] || '?').toUpperCase())}</span>`;
}

/* ============ 渲染 ============ */
function render(){
  const grid = $('#grid');
  const kw = keyword.trim().toLowerCase();

  const list = kw
    ? apps.filter(a =>
        a.name.toLowerCase().includes(kw) ||
        a.desc.toLowerCase().includes(kw) ||
        a.file.toLowerCase().includes(kw) ||
        a.tags.some(t => t.toLowerCase().includes(kw)))
    : apps;

  $('#stat').innerHTML = kw
    ? `匹配到 <b>${list.length}</b> 个页面`
    : `共 <b>${apps.length}</b> 个页面`;

  if (!list.length){
    grid.innerHTML = `<div class="state" style="grid-column:1/-1">没有匹配的页面</div>`;
    return;
  }

  grid.innerHTML = list.map(a => `
    <a class="card" href="${esc(a.file)}">
      <div class="c-icon" style="background:${esc(a.color)}">${iconHTML(a)}</div>
      <div class="c-body">
        <div class="c-name">${esc(a.name)}<span class="file">${esc(a.file)}</span></div>
        <p class="c-desc">${esc(a.desc)}</p>
        ${a.tags.length ? `<div class="c-tags">${a.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      </div>
    </a>`).join('');
}

function renderSkeleton(){
  $('#grid').innerHTML = Array.from({length:6}, () => '<div class="skeleton"></div>').join('');
}

function renderError(msg){
  $('#stat').textContent = '读取失败';
  $('#grid').innerHTML = `
    <div class="state" style="grid-column:1/-1">
      ${esc(msg)}<br>
      <button onclick="boot()">重新加载</button>
    </div>`;
}

/* ============ 主题 ============ */
function renderThemeBtn(){
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = dark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
}

$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch(e){}
  renderThemeBtn();
};

/* ============ 搜索 ============ */
$('#q').addEventListener('input', e => { keyword = e.target.value; render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'Escape'){ keyword = ''; $('#q').value = ''; render(); $('#q').blur(); }
});

/* ============ 启动 ============ */
async function boot(){
  renderSkeleton();
  $('#stat').textContent = '正在读取仓库…';

  const [meta, files] = await Promise.all([loadMeta(), loadFiles()]);

  if (!files && !meta){
    renderError('无法读取仓库内容，请检查网络或仓库是否公开。');
    return;
  }

  apps = merge(files, meta);

  if (!apps.length){
    renderError('仓库里没有可展示的页面。');
    return;
  }

  render();
}

renderThemeBtn();
boot();
</script>
</body>
</html>
