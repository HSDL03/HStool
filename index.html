<!DOCTYPE html>
<html lang="zh-CN" data-theme="github-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
/* ===== 主题 ===== */
:root,[data-theme="github-light"]{
  --bg:#fff;--bg2:#f6f8fa;--bg3:#eef1f4;--text:#1f2328;--muted:#59636e;
  --bd:#d1d9e0;--bd2:#a0a8b0;--ac:#0969da;--acs:#ddf4ff;--dgr:#cf222e;
  --ok:#1a7f37;--warn:#d4a72c;--cbg:#f6f8fa;
  --sh:0 8px 24px rgba(31,35,40,.12);--r:8px;
  --blob1:rgba(9,105,218,.16);--blob2:rgba(163,113,247,.14);--blob3:rgba(219,112,147,.12);
  --grid:rgba(31,35,40,.028);
  --bevel:none;--bevel-in:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-active-bg:var(--acs);--nav-active-fg:var(--ac);
  --btn-bg:var(--bg2);--btn-fg:var(--text);--btn-bd:var(--bd);
  --btn-primary-bg:var(--ac);--btn-primary-fg:#fff;
  --h1-border:none;--h2-bg:transparent;--h2-fg:var(--text);
  --particle:9,105,218;
  --tile-accent:linear-gradient(135deg,#0969da,#a371f7);
  --hero-grad:linear-gradient(135deg,#0969da 0%,#a371f7 50%,#db7093 100%);
}
[data-theme="github-dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#e6edf3;--muted:#9198a1;
  --bd:#30363d;--bd2:#484f58;--ac:#4493f8;--acs:#16233a;--dgr:#f85149;
  --ok:#3fb950;--warn:#d4a72c;--cbg:#161b22;
  --sh:0 8px 24px rgba(0,0,0,.5);--r:8px;
  --blob1:rgba(68,147,248,.14);--blob2:rgba(163,113,247,.12);--blob3:rgba(219,112,147,.08);
  --grid:rgba(230,237,243,.028);
  --bevel:none;--bevel-in:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-active-bg:var(--acs);--nav-active-fg:var(--ac);
  --btn-bg:var(--bg2);--btn-fg:var(--text);--btn-bd:var(--bd);
  --btn-primary-bg:var(--ac);--btn-primary-fg:#fff;
  --h1-border:none;--h2-bg:transparent;--h2-fg:var(--text);
  --particle:68,147,248;
  --tile-accent:linear-gradient(135deg,#4493f8,#a371f7);
  --hero-grad:linear-gradient(135deg,#4493f8 0%,#a371f7 50%,#db7093 100%);
}
[data-theme="mc-wiki"]{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--dgr:#a02020;
  --ok:#2d7a2d;--warn:#b08800;--cbg:#f0ecd8;
  --sh:4px 4px 0 rgba(0,0,0,.25);--r:2px;
  --blob1:rgba(61,82,31,.14);--blob2:rgba(106,140,60,.10);--blob3:rgba(180,150,80,.08);
  --grid:rgba(61,82,31,.045);
  --bevel:inset -2px -2px 0 rgba(0,0,0,.22),inset 2px 2px 0 rgba(255,255,255,.65);
  --bevel-in:inset 2px 2px 0 rgba(0,0,0,.22),inset -2px -2px 0 rgba(255,255,255,.65);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-active-bg:#3d521f;--nav-active-fg:#fff;
  --btn-bg:linear-gradient(180deg,#e8e2cc,#c8c2ac);
  --btn-fg:#1f1f1f;--btn-bd:#4a4a3a;
  --btn-primary-bg:linear-gradient(180deg,#7a9c3c,#56682c);
  --btn-primary-fg:#fff;
  --h1-border:3px solid #3d521f;
  --h2-bg:linear-gradient(180deg,#7a9c3c,#56682c);--h2-fg:#fff;
  --particle:61,82,31;
  --tile-accent:linear-gradient(135deg,#7a9c3c,#3d521f);
  --hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
}
[data-theme="mc-night"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#303030;--text:#e0e0e0;--muted:#909090;
  --bd:#505050;--bd2:#808080;--ac:#8ec44a;--acs:#2a3a1a;--dgr:#e05050;
  --ok:#5ab05a;--warn:#d4a72c;--cbg:#202020;
  --sh:4px 4px 0 rgba(0,0,0,.6);--r:2px;
  --blob1:rgba(142,196,74,.08);--blob2:rgba(90,140,60,.06);--blob3:rgba(120,90,40,.06);
  --grid:rgba(255,255,255,.025);
  --bevel:inset -2px -2px 0 rgba(0,0,0,.5),inset 2px 2px 0 rgba(255,255,255,.08);
  --bevel-in:inset 2px 2px 0 rgba(0,0,0,.5),inset -2px -2px 0 rgba(255,255,255,.08);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-active-bg:#3d521f;--nav-active-fg:#e8ffd0;
  --btn-bg:linear-gradient(180deg,#303030,#202020);
  --btn-fg:#e0e0e0;--btn-bd:#606060;
  --btn-primary-bg:linear-gradient(180deg,#5a7a2c,#3d521f);
  --btn-primary-fg:#e8ffd0;
  --h1-border:3px solid #8ec44a;
  --h2-bg:linear-gradient(180deg,#5a7a2c,#3d521f);--h2-fg:#e8ffd0;
  --particle:142,196,74;
  --tile-accent:linear-gradient(135deg,#8ec44a,#3d521f);
  --hero-grad:linear-gradient(135deg,#8ec44a 0%,#5a7a2c 100%);
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}

/* ===== 背景 ===== */
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.b1{width:460px;height:460px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 28s ease-in-out infinite}
.b2{width:520px;height:520px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 34s ease-in-out infinite}
.b3{width:360px;height:360px;background:var(--blob3);top:38%;left:52%;animation:drift3 40s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,60px) scale(1.12)}66%{transform:translate(-50px,90px) scale(.94)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-90px,-70px) scale(1.08)}70%{transform:translate(40px,-120px) scale(.92)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-90px) scale(1.15)}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 40%,#000 20%,transparent 78%);
  mask-image:radial-gradient(ellipse 90% 80% at 50% 40%,#000 20%,transparent 78%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block}

#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:60;background:var(--ac);transition:width .1s linear}
[data-theme="github-light"] #progress,[data-theme="github-dark"] #progress{background:var(--hero-grad);height:2px;box-shadow:0 0 10px rgba(9,105,218,.5)}

#boot{padding:120px 24px;text-align:center;color:var(--muted);font-size:14px;position:relative;z-index:1}
.spin{display:inline-block;width:18px;height:18px;margin-right:8px;vertical-align:-3px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== 顶栏 ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--bd);z-index:50;transition:box-shadow .25s,background .3s}
[data-theme^="mc-"] .topbar{background:linear-gradient(180deg,#56682c,#3d521f);border-bottom:3px solid #2a3a1a;color:#fff}
[data-theme="mc-night"] .topbar{background:linear-gradient(180deg,#2a3a1a,#1a2a0a);border-bottom:3px solid #0a1a00;color:#e8ffd0}
.topbar.scrolled{box-shadow:0 4px 20px rgba(0,0,0,.07)}
.logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;transition:transform .25s cubic-bezier(.34,1.56,.64,1);cursor:pointer}
[data-theme^="mc-"] .logo{color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.4);letter-spacing:.03em}
[data-theme="mc-night"] .logo{color:#e8ffd0}
.logo:hover{transform:scale(1.04)}
.logo-icon{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.1)}

.search{position:relative;flex:1;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:color .2s,transform .2s}
[data-theme^="mc-"] .search svg{color:rgba(255,255,255,.7)}
.search:focus-within svg{color:var(--ac);transform:translateY(-50%) scale(1.1)}
[data-theme^="mc-"] .search:focus-within svg{color:#c8e0a0}
.search input{width:100%;height:36px;padding:0 12px 0 34px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
[data-theme^="mc-"] .search input{border:2px solid #2a3a1a;background:#fffdf5;color:#1f1f1f;box-shadow:var(--bevel-in)}
[data-theme="mc-night"] .search input{background:#202020;color:#e0e0e0;border-color:#0a1a00}
.search input:focus{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
[data-theme^="mc-"] .search input:focus{box-shadow:0 0 8px rgba(142,196,74,.5)}

.icon{display:grid;place-items:center;width:36px;height:36px;flex:none;font-size:15px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .18s,color .18s,transform .25s cubic-bezier(.34,1.56,.64,1)}
.icon:hover{background:var(--bg3);color:var(--text);transform:translateY(-1px)}
[data-theme^="mc-"] .icon{color:rgba(255,255,255,.85)}
[data-theme^="mc-"] .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}
.icon.active{background:var(--acs);color:var(--ac)}
.icon[hidden]{display:none!important}
.menu{display:none}
#themeBtn:active{transform:rotate(180deg) scale(.85)}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:14px;font-family:inherit;font-weight:600;color:var(--btn-fg);background:var(--btn-bg);border:1px solid var(--btn-bd);border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:background .18s,border-color .18s,transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.05);transform:translateY(-1px);box-shadow:var(--bevel),0 4px 12px rgba(0,0,0,.07)}
[data-theme^="mc-"] .btn:hover:not(:disabled){transform:none;filter:brightness(1.08);box-shadow:var(--bevel),0 0 10px rgba(142,196,74,.35)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:var(--bevel-in)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:var(--btn-primary-fg);background:var(--btn-primary-bg);border-color:var(--btn-bd)}
.btn.d{color:var(--dgr);background:transparent}
.btn.d:hover:not(:disabled){background:rgba(207,34,46,.1);filter:none}

/* ===== 侧栏 ===== */
.sidebar{position:fixed;top:56px;bottom:0;left:0;width:260px;display:flex;flex-direction:column;padding:14px 12px 12px;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--bd);z-index:40;transition:background .3s}
[data-theme^="mc-"] .sidebar{background:#e8e2cc;border-right:3px solid #a8a89a}
[data-theme="mc-night"] .sidebar{background:#1e1e1e;border-right:3px solid #404040}
#navList{flex:1;min-height:0}
.grp+.grp{margin-top:20px}
.grp-t{padding:0 10px 6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
[data-theme^="mc-"] .grp-t{padding:4px 10px;background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;border:2px solid #3d521f;border-radius:2px;text-shadow:1px 1px 0 rgba(0,0,0,.3);margin-bottom:4px}
[data-theme="mc-night"] .grp-t{background:linear-gradient(180deg,#5a7a2c,#3d521f);color:#e8ffd0;border-color:#2a3a1a}
.nav-i{position:relative;display:block;padding:6px 10px 6px 14px;font-size:14px;color:var(--text);text-decoration:none;border-radius:var(--r);transition:background .18s,color .18s,transform .2s}
.nav-i::before{content:"";position:absolute;left:2px;top:50%;width:3px;height:0;border-radius:2px;background:var(--ac);transform:translateY(-50%);transition:height .25s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .nav-i{border:2px solid transparent;border-radius:2px;padding:5px 10px 5px 14px}
[data-theme^="mc-"] .nav-i::before{display:none}
.nav-i:hover{background:var(--bg3);transform:translateX(2px)}
[data-theme^="mc-"] .nav-i:hover{background:rgba(0,0,0,.06);transform:none;border-color:#a8a89a}
.nav-i.active{background:var(--nav-active-bg);color:var(--nav-active-fg);font-weight:600}
.nav-i.active::before{height:16px}
[data-theme^="mc-"] .nav-i.active::before{display:none}
[data-theme^="mc-"] .nav-i.active{box-shadow:var(--bevel);border-color:var(--bd2)}
.nav-e{padding:8px 10px;font-size:13.5px;color:var(--muted)}

.card{margin-top:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);font-size:12.5px;box-shadow:var(--bevel);transition:transform .2s,box-shadow .2s}
[data-theme^="mc-"] .card{border:2px solid var(--bd2)}
.card.click{cursor:pointer;border-color:var(--ac)}
.card:hover{transform:translateY(-1px)}
.row{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--muted);transition:background .3s}
[data-theme^="mc-"] .dot{border-radius:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(26,127,55,.18)}
.dot.busy{background:var(--ac);box-shadow:0 0 0 3px var(--acs);animation:pls 1s infinite}
.dot.cool{background:var(--warn);box-shadow:0 0 0 3px rgba(212,167,44,.22)}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.35}}
.cname{flex:1;min-width:0;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{width:22px;height:22px;flex:none;display:grid;place-items:center;font-size:12px;color:var(--muted);background:none;border:none;border-radius:4px;cursor:pointer;transition:all .18s}
.cx:hover{background:var(--bg3);color:var(--text);transform:rotate(60deg)}
.csub{margin-top:3px;font-size:11.5px;color:var(--muted)}
.cacts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cacts button{padding:5px 4px;font-size:11.5px;font-family:inherit;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);cursor:pointer;box-shadow:var(--bevel);transition:all .18s}
.cacts button:hover:not(:disabled){color:var(--ac);border-color:var(--ac);background:var(--acs)}
.cacts button:disabled{opacity:.6;cursor:not-allowed}
.cacts button.cooling{color:var(--warn);border-color:var(--warn);font-variant-numeric:tabular-nums}

.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tools button{padding:7px 4px;font-size:12px;font-family:inherit;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:all .18s}
.tools button:hover{color:var(--text);background:var(--bg3)}
.tools button:active{box-shadow:var(--bevel-in)}

/* ===== 主内容 ===== */
.content{position:relative;z-index:1;margin-left:260px;padding:92px 40px 96px;min-height:100vh}
.view{animation:viewIn .45s cubic-bezier(.22,1,.36,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== 主页 Hero ===== */
.hero{padding:24px 0 36px;text-align:center;max-width:820px;margin:0 auto}
.hero-title{margin:0 0 12px;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;line-height:1.15;letter-spacing:-.03em;
  background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:heroIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.hero-sub{margin:0 auto 22px;max-width:520px;font-size:16px;color:var(--muted);line-height:1.7;
  animation:heroIn .7s .08s cubic-bezier(.22,1,.36,1) both}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  animation:heroIn .7s .16s cubic-bezier(.22,1,.36,1) both}
.stat{display:flex;align-items:baseline;gap:6px;padding:8px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:999px;font-size:13.5px;color:var(--muted);box-shadow:var(--bevel)}
[data-theme^="mc-"] .stat{border-radius:2px;border:2px solid var(--bd2)}
.stat strong{color:var(--ac);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}

/* ===== 分类筛选 ===== */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 28px;max-width:900px;
  animation:heroIn .7s .22s cubic-bezier(.22,1,.36,1) both}
.chip{padding:6px 14px;font-size:13px;font-family:inherit;font-weight:600;color:var(--muted);
  background:var(--bg2);border:1px solid var(--bd);border-radius:999px;cursor:pointer;
  box-shadow:var(--bevel);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .chip{border-radius:2px;border:2px solid var(--bd2)}
.chip:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--bevel),0 4px 12px rgba(0,0,0,.08)}
.chip.active{color:var(--btn-primary-fg);background:var(--btn-primary-bg);border-color:var(--btn-bd)}
.chip .chip-n{margin-left:4px;font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}

/* ===== 方块网格 ===== */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;max-width:1200px;margin:0 auto}
.tile{position:relative;display:flex;flex-direction:column;padding:18px;aspect-ratio:1/1;
  background:var(--bg);border:1px solid var(--bd);border-radius:14px;cursor:pointer;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .2s;
  animation:tileIn .55s cubic-bezier(.22,1,.36,1) both;
  text-decoration:none;color:inherit}
[data-theme^="mc-"] .tile{border-radius:2px;border:3px solid var(--bd2);box-shadow:var(--bevel)}
@keyframes tileIn{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
.tile:hover{transform:translateY(-8px) scale(1.025);box-shadow:0 18px 36px rgba(0,0,0,.14);border-color:var(--ac)}
[data-theme^="mc-"] .tile:hover{transform:translateY(-6px);box-shadow:var(--bevel),0 0 0 3px rgba(142,196,74,.35),0 12px 24px rgba(0,0,0,.3)}
.tile:active{transform:translateY(-2px) scale(.99)}

.tile::before{content:"";position:absolute;inset:0;background:var(--tile-accent);opacity:0;transition:opacity .35s;pointer-events:none}
.tile:hover::before{opacity:.08}
[data-theme^="mc-"] .tile::before{display:none}

.tile-icon{font-size:32px;line-height:1;margin-bottom:auto;transition:transform .35s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.08))}
[data-theme^="mc-"] .tile-icon{filter:drop-shadow(2px 2px 0 rgba(0,0,0,.25))}
.tile:hover .tile-icon{transform:scale(1.15) rotate(-6deg)}

.tile-title{margin:14px 0 6px;font-size:15px;font-weight:700;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:color .2s}
[data-theme^="mc-"] .tile-title{text-shadow:0 1px 0 rgba(255,255,255,.4);color:#2a3a1a}
[data-theme="mc-night"] .tile-title{color:#e8ffd0;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.tile:hover .tile-title{color:var(--ac)}

.tile-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;
  font-size:11.5px;color:var(--muted)}
.tile-cat{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--bg3);border-radius:999px;font-weight:600;
  max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .2s}
[data-theme^="mc-"] .tile-cat{border-radius:2px;border:1px solid var(--bd)}
.tile:hover .tile-cat{background:var(--acs);color:var(--ac)}
[data-theme^="mc-"] .tile:hover .tile-cat{background:#3d521f;color:#e8ffd0;border-color:#2a3a1a}
.tile-arrow{font-size:16px;opacity:0;transform:translateX(-8px);transition:all .3s cubic-bezier(.34,1.56,.64,1);color:var(--ac);font-weight:700}
.tile:hover .tile-arrow{opacity:1;transform:none}

/* 主页空状态 */
.home-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14.5px;line-height:1.9}
.home-empty .ic{font-size:48px;opacity:.6;margin-bottom:12px}

/* ===== 文章视图 ===== */
.art{max-width:820px;margin:0 auto}
.art h1{margin:0 0 6px;font-size:2rem;line-height:1.25;letter-spacing:-.022em;padding-bottom:0;border-bottom:var(--h1-border);
  animation:fadeUp .45s both}
[data-theme^="mc-"] .art h1{color:#2a3a1a;padding-bottom:10px;margin-bottom:14px;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
[data-theme="mc-night"] .art h1{color:#e8ffd0;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.art .meta{margin-bottom:26px;padding-bottom:16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--bd);animation:fadeUp .45s .05s both}
[data-theme^="mc-"] .art .meta{border-bottom:2px dashed #a8a89a}
.art .meta .edit{float:right;color:var(--ac);cursor:pointer;text-decoration:none;font-weight:600}
.art .meta .edit:hover{text-decoration:underline}
.art .ab{animation:fadeUp .5s .1s both}
.ab h2{margin:38px 0 14px;padding:0 0 7px;font-size:1.32rem;border-bottom:1px solid var(--bd);background:var(--h2-bg);color:var(--h2-fg)}
[data-theme^="mc-"] .ab h2{padding:8px 16px;border:2px solid var(--bd2);border-radius:2px;font-size:1.15rem;text-shadow:1px 1px 0 rgba(0,0,0,.35);box-shadow:var(--bevel);margin:30px 0 14px}
.ab h3{margin:26px 0 8px;font-size:1.1rem}
[data-theme^="mc-"] .ab h3{color:var(--ac);border-bottom:2px solid var(--bd);padding-bottom:4px}
.ab p{margin:0 0 16px}
.ab ul,.ab ol{margin:0 0 16px;padding-left:1.5em}
.ab li{margin:4px 0}
.ab a{color:var(--ac);font-weight:500}
.ab code{padding:.15em .4em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.875em;background:var(--cbg);border-radius:4px;border:1px solid var(--bd)}
[data-theme^="mc-"] .ab code{background:#f0ecd8;border:1px solid #a8a89a;border-radius:2px}
.ab pre{margin:0 0 18px;padding:14px 16px;overflow-x:auto;background:var(--cbg);border:1px solid var(--bd);border-radius:var(--r)}
[data-theme^="mc-"] .ab pre{border:2px solid #a8a89a;border-radius:2px;box-shadow:var(--bevel-in);background:#f0ecd8}
[data-theme="mc-night"] .ab pre{background:#1a1a1a}
.ab pre code{padding:0;font-size:13.5px;background:none;border:none}
.ab table{width:100%;margin:0 0 18px;border-collapse:collapse;font-size:14.5px}
.ab th,.ab td{padding:8px 12px;text-align:left;border:1px solid var(--bd)}
.ab th{background:var(--bg2);font-weight:650}
[data-theme^="mc-"] .ab th{background:linear-gradient(180deg,#e0e8d0,#c8d4a8);border:2px solid #a8a89a;text-align:center}
[data-theme^="mc-"] .ab td{border:2px solid #c8c4b0}
.ab tbody tr:hover{background:var(--bg2)}
.ab> :first-child{margin-top:0}
.callout{display:flex;gap:10px;margin:0 0 18px;padding:12px 16px;font-size:14.5px;background:var(--bg2);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r);transition:transform .2s}
.callout::before{content:"💡"}
.callout:hover{transform:translateX(3px)}
[data-theme^="mc-"] .callout{border:2px solid #a8a89a;border-left:4px solid var(--ac);border-radius:2px;box-shadow:var(--bevel)}
.callout p:last-child{margin-bottom:0}

/* ===== 底部方块导航 ===== */
.tile-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;margin-top:64px;padding-top:32px;
  border-top:1px solid var(--bd);max-width:820px;margin-left:auto;margin-right:auto}
[data-theme^="mc-"] .tile-nav{border-top:2px solid var(--bd)}
.tile-nav .nav-tile{position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px;
  min-height:96px;padding:16px;background:var(--bg);border:1px solid var(--bd);border-radius:14px;
  cursor:pointer;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .3s,border-color .2s,background .3s;
  animation:tileIn .5s cubic-bezier(.22,1,.36,1) both}
[data-theme^="mc-"] .tile-nav .nav-tile{border-radius:2px;border:3px solid var(--bd2);box-shadow:var(--bevel)}
.tile-nav .nav-tile:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(0,0,0,.12);border-color:var(--ac)}
[data-theme^="mc-"] .tile-nav .nav-tile:hover{transform:translateY(-4px);box-shadow:var(--bevel),0 0 0 3px rgba(142,196,74,.35)}
.tile-nav .nav-tile::before{content:"";position:absolute;inset:0;background:var(--tile-accent);opacity:0;transition:opacity .3s;pointer-events:none}
.tile-nav .nav-tile:hover::before{opacity:.07}
[data-theme^="mc-"] .tile-nav .nav-tile::before{display:none}

.tile-nav .nav-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile-nav .nav-title{font-size:14.5px;font-weight:700;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[data-theme^="mc-"] .tile-nav .nav-title{color:#2a3a1a;text-shadow:0 1px 0 rgba(255,255,255,.4)}
[data-theme="mc-night"] .tile-nav .nav-title{color:#e8ffd0}

.tile-nav .nav-tile.prev .nav-label{justify-content:flex-start}
.tile-nav .nav-tile.next{text-align:right}
.tile-nav .nav-tile.next .nav-label{justify-content:flex-end}
.tile-nav .nav-arrow{display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1);font-size:14px}
.tile-nav .nav-tile.prev:hover .nav-arrow{transform:translateX(-4px)}
.tile-nav .nav-tile.next:hover .nav-arrow{transform:translateX(4px)}

.tile-nav .nav-tile.home{width:96px;height:96px;min-height:0;align-items:center;justify-content:center;text-align:center;padding:12px}
.tile-nav .nav-tile.home .home-icon{font-size:26px;line-height:1;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tile-nav .nav-tile.home:hover .home-icon{transform:scale(1.15) rotate(-8deg)}
.tile-nav .nav-tile.home .nav-label{justify-content:center;font-size:11px;margin-top:4px}

.tile-nav .nav-tile.disabled{opacity:.4;pointer-events:none;cursor:default}

/* ===== 弹窗 ===== */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:1080px;height:100%;max-height:780px;background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) + 4px);box-shadow:var(--sh);overflow:hidden;transform:translateY(24px) scale(.96);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .pnl{border:3px solid var(--bd2);border-radius:2px;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.ov.show .pnl{transform:none}
.pnl.sm{max-width:560px;height:auto;max-height:calc(100vh - 48px)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
[data-theme^="mc-"] .ph{background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;border-bottom:3px solid #3d521f;text-shadow:1px 1px 0 rgba(0,0,0,.3);padding:10px 16px}
[data-theme="mc-night"] .ph{background:linear-gradient(180deg,#5a7a2c,#3d521f);color:#e8ffd0;border-bottom-color:#2a3a1a}
.ph strong{font-size:15px}
.ph .sp{flex:1}
[data-theme^="mc-"] .ph .icon{color:#fff}
[data-theme^="mc-"] .ph .icon:hover{background:rgba(0,0,0,.2)}
.pf{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.fld{display:flex;flex-direction:column;gap:4px;flex:1}
.fld:first-child{flex:2}
.fld span{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{height:34px;padding:0 10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);outline:none;transition:border-color .2s,box-shadow .2s}
[data-theme^="mc-"] .fld input,[data-theme^="mc-"] .fld select{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel-in)}
.fld input:focus,.fld select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
[data-theme^="mc-"] .fld input:focus,[data-theme^="mc-"] .fld select:focus{box-shadow:0 0 8px rgba(142,196,74,.5)}

.tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--bd)}
[data-theme^="mc-"] .tb{background:#e8e2cc;border-bottom:2px solid #a8a89a}
.tb button{min-width:32px;height:30px;padding:0 8px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) - 3px);cursor:pointer;box-shadow:var(--bevel);transition:all .18s}
.tb button:hover{color:var(--ac);border-color:var(--ac);background:var(--acs);transform:translateY(-1px)}
.pmain{display:flex;gap:12px;flex:1;min-height:0;padding:12px 16px}
.pmain textarea{flex:1;min-width:0;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);resize:none;outline:none;tab-size:2;transition:border-color .2s,box-shadow .2s}
[data-theme^="mc-"] .pmain textarea{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel-in);background:#f0ecd8}
[data-theme="mc-night"] .pmain textarea{background:#1a1a1a}
.pmain textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.pprev{flex:1;min-width:0;padding:12px 16px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);display:none;font-size:15px}
[data-theme^="mc-"] .pprev{border:2px solid var(--bd2);border-radius:2px}
.pmain.pv .pprev{display:block}
.pfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bd)}
.pfoot .sp{flex:1}
.phint{font-size:12px;color:var(--muted)}

.ghb{padding:16px;overflow-y:auto}
.ghb .fld+.fld{margin-top:12px}
.ghh{margin-top:14px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px)}
[data-theme^="mc-"] .ghh{border:2px solid var(--bd2);border-radius:2px}
.ghh a{color:var(--ac)}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}
.theme-card{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--bevel);transition:all .2s;text-align:left}
.theme-card:hover{transform:translateY(-2px);border-color:var(--ac)}
.theme-card.active{border-color:var(--ac);box-shadow:var(--bevel),0 0 0 3px var(--acs)}
.theme-prev{display:flex;height:38px;border:1px solid var(--bd);border-radius:calc(var(--r) - 3px);overflow:hidden}
.theme-prev span{flex:1;display:block}
.theme-name{font-size:13.5px;font-weight:700}
.theme-desc{font-size:11.5px;color:var(--muted);margin-top:-4px}

.tag-list{display:flex;flex-direction:column;gap:8px;padding:14px 16px;overflow-y:auto;flex:1}
.tag-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel);transition:all .2s}
[data-theme^="mc-"] .tag-item{border:2px solid var(--bd2);border-radius:2px}
.tag-item:hover{border-color:var(--ac);transform:translateY(-1px)}
.tag-item.dragging{opacity:.4}
.tag-item.over{border-color:var(--ac);border-style:dashed;background:var(--acs)}
.tag-item .grip{width:18px;height:18px;flex:none;color:var(--muted);cursor:grab;user-select:none;display:grid;place-items:center;font-size:15px}
.tag-item .idx{width:26px;height:26px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);font-variant-numeric:tabular-nums}
.tag-item .name{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:3px 6px;border-radius:4px;transition:background .15s}
.tag-item .name:hover{background:var(--bg3)}
.tag-item .name input{width:100%;font:inherit;font-weight:600;color:var(--text);background:var(--bg);border:1px solid var(--ac);border-radius:4px;outline:none;padding:2px 6px;box-shadow:0 0 0 3px var(--acs)}
.tag-item .cnt{flex:none;font-size:11.5px;color:var(--muted);padding:2px 8px;background:var(--bg3);border-radius:10px;font-variant-numeric:tabular-nums}
.tag-item .acts{display:flex;gap:4px;flex:none}
.tag-item .acts button{width:30px;height:30px;display:grid;place-items:center;font-size:14px;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);cursor:pointer;box-shadow:var(--bevel);transition:all .18s}
.tag-item .acts button:hover{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.tag-item .acts button.del:hover{color:var(--dgr);border-color:var(--dgr);background:rgba(207,34,46,.08)}
.tag-empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:28px;max-width:calc(100vw - 40px);padding:10px 20px;font-size:14px;color:var(--bg);background:var(--text);border-radius:var(--r);box-shadow:var(--sh);opacity:0;transform:translateX(-50%) translateY(20px);transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:200}
[data-theme^="mc-"] .toast{background:#2a3a1a;color:#e8ffd0;border:2px solid #4a4a3a;border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bd{position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;z-index:35}
.bd.show{opacity:1;visibility:visible}

/* ===== 响应式 ===== */
@media(max-width:1100px){
  .tile-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media(max-width:900px){
  .menu{display:grid}
  .logo span{display:none}
  .search{max-width:none}
  .sidebar{width:282px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--sh)}
  .sidebar.open{transform:none}
  .content{margin-left:0;padding:80px 20px 80px}
  .art h1{font-size:1.6rem}
  .tile-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .tile{padding:14px;border-radius:12px}
  .tile-icon{font-size:26px}
  .tile-title{font-size:14px}
  .tile-nav{grid-template-columns:1fr auto 1fr;gap:10px;margin-top:44px;padding-top:24px}
  .tile-nav .nav-tile{min-height:80px;padding:12px}
  .tile-nav .nav-tile.home{width:80px;height:80px}
  .tile-nav .nav-title{font-size:13px}
  .ov{padding:0}
  .pnl{max-height:none;border-radius:0;border:none}
  .pnl.sm{max-height:none}
  .pmain{flex-direction:column}
  .pf{flex-direction:column;gap:8px}
  .fld:first-child{flex:1}
  .phint{display:none}
  .blob{filter:blur(70px)}
  .b1,.b2{width:340px;height:340px}
  .theme-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .search input{font-size:13px}
  .tile-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{aspect-ratio:1/1.05}
  .tile-icon{font-size:22px;margin-bottom:8px}
  .tile-title{font-size:13px;-webkit-line-clamp:3;margin:6px 0 4px}
  .tile-foot{font-size:10.5px}
  .tile-cat{padding:2px 6px;font-size:10.5px}
  .tile-nav{grid-template-columns:1fr 1fr;gap:10px}
  .tile-nav .nav-tile.home{width:100%;height:auto;min-height:60px;grid-column:span 2;flex-direction:row;gap:10px}
  .tile-nav .nav-tile.home .home-icon{font-size:20px}
  .tile-nav .nav-tile.home .nav-label{margin:0;font-size:12px}
  .hero{padding:12px 0 24px}
  .hero-sub{font-size:14px}
  .stat{padding:6px 12px;font-size:12px}
  .tag-item .acts{width:100%;justify-content:flex-end}
}
@media print{.topbar,.sidebar,.bd,.tile-nav,.ov,.toast,.bg-decor,#progress{display:none}.content{margin:0;padding:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-bg"></div>
  <canvas id="particles"></canvas>
</div>

<div id="progress"></div>
<div id="boot"><span class="spin"></span>正在加载内容…</div>

<header class="topbar" hidden>
  <button class="icon menu" id="menuBtn">☰</button>
  <a class="logo" href="#" id="logoLink"><span class="logo-icon">📚</span><span>我的 Wiki</span></a>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="搜索条目…（按 / 聚焦）" autocomplete="off">
  </div>
  <button class="icon admin-only" id="editBtn" title="编辑 (E)" hidden>✏️</button>
  <button class="icon admin-only" id="newBtn" title="新建 (N)" hidden>＋</button>
  <button class="icon" id="themeBtn" title="切换风格">🎨</button>
</header>

<aside class="sidebar" id="sidebar" hidden>
  <nav id="navList"></nav>

  <div class="card" id="cloudCard">
    <div class="row">
      <span class="dot" id="cloudDot"></span>
      <span class="cname" id="cloudName">数据源</span>
      <button class="cx admin-only" id="cloudCfgBtn" title="管理员配置" hidden>⚙</button>
    </div>
    <div class="csub" id="cloudSub">加载中…</div>
    <div class="cacts admin-only" id="cloudActs" hidden>
      <button id="btnPush">⬆ 推送</button>
      <button id="btnPull">⬇ 拉取</button>
    </div>
  </div>

  <div class="tools">
    <button id="btnHome">🏠 主页</button>
    <button id="btnExport">⬇ 导出</button>
    <button class="admin-only" id="btnTags" hidden style="grid-column:span 2">🏷️ 分类管理</button>
  </div>
</aside>
<div class="bd" id="bd" hidden></div>

<main class="content" id="main" hidden>

  <!-- 主页视图 -->
  <section class="view" id="viewHome">
    <div class="hero">
      <h1 class="hero-title">我的 Wiki</h1>

      <div class="hero-stats">

<script>
(function(){
'use strict';

/* ===== 仓库配置 ===== */
var GH_OWNER='HSDL03',GH_REPO='HSwiki',GH_PATH='wiki-data.json',GH_BRANCH='main';
var K_GH='wiki-gh',K_THEME='wiki-theme';
var COOLDOWN_MS=60000;
var cooldownUntil=0,cooldownTimer=null;

window.addEventListener('error',function(e){console.warn('[wiki]',e.message||e.error);});

var storage={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  del:function(k){try{localStorage.removeItem(k);return true;}catch(e){return false;}}
};

function $(id){return document.getElementById(id);}
function stripTags(h){return String(h==null?'':h).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slug(t){var s=String(t||'').toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'');return s||'entry';}
function uniqId(t,used){
  var set=used||new Set(articles.map(function(a){return a.id;}));
  var b=slug(t),id=b,n=2;
  while(set.has(id)){id=b+'-'+n;n++;}
  set.add(id);
  return id;
}
function normList(arr){
  if(!Array.isArray(arr))return [];
  var used=new Set(),out=[];
  arr.forEach(function(r,i){
    if(!r||typeof r!=='object')return;
    var t=(typeof r.title==='string'&&r.title.trim())?r.title.trim():('未命名 '+(i+1));
    var id=String(r.id||'').trim();
    if(!id||used.has(id))id=uniqId(t,used);else used.add(id);
    out.push({
      id:id,title:t,
      category:(typeof r.category==='string'&&r.category.trim())?r.category.trim():'未分类',
      content:typeof r.content==='string'?r.content:''
    });
  });
  return out;
}
function parseList(text){
  var p=JSON.parse(text);
  if(!Array.isArray(p))throw new Error('顶层必须是数组');
  return normList(p);
}
function b64enc(s){
  var b=new TextEncoder().encode(String(s)),bin='';
  for(var i=0;i<b.length;i++)bin+=String.fromCharCode(b[i]);
  return btoa(bin);
}
function b64dec(b64){
  var bin=atob(String(b64).replace(/\s/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ===== 状态 ===== */
var articles=[];
var state={view:'home',currentId:null,query:'',filter:null};
var editing=null,gh=null,ghBusy=false,isAdmin=false;
var tags=[],originalSnap='',dirty=false,mergingFrom=null,deletingName=null;

/* ===== DOM ===== */
var bootEl=$('boot'),topbarEl=document.querySelector('.topbar'),sidebarEl=$('sidebar'),mainEl=$('main'),bdEl=$('bd');
var navList=$('navList'),searchEl=$('search'),menuBtn=$('menuBtn'),themeBtn=$('themeBtn');
var editBtn=$('editBtn'),newBtn=$('newBtn'),logoLink=$('logoLink'),toastEl=$('toast'),progressEl=$('progress');
var cloudCard=$('cloudCard'),cloudDot=$('cloudDot'),cloudName=$('cloudName'),cloudSub=$('cloudSub');
var cloudCfgBtn=$('cloudCfgBtn'),cloudActs=$('cloudActs'),btnPush=$('btnPush'),btnPull=$('btnPull');
var btnExport=$('btnExport'),btnTags=$('btnTags'),btnHome=$('btnHome');
var viewHome=$('viewHome'),viewArticle=$('viewArticle');
var statArticles=$('statArticles'),statCategories=$('statCategories');
var filterBar=$('filterBar'),tileGrid=$('tileGrid'),homeEmpty=$('homeEmpty'),homeEmptyText=$('homeEmptyText');
var artEl=$('art'),tileNav=$('tileNav');
var edOv=$('edOv'),edTitle=$('edTitle'),edTb=$('edTb'),edMain=$('edMain'),edPrev=$('edPrev');
var edT=$('edT'),edC=$('edC'),edContent=$('edContent'),catList=$('catList');
var edSave=$('edSave'),edCancel=$('edCancel'),edDel=$('edDel'),edClose=$('edClose'),edPrevBtn=$('edPrevBtn');
var ghOv=$('ghOv'),ghToken=$('ghToken'),ghSave=$('ghSave'),ghCancel=$('ghCancel'),ghClose=$('ghClose'),ghDisconn=$('ghDisconn');
var themeOv=$('themeOv'),themeGrid=$('themeGrid'),themeClose=$('themeClose');
var tagOv=$('tagOv'),tagList=$('tagList'),tagClose=$('tagClose'),tagCancel=$('tagCancel'),tagSave=$('tagSave');
var mergeOv=$('mergeOv'),mergeClose=$('mergeClose'),mergeCancel=$('mergeCancel'),mergeOk=$('mergeOk'),mergeFrom=$('mergeFrom'),mergeTarget=$('mergeTarget');
var delOv=$('delOv'),delClose=$('delClose'),delCancel=$('delCancel'),delOk=$('delOk'),delName=$('delName'),delCount=$('delCount');

var toastTimer=null;
function toast(m){
  if(!toastEl)return;
  toastEl.textContent=m;toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2400);
}

/* ===== 主题 ===== */
var THEMES=[
  {id:'github-light',name:'☀️ GitHub 浅色',desc:'清爽默认',colors:['#0969da','#f6f8fa','#1f2328']},
  {id:'github-dark',name:'🌙 GitHub 暗色',desc:'护眼夜间',colors:['#4493f8','#161b22','#e6edf3']},
  {id:'mc-wiki',name:'🟩 MC Wiki',desc:'我的世界中文 Wiki',colors:['#3d521f','#fffdf5','#56682c']},
  {id:'mc-night',name:'⬛ MC 夜晚',desc:'Minecraft 夜间模式',colors:['#8ec44a','#1a1a1a','#3d521f']}
];
var curTheme=(function(){
  var s=storage.get(K_THEME);
  for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===s)return s;
  return 'github-light';
})();
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  storage.set(K_THEME,t);curTheme=t;
  if(themeGrid)buildThemeGrid();
}
function buildThemeGrid(){
  if(!themeGrid)return;
  var html='';
  THEMES.forEach(function(th){
    html+='<button type="button" class="theme-card'+(th.id===curTheme?' active':'')+'" data-theme-val="'+esc(th.id)+'">'+
      '<div class="theme-prev"><span style="background:'+th.colors[0]+'"></span><span style="background:'+th.colors[1]+'"></span><span style="background:'+th.colors[2]+'"></span></div>'+
      '<div class="theme-name">'+esc(th.name)+'</div>'+
      '<div class="theme-desc">'+esc(th.desc)+'</div>'+
    '</button>';
  });
  themeGrid.innerHTML=html;
}

/* ===== 背景粒子 ===== */
var particleCtx=null,particles=[],particleRunning=true,pW=0,pH=0,pDpr=1;
function getParticleColors(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t==='mc-wiki')return ['61,82,31','106,140,60','140,180,60'];
  if(t==='mc-night')return ['142,196,74','90,140,60','200,180,100'];
  if(t==='github-dark')return ['68,147,248','163,113,247','230,237,243'];
  return ['9,105,218','163,113,247','31,35,40'];
}
function initParticles(){
  var canvas=$('particles');
  if(!canvas||!canvas.getContext)return;
  particleCtx=canvas.getContext('2d');
  pDpr=Math.min(window.devicePixelRatio||1,2);
  resizeCanvas();
  var count=Math.max(12,Math.min(34,Math.floor((pW*pH)/42000)));
  particles=[];
  for(var i=0;i<count;i++){
    particles.push({
      x:Math.random()*pW,y:Math.random()*pH,
      size:2+Math.random()*6,
      vx:(Math.random()-0.5)*0.35,vy:(Math.random()-0.5)*0.35,
      rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.008,
      alpha:0.05+Math.random()*0.13,hueIdx:i%3
    });
  }
  if(particleRunning)drawParticles();
}
function resizeCanvas(){
  var canvas=$('particles');if(!canvas)return;
  pW=window.innerWidth;pH=window.innerHeight;
  canvas.width=pW*pDpr;canvas.height=pH*pDpr;
  canvas.style.width=pW+'px';canvas.style.height=pH+'px';
  if(particleCtx)particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}
function drawParticles(){
  if(!particleRunning||!particleCtx)return;
  var colors=getParticleColors();
  particleCtx.clearRect(0,0,pW,pH);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.x<-30)p.x=pW+30;else if(p.x>pW+30)p.x=-30;
    if(p.y<-30)p.y=pH+30;else if(p.y>pH+30)p.y=-30;
    particleCtx.save();
    particleCtx.translate(p.x,p.y);particleCtx.rotate(p.rot);
    particleCtx.fillStyle='rgba('+colors[p.hueIdx]+','+p.alpha+')';
    var s=p.size,hs=s/2,r=Math.min(2,s/3);
    particleCtx.beginPath();
    if(particleCtx.roundRect)particleCtx.roundRect(-hs,-hs,s,s,r);else particleCtx.rect(-hs,-hs,s,s);
    particleCtx.fill();particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

/* ===== 冷却 ===== */
function cooldownLeft(){return Math.max(0,cooldownUntil-Date.now());}
function inCooldown(){return cooldownLeft()>0;}
function startCooldown(){
  cooldownUntil=Date.now()+COOLDOWN_MS;
  if(cooldownTimer)clearInterval(cooldownTimer);
  updateCooldownUI();
  cooldownTimer=setInterval(function(){
    if(!inCooldown()){clearInterval(cooldownTimer);cooldownTimer=null;}
    updateCooldownUI();
  },500);
}
function updateCooldownUI(){
  var left=cooldownLeft(),secs=Math.ceil(left/1000);
  if(left>0){
    btnPush.disabled=true;btnPush.classList.add('cooling');
    btnPush.textContent='⏳ '+secs+'s';
    cloudDot.classList.add('cool');
    if(!ghBusy)cloudSub.textContent='冷却中 '+secs+'s';
  }else{
    btnPush.disabled=ghBusy;btnPush.classList.remove('cooling');
    btnPush.textContent='⬆ 推送';
    if(!ghBusy)cloudDot.classList.remove('cool');
  }
}

/* ===== 滚动 ===== */
var rafPend=false;
function updateScroll(){
  var h=document.documentElement;
  var top=h.scrollTop||document.body.scrollTop||0;
  var height=h.scrollHeight-h.clientHeight;
  var pct=height>0?(top/height)*100:0;
  if(progressEl)progressEl.style.width=Math.min(100,Math.max(0,pct))+'%';
  if(topbarEl)topbarEl.classList.toggle('scrolled',top>4);
  rafPend=false;
}
function onScroll(){if(rafPend)return;rafPend=true;requestAnimationFrame(updateScroll);}

/* ===== 读取 ===== */
function rawUrl(){return 'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+GH_PATH;}
function cdnUrl(){return 'https://cdn.jsdelivr.net/gh/'+GH_OWNER+'/'+GH_REPO+'@'+GH_BRANCH+'/'+GH_PATH;}
function apiUrl(){return 'https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH.split('/').map(encodeURIComponent).join('/');}
function ghHeaders(){return {'Authorization':'Bearer '+(gh?gh.token:''),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}

function loadPublic(){
  return fetch(rawUrl()+'?t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(parseList)
    .catch(function(){
      return fetch(cdnUrl()+'?t='+Date.now())
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
        .then(parseList);
    });
}
function loadAdmin(){
  return fetch(apiUrl()+'?ref='+encodeURIComponent(GH_BRANCH),{headers:ghHeaders()})
    .then(function(r){
      if(r.status===404)return [];
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(e){throw new Error(e.message||('HTTP '+r.status));});
      return r.json();
    })
    .then(function(info){
      if(Array.isArray(info))return [];
      var text=b64dec(info.content||'');
      return parseList(text);
    });
}
function pushCloud(silent){
  if(!gh||!gh.token){toast('请先进入管理员模式');return Promise.resolve(false);}
  if(inCooldown()){
    if(!silent)toast('冷却中，请 '+Math.ceil(cooldownLeft()/1000)+' 秒后再试');
    return Promise.resolve(false);
  }
  if(ghBusy)return Promise.resolve(false);
  ghBusy=true;updateCloudUI();
  return fetch(apiUrl()+'?ref='+encodeURIComponent(GH_BRANCH),{headers:ghHeaders()})
    .then(function(r){
      if(r.status===404)return null;
      if(!r.ok)return r.json().catch(function(){return{};}).then(function(e){throw new Error(e.message||('HTTP '+r.status));});
      return r.json();
    })
    .then(function(info){
      var body={message:'更新 wiki 数据 '+new Date().toISOString().slice(0,19).replace('T',' '),
        content:b64enc(JSON.stringify(articles,null,2)),branch:GH_BRANCH};
      if(info&&info.sha)body.sha=info.sha;
      var h=ghHeaders();h['Content-Type']='application/json';
      return fetch(apiUrl(),{method:'PUT',headers:h,body:JSON.stringify(body)})
        .then(function(r){
          if(!r.ok)return r.json().catch(function(){return{};}).then(function(e){throw new Error(e.message||('HTTP '+r.status));});
          return r.json();
        });
    })
    .then(function(){
      ghBusy=false;startCooldown();updateCloudUI();
      if(!silent)toast('已同步到云端 · 60 秒后可再次推送');
      return true;
    })
    .catch(function(err){
      ghBusy=false;updateCloudUI();
      if(!silent)toast('同步失败：'+err.message);
      return false;
    });
}
function updateCloudUI(){
  cloudDot.className='dot';
  if(isAdmin){
    cloudName.textContent=GH_OWNER+'/'+GH_REPO;
    if(ghBusy){cloudDot.classList.add('busy');cloudSub.textContent='同步中…';}
    else if(inCooldown()){cloudDot.classList.add('cool');cloudSub.textContent='冷却中 '+Math.ceil(cooldownLeft()/1000)+'s';}
    else{cloudDot.classList.add('on');cloudSub.textContent='管理员 · 可编辑';}
    cloudActs.hidden=false;btnPull.disabled=ghBusy;updateCooldownUI();
  }else{
    cloudName.textContent=GH_OWNER+'/'+GH_REPO;
    cloudSub.textContent='已加载 · 只读';
    cloudDot.classList.add('on');cloudActs.hidden=true;
  }
}
function applyMode(){
  var els=document.querySelectorAll('.admin-only');
  for(var i=0;i<els.length;i++)els[i].hidden=!isAdmin;
}

/* ===== 应用数据 ===== */
function applyArticles(list){
  articles=normList(list);
  renderNav();
  renderStats();
  if(articles.length===0){
    if(state.view==='home')renderHome();
    else{state.view='home';showView('home');}
    setTimeout(updateScroll,50);
    return;
  }
  if(state.view==='home')renderHome();
  else{
    var exists=articles.some(function(a){return a.id===state.currentId;});
    if(exists)renderArticle();
    else{state.view='home';showView('home');renderHome();}
  }
  setTimeout(updateScroll,50);
}

function renderStats(){
  var cats={};
  articles.forEach(function(a){cats[a.category]=1;});
  if(statArticles)statArticles.textContent=articles.length;
  if(statCategories)statCategories.textContent=Object.keys(cats).length;
}

/* ===== 侧栏 ===== */
function renderNav(){
  if(articles.length===0){navList.innerHTML='<p class="nav-e">还没有条目</p>';return;}
  var q=state.query.trim().toLowerCase();
  var grps=new Map();
  articles.forEach(function(a){
    if(q){
      var hay=(a.title+' '+a.category+' '+stripTags(a.content)).toLowerCase();
      if(hay.indexOf(q)===-1)return;
    }
    if(!grps.has(a.category))grps.set(a.category,[]);
    grps.get(a.category).push(a);
  });
  if(grps.size===0){navList.innerHTML='<p class="nav-e">没有匹配的条目</p>';return;}
  var html='';
  grps.forEach(function(list,cat){
    html+='<div class="grp"><div class="grp-t">'+esc(cat)+'</div>';
    list.forEach(function(a){
      html+='<a class="nav-i'+(a.id===state.currentId?' active':'')+'" href="#'+encodeURIComponent(a.id)+'" data-id="'+esc(a.id)+'">'+esc(a.title)+'</a>';
    });
    html+='</div>';
  });
  navList.innerHTML=html;
}
function setActiveNav(){
  var items=navList.querySelectorAll('.nav-i');
  for(var i=0;i<items.length;i++)items[i].classList.toggle('active',items[i].getAttribute('data-id')===state.currentId);
}

/* ===== 主页 ===== */
var TILE_ICONS=['📄','📝','📋','📌','🗂','📎','🔖','📖','💡','🧩','🎯','⚡','🔍','🧭','🎨','🔧'];
function tileIcon(a,i){
  return TILE_ICONS[i%TILE_ICONS.length];
}

function renderHome(){
  /* 分类筛选 */
  var cats={};
  articles.forEach(function(a){cats[a.category]=(cats[a.category]||0)+1;});
  var catNames=Object.keys(cats);

  var fb='';
  fb+='<button type="button" class="chip'+(state.filter===null?' active':'')+'" data-filter="__all__">全部<span class="chip-n">'+articles.length+'</span></button>';
  catNames.forEach(function(c){
    fb+='<button type="button" class="chip'+(state.filter===c?' active':'')+'" data-filter="'+esc(c)+'">'+esc(c)+'<span class="chip-n">'+cats[c]+'</span></button>';
  });
  filterBar.innerHTML=fb;

  /* 过滤条目 */
  var q=state.query.trim().toLowerCase();
  var list=articles.filter(function(a){
    if(state.filter!==null&&a.category!==state.filter)return false;
    if(q){
      var hay=(a.title+' '+a.category+' '+stripTags(a.content)).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });

  if(list.length===0){
    tileGrid.innerHTML='';
    homeEmpty.hidden=false;
    if(articles.length===0){
      homeEmptyText.textContent='还没有条目。'+(isAdmin?'点顶栏 ＋ 新建第一篇吧。':'等内容发布后再来看看。');
    }else{
      homeEmptyText.textContent='没有匹配的条目，换个关键词或分类试试。';
    }
    return;
  }
  homeEmpty.hidden=true;

  /* 渲染方块 */
  var html='';
  list.forEach(function(a,i){
    var delay=Math.min(i*35,600);
    html+='<a class="tile" href="#'+encodeURIComponent(a.id)+'" style="animation-delay:'+delay+'ms" data-id="'+esc(a.id)+'">'+
      '<div class="tile-icon">'+tileIcon(a,i)+'</div>'+
      '<div class="tile-title">'+esc(a.title)+'</div>'+
      '<div class="tile-foot">'+
        '<span class="tile-cat">'+esc(a.category)+'</span>'+
        '<span class="tile-arrow">→</span>'+
      '</div>'+
    '</a>';
  });
  tileGrid.innerHTML=html;
}

/* ===== 文章 ===== */
function renderArticle(){
  var a=articles.find(function(x){return x.id===state.currentId;});
  if(!a){state.view='home';showView('home');renderHome();return;}
  var mins=Math.max(1,Math.round(stripTags(a.content).length/280));
  artEl.innerHTML=
    '<h1>'+esc(a.title)+'</h1>'+
    '<div class="meta">'+esc(a.category)+' · 约 '+mins+' 分钟读完'+

    '<div class="ab">'+(a.content||'')+'</div>';

}

function renderTileNav(a){
  var i=articles.indexOf(a);
  var prev=i>0?articles[i-1]:null;
  var next=i>-1&&i<articles.length-1?articles[i+1]:null;

    html+='<a class="nav-tile prev" href="#'+encodeURIComponent(prev.id)+'">'+
      '<div class="nav-label"><span class="nav-arrow">←</span> 上一篇</div>'+
      '<div class="nav-title">'+esc(prev.title)+'</div>'+
    '</a>';
  }else{
    html+='<span class="nav-tile prev disabled">'+
      '<div class="nav-label"><span class="nav-arrow">←</span> 上一篇</div>'+
      '<div class="nav-title">已经是第一篇</div>'+
    '</span>';
  }

  /* 首页 */
  html+='<a class="nav-tile home" href="#" data-nav="home">'+
    '<div class="home-icon">🏠</div>'+
    '<div class="nav-label">首页</div>'+
  '</a>';

  /* 下一篇 */
  if(next){
    html+='<a class="nav-tile next" href="#'+encodeURIComponent(next.id)+'">'+
      '<div class="nav-label">下一篇 <span class="nav-arrow">→</span></div>'+
      '<div class="nav-title">'+esc(next.title)+'</div>'+
    '</a>';
  }else{
    html+='<span class="nav-tile next disabled">'+
      '<div class="nav-label">下一篇 <span class="nav-arrow">→</span></div>'+
      '<div class="nav-title">已经是最后一篇</div>'+

/* ===== 路由 ===== */
function onHash(){
  var hash=location.hash.slice(1);
  if(!hash||hash==='home'){
    state.currentId=null;
    showView('home');
    renderHome();
    setActiveNav();
    closeSidebar();
    try{window.scrollTo(0,0);}catch(e){}
    return;
  }
  var id='';
  try{id=decodeURIComponent(hash);}catch(e){id=hash;}
  var found=articles.find(function(a){return a.id===id;});
  if(!found){
    if(articles.length===0){state.currentId=null;showView('home');renderHome();return;}
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    state.currentId=null;showView('home');renderHome();
    return;
  }
  state.currentId=found.id;
  showView('article');
  renderArticle();
  setActiveNav();
  closeSidebar();
  try{window.scrollTo(0,0);}catch(e){}
}

function wrapSel(a,b){

function openEditor(a){

  else{editing={id:'',title:'',category:'',content:'',isNew:true};edTitle.textContent='新建条目';edDel.style.display='none';}

function saveEditor(){
  if(!editing)return;
  var t=edT.value.trim(),c=edC.value.trim()||'未分类',content=edContent.value;
  if(!t){toast('标题不能为空');try{edT.focus();}catch(e){}return;}
  var isNew=editing.isNew;
  if(isNew){
    var id=uniqId(t);
    articles.push({id:id,title:t,category:c,content:content});
  }else{
    var idx=-1;
    for(var i=0;i<articles.length;i++)if(articles[i].id===editing.id){idx=i;break;}
    if(idx===-1){closeEditor();return;}
    articles[idx]={id:articles[idx].id,title:t,category:c,content:content};
  }
  renderNav();renderStats();
  if(isNew){
    location.hash='#'+encodeURIComponent(articles[articles.length-1].id);
  }else{

    else renderHome();

    else{toast('正在同步到云端…');pushCloud(false).then(function(ok){if(ok)toast('已保存并同步');});}

function deleteCurrent(){
  if(!editing||editing.isNew)return;
  if(!confirm('确定删除「'+editing.title+'」吗？'))return;
  var idx=-1;
  for(var i=0;i<articles.length;i++)if(articles[i].id===editing.id){idx=i;break;}
  if(idx>-1)articles.splice(idx,1);
  var was=state.currentId===editing.id;
  closeEditor();renderNav();renderStats();
  if(articles.length===0){history.replaceState(null,'',location.pathname+location.search);state.currentId=null;showView('home');renderHome();}
  else if(was){state.currentId=null;history.replaceState(null,'',location.pathname+location.search);showView('home');renderHome();}
  else renderHome();
  if(gh&&gh.token&&!inCooldown())pushCloud(false);
}

/* ===== 分类管理 ===== */
function buildTags(){
  var order=[],counts={};
  articles.forEach(function(a){
    var c=(a&&a.category)?String(a.category):'未分类';
    if(counts[c]===undefined){counts[c]=0;order.push(c);}
    counts[c]++;
  });
  tags=order.map(function(name){return {name:name,count:counts[name]};});
}
function recomputeCounts(){
  var counts={};
  articles.forEach(function(a){
    var c=(a&&a.category)?String(a.category):'未分类';
    counts[c]=(counts[c]||0)+1;
  });
  tags.forEach(function(t){t.count=counts[t.name]||0;});
}
function snapTags(){return JSON.stringify({order:tags.map(function(t){return t.name;}),data:articles});}
function markTagDirty(){dirty=(snapTags()!==originalSnap);updateTagButtons();}
function takeTagSnap(){originalSnap=snapTags();dirty=false;updateTagButtons();}
function updateTagButtons(){
  if(tagSave){tagSave.disabled=!isAdmin||!dirty;tagSave.textContent=dirty?'保存并推送':'无改动';}
}
function renderTags(){
  if(!tagList)return;
  if(!isAdmin){tagList.innerHTML='<div class="tag-empty">请先进入管理员模式</div>';return;}
  if(tags.length===0){tagList.innerHTML='<div class="tag-empty">还没有任何分类</div>';return;}
  var html='';
  tags.forEach(function(t,i){
    html+='<div class="tag-item" draggable="true" data-name="'+esc(t.name)+'" data-idx="'+i+'">'+
      '<span class="grip">⠿</span><span class="idx">'+(i+1)+'</span>'+
      '<span class="name" data-action="rename">'+esc(t.name)+'</span>'+
      '<span class="cnt">'+t.count+' 条</span>'+
      '<span class="acts">'+
        '<button type="button" data-action="merge" title="合并">⇄</button>'+
        '<button type="button" class="del" data-action="delete" title="删除">🗑</button>'+
      '</span>'+
    '</div>';
  });
  tagList.innerHTML=html;
}
function openTags(){
  if(!isAdmin){toast('请先进入管理员模式');return;}
  buildTags();takeTagSnap();renderTags();
  tagOv.classList.add('show');document.body.style.overflow='hidden';
}
function closeTags(){
  if(dirty&&!confirm('有未保存的改动，确定关闭？'))return;
  tagOv.classList.remove('show');
  if(!edOv.classList.contains('show')&&!ghOv.classList.contains('show')&&!themeOv.classList.contains('show'))
    document.body.style.overflow='';
  if(dirty){buildTags();takeTagSnap();renderTags();}
}
function startRename(nameEl){
  var tagEl=nameEl.closest('.tag-item');if(!tagEl)return;
  var oldName=tagEl.getAttribute('data-name');
  var input=document.createElement('input');
  input.type='text';input.value=oldName;
  nameEl.innerHTML='';nameEl.appendChild(input);
  input.focus();input.select();
  var done=false;
  function finish(save){
    if(done)return;done=true;
    var newName=(input.value||'').trim();
    if(save&&newName&&newName!==oldName){
      var clash=tags.some(function(t){return t.name===newName&&t.name!==oldName;});
      if(clash){toast('已存在同名分类');renderTags();return;}
      articles.forEach(function(a){
        var c=(a&&a.category)?String(a.category):'未分类';
        if(c===oldName)a.category=newName;
      });
      tags.forEach(function(t){if(t.name===oldName)t.name=newName;});
      renderTags();markTagDirty();toast('已重命名为「'+newName+'」');
    }else renderTags();
  }
  input.addEventListener('blur',function(){finish(true);});
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();finish(true);}
    else if(e.key==='Escape'){e.preventDefault();finish(false);}
  });
}
function openMerge(name){
  mergingFrom=name;mergeFrom.textContent='「'+name+'」';
  var opts=tags.filter(function(t){return t.name!==name;});
  if(opts.length===0){toast('只有一个分类，无法合并');return;}
  mergeTarget.innerHTML=opts.map(function(t){return '<option value="'+esc(t.name)+'">'+esc(t.name)+'（'+t.count+' 条）</option>';}).join('');
  mergeOv.classList.add('show');
}
function closeMerge(){mergeOv.classList.remove('show');mergingFrom=null;}
function doMerge(){
  if(!mergingFrom)return;
  var target=mergeTarget.value;
  if(!target||target===mergingFrom){closeMerge();return;}
  var moved=0;
  articles.forEach(function(a){
    var c=(a&&a.category)?String(a.category):'未分类';
    if(c===mergingFrom){a.category=target;moved++;}
  });
  tags=tags.filter(function(t){return t.name!==mergingFrom;});
  recomputeCounts();renderTags();markTagDirty();closeMerge();
  toast('已把 '+moved+' 条并入「'+target+'」');
}
function openDelete(name){
  var t=tags.filter(function(x){return x.name===name;})[0];if(!t)return;
  deletingName=name;delName.textContent='「'+name+'」';delCount.textContent=t.count;
  delOv.classList.add('show');
}
function closeDelete(){delOv.classList.remove('show');deletingName=null;}
function doDelete(){
  if(!deletingName)return;
  var before=articles.length;
  articles=articles.filter(function(a){
    var c=(a&&a.category)?String(a.category):'未分类';
    return c!==deletingName;
  });
  var removed=before-articles.length;
  tags=tags.filter(function(t){return t.name!==deletingName;});
  renderTags();markTagDirty();closeDelete();
  toast('已删除分类，移除 '+removed+' 条');
}
function bindTagDrag(){
  if(!tagList)return;var dragName=null;
  tagList.addEventListener('dragstart',function(e){
    var el=e.target.closest('.tag-item');if(!el)return;
    dragName=el.getAttribute('data-name');el.classList.add('dragging');
    try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragName);}catch(err){}
  });
  tagList.addEventListener('dragend',function(e){
    var el=e.target.closest('.tag-item');if(el)el.classList.remove('dragging');
    var overs=tagList.querySelectorAll('.tag-item.over');
    for(var i=0;i<overs.length;i++)overs[i].classList.remove('over');
    dragName=null;
  });
  tagList.addEventListener('dragover',function(e){
    var el=e.target.closest('.tag-item');if(!el||!dragName)return;
    if(el.getAttribute('data-name')===dragName)return;
    e.preventDefault();
    var overs=tagList.querySelectorAll('.tag-item.over');
    for(var i=0;i<overs.length;i++)overs[i].classList.remove('over');
    el.classList.add('over');
  });
  tagList.addEventListener('dragleave',function(e){
    var el=e.target.closest('.tag-item');if(el)el.classList.remove('over');
  });
  tagList.addEventListener('drop',function(e){
    var el=e.target.closest('.tag-item');if(!el||!dragName)return;
    e.preventDefault();
    var targetName=el.getAttribute('data-name');if(targetName===dragName)return;
    var fromIdx=-1,toIdx=-1;
    for(var i=0;i<tags.length;i++){
      if(tags[i].name===dragName)fromIdx=i;
      if(tags[i].name===targetName)toIdx=i;
    }
    if(fromIdx===-1||toIdx===-1)return;
    var item=tags.splice(fromIdx,1)[0];tags.splice(toIdx,0,item);
    renderTags();markTagDirty();
  });
}
function bindTagClicks(){
  if(!tagList)return;
  tagList.addEventListener('click',function(e){
    var el=e.target.closest('.tag-item');if(!el)return;
    var name=el.getAttribute('data-name');
    var act=e.target.closest('[data-action]');if(!act)return;
    var a=act.getAttribute('data-action');
    if(a==='rename')startRename(act);
    else if(a==='merge')openMerge(name);
    else if(a==='delete')openDelete(name);
  });
}
function saveTags(){
  if(!isAdmin){toast('请先进入管理员模式');return;}
  if(!dirty){toast('没有修改');return;}
  var newArticles=[];
  tags.forEach(function(t){
    articles.forEach(function(a){
      var c=(a&&a.category)?String(a.category):'未分类';
      if(c===t.name)newArticles.push(a);
    });
  });
  articles.forEach(function(a){if(newArticles.indexOf(a)===-1)newArticles.push(a);});
  articles=newArticles;
  renderNav();renderStats();takeTagSnap();renderTags();
  if(state.view==='home')renderHome();else renderArticle();
  if(gh&&gh.token){
    if(inCooldown())toast('已保存本地 · 冷却中，稍后推送');
    else{toast('正在推送到云端…');pushCloud(false).then(function(ok){if(ok)toast('已保存并推送');});}
  }else toast('已保存到本地');
}

    var b=e.target.closest('button[data-t]');if(!b)return;
    var t=TOOLS[parseInt(b.getAttribute('data-t'),10)];
    if(t){wrapSel(t.w[0],t.w[1]);try{edContent.focus();}catch(err){}syncPreview();}
  });
  edContent.addEventListener('input',syncPreview);
  edContent.addEventListener('keydown',function(e){
    if(e.key!=='Tab')return;e.preventDefault();
    var ta=edContent;ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');syncPreview();
  });
  edPrevBtn.addEventListener('click',function(){
    var on=edMain.classList.toggle('pv');edPrevBtn.classList.toggle('active',on);
    if(on)syncPreview();
  });
  edSave.addEventListener('click',saveEditor);
  edCancel.addEventListener('click',closeEditor);
  edClose.addEventListener('click',closeEditor);
  edDel.addEventListener('click',deleteCurrent);

  cloudCfgBtn.addEventListener('click',function(e){e.stopPropagation();openGh();});
  btnPush.addEventListener('click',function(){pushCloud(false);});
  btnPull.addEventListener('click',function(){
    if(!isAdmin)return;toast('正在拉取…');
    loadAdmin().then(function(list){applyArticles(list);toast('已拉取 '+list.length+' 个条目');})
      .catch(function(err){toast('拉取失败：'+err.message);});
  });
  btnExport.addEventListener('click',function(){
    if(articles.length===0){toast('还没有内容');return;}
    try{
      var blob=new Blob([JSON.stringify(articles,null,2)],{type:'application/json;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download='wiki-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast('已导出 '+articles.length+' 个条目');
    }catch(err){alert('导出失败：'+err.message);}
  });
  btnTags.addEventListener('click',openTags);
  btnHome.addEventListener('click',function(){
    history.pushState(null,'',location.pathname+location.search);
    onHash();
  });

  tagClose.addEventListener('click',closeTags);
  tagCancel.addEventListener('click',closeTags);
  tagSave.addEventListener('click',saveTags);

  mergeClose.addEventListener('click',closeMerge);
  mergeCancel.addEventListener('click',closeMerge);
  mergeOk.addEventListener('click',doMerge);

  delClose.addEventListener('click',closeDelete);
  delCancel.addEventListener('click',closeDelete);
  delOk.addEventListener('click',doDelete);

  ghClose.addEventListener('click',closeGh);
  ghCancel.addEventListener('click',closeGh);
  ghSave.addEventListener('click',function(){
    var token=ghToken.value.trim();
    if(!token){toast('请填 Token');return;}
    gh={token:token};storage.set(K_GH,JSON.stringify(gh));
    isAdmin=true;applyMode();updateCloudUI();closeGh();
    toast('已进入管理员模式，正在拉取…');
    loadAdmin().then(function(list){applyArticles(list);toast('已连接 · '+list.length+' 个条目');})
      .catch(function(err){toast('已连接，但拉取失败：'+err.message);});
  });
  ghDisconn.addEventListener('click',function(){
    if(!confirm('退出管理员模式？'))return;
    gh=null;isAdmin=false;storage.del(K_GH);
    applyMode();updateCloudUI();closeGh();
    toast('已退出管理员模式');
    loadPublic().then(applyArticles).catch(function(){});
  });

  themeClose.addEventListener('click',closeTheme);
  themeGrid.addEventListener('click',function(e){
    var card=e.target.closest('[data-theme-val]');if(!card)return;
    applyTheme(card.getAttribute('data-theme-val'));closeTheme();
  });

  [edOv,ghOv,themeOv,tagOv,mergeOv,delOv].forEach(function(ov){
    if(!ov)return;
    ov.addEventListener('click',function(e){
      if(e.target!==ov)return;
      if(ov===edOv)closeEditor();
      else if(ov===ghOv)closeGh();
      else if(ov===themeOv)closeTheme();
      else if(ov===tagOv)closeTags();
      else if(ov===mergeOv)closeMerge();
      else if(ov===delOv)closeDelete();
    });
  });

  document.addEventListener('keydown',function(e){
    if(edOv.classList.contains('show')){
      if(e.key==='Escape'){e.preventDefault();closeEditor();}
      else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveEditor();}
      return;
    }
    if(ghOv.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();closeGh();}return;}
    if(themeOv.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();closeTheme();}return;}
    if(tagOv.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();closeTags();}return;}
    if(mergeOv.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();closeMerge();}return;}
    if(delOv.classList.contains('show')){if(e.key==='Escape'){e.preventDefault();closeDelete();}return;}

    var tag=document.activeElement&&document.activeElement.tagName;
    var typing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';
    if(e.key==='/'&&!typing){e.preventDefault();searchEl.focus();searchEl.select();return;}
    if(e.key==='Escape'){
      if(document.activeElement===searchEl&&(searchEl.value||state.query)){
        searchEl.value='';state.query='';
        if(state.view==='home')renderHome();else renderNav();
      }else{try{searchEl.blur();}catch(err){}closeSidebar();}
      return;
    }
    if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
      var k=e.key.toLowerCase();
      if(k==='e'&&isAdmin){e.preventDefault();editBtn.click();}
      else if(k==='n'&&isAdmin){e.preventDefault();newBtn.click();}
      else if(k==='h'){e.preventDefault();history.pushState(null,'',location.pathname+location.search);onHash();}
    }
  });

  window.addEventListener('beforeunload',function(e){
    if(edOv.classList.contains('show')||dirty){e.preventDefault();e.returnValue='';}
  });

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){resizeCanvas();onScroll();},{passive:true});
  document.addEventListener('visibilitychange',function(){
    particleRunning=!document.hidden;
    if(particleRunning)drawParticles();
  });

  /* popstate 让首页锚点也能触发路由 */
  window.addEventListener('popstate',onHash);

  bindTagClicks();
  bindTagDrag();
}

/* ===== 启动 ===== */
function boot(){
  try{
    if(bootEl&&bootEl.parentNode)bootEl.parentNode.removeChild(bootEl);
    topbarEl.hidden=false;sidebarEl.hidden=false;mainEl.hidden=false;bdEl.hidden=false;

    applyTheme(curTheme);
    initParticles();
    buildToolbar();
    bind();
    applyMode();
    updateCloudUI();
    renderNav();
    onHash();
    window.addEventListener('hashchange',onHash);
    updateScroll();

    var raw=storage.get(K_GH);
    if(raw){
      try{
        var c=JSON.parse(raw);
        if(c&&c.token){
          gh=c;isAdmin=true;applyMode();updateCloudUI();
          loadAdmin().then(function(list){applyArticles(list);toast('已加载 '+list.length+' 个条目');})
            .catch(function(){loadPublic().then(applyArticles).catch(function(){articles=[];renderHome();});});
          return;
        }
      }catch(e){}
    }

    loadPublic().then(function(list){applyArticles(list);})
      .catch(function(err){
        console.warn('[wiki] 加载失败',err);
        articles=[];renderStats();showView('home');renderHome();
        cloudSub.textContent='加载失败';
        cloudDot.className='dot';
      });
  }catch(e){
    console.error('[wiki] 启动失败',e);
    var b=$('boot');
    if(b)b.innerHTML='初始化失败：'+(e&&e.message?e.message:e);
  }
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
</body>
</html>
