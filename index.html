<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>红石的小站</title>
<meta name="description" content="红石的小站 —— Minecraft 的小玩具、资源与笔记。">
<meta name="theme-color" content="#070a08">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23070a08'/><rect x='18' y='18' width='30' height='30' rx='5' fill='%235df08d'/><rect x='52' y='18' width='30' height='30' rx='5' fill='%232fbf66'/><rect x='18' y='52' width='30' height='30' rx='5' fill='%232fbf66'/><rect x='52' y='52' width='30' height='30' rx='5' fill='%235df08d'/></svg>">
<link rel="stylesheet" href="./assets/css/ui.css">
<style>
/* ══════════════════════════════════════════════════════════════════
   首页 —— 深色终端。一行品牌、一块标题、两张模块卡，别的都不挂。
   ══════════════════════════════════════════════════════════════════ */

body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ── 主区 ─────────────────────────────────────────────────────── */
main{
  position:relative;z-index:2;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(28px,7vh,86px) 20px clamp(36px,8vh,90px);
}
.hero{width:100%;max-width:660px;display:flex;flex-direction:column;align-items:center;text-align:center}

/* 状态行：像终端提示符 */
.hero-kicker{
  display:inline-flex;align-items:center;gap:9px;margin-bottom:22px;
  padding:4px 12px 4px 10px;border-radius:999px;
  font-family:var(--ui-mono);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ui-ac);background:rgba(93,240,141,.06);
  border:1px solid var(--ui-ac-bd);
}
.hero-kicker .led{
  width:6px;height:6px;border-radius:50%;background:var(--ui-ac);flex:none;
  box-shadow:0 0 8px var(--ui-ac);animation:led 2.4s infinite;
}
@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}
.hero-kicker .sep{color:var(--ui-faint);opacity:.7}

/* 标题：逐字上浮 + 绿光 */
.hero-title{
  margin:0;font-size:clamp(2.9rem,8.4vw,5.6rem);line-height:1.06;font-weight:900;
  letter-spacing:.01em;
}
.hero-title .ch{
  display:inline-block;opacity:0;transform:translateY(28px) scale(.96);filter:blur(6px);
  animation:chIn .78s cubic-bezier(.19,1,.22,1) forwards;
  background-image:linear-gradient(100deg,#dff6e6 8%,#7df5a4 42%,#3ddc7d 72%,#9ef7c0 100%);
  background-size:5em 100%;
  background-position:calc(var(--i,0) * -1em) 0;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 22px rgba(93,240,141,.28));
}
@keyframes chIn{to{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 22px rgba(93,240,141,.28))}}

/* 副标题：终端注释 */
.hero-sub{
  margin:16px 0 0;font-family:var(--ui-mono);font-size:12px;line-height:1.8;
  color:var(--ui-dim);letter-spacing:.02em;
}
.hero-sub i{color:var(--ui-faint);font-style:normal}

/* 光标 */
.caret{
  display:inline-block;width:7px;height:1.05em;margin-left:3px;
  vertical-align:-.16em;background:var(--ui-ac);box-shadow:0 0 10px var(--ui-ac);
  animation:caret 1.15s steps(1) infinite;
}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

/* ── 模块卡 ───────────────────────────────────────────────────── */
.mods{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:clamp(30px,5vh,46px)}

.mod{
  position:relative;display:flex;align-items:center;gap:15px;
  padding:15px 16px;border-radius:var(--ui-r-lg);
  background:linear-gradient(180deg,rgba(18,26,19,.92),rgba(13,18,14,.92));
  border:1px solid var(--ui-line);
  text-align:left;
  transition:border-color .2s var(--ui-ease),transform .2s var(--ui-ease),
             box-shadow .2s var(--ui-ease),background .2s var(--ui-ease);
  isolation:isolate;overflow:hidden;
}
/* 悬停时从左侧扫进来的一道绿光 */
.mod::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:0;
  background:radial-gradient(120% 140% at 0% 50%,rgba(93,240,141,.13),transparent 62%);
  transition:opacity .25s var(--ui-ease);
}
.mod:hover{
  border-color:var(--ui-ac-bd);transform:translateY(-2px);
  box-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 1px rgba(93,240,141,.14);
  background:linear-gradient(180deg,rgba(22,32,24,.96),rgba(14,20,15,.96));
}
.mod:hover::before{opacity:1}
.mod:active{transform:translateY(0)}

.mod .ico{
  flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:var(--ui-r);
  background:var(--ui-sunk);border:1px solid var(--ui-line);
  transition:border-color .2s var(--ui-ease),box-shadow .2s var(--ui-ease);
}
.mod .ico img{width:30px;height:30px;object-fit:contain;display:block;image-rendering:pixelated}
.mod:hover .ico{border-color:var(--ui-ac-bd);box-shadow:0 0 18px rgba(93,240,141,.16)}

.mod .body{flex:1;min-width:0}
.mod .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mod .name{font-size:14.5px;font-weight:800;letter-spacing:-.01em;color:var(--ui-ink)}
.mod:hover .name{color:#eaffef}
.mod .idx{
  font-family:var(--ui-mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  color:var(--ui-faint);
}
.mod .desc{
  margin:4px 0 0;font-size:11.5px;line-height:1.7;color:var(--ui-dim);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mod .go{
  flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;
  color:var(--ui-faint);border:1px solid var(--ui-line);
  font-size:12px;transition:all .22s var(--ui-ease);
}
.mod:hover .go{
  color:#05130a;background:var(--ui-ac);border-color:var(--ui-ac);
  box-shadow:0 0 16px rgba(93,240,141,.45);transform:translateX(2px);
}

/* ── 页脚 ─────────────────────────────────────────────────────── */
footer{
  position:relative;z-index:2;flex:none;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 20px 22px;border-top:1px solid var(--ui-line);
  font-family:var(--ui-mono);font-size:10.5px;letter-spacing:.05em;color:var(--ui-faint);
  background:rgba(7,10,8,.72);
}
footer .sp{flex:1}
/* 「存档」：压得很淡，知道的人点得到 */
.archive{
  color:#2c3830;font-size:10px;letter-spacing:.1em;text-decoration:none;
  transition:color .25s var(--ui-ease);
}
.archive:hover{color:var(--ui-ac)}

@media (max-width:640px){
  main{padding:34px 14px 40px;justify-content:flex-start}
  .hero-kicker{margin-bottom:18px;font-size:9.5px;letter-spacing:.12em}
  .hero-sub{font-size:11px;margin-top:13px}
  .mods{margin-top:28px;gap:8px}
  .mod{padding:13px 13px;gap:12px}
  .mod .ico{width:40px;height:40px}
  .mod .ico img{width:26px;height:26px}
  .mod .name{font-size:13.5px}
  .mod .desc{font-size:11px;-webkit-line-clamp:3}
  .mod .go{display:none}
  footer{padding:14px 14px 18px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  #fx{display:none}
  .hero-title .ch{opacity:1;transform:none;filter:none;animation:none}
  .caret,.hero-kicker .led{animation:none}
}
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="ui-ambient" aria-hidden="true"></div>

<header class="ui-top">
  <a class="ui-brand" href="./index.html" aria-label="红石的小站 首页">
    <span class="ui-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    红石的小站
  </a>
  <span class="sp"></span>
  <a class="ui-link" href="https://github.com/HSDL03/HStool" target="_blank" rel="noopener">GITHUB ↗</a>
</header>

<main>
  <div class="hero">
    <div class="hero-kicker">
      <span class="led"></span>STATION<span class="sep">/</span>ONLINE<span class="sep">/</span><span id="stamp">2026</span>
    </div>

    <h1 class="hero-title" id="title" aria-label="红石的小站"></h1>

    <p class="hero-sub">Minecraft 的小玩具、资源与笔记<i>  //  全部在浏览器本地跑</i><span class="caret" aria-hidden="true"></span></p>

    <nav class="mods" aria-label="主要工具">
      <a class="mod" href="./tools/mcgen.html">
        <span class="ico"><img src="./assets/mc-textures/note_block.png" alt="" onerror="this.style.display='none'"></span>
        <span class="body">
          <span class="row1"><span class="idx">01</span><span class="name">我的世界结构生成</span></span>
          <span class="desc">图片 / 方块图标 / MIDI → 地图画与红石音乐：像素画、音符盒乐谱和 .mcfunction 指令，作品存在本机，下载 .mcstructure 再拿去编辑器里改。</span>
        </span>
        <span class="go" aria-hidden="true">↗</span>
      </a>

      <a class="mod" href="./tools/structure.html">
        <span class="ico"><img src="./assets/mc-textures/structure_block.png" alt="" onerror="this.style.display='none'"></span>
        <span class="body">
          <span class="row1"><span class="idx">02</span><span class="name">结构处理器</span></span>
          <span class="desc">上传 .mcstructure / .schem / .nbt，原版贴图 3D 渲染，点选或框选方块直接改 NBT（命令、告示牌、箱子…），可再导出回游戏。</span>
        </span>
        <span class="go" aria-hidden="true">↗</span>
      </a>
    </nav>
  </div>
</main>

<footer>
  <span>© <span id="year">2026</span> 红石的小站</span>
  <span class="sp"></span>
  <a class="archive" href="./pages/legacy-home.html" title="旧版首页存档">ARCHIVE</a>
</footer>

<script>
(function () {
  'use strict';
  var d = document, w = window;
  var $ = function (s) { return d.querySelector(s); };
  var reduced = w.matchMedia && w.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── 标题逐字入场：每个字各裁一遍渐变，--i 往左推 1em 拼成连续色带 ── */
  var TEXT = '红石的小站';
  var title = $('#title');
  if (title) {
    title.innerHTML = TEXT.split('').map(function (c, i) {
      return '<span class="ch" style="--i:' + i + ';animation-delay:' +
        (0.055 * i + 0.1).toFixed(2) + 's">' + c + '</span>';
    }).join('');
  }

  /* ── 背景：缓慢漂移的等距线框方块，鼠标带一点视差 ───────────────── */
  (function fx() {
    var cv = $('#fx');
    if (!cv || !cv.getContext || reduced) return;
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, dpr = 1, cubes = [], raf = 0, last = 0;
    var mx = 0.5, my = 0.5, px = 0, py = 0;
    var AC = '93,240,141';

    function size() {
      dpr = Math.min(w.devicePixelRatio || 1, 2);
      W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function make() {
      var n = W < 720 ? 11 : 20;
      cubes = [];
      for (var i = 0; i < n; i++) {
        cubes.push({
          x: Math.random() * W, y: Math.random() * H,
          s: 10 + Math.random() * 22,
          a: Math.random() * Math.PI * 2,
          va: (Math.random() - 0.5) * 0.0055,
          vx: (Math.random() - 0.5) * 0.14,
          vy: (Math.random() - 0.5) * 0.2,
          z: 0.22 + Math.random() * 0.78
        });
      }
    }

    function iso(x, y, s, a) {
      var ca = Math.cos(a), sa = Math.sin(a);
      var P = function (u, v) {
        return [x + (u * ca - v * sa) * s, y + (u * sa + v * ca) * s * 0.5];
      };
      return { t: P(0, -1), r: P(1, 0), b: P(0, 1), l: P(-1, 0), c: P(0, 0) };
    }

    function frame(ts) {
      if (!last) last = ts;
      var dt = Math.min(48, ts - last); last = ts;
      px += ((mx - 0.5) * 24 - px) * 0.055;
      py += ((my - 0.5) * 16 - py) * 0.055;

      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < cubes.length; i++) {
        var q = cubes[i];
        q.a += q.va * dt * 0.06;
        q.x += q.vx * dt * 0.06;
        q.y += q.vy * dt * 0.06;
        if (q.x < -70) q.x = W + 70;
        if (q.x > W + 70) q.x = -70;
        if (q.y < -70) q.y = H + 70;
        if (q.y > H + 70) q.y = -70;

        var s = q.s * (0.55 + q.z * 0.65);
        var g = iso(q.x + px * q.z, q.y + py * q.z, s, q.a);

        /* 三个可见面：极暗的填充，让线框有厚度 */
        ctx.beginPath();
        ctx.moveTo(g.t[0], g.t[1]); ctx.lineTo(g.r[0], g.r[1]);
        ctx.lineTo(g.c[0], g.c[1]); ctx.lineTo(g.l[0], g.l[1]); ctx.closePath();
        ctx.fillStyle = 'rgba(' + AC + ',' + (0.012 + q.z * 0.02).toFixed(3) + ')';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(g.l[0], g.l[1]); ctx.lineTo(g.c[0], g.c[1]);
        ctx.lineTo(g.b[0], g.b[1]); ctx.closePath();
        ctx.fillStyle = 'rgba(' + AC + ',' + (0.006 + q.z * 0.012).toFixed(3) + ')';
        ctx.fill();

        /* 线框：靠 z 决定亮度，远的几乎看不见 */
        ctx.beginPath();
        ctx.moveTo(g.t[0], g.t[1]); ctx.lineTo(g.r[0], g.r[1]);
        ctx.lineTo(g.b[0], g.b[1]); ctx.lineTo(g.l[0], g.l[1]); ctx.closePath();
        ctx.moveTo(g.c[0], g.c[1]); ctx.lineTo(g.t[0], g.t[1]);
        ctx.moveTo(g.c[0], g.c[1]); ctx.lineTo(g.b[0], g.b[1]);
        ctx.strokeStyle = 'rgba(' + AC + ',' + (0.03 + q.z * 0.1).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      raf = requestAnimationFrame(frame);
    }

    size(); make();
    raf = requestAnimationFrame(frame);
    w.addEventListener('resize', function () { size(); make(); });
    w.addEventListener('pointermove', function (e) {
      mx = e.clientX / Math.max(1, w.innerWidth);
      my = e.clientY / Math.max(1, w.innerHeight);
    }, { passive: true });
    d.addEventListener('visibilitychange', function () {
      if (d.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
  })();

  var yr = new Date().getFullYear();
  var s1 = $('#stamp'), s2 = $('#year');
  if (s1) s1.textContent = yr;
  if (s2) s2.textContent = yr;
})();
</script>
</body>
</html>
