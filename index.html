<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<script>
(function(){try{var t=localStorage.getItem('wiki-theme');var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root,[data-theme="mc-wiki"]{--bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;--bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;--sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;--bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);--bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(61,82,31,.13);--blob2:rgba(106,140,60,.09);--blob3:rgba(180,150,80,.07);--grid:rgba(61,82,31,.04);--p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;--hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);--tile-accent:linear-gradient(135deg,#7a9c3c,#3d521f);--topbar-bg:linear-gradient(180deg,#56682c,#3d521f);--topbar-fg:#fff;--topbar-bd:#2a3a1a}
[data-theme="mc-night"]{--bg:#1a1a1a;--bg2:#242424;--bg3:#303030;--text:#e0e0e0;--muted:#909090;--bd:#505050;--bd2:#6a6a6a;--ac:#8ec44a;--acs:#2a3a1a;--ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;--sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;--bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);--bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(142,196,74,.10);--blob2:rgba(90,140,60,.07);--blob3:rgba(120,90,40,.07);--grid:rgba(255,255,255,.025);--p1:142,196,74;--p2:90,140,60;--p3:200,180,100;--p4:120,90,40;--hero-grad:linear-gradient(135deg,#8ec44a,#3d521f);--tile-accent:linear-gradient(135deg,#8ec44a,#3d521f);--topbar-bg:linear-gradient(180deg,#2a3a1a,#1a2a0a);--topbar-fg:#e8ffd0;--topbar-bd:#0a1a00}
[data-theme="mc-nether"]{--bg:#1a0a0a;--bg2:#2a1212;--bg3:#3a1a1a;--text:#f0d0d0;--muted:#a08080;--bd:#6a3030;--bd2:#8a4040;--ac:#ff6030;--acs:#3a1a10;--ok:#5ab05a;--warn:#d4a72c;--dgr:#f85050;--sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;--bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);--bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(255,96,48,.12);--blob2:rgba(200,60,30,.09);--blob3:rgba(255,150,80,.07);--grid:rgba(255,150,100,.03);--p1:255,96,48;--p2:200,60,30;--p3:255,150,80;--p4:120,40,20;--hero-grad:linear-gradient(135deg,#ff6030,#8a2010);--tile-accent:linear-gradient(135deg,#ff6030,#8a2010);--topbar-bg:linear-gradient(180deg,#3a1212,#1a0a0a);--topbar-fg:#ffe0d0;--topbar-bd:#0a0500}
[data-theme="mc-end"]{--bg:#0f0a1a;--bg2:#1a1230;--bg3:#251a40;--text:#e0d0f0;--muted:#9080a0;--bd:#4a3a6a;--bd2:#6a5a8a;--ac:#a060ff;--acs:#2a1a3a;--ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;--sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;--bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);--bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(160,96,255,.12);--blob2:rgba(120,60,200,.08);--blob3:rgba(200,150,255,.06);--grid:rgba(200,150,255,.025);--p1:160,96,255;--p2:120,60,200;--p3:200,150,255;--p4:80,40,120;--hero-grad:linear-gradient(135deg,#a060ff,#4a2080);--tile-accent:linear-gradient(135deg,#a060ff,#4a2080);--topbar-bg:linear-gradient(180deg,#2a1a3a,#0f0a1a);--topbar-fg:#e0d0ff;--topbar-bd:#0a0510}
[data-theme="sakura"]{--bg:#fffafc;--bg2:#fff0f5;--bg3:#ffe0ea;--text:#2a1a20;--muted:#806070;--bd:#e0b0c0;--bd2:#a06080;--ac:#d04080;--acs:#ffe0ea;--ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;--sh:2px 2px 0 rgba(160,80,120,.2);--r:4px;--bevel:inset -1px -1px 0 rgba(160,80,120,.1),inset 1px 1px 0 rgba(255,255,255,.8);--bevel-in:inset 1px 1px 0 rgba(160,80,120,.1),inset -1px -1px 0 rgba(255,255,255,.8);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(208,64,128,.12);--blob2:rgba(240,120,160,.08);--blob3:rgba(255,180,200,.06);--grid:rgba(208,64,128,.04);--p1:208,64,128;--p2:240,120,160;--p3:255,180,200;--p4:160,80,120;--hero-grad:linear-gradient(135deg,#d04080,#ff80a0);--tile-accent:linear-gradient(135deg,#ff80a0,#d04080);--topbar-bg:linear-gradient(180deg,#d06090,#a04070);--topbar-fg:#fff;--topbar-bd:#802050}
[data-theme="ocean"]{--bg:#f0f8ff;--bg2:#e0f0fa;--bg3:#c8e0f0;--text:#0a1a2a;--muted:#406080;--bd:#a0c0d8;--bd2:#406080;--ac:#0066cc;--acs:#c8e4ff;--ok:#1a7f37;--warn:#b08800;--dgr:#cf222e;--sh:2px 2px 0 rgba(32,80,140,.2);--r:4px;--bevel:inset -1px -1px 0 rgba(32,80,140,.1),inset 1px 1px 0 rgba(255,255,255,.8);--bevel-in:inset 1px 1px 0 rgba(32,80,140,.1),inset -1px -1px 0 rgba(255,255,255,.8);--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(0,102,204,.10);--blob2:rgba(64,160,220,.08);--blob3:rgba(120,200,240,.06);--grid:rgba(0,102,204,.04);--p1:0,102,204;--p2:64,160,220;--p3:120,200,240;--p4:32,80,140;--hero-grad:linear-gradient(135deg,#0066cc,#40a0dc);--tile-accent:linear-gradient(135deg,#40a0dc,#0066cc);--topbar-bg:linear-gradient(180deg,#2080c0,#004890);--topbar-fg:#fff;--topbar-bd:#002040}
[data-theme="github-light"]{--bg:#ffffff;--bg2:#f6f8fa;--bg3:#eef1f4;--text:#1f2328;--muted:#59636e;--bd:#d1d9e0;--bd2:#a0a8b0;--ac:#0969da;--acs:#ddf4ff;--ok:#1a7f37;--warn:#d4a72c;--dgr:#cf222e;--sh:0 1px 4px rgba(31,35,40,.08);--r:6px;--bevel:none;--bevel-in:none;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(9,105,218,.08);--blob2:rgba(163,113,247,.06);--blob3:rgba(219,112,147,.05);--grid:rgba(31,35,40,.02);--p1:9,105,218;--p2:163,113,247;--p3:219,112,147;--p4:31,35,40;--hero-grad:linear-gradient(135deg,#0969da,#a371f7);--tile-accent:linear-gradient(135deg,#0969da,#a371f7);--topbar-bg:#ffffff;--topbar-fg:#1f2328;--topbar-bd:#d1d9e0}
[data-theme="github-dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#e6edf3;--muted:#9198a1;--bd:#30363d;--bd2:#484f58;--ac:#4493f8;--acs:#16233a;--ok:#3fb950;--warn:#d4a72c;--dgr:#f85149;--sh:0 1px 4px rgba(0,0,0,.4);--r:6px;--bevel:none;--bevel-in:none;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(68,147,248,.06);--blob2:rgba(163,113,247,.05);--blob3:rgba(219,112,147,.04);--grid:rgba(230,237,243,.02);--p1:68,147,248;--p2:163,113,247;--p3:219,112,147;--p4:230,237,243;--hero-grad:linear-gradient(135deg,#4493f8,#a371f7);--tile-accent:linear-gradient(135deg,#4493f8,#a371f7);--topbar-bg:#161b22;--topbar-fg:#e6edf3;--topbar-bd:#30363d}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;transition:background-color .3s}
body{margin:0;padding-top:46px;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}
.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid var(--topbar-bd);z-index:50;transition:background .3s,border-color .3s,box-shadow .25s}
[data-theme^="mc-"] .topbar{border-bottom-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.topbar.scrolled{box-shadow:0 4px 16px rgba(0,0,0,.2)}
[data-theme^="mc-"] .topbar.scrolled{box-shadow:0 4px 0 rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--topbar-fg);text-decoration:none;white-space:nowrap;cursor:pointer}
[data-theme^="mc-"] .logo{text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.logo-icon{display:inline-block;font-size:16px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.sp{flex:1}
.icon{display:grid;place-items:center;width:30px;height:30px;flex:none;font-size:14px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s,transform .2s}
.icon:hover{background:var(--bg3);color:var(--text)}
[data-theme^="mc-"] .icon,[data-theme="sakura"] .icon,[data-theme="ocean"] .icon{color:rgba(255,255,255,.85)}
[data-theme^="mc-"] .icon:hover,[data-theme="sakura"] .icon:hover,[data-theme="ocean"] .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}
.icon.spin-anim{animation:spinIcon .7s linear infinite}
@keyframes spinIcon{to{transform:rotate(360deg)}}
.topbar-search{flex:0 1 260px;min-width:100px;height:30px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);outline:none;transition:border-color .2s,box-shadow .2s}
[data-theme^="mc-"] .topbar-search{background:rgba(255,255,255,.92);border:2px solid var(--topbar-bd);color:#1f1f1f;box-shadow:var(--bevel-in)}
[data-theme="mc-night"] .topbar-search,[data-theme="mc-nether"] .topbar-search,[data-theme="mc-end"] .topbar-search{background:#202020;color:#e0e0e0;border-color:var(--topbar-bd)}
.topbar-search:focus{background:var(--bg);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
[data-theme^="mc-"] .topbar-search:focus{box-shadow:0 0 0 3px var(--acs)}
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50%,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
.float-decor{position:absolute;inset:0}
.fd{position:absolute;pointer-events:none;opacity:.22}
.fd.ring{border:2px solid var(--ac);border-radius:50%;opacity:.14}
.fd.square{border:2px solid var(--ac);opacity:.12}
.fd.cross::before,.fd.cross::after{content:"";position:absolute;background:var(--ac);opacity:.2}
.fd.cross::before{width:22px;height:2px;top:50%;left:0;margin-top:-1px}
.fd.cross::after{width:2px;height:22px;top:0;left:50%;margin-left:-1px}
.fd.tri{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid var(--ac);opacity:.1}
.fd.plus{font-size:15px;color:var(--ac);opacity:.16;font-weight:300;line-height:1}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-28px) rotate(180deg)}}
@keyframes floatX{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(36px) rotate(-180deg)}}
@keyframes floatXY{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(28px,-18px) rotate(90deg)}50%{transform:translate(-18px,36px) rotate(180deg)}75%{transform:translate(36px,18px) rotate(270deg)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:80px 24px 80px}
.announce-section{max-width:820px;margin:0 auto 28px;display:flex;flex-direction:column;gap:8px}
.announce-section[hidden]{display:none!important}
.announce-item{position:relative;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);animation:annIn .5s cubic-bezier(.22,1,.36,1) both;overflow:hidden}
@keyframes annIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.announce-item[data-type="info"]{border-color:var(--ac)}
.announce-item[data-type="success"]{border-color:var(--ok)}
.announce-item[data-type="warn"]{border-color:var(--warn)}
.announce-item[data-type="danger"]{border-color:var(--dgr)}
.announce-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s}
.announce-head:hover{background:var(--bg3)}
.announce-icon{flex:none;font-size:20px;line-height:1.2}
.announce-title{flex:1;min-width:0;font-size:14.5px;font-weight:800;color:var(--text);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.announce-cat{flex:none;padding:1px 8px;font-size:10.5px;font-weight:700;letter-spacing:.04em;background:var(--acs);border:1px solid var(--ac);color:var(--ac);border-radius:var(--r)}
.announce-arrow{flex:none;font-size:12px;color:var(--muted);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.announce-item.collapsed .announce-arrow{transform:rotate(-90deg)}
.announce-close{flex:none;width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s}
.announce-close:hover{background:var(--bg3);color:var(--dgr)}
.announce-body-wrap{overflow:hidden;transition:max-height .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;max-height:1200px;opacity:1}
.announce-item.collapsed .announce-body-wrap{max-height:0;opacity:0}
.announce-body{padding:0 14px 12px 44px;font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.announce-link{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--ac);text-decoration:none;border-bottom:1px dashed var(--ac);transition:all .2s}
.announce-link:hover{border-bottom-style:solid;opacity:.8}
.hero{text-align:center;padding:24px 0 32px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;margin-bottom:18px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);position:relative;opacity:0;animation:heroIn .7s cubic-bezier(.22,1,.36,1) .1s forwards}
.hero-badge .dot{width:8px;height:8px;flex:none;background:var(--ac);box-shadow:0 0 0 3px var(--acs);position:relative}
[data-theme^="mc-"] .hero-badge .dot{border-radius:0}
.hero-badge .dot::after{content:"";position:absolute;inset:0;background:var(--ac);animation:badgePulse 2s ease-out infinite;pointer-events:none}
[data-theme^="github-"] .hero-badge .dot::after{border-radius:50%}
@keyframes badgePulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.hero h1{margin:0 0 12px;font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;line-height:1.12;letter-spacing:-.03em;overflow:visible}
.hero h1 .char{display:inline-block;opacity:0;transform:translateY(28px) rotate(-12deg) scale(.85);animation:charIn .55s cubic-bezier(.34,1.56,.64,1) forwards;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
@keyframes charIn{60%{opacity:1}to{opacity:1;transform:none}}
.hero-sub{margin:0 auto 6px;max-width:520px;font-size:15px;color:var(--muted);line-height:1.65;opacity:0;animation:heroIn .7s cubic-bezier(.22,1,.36,1) .5s forwards}
.hero-line{display:inline-block;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd);font-size:12.5px;color:var(--muted);letter-spacing:.02em;opacity:0;animation:heroIn .7s cubic-bezier(.22,1,.36,1) .65s forwards}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* 筛选区 */
.filter-section{max-width:1180px;margin:0 auto 20px;display:flex;flex-direction:column;gap:10px}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);cursor:pointer;transition:all .15s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{color:var(--text);border-color:var(--ac);transform:translateY(-1px)}
.chip.active{color:#fff;background:var(--ac);border-color:var(--ac);box-shadow:var(--bevel),0 0 0 2px var(--acs)}
.chip .chip-count{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.chip.active .chip-count{opacity:1}
.chip-db{display:inline-flex;align-items:center;gap:3px}
.chip-db .db-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
[data-theme^="mc-"] .chip-db .db-dot{border-radius:0}
.chip[data-db="1"] .db-dot{background:var(--ac)}
.chip[data-db="0"] .db-dot{background:var(--ok)}
.filter-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;background:var(--bg2);border:2px dashed var(--bd);border-radius:var(--r)}
.filter-empty .ic{font-size:48px;opacity:.35;margin-bottom:12px;display:block;line-height:1}
.filter-empty .title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.columns{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.column{min-width:0}
.section-title{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--ac);box-shadow:var(--bevel);flex:none}
.section-title.deprecated::before{background:var(--muted);opacity:.5}
.section-title .count{font-size:11px;padding:1px 8px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;letter-spacing:0;text-transform:none;font-weight:600}

.card-ripple{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,rgba(var(--p1),.55) 0%,rgba(var(--p1),.28) 40%,rgba(var(--p1),0) 72%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:2;animation:cardRipple .72s cubic-bezier(.22,1,.36,1) forwards}

[data-theme^="mc-"] .tc-name{color:#2a3a1a;text-shadow:1px 1px 0 rgba(255,255,255,.4)}

<script>
(function(){
'use strict';

var GH_OWNER='HSDL03',GH_REPO='HSwiki',GH_BRANCH='main';
var DATA_FILE='tools-data.json';
var ANNOUNCE_FILE='announcement.json';
var RAW_BASE='https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/';
var CDN_BASE='https://cdn.jsdelivr.net/gh/'+GH_OWNER+'/'+GH_REPO+'@'+GH_BRANCH+'/';
var K_TOOLS_CACHE='tools-cache-v1',K_THEME='wiki-theme';
var K_ANN_DISMISS='announce-dismissed',K_ANN_COLLAPSE='announce-collapsed';
var CLOCK_MS=1000,LAT_PING_MS=3000,REFRESH_MS=120000;

var DEFAULT_TOOLS=[
  {id:'wiki',icon:'📚',name:'红石答辩wiki',desc:'轻量知识库 · 已停止维护',tag:'已废弃',url:'./wiki.html',requiresDb:false,deprecated:true,hidden:false},
  {id:'download',icon:'📥',name:'下载站',desc:'资源文件 · 便捷下载',tag:'资源',url:'./download.html',requiresDb:false,deprecated:false,hidden:false},
  {id:'misc',icon:'🧩',name:'杂类',desc:'零散工具 · 各种小玩意儿',tag:'综合',url:'./misc.html',requiresDb:false,deprecated:false,hidden:false}
];
var TOOLS=DEFAULT_TOOLS.slice();

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad2(n){return n<10?'0'+n:''+n;}
function fmtTime(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());}

var storage={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
};

var THEMES=[
  {id:'mc-wiki',name:'🟩 MC Wiki',desc:'我的世界中文 Wiki',colors:['#3d521f','#fffdf5','#56682c']},
  {id:'mc-night',name:'⬛ MC 夜晚',desc:'Minecraft 夜间模式',colors:['#8ec44a','#1a1a1a','#3d521f']},
  {id:'mc-nether',name:'🔥 MC 下界',desc:'地狱岩浆风',colors:['#ff6030','#1a0a0a','#8a2010']},
  {id:'mc-end',name:'🌌 MC 末地',desc:'末地虚空紫',colors:['#a060ff','#0f0a1a','#4a2080']},
  {id:'sakura',name:'🌸 樱花',desc:'粉嫩柔和',colors:['#d04080','#fffafc','#ff80a0']},
  {id:'ocean',name:'🌊 海洋',desc:'清凉海蓝',colors:['#0066cc','#f0f8ff','#40a0dc']},
  {id:'github-light',name:'☀️ GitHub 浅色',desc:'清爽默认',colors:['#0969da','#f6f8fa','#1f2328']},
  {id:'github-dark',name:'🌙 GitHub 暗色',desc:'护眼夜间',colors:['#4493f8','#161b22','#e6edf3']}
];
var curTheme=(function(){var s=storage.get(K_THEME);for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===s)return s;return 'mc-wiki';})();
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  storage.set(K_THEME,t);curTheme=t;
  buildThemeGrid();readThemeColors();initParticles();
}
function buildThemeGrid(){
  var grid=$('themeGrid');if(!grid)return;
  var html='';
  THEMES.forEach(function(th){
    html+='<button type="button" class="theme-card'+(th.id===curTheme?' active':'')+'" data-theme-val="'+escapeHtml(th.id)+'">'+
      '<div class="theme-prev"><span style="background:'+th.colors[0]+'"></span><span style="background:'+th.colors[1]+'"></span><span style="background:'+th.colors[2]+'"></span></div>'+
      '<div class="theme-name">'+escapeHtml(th.name)+'</div>'+
      '<div class="theme-desc">'+escapeHtml(th.desc)+'</div>'+
    '</button>';
  });
  grid.innerHTML=html;
}
var themeOv=$('themeOv'),themeGrid=$('themeGrid'),themeBtn=$('themeBtn'),themeClose=$('themeClose');
function openTheme(){buildThemeGrid();themeOv.classList.add('show');}
function closeTheme(){themeOv.classList.remove('show');}

var toastEl=$('toast'),toastTimer=null;
function toast(msg){
  if(!toastEl)return;
  toastEl.textContent=msg;toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2400);
}

/* ═══════════════ 公告 ═══════════════ */
var announceItems=[];
function loadDismissed(){
  try{
    var raw=storage.get(K_ANN_DISMISS);if(!raw)return {};
    var arr=JSON.parse(raw);if(!Array.isArray(arr))return {};
    var map={};arr.forEach(function(id){map[id]=1;});return map;
  }catch(e){return {};}
}
function saveDismissed(map){
  try{
    var arr=Object.keys(map).filter(function(k){return map[k];});
    storage.set(K_ANN_DISMISS,JSON.stringify(arr));
  }catch(e){}
}
var dismissedMap=loadDismissed();

/* 用户手动折叠状态：id -> true/false，覆盖默认 collapsed 字段 */
function loadCollapseOverride(){
  try{
    var raw=storage.get(K_ANN_COLLAPSE);if(!raw)return {};
    var o=JSON.parse(raw);if(!o||typeof o!=='object')return {};
    return o;
  }catch(e){return {};}
}
function saveCollapseOverride(o){
  try{storage.set(K_ANN_COLLAPSE,JSON.stringify(o));}catch(e){}
}
var collapseOverride=loadCollapseOverride();

function fetchAnnounce(url){
  return fetch(url+'?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);

function loadAnnouncement(){

function isCollapsed(it){
  /* 用户手动覆盖优先 */
  if(collapseOverride.hasOwnProperty(it.id))return !!collapseOverride[it.id];
  /* 否则用配置默认值 */
  return it.collapsed === true;
}

function renderAnnouncement(){
  var sec=$('announceSection');if(!sec)return;
  var visible=announceItems.filter(function(it){
    return it && it.enabled!==false && !dismissedMap[it.id];
  });
  if(visible.length===0){sec.hidden=true;sec.innerHTML='';return;}
  var html='';
  visible.forEach(function(it,i){
    var type=it.type||'info';
    var icon=it.icon||(type==='warn'?'⚠️':type==='danger'?'🚫':type==='success'?'✅':'📢');
    var collapsed=isCollapsed(it);
    var cat=it.category?'<span class="announce-cat">'+escapeHtml(it.category)+'</span>':'';
    html+='<div class="announce-item'+(collapsed?' collapsed':'')+'" data-type="'+escapeHtml(type)+'" data-id="'+escapeHtml(it.id||'')+'" style="animation-delay:'+(i*80)+'ms">'
      +'<div class="announce-head" data-toggle-ann="'+escapeHtml(it.id||'')+'">'
      +  '<span class="announce-icon">'+escapeHtml(icon)+'</span>'
      +  '<span class="announce-title">'+escapeHtml(it.title||'公告')+'</span>'
      +  cat
      +  '<span class="announce-arrow">▾</span>'
      +  '<button type="button" class="announce-close" data-close-ann="'+escapeHtml(it.id||'')+'" title="关闭">✕</button>'
      +'</div>'
      +'<div class="announce-body-wrap"><div class="announce-body">'
      +(it.content?escapeHtml(it.content):'')
      +(it.link?'<div><a class="announce-link" href="'+escapeHtml(it.link)+'" target="_blank" rel="noopener">'+escapeHtml(it.linkText||'查看详情')+' →</a></div>':'')
      +'</div></div>'
      +'</div>';
  });
  sec.innerHTML=html;
  sec.hidden=false;
}

function bindAnnounceEvents(){
  var sec=$('announceSection');if(!sec)return;
  sec.addEventListener('click',function(e){
    /* 关闭按钮 */
    var closeBtn=e.target.closest('[data-close-ann]');
    if(closeBtn){
      e.stopPropagation();
      var id=closeBtn.getAttribute('data-close-ann');
      if(id){dismissedMap[id]=1;saveDismissed(dismissedMap);}
      var card=closeBtn.closest('.announce-item');
      if(card){
        card.style.transition='opacity .25s,transform .25s';
        card.style.opacity='0';card.style.transform='translateY(-8px)';
        setTimeout(renderAnnouncement,250);
      }else{
        renderAnnouncement();
      }
      return;
    }
    /* 折叠/展开 */
    var head=e.target.closest('[data-toggle-ann]');
    if(head){
      var card=head.closest('.announce-item');
      if(!card)return;
      var id2=head.getAttribute('data-toggle-ann');
      var was=card.classList.contains('collapsed');
      card.classList.toggle('collapsed');
      if(id2){
        collapseOverride[id2]=!was;
        saveCollapseOverride(collapseOverride);
      }
    }
  });
}

function normTool(t,i){
  if(!t||typeof t!=='object')return null;
  var name=(typeof t.name==='string'&&t.name.trim())?t.name.trim():('未命名 '+(i+1));
  return {
    id:(typeof t.id==='string'&&t.id.trim())?t.id.trim():('tool-'+(i+1)),
    icon:(typeof t.icon==='string'&&t.icon.trim())?t.icon.trim():'🧰',
    name:name,
    desc:typeof t.desc==='string'?t.desc:'',
    tag:(typeof t.tag==='string'&&t.tag.trim())?t.tag.trim():'工具',
    url:typeof t.url==='string'?t.url:'',
    requiresDb:!!t.requiresDb,
    deprecated:!!t.deprecated,
    disabled:!!t.disabled,
    hidden:!!t.hidden
  };
}
function normList(arr){if(!Array.isArray(arr))return [];var list=[];arr.forEach(function(t,i){var n=normTool(t,i);if(n)list.push(n);});return list;}

function loadToolsCache(){
  try{var raw=storage.get(K_TOOLS_CACHE);if(!raw)return null;var o=JSON.parse(raw);if(!o||!Array.isArray(o.data)||o.data.length===0)return null;var list=normList(o.data);return list.length>0?list:null;}catch(e){return null;}
}
function saveToolsCache(list){try{storage.set(K_TOOLS_CACHE,JSON.stringify({t:Date.now(),data:list}));}catch(e){}}

function diffTools(oldList,newList){
  var oldIds={};oldList.forEach(function(t){oldIds[t.id]=true;});
  var newIds={};newList.forEach(function(t){newIds[t.id]=true;});
  var added=newList.filter(function(t){return !oldIds[t.id];});
  var removed=oldList.filter(function(t){return !newIds[t.id];});
  var common=newList.filter(function(t){return oldIds[t.id];});
  var edited=[];
  common.forEach(function(n){
    var o=oldList.find(function(x){return x.id===n.id;});if(!o)return;
    var os=[o.icon,o.name,o.desc,o.tag,o.url,o.requiresDb,o.deprecated,o.disabled,o.hidden].join('|');
    var ns=[n.icon,n.name,n.desc,n.tag,n.url,n.requiresDb,n.deprecated,n.disabled,n.hidden].join('|');
    if(os!==ns)edited.push(n);
  });
  return {added:added,removed:removed,edited:edited};
}

function fetchJson(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}

var hasLoadedOnce=false;
function loadTools(){
  var url1=RAW_BASE+DATA_FILE+'?t='+Date.now();
  var url2=CDN_BASE+DATA_FILE+'?t='+Date.now();
  var t0=Date.now();
  spSetBusy();
  return fetchJson(url1).catch(function(){return fetchJson(url2);}).then(function(data){
    var lat=Date.now()-t0;
    if(Array.isArray(data)&&data.length>0){
      var list=normList(data);
      if(list.length>0){
        if(hasLoadedOnce){
          var d=diffTools(TOOLS,list);var msgs=[];
          if(d.added.length>0)msgs.push('新增 '+d.added.length+' 个');
          if(d.removed.length>0)msgs.push('移除 '+d.removed.length+' 个');
          if(d.edited.length>0)msgs.push('更新 '+d.edited.length+' 个');
          if(msgs.length>0)toast('工具已同步：'+msgs.join(' · '));
        }
        hasLoadedOnce=true;
        TOOLS=list;saveToolsCache(list);spSetOK();
        return {ok:true,lat:lat};
      }
    }
    spSetOK();return {ok:false,lat:lat};
  }).catch(function(err){
    var lat=Date.now()-t0;
    console.warn('[index] 远程加载失败',err);
    spSetErr();
    return {ok:false,lat:lat,err:true};
  });
}

function pingLatency(){
  var t0=Date.now();
  return fetch(RAW_BASE+DATA_FILE+'?_='+Date.now(),{method:'HEAD',cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return Date.now()-t0;})
    .catch(function(){
      return fetch(CDN_BASE+DATA_FILE+'?_='+Date.now(),{method:'HEAD',cache:'no-store'})
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return Date.now()-t0;})
        .catch(function(){return -1;});
    });
}

var filterTag='__all__';
var filterDb='__all__';

function getVisibleTools(){
  return TOOLS.filter(function(t){return !t.hidden;});

function applyFilter(list){
  var q=searchQuery.trim().toLowerCase();
  return list.filter(function(t){
    if(filterTag!=='__all__'&&(t.tag||'工具')!==filterTag)return false;
    if(filterDb==='__db__'&&!t.requiresDb)return false;
    if(filterDb==='__nodb__'&&t.requiresDb)return false;
    if(q){
      var hay=(t.name+' '+(t.desc||'')+' '+(t.tag||'')).toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
}

var cardBoxes=[],boxesDirty=true;
function refreshCardBoxes(){
  cardBoxes=[];
  var cards=document.querySelectorAll('.tool-card');
  for(var i=0;i<cards.length;i++){
    var el=cards[i],inner=el.querySelector('.card-inner');
    if(!inner)continue;
    var r=el.getBoundingClientRect();
    cardBoxes.push({
      el:el,inner:inner,glow:el.querySelector('.card-glow'),
      left:r.left,top:r.top,right:r.right,bottom:r.bottom,
      halfW:(r.right-r.left)/2,halfH:(r.bottom-r.top)/2,
      cx:(r.left+r.right)/2,cy:(r.top+r.bottom)/2,
      hitCooldown:0
    });
  }
  boxesDirty=false;
}

function hitCard(box){
  var el=box.el;if(!el)return;
  el.classList.add('hit');
  clearTimeout(el.__hitT);
  el.__hitT=setTimeout(function(){el.classList.remove('hit');},480);
}

function playClickAnimation(box,clientX,clientY){
  var el=box.el,inner=box.inner;if(!el||!inner)return;
  var relX=clientX-box.left,relY=clientY-box.top;
  var rip=document.createElement('span');
  rip.className='card-ripple';rip.style.left=relX+'px';rip.style.top=relY+'px';
  el.appendChild(rip);
  setTimeout(function(){if(rip.parentNode)rip.parentNode.removeChild(rip);},780);
  var ring=document.createElement('span');
  ring.className='card-ring';ring.style.left=relX+'px';ring.style.top=relY+'px';
  el.appendChild(ring);
  setTimeout(function(){if(ring.parentNode)ring.parentNode.removeChild(ring);},700);
  inner.style.setProperty('--press','0.95');
  clearTimeout(el.__pressT1);clearTimeout(el.__pressT2);
  el.__pressT1=setTimeout(function(){
    inner.style.setProperty('--press','1.045');
    el.__pressT2=setTimeout(function(){inner.style.setProperty('--press','1');},180);
  },90);
}

var mouseX=-9999,mouseY=-9999;

function onGlobalMouseMove(e){
  mouseX=e.clientX;mouseY=e.clientY;
  if(matchMedia('(hover: none)').matches)return;
  if(boxesDirty)refreshCardBoxes();

  for(var i=0;i<cardBoxes.length;i++){
    var box=cardBoxes[i],el=box.el;
    var inside=(mouseX>box.left&&mouseX<box.right&&mouseY>box.top&&mouseY<box.bottom);

    if(inside){
      var rx=((mouseY-box.cy)/box.halfH)*-3;
      var ry=((mouseX-box.cx)/box.halfW)*3;
      el.style.setProperty('--rx',rx.toFixed(2)+'deg');
      el.style.setProperty('--ry',ry.toFixed(2)+'deg');
      el.style.setProperty('--sc','1.02');
      el.style.setProperty('--tx','0px');el.style.setProperty('--ty','0px');
      if(box.glow){
        box.glow.style.left=(mouseX-box.left)+'px';
        box.glow.style.top=(mouseY-box.top)+'px';
        box.glow.style.opacity='1';
      }
    }else{
      var pad=70;
      var inRange=(mouseX>box.left-pad&&mouseX<box.right+pad&&mouseY>box.top-pad&&mouseY<box.bottom+pad);
      if(inRange){
        var dx=box.cx-mouseX,dy=box.cy-mouseY;
        var dist=Math.sqrt(dx*dx+dy*dy)||1;
        var maxDist=Math.max(box.halfW,box.halfH)+pad;
        var strength=Math.max(0,1-dist/maxDist)*8;
        el.style.setProperty('--tx',(dx/dist*strength).toFixed(2)+'px');
        el.style.setProperty('--ty',(dy/dist*strength).toFixed(2)+'px');
      }else{
        el.style.setProperty('--tx','0px');el.style.setProperty('--ty','0px');
      }
      el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');
      el.style.setProperty('--sc','1');
      if(box.glow)box.glow.style.opacity='0';
    }
  }
}

function onGlobalMouseLeave(){
  mouseX=-9999;mouseY=-9999;
  for(var i=0;i<cardBoxes.length;i++){
    var el=cardBoxes[i].el;
    el.style.setProperty('--tx','0px');el.style.setProperty('--ty','0px');
    el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');
    el.style.setProperty('--sc','1');
    if(cardBoxes[i].glow)cardBoxes[i].glow.style.opacity='0';
  }
}

document.addEventListener('mousedown',function(e){

  if(boxesDirty)refreshCardBoxes();

    var box=cardBoxes[i];

function initParticles(){

      x:Math.random()*pW,y:Math.random()*pH,
      size:4+Math.random()*10,
      vx:(Math.random()-0.5)*0.42,vy:(Math.random()-0.5)*0.42,
      bx:0,by:0,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.014,
      alpha:0.12+Math.random()*0.28,alphaPhase:Math.random()*Math.PI*2,alphaSpeed:0.008+Math.random()*0.016,
      hueIdx:Math.floor(Math.random()*4),hueMix:Math.random(),
      glow:Math.random()<0.2
    });
  }
  if(particleRunning)drawParticles();
}

function resizeCanvas(){
  var canvas=$('particles');if(!canvas)return;
  pW=window.innerWidth;pH=window.innerHeight;
  canvas.width=pW*pDpr;canvas.height=pH*pDpr;
  canvas.style.width=pW+'px';canvas.style.height=pH+'px';
  if(particleCtx)particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}

function drawSquare(ctx,s,hs,r,g,b,a){
  var rad=Math.min(3,s/3.5);
  var grad=ctx.createLinearGradient(-hs,-hs,hs,hs);
  grad.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');
  grad.addColorStop(1,'rgba('+r+','+g+','+b+','+(a*0.3)+')');
  ctx.fillStyle=grad;
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-hs,-hs,s,s,rad);else ctx.rect(-hs,-hs,s,s);
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,'+(a*0.2)+')';ctx.lineWidth=0.5;ctx.stroke();
}

function drawParticles(){
  if(!particleRunning||!particleCtx)return;
  if(boxesDirty)refreshCardBoxes();
  particleCtx.clearRect(0,0,pW,pH);
  var now=Date.now();

  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var dxm=mouseX-p.x,dym=mouseY-p.y;
    var distSq=dxm*dxm+dym*dym;
    if(distSq<ATTRACT_RADIUS*ATTRACT_RADIUS&&distSq>1){
      var dist=Math.sqrt(distSq);
      var force=(1-dist/ATTRACT_RADIUS)*ATTRACT_STRENGTH;
      p.bx+=(dxm/dist)*force;p.by+=(dym/dist)*force;
    }
    p.bx*=0.93;p.by*=0.93;
    p.x+=p.vx+p.bx;p.y+=p.vy+p.by;p.rot+=p.vr;

    var phs=p.size/2;
    for(var c=0;c<cardBoxes.length;c++){
      var box=cardBoxes[c];
      if(p.x+phs<box.left||p.x-phs>box.right)continue;
      if(p.y+phs<box.top||p.y-phs>box.bottom)continue;
      var ol=(p.x+phs)-box.left,orr=box.right-(p.x-phs);
      var ot=(p.y+phs)-box.top,ob=box.bottom-(p.y-phs);
      var mh=Math.min(ol,orr),mv=Math.min(ot,ob);
      var nx=0,ny=0;
      if(mh<mv){
        if(ol<orr){nx=-1;p.x=box.left-phs;}else{nx=1;p.x=box.right+phs;}
        p.vx=-Math.abs(p.vx)*nx*0.9;p.bx=-p.bx*0.4;
      }else{
        if(ot<ob){ny=-1;p.y=box.top-phs;}else{ny=1;p.y=box.bottom+phs;}
        p.vy=-Math.abs(p.vy)*ny*0.9;p.by=-p.by*0.4;
      }
      if(box.hitCooldown<now){box.hitCooldown=now+320;hitCard(box);}
    }

    if(p.x<-60)p.x=pW+60;else if(p.x>pW+60)p.x=-60;
    if(p.y<-60)p.y=pH+60;else if(p.y>pH+60)p.y=-60;

    p.alphaPhase+=p.alphaSpeed;
    var a=p.alpha*(0.55+0.45*Math.sin(p.alphaPhase));
    a=Math.max(0.05,Math.min(0.6,a));
    var c1=(themeColors[p.hueIdx]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var c2=(themeColors[(p.hueIdx+1)%4]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var mix=p.hueMix;
    var r=Math.round(c1[0]*(1-mix)+c2[0]*mix);
    var g=Math.round(c1[1]*(1-mix)+c2[1]*mix);
    var b=Math.round(c1[2]*(1-mix)+c2[2]*mix);

    particleCtx.save();
    particleCtx.translate(p.x,p.y);particleCtx.rotate(p.rot);
    if(p.glow){particleCtx.shadowBlur=10;particleCtx.shadowColor='rgba('+r+','+g+','+b+','+(a*0.8)+')';}
    drawSquare(particleCtx,p.size,p.size/2,r,g,b,a);
    particleCtx.restore();
  }

  requestAnimationFrame(drawParticles);
}

var topbarEl=$('topbar'),rafPend=false,scrollDebounce=null;
function onScroll(){
  if(rafPend)return;rafPend=true;
  requestAnimationFrame(function(){
    var top=window.pageYOffset||document.documentElement.scrollTop||0;
    if(topbarEl)topbarEl.classList.toggle('scrolled',top>4);
    rafPend=false;
    clearTimeout(scrollDebounce);
    scrollDebounce=setTimeout(function(){boxesDirty=true;},60);
  });
}

function splitHeroTitle(){
  var h1=$('heroTitle');if(!h1)return;
  var text=h1.textContent.trim();
  h1.textContent='';
  for(var i=0;i<text.length;i++){
    var span=document.createElement('span');
    span.className='char';
    span.textContent=text[i];
    span.style.animationDelay=(0.15+i*0.055)+'s';
    h1.appendChild(span);
  }
}

var spPill=$('statusPill'),spDot=$('spDot'),spTime=$('spTime'),spLat=$('spLat');
function spSetBusy(){if(spPill)spPill.className='status-pill busy';}
function spSetOK(){if(spPill)spPill.className='status-pill';}
function spSetErr(){if(spPill)spPill.className='status-pill err';}
function spSetLat(lat){if(spLat)spLat.textContent=lat>=0?(lat+'ms'):'超时';}

var refreshTimer=null,latTimer=null,clockTimer=null;

function doPing(){
  pingLatency().then(function(lat){spSetLat(lat);}).catch(function(){spSetLat(-1);});
}
function silentRefresh(){
  if(document.hidden)return;
  loadTools().then(function(res){if(res&&res.ok)renderIfChanged();});
  loadAnnouncement().then(function(list){
    announceItems=list;
    renderAnnouncement();
  });
}

function bind(){
  themeBtn.addEventListener('click',openTheme);
  themeClose.addEventListener('click',closeTheme);
  themeOv.addEventListener('click',function(e){if(e.target===themeOv)closeTheme();});
  themeGrid.addEventListener('click',function(e){
    var card=e.target.closest('[data-theme-val]');if(!card)return;
    var id=card.getAttribute('data-theme-val');
    applyTheme(id);closeTheme();
    var name=id;
    for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===id)name=THEMES[i].name;
    toast('已切换到 '+name);
  });

  /* 搜索 */
  var searchEl=$('searchInput');
  if(searchEl){
    searchEl.addEventListener('input',function(){
      searchQuery=this.value||'';
      renderTools();
    });
    searchEl.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&this.value){
        this.value='';searchQuery='';renderTools();
      }
    });
  }

  /* 筛选 chips */
  var tagChips=$('tagChips'),dbChips=$('dbChips');
  if(tagChips){
    tagChips.addEventListener('click',function(e){
      var chip=e.target.closest('[data-filter-tag]');if(!chip)return;
      filterTag=chip.getAttribute('data-filter-tag');
      buildFilterChips();renderTools();
    });
  }
  if(dbChips){
    dbChips.addEventListener('click',function(e){
      var chip=e.target.closest('[data-filter-db]');if(!chip)return;
      filterDb=chip.getAttribute('data-filter-db');
      buildFilterChips();renderTools();
    });
  }

  var reloadBtn=$('reloadBtn');
  if(reloadBtn){
    reloadBtn.addEventListener('click',function(){
      if(reloadBtn.classList.contains('spin-anim'))return;
      reloadBtn.classList.add('spin-anim');
      toast('正在刷新…');
      loadTools().then(function(){lastSignature='';renderTools();});
      loadAnnouncement().then(function(list){
        announceItems=list;renderAnnouncement();
        setTimeout(function(){reloadBtn.classList.remove('spin-anim');},400);
      });
    });
  }

  if(spPill){
    spPill.addEventListener('click',function(){
      toast('正在刷新…');
      loadTools().then(function(res){if(res&&res.ok)renderIfChanged();doPing();});
      loadAnnouncement().then(function(list){announceItems=list;renderAnnouncement();});
    });
  }

  /* 按 / 聚焦搜索框 */
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&themeOv.classList.contains('show')){e.preventDefault();closeTheme();}
    var tag=document.activeElement&&document.activeElement.tagName;
    var typing=tag==='INPUT'||tag==='TEXTAREA';
    if(e.key==='/'&&!typing){
      e.preventDefault();
      if(searchEl){searchEl.focus();searchEl.select();}
    }
  });

  document.addEventListener('mousemove',onGlobalMouseMove,{passive:true});
  document.addEventListener('mouseleave',onGlobalMouseLeave);
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){resizeCanvas();onScroll();boxesDirty=true;},{passive:true});
  document.addEventListener('visibilitychange',function(){
    particleRunning=!document.hidden;
    if(particleRunning)drawParticles();
  });
}

function boot(){
  applyTheme(curTheme);

  var cached=loadToolsCache();
  if(cached)TOOLS=cached;
  lastSignature=toolsSignature(TOOLS);
  buildFilterChips();
  renderTools();

  buildFloatDecor();
  initParticles();
  splitHeroTitle();
  bindAnnounceEvents();
  bind();
  onScroll();

  if(spTime)spTime.textContent=fmtTime(Date.now());
  clockTimer=setInterval(function(){if(spTime)spTime.textContent=fmtTime(Date.now());},CLOCK_MS);

  doPing();
  latTimer=setInterval(doPing,LAT_PING_MS);
  refreshTimer=setInterval(silentRefresh,REFRESH_MS);

  loadTools().then(function(res){if(res&&res.ok)renderIfChanged();});
  loadAnnouncement().then(function(list){announceItems=list;renderAnnouncement();});
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
