<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石的小工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<style>
:root{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--dgr:#a02020;
  --ok:#2d7a2d;--warn:#b08800;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.13);--blob2:rgba(106,140,60,.09);--blob3:rgba(180,150,80,.07);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
  --tile-accent:linear-gradient(135deg,#7a9c3c,#3d521f);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ============ 背景装饰 ============ */
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50px,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}

.float-decor{position:absolute;inset:0}
.fd{position:absolute;pointer-events:none;opacity:.22}
.fd.ring{border:2px solid var(--ac);border-radius:50%;opacity:.14}
.fd.square{border:2px solid var(--ac);opacity:.12}
.fd.cross::before,.fd.cross::after{content:"";position:absolute;background:var(--ac);opacity:.2}
.fd.cross::before{width:22px;height:2px;top:50%;left:0;margin-top:-1px}
.fd.cross::after{width:2px;height:22px;top:0;left:50%;margin-left:-1px}
.fd.tri{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid var(--ac);opacity:.1}
.fd.plus{font-size:15px;color:var(--ac);opacity:.16;font-weight:300;line-height:1}

@keyframes floatY{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-28px) rotate(180deg)}}
@keyframes floatX{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(36px) rotate(-180deg)}}
@keyframes floatXY{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(28px,-18px) rotate(90deg)}50%{transform:translate(-18px,36px) rotate(180deg)}75%{transform:translate(36px,18px) rotate(270deg)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

#particles{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ============ 主布局 ============ */
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:80px 24px 80px}

/* Hero */
.hero{text-align:center;padding:24px 0 40px;animation:heroIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px;margin-bottom:18px;
  background:var(--bg2);
  border:2px solid var(--bd2);
  border-radius:2px;
  box-shadow:var(--bevel);
  font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--ac);
}
.hero-badge .dot{
  width:8px;height:8px;flex:none;
  background:var(--ac);
  box-shadow:0 0 0 3px var(--acs);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.hero h1{
  margin:0 0 12px;
  font-size:clamp(2rem,4.5vw,3.2rem);
  font-weight:800;
  line-height:1.12;
  letter-spacing:-.03em;
  background:var(--hero-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero-sub{
  margin:0 auto 6px;
  max-width:520px;
  font-size:15px;
  color:var(--muted);
  line-height:1.65;
}
.hero-line{
  display:inline-block;
  margin-top:12px;
  padding-top:12px;
  border-top:1px dashed var(--bd);
  font-size:12.5px;
  color:var(--muted);
  letter-spacing:.02em;
}

/* 分区标题 */
.section-title{
  display:flex;align-items:center;gap:8px;
  margin:24px 0 14px;
  font-size:13px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);
}
.section-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--ac);box-shadow:var(--bevel)}

/* 工具卡片网格 */
.tool-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.tool-card{
  position:relative;
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;
  background:linear-gradient(135deg,var(--bg2),var(--bg));
  border:2px solid var(--bd2);
  border-radius:2px;
  box-shadow:var(--bevel);
  text-decoration:none;color:inherit;
  overflow:hidden;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;
  cursor:pointer;
}
.tool-card::before{
  content:"";position:absolute;inset:0;
  background:var(--tile-accent);
  opacity:0;transition:opacity .3s;
  pointer-events:none;
}
.tool-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--bevel),0 0 0 2px rgba(142,196,74,.3),0 12px 24px rgba(0,0,0,.15);
  border-color:var(--ac);
}
.tool-card:hover::before{opacity:.08}
.tool-card:active{transform:translateY(-1px) scale(.99)}
.tool-card.disabled{cursor:not-allowed;opacity:.55}
.tool-card.disabled:hover{transform:none;box-shadow:var(--bevel)}

@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

.tc-icon{
  flex:none;width:52px;height:52px;
  display:grid;place-items:center;
  font-size:26px;
  background:var(--bg);
  border:2px solid var(--bd2);
  box-shadow:var(--bevel);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
.tool-card:hover .tc-icon{transform:scale(1.08) rotate(-6deg)}

.tc-info{flex:1;min-width:0}
.tc-name{
  font-size:16px;font-weight:800;
  line-height:1.25;letter-spacing:-.01em;
  margin-bottom:3px;
  color:#2a3a1a;
  text-shadow:1px 1px 0 rgba(255,255,255,.4);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tool-card:hover .tc-name{color:#1a2a0a}
.tc-desc{
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tc-tag{
  display:inline-block;
  margin-top:5px;
  padding:1px 8px;
  font-size:10.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
  background:var(--acs);
  border:1px solid var(--ac);
  color:var(--ac);
}
.tool-card.disabled .tc-tag{
  background:var(--bg3);
  border-color:var(--bd);
  color:var(--muted);
}

.tc-arrow{
  flex:none;
  font-size:20px;font-weight:800;
  color:var(--ac);
  opacity:0;
  transform:translateX(-8px);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.tool-card:hover .tc-arrow{opacity:1;transform:translateX(0)}
.tool-card.disabled .tc-arrow{display:none}

/* 页脚 */
.foot{
  margin-top:56px;
  padding-top:20px;
  text-align:center;
  border-top:1px dashed var(--bd);
  font-size:12px;
  color:var(--muted);
  letter-spacing:.02em;
}
.foot .heart{color:#a02020}

/* 响应式 */
@media(max-width:640px){
  .wrap{padding:56px 16px 60px}
  .hero{padding:12px 0 28px}
  .hero-sub{font-size:13.5px}
  .tool-grid{grid-template-columns:1fr;gap:10px}
  .tc-icon{width:44px;height:44px;font-size:22px}
  .tc-name{font-size:15px}
}
@media print{.bg-decor,.tc-arrow{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decor" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-bg"></div>
  <div class="float-decor" id="floatDecor"></div>
  <canvas id="particles"></canvas>
</div>

<!-- 主内容 -->
<div class="wrap">

  <div class="hero">
    <div class="hero-badge"><span class="dot"></span>TOOLBOX · 在线</div>
    <h1>红石的小工具箱</h1>
    <p class="hero-sub">各种实用小工具的集合 · 点开即可使用</p>
    <span class="hero-line">🛠️ 轻量 · 无依赖 · 即开即用</span>
  </div>

  <div class="section-title">全部工具</div>
  <div class="tool-grid" id="toolGrid"></div>

  <div class="foot">
    红石的小工具箱 · 用 <span class="heart">♥</span> 打造
  </div>

</div>

<script>
(function(){
'use strict';

/* ============================================================
   ★ 工具列表 —— 在这里增删工具
   每个工具需要：icon(emoji) / name / desc / tag / url
   disabled: true 表示"开发中"，点击无效
   ============================================================ */
var TOOLS = [
  {
    icon: '📚',
    name: '红石答辩wiki',
    desc: '轻量知识库 · 记录一切',
    tag: '知识库',
    url: './wiki.html'
  },
  {
    icon: '🏆',
    name: '备份计分板',
    desc: '记分 · 导出备份 · 一键恢复',
    tag: '工具',
    url: './scoreboard.html'
  }
];

/* ============ 渲染工具卡片 ============ */
function renderTools(){
  var grid = document.getElementById('toolGrid');
  if(!grid) return;

  var html = '';
  TOOLS.forEach(function(t, i){
    var cls = 'tool-card' + (t.disabled ? ' disabled' : '');
    var href = t.disabled ? 'javascript:void(0)' : t.url;
    var delay = Math.min(i * 50, 500);

    html += '<a class="'+cls+'" href="'+href+'" style="animation-delay:'+delay+'ms" data-idx="'+i+'">' +
      '<div class="tc-icon">' + t.icon + '</div>' +
      '<div class="tc-info">' +
        '<div class="tc-name">' + escapeHtml(t.name) + '</div>' +
        '<div class="tc-desc">' + escapeHtml(t.desc) + '</div>' +
        '<span class="tc-tag">' + escapeHtml(t.tag) + '</span>' +
      '</div>' +
      '<div class="tc-arrow">→</div>' +
    '</a>';
  });
  grid.innerHTML = html;

  // 拦截 disabled 卡片点击
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.tool-card');
    if(!card) return;
    var idx = parseInt(card.getAttribute('data-idx'), 10);
    var t = TOOLS[idx];
    if(!t) return;
    if(t.disabled){
      e.preventDefault();
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = 'shake .35s';
      setTimeout(function(){ card.style.animation = ''; }, 400);
    }
  });
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* 给卡片加抖动动画 */
var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
document.head.appendChild(styleEl);

/* ============ 浮动几何装饰 ============ */
function buildFloatDecor(){
  var wrap = document.getElementById('floatDecor');
  if(!wrap) return;
  wrap.innerHTML = '';
  var defs = [
    {cls:'ring', size:44, style:'top:14%;left:8%;animation:floatY 24s ease-in-out infinite'},
    {cls:'ring', size:28, style:'top:74%;left:86%;animation:floatX 28s ease-in-out infinite'},
    {cls:'square', size:24, style:'top:24%;left:76%;animation:spinSlow 40s linear infinite,floatY 26s ease-in-out infinite'},
    {cls:'square', size:30, style:'top:80%;left:20%;animation:floatXY 32s ease-in-out infinite'},
    {cls:'cross', size:22, style:'top:20%;left:44%;animation:floatY 22s ease-in-out infinite'},
    {cls:'cross', size:22, style:'top:86%;left:64%;animation:floatX 26s ease-in-out infinite'},
    {cls:'tri', size:22, style:'top:38%;left:26%;animation:floatXY 30s ease-in-out infinite'},
    {cls:'plus', size:16, style:'top:60%;left:52%;animation:spinSlow 24s linear infinite'}
  ];
  var html = '';
  defs.forEach(function(d){
    var s = '';
    if(d.cls === 'ring' || d.cls === 'square') s = 'width:'+d.size+'px;height:'+d.size+'px;';
    else if(d.cls === 'cross') s = 'width:'+d.size+'px;height:'+d.size+'px;position:absolute;';
    html += '<div class="fd '+d.cls+'" style="'+s+d.style+'">'+(d.cls==='plus'?'+':'')+'</div>';
  });
  wrap.innerHTML = html;
}

/* ============ 粒子系统 — 渐变小方块 ============ */
var particleCtx = null, particles = [], particleRunning = true, pW = 0, pH = 0, pDpr = 1;
var themeColors = ['61,82,31','106,140,60','140,180,60','180,150,80'];

function readThemeColors(){
  var cs = getComputedStyle(document.documentElement);
  themeColors = [
    (cs.getPropertyValue('--p1') || '61,82,31').trim(),
    (cs.getPropertyValue('--p2') || '106,140,60').trim(),
    (cs.getPropertyValue('--p3') || '140,180,60').trim(),
    (cs.getPropertyValue('--p4') || '180,150,80').trim()
  ];
}

function initParticles(){
  var canvas = document.getElementById('particles');
  if(!canvas || !canvas.getContext) return;
  particleCtx = canvas.getContext('2d');
  pDpr = Math.min(window.devicePixelRatio || 1, 2);
  resizeCanvas();
  readThemeColors();
  var count = Math.max(14, Math.min(32, Math.floor((pW * pH) / 42000)));
  particles = [];
  for(var i = 0; i < count; i++){
    particles.push({
      x: Math.random() * pW,
      y: Math.random() * pH,
      size: 4 + Math.random() * 10,
      vx: (Math.random() - 0.5) * 0.42,
      vy: (Math.random() - 0.5) * 0.42,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.014,
      alpha: 0.12 + Math.random() * 0.28,
      alphaPhase: Math.random() * Math.PI * 2,
      alphaSpeed: 0.008 + Math.random() * 0.016,
      hueIdx: Math.floor(Math.random() * 4),
      hueMix: Math.random(),
      glow: Math.random() < 0.2
    });
  }
  if(particleRunning) drawParticles();
}

function resizeCanvas(){
  var canvas = document.getElementById('particles');
  if(!canvas) return;
  pW = window.innerWidth; pH = window.innerHeight;
  canvas.width = pW * pDpr; canvas.height = pH * pDpr;
  canvas.style.width = pW + 'px'; canvas.style.height = pH + 'px';
  if(particleCtx) particleCtx.setTransform(pDpr, 0, 0, pDpr, 0, 0);
}

function drawParticles(){
  if(!particleRunning || !particleCtx) return;
  particleCtx.clearRect(0, 0, pW, pH);
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.x < -40) p.x = pW + 40; else if(p.x > pW + 40) p.x = -40;
    if(p.y < -40) p.y = pH + 40; else if(p.y > pH + 40) p.y = -40;

    p.alphaPhase += p.alphaSpeed;
    var a = p.alpha * (0.55 + 0.45 * Math.sin(p.alphaPhase));
    a = Math.max(0.04, Math.min(0.55, a));

    var c1 = (themeColors[p.hueIdx] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var c2 = (themeColors[(p.hueIdx + 1) % 4] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var mix = p.hueMix;
    var r = Math.round(c1[0] * (1 - mix) + c2[0] * mix);
    var g = Math.round(c1[1] * (1 - mix) + c2[1] * mix);
    var b = Math.round(c1[2] * (1 - mix) + c2[2] * mix);

    particleCtx.save();
    particleCtx.translate(p.x, p.y);
    particleCtx.rotate(p.rot);

    if(p.glow){
      particleCtx.shadowBlur = 10;
      particleCtx.shadowColor = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.8) + ')';
    }

    var s = p.size, hs = s / 2, rad = Math.min(3, s / 3.5);
    var grad = particleCtx.createLinearGradient(-hs, -hs, hs, hs);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.3) + ')');
    particleCtx.fillStyle = grad;

    particleCtx.beginPath();
    if(particleCtx.roundRect) particleCtx.roundRect(-hs, -hs, s, s, rad);
    else particleCtx.rect(-hs, -hs, s, s);
    particleCtx.fill();

    particleCtx.strokeStyle = 'rgba(255,255,255,' + (a * 0.2) + ')';
    particleCtx.lineWidth = 0.5;
    particleCtx.stroke();

    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

/* ============ 启动 ============ */
function boot(){
  renderTools();
  buildFloatDecor();
  initParticles();

  window.addEventListener('resize', function(){
    resizeCanvas();
  }, { passive: true });

  document.addEventListener('visibilitychange', function(){
    particleRunning = !document.hidden;
    if(particleRunning) drawParticles();
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
