<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<script>
(function(){
  try{
    var t=localStorage.getItem('wiki-theme');
    var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
    if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<style>
:root,[data-theme="mc-wiki"]{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.13);--blob2:rgba(106,140,60,.09);--blob3:rgba(180,150,80,.07);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
  --tile-accent:linear-gradient(135deg,#7a9c3c,#3d521f);
  --topbar-bg:linear-gradient(180deg,#56682c,#3d521f);
  --topbar-fg:#fff;--topbar-bd:#2a3a1a;
}
[data-theme="mc-night"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#303030;--text:#e0e0e0;--muted:#909090;
  --bd:#505050;--bd2:#6a6a6a;--ac:#8ec44a;--acs:#2a3a1a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(142,196,74,.10);--blob2:rgba(90,140,60,.07);--blob3:rgba(120,90,40,.07);
  --grid:rgba(255,255,255,.025);
  --p1:142,196,74;--p2:90,140,60;--p3:200,180,100;--p4:120,90,40;
  --hero-grad:linear-gradient(135deg,#8ec44a,#3d521f);
  --tile-accent:linear-gradient(135deg,#8ec44a,#3d521f);
  --topbar-bg:linear-gradient(180deg,#2a3a1a,#1a2a0a);
  --topbar-fg:#e8ffd0;--topbar-bd:#0a1a00;
}
[data-theme="mc-nether"]{
  --bg:#1a0a0a;--bg2:#2a1212;--bg3:#3a1a1a;--text:#f0d0d0;--muted:#a08080;
  --bd:#6a3030;--bd2:#8a4040;--ac:#ff6030;--acs:#3a1a10;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#f85050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(255,96,48,.12);--blob2:rgba(200,60,30,.09);--blob3:rgba(255,150,80,.07);
  --grid:rgba(255,150,100,.03);
  --p1:255,96,48;--p2:200,60,30;--p3:255,150,80;--p4:120,40,20;
  --hero-grad:linear-gradient(135deg,#ff6030,#8a2010);
  --tile-accent:linear-gradient(135deg,#ff6030,#8a2010);
  --topbar-bg:linear-gradient(180deg,#3a1212,#1a0a0a);
  --topbar-fg:#ffe0d0;--topbar-bd:#0a0500;
}
[data-theme="mc-end"]{
  --bg:#0f0a1a;--bg2:#1a1230;--bg3:#251a40;--text:#e0d0f0;--muted:#9080a0;
  --bd:#4a3a6a;--bd2:#6a5a8a;--ac:#a060ff;--acs:#2a1a3a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.5),inset -1px -1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(160,96,255,.12);--blob2:rgba(120,60,200,.08);--blob3:rgba(200,150,255,.06);
  --grid:rgba(200,150,255,.025);
  --p1:160,96,255;--p2:120,60,200;--p3:200,150,255;--p4:80,40,120;
  --hero-grad:linear-gradient(135deg,#a060ff,#4a2080);
  --tile-accent:linear-gradient(135deg,#a060ff,#4a2080);
  --topbar-bg:linear-gradient(180deg,#2a1a3a,#0f0a1a);
  --topbar-fg:#e0d0ff;--topbar-bd:#0a0510;
}
[data-theme="sakura"]{
  --bg:#fffafc;--bg2:#fff0f5;--bg3:#ffe0ea;--text:#2a1a20;--muted:#806070;
  --bd:#e0b0c0;--bd2:#a06080;--ac:#d04080;--acs:#ffe0ea;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(160,80,120,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(160,80,120,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --bevel-in:inset 1px 1px 0 rgba(160,80,120,.1),inset -1px -1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(208,64,128,.12);--blob2:rgba(240,120,160,.08);--blob3:rgba(255,180,200,.06);
  --grid:rgba(208,64,128,.04);
  --p1:208,64,128;--p2:240,120,160;--p3:255,180,200;--p4:160,80,120;
  --hero-grad:linear-gradient(135deg,#d04080,#ff80a0);
  --tile-accent:linear-gradient(135deg,#ff80a0,#d04080);
  --topbar-bg:linear-gradient(180deg,#d06090,#a04070);
  --topbar-fg:#fff;--topbar-bd:#802050;
}
[data-theme="ocean"]{
  --bg:#f0f8ff;--bg2:#e0f0fa;--bg3:#c8e0f0;--text:#0a1a2a;--muted:#406080;
  --bd:#a0c0d8;--bd2:#406080;--ac:#0066cc;--acs:#c8e4ff;
  --ok:#1a7f37;--warn:#b08800;--dgr:#cf222e;
  --sh:2px 2px 0 rgba(32,80,140,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(32,80,140,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --bevel-in:inset 1px 1px 0 rgba(32,80,140,.1),inset -1px -1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(0,102,204,.10);--blob2:rgba(64,160,220,.08);--blob3:rgba(120,200,240,.06);
  --grid:rgba(0,102,204,.04);
  --p1:0,102,204;--p2:64,160,220;--p3:120,200,240;--p4:32,80,140;
  --hero-grad:linear-gradient(135deg,#0066cc,#40a0dc);
  --tile-accent:linear-gradient(135deg,#40a0dc,#0066cc);
  --topbar-bg:linear-gradient(180deg,#2080c0,#004890);
  --topbar-fg:#fff;--topbar-bd:#002040;
}
[data-theme="github-light"]{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eef1f4;--text:#1f2328;--muted:#59636e;
  --bd:#d1d9e0;--bd2:#a0a8b0;--ac:#0969da;--acs:#ddf4ff;
  --ok:#1a7f37;--warn:#d4a72c;--dgr:#cf222e;
  --sh:0 1px 4px rgba(31,35,40,.08);--r:6px;
  --bevel:none;--bevel-in:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(9,105,218,.08);--blob2:rgba(163,113,247,.06);--blob3:rgba(219,112,147,.05);
  --grid:rgba(31,35,40,.02);
  --p1:9,105,218;--p2:163,113,247;--p3:219,112,147;--p4:31,35,40;
  --hero-grad:linear-gradient(135deg,#0969da,#a371f7);
  --tile-accent:linear-gradient(135deg,#0969da,#a371f7);
  --topbar-bg:#ffffff;--topbar-fg:#1f2328;--topbar-bd:#d1d9e0;
}
[data-theme="github-dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#e6edf3;--muted:#9198a1;
  --bd:#30363d;--bd2:#484f58;--ac:#4493f8;--acs:#16233a;
  --ok:#3fb950;--warn:#d4a72c;--dgr:#f85149;
  --sh:0 1px 4px rgba(0,0,0,.4);--r:6px;
  --bevel:none;--bevel-in:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(68,147,248,.06);--blob2:rgba(163,113,247,.05);--blob3:rgba(219,112,147,.04);
  --grid:rgba(230,237,243,.02);
  --p1:68,147,248;--p2:163,113,247;--p3:219,112,147;--p4:230,237,243;
  --hero-grad:linear-gradient(135deg,#4493f8,#a371f7);
  --tile-accent:linear-gradient(135deg,#4493f8,#a371f7);
  --topbar-bg:#161b22;--topbar-fg:#e6edf3;--topbar-bd:#30363d;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;transition:background-color .3s}
body{margin:0;padding-top:46px;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .3s,color .3s}

.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid var(--topbar-bd);z-index:50;transition:background .3s,border-color .3s,box-shadow .25s}
[data-theme^="mc-"] .topbar{border-bottom-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.topbar.scrolled{box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--topbar-fg);text-decoration:none;white-space:nowrap;cursor:pointer}
[data-theme^="mc-"] .logo{text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.logo-icon{display:inline-block;font-size:16px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.sp{flex:1}
.icon{display:grid;place-items:center;width:30px;height:30px;flex:none;font-size:14px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s,transform .2s}
.icon:hover{background:var(--bg3);color:var(--text)}
[data-theme^="mc-"] .icon{color:rgba(255,255,255,.85)}
[data-theme^="mc-"] .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}
.icon.spin-anim{animation:spinIcon .7s linear infinite}
@keyframes spinIcon{to{transform:rotate(360deg)}}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50px,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
.float-decor{position:absolute;inset:0}
.fd{position:absolute;pointer-events:none;opacity:.22}
.fd.ring{border:2px solid var(--ac);border-radius:50%;opacity:.14}
.fd.square{border:2px solid var(--ac);opacity:.12}
.fd.cross::before,.fd.cross::after{content:"";position:absolute;background:var(--ac);opacity:.2}
.fd.cross::before{width:22px;height:2px;top:50%;left:0;margin-top:-1px}
.fd.cross::after{width:2px;height:22px;top:0;left:50%;margin-left:-1px}
.fd.tri{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:18px solid var(--ac);opacity:.1}
.fd.plus{font-size:15px;color:var(--ac);opacity:.16;font-weight:300;line-height:1}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-28px) rotate(180deg)}}
@keyframes floatX{0%,100%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(36px) rotate(-180deg)}}
@keyframes floatXY{0%,100%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(28px,-18px) rotate(90deg)}50%{transform:translate(-18px,36px) rotate(180deg)}75%{transform:translate(36px,18px) rotate(270deg)}}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:80px 24px 80px}
.hero{text-align:center;padding:24px 0 44px;animation:heroIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;margin-bottom:18px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.hero-badge .dot{width:8px;height:8px;flex:none;background:var(--ac);box-shadow:0 0 0 3px var(--acs);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{margin:0 0 12px;font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;line-height:1.12;letter-spacing:-.03em;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{margin:0 auto 6px;max-width:520px;font-size:15px;color:var(--muted);line-height:1.65}
.hero-line{display:inline-block;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.columns{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.column{min-width:0}
.section-title{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--ac);box-shadow:var(--bevel)}
.section-title.deprecated::before{background:var(--muted);opacity:.5}
.section-title .count{font-size:11px;padding:1px 8px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;letter-spacing:0;text-transform:none;font-weight:600}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tool-grid.deprecated{grid-template-columns:1fr;gap:12px}
.tool-card{position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(135deg,var(--bg2),var(--bg));border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);text-decoration:none;color:inherit;overflow:hidden;transition:all .3s cubic-bezier(.34,1.56,.64,1);animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;cursor:pointer}
.tool-card::before{content:"";position:absolute;inset:0;background:var(--tile-accent);opacity:0;transition:opacity .3s;pointer-events:none}
.tool-card:hover{transform:translateY(-4px);box-shadow:var(--bevel),0 0 0 2px rgba(var(--p1),.3),0 12px 24px rgba(0,0,0,.15);border-color:var(--ac)}
.tool-card:hover::before{opacity:.08}
.tool-card:active{transform:translateY(-1px) scale(.99)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.tc-icon{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:26px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tool-card:hover .tc-icon{transform:scale(1.08) rotate(-6deg)}
.tc-info{flex:1;min-width:0}
.tc-name{font-size:16px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin-bottom:3px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
[data-theme^="mc-"] .tc-name{color:#2a3a1a;text-shadow:1px 1px 0 rgba(255,255,255,.4)}
[data-theme="mc-night"] .tc-name{color:#e8ffd0;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
[data-theme="mc-nether"] .tc-name{color:#ffd0c0;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
[data-theme="mc-end"] .tc-name{color:#e0d0ff;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
[data-theme="sakura"] .tc-name{color:#8a2050;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
[data-theme="ocean"] .tc-name{color:#0a3060;text-shadow:1px 1px 0 rgba(255,255,255,.5)}
.tool-card:hover .tc-name{color:var(--ac)}
.tc-desc{font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-tag{display:inline-block;margin-top:5px;padding:1px 8px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--acs);border:1px solid var(--ac);color:var(--ac)}
[data-theme^="github-"] .tc-tag{border-radius:999px}
.tc-arrow{flex:none;font-size:20px;font-weight:800;color:var(--ac);opacity:0;transform:translateX(-8px);transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.tool-card:hover .tc-arrow{opacity:1;transform:translateX(0)}
.tool-card.deprecated{border-color:var(--bd);border-style:dashed;opacity:.7;filter:grayscale(.35)}
.tool-card.deprecated:hover{opacity:1;filter:none;border-style:solid}
.tool-card.deprecated .tc-name{color:var(--muted)}
.tool-card.deprecated:hover .tc-name{color:var(--ac)}
.tool-card.deprecated .tc-tag{background:transparent;border-color:var(--bd);color:var(--muted)}
.empty-col{padding:60px 24px;text-align:center;background:var(--bg2);border:2px dashed var(--bd);border-radius:var(--r);color:var(--muted)}
.empty-col .ic{font-size:48px;opacity:.35;margin-bottom:12px;display:block;line-height:1}
.empty-col .title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-col .sub{font-size:12.5px;color:var(--muted);line-height:1.7}
.foot{margin-top:64px;padding-top:20px;text-align:center;border-top:1px dashed var(--bd);font-size:12px;color:var(--muted);letter-spacing:.02em}
.foot a{color:var(--ac);text-decoration:none;font-weight:600;border-bottom:1px dashed var(--ac);transition:all .2s}
.foot a:hover{border-bottom-style:solid;opacity:.8}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:560px;max-height:calc(100vh - 32px);background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) + 3px);box-shadow:var(--sh);overflow:hidden;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .pnl{border:2px solid var(--bd2);border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.ov.show .pnl{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);flex:none;color:#fff}
[data-theme="mc-wiki"] .ph{background:linear-gradient(180deg,#7a9c3c,#56682c);border-bottom:2px solid #3d521f;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
[data-theme="mc-night"] .ph{background:linear-gradient(180deg,#5a7a2c,#3d521f);color:#e8ffd0;border-bottom-color:#2a3a1a}
[data-theme="mc-nether"] .ph{background:linear-gradient(180deg,#8a2010,#4a1008);color:#ffe0d0;border-bottom-color:#2a0800}
[data-theme="mc-end"] .ph{background:linear-gradient(180deg,#4a2080,#2a1050);color:#e0d0ff;border-bottom-color:#150520}
[data-theme="sakura"] .ph{background:linear-gradient(180deg,#e07090,#c05070);color:#fff;border-bottom-color:#a04060}
[data-theme="ocean"] .ph{background:linear-gradient(180deg,#2080c0,#004890);color:#fff;border-bottom-color:#002040}
.ph strong{font-size:14px}
.ph .sp{flex:1}
.ph .icon{color:inherit}
.ph .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.theme-body{padding:14px;overflow-y:auto}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--bevel);transition:all .2s;text-align:left}
.theme-card:hover{transform:translateY(-2px);border-color:var(--ac)}
.theme-card.active{border-color:var(--ac);box-shadow:var(--bevel),0 0 0 2px var(--acs)}
[data-theme^="github-"] .theme-card{border-width:1px;box-shadow:none}
[data-theme^="github-"] .theme-card.active{box-shadow:0 0 0 2px var(--acs)}
.theme-prev{display:flex;height:30px;border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);overflow:hidden}
.theme-prev span{flex:1;display:block}
.theme-name{font-size:12.5px;font-weight:700}
.theme-desc{font-size:10.5px;color:var(--muted);margin-top:-3px}
.toast{position:fixed;left:50%;bottom:20px;max-width:calc(100vw - 32px);padding:8px 16px;font-size:13px;color:var(--bg);background:var(--text);border-radius:var(--r);box-shadow:var(--sh);opacity:0;transform:translateX(-50%) translateY(16px);transition:opacity .22s,transform .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:200}
[data-theme^="mc-"] .toast{background:#2a3a1a;color:#e8ffd0;border:2px solid #4a4a3a;border-radius:2px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
[data-theme="mc-nether"] .toast{background:#2a0800;color:#ffe0d0;border-color:#5a2010}
[data-theme="mc-end"] .toast{background:#1a0f30;color:#e0d0ff;border-color:#3a2060}
[data-theme="sakura"] .toast{background:#a04060;color:#ffe0ea;border-color:#802050}
[data-theme="ocean"] .toast{background:#004890;color:#e0f0ff;border-color:#002040}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme^="github-"] .hero-badge{border-width:1px}
[data-theme^="github-"] .section-title .count{border-radius:999px}
[data-theme^="github-"] .tool-card{border-width:1px;border-radius:10px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.06)}
[data-theme^="github-"] .tool-card:hover{transform:translateY(-2px);box-shadow:0 0 0 2px rgba(var(--p1),.25),0 8px 20px rgba(0,0,0,.1)}
[data-theme^="github-"] .tc-icon{border-width:1px;border-radius:10px}
[data-theme^="github-"] .empty-col{border-radius:10px}
[data-theme^="github-"] .section-title::before{border-radius:2px}
@media(max-width:900px){
  .columns{grid-template-columns:1fr;gap:32px}
  .tool-grid.deprecated{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}
@media(max-width:640px){
  .wrap{padding:56px 16px 60px}
  .hero{padding:12px 0 28px}
  .hero-sub{font-size:13.5px}
  .tool-grid{grid-template-columns:1fr;gap:10px}
  .tc-icon{width:44px;height:44px;font-size:22px}
  .tc-name{font-size:15px}
  .logo span:last-child{display:none}
  .theme-grid{grid-template-columns:1fr}
}
@media print{.bg-decor,.tc-arrow,.topbar,.ov,.toast{display:none}body{padding-top:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <a class="logo" href="./index.html"><span class="logo-icon">🧰</span><span>红石的小站</span></a>
  <span class="sp"></span>
  <button class="icon" id="reloadBtn" title="刷新工具列表">🔄</button>
  <button class="icon" id="themeBtn" title="切换风格">🎨</button>
</header>

<div class="bg-decor" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-bg"></div>
  <div class="float-decor" id="floatDecor"></div>
  <canvas id="particles"></canvas>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-badge"><span class="dot"></span>STATION · 在线</div>
    <h1>红石的小站</h1>
    <p class="hero-sub">各种实用小工具的集合 · 点开即可使用</p>
    <span class="hero-line">🛠️ 轻量 · 无依赖 · 即开即用</span>
  </div>

  <div class="columns">
    <div class="column">
      <div class="section-title">
        可用工具
        <span class="count" id="activeCount">0</span>
      </div>
      <div class="tool-grid" id="activeGrid"></div>
    </div>
    <div class="column">
      <div class="section-title deprecated">
        已废弃
        <span class="count" id="deprecatedCount">0</span>
      </div>
      <div class="tool-grid deprecated" id="deprecatedGrid"></div>
    </div>
  </div>

  <div class="foot">
    红石的小站 · 使用AI制作 ·
    <a href="https://github.com/HSDL03/HSwiki" target="_blank" rel="noopener">此AI项目在 GitHub</a>
  </div>
</div>

<div class="ov" id="themeOv">
  <div class="pnl">
    <div class="ph"><strong>选择风格</strong><span class="sp"></span><button class="icon" id="themeClose">✕</button></div>
    <div class="theme-body">
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   配置
   ============================================================ */
var GH_OWNER  = 'HSDL03';
var GH_REPO   = 'HSwiki';
var GH_BRANCH = 'main';
var DATA_FILE = 'tools-data.json';

var RAW_BASE = 'https://raw.githubusercontent.com/' + GH_OWNER + '/' + GH_REPO + '/' + GH_BRANCH + '/';
var CDN_BASE = 'https://cdn.jsdelivr.net/gh/' + GH_OWNER + '/' + GH_REPO + '@' + GH_BRANCH + '/';

var K_TOOLS_CACHE = 'tools-cache-v1';
var REFRESH_MS = 120 * 1000;   /* 120 秒自动刷新 */

/* ============================================================
   默认工具（网络全挂时的兜底）
   ============================================================ */
var DEFAULT_TOOLS = [
  {id:'wiki',icon:'📚',name:'红石答辩wiki',desc:'轻量知识库 · 已停止维护',tag:'已废弃',url:'./wiki.html',deprecated:true,hidden:false},
  {id:'download',icon:'📥',name:'下载站',desc:'资源文件 · 便捷下载',tag:'资源',url:'./download.html',deprecated:false,hidden:false},
  {id:'misc',icon:'🧩',name:'杂类',desc:'零散工具 · 各种小玩意儿',tag:'综合',url:'./misc.html',deprecated:false,hidden:false}
];
var TOOLS = DEFAULT_TOOLS.slice();

/* ============================================================
   工具函数
   ============================================================ */
function $(id){return document.getElementById(id);}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var storage={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
};

/* ============================================================
   主题
   ============================================================ */
var K_THEME='wiki-theme';
var THEMES=[
  {id:'mc-wiki',      name:'🟩 MC Wiki',    desc:'我的世界中文 Wiki', colors:['#3d521f','#fffdf5','#56682c'], shape:'square'},
  {id:'mc-night',     name:'⬛ MC 夜晚',    desc:'Minecraft 夜间模式', colors:['#8ec44a','#1a1a1a','#3d521f'], shape:'square'},
  {id:'mc-nether',    name:'🔥 MC 下界',    desc:'地狱岩浆风',         colors:['#ff6030','#1a0a0a','#8a2010'], shape:'lava'},
  {id:'mc-end',       name:'🌌 MC 末地',    desc:'末地虚空紫',         colors:['#a060ff','#0f0a1a','#4a2080'], shape:'spark'},
  {id:'sakura',       name:'🌸 樱花',       desc:'粉嫩柔和',           colors:['#d04080','#fffafc','#ff80a0'], shape:'petal'},
  {id:'ocean',        name:'🌊 海洋',       desc:'清凉海蓝',           colors:['#0066cc','#f0f8ff','#40a0dc'], shape:'bubble'},
  {id:'github-light', name:'☀️ GitHub 浅色', desc:'清爽默认',           colors:['#0969da','#f6f8fa','#1f2328'], shape:'square'},
  {id:'github-dark',  name:'🌙 GitHub 暗色', desc:'护眼夜间',           colors:['#4493f8','#161b22','#e6edf3'], shape:'square'}
];
var curTheme=(function(){
  var s=storage.get(K_THEME);
  for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===s)return s;
  return 'mc-wiki';
})();
function getCurrentShape(){
  for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===curTheme)return THEMES[i].shape||'square';
  return 'square';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  storage.set(K_THEME,t);
  curTheme=t;
  buildThemeGrid();
  readThemeColors();
  currentShape=getCurrentShape();
  initParticles();
}
function buildThemeGrid(){
  var grid=$('themeGrid');if(!grid)return;
  var html='';
  THEMES.forEach(function(th){
    html+='<button type="button" class="theme-card'+(th.id===curTheme?' active':'')+'" data-theme-val="'+escapeHtml(th.id)+'">'+
      '<div class="theme-prev">'+
        '<span style="background:'+th.colors[0]+'"></span>'+
        '<span style="background:'+th.colors[1]+'"></span>'+
        '<span style="background:'+th.colors[2]+'"></span>'+
      '</div>'+
      '<div class="theme-name">'+escapeHtml(th.name)+'</div>'+
      '<div class="theme-desc">'+escapeHtml(th.desc)+'</div>'+
    '</button>';
  });
  grid.innerHTML=html;
}
var themeOv=$('themeOv'),themeGrid=$('themeGrid'),themeBtn=$('themeBtn'),themeClose=$('themeClose');
function openTheme(){buildThemeGrid();themeOv.classList.add('show');}
function closeTheme(){themeOv.classList.remove('show');}

/* ============================================================
   Toast
   ============================================================ */
var toastEl=$('toast'),toastTimer=null;
function toast(msg){
  if(!toastEl)return;
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2000);
}

/* ============================================================
   数据规范化
   ============================================================ */
function normTool(t, i){
  if(!t || typeof t!=='object') return null;
  var name=(typeof t.name==='string'&&t.name.trim())?t.name.trim():('未命名 '+(i+1));
  return {
    id: (typeof t.id==='string'&&t.id.trim())?t.id.trim():('tool-'+(i+1)),
    icon: (typeof t.icon==='string'&&t.icon.trim())?t.icon.trim():'🧰',
    name: name,
    desc: typeof t.desc==='string'?t.desc:'',
    tag: (typeof t.tag==='string'&&t.tag.trim())?t.tag.trim():'工具',
    url: typeof t.url==='string'?t.url:'',
    deprecated: !!t.deprecated,
    disabled: !!t.disabled,
    hidden: !!t.hidden
  };
}
function normList(arr){
  if(!Array.isArray(arr)) return [];
  var list=[];
  arr.forEach(function(t,i){
    var n=normTool(t,i);
    if(n) list.push(n);
  });
  return list;
}

/* ============================================================
   localStorage 缓存兜底
   ============================================================ */
function loadToolsCache(){
  try{
    var raw = storage.get(K_TOOLS_CACHE);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !Array.isArray(o.data) || o.data.length === 0) return null;
    var list = normList(o.data);
    return list.length > 0 ? list : null;
  }catch(e){
    return null;
  }
}
function saveToolsCache(list){
  try{
    storage.set(K_TOOLS_CACHE, JSON.stringify({ t: Date.now(), data: list }));
  }catch(e){}
}

/* ============================================================
   远程加载（raw 优先，CDN 兜底）
   ============================================================ */
function fetchJson(url){
  return fetch(url, { cache: 'no-store' })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
}
function loadTools(){
  var url1 = RAW_BASE + DATA_FILE + '?t=' + Date.now();
  var url2 = CDN_BASE + DATA_FILE + '?t=' + Date.now();

  return fetchJson(url1)
    .catch(function(){
      return fetchJson(url2);
    })
    .then(function(data){
      if(Array.isArray(data) && data.length > 0){
        var list = normList(data);
        if(list.length > 0){
          TOOLS = list;
          saveToolsCache(list);
          return true;
        }
      }
      return false;
    })
    .catch(function(err){
      console.warn('[index] 远程加载失败，保持现状', err);
      return false;
    });
}

/* ============================================================
   渲染
   ============================================================ */
function renderCard(t, delay){
  var cls = 'tool-card' + (t.deprecated ? ' deprecated' : '');
  var href = t.disabled ? 'javascript:void(0)' : t.url;
  return '<a class="' + cls + '" href="' + escapeHtml(href) + '"'
    + ' style="animation-delay:' + delay + 'ms"'
    + (t.disabled ? ' data-disabled="1"' : '') + '>'
    + '<div class="tc-icon">' + escapeHtml(t.icon) + '</div>'
    + '<div class="tc-info">'
    +   '<div class="tc-name">' + escapeHtml(t.name) + '</div>'
    +   '<div class="tc-desc">' + escapeHtml(t.desc) + '</div>'
    +   '<span class="tc-tag">' + escapeHtml(t.tag || '工具') + '</span>'
    + '</div>'
    + '<div class="tc-arrow">→</div>'
    + '</a>';
}

function renderTools(){
  var activeGrid = $('activeGrid');
  var deprecatedGrid = $('deprecatedGrid');
  var activeCount = $('activeCount');
  var deprecatedCount = $('deprecatedCount');

  var visible = TOOLS.filter(function(t){ return !t.hidden; });
  var active = visible.filter(function(t){ return !t.deprecated; });
  var deprecated = visible.filter(function(t){ return t.deprecated; });

  if (active.length === 0) {
    activeGrid.innerHTML =
      '<div class="empty-col">' +
        '<span class="ic">🧰</span>' +
        '<div class="title">还没有可用工具</div>' +
        '<div class="sub">后续会陆续添加</div>' +
      '</div>';
  } else {
    var activeHtml = '';
    active.forEach(function(t, i){
      activeHtml += renderCard(t, Math.min(i * 50, 500));
    });
    activeGrid.innerHTML = activeHtml;
  }
  activeCount.textContent = active.length;

  if (deprecated.length === 0) {
    deprecatedGrid.innerHTML =
      '<div class="empty-col">' +
        '<span class="ic">🗂</span>' +
        '<div class="title">暂无已废弃条目</div>' +
      '</div>';
  } else {
    var depHtml = '';
    deprecated.forEach(function(t, i){
      depHtml += renderCard(t, Math.min(i * 50, 500));
    });
    deprecatedGrid.innerHTML = depHtml;
  }
  deprecatedCount.textContent = deprecated.length;

  var disableds = document.querySelectorAll('.tool-card[data-disabled="1"]');
  for(var i=0;i<disableds.length;i++){
    (function(el){
      el.addEventListener('click', function(e){
        e.preventDefault();
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = 'shake .35s';
        setTimeout(function(){ el.style.animation = ''; }, 400);
      });
    })(disableds[i]);
  }
}

/* 判断列表是否变化（避免无意义重渲染闪屏） */
function toolsSignature(list){
  return list.map(function(t){
    return [t.id, t.icon, t.name, t.desc, t.tag, t.url, t.deprecated, t.disabled, t.hidden].join('|');
  }).join('||');
}
var lastSignature = '';

function renderIfChanged(){
  var sig = toolsSignature(TOOLS);
  if(sig === lastSignature) return false;
  lastSignature = sig;
  renderTools();
  return true;
}

var styleEl = document.createElement('style');
styleEl.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}';
document.head.appendChild(styleEl);

/* ============================================================
   浮动装饰
   ============================================================ */
function buildFloatDecor(){
  var wrap = $('floatDecor');
  if(!wrap) return;
  wrap.innerHTML = '';
  var defs = [
    {cls:'ring', size:44, style:'top:14%;left:8%;animation:floatY 24s ease-in-out infinite'},
    {cls:'ring', size:28, style:'top:74%;left:86%;animation:floatX 28s ease-in-out infinite'},
    {cls:'square', size:24, style:'top:24%;left:76%;animation:spinSlow 40s linear infinite,floatY 26s ease-in-out infinite'},
    {cls:'square', size:30, style:'top:80%;left:20%;animation:floatXY 32s ease-in-out infinite'},
    {cls:'cross', size:22, style:'top:20%;left:44%;animation:floatY 22s ease-in-out infinite'},
    {cls:'cross', size:22, style:'top:86%;left:64%;animation:floatX 26s ease-in-out infinite'},
    {cls:'tri', size:22, style:'top:38%;left:26%;animation:floatXY 30s ease-in-out infinite'},
    {cls:'plus', size:16, style:'top:60%;left:52%;animation:spinSlow 24s linear infinite'}
  ];
  var html = '';
  defs.forEach(function(d){
    var s = '';
    if(d.cls === 'ring' || d.cls === 'square') s = 'width:'+d.size+'px;height:'+d.size+'px;';
    else if(d.cls === 'cross') s = 'width:'+d.size+'px;height:'+d.size+'px;position:absolute;';
    html += '<div class="fd '+d.cls+'" style="'+s+d.style+'">'+(d.cls==='plus'?'+':'')+'</div>';
  });
  wrap.innerHTML = html;
}

/* ============================================================
   粒子系统
   ============================================================ */
var particleCtx = null, particles = [], particleRunning = true, pW = 0, pH = 0, pDpr = 1;
var themeColors = ['61,82,31','106,140,60','140,180,60','180,150,80'];
var currentShape = 'square';

function readThemeColors(){
  var cs = getComputedStyle(document.documentElement);
  themeColors = [
    (cs.getPropertyValue('--p1') || '61,82,31').trim(),
    (cs.getPropertyValue('--p2') || '106,140,60').trim(),
    (cs.getPropertyValue('--p3') || '140,180,60').trim(),
    (cs.getPropertyValue('--p4') || '180,150,80').trim()
  ];
}

function initParticles(){
  var canvas = $('particles');
  if(!canvas || !canvas.getContext) return;
  particleCtx = canvas.getContext('2d');
  pDpr = Math.min(window.devicePixelRatio || 1, 2);
  resizeCanvas();
  readThemeColors();
  currentShape = getCurrentShape();

  var count = Math.max(14, Math.min(32, Math.floor((pW * pH) / 42000)));
  particles = [];
  for(var i = 0; i < count; i++){
    particles.push({
      x: Math.random() * pW,
      y: Math.random() * pH,
      size: currentShape==='lava' ? 6+Math.random()*12 :
            currentShape==='petal' ? 8+Math.random()*10 :
            currentShape==='bubble'? 6+Math.random()*8 :
            currentShape==='spark' ? 5+Math.random()*9 :
            4 + Math.random() * 10,
      vx: (Math.random() - 0.5) * (currentShape==='petal'?0.6:0.42),
      vy: currentShape==='lava' ? (-0.3 - Math.random()*0.4) :
          currentShape==='petal'? (0.2 + Math.random()*0.4) :
          currentShape==='bubble'?(-0.2 - Math.random()*0.5) :
          (Math.random() - 0.5) * 0.42,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * (currentShape==='petal'?0.03:0.014),
      alpha: 0.12 + Math.random() * 0.28,
      alphaPhase: Math.random() * Math.PI * 2,
      alphaSpeed: 0.008 + Math.random() * 0.016,
      hueIdx: Math.floor(Math.random() * 4),
      hueMix: Math.random(),
      glow: currentShape==='lava' || currentShape==='spark' ? true : Math.random() < 0.2
    });
  }
  if(particleRunning) drawParticles();
}

function resizeCanvas(){
  var canvas = $('particles');
  if(!canvas) return;
  pW = window.innerWidth; pH = window.innerHeight;
  canvas.width = pW * pDpr; canvas.height = pH * pDpr;
  canvas.style.width = pW + 'px'; canvas.style.height = pH + 'px';
  if(particleCtx) particleCtx.setTransform(pDpr, 0, 0, pDpr, 0, 0);
}

function drawSquare(ctx, s, hs, r, g, b, a){
  var rad = Math.min(3, s/3.5);
  var grad = ctx.createLinearGradient(-hs, -hs, hs, hs);
  grad.addColorStop(0, 'rgba('+r+','+g+','+b+','+a+')');
  grad.addColorStop(1, 'rgba('+r+','+g+','+b+','+(a*0.3)+')');
  ctx.fillStyle = grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-hs, -hs, s, s, rad);
  else ctx.rect(-hs, -hs, s, s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,'+(a*0.2)+')';
  ctx.lineWidth = 0.5;
  ctx.stroke();
}
function drawLava(ctx, s, hs, r, g, b, a){
  var rad = hs * 1.4;
  var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, rad);
  grad.addColorStop(0, 'rgba(255,240,180,'+a+')');
  grad.addColorStop(0.3, 'rgba(255,160,60,'+a+')');
  grad.addColorStop(0.7, 'rgba('+r+','+g+','+b+','+(a*0.8)+')');
  grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fill();
}
function drawSpark(ctx, s, hs, r, g, b, a){
  var grad = ctx.createRadialGradient(0, 0, 0, 0, 0, hs);
  grad.addColorStop(0, 'rgba(255,255,255,'+a+')');
  grad.addColorStop(0.4, 'rgba('+r+','+g+','+b+','+a+')');
  grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -hs*1.2); ctx.lineTo(hs*0.5, 0); ctx.lineTo(0, hs*1.2); ctx.lineTo(-hs*0.5, 0);
  ctx.closePath(); ctx.fill();
}
function drawPetal(ctx, s, hs, r, g, b, a){
  var w = hs*0.8, h = hs*1.3;
  var grad = ctx.createLinearGradient(0, -h, 0, h);
  grad.addColorStop(0, 'rgba(255,220,235,'+a+')');
  grad.addColorStop(0.5, 'rgba('+r+','+g+','+b+','+a+')');
  grad.addColorStop(1, 'rgba('+r+','+g+','+b+','+(a*0.6)+')');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,'+(a*0.5)+')';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.moveTo(0, -h*0.7); ctx.lineTo(0, h*0.7); ctx.stroke();
}
function drawBubble(ctx, s, hs, r, g, b, a){
  ctx.beginPath(); ctx.arc(0, 0, hs, 0, Math.PI*2);
  ctx.fillStyle = 'rgba('+r+','+g+','+b+','+(a*0.35)+')'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,'+(a*0.7)+')';
  ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(-hs*0.3, -hs*0.3, hs*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,'+(a*0.8)+')'; ctx.fill();
}

function drawParticles(){
  if(!particleRunning || !particleCtx) return;
  particleCtx.clearRect(0, 0, pW, pH);
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.x < -60) p.x = pW + 60; else if(p.x > pW + 60) p.x = -60;
    if(p.y < -60) p.y = pH + 60; else if(p.y > pH + 60) p.y = -60;

    p.alphaPhase += p.alphaSpeed;
    var a = p.alpha * (0.55 + 0.45 * Math.sin(p.alphaPhase));
    a = Math.max(0.05, Math.min(0.6, a));

    var c1 = (themeColors[p.hueIdx] || themeColors[0]).split(',').map(function(n){ return parseInt(n,10)||0; });
    var c2 = (themeColors[(p.hueIdx+1)%4] || themeColors[0]).split(',').map(function(n){ return parseInt(n,10)||0; });
    var mix = p.hueMix;
    var r = Math.round(c1[0]*(1-mix) + c2[0]*mix);
    var g = Math.round(c1[1]*(1-mix) + c2[1]*mix);
    var b = Math.round(c1[2]*(1-mix) + c2[2]*mix);

    particleCtx.save();
    particleCtx.translate(p.x, p.y);
    particleCtx.rotate(p.rot);

    if(p.glow){
      particleCtx.shadowBlur = currentShape==='lava'?18:10;
      particleCtx.shadowColor = 'rgba('+r+','+g+','+b+','+(a*0.8)+')';
    }

    var s = p.size, hs = s/2;
    if(currentShape==='lava')        drawLava(particleCtx, s, hs, r, g, b, a);
    else if(currentShape==='spark')  drawSpark(particleCtx, s, hs, r, g, b, a);
    else if(currentShape==='petal')  drawPetal(particleCtx, s, hs, r, g, b, a);
    else if(currentShape==='bubble') drawBubble(particleCtx, s, hs, r, g, b, a);
    else                             drawSquare(particleCtx, s, hs, r, g, b, a);

    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

/* ============================================================
   滚动
   ============================================================ */
var topbarEl=$('topbar'),rafPend=false;
function onScroll(){
  if(rafPend)return;rafPend=true;
  requestAnimationFrame(function(){
    var top=window.pageYOffset||document.documentElement.scrollTop||0;
    if(topbarEl)topbarEl.classList.toggle('scrolled',top>4);
    rafPend=false;
  });
}

/* ============================================================
   自动刷新
   ============================================================ */
var refreshTimer = null;
var refreshing = false;

function silentRefresh(){
  if(refreshing) return;
  if(document.hidden) return;
  refreshing = true;
  loadTools().then(function(ok){
    refreshing = false;
    if(ok) renderIfChanged();
  }).catch(function(){
    refreshing = false;
  });
}

function startAutoRefresh(){
  stopAutoRefresh();
  refreshTimer = setInterval(silentRefresh, REFRESH_MS);
}
function stopAutoRefresh(){
  if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
}

/* ============================================================
   绑定
   ============================================================ */
function bind(){
  themeBtn.addEventListener('click',openTheme);
  themeClose.addEventListener('click',closeTheme);
  themeOv.addEventListener('click',function(e){if(e.target===themeOv)closeTheme();});
  themeGrid.addEventListener('click',function(e){
    var card=e.target.closest('[data-theme-val]');
    if(!card)return;
    var id=card.getAttribute('data-theme-val');
    applyTheme(id);
    closeTheme();
    var name=id;
    for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===id)name=THEMES[i].name;
    toast('已切换到 '+name);
  });

  var reloadBtn=$('reloadBtn');
  if(reloadBtn){
    reloadBtn.addEventListener('click',function(){
      if(reloadBtn.classList.contains('spin-anim'))return;
      reloadBtn.classList.add('spin-anim');
      toast('正在刷新…');
      loadTools().then(function(ok){
        lastSignature = '';      /* 强制重渲染 */
        renderTools();
        setTimeout(function(){reloadBtn.classList.remove('spin-anim');},400);
      });
    });
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&themeOv.classList.contains('show')){e.preventDefault();closeTheme();}
  });

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){resizeCanvas();onScroll();},{passive:true});

  /* 页面可见性：隐藏时暂停刷新和粒子，可见时立即刷一次 */
  document.addEventListener('visibilitychange',function(){
    particleRunning = !document.hidden;
    if(particleRunning){
      drawParticles();
      silentRefresh();          /* 回来时立刻拉一次 */
      startAutoRefresh();
    }else{
      stopAutoRefresh();
    }
  });
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  applyTheme(curTheme);

  /* 1. 先用缓存（或默认）立即渲染，避免空白 */
  var cached = loadToolsCache();
  if(cached) TOOLS = cached;
  lastSignature = toolsSignature(TOOLS);
  renderTools();

  /* 2. 装饰 + 粒子 */
  buildFloatDecor();
  initParticles();
  bind();
  onScroll();

  /* 3. 后台异步拉远程数据，成功后覆盖 */
  loadTools().then(function(ok){
    if(ok) renderIfChanged();
  });

  /* 4. 启动 120 秒自动刷新 */
  startAutoRefresh();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
