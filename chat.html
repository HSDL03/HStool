<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天室 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<script>
(function(){
  try{
    var t=localStorage.getItem('wiki-theme');
    var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
    if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
    if(localStorage.getItem('chat-dense')==='1')document.documentElement.classList.add('dense');
    var fs=localStorage.getItem('chat-fontsize');
    if(fs) document.documentElement.style.setProperty('--chat-fs', fs+'px');
    if(localStorage.getItem('chat-noanim')==='1')document.documentElement.classList.add('noanim');
  }catch(e){}
})();
</script>
<style>
:root,[data-theme="mc-wiki"]{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.13);--blob2:rgba(106,140,60,.09);--blob3:rgba(180,150,80,.07);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --topbar-bg:linear-gradient(180deg,#56682c,#3d521f);
  --topbar-fg:#fff;--topbar-bd:#2a3a1a;
  --self-bg:linear-gradient(135deg,#7a9c3c,#3d521f);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
  --chat-fs:14px;
}
[data-theme="mc-night"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#303030;--text:#e0e0e0;--muted:#909090;
  --bd:#505050;--bd2:#6a6a6a;--ac:#8ec44a;--acs:#2a3a1a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(142,196,74,.10);--blob2:rgba(90,140,60,.07);--blob3:rgba(120,90,40,.07);
  --grid:rgba(255,255,255,.025);
  --p1:142,196,74;--p2:90,140,60;--p3:200,180,100;--p4:120,90,40;
  --topbar-bg:linear-gradient(180deg,#2a3a1a,#1a2a0a);
  --topbar-fg:#e8ffd0;--topbar-bd:#0a1a00;
  --self-bg:linear-gradient(135deg,#8ec44a,#3d521f);--self-fg:#e8ffd0;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="mc-nether"]{
  --bg:#1a0a0a;--bg2:#2a1212;--bg3:#3a1a1a;--text:#f0d0d0;--muted:#a08080;
  --bd:#6a3030;--bd2:#8a4040;--ac:#ff6030;--acs:#3a1a10;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#f85050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(255,96,48,.12);--blob2:rgba(200,60,30,.09);--blob3:rgba(255,150,80,.07);
  --grid:rgba(255,150,100,.03);
  --p1:255,96,48;--p2:200,60,30;--p3:255,150,80;--p4:120,40,20;
  --topbar-bg:linear-gradient(180deg,#3a1212,#1a0a0a);
  --topbar-fg:#ffe0d0;--topbar-bd:#0a0500;
  --self-bg:linear-gradient(135deg,#ff6030,#8a2010);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="mc-end"]{
  --bg:#0f0a1a;--bg2:#1a1230;--bg3:#251a40;--text:#e0d0f0;--muted:#9080a0;
  --bd:#4a3a6a;--bd2:#6a5a8a;--ac:#a060ff;--acs:#2a1a3a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(160,96,255,.12);--blob2:rgba(120,60,200,.08);--blob3:rgba(200,150,255,.06);
  --grid:rgba(200,150,255,.025);
  --p1:160,96,255;--p2:120,60,200;--p3:200,150,255;--p4:80,40,120;
  --topbar-bg:linear-gradient(180deg,#2a1a3a,#0f0a1a);
  --topbar-fg:#e0d0ff;--topbar-bd:#0a0510;
  --self-bg:linear-gradient(135deg,#a060ff,#4a2080);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="sakura"]{
  --bg:#fffafc;--bg2:#fff0f5;--bg3:#ffe0ea;--text:#2a1a20;--muted:#806070;
  --bd:#e0b0c0;--bd2:#a06080;--ac:#d04080;--acs:#ffe0ea;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(160,80,120,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(160,80,120,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(208,64,128,.12);--blob2:rgba(240,120,160,.08);--blob3:rgba(255,180,200,.06);
  --grid:rgba(208,64,128,.04);
  --p1:208,64,128;--p2:240,120,160;--p3:255,180,200;--p4:160,80,120;
  --topbar-bg:linear-gradient(180deg,#d06090,#a04070);
  --topbar-fg:#fff;--topbar-bd:#802050;
  --self-bg:linear-gradient(135deg,#ff80a0,#d04080);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="ocean"]{
  --bg:#f0f8ff;--bg2:#e0f0fa;--bg3:#c8e0f0;--text:#0a1a2a;--muted:#406080;
  --bd:#a0c0d8;--bd2:#406080;--ac:#0066cc;--acs:#c8e4ff;
  --ok:#1a7f37;--warn:#b08800;--dgr:#cf222e;
  --sh:2px 2px 0 rgba(32,80,140,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(32,80,140,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(0,102,204,.10);--blob2:rgba(64,160,220,.08);--blob3:rgba(120,200,240,.06);
  --grid:rgba(0,102,204,.04);
  --p1:0,102,204;--p2:64,160,220;--p3:120,200,240;--p4:32,80,140;
  --topbar-bg:linear-gradient(180deg,#2080c0,#004890);
  --topbar-fg:#fff;--topbar-bd:#002040;
  --self-bg:linear-gradient(135deg,#40a0dc,#0066cc);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="github-light"]{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eef1f4;--text:#1f2328;--muted:#59636e;
  --bd:#d1d9e0;--bd2:#a0a8b0;--ac:#0969da;--acs:#ddf4ff;
  --ok:#1a7f37;--warn:#d4a72c;--dgr:#cf222e;
  --sh:0 1px 4px rgba(31,35,40,.08);--r:6px;
  --bevel:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(9,105,218,.08);--blob2:rgba(163,113,247,.06);--blob3:rgba(219,112,147,.05);
  --grid:rgba(31,35,40,.02);
  --p1:9,105,218;--p2:163,113,247;--p3:219,112,147;--p4:31,35,40;
  --topbar-bg:#ffffff;--topbar-fg:#1f2328;--topbar-bd:#d1d9e0;
  --self-bg:#0969da;--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="github-dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#e6edf3;--muted:#9198a1;
  --bd:#30363d;--bd2:#484f58;--ac:#4493f8;--acs:#16233a;
  --ok:#3fb950;--warn:#d4a72c;--dgr:#f85149;
  --sh:0 1px 4px rgba(0,0,0,.4);--r:6px;
  --bevel:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(68,147,248,.06);--blob2:rgba(163,113,247,.05);--blob3:rgba(219,112,147,.04);
  --grid:rgba(230,237,243,.02);
  --p1:68,147,248;--p2:163,113,247;--p3:219,112,147;--p4:230,237,243;
  --topbar-bg:#161b22;--topbar-fg:#e6edf3;--topbar-bd:#30363d;
  --self-bg:#4493f8;--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
*,*::before,*::after{box-sizing:border-box}
html.noanim *,html.noanim *::before,html.noanim *::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
html,body{height:100%}
html{background:var(--bg);transition:background-color .3s}
body{margin:0;padding-top:46px;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .3s,color .3s}

.offline-mask{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s;pointer-events:none}
.offline-mask.show{opacity:1;visibility:visible;pointer-events:auto}
.offline-card{max-width:340px;margin:20px;padding:24px 22px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel), 0 12px 32px rgba(0,0,0,.3);text-align:center}
[data-theme^="mc-"] .offline-card{box-shadow:3px 3px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.3)}
.offline-card .ic{font-size:44px;line-height:1;margin-bottom:10px;display:block;animation:offPulse 2s ease-in-out infinite}
@keyframes offPulse{0%,100%{opacity:1}50%{opacity:.4}}
.offline-card h2{margin:0 0 8px;font-size:1.15rem;font-weight:800}
.offline-card p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.offline-card .cnt{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ac);font-weight:700}
.offline-card .spin{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spinIcon .8s linear infinite}

.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid var(--topbar-bd);z-index:50;transition:background .3s,color .3s}
[data-theme^="mc-"] .topbar{border-bottom-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--topbar-fg);text-decoration:none;white-space:nowrap;cursor:pointer}
[data-theme^="mc-"] .logo{text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.logo-icon{display:inline-block;font-size:16px}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.sp{flex:1}
.chat-info{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--topbar-fg);opacity:.85}
.chat-info .online{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:999px;font-variant-numeric:tabular-nums;cursor:pointer;transition:all .15s}
.chat-info .online:hover{background:rgba(255,255,255,.28)}
[data-theme="github-light"] .chat-info .online{background:rgba(0,0,0,.06)}
.chat-info .online .live-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;box-shadow:0 0 6px rgba(74,222,128,.7);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-info .me-nick{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:999px;font-size:12px}
[data-theme="github-light"] .chat-info .me-nick{background:rgba(0,0,0,.06)}
.icon{display:grid;place-items:center;width:28px;height:28px;flex:none;font-size:13px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s,transform .2s;position:relative}
.icon:hover{background:var(--bg3);color:var(--text)}
[data-theme^="mc-"] .icon,[data-theme="sakura"] .icon,[data-theme="ocean"] .icon{color:rgba(255,255,255,.85)}
[data-theme^="mc-"] .icon:hover,[data-theme="sakura"] .icon:hover,[data-theme="ocean"] .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}
.icon.active{background:var(--acs);color:var(--ac) !important}
.icon .dot-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:#fff;background:var(--dgr);border-radius:999px;box-shadow:0 0 0 2px var(--topbar-bg);font-variant-numeric:tabular-nums}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50%,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.6}

.login-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:calc(100vh - 46px);padding:20px}
.login-wrap[hidden]{display:none !important}
.login-card{width:100%;max-width:420px;padding:32px 28px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel),0 12px 32px rgba(0,0,0,.12);text-align:center;animation:heroIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
[data-theme^="mc-"] .login-card{box-shadow:3px 3px 0 rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.12)}
.login-card .ic{font-size:52px;line-height:1;margin-bottom:8px;display:block}
.login-card h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.login-card .sub{font-size:13px;color:var(--muted);margin:0 0 24px;line-height:1.6}
.login-card .field{text-align:left;margin-bottom:16px}
.login-card .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.login-card input{width:100%;height:44px;padding:0 14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none;transition:border-color .2s,box-shadow .2s}
.login-card input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.login-card .status{min-height:20px;font-size:12px;margin:6px 0 14px;color:var(--muted)}
.login-card .status.err{color:var(--dgr);font-weight:600}
.login-card .status.ok{color:var(--ok);font-weight:600}
.login-card .status.busy{color:var(--ac);font-weight:600}
.login-card .btn-main{width:100%;height:44px;font-size:15px;font-weight:700;font-family:inherit;color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.login-card .btn-main:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.login-card .btn-main:disabled{opacity:.5;cursor:not-allowed}
.login-card .foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6}
.login-card .roll{color:var(--ac);text-decoration:none;font-weight:600;cursor:pointer;display:inline-block;margin-top:4px}
.login-card .roll:hover{text-decoration:underline}

.chat-wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:calc(100vh - 46px);max-width:900px;margin:0 auto;padding:0 16px}
.chat-wrap[hidden]{display:none !important}

.chat-toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 4px 0;flex-wrap:wrap}
.chat-toolbar .tb-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-size:11.5px;font-family:inherit;font-weight:600;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:999px;cursor:pointer;transition:all .18s}
[data-theme^="mc-"] .chat-toolbar .tb-btn{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}
.chat-toolbar .tb-btn:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-1px)}
.chat-toolbar .sp{flex:1}
.chat-toolbar .search-inline{flex:1;min-width:120px;max-width:260px;height:28px;padding:0 10px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:999px;outline:none;transition:all .2s}
[data-theme^="mc-"] .chat-toolbar .search-inline{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}
.chat-toolbar .search-inline:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}

.typing-bar{flex:none;height:0;overflow:hidden;padding:0 4px;font-size:11.5px;color:var(--muted);transition:height .2s, padding .2s}
.typing-bar.show{height:22px;padding:4px 4px 0}
.typing-bar .who{font-weight:700;color:var(--ac)}
.typing-bar .dots::after{content:"…";animation:typingDots 1.4s steps(4, end) infinite}
@keyframes typingDots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}100%{content:""}}

.messages{flex:1;overflow-y:auto;padding:16px 4px 40px;scroll-behavior:smooth;overscroll-behavior:contain;position:relative}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.messages::-webkit-scrollbar-thumb:hover{background:var(--ac)}

.load-more-hint{text-align:center;padding:6px 0 12px;font-size:11.5px;color:var(--muted)}
.load-more-hint .btn-mini{padding:4px 12px;font-size:11.5px;font-family:inherit;font-weight:600;color:var(--ac);background:var(--bg2);border:1px solid var(--ac);border-radius:999px;cursor:pointer}
[data-theme^="mc-"] .load-more-hint .btn-mini{border-radius:2px;border:2px solid var(--ac);box-shadow:var(--bevel)}
.load-more-hint .btn-mini:hover{background:var(--acs)}

.time-divider{text-align:center;margin:16px 0 12px;position:relative}
.time-divider .td-txt{display:inline-block;padding:2px 12px;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--bd);border-radius:999px;position:relative;z-index:1}
[data-theme^="mc-"] .time-divider .td-txt{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}

.msg{display:flex;gap:10px;margin-bottom:12px;animation:msgIn .3s cubic-bezier(.22,1,.36,1) both;position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .avatar{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);user-select:none;cursor:pointer;transition:transform .2s}
.msg .avatar:hover{transform:scale(1.05)}
[data-theme^="github-"] .msg .avatar{border-radius:50%}
.msg .avatar.empty{visibility:hidden;pointer-events:none}
.msg .body{flex:1;min-width:0;position:relative}
.msg .head{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;font-size:11px;flex-wrap:wrap}
.msg .nick{font-weight:700;color:var(--text);font-size:12.5px}
.msg .time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;cursor:help}
.msg .edited-tag{font-size:10.5px;color:var(--muted);opacity:.75;font-style:italic}
.msg .content{display:inline-block;max-width:100%;padding:7px 12px;font-size:var(--chat-fs);line-height:1.55;word-break:break-word;white-space:pre-wrap;background:var(--other-bg);color:var(--other-fg);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel)}
[data-theme^="github-"] .msg .content{border-radius:12px}
.msg .content a{color:var(--ac);text-decoration:underline;word-break:break-all}
.msg .content code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;padding:1px 5px;background:var(--bg3);border-radius:3px}
.msg .content mark{background:rgba(255,220,0,.5);color:inherit;padding:0 2px;border-radius:2px}
.msg .content strong{font-weight:700}
.msg .content em{font-style:italic}
.msg.self{flex-direction:row-reverse}
.msg.self .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.self .head{flex-direction:row-reverse}
.msg.self .content{background:var(--self-bg);color:var(--self-fg);border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.15)}
[data-theme="github-light"] .msg.self .content,[data-theme="github-dark"] .msg.self .content{text-shadow:none}
.msg.self .content a{color:#fff}
.msg.self .content code{background:rgba(0,0,0,.2);color:#fff}
.msg.compact{margin-top:-6px}

html.dense .msg{margin-bottom:6px}
html.dense .msg.compact{margin-top:-4px}
html.dense .messages{padding:10px 4px 30px}

.msg .mention{color:var(--ac);font-weight:700;padding:0 2px;background:var(--acs);border-radius:3px}
.msg.self .mention{color:#fff;background:rgba(255,255,255,.25)}
.msg.mentioned .content{border-color:var(--warn);box-shadow:var(--bevel),0 0 0 2px rgba(176,136,0,.25)}

.msg .reply-quote{display:block;margin-bottom:5px;padding:4px 10px;font-size:12px;line-height:1.4;color:var(--muted);background:var(--bg2);border-left:3px solid var(--ac);border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;transition:background .15s}
[data-theme^="mc-"] .msg .reply-quote{border-radius:2px}
.msg .reply-quote:hover{background:var(--bg3)}
.msg .reply-quote .rq-nick{font-weight:700;color:var(--ac);margin-right:4px}
.msg.self .reply-quote{background:rgba(255,255,255,.15);border-left-color:rgba(255,255,255,.6)}
.msg.self .reply-quote .rq-nick{color:#fff}
.msg.self .reply-quote:hover{background:rgba(255,255,255,.25)}

.msg.recalled .content,.msg.deleted .content{font-style:italic;opacity:.55;background:transparent;border-style:dashed}

/* ★ 右键上下文菜单 */
.ctx-menu{position:fixed;z-index:300;min-width:150px;padding:5px;display:flex;flex-direction:column;gap:2px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:3px 3px 0 rgba(0,0,0,.3);opacity:0;visibility:hidden;transform:translateY(-4px) scale(.97);transition:opacity .14s ease-out,visibility .14s,transform .14s cubic-bezier(.34,1.56,.64,1);user-select:none}
.ctx-menu.show{opacity:1;visibility:visible;transform:none}
.ctx-menu button{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:13px;font-family:inherit;font-weight:600;text-align:left;color:var(--text);background:transparent;border:none;border-radius:calc(var(--r) - 1px);cursor:pointer;transition:background .12s,color .12s}
.ctx-menu button:hover{background:var(--acs);color:var(--ac)}
.ctx-menu button .ctx-ic{flex:none;width:16px;text-align:center;font-size:14px;line-height:1}
.ctx-menu button .ctx-tx{flex:1}
.ctx-menu button.danger:hover{background:rgba(160,32,32,.12);color:var(--dgr)}
.ctx-menu button[hidden]{display:none !important}
.ctx-menu .ctx-sep{height:1px;margin:3px 6px;background:var(--bd);flex:none}
[data-theme^="github-"] .ctx-menu{border-width:1px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
[data-theme^="github-"] .ctx-menu button{border-radius:6px}

.msg .reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.msg.self .reactions{justify-content:flex-end}
.msg .reactions .react{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:999px;cursor:pointer;transition:all .15s;font-variant-numeric:tabular-nums}
[data-theme^="mc-"] .msg .reactions .react{border-radius:2px;box-shadow:var(--bevel)}
.msg .reactions .react:hover{border-color:var(--ac);background:var(--acs)}
.msg .reactions .react.mine{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700}

.emoji-pop{position:fixed;padding:6px;display:grid;grid-template-columns:repeat(6, 1fr);gap:2px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--sh);z-index:400;animation:popIn .15s ease-out}
[data-theme^="mc-"] .emoji-pop{box-shadow:3px 3px 0 rgba(0,0,0,.3)}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.95)}to{opacity:1;transform:none}}
.emoji-pop button{width:26px;height:26px;display:grid;place-items:center;font-size:16px;font-family:inherit;background:transparent;border:none;border-radius:4px;cursor:pointer;transition:background .12s, transform .12s}
.emoji-pop button:hover{background:var(--acs);transform:scale(1.15)}

.mention-pop{position:absolute;left:0;right:0;bottom:calc(100% + 4px);max-height:200px;overflow-y:auto;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--sh);z-index:30;animation:popIn .15s ease-out}
[data-theme^="mc-"] .mention-pop{box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.mention-pop[hidden]{display:none !important}
.mention-pop .mp-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .12s}
.mention-pop .mp-item:hover,.mention-pop .mp-item.selected{background:var(--acs)}
.mention-pop .mp-avatar{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:12px;color:#fff;font-weight:700;flex:none}

.msg .status-tag{display:inline-block;font-size:10.5px;color:var(--muted);font-style:italic;vertical-align:middle}
.msg.pending .content{opacity:.55}
.msg.pending .status-tag::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;border:1.5px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spinIcon .7s linear infinite;vertical-align:-1px}
.msg.failed .content{border-color:var(--dgr);box-shadow:var(--bevel),0 0 0 1px rgba(160,32,32,.3)}
.msg.failed .status-tag{color:var(--dgr);font-weight:700;font-style:normal}
.msg.failed .status-tag::before{content:"⚠ "}

.msg.highlight .content{animation:highlightFlash 2.2s ease-out}
@keyframes highlightFlash{0%{box-shadow:var(--bevel), 0 0 0 3px var(--ac);}70%{box-shadow:var(--bevel), 0 0 0 3px var(--ac);}100%{box-shadow:var(--bevel);}}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px 20px}
.empty-state .ic{font-size:48px;opacity:.4;margin-bottom:12px}
.empty-state .t{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.empty-state .s{font-size:12.5px;line-height:1.7}

.composer{flex:none;padding:12px 0 16px;background:var(--bg);border-top:1px solid var(--bd);display:flex;gap:8px;align-items:flex-end;position:relative}
[data-theme^="mc-"] .composer{border-top-width:2px}

.composer .reply-hint[hidden]{display:none !important}

.composer .reply-hint{position:absolute;top:-42px;left:0;right:0;margin:0 4px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-bottom:none;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--bevel)}
[data-theme^="mc-"] .composer .reply-hint{border:2px solid var(--bd2);border-bottom:none;border-radius:2px 2px 0 0}
.composer .reply-hint .rh-nick{font-weight:700;color:var(--ac)}
.composer .reply-hint .rh-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.composer .reply-hint .rh-close{flex:none;width:20px;height:20px;display:grid;place-items:center;background:transparent;border:none;border-radius:4px;cursor:pointer;color:var(--muted);font-size:14px}
.composer .reply-hint .rh-close:hover{background:var(--bg3);color:var(--dgr)}

.composer .input-wrap{flex:1;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:border-color .2s,box-shadow .2s;position:relative}
[data-theme^="mc-"] .composer .input-wrap{border-width:2px;border-color:var(--bd2);box-shadow:var(--bevel)}
.composer .input-wrap:focus-within{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.composer textarea{width:100%;min-height:38px;max-height:120px;padding:8px 12px;font-family:inherit;font-size:var(--chat-fs);line-height:1.5;color:var(--text);background:transparent;border:none;outline:none;resize:none;overflow-y:auto}
.composer textarea::placeholder{color:var(--muted)}
.composer .send{flex:none;min-width:64px;height:40px;padding:0 16px;font-size:14px;font-family:inherit;font-weight:700;color:#fff;background:var(--self-bg);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:all .15s}
.composer .send:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.composer .send:disabled{opacity:.5;cursor:not-allowed}

.scroll-bottom-btn{position:absolute;right:16px;bottom:100px;z-index:30;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:12.5px;font-weight:700;font-family:inherit;color:#fff;background:var(--self-bg);border:2px solid var(--bd2);border-radius:999px;box-shadow:var(--sh);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:all .25s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .scroll-bottom-btn{border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.scroll-bottom-btn.show{opacity:1;pointer-events:auto;transform:none}
.scroll-bottom-btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.scroll-bottom-btn .sb-count{padding:1px 7px;font-size:11px;background:rgba(255,255,255,.3);border-radius:999px;font-variant-numeric:tabular-nums}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:520px;max-height:calc(100vh - 32px);background:var(--bg);border:1px solid var(--bd);border-radius:calc(var(--r) + 3px);box-shadow:var(--sh);overflow:hidden;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
[data-theme^="mc-"] .pnl{border:2px solid var(--bd2);border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.ov.show .pnl{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);flex:none;color:#fff}
[data-theme="mc-wiki"] .ph{background:linear-gradient(180deg,#7a9c3c,#56682c);border-bottom:2px solid #3d521f}
[data-theme="mc-night"] .ph{background:linear-gradient(180deg,#5a7a2c,#3d521f);color:#e8ffd0}
[data-theme="mc-nether"] .ph{background:linear-gradient(180deg,#8a2010,#4a1008);color:#ffe0d0}
[data-theme="mc-end"] .ph{background:linear-gradient(180deg,#4a2080,#2a1050);color:#e0d0ff}
[data-theme="sakura"] .ph{background:linear-gradient(180deg,#e07090,#c05070)}
[data-theme="ocean"] .ph{background:linear-gradient(180deg,#2080c0,#004890)}
.ph strong{font-size:14px}
.ph .sp{flex:1}
.ph .icon{color:inherit}
.ph .icon:hover{background:rgba(0,0,0,.2);color:#fff}

.theme-body{padding:14px;overflow-y:auto}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-card{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--bevel);transition:all .2s;text-align:left}
.theme-card:hover{transform:translateY(-2px);border-color:var(--ac)}
.theme-card.active{border-color:var(--ac);box-shadow:var(--bevel),0 0 0 2px var(--acs)}
.theme-prev{display:flex;height:30px;border:1px solid var(--bd);border-radius:calc(var(--r) - 2px);overflow:hidden}
.theme-prev span{flex:1;display:block}
.theme-name{font-size:12.5px;font-weight:700}
.theme-desc{font-size:10.5px;color:var(--muted);margin-top:-3px}

.online-body{padding:14px}
.online-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.online-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel)}
[data-theme^="mc-"] .online-item{border:2px solid var(--bd2);border-radius:2px}
.online-item .oa{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r);font-size:14px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
[data-theme^="github-"] .online-item .oa{border-radius:50%}
.online-item .oi-name{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-item .oi-name .me-tag{font-size:10.5px;font-weight:600;color:var(--ac);background:var(--acs);padding:1px 6px;border-radius:999px;margin-left:6px}
.online-item .oi-time{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.online-item .oi-block{flex:none;padding:3px 8px;font-size:11px;font-family:inherit;color:var(--muted);background:transparent;border:1px solid var(--bd);border-radius:4px;cursor:pointer;transition:all .15s}
.online-item .oi-block:hover{color:var(--dgr);border-color:var(--dgr)}
.online-empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}

.user-card-body{padding:18px;text-align:center}
.user-card-body .uc-avatar{width:64px;height:64px;margin:0 auto 12px;display:grid;place-items:center;border-radius:var(--r);font-size:28px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3)}
[data-theme^="github-"] .user-card-body .uc-avatar{border-radius:50%}
.user-card-body .uc-nick{font-size:16px;font-weight:800;margin-bottom:4px}
.user-card-body .uc-meta{font-size:12px;color:var(--muted);margin-bottom:14px}
.user-card-body .uc-stat{display:flex;justify-content:center;gap:20px;margin:14px 0;font-size:12.5px}
.user-card-body .uc-stat div{display:flex;flex-direction:column;align-items:center}
.user-card-body .uc-stat strong{font-size:18px;font-weight:800;color:var(--ac)}
.user-card-body .uc-actions{display:flex;gap:8px;justify-content:center;margin-top:14px}
.user-card-body .uc-actions button{padding:6px 14px;font-size:13px;font-family:inherit;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .15s}
.user-card-body .uc-actions .btn-block{color:var(--dgr);background:transparent;border:1px solid var(--dgr)}
.user-card-body .uc-actions .btn-block:hover{background:rgba(160,32,32,.1)}
.user-card-body .uc-actions .btn-unblock{color:var(--ok);background:transparent;border:1px solid var(--ok)}
.user-card-body .uc-actions .btn-unblock:hover{background:rgba(45,122,45,.1)}
.user-card-body .uc-actions .btn-close{color:var(--text);background:var(--bg);border:1px solid var(--bd)}
.user-card-body .uc-actions .btn-close:hover{background:var(--bg3)}

.toast{position:fixed;left:50%;bottom:20px;max-width:calc(100vw - 32px);padding:8px 16px;font-size:13px;color:var(--bg);background:var(--text);border-radius:var(--r);box-shadow:var(--sh);opacity:0;transform:translateX(-50%) translateY(16px);transition:opacity .22s,transform .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:200}
[data-theme^="mc-"] .toast{background:#2a3a1a;color:#e8ffd0;border:2px solid #4a4a3a;border-radius:2px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
[data-theme="mc-nether"] .toast{background:#2a0800;color:#ffe0d0;border-color:#5a2010}
[data-theme="mc-end"] .toast{background:#1a0f30;color:#e0d0ff;border-color:#3a2060}
[data-theme="sakura"] .toast{background:#a04060;color:#ffe0ea;border-color:#802050}
[data-theme="ocean"] .toast{background:#004890;color:#e0f0ff;border-color:#002040}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.refresh-pill{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:999px;box-shadow:var(--bevel);user-select:none;opacity:.72;transition:opacity .25s,transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s,color .25s;pointer-events:auto}
[data-theme^="mc-"] .refresh-pill{border:2px solid var(--bd2);border-radius:2px}
.refresh-pill:hover{opacity:1;transform:translateY(-2px);border-color:var(--ac);color:var(--text)}
.refresh-pill .rp-icon{display:inline-block;font-size:12px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.refresh-pill.tick .rp-icon{transform:rotate(180deg)}
.refresh-pill .rp-text{white-space:nowrap;font-variant-numeric:tabular-nums}
.refresh-pill .rp-text #cdNum{color:var(--ac);font-weight:700;display:inline-block;min-width:10px;text-align:center}
.refresh-pill.loading .rp-icon{animation:spinIcon .8s linear infinite}
@keyframes spinIcon{to{transform:rotate(360deg)}}
.refresh-pill.err{border-color:var(--dgr);color:var(--dgr)}
.refresh-pill.err .rp-text #cdNum{color:var(--dgr)}
.refresh-pill.retry{border-color:var(--warn);color:var(--warn)}
.refresh-pill.retry .rp-text #cdNum{color:var(--warn)}

.nick-ov-body{padding:18px}
.nick-ov-body label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.nick-ov-body input[type=text]{width:100%;height:42px;padding:0 12px;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none;transition:border-color .2s,box-shadow .2s}
.nick-ov-body input[type=text]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.nick-ov-body .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}
.nick-ov-body .hint.err{color:var(--dgr);font-weight:600}
.nick-ov-body .quota{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:11px;background:var(--acs);color:var(--ac);border-radius:999px;font-family:ui-monospace,Menlo,Consolas,monospace}
.nick-ov-foot{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.nick-ov-foot button{padding:7px 16px;font-size:14px;font-family:inherit;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .15s}
.nick-ov-foot .cancel{color:var(--text);background:var(--bg);border:1px solid var(--bd)}
.nick-ov-foot .cancel:hover{background:var(--bg3)}
.nick-ov-foot .save{color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);box-shadow:var(--bevel)}
.nick-ov-foot .save:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.nick-ov-foot .save:disabled{opacity:.5;cursor:not-allowed}

.jump-body{padding:18px}
.jump-body label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.jump-body input[type=datetime-local]{width:100%;height:42px;padding:0 12px;font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none}
.jump-body input[type=datetime-local]:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.jump-body .quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.jump-body .quick button{padding:4px 10px;font-size:12px;font-family:inherit;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:999px;cursor:pointer;transition:all .15s}
[data-theme^="mc-"] .jump-body .quick button{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}
.jump-body .quick button:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-1px)}
.jump-foot{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.jump-foot button{padding:7px 16px;font-size:14px;font-family:inherit;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .15s}
.jump-foot .cancel{color:var(--text);background:var(--bg);border:1px solid var(--bd)}
.jump-foot .cancel:hover{background:var(--bg3)}
.jump-foot .go{color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);box-shadow:var(--bevel)}
.jump-foot .go:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}

.edit-body{padding:18px}
.edit-body textarea{width:100%;min-height:80px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none;resize:vertical}
.edit-body textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.edit-foot{padding:12px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.edit-foot button{padding:7px 16px;font-size:14px;font-family:inherit;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .15s}
.edit-foot .cancel{color:var(--text);background:var(--bg);border:1px solid var(--bd)}
.edit-foot .cancel:hover{background:var(--bg3)}
.edit-foot .save{color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);box-shadow:var(--bevel)}
.edit-foot .save:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}

.settings-body{padding:14px}
.settings-group{padding:10px 12px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px}
[data-theme^="mc-"] .settings-group{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}
.settings-group .sg-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.settings-row .sr-label{font-size:13px;color:var(--text)}
.settings-row .sr-value{display:flex;align-items:center;gap:6px}
.settings-row .sr-btn{padding:4px 10px;font-size:12px;font-family:inherit;font-weight:600;color:var(--text);background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .15s}
.settings-row .sr-btn:hover{color:var(--ac);border-color:var(--ac)}
.settings-row .sr-btn.active{color:var(--ac);background:var(--acs);border-color:var(--ac)}

.style-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.style-row label{flex:none;width:100px;font-size:12px;font-weight:700;color:var(--muted)}
.style-row input[type=color]{flex:1;height:36px;padding:2px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;outline:none}
.style-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.style-row input[type=color]::-webkit-color-swatch{border:none;border-radius:0}
.style-row .reset-one{flex:none;padding:5px 10px;font-size:11.5px;font-family:inherit;color:var(--muted);background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer;transition:all .15s}
.style-row .reset-one:hover{color:var(--ac);border-color:var(--ac)}

.emoji-grid{display:grid;grid-template-columns:repeat(10, 1fr);gap:4px;margin-top:6px}
.emoji-grid button{aspect-ratio:1;display:grid;place-items:center;font-size:18px;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;cursor:pointer;transition:all .15s}
[data-theme^="mc-"] .emoji-grid button{border:2px solid var(--bd2);border-radius:2px}
.emoji-grid button:hover{background:var(--acs);border-color:var(--ac);transform:scale(1.1)}
.emoji-grid button.selected{border-color:var(--ac);background:var(--acs);box-shadow:0 0 0 2px var(--acs)}

.style-preview{margin-top:16px;padding:14px;background:var(--bg2);border:1px dashed var(--bd);border-radius:var(--r)}
[data-theme^="mc-"] .style-preview{border-width:2px;border-style:solid;border-color:var(--bd2);box-shadow:var(--bevel)}
.style-preview .pv-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
.style-preview .msg{margin-bottom:0}
.style-foot{padding:12px 18px;display:flex;gap:8px;border-top:1px solid var(--bd)}
.style-foot .sp{flex:1}
.style-foot button{padding:7px 16px;font-size:14px;font-family:inherit;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all .15s}
.style-foot .reset-all{color:var(--muted);background:transparent;border:1px solid var(--bd)}
.style-foot .reset-all:hover{color:var(--dgr);border-color:var(--dgr)}
.style-foot .cancel{color:var(--text);background:var(--bg);border:1px solid var(--bd)}
.style-foot .cancel:hover{background:var(--bg3)}
.style-foot .save{color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);box-shadow:var(--bevel)}
.style-foot .save:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.style-foot .save:disabled{opacity:.5;cursor:not-allowed}

@media(max-width:640px){
  .chat-wrap{padding:0 10px}
  .messages{padding:10px 2px 36px}
  .msg .avatar{width:32px;height:32px;font-size:12px}
  .msg .content{font-size:13px;padding:6px 10px}
  .composer .send{min-width:56px;padding:0 12px}
  .logo span:last-child{display:none}
  .chat-info .online span:not(.live-dot){display:none}
  .chat-info .me-nick{max-width:70px}
  .login-card{padding:24px 20px}
  .refresh-pill{right:8px;bottom:8px;padding:5px 10px 5px 8px;font-size:10px;opacity:.65}
  .chat-toolbar{padding:6px 2px 0}
  .style-row label{width:80px;font-size:11px}
  .emoji-grid{grid-template-columns:repeat(7, 1fr)}
  .ctx-menu{min-width:140px}
  .scroll-bottom-btn{right:10px;bottom:90px;font-size:11.5px;padding:6px 12px}
}
@media print{.refresh-pill,.offline-mask,.chat-toolbar,.scroll-bottom-btn,.ctx-menu{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <a class="logo" href="./index.html"><span class="logo-icon">💬</span><span>聊天室</span></a>
  <span class="sp"></span>
  <div class="chat-info">
    <span class="online" id="onlineBadge" title="查看在线列表" hidden>
      <span class="live-dot"></span>
      <span id="onlineNum">0</span>
    </span>
    <span class="me-nick" id="meNick" hidden></span>
  </div>
  <button class="icon" id="soundBtn" title="提示音" hidden>🔊</button>
  <button class="icon" id="settingsBtn" title="界面设置" hidden>⚙️</button>
  <button class="icon" id="styleBtn" title="自定义颜色 / 头像" hidden>🖌️</button>
  <button class="icon" id="nickBtn" title="修改昵称" hidden>👤</button>
  <button class="icon" id="themeBtn" title="切换风格">🎨</button>
  <button class="icon" id="homeBtn" title="返回小站" onclick="location.href='./index.html'">🧰</button>
</header>

<div class="bg-decor" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-bg"></div>
  <canvas id="particles"></canvas>
</div>

<div class="offline-mask" id="offlineMask">
  <div class="offline-card">
    <span class="ic">📡</span>
    <h2 id="offlineTitle">连接中断，正在重试…</h2>
    <p id="offlineSub"><span class="spin"></span>第 <span class="cnt" id="retryCount">1</span> 次重试</p>
    <p style="margin:0;font-size:12px;color:var(--muted);line-height:1.5">
      如果一直失败，可能是网络被墙。<br>
      试试换 WiFi / 手机热点，或挂梯子。
    </p>
  </div>
</div>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <span class="ic">💬</span>
    <h1>进入聊天室</h1>
    <p class="sub">起一个名字就行，不用注册。<br>名字唯一，别人用过就不能再用。</p>
    <div class="field">
      <label>你的名字</label>
      <input id="loginNick" type="text" maxlength="20" placeholder="1-20 字" autocomplete="off" spellcheck="false">
    </div>
    <div class="status" id="loginStatus"></div>
    <button class="btn-main" id="loginBtn" disabled>进入 →</button>
    <div class="foot">
      名字会一直记住，下次打开直接进<br>
      <a class="roll" id="rollBtn">🎲 随机一个名字</a>
    </div>
  </div>
</div>

<main class="chat-wrap" id="chatWrap" hidden>
  <div class="chat-toolbar">
    <button class="tb-btn" id="jumpBtn" title="跳转到指定时间">📅 跳到时间</button>
    <button class="tb-btn" id="jumpLatestBtn" title="回到最新消息">⬇ 回到最新</button>
    <input type="text" class="search-inline" id="searchInput" placeholder="🔍 搜索消息…">
    <span class="sp"></span>
  </div>
  <div class="typing-bar" id="typingBar">
    <span class="who" id="typingWho">某人</span> 正在输入<span class="dots"></span>
  </div>
  <div class="messages" id="messages"></div>
  <button class="scroll-bottom-btn" id="scrollBottomBtn">
    <span>⬇ 新消息</span>
    <span class="sb-count" id="unreadCount">0</span>
  </button>

  <div class="composer" id="composer">
    <div class="reply-hint" id="replyHint" hidden>
      <span class="rh-nick" id="rhNick"></span>
      <span class="rh-text" id="rhText"></span>
      <button class="rh-close" id="rhClose" title="取消回复">✕</button>
    </div>
    <div class="input-wrap">
      <div class="mention-pop" id="mentionPop" hidden></div>
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行，右键消息可操作）" maxlength="500"></textarea>
    </div>
    <button class="send" id="sendBtn" disabled>发送</button>
  </div>
</main>

<div class="ov" id="themeOv">
  <div class="pnl">
    <div class="ph"><strong>选择风格</strong><span class="sp"></span><button class="icon" id="themeClose">✕</button></div>
    <div class="theme-body"><div class="theme-grid" id="themeGrid"></div></div>
  </div>
</div>

<div class="ov" id="nickOv">
  <div class="pnl">
    <div class="ph"><strong>修改昵称</strong><span class="sp"></span><button class="icon" id="nickClose">✕</button></div>
    <div class="nick-ov-body">
      <label>新昵称</label>
      <input id="nickInput" type="text" maxlength="20" placeholder="1-20 字" autocomplete="off" spellcheck="false">
      <div class="hint" id="nickHint">
        改名后旧昵称会被释放，别人可以用了。<br>
        <span class="quota">今日还可改 <span id="nickQuotaLeft">5</span> / 5 次</span>
      </div>
    </div>
    <div class="nick-ov-foot">
      <button class="cancel" id="nickCancel">取消</button>
      <button class="save" id="nickSave">保存</button>
    </div>
  </div>
</div>

<div class="ov" id="jumpOv">
  <div class="pnl">
    <div class="ph"><strong>跳到指定时间</strong><span class="sp"></span><button class="icon" id="jumpClose">✕</button></div>
    <div class="jump-body">
      <label>日期时间</label>
      <input id="jumpInput" type="datetime-local">
      <div class="quick">
        <button type="button" data-offset="3600000">1 小时前</button>
        <button type="button" data-offset="21600000">6 小时前</button>
        <button type="button" data-offset="43200000">12 小时前</button>
        <button type="button" data-offset="86400000">1 天前</button>
        <button type="button" data-offset="259200000">3 天前</button>
      </div>
    </div>
    <div class="jump-foot">
      <button class="cancel" id="jumpCancel">取消</button>
      <button class="go" id="jumpGo">跳转 →</button>
    </div>
  </div>
</div>

<div class="ov" id="styleOv">
  <div class="pnl">
    <div class="ph"><strong>自定义颜色 / 头像</strong><span class="sp"></span><button class="icon" id="styleClose">✕</button></div>
    <div class="style-body" style="padding:18px;overflow-y:auto">
      <div class="style-row">
        <label>Emoji 头像</label>
        <button class="reset-one" id="emojiClearBtn">清除</button>
      </div>
      <div class="emoji-grid" id="emojiGrid"></div>
      <div class="style-row" style="margin-top:14px">
        <label>头像背景</label>
        <input type="color" id="cAvatar" value="#3d521f">
        <button class="reset-one" data-target="avatar">重置</button>
      </div>
      <div class="style-row">
        <label>发言框背景</label>
        <input type="color" id="cBubble" value="#7a9c3c">
        <button class="reset-one" data-target="bubble">重置</button>
      </div>
      <div class="style-row">
        <label>文字颜色</label>
        <input type="color" id="cText" value="#ffffff">
        <button class="reset-one" data-target="text">重置</button>
      </div>
      <div class="style-preview">
        <div class="pv-label">预览</div>
        <div class="msg self">
          <div class="avatar" id="pvAvatar" style="background:#3d521f">我</div>
          <div class="body">
            <div class="head"><span class="nick">我</span><span class="time">刚刚</span></div>
            <div class="content" id="pvBubble" style="background:#7a9c3c;color:#ffffff">这是一条示例消息</div>
          </div>
        </div>
      </div>
    </div>
    <div class="style-foot">
      <button class="reset-all" id="styleResetAll">全部重置</button>
      <span class="sp"></span>
      <button class="cancel" id="styleCancel">取消</button>
      <button class="save" id="styleSave">保存</button>
    </div>
  </div>
</div>

<div class="ov" id="onlineOv">
  <div class="pnl">
    <div class="ph"><strong>在线成员</strong><span class="sp"></span><button class="icon" id="onlineClose">✕</button></div>
    <div class="online-body">
      <div class="online-list" id="onlineList"></div>
    </div>
  </div>
</div>

<div class="ov" id="userCardOv">
  <div class="pnl" style="max-width:360px">
    <div class="ph"><strong>用户信息</strong><span class="sp"></span><button class="icon" id="userCardClose">✕</button></div>
    <div class="user-card-body">
      <div class="uc-avatar" id="ucAvatar"></div>
      <div class="uc-nick" id="ucNick"></div>
      <div class="uc-meta" id="ucMeta"></div>
      <div class="uc-stat">
        <div><strong id="ucMsgCount">0</strong><span>消息</span></div>
        <div><strong id="ucJoinTime">-</strong><span>首次出现</span></div>
      </div>
      <div class="uc-actions" id="ucActions"></div>
    </div>
  </div>
</div>

<div class="ov" id="editOv">
  <div class="pnl">
    <div class="ph"><strong>编辑消息</strong><span class="sp"></span><button class="icon" id="editClose">✕</button></div>
    <div class="edit-body">
      <textarea id="editInput" maxlength="500"></textarea>
    </div>
    <div class="edit-foot">
      <button class="cancel" id="editCancel">取消</button>
      <button class="save" id="editSave">保存</button>
    </div>
  </div>
</div>

<div class="ov" id="settingsOv">
  <div class="pnl">
    <div class="ph"><strong>界面设置</strong><span class="sp"></span><button class="icon" id="settingsClose">✕</button></div>
    <div class="settings-body">
      <div class="settings-group">
        <div class="sg-label">显示</div>
        <div class="settings-row">
          <span class="sr-label">字体大小</span>
          <div class="sr-value">
            <button class="sr-btn" data-fontsize="-1">A-</button>
            <span style="min-width:40px;text-align:center;font-family:ui-monospace,monospace;font-size:12px" id="fsDisplay">14</span>
            <button class="sr-btn" data-fontsize="+1">A+</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="sr-label">密集模式</span>
          <div class="sr-value">
            <button class="sr-btn" id="denseBtn">切换</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="sr-label">关闭动画</span>
          <div class="sr-value">
            <button class="sr-btn" id="animBtn">切换</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="sr-label">发送快捷键</span>
          <div class="sr-value">
            <button class="sr-btn" id="sendKeyBtn">Enter</button>
          </div>
        </div>
      </div>
      <div class="settings-group">
        <div class="sg-label">屏蔽用户</div>
        <div id="blockListWrap" style="font-size:12.5px;color:var(--muted);line-height:1.8">
          <div id="blockList"></div>
        </div>
      </div>
    </div>
    <div class="style-foot">
      <span class="sp"></span>
      <button class="cancel" id="settingsOk">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ★ 右键上下文菜单 -->
<div class="ctx-menu" id="ctxMenu">
  <button type="button" data-ctx="reply"><span class="ctx-ic">↩️</span><span class="ctx-tx">回复</span></button>
  <button type="button" data-ctx="react"><span class="ctx-ic">😊</span><span class="ctx-tx">表情回应</span></button>
  <button type="button" data-ctx="copy"><span class="ctx-ic">📋</span><span class="ctx-tx">复制文字</span></button>
  <div class="ctx-sep" data-ctx-sep hidden></div>
  <button type="button" data-ctx="edit" hidden><span class="ctx-ic">✏️</span><span class="ctx-tx">编辑</span></button>
  <button type="button" data-ctx="recall" class="danger" hidden><span class="ctx-ic">↺</span><span class="ctx-tx">撤回</span></button>
</div>

<div class="refresh-pill" id="refreshPill" hidden title="点击立即刷新">
  <span class="rp-icon" id="rpIcon">🔄</span>
  <span class="rp-text"><span id="cdNum">5</span> 秒后刷新</span>
</div>

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pad2(n){return n<10?'0'+n:''+n;}
function fmtTime(ts){
  var d=new Date(ts),now=Date.now(),diff=now-ts;
  if(diff<60*1000)return '刚刚';
  if(diff<60*60*1000)return Math.floor(diff/60000)+'分钟前';
  var today=new Date();
  if(d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate()){
    return pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  if(d.getFullYear()===today.getFullYear()){
    return pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function fmtFullTime(ts){
  var d=new Date(ts);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '
    +pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
}
function fmtDay(ts){
  var d=new Date(ts), now=new Date();
  var y1=d.getFullYear(), m1=d.getMonth(), day1=d.getDate();
  var y2=now.getFullYear(), m2=now.getMonth(), day2=now.getDate();
  var t=new Date(y1,m1,day1), t2=new Date(y2,m2,day2);
  var diffDays = Math.round((t2-t)/86400000);
  if(diffDays===0) return '今天';
  if(diffDays===1) return '昨天';
  if(diffDays<7) return diffDays+'天前';
  return y1+'年'+(m1+1)+'月'+day1+'日';
}
function toLocalInput(ts){
  var d = new Date(ts);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())

}

function nickColor(nick){

var audioCtx = null;
function playPing(){
  if(!soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    var t = audioCtx.currentTime;
    var o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type='sine'; o1.frequency.value = 880;
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(0.15, t+0.01);
    g1.gain.exponentialRampToValueAtTime(0.0001, t+0.16);
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.start(t); o1.stop(t+0.18);
    var o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type='sine'; o2.frequency.value = 660;
    g2.gain.setValueAtTime(0.0001, t+0.12);
    g2.gain.exponentialRampToValueAtTime(0.12, t+0.13);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+0.30);
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.start(t+0.12); o2.stop(t+0.32);
  }catch(e){}
}

/* ============================================================
   重试
   ============================================================ */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function calcDelay(attempt){
  var d = RETRY_BASE * Math.pow(RETRY_FACTOR, attempt - 1);
  return Math.min(d, RETRY_MAX_DELAY);
}
function withRetry(fn, opts){
  opts = opts || {};
  var max = opts.max || RETRY_MAX;
  var label = opts.label || '请求';
  var shouldRetry = opts.shouldRetry || function(){ return true; };
  var attempt = 0;
  function go(){
    attempt++;
    return Promise.resolve()
      .then(function(){ return fn(); })
      .then(function(res){ return { ok:true, data:res, attempts:attempt }; })
      .catch(function(err){
        if(attempt >= max || !shouldRetry(err)){ return { ok:false, err:err, attempts:attempt }; }
        var delay = calcDelay(attempt);
        if(opts.onRetry){ try{ opts.onRetry(attempt+1, max, delay, label); }catch(e){} }
        return sleep(delay).then(go);
      });
  }
  return go();
}
function sbQuery(label, queryFn, options){
  options = options || {};
  return withRetry(function(){
    return Promise.resolve().then(function(){ return queryFn(); }).then(function(res){
      if(res && res.error){
        var msg = String(res.error.message || res.error || '');
        var isNetwork = /fetch|network|timeout|abort|connection/i.test(msg);
        var e = new Error(msg); e.__isNetwork = isNetwork; e.__res = res; throw e;
      }
      return res;
    });
  }, {
    label: label,
    max: options.max,
    shouldRetry: function(err){
      return err && (err.__isNetwork || /fetch|network|timeout|abort|connection/i.test(String(err.message||'')));
    },
    onRetry: options.silent ? null : function(attempt, max, delay, label){
      showRetryOverlay(attempt, max, label);
      setPillRetry(attempt, max);
    }
  });
}

  if(r.ok) return { ok:true, mine:true };

  if(err && err.__res && err.__res.error && err.__res.error.code === '23505'){
    var q = await sbQuery('查询昵称', function(){ return sb.from('nicknames').select('uid').eq('nick', nick).maybeSingle(); });

function renderRichText(text, searchQ){
  var safe = esc(text);
  safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  safe = safe.replace(/(https?:\/\/[^\s<>"']+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  safe = safe.replace(/@([\u4e00-\u9fa5\w\-]{1,20})/g, function(m, name){ return '<span class="mention">@' + name + '</span>'; });
  if(searchQ){
    try{
      var re = new RegExp('(' + searchQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
      safe = safe.replace(re, '<mark>$1</mark>');
    }catch(e){}
  }
  return safe;
}
function isMentionedMe(text){
  if(!myNick) return false;
  var re = new RegExp('@' + myNick.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?![\\u4e00-\\u9fa5\\w\\-])');
  return re.test(text);
}

    });
  }
  if(particleRunning)drawParticles();
}
function resizeCanvas(){
  var canvas=$('particles');if(!canvas)return;
  pW=window.innerWidth;pH=window.innerHeight;
  canvas.width=pW*pDpr;canvas.height=pH*pDpr;
  canvas.style.width=pW+'px';canvas.style.height=pH+'px';
  if(particleCtx)particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}
function drawParticles(){
  if(!particleRunning||!particleCtx)return;
  particleCtx.clearRect(0,0,pW,pH);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.x<-40)p.x=pW+40;else if(p.x>pW+40)p.x=-40;
    if(p.y<-40)p.y=pH+40;else if(p.y>pH+40)p.y=-40;
    p.alphaPhase+=p.alphaSpeed;
    var a=p.alpha*(0.55+0.45*Math.sin(p.alphaPhase));
    a=Math.max(0.03,Math.min(0.4,a));
    var c1=(themeColors[p.hueIdx]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var c2=(themeColors[(p.hueIdx+1)%4]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var mix=p.hueMix;
    var r=Math.round(c1[0]*(1-mix)+c2[0]*mix);
    var g=Math.round(c1[1]*(1-mix)+c2[1]*mix);
    var b=Math.round(c1[2]*(1-mix)+c2[2]*mix);
    particleCtx.save();
    particleCtx.translate(p.x,p.y);particleCtx.rotate(p.rot);
    var s=p.size,hs=s/2,rad=Math.min(3,s/3.5);
    var grad=particleCtx.createLinearGradient(-hs,-hs,hs,hs);
    grad.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');
    grad.addColorStop(1,'rgba('+r+','+g+','+b+','+(a*0.3)+')');
    particleCtx.fillStyle=grad;
    particleCtx.beginPath();
    if(particleCtx.roundRect)particleCtx.roundRect(-hs,-hs,s,s,rad);
    else particleCtx.rect(-hs,-hs,s,s);
    particleCtx.fill();
    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

var messagesEl=$('messages'), inputEl=$('input'), sendBtn=$('sendBtn'), chatWrap=$('chatWrap');
var onlineNum=$('onlineNum'), typingBar=$('typingBar'), typingWho=$('typingWho');
var scrollBottomBtn=$('scrollBottomBtn'), unreadCountEl=$('unreadCount');

var allMessages=[], lastSendTime=0, lastTs=0;
var replyingTo=null, unreadCount=0, searchQuery='';
var mentionState={ open:false, start:-1, items:[], selected:0 };
var hasMoreHistory=false;

function autoResize(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,120)+'px'; }
function saveDraft(){ storage.set(K_DRAFT, inputEl.value); }
function restoreDraft(){
  var d=storage.get(K_DRAFT);
  if(d){ inputEl.value=d; autoResize(); sendBtn.disabled=!d.trim(); }
}
function clearDraft(){ storage.del(K_DRAFT); }

inputEl.addEventListener('input', function(){

/* @自动补全 */
function checkMention(){
  var val=inputEl.value, pos=inputEl.selectionStart;
  if(pos<1 || val[pos-1]!=='@'){ if(mentionState.open) closeMentionPop(); return; }
  var matches = onlineUsers.filter(function(u){ return u.uid!==uid && u.nick; });
  if(matches.length===0){ closeMentionPop(); return; }
  mentionState.open=true; mentionState.start=pos; mentionState.items=matches; mentionState.selected=0;
  renderMentionPop();
}
function renderMentionPop(){
  var pop=$('mentionPop'); if(!pop) return;
  var html='';
  mentionState.items.forEach(function(u,i){
    var st=styleMap[u.uid]||{};
    var ac=st.avatar||nickColor(u.nick);
    var av=st.emoji?st.emoji:esc(u.nick.charAt(0).toUpperCase());
    html+='<div class="mp-item'+(i===mentionState.selected?' selected':'')+'" data-mention-idx="'+i+'">'+
      '<div class="mp-avatar" style="background:'+ac+'">'+av+'</div>'+
      '<div>'+esc(u.nick)+'</div>'+
    '</div>';
  });
  pop.innerHTML=html; pop.hidden=false;
}
function closeMentionPop(){ mentionState.open=false; var pop=$('mentionPop'); if(pop) pop.hidden=true; }
function insertMention(nick){
  var val=inputEl.value, start=mentionState.start, pos=inputEl.selectionStart;
  var before=val.slice(0,start), after=val.slice(pos);
  inputEl.value = before + '@' + nick + ' ' + after;
  var newPos = start + nick.length + 2;
  inputEl.setSelectionRange(newPos,newPos);
  closeMentionPop(); inputEl.focus(); autoResize(); saveDraft();
}
$('mentionPop').addEventListener('click', function(e){
  var item=e.target.closest('[data-mention-idx]'); if(!item) return;
  var idx=parseInt(item.getAttribute('data-mention-idx'),10);
  var u=mentionState.items[idx]; if(u) insertMention(u.nick);
});

inputEl.addEventListener('keydown', function(e){
  if(mentionState.open){
    if(e.key==='ArrowDown'){ e.preventDefault(); mentionState.selected=(mentionState.selected+1)%mentionState.items.length; renderMentionPop(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); mentionState.selected=(mentionState.selected-1+mentionState.items.length)%mentionState.items.length; renderMentionPop(); return; }
    if(e.key==='Enter'||e.key==='Tab'){
      e.preventDefault();
      var u=mentionState.items[mentionState.selected];
      if(u) insertMention(u.nick);
      return;
    }
    if(e.key==='Escape'){ closeMentionPop(); return; }
  }
  if(e.key==='ArrowUp' && !inputEl.value.trim() && !replyingTo){
    var last=null;
    for(var i=allMessages.length-1;i>=0;i--){
      var m=allMessages[i];
      if(m.uid===uid && !m.__local && !m.recalled && !m.deleted && (Date.now()-m.ts)<EDIT_WINDOW){ last=m; break; }
    }
    if(last){ e.preventDefault(); openEditDialog(last); return; }
  }
  var isEnter = e.key==='Enter' && !e.shiftKey;
  var isCtrlEnter = e.key==='Enter' && (e.ctrlKey||e.metaKey);
  if(sendKey==='ctrl-enter'){
    if(isCtrlEnter){ e.preventDefault(); if(!sendBtn.disabled) doSend(); }
  }else{
    if(isEnter && !e.ctrlKey && !e.metaKey){ e.preventDefault(); if(!sendBtn.disabled) doSend(); }
  }
  if(e.key==='Escape' && replyingTo){ e.preventDefault(); setReply(null); }
});

function setReply(msg){
  replyingTo=msg;
  if(!msg){ $('replyHint').hidden=true; return; }
  $('replyHint').hidden=false;
  $('rhNick').textContent = msg.nick + '：';
  $('rhText').textContent = msg.text.length>60 ? msg.text.slice(0,60)+'…' : msg.text;
  try{ inputEl.focus(); }catch(e){}
}
$('rhClose').addEventListener('click', function(){ setReply(null); });

var typingBroadcastTimer=null;
function broadcastTyping(){
  if(!typingChannel) return;
  if(typingBroadcastTimer) return;
  try{ typingChannel.send({ type:'broadcast', event:'typing', payload:{ uid:uid, nick:myNick } }); }catch(e){}
  typingBroadcastTimer=setTimeout(function(){ typingBroadcastTimer=null; }, 1500);
}

async function doSend(){
  var text=inputEl.value.trim(); if(!text) return;
  var now=Date.now();
  if(now-lastSendTime < SEND_COOLDOWN){ toast('发得太快了，'+Math.ceil((SEND_COOLDOWN-(now-lastSendTime))/1000)+' 秒后再试'); return; }
  if(text.length>MSG_MAXLEN){ toast('消息太长'); return; }
  lastSendTime=now;
  var replyTo = replyingTo ? replyingTo.id : null;
  var replySnap = null;
  if(replyingTo){ replySnap = { id:replyingTo.id, nick:replyingTo.nick, text:replyingTo.text }; }
  inputEl.value=''; autoResize(); sendBtn.disabled=true; setReply(null);
  clearDraft();
  var localId='local_'+now+'_'+Math.random().toString(36).slice(2,6);
  var localMsg={ id:localId, uid:uid, nick:myNick, text:text, ts:now, reply_to:replyTo, __reply:replySnap, __local:true, __pending:true };
  allMessages.push(localMsg); renderAll(); inputEl.focus();
  var r = await sbQuery('发送消息', function(){
    return sb.from('messages').insert({ uid:uid, nick:myNick, text:text, ts:now, reply_to:replyTo });
  });
  hideRetryOverlay();
  var idx = allMessages.findIndex(function(x){ return x.id===localId; });
  if(idx<0) return;
  if(r.ok){
    allMessages[idx].__pending=false; allMessages[idx].__sent=true;
    renderAll(); resetPollCountdown(); setPillOK();
    setTimeout(function(){ doPollNow(); }, 400);
    updateActivity();
  }else{
    allMessages[idx].__pending=false; allMessages[idx].__failed=true;
    renderAll(); toast('发送失败，已重试 '+RETRY_MAX+' 次'); setPillErr();
  }
}
sendBtn.addEventListener('click', doSend);

function normalizeMsg(m){
  return {
    id:m.id, uid:String(m.uid||''), nick:String(m.nick||'无名'),
    text:String(m.text||''), ts:Number(m.ts||0),
    updated_at: m.updated_at ? Number(m.updated_at) : null,
    recalled: !!m.recalled, deleted: !!m.deleted,
    reply_to: m.reply_to || null
  };
}

function renderMsg(m, prev){
  var div=document.createElement('div');
  div.className='msg';
  if(m.uid===uid)div.classList.add('self');
  if(m.__pending)div.classList.add('pending');
  if(m.__failed)div.classList.add('failed');
  if(m.__highlight)div.classList.add('highlight');
  if(m.recalled || m.deleted)div.classList.add('recalled');
  if(isMentionedMe(m.text) && m.uid !== uid)div.classList.add('mentioned');

  if(!m.__local && prev && !prev.__local && prev.uid===m.uid && (m.ts-prev.ts)<3*60*1000){
    div.classList.add('compact');
  }
  var isCompact=div.classList.contains('compact');

  var st = getStyleFor(m) || {};
  var defaultAvatarColor = (m.uid===uid) ? 'var(--ac)' : nickColor(m.nick);
  var avatarColor = st.avatar || defaultAvatarColor;
  var avatarContent = st.emoji ? st.emoji : esc(m.nick.charAt(0).toUpperCase());

  var avatarHtml = isCompact
    ? '<div class="avatar empty"></div>'
    : '<div class="avatar" data-open-user="'+esc(m.uid)+'" style="background:'+avatarColor+'">'+avatarContent+'</div>';

  var statusTag='';
  if(m.__pending) statusTag='<span class="status-tag">发送中</span>';
  else if(m.__failed) statusTag='<span class="status-tag">发送失败</span>';

  var editedTag = m.updated_at && !m.recalled ? '<span class="edited-tag">(已编辑)</span>' : '';

  var headHtml = isCompact
    ? '<div class="head" style="visibility:hidden"><span class="nick">&nbsp;</span></div>'
    : '<div class="head"><span class="nick" data-open-user="'+esc(m.uid)+'" style="cursor:pointer">'+esc(m.nick)+'</span><span class="time" title="'+esc(fmtFullTime(m.ts))+'">'+esc(fmtTime(m.ts))+'</span>'+editedTag+statusTag+'</div>';

  var replyHtml='';
  var quoted=null;
  if(m.recalled){ /* 撤回不显示引用 */ }
  else if(m.__reply){ quoted=m.__reply; }
  else if(m.reply_to){
    var q = allMessages.find(function(x){ return !x.__local && String(x.id)===String(m.reply_to); });
    if(q) quoted={ id:q.id, nick:q.nick, text:(q.recalled||q.deleted)?'[已撤回]':q.text };
  }
  if(quoted){
    var quoteText = quoted.text.length>50 ? quoted.text.slice(0,50)+'…' : quoted.text;
    replyHtml = '<div class="reply-quote" data-goto="'+esc(quoted.id)+'">'+
      '<span class="rq-nick">'+esc(quoted.nick)+'</span>'+esc(quoteText)+
    '</div>';
  }

  var bodyText = m.recalled ? (m.uid===uid?'你撤回了这条消息':(esc(m.nick)+' 撤回了一条消息'))
                : (m.deleted ? '这条消息已被删除' : m.text);
  var bodyHtml = (m.recalled||m.deleted) ? bodyText : renderRichText(bodyText, searchQuery);

  var bubbleStyle='';
  if(!m.recalled && !m.deleted && (st.bubble || st.text)){
    if(m.uid===uid && st.bubble) bubbleStyle += 'background:'+st.bubble+';';
    if(st.text) bubbleStyle += 'color:'+st.text+';';
  }

  var groups = groupReactions(m.id);
  var reactionsHtml='';
  var keys = Object.keys(groups);
  if(keys.length>0){
    reactionsHtml='<div class="reactions">';
    keys.forEach(function(emoji){
      var g=groups[emoji];
      reactionsHtml += '<span class="react'+(g.mine?' mine':'')+'" data-react-emoji="'+esc(emoji)+'" data-react-msg="'+esc(m.id)+'">'+emoji+' '+g.count+'</span>';
    });
    reactionsHtml+='</div>';
  }

  div.innerHTML = avatarHtml+
    '<div class="body">'+ replyHtml + headHtml +
      '<div class="content" '+(bubbleStyle?'style="'+bubbleStyle+'"':'')+'>'+bodyHtml+'</div>'+
      reactionsHtml +
    '</div>';

  if(m.id) div.setAttribute('data-mid', m.id);
  return div;
}

function isAtBottom(){ return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100; }

function renderAll(){
  var atBottom=isAtBottom();
  var list = allMessages.filter(function(m){
    if(blockedUids[m.uid] && m.uid!==uid) return false;
    if(searchQuery){
      if(m.recalled || m.deleted) return false;
      if(m.text.toLowerCase().indexOf(searchQuery.toLowerCase())===-1) return false;
    }
    return true;
  });

  if(list.length===0){
    messagesEl.innerHTML='<div class="empty-state">'+
      '<div class="ic">'+(searchQuery?'🔍':'💬')+'</div>'+
      '<div class="t">'+(searchQuery?'没有匹配的消息':'还没有人说话')+'</div>'+
      '<div class="s">'+(searchQuery?'换个关键词试试':'发第一条消息打个招呼吧')+'</div>'+
    '</div>';
    return;
  }

  var frag=document.createDocumentFragment();
  if(hasMoreHistory){
    var lm=document.createElement('div');
    lm.className='load-more-hint';
    lm.innerHTML='<button type="button" class="btn-mini" id="loadMoreBtn">↑ 加载更早的消息</button>';
    frag.appendChild(lm);
  }
  var prev=null, dayStamp=null;
  list.forEach(function(m){
    var d=new Date(m.ts);
    var dayKey=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
    if(dayKey!==dayStamp){
      dayStamp=dayKey;
      var dv=document.createElement('div');
      dv.className='time-divider';
      dv.innerHTML='<span class="td-txt">'+esc(fmtDay(m.ts))+'</span>';
      frag.appendChild(dv);
      prev=null;
    }
    frag.appendChild(renderMsg(m, prev));
    if(!m.__local) prev=m;
  });
  messagesEl.innerHTML='';
  messagesEl.appendChild(frag);
  if(atBottom) messagesEl.scrollTop=messagesEl.scrollHeight;

  var lmBtn=$('loadMoreBtn');
  if(lmBtn) lmBtn.addEventListener('click', loadMoreHistory);
}

function updateLastTs(){
  for(var i=allMessages.length-1;i>=0;i--){
    var m=allMessages[i];
    if(!m.__local && typeof m.ts==='number' && m.ts>0){ lastTs=m.ts; return; }
  }
  lastTs=0;
}
function collectUids(list){
  var seen={},out=[];
  (list||[]).forEach(function(m){ if(m.uid && !seen[m.uid]){ seen[m.uid]=1; out.push(m.uid); } });
  return out;
}
function collectMsgIds(list){
  var seen={},out=[];
  (list||[]).forEach(function(m){ if(m.id && !seen[m.id]){ seen[m.id]=1; out.push(m.id); } });
  return out;
}

function mergeNewMessages(newOnes){
  if(!newOnes || newOnes.length===0) return false;
  var changed=false, needStyles=false;
  newOnes.forEach(function(n){
    if(allMessages.some(function(x){ return !x.__local && String(x.id)===String(n.id); })) return;
    var localIdx = allMessages.findIndex(function(x){
      return x.__local && !x.__failed &&
        x.uid===n.uid && x.nick===n.nick && x.text===n.text &&
        Math.abs(x.ts-n.ts)<5000;
    });
    if(localIdx>=0){
      var old=allMessages[localIdx];
      n.__reply=old.__reply;
      allMessages[localIdx]=n;
    }else{
      allMessages.push(n);
      if(!styleMap[n.uid]) needStyles=true;
      if(n.uid!==uid){
        if(!document.hidden && !blockedUids[n.uid]) playPing();
        if(!isAtBottom()){ unreadCount++; updateUnreadBadge(); }
      }
    }
    changed=true;
  });
  if(!changed) return false;
  allMessages.sort(function(a,b){
    var aL=a.__local?1:0, bL=b.__local?1:0;
    if(aL!==bL) return aL-bL;
    return a.ts-b.ts;
  });
  if(allMessages.length>MSG_LIMIT) allMessages=allMessages.slice(-MSG_LIMIT);
  if(needStyles){ loadStylesFor(collectUids(allMessages)).then(function(){ renderAll(); }); }
  renderAll(); updateLastTs();
  return true;
}

function updateUnreadBadge(){
  if(unreadCount>0 && !isAtBottom()){
    scrollBottomBtn.classList.add('show');
    unreadCountEl.textContent = unreadCount>99 ? '99+' : unreadCount;
  }else{
    scrollBottomBtn.classList.remove('show');
  }
}

async function loadMoreHistory(){
  var oldestTs=null;
  for(var i=0;i<allMessages.length;i++){
    if(!allMessages[i].__local && typeof allMessages[i].ts==='number'){ oldestTs=allMessages[i].ts; break; }
  }
  if(!oldestTs){ toast('没有更早的消息了'); return; }
  var r = await sbQuery('加载更早', function(){
    return sb.from('messages').select('*').lt('ts', oldestTs).order('ts', { ascending:false }).limit(50);
  }, { max:2, silent:true });
  if(!r.ok){ toast('加载失败'); return; }
  var data = r.data && r.data.data;
  if(!Array.isArray(data) || data.length===0){
    hasMoreHistory=false; toast('没有更早的消息了'); renderAll(); return;
  }
  data.reverse();
  var more = data.map(normalizeMsg);
  var seen={};
  allMessages.forEach(function(m){ if(!m.__local) seen[m.id]=1; });
  more.forEach(function(m){ if(!seen[m.id]){ allMessages.unshift(m); seen[m.id]=1; } });
  hasMoreHistory = data.length>=50;
  await loadStylesFor(collectUids(more));
  await loadReactionsFor(collectMsgIds(more));
  var oldTop=messagesEl.scrollTop, oldHeight=messagesEl.scrollHeight;
  renderAll();
  var newHeight=messagesEl.scrollHeight;
  messagesEl.scrollTop = oldTop + (newHeight - oldHeight);
}

async function loadHistory(){
  var r = await sbQuery('加载历史', function(){
    return sb.from('messages').select('*').order('ts', { ascending:false }).limit(MSG_LIMIT);
  });
  if(!r.ok){ setPillErr(); setTimeout(loadHistory, 5000); return; }
  hideRetryOverlay(); setPillOK();
  var data = r.data && r.data.data;
  if(!Array.isArray(data)) return;
  var localPending = allMessages.filter(function(x){ return x.__local; });
  var arr = data.map(normalizeMsg); arr.reverse();
  localPending.forEach(function(lp){
    if(!arr.some(function(x){ return x.uid===lp.uid && x.text===lp.text && Math.abs(x.ts-lp.ts)<5000; })){
      arr.push(lp);
    }
  });
  allMessages=arr;
  hasMoreHistory = data.length>=MSG_LIMIT;
  updateLastTs();
  await loadStylesFor(collectUids(allMessages));
  await loadReactionsFor(collectMsgIds(allMessages));
  renderAll(); updateUnreadBadge();
}

async function pollNewMessages(){
  var q = sb.from('messages').select('*');
  if(lastTs>0) q = q.gt('ts', lastTs).order('ts', { ascending:true }).limit(MSG_LIMIT);
  else q = q.order('ts', { ascending:false }).limit(MSG_LIMIT);
  var r = await sbQuery('轮询消息', function(){ return q; });
  if(!r.ok){ setPillErr(); return; }
  hideRetryOverlay(); setPillOK();
  var data = r.data && r.data.data;
  if(!Array.isArray(data)) return;
  if(lastTs===0) data.reverse();
  var newOnes = data.map(normalizeMsg);
  mergeNewMessages(newOnes);
}

function subscribeMessages(){
  if(msgChannel) return;
  msgChannel = sb.channel('chat-messages')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, function(payload){
      var m=payload.new; if(!m) return;
      mergeNewMessages([normalizeMsg(m)]);
    })
