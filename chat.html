/* ============================================================
   ★ 右键上下文菜单
   ============================================================ */
var ctxMenu = $('ctxMenu');
var ctxTargetMsg = null;

function openCtxMenu(x, y, msg){
  if(!ctxMenu || !msg) return;
  ctxTargetMsg = msg;

  /* 权限判断 */
  var canEdit   = !msg.__local && msg.uid===uid && (Date.now()-msg.ts) < EDIT_WINDOW;
  var canRecall = !msg.__local && msg.uid===uid && (Date.now()-msg.ts) < RECALL_WINDOW;

  /* 编辑 / 撤回 按钮 + 分隔线显隐 */
  var editBtn   = ctxMenu.querySelector('[data-ctx="edit"]');
  var recallBtn = ctxMenu.querySelector('[data-ctx="recall"]');
  var sep       = ctxMenu.querySelector('[data-ctx-sep]');
  if(editBtn)   editBtn.hidden   = !canEdit;
  if(recallBtn) recallBtn.hidden = !canRecall;
  if(sep)       sep.hidden       = !(canEdit || canRecall);

  /* 先 display 再量尺寸 */
  ctxMenu.classList.add('show');
  var w = ctxMenu.offsetWidth  || 160;
  var h = ctxMenu.offsetHeight || 200;

  /* 边界翻转 */
  var left = x, top = y;
  if(left + w > window.innerWidth  - 8) left = Math.max(8, window.innerWidth  - w - 8);
  if(top  + h > window.innerHeight - 8) top  = Math.max(8, y - h);
  if(left < 8) left = 8;
  if(top  < 8) top  = 8;

  ctxMenu.style.left = left + 'px';
  ctxMenu.style.top  = top  + 'px';
}
function closeCtxMenu(){
  if(!ctxMenu) return;
  ctxMenu.classList.remove('show');
  ctxTargetMsg = null;
}

/* 菜单项点击 */
ctxMenu.addEventListener('click', function(e){
  var btn = e.target.closest('[data-ctx]');
  if(!btn || !ctxTargetMsg) return;
  var action = btn.getAttribute('data-ctx');
  var target = ctxTargetMsg;

  if(action === 'reply'){
    closeCtxMenu();
    setReply(target);
    return;
  }
  if(action === 'edit'){
    closeCtxMenu();
    openEditDialog(target);
    return;
  }
  if(action === 'copy'){
    closeCtxMenu();
    try{ navigator.clipboard.writeText(target.text); toast('已复制'); }
    catch(err){ toast('复制失败'); }
    return;
  }
  if(action === 'recall'){
    closeCtxMenu();
    if(!confirm('撤回这条消息？')) return;
    sbQuery('撤回', function(){ return sb.from('messages').update({ recalled:true }).eq('id', target.id).eq('uid', uid); }, { max:2, silent:true }).then(function(r){
      if(r.ok){ target.recalled=true; renderAll(); toast('已撤回'); }
      else toast('撤回失败');
    });
    return;
  }
  if(action === 'react'){
    /* 表情弹窗锚定在菜单按钮位置 */
    var rect = btn.getBoundingClientRect();
    closeCtxMenu();
    showEmojiPopAt(rect.left, rect.bottom, target.id);
    return;
  }
});

/* 触屏：长按 500ms 触发 */
var longPressTimer = null, longPressStart = null, longPressMsg = null;
messagesEl.addEventListener('touchstart', function(e){
  if(e.touches.length !== 1) return;
  var msgEl = e.target.closest('.msg');
  if(!msgEl) return;
  var msgId = msgEl.getAttribute('data-mid');
  if(!msgId) return;
  var target = allMessages.find(function(x){ return String(x.id)===String(msgId); });
  if(!target || target.__local || target.recalled || target.deleted) return;
  var touch = e.touches[0];
  longPressStart = { x: touch.clientX, y: touch.clientY };
  longPressMsg = target;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(function(){
    longPressTimer = null;
    if(!longPressMsg) return;
    if(navigator.vibrate){ try{ navigator.vibrate(20); }catch(e){} }
    openCtxMenu(longPressStart.x, longPressStart.y, longPressMsg);
    longPressStart = null;
    longPressMsg = null;
  }, LONG_PRESS_MS);
}, { passive: true });

messagesEl.addEventListener('touchmove', function(e){
  if(!longPressTimer || !longPressStart) return;
  var touch = e.touches[0];
  if(Math.abs(touch.clientX - longPressStart.x) > 10 || Math.abs(touch.clientY - longPressStart.y) > 10){
    clearTimeout(longPressTimer);
    longPressTimer = null;
    longPressStart = null;
    longPressMsg = null;
  }
}, { passive: true });

function cancelLongPress(){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; }
  longPressStart = null;
  longPressMsg = null;
}
messagesEl.addEventListener('touchend', cancelLongPress);
messagesEl.addEventListener('touchcancel', cancelLongPress);

async function jumpToTime(targetTs){
  var r = await sbQuery('跳转查询', function(){
    return sb.from('messages').select('*').lte('ts', targetTs).order('ts', { ascending:false }).limit(100);
  }, { max:2, silent:true });
  if(!r.ok){ toast('跳转失败'); return; }
  var data = r.data && r.data.data;
  if(!data || data.length===0){
    var r2 = await sbQuery('往后查询', function(){
      return sb.from('messages').select('*').gt('ts', targetTs).order('ts', { ascending:true }).limit(100);
    }, { max:2, silent:true });
    if(!r2.ok || !r2.data || !r2.data.data || r2.data.data.length===0){ toast('该时间附近没有消息'); return; }
    data = r2.data.data.slice().reverse();
  }
  var arr = data.map(normalizeMsg).reverse();
  var bestIdx=0, bestDist=Infinity;
  arr.forEach(function(m,i){ var d=Math.abs(m.ts-targetTs); if(d<bestDist){ bestDist=d; bestIdx=i; } });
  arr.forEach(function(m){ m.__highlight=false; });
  if(arr[bestIdx]) arr[bestIdx].__highlight=true;
  allMessages=arr;
  updateLastTs(); hasMoreHistory=true;
  await loadStylesFor(collectUids(allMessages));
  await loadReactionsFor(collectMsgIds(allMessages));
  renderAll();
  setTimeout(function(){
    var target=arr[bestIdx]; if(!target) return;
    var el=messagesEl.querySelector('[data-mid="'+target.id+'"]');
    if(el){
      var elRect=el.getBoundingClientRect(), wrapRect=messagesEl.getBoundingClientRect();
      var offsetInWrap = elRect.top - wrapRect.top + messagesEl.scrollTop;
      messagesEl.scrollTop = offsetInWrap - (wrapRect.height - elRect.height)/2;
      setTimeout(function(){ el.classList.remove('highlight'); }, 2500);
    }
  }, 100);
  toast('已跳到 '+fmtTime(targetTs)+' 附近');
}

function getThemeDefaultColors(){
  var cs=getComputedStyle(document.documentElement);
  function pick(n){ return cs.getPropertyValue(n).trim() || '#3d521f'; }
  var ac=pick('--ac'), selfFg=pick('--self-fg');
  var bubbleBg=ac;
  if(bubbleBg.indexOf('linear-gradient')!==-1) bubbleBg='#3d521f';
  if(bubbleBg[0]!=='#') bubbleBg='#3d521f';
  if(!/^#[0-9a-fA-F]{6}$/.test(bubbleBg)) bubbleBg='#3d521f';
  var avatar=ac;
  if(avatar[0]!=='#') avatar='#3d521f';
  if(!/^#[0-9a-fA-F]{6}$/.test(avatar)) avatar='#3d521f';
  var text=selfFg;
  if(text[0]!=='#') text='#ffffff';

  var ok=await saveMyStyle();
  $('styleSave').disabled=false;
  closeStyleDialog();
  toast(ok ? '已保存' : '已应用到本地，服务器同步失败');
});

}

/* ============================================================
   设置
   ============================================================ */
var settingsOv=$('settingsOv');
function openSettings(){
  $('fsDisplay').textContent=chatFontSize;
  $('denseBtn').classList.toggle('active', denseMode);
  $('animBtn').classList.toggle('active', noAnim);
  $('sendKeyBtn').textContent = sendKey==='ctrl-enter' ? 'Ctrl+Enter' : 'Enter';
  renderBlockList();
  settingsOv.classList.add('show');
}
function closeSettings(){ settingsOv.classList.remove('show'); }
function renderBlockList(){
  var el=$('blockList'); if(!el) return;
  var list=Object.keys(blockedUids);
  if(list.length===0){ el.innerHTML='<span style="opacity:.6">没有屏蔽任何人</span>'; return; }
  var html='';
  list.forEach(function(blockUid){
    var u=onlineUsers.find(function(x){ return x.uid===blockUid; });
    var nick = u ? u.nick : '未知';
    html+='<div style="display:flex;align-items:center;gap:8px;padding:3px 0">'+
      '<span style="flex:1">'+esc(nick)+'</span>'+
      '<button class="sr-btn" data-unblock="'+esc(blockUid)+'">取消</button>'+
    '</div>';
  });
  el.innerHTML=html;
}
$('settingsBtn').addEventListener('click', openSettings);
$('settingsClose').addEventListener('click', closeSettings);
$('settingsOk').addEventListener('click', closeSettings);
settingsOv.addEventListener('click', function(e){ if(e.target===settingsOv) closeSettings(); });
$('settingsOv').addEventListener('click', function(e){
  var fs=e.target.closest('[data-fontsize]');
  if(fs){
    var delta=parseInt(fs.getAttribute('data-fontsize'),10);
    chatFontSize = Math.max(12, Math.min(22, chatFontSize+delta));
    document.documentElement.style.setProperty('--chat-fs', chatFontSize+'px');
    storage.set(K_FS, String(chatFontSize));
    $('fsDisplay').textContent=chatFontSize;
    return;
  }
  if(e.target.closest('#denseBtn')){
    denseMode=!denseMode;
    document.documentElement.classList.toggle('dense', denseMode);
    storage.set(K_DENSE, denseMode?'1':'0');
    $('denseBtn').classList.toggle('active', denseMode);
    return;
  }
  if(e.target.closest('#animBtn')){
    noAnim=!noAnim;
    document.documentElement.classList.toggle('noanim', noAnim);
    storage.set(K_NOANIM, noAnim?'1':'0');
    $('animBtn').classList.toggle('active', noAnim);
    return;
  }
  if(e.target.closest('#sendKeyBtn')){
    sendKey = sendKey==='enter' ? 'ctrl-enter' : 'enter';
    storage.set(K_SENDKEY, sendKey);
    $('sendKeyBtn').textContent = sendKey==='ctrl-enter' ? 'Ctrl+Enter' : 'Enter';
    return;
  }
  var ub=e.target.closest('[data-unblock]');
  if(ub){
    delete blockedUids[ub.getAttribute('data-unblock')];
    saveBlocked(); renderBlockList(); renderAll();
    return;
  }
});

/* ============================================================
   修改昵称
   ============================================================ */
var nickOv=$('nickOv'),nickInput=$('nickInput'),nickHint=$('nickHint');
var nickQuotaLeftEl=$('nickQuotaLeft');
async function openNickDialog(){
  nickInput.value=myNick;
  nickHint.innerHTML='改名后旧昵称会被释放，别人可以用了。<br><span class="quota">今日还可改 <span id="nickQuotaLeft">?</span> / 5 次</span>';
  nickQuotaLeftEl=$('nickQuotaLeft');
  nickOv.classList.add('show');
  setTimeout(function(){try{nickInput.focus();nickInput.select();}catch(e){}},40);
  var q = await getNickChangeQuota();
  if(nickQuotaLeftEl) nickQuotaLeftEl.textContent = q.ok ? q.left : '?';
  if(q.ok && q.left<=0){
    $('nickSave').disabled=true;
    nickHint.innerHTML='今天已经改了 5 次了。<br><span class="quota">0 / 5</span>';
  }else{
    $('nickSave').disabled=false;
  }
}
function closeNickDialog(){ nickOv.classList.remove('show'); }
$('nickBtn').addEventListener('click',openNickDialog);
$('nickClose').addEventListener('click',closeNickDialog);
$('nickCancel').addEventListener('click',closeNickDialog);
$('nickSave').addEventListener('click', async function(){
  var v=nickInput.value.trim();
  if(!v){ nickHint.textContent='昵称不能为空'; nickHint.className='hint err'; return; }
  if(v.length>20){ nickHint.textContent='最多 20 字'; nickHint.className='hint err'; return; }
  if(v===myNick){ closeNickDialog(); return; }
  $('nickSave').disabled=true;
  nickHint.textContent='检查中…'; nickHint.className='hint';
  var quota = await getNickChangeQuota();
  if(!quota.ok){ nickHint.textContent='网络异常'; nickHint.className='hint err'; $('nickSave').disabled=false; return; }
  if(quota.left<=0){ nickHint.innerHTML='今天已经改了 5 次了。<br><span class="quota">0 / 5</span>'; $('nickSave').disabled=false; return; }
  var r = await claimNick(v);
  hideRetryOverlay();
  if(!r.ok){
    if(r.reason==='taken'){ nickHint.textContent='这个名字被占用了'; nickHint.className='hint err'; }
    else { nickHint.textContent='网络异常'; nickHint.className='hint err'; }
    $('nickSave').disabled=false; return;
  }
  var oldNick=myNick;
  myNick=v;
  storage.set(K_NICK, myNick);
  $('meNick').textContent=myNick;
  await logNickChange();
  await releaseNick(oldNick);
  await syncMyMessagesNick(myNick);
  try{ if(presenceChannel) await presenceChannel.track({nick:myNick, joinedAt:Date.now()}); }catch(e){}
  closeNickDialog();
  toast('昵称已改为「'+myNick+'」（还剩 '+(quota.left-1)+' 次）');
});
nickInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();$('nickSave').click();} });

themeBtn.addEventListener('click',openTheme);
themeClose.addEventListener('click',closeTheme);
themeOv.addEventListener('click',function(e){if(e.target===themeOv)closeTheme();});
themeGrid.addEventListener('click',function(e){

$('onlineBadge').addEventListener('click', openOnlineDialog);
$('onlineClose').addEventListener('click', closeOnlineDialog);
$('onlineOv').addEventListener('click', function(e){ if(e.target===$('onlineOv')) closeOnlineDialog(); });

document.addEventListener('keydown',function(e){

    if(ctxMenu.classList.contains('show'))closeCtxMenu();

window.addEventListener('resize',resizeCanvas,{passive:true});
document.addEventListener('visibilitychange',function(){

    drawParticles();
    if(!chatWrap.hidden){ doPollNow(); resetPollCountdown(); updateActivity(); }

/* ============================================================
   右下角
   ============================================================ */
var refreshPill=$('refreshPill'), cdNum=$('cdNum'), rpIcon=$('rpIcon');
var pollCountdown=POLL_INTERVAL, countdownTimer=null, pillState='ok';

function setPillRetry(attempt, max){
  pillState='retry';
  if(refreshPill){
    refreshPill.classList.remove('err','loading');
    refreshPill.classList.add('retry');
    var txt=refreshPill.querySelector('.rp-text');
    if(txt) txt.innerHTML='<span id="cdNum">'+attempt+'</span>/'+max+' 重试中';
    cdNum=$('cdNum');
  }
  if(rpIcon) rpIcon.textContent='⏳';
}
function setPillOK(){
  pillState='ok';
  if(refreshPill) refreshPill.classList.remove('err','retry');
  if(rpIcon) rpIcon.textContent='🔄';
  var txt=refreshPill && refreshPill.querySelector('.rp-text');
  if(txt) txt.innerHTML='<span id="cdNum">'+pollCountdown+'</span> 秒后刷新';
  cdNum=$('cdNum');
}
function setPillErr(){
  pillState='err';
  if(refreshPill){ refreshPill.classList.remove('retry','loading'); refreshPill.classList.add('err'); }
  if(rpIcon) rpIcon.textContent='⚠';
  var txt=refreshPill && refreshPill.querySelector('.rp-text');
  if(txt) txt.innerHTML='连接失败';
}
function updateCdDisplay(){ if(pillState!=='ok') return; if(cdNum) cdNum.textContent=pollCountdown; }
function setRpErr(){}
function clearRpErr(){ setPillOK(); }
function resetPollCountdown(){ pollCountdown=POLL_INTERVAL; updateCdDisplay(); }
function doPollNow(){
  if(refreshPill) refreshPill.classList.add('loading');
  if(rpIcon) rpIcon.textContent='🔄';
  pollNewMessages().then(function(){
    setTimeout(function(){
      if(refreshPill) refreshPill.classList.remove('loading');
      if(pillState==='ok' && rpIcon) rpIcon.textContent='🔄';
    }, 400);
  });
}
function startPolling(){
  stopPolling(); resetPollCountdown();
  if(refreshPill) refreshPill.hidden=false;
  countdownTimer=setInterval(function(){
    if(document.hidden) return;
    if(pillState!=='ok') return;
    pollCountdown--;
    if(pollCountdown<=0){
      if(refreshPill){
        refreshPill.classList.add('tick');
        setTimeout(function(){ refreshPill.classList.remove('tick'); }, 400);
      }
      doPollNow(); pollCountdown=POLL_INTERVAL;
    }
    updateCdDisplay();
  }, 1000);
}
function stopPolling(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }
if(refreshPill){
  refreshPill.addEventListener('click', function(){
    if(refreshPill.classList.contains('loading')) return;
    doPollNow(); resetPollCountdown();
  });
}

setInterval(function(){
  if(allMessages.length===0)return;
  var real=allMessages.filter(function(m){ return !m.__local; });
  var els=messagesEl.querySelectorAll('.msg .time');
  var i=0;
  real.forEach(function(m){ var t=els[i]; if(t) t.textContent=fmtTime(m.ts); i++; });
},30000);

/* ============================================================
   启动
   ============================================================ */
applyTheme(curTheme);
initParticles();
autoResize();
updateLoginBtn();
updateSoundIcon();

(async function autoLogin(){
  var saved=storage.get(K_NICK);
  if(!saved) return;
  loginNick.value=saved;
  updateLoginBtn();
  setLoginStatus('正在恢复上次的昵称…', 'busy');
  autoClean();
  var r = await claimNick(saved);
  hideRetryOverlay();
  if(r.ok){ myNick=saved; setLoginStatus('✓ 欢迎回来','ok'); startChat(); }
  else if(r.reason==='taken'){ setLoginStatus('上次用的名字现在被占了，换一个吧','err'); storage.del(K_NICK); }
  else setLoginStatus('网络异常，可重试','err');
})();

})();
