<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天室 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<script>
(function(){
  try{
    var t=localStorage.getItem('wiki-theme');
    var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
    if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<style>
:root,[data-theme="mc-wiki"]{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.13);--blob2:rgba(106,140,60,.09);--blob3:rgba(180,150,80,.07);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --topbar-bg:linear-gradient(180deg,#56682c,#3d521f);
  --topbar-fg:#fff;--topbar-bd:#2a3a1a;
  --self-bg:linear-gradient(135deg,#7a9c3c,#3d521f);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="mc-night"]{
  --bg:#1a1a1a;--bg2:#242424;--bg3:#303030;--text:#e0e0e0;--muted:#909090;
  --bd:#505050;--bd2:#6a6a6a;--ac:#8ec44a;--acs:#2a3a1a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(142,196,74,.10);--blob2:rgba(90,140,60,.07);--blob3:rgba(120,90,40,.07);
  --grid:rgba(255,255,255,.025);
  --p1:142,196,74;--p2:90,140,60;--p3:200,180,100;--p4:120,90,40;
  --topbar-bg:linear-gradient(180deg,#2a3a1a,#1a2a0a);
  --topbar-fg:#e8ffd0;--topbar-bd:#0a1a00;
  --self-bg:linear-gradient(135deg,#8ec44a,#3d521f);--self-fg:#e8ffd0;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="mc-nether"]{
  --bg:#1a0a0a;--bg2:#2a1212;--bg3:#3a1a1a;--text:#f0d0d0;--muted:#a08080;
  --bd:#6a3030;--bd2:#8a4040;--ac:#ff6030;--acs:#3a1a10;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#f85050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(255,96,48,.12);--blob2:rgba(200,60,30,.09);--blob3:rgba(255,150,80,.07);
  --grid:rgba(255,150,100,.03);
  --p1:255,96,48;--p2:200,60,30;--p3:255,150,80;--p4:120,40,20;
  --topbar-bg:linear-gradient(180deg,#3a1212,#1a0a0a);
  --topbar-fg:#ffe0d0;--topbar-bd:#0a0500;
  --self-bg:linear-gradient(135deg,#ff6030,#8a2010);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="mc-end"]{
  --bg:#0f0a1a;--bg2:#1a1230;--bg3:#251a40;--text:#e0d0f0;--muted:#9080a0;
  --bd:#4a3a6a;--bd2:#6a5a8a;--ac:#a060ff;--acs:#2a1a3a;
  --ok:#5ab05a;--warn:#d4a72c;--dgr:#e05050;
  --sh:2px 2px 0 rgba(0,0,0,.5);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,255,255,.06);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(160,96,255,.12);--blob2:rgba(120,60,200,.08);--blob3:rgba(200,150,255,.06);
  --grid:rgba(200,150,255,.025);
  --p1:160,96,255;--p2:120,60,200;--p3:200,150,255;--p4:80,40,120;
  --topbar-bg:linear-gradient(180deg,#2a1a3a,#0f0a1a);
  --topbar-fg:#e0d0ff;--topbar-bd:#0a0510;
  --self-bg:linear-gradient(135deg,#a060ff,#4a2080);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="sakura"]{
  --bg:#fffafc;--bg2:#fff0f5;--bg3:#ffe0ea;--text:#2a1a20;--muted:#806070;
  --bd:#e0b0c0;--bd2:#a06080;--ac:#d04080;--acs:#ffe0ea;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --sh:2px 2px 0 rgba(160,80,120,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(160,80,120,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(208,64,128,.12);--blob2:rgba(240,120,160,.08);--blob3:rgba(255,180,200,.06);
  --grid:rgba(208,64,128,.04);
  --p1:208,64,128;--p2:240,120,160;--p3:255,180,200;--p4:160,80,120;
  --topbar-bg:linear-gradient(180deg,#d06090,#a04070);
  --topbar-fg:#fff;--topbar-bd:#802050;
  --self-bg:linear-gradient(135deg,#ff80a0,#d04080);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="ocean"]{
  --bg:#f0f8ff;--bg2:#e0f0fa;--bg3:#c8e0f0;--text:#0a1a2a;--muted:#406080;
  --bd:#a0c0d8;--bd2:#406080;--ac:#0066cc;--acs:#c8e4ff;
  --ok:#1a7f37;--warn:#b08800;--dgr:#cf222e;
  --sh:2px 2px 0 rgba(32,80,140,.2);--r:4px;
  --bevel:inset -1px -1px 0 rgba(32,80,140,.1),inset 1px 1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(0,102,204,.10);--blob2:rgba(64,160,220,.08);--blob3:rgba(120,200,240,.06);
  --grid:rgba(0,102,204,.04);
  --p1:0,102,204;--p2:64,160,220;--p3:120,200,240;--p4:32,80,140;
  --topbar-bg:linear-gradient(180deg,#2080c0,#004890);
  --topbar-fg:#fff;--topbar-bd:#002040;
  --self-bg:linear-gradient(135deg,#40a0dc,#0066cc);--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="github-light"]{
  --bg:#ffffff;--bg2:#f6f8fa;--bg3:#eef1f4;--text:#1f2328;--muted:#59636e;
  --bd:#d1d9e0;--bd2:#a0a8b0;--ac:#0969da;--acs:#ddf4ff;
  --ok:#1a7f37;--warn:#d4a72c;--dgr:#cf222e;
  --sh:0 1px 4px rgba(31,35,40,.08);--r:6px;
  --bevel:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(9,105,218,.08);--blob2:rgba(163,113,247,.06);--blob3:rgba(219,112,147,.05);
  --grid:rgba(31,35,40,.02);
  --p1:9,105,218;--p2:163,113,247;--p3:219,112,147;--p4:31,35,40;
  --topbar-bg:#ffffff;--topbar-fg:#1f2328;--topbar-bd:#d1d9e0;
  --self-bg:#0969da;--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
[data-theme="github-dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--text:#e6edf3;--muted:#9198a1;
  --bd:#30363d;--bd2:#484f58;--ac:#4493f8;--acs:#16233a;
  --ok:#3fb950;--warn:#d4a72c;--dgr:#f85149;
  --sh:0 1px 4px rgba(0,0,0,.4);--r:6px;
  --bevel:none;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(68,147,248,.06);--blob2:rgba(163,113,247,.05);--blob3:rgba(219,112,147,.04);
  --grid:rgba(230,237,243,.02);
  --p1:68,147,248;--p2:163,113,247;--p3:219,112,147;--p4:230,237,243;
  --topbar-bg:#161b22;--topbar-fg:#e6edf3;--topbar-bd:#30363d;
  --self-bg:#4493f8;--self-fg:#fff;
  --other-bg:var(--bg2);--other-fg:var(--text);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg);transition:background-color .3s}
body{
  margin:0;padding-top:46px;
  background:transparent;color:var(--text);font-family:var(--font);
  font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow:hidden;transition:background-color .3s,color .3s;
}

.offline-mask{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s;pointer-events:none}
.offline-mask.show{opacity:1;visibility:visible;pointer-events:auto}
.offline-card{max-width:340px;margin:20px;padding:24px 22px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel), 0 12px 32px rgba(0,0,0,.3);text-align:center}
[data-theme^="mc-"] .offline-card{box-shadow:3px 3px 0 rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.3)}
.offline-card .ic{font-size:44px;line-height:1;margin-bottom:10px;display:block;animation:offPulse 2s ease-in-out infinite}
@keyframes offPulse{0%,100%{opacity:1}50%{opacity:.4}}
.offline-card h2{margin:0 0 8px;font-size:1.15rem;font-weight:800}
.offline-card p{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.6}
.offline-card .cnt{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ac);font-weight:700}
.offline-card .spin{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spinIcon .8s linear infinite}

.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:1px solid var(--topbar-bd);z-index:50;transition:background .3s,color .3s}
[data-theme^="mc-"] .topbar{border-bottom-width:2px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--topbar-fg);text-decoration:none;white-space:nowrap;cursor:pointer}
[data-theme^="mc-"] .logo{text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.logo-icon{display:inline-block;font-size:16px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.sp{flex:1}
.chat-info{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--topbar-fg);opacity:.85}
.chat-info .online{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:999px;font-variant-numeric:tabular-nums}
[data-theme="github-light"] .chat-info .online{background:rgba(0,0,0,.06)}
.chat-info .online .live-dot{width:6px;height:6px;background:#4ade80;border-radius:50%;box-shadow:0 0 6px rgba(74,222,128,.7);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-info .me-nick{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:999px;font-size:12px}
[data-theme="github-light"] .chat-info .me-nick{background:rgba(0,0,0,.06)}
.icon{display:grid;place-items:center;width:30px;height:30px;flex:none;font-size:14px;font-family:inherit;color:var(--muted);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s,transform .2s}
.icon:hover{background:var(--bg3);color:var(--text)}
[data-theme^="mc-"] .icon,[data-theme="sakura"] .icon,[data-theme="ocean"] .icon{color:rgba(255,255,255,.85)}
[data-theme^="mc-"] .icon:hover,[data-theme="sakura"] .icon:hover,[data-theme="ocean"] .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50%,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.6}

.login-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;height:calc(100vh - 46px);padding:20px}
.login-card{width:100%;max-width:420px;padding:32px 28px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel),0 12px 32px rgba(0,0,0,.12);text-align:center;animation:heroIn .5s cubic-bezier(.22,1,.36,1) both}
@keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
[data-theme^="mc-"] .login-card{box-shadow:3px 3px 0 rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.12)}
.login-card .ic{font-size:52px;line-height:1;margin-bottom:8px;display:block}
.login-card h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.login-card .sub{font-size:13px;color:var(--muted);margin:0 0 24px;line-height:1.6}
.login-card .field{text-align:left;margin-bottom:16px}
.login-card .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.login-card input{width:100%;height:44px;padding:0 14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none;transition:border-color .2s,box-shadow .2s}
.login-card input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.login-card .status{min-height:20px;font-size:12px;margin:6px 0 14px;color:var(--muted)}
.login-card .status.err{color:var(--dgr);font-weight:600}
.login-card .status.ok{color:var(--ok);font-weight:600}
.login-card .status.busy{color:var(--ac);font-weight:600}
.login-card .btn-main{width:100%;height:44px;font-size:15px;font-weight:700;font-family:inherit;color:var(--self-fg);background:var(--self-bg);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
.login-card .btn-main:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.login-card .btn-main:active:not(:disabled){transform:translateY(0);box-shadow:inset 1px 1px 0 rgba(0,0,0,.2)}
.login-card .btn-main:disabled{opacity:.5;cursor:not-allowed}
.login-card .foot{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.6}
.login-card .roll{color:var(--ac);text-decoration:none;font-weight:600;cursor:pointer;display:inline-block;margin-top:4px}
.login-card .roll:hover{text-decoration:underline}

.chat-wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:calc(100vh - 46px);max-width:900px;margin:0 auto;padding:0 16px}
.chat-wrap[hidden]{display:none}

/* 顶部工具条：跳转时间 */
.chat-toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 4px 0}
.chat-toolbar .tb-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;
  font-size:11.5px;font-family:inherit;font-weight:600;
  color:var(--muted);
  background:var(--bg2);
  border:1px solid var(--bd);
  border-radius:999px;
  cursor:pointer;
  transition:all .18s;
}
[data-theme^="mc-"] .chat-toolbar .tb-btn{border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel)}
.chat-toolbar .tb-btn:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-1px)}
.chat-toolbar .sp{flex:1}

.messages{flex:1;overflow-y:auto;padding:16px 4px 40px;scroll-behavior:smooth;overscroll-behavior:contain}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.messages::-webkit-scrollbar-thumb:hover{background:var(--ac)}

.msg{display:flex;gap:10px;margin-bottom:12px;animation:msgIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .avatar{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);user-select:none}
[data-theme^="github-"] .msg .avatar{border-radius:50%}
.msg .avatar.empty{visibility:hidden}
.msg .body{flex:1;min-width:0}
.msg .head{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;font-size:11px;flex-wrap:wrap}
.msg .nick{font-weight:700;color:var(--text);font-size:12.5px}
.msg .time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.msg .content{display:inline-block;max-width:100%;padding:7px 12px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap;background:var(--other-bg);color:var(--other-fg);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel)}
[data-theme^="github-"] .msg .content{border-radius:12px}
.msg.self{flex-direction:row-reverse}
.msg.self .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.self .head{flex-direction:row-reverse}
.msg.self .content{background:var(--self-bg);color:var(--self-fg);border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.15)}
[data-theme="github-light"] .msg.self .content,[data-theme="github-dark"] .msg.self .content{text-shadow:none}
.msg.compact{margin-top:-6px}

.msg .status-tag{display:inline-block;font-size:10.5px;color:var(--muted);font-style:italic;vertical-align:middle}
.msg.pending .content{opacity:.55}
.msg.pending .status-tag::before{content:"";display:inline-block;width:8px;height:8px;margin-right:4px;border:1.5px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spinIcon .7s linear infinite;vertical-align:-1px}
.msg.failed .content{border-color:var(--dgr);box-shadow:var(--bevel),0 0 0 1px rgba(160,32,32,.3)}
.msg.failed .status-tag{color:var(--dgr);font-weight:700;font-style:normal}
.msg.failed .status-tag::before{content:"⚠ "}

/* 跳转高亮 */
.msg.highlight .content{
  animation:highlightFlash 2.2s ease-out;
}
@keyframes highlightFlash{
  0%{box-shadow:var(--bevel), 0 0 0 3px var(--ac);}
  70%{box-shadow:var(--bevel), 0 0 0 3px var(--ac);}
  100%{box-shadow:var(--bevel);}
}

    return Promise.resolve().then(function(){ return queryFn(); }).then(function(res){
      if(res && res.error){
        var msg = String(res.error.message || res.error || '');
        var isNetwork = /fetch|network|timeout|abort|connection/i.test(msg);
        var e = new Error(msg);
        e.__isNetwork = isNetwork;
        e.__res = res;
        throw e;
      }
      return res;
    });
  }, {
    label: label,
    max: options.max,
    shouldRetry: function(err){
      return err && (err.__isNetwork || /fetch|network|timeout|abort|connection/i.test(String(err.message||'')));
    },
    onRetry: options.silent ? null : function(attempt, max, delay, label){
      showRetryOverlay(attempt, max, label);
      setPillRetry(attempt, max);
    }
  });
}

  }, { max: 2, silent: true });

async function claimNick(nick){
  var r = await sbQuery('占用昵称', function(){
    return sb.from('nicknames').insert({ nick: nick, uid: uid, last_active: Date.now() });
  });

  if(r.ok){
    return { ok:true, mine:true };
  }

  var err = r.err;
  if(err && err.__res && err.__res.error && err.__res.error.code === '23505'){
    var q = await sbQuery('查询昵称', function(){
      return sb.from('nicknames').select('uid').eq('nick', nick).maybeSingle();
    });
    if(!q.ok){
      return { ok:false, reason:'net', msg: '查询失败，请重试' };
    }
    var row = q.data && q.data.data;
    if(row && row.uid === uid){
      /* 是自己的，更新活跃时间 */
      await updateActivity();
      return { ok:true, mine:true };
    }
    return { ok:false, reason:'taken' };
  }

  return { ok:false, reason:'net', msg: '网络异常，请重试' };
}
async function releaseNick(nick){
  if(!nick) return;
  await sbQuery('释放昵称', function(){
    return sb.from('nicknames').delete().eq('nick', nick).eq('uid', uid);

}

   ============================================================ */
var particleCtx=null,particles=[],particleRunning=true,pW=0,pH=0,pDpr=1;
var themeColors=['61,82,31','106,140,60','140,180,60','180,150,80'];
function readThemeColors(){
  var cs=getComputedStyle(document.documentElement);
  themeColors=[
    (cs.getPropertyValue('--p1')||'61,82,31').trim(),
    (cs.getPropertyValue('--p2')||'106,140,60').trim(),
    (cs.getPropertyValue('--p3')||'140,180,60').trim(),
    (cs.getPropertyValue('--p4')||'180,150,80').trim()
  ];
}
function initParticles(){
  var canvas=$('particles');
  if(!canvas||!canvas.getContext)return;
  particleCtx=canvas.getContext('2d');
  pDpr=Math.min(window.devicePixelRatio||1,2);
  resizeCanvas();
  readThemeColors();
  var count=Math.max(10,Math.min(20,Math.floor((pW*pH)/60000)));
  particles=[];
  for(var i=0;i<count;i++){
    particles.push({
      x:Math.random()*pW,y:Math.random()*pH,
      size:4+Math.random()*8,
      vx:(Math.random()-0.5)*0.35,vy:(Math.random()-0.5)*0.35,
      rot:Math.random()*Math.PI*2,
      vr:(Math.random()-0.5)*0.012,
      alpha:0.10+Math.random()*0.20,
      alphaPhase:Math.random()*Math.PI*2,
      alphaSpeed:0.008+Math.random()*0.014,
      hueIdx:Math.floor(Math.random()*4),
      hueMix:Math.random()
    });
  }
  if(particleRunning)drawParticles();
}
function resizeCanvas(){
  var canvas=$('particles');if(!canvas)return;
  pW=window.innerWidth;pH=window.innerHeight;
  canvas.width=pW*pDpr;canvas.height=pH*pDpr;
  canvas.style.width=pW+'px';canvas.style.height=pH+'px';
  if(particleCtx)particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}
function drawParticles(){
  if(!particleRunning||!particleCtx)return;
  particleCtx.clearRect(0,0,pW,pH);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    if(p.x<-40)p.x=pW+40;else if(p.x>pW+40)p.x=-40;
    if(p.y<-40)p.y=pH+40;else if(p.y>pH+40)p.y=-40;
    p.alphaPhase+=p.alphaSpeed;
    var a=p.alpha*(0.55+0.45*Math.sin(p.alphaPhase));
    a=Math.max(0.03,Math.min(0.4,a));
    var c1=(themeColors[p.hueIdx]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var c2=(themeColors[(p.hueIdx+1)%4]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var mix=p.hueMix;
    var r=Math.round(c1[0]*(1-mix)+c2[0]*mix);
    var g=Math.round(c1[1]*(1-mix)+c2[1]*mix);
    var b=Math.round(c1[2]*(1-mix)+c2[2]*mix);
    particleCtx.save();
    particleCtx.translate(p.x,p.y);
    particleCtx.rotate(p.rot);
    var s=p.size,hs=s/2,rad=Math.min(3,s/3.5);
    var grad=particleCtx.createLinearGradient(-hs,-hs,hs,hs);
    grad.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');
    grad.addColorStop(1,'rgba('+r+','+g+','+b+','+(a*0.3)+')');
    particleCtx.fillStyle=grad;
    particleCtx.beginPath();
    if(particleCtx.roundRect)particleCtx.roundRect(-hs,-hs,s,s,rad);
    else particleCtx.rect(-hs,-hs,s,s);
    particleCtx.fill();
    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

async function doSend(){

  if(diff<SEND_COOLDOWN){
    toast('发得太快了，'+Math.ceil((SEND_COOLDOWN-diff)/1000)+' 秒后再试');

  }

  }

  lastSendTime=now;
  inputEl.value='';

  sendBtn.disabled=true;

    id: localId,
    uid: uid,

  };
  allMessages.push(localMsg);

    return sb.from('messages').insert({
      uid: uid,
      nick: myNick,
      text: text,
      ts: now
    });
  });

  hideRetryOverlay();

  var idx = allMessages.findIndex(function(x){ return x.id === localId; });
  if(idx < 0) return;

  if(r.ok){
    allMessages[idx].__pending = false;
    allMessages[idx].__sent = true;

  }else{

    allMessages[idx].__sent = false;
    allMessages[idx].__failed = true;
    renderAll();
    toast('发送失败，已重试 ' + RETRY_MAX + ' 次');
    setPillErr();
    showFailOverlay('发送消息');
  }
}

function normalizeMsg(m){
  return {
    id: m.id,
    uid: String(m.uid||''),
    nick: String(m.nick||'无名'),
    text: String(m.text||''),
    ts: Number(m.ts||0)
  };
}

function renderMsg(m, prev){
  var div=document.createElement('div');
  div.className='msg';
  if(m.uid===uid)div.classList.add('self');
  if(m.__pending)div.classList.add('pending');
  if(m.__failed)div.classList.add('failed');
  if(m.__highlight)div.classList.add('highlight');

  if(!m.__local && prev && !prev.__local && prev.uid===m.uid && (m.ts-prev.ts)<3*60*1000){
    div.classList.add('compact');
  }

  var isCompact=div.classList.contains('compact');
  var color=m.uid===uid ? 'var(--ac)' : nickColor(m.nick);

  var avatarHtml=isCompact
    ? '<div class="avatar empty"></div>'
    : '<div class="avatar" style="background:'+color+'">'+esc(m.nick.charAt(0).toUpperCase())+'</div>';

  var statusTag = '';
  if(m.__pending) statusTag = '<span class="status-tag">发送中</span>';
  else if(m.__failed) statusTag = '<span class="status-tag">发送失败</span>';

  var headHtml=isCompact
    ? '<div class="head" style="visibility:hidden"><span class="nick">&nbsp;</span></div>'
    : '<div class="head"><span class="nick">'+esc(m.nick)+'</span><span class="time">'+esc(fmtTime(m.ts))+'</span>'+statusTag+'</div>';

  div.innerHTML=
    avatarHtml+
    '<div class="body">'+
      headHtml+
      '<div class="content">'+esc(m.text)+'</div>'+
    '</div>';

  if(m.id) div.setAttribute('data-mid', m.id);

  return div;
}

function isAtBottom(){
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
}

function renderAll(){
  var atBottom=isAtBottom();

  if(allMessages.length===0){
    messagesEl.innerHTML=
      '<div class="empty-state">'+
        '<div class="ic">💬</div>'+
        '<div class="t">还没有人说话</div>'+
        '<div class="s">发第一条消息打个招呼吧</div>'+
      '</div>';
    return;
  }

  var frag=document.createDocumentFragment();
  var prev=null;
  allMessages.forEach(function(m){
    frag.appendChild(renderMsg(m,prev));
    if(!m.__local) prev=m;
  });
  messagesEl.innerHTML='';
  messagesEl.appendChild(frag);

  if(atBottom){
    messagesEl.scrollTop=messagesEl.scrollHeight;
  }
}

function updateLastTs(){
  for(var i=allMessages.length-1;i>=0;i--){
    var m = allMessages[i];
    if(!m.__local && typeof m.ts==='number' && m.ts>0){
      lastTs = m.ts;
      return;
    }
  }
  lastTs = 0;
}

function mergeNewMessages(newOnes){
  if(!newOnes || newOnes.length === 0) return false;
  var changed = false;

  newOnes.forEach(function(n){
    if(allMessages.some(function(x){ return !x.__local && String(x.id)===String(n.id); })){
      return;
    }

    var localIdx = allMessages.findIndex(function(x){
      return x.__local &&
        !x.__failed &&
        x.uid === n.uid &&
        x.nick === n.nick &&
        x.text === n.text &&
        Math.abs(x.ts - n.ts) < 5000;
    });

    if(localIdx >= 0){
      allMessages[localIdx] = n;
    }else{
      allMessages.push(n);
    }
    changed = true;
  });

  if(!changed) return false;

  allMessages.sort(function(a,b){
    var aLocal = a.__local ? 1 : 0;
    var bLocal = b.__local ? 1 : 0;
    if(aLocal !== bLocal) return aLocal - bLocal;
    return a.ts - b.ts;
  });
  if(allMessages.length > MSG_LIMIT){
    allMessages = allMessages.slice(-MSG_LIMIT);
  }
  renderAll();
  updateLastTs();
  return true;
}

async function loadHistory(){
  var r = await sbQuery('加载历史', function(){
    return sb.from('messages')
      .select('*')
      .order('ts', { ascending: false })
      .limit(MSG_LIMIT);
  });

  if(!r.ok){
    console.warn('加载失败', r.err);
    setPillErr();
    setTimeout(function(){ loadHistory(); }, 5000);
    return;
  }

  hideRetryOverlay();
  setPillOK();

  var data = r.data && r.data.data;
  if(!Array.isArray(data)) return;

  var localPending = allMessages.filter(function(x){ return x.__local; });
  var arr = data.map(normalizeMsg);
  arr.reverse();

  localPending.forEach(function(lp){
    if(!arr.some(function(x){ return x.uid===lp.uid && x.text===lp.text && Math.abs(x.ts-lp.ts)<5000; })){
      arr.push(lp);
    }
  });

  allMessages = arr;
  updateLastTs();
  renderAll();
}

async function pollNewMessages(){
  var q = sb.from('messages').select('*');
  if(lastTs > 0){
    q = q.gt('ts', lastTs).order('ts', { ascending: true }).limit(MSG_LIMIT);
  }else{
    q = q.order('ts', { ascending: false }).limit(MSG_LIMIT);
  }

  var r = await sbQuery('轮询消息', function(){ return q; });

  if(!r.ok){
    console.warn('轮询失败', r.err);
    setRpErr();
    setPillErr();
    return;
  }

  hideRetryOverlay();
  clearRpErr();
  setPillOK();

  var data = r.data && r.data.data;
  if(!Array.isArray(data)) return;
  if(lastTs === 0) data.reverse();
  var newOnes = data.map(normalizeMsg);
  mergeNewMessages(newOnes);
}

function subscribeMessages(){
  if(msgChannel) return;
  msgChannel = sb.channel('chat-messages')
    .on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'messages'
    }, function(payload){
      var m = payload.new;
      if(!m) return;
      var msg = normalizeMsg(m);
      mergeNewMessages([msg]);
    })
    .subscribe(function(status, err){
      if(status==='SUBSCRIBED'){
        console.log('[chat] 实时已连接');
        setPillOK();
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        console.warn('[chat] 实时连接异常：', status, err);
        setPillErr();
        setTimeout(function(){
          try{ if(msgChannel) sb.removeChannel(msgChannel); }catch(e){}
          msgChannel = null;
          subscribeMessages();
        }, 5000);
      }
    });
}

function subscribePresence(){
  if(presenceChannel) return;
  presenceChannel = sb.channel('online-users', {
    config: { presence: { key: uid } }
  });
  presenceChannel
    .on('presence', { event: 'sync' }, function(){
      var state = presenceChannel.presenceState();
      var count = 0;
      Object.keys(state).forEach(function(k){
        count += (state[k]||[]).length;
      });
      onlineNum.textContent = count;
    })
    .subscribe(async function(status){
      if(status==='SUBSCRIBED'){
        try{
          await presenceChannel.track({ nick: myNick, online_at: Date.now() });
        }catch(e){}
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        setTimeout(function(){
          try{ if(presenceChannel) sb.removeChannel(presenceChannel); }catch(e){}
          presenceChannel = null;
          subscribePresence();
        }, 5000);
      }
    });
}

/* ============================================================
   跳转时间
   ============================================================ */
var jumpOv=$('jumpOv'), jumpInput=$('jumpInput');

function openJumpDialog(){
  var now = Date.now();
  jumpInput.value = toLocalInput(now - 3600000);   /* 默认 1 小时前 */
  jumpOv.classList.add('show');
  setTimeout(function(){ try{ jumpInput.focus(); }catch(e){} }, 40);
}
function closeJumpDialog(){ jumpOv.classList.remove('show'); }

async function jumpToTime(targetTs){
  var r = await sbQuery('跳转查询', function(){
    return sb.from('messages')
      .select('*')
      .lte('ts', targetTs)
      .order('ts', { ascending: false })
      .limit(100);
  });

  if(!r.ok){
    toast('跳转失败：' + (r.err && r.err.message || '请重试'));
    return;
  }

  var data = r.data && r.data.data;
  if(!data || data.length === 0){
    /* 该时间之前没数据，试试往后找最近的 */
    var r2 = await sbQuery('往后查询', function(){
      return sb.from('messages')
        .select('*')
        .gt('ts', targetTs)
        .order('ts', { ascending: true })
        .limit(100);
    });
    if(!r2.ok || !r2.data || !r2.data.data || r2.data.data.length === 0){
      toast('该时间附近没有消息');
      return;
    }
    data = r2.data.data.slice().reverse();
  }

  var arr = data.map(normalizeMsg).reverse();

  /* 找到最接近 targetTs 的那条消息，做高亮 */
  var bestIdx = 0;
  var bestDist = Infinity;
  arr.forEach(function(m, i){
    var d = Math.abs(m.ts - targetTs);
    if(d < bestDist){ bestDist = d; bestIdx = i; }
  });

  /* 全部清掉旧的高亮 */
  arr.forEach(function(m){ m.__highlight = false; });
  if(arr[bestIdx]) arr[bestIdx].__highlight = true;

  allMessages = arr;
  updateLastTs();
  renderAll();

  /* 滚到高亮那条 */
  setTimeout(function(){
    var target = arr[bestIdx];
    if(!target) return;
    var el = messagesEl.querySelector('[data-mid="' + target.id + '"]');
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      setTimeout(function(){ el.classList.remove('highlight'); }, 2500);
    }else{
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }, 100);

  toast('已跳到 ' + fmtTime(targetTs) + ' 附近');
}

$('jumpBtn').addEventListener('click', openJumpDialog);
$('jumpClose').addEventListener('click', closeJumpDialog);
$('jumpCancel').addEventListener('click', closeJumpDialog);
jumpOv.addEventListener('click', function(e){ if(e.target===jumpOv) closeJumpDialog(); });

document.querySelectorAll('.jump-body .quick button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var offset = parseInt(btn.getAttribute('data-offset'), 10);
    jumpInput.value = toLocalInput(Date.now() - offset);
  });
});

$('jumpGo').addEventListener('click', function(){
  var v = jumpInput.value;
  if(!v){ toast('请选择时间'); return; }
  var targetTs = new Date(v.replace('T',' ')).getTime();
  if(isNaN(targetTs)){ toast('时间格式不对'); return; }
  closeJumpDialog();
  jumpToTime(targetTs);
});

$('jumpLatestBtn').addEventListener('click', function(){
  loadHistory().then(function(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
    toast('已回到最新');
  });
});

/* ============================================================
   右下角
   ============================================================ */
var refreshPill = $('refreshPill');
var cdNum = $('cdNum');
var rpIcon = $('rpIcon');
var pollCountdown = POLL_INTERVAL;
var countdownTimer = null;
var pillState = 'ok';

function setPillRetry(attempt, max){
  pillState = 'retry';
  if(refreshPill){
    refreshPill.classList.remove('err','loading');
    refreshPill.classList.add('retry');
    var txt = refreshPill.querySelector('.rp-text');
    if(txt) txt.innerHTML = '<span id="cdNum">' + attempt + '</span>/' + max + ' 重试中';
    cdNum = $('cdNum');
  }
  if(rpIcon) rpIcon.textContent = '⏳';
}
function setPillOK(){
  pillState = 'ok';
  if(refreshPill) refreshPill.classList.remove('err','retry');
  if(rpIcon) rpIcon.textContent = '🔄';
  var txt = refreshPill && refreshPill.querySelector('.rp-text');
  if(txt) txt.innerHTML = '<span id="cdNum">' + pollCountdown + '</span> 秒后刷新';
  cdNum = $('cdNum');
}
function setPillErr(){
  pillState = 'err';
  if(refreshPill){
    refreshPill.classList.remove('retry','loading');
    refreshPill.classList.add('err');
  }
  if(rpIcon) rpIcon.textContent = '⚠';
  var txt = refreshPill && refreshPill.querySelector('.rp-text');
  if(txt) txt.innerHTML = '连接失败';
}

function updateCdDisplay(){
  if(pillState !== 'ok') return;
  if(cdNum) cdNum.textContent = pollCountdown;
}
function setRpErr(){}
function clearRpErr(){ setPillOK(); }
function resetPollCountdown(){ pollCountdown = POLL_INTERVAL; updateCdDisplay(); }

function doPollNow(){
  if(refreshPill) refreshPill.classList.add('loading');
  if(rpIcon) rpIcon.textContent = '🔄';
  pollNewMessages().then(function(){
    setTimeout(function(){
      if(refreshPill) refreshPill.classList.remove('loading');
      if(pillState==='ok' && rpIcon) rpIcon.textContent = '🔄';
    }, 400);
  });
}

function startPolling(){
  stopPolling();
  resetPollCountdown();
  if(refreshPill) refreshPill.hidden = false;

  countdownTimer = setInterval(function(){
    if(document.hidden) return;
    if(pillState !== 'ok') return;
    pollCountdown--;
    if(pollCountdown <= 0){
      if(refreshPill){
        refreshPill.classList.add('tick');
        setTimeout(function(){ refreshPill.classList.remove('tick'); }, 400);
      }
      doPollNow();
      pollCountdown = POLL_INTERVAL;
    }
    updateCdDisplay();
  }, 1000);
}
function stopPolling(){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
}

if(refreshPill){
  refreshPill.addEventListener('click', function(){
    if(refreshPill.classList.contains('loading')) return;
    doPollNow();
    resetPollCountdown();
  });
}

/* ============================================================
   相对时间刷新
   ============================================================ */
setInterval(function(){
  if(allMessages.length===0)return;
  var real = allMessages.filter(function(m){ return !m.__local; });
  var els = messagesEl.querySelectorAll('.msg .time');
  var i = 0;
  real.forEach(function(m){
    var t = els[i];
    if(t) t.textContent = fmtTime(m.ts);
    i++;
  });
},30000);

/* ============================================================
   修改昵称
   ============================================================ */
var nickOv=$('nickOv'),nickInput=$('nickInput'),nickHint=$('nickHint');
var nickQuotaLeftEl = $('nickQuotaLeft');

async function openNickDialog(){
  nickInput.value=myNick;
  nickHint.innerHTML = '改名后旧昵称会被释放，别人可以用了。<br><span class="quota">今日还可改 <span id="nickQuotaLeft">?</span> / 5 次</span>';
  nickQuotaLeftEl = $('nickQuotaLeft');
  nickOv.classList.add('show');
  setTimeout(function(){try{nickInput.focus();nickInput.select();}catch(e){}},40);

  /* 异步查额度 */
  var q = await getNickChangeQuota();
  if(nickQuotaLeftEl){
    nickQuotaLeftEl.textContent = q.ok ? q.left : '?';
  }
  if(q.ok && q.left <= 0){
    $('nickSave').disabled = true;
    nickHint.innerHTML = '今天已经改了 5 次了，明天再来吧。<br><span class="quota">今日还可改 0 / 5 次</span>';
  }
}
function closeNickDialog(){ nickOv.classList.remove('show'); }

$('nickBtn').addEventListener('click',openNickDialog);
$('nickClose').addEventListener('click',closeNickDialog);
$('nickCancel').addEventListener('click',closeNickDialog);

$('nickSave').addEventListener('click', async function(){
  var v = nickInput.value.trim();
  if(!v){ nickHint.textContent='昵称不能为空'; nickHint.className='hint err'; return; }
  if(v.length>20){ nickHint.textContent='最多 20 字'; nickHint.className='hint err'; return; }
  if(v===myNick){ closeNickDialog(); return; }

  $('nickSave').disabled = true;
  nickHint.textContent='检查中…';
  nickHint.className='hint';

  /* 检查额度 */
  var quota = await getNickChangeQuota();
  if(!quota.ok){
    nickHint.textContent='网络异常，请重试';
    nickHint.className='hint err';
    $('nickSave').disabled = false;
    return;
  }
  if(quota.left <= 0){
    nickHint.innerHTML = '今天已经改了 5 次了，明天再来吧。<br><span class="quota">今日还可改 0 / 5 次</span>';
    $('nickSave').disabled = false;
    return;
  }

  /* 尝试占用新昵称 */
  var r = await claimNick(v);
  hideRetryOverlay();

  if(!r.ok){
    if(r.reason==='taken'){
      nickHint.textContent='这个名字被占用了，换一个吧';
      nickHint.className='hint err';
    }else{
      nickHint.textContent='网络异常：'+(r.msg||'请重试');
      nickHint.className='hint err';
    }
    $('nickSave').disabled = false;
    return;
  }

  var oldNick = myNick;
  myNick = v;
  storage.set(K_NICK, myNick);
  $('meNick').textContent = myNick;

  /* 记录改名 */
  await logNickChange();

  /* 释放旧昵称 */
  await releaseNick(oldNick);

  /* 关键修复：同步所有历史消息的 nick */
  await syncMyMessagesNick(myNick);

  /* 更新在线状态 */
  try{
    if(presenceChannel) await presenceChannel.track({nick:myNick, online_at:Date.now()});
  }catch(e){}

  closeNickDialog();
  toast('昵称已改为「'+myNick+'」（今日还剩 ' + (quota.left - 1) + ' 次）');
});
nickInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();$('nickSave').click();}
});

/* ============================================================
   主题绑定
   ============================================================ */
themeBtn.addEventListener('click',openTheme);
themeClose.addEventListener('click',closeTheme);
themeOv.addEventListener('click',function(e){if(e.target===themeOv)closeTheme();});
themeGrid.addEventListener('click',function(e){
  var card=e.target.closest('[data-theme-val]');
  if(!card)return;
  var id=card.getAttribute('data-theme-val');
  applyTheme(id);
  closeTheme();
  var name=id;
  for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===id)name=THEMES[i].name;
  toast('已切换到 '+name);
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(themeOv.classList.contains('show'))closeTheme();
    else if(nickOv.classList.contains('show'))closeNickDialog();
    else if(jumpOv.classList.contains('show'))closeJumpDialog();
  }
});

window.addEventListener('resize',resizeCanvas,{passive:true});

document.addEventListener('visibilitychange',function(){
  particleRunning = !document.hidden;
  if(particleRunning){
    drawParticles();
    if(!chatWrap.hidden){
      doPollNow();
      resetPollCountdown();
      updateActivity();
    }
    if(presenceChannel){
      try{ presenceChannel.track({nick:myNick, online_at: Date.now()}); }catch(e){}
    }
  }
});

/* ============================================================
   启动
   ============================================================ */
applyTheme(curTheme);
initParticles();
autoResize();
updateLoginBtn();

(async function autoLogin(){
  var saved = storage.get(K_NICK);
  if(!saved) return;
  loginNick.value = saved;
  updateLoginBtn();
  setLoginStatus('正在恢复上次的昵称…', 'busy');

  autoClean();

  var r = await claimNick(saved);
  hideRetryOverlay();
  if(r.ok){
    myNick = saved;
    setLoginStatus('✓ 欢迎回来', 'ok');
    startChat();
  }else if(r.reason==='taken'){
    setLoginStatus('上次用的名字现在被占了，换一个吧', 'err');
    storage.del(K_NICK);
  }else{
    setLoginStatus('网络异常，可重试', 'err');
  }
})();

})();
</script>
