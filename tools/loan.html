<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房贷月供计算 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
.big{
  padding:14px 16px;background:var(--bg);border:2px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--bevel);margin-bottom:12px;
}
.big em{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.big b{font-family:var(--mono);font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big b small{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.big i{display:block;font-style:normal;margin-top:7px;font-size:12.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin-top:4px;-webkit-overflow-scrolling:touch}
table.sched{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
table.sched th,table.sched td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd)}
table.sched th{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--bg3);position:sticky;top:0}
table.sched th:first-child,table.sched td:first-child{text-align:left}
table.sched td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.sched tbody tr:hover td{background:var(--bg3)}
.warn{margin-top:10px;font-size:12.5px;color:var(--dgr);min-height:18px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="tool">
    <div class="page-head"><div><h1>🏦 房贷月供计算</h1><p class="sub">等额本息 / 等额本金 · 月供、总利息和逐年还款表</p></div></div>

    <div class="panel">
      <h2 class="panel-title">贷款条件</h2>
      <div class="fld">
        <label>还款方式</label>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="ei" aria-pressed="true">等额本息</button>
          <button type="button" data-mode="ep" aria-pressed="false">等额本金</button>
        </div>
      </div>
      <div class="grid2">
        <div class="fld">
          <label for="amt">贷款金额（万元）</label>
          <input id="amt" type="number" inputmode="decimal" min="0.1" step="0.1" value="100">
        </div>
        <div class="fld">
          <label for="rate">年利率（%）</label>
          <input id="rate" type="number" inputmode="decimal" min="0" max="24" step="0.01" value="3.1">
        </div>
      </div>
      <div class="grid2">
        <div class="fld">
          <label for="years">期限（年）</label>
          <input id="years" type="number" inputmode="numeric" min="1" max="40" step="1" value="30">
        </div>
        <div class="fld">
          <label for="first">首付（万元，可留空）</label>
          <input id="first" type="number" inputmode="decimal" min="0" step="0.1" value="">
        </div>
      </div>
      <div class="row" style="margin-top:4px">
        <button class="btn primary" id="btnCalc" type="button">计算</button>
        <button class="btn" id="btnCopy" type="button">📋 复制结果</button>
      </div>
      <div class="warn" id="err"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">结果</h2>
      <div class="big">
        <em id="bigLabel">每月月供</em>
        <b id="rMonthly">—<small>元</small></b>
        <i id="rNote">改一下条件再点计算</i>
      </div>
      <div class="kv"><span>贷款本金</span><b id="rPrincipal">—</b></div>
      <div class="kv"><span>支付利息合计</span><b id="rInterest">—</b></div>
      <div class="kv"><span>还款总额</span><b id="rTotal">—</b></div>
      <div class="kv"><span>利息占本金</span><b id="rRatio">—</b></div>
      <div class="kv"><span>首月月供</span><b id="rFirst">—</b></div>
      <div class="kv"><span>末月月供</span><b id="rLast">—</b></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">逐年还款</h2>
      <div class="scroll">
        <table class="sched">
          <thead><tr><th>年份</th><th>当年还款</th><th>其中本金</th><th>其中利息</th><th>年末剩余</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="tip">
        💡 <b>等额本息</b>每月还款额固定，前期利息占比高；<b>等额本金</b>每月本金固定、月供逐月减少，
        总利息更少但前期压力大。两种方式都按「按月计息、当月还清」计算，实际银行可能有几日差额。<br>
        首付只用来反推总房价（贷款额 + 首付），不影响月供计算。利率填年化，比如 LPR 3.1 就填 <code>3.1</code>。
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast=HS.toast;
var mode='ei';
var amt=$('amt'),rate=$('rate'),years=$('years'),first=$('first'),errEl=$('err');
var tbody=$('tbody');

function money(n){
  var s=n.toFixed(2), p=s.split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return p.join('.');
}
function yuan(n){return money(n)+' 元';}

function numOf(el,label,min,max,optional){
  var raw=String(el.value).trim();
  if(raw===''){
    if(optional) return null;
    throw new Error(label+'不能为空');
  }
  if(!/^\d+(\.\d+)?$/.test(raw)) throw new Error(label+'只能填数字');
  var n=parseFloat(raw);
  if(n<min) throw new Error(label+'不能小于 '+min);
  if(max!=null&&n>max) throw new Error(label+'不能大于 '+max);
  return n;
}

/* 生成逐月计划 */
function schedule(P,annual,n,kind){
  var r=annual/100/12;
  var rows=[],i,bal=P,pay,ints,prins;
  if(kind==='ei'){
    var m=r===0?P/n:P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
    for(i=1;i<=n;i++){
      ints=bal*r;
      prins=Math.min(m-ints,bal);
      bal=Math.max(0,bal-prins);
      rows.push({m:m,i:ints,p:prins,b:bal});
    }
  }else{
    var base=P/n;
    for(i=1;i<=n;i++){
      ints=bal*r;
      prins=Math.min(base,bal);
      bal=Math.max(0,bal-prins);
      rows.push({m:prins+ints,i:ints,p:prins,b:bal});
    }
  }
  return rows;
}

var last=null;

function calc(){
  errEl.textContent='';
  var P,y,annual,dp;
  try{
    P=numOf(amt,'贷款金额',0.1,100000)*10000;
    annual=numOf(rate,'年利率',0,24);
    y=numOf(years,'期限',1,40);
    dp=numOf(first,'首付',0,null,true);
  }catch(e){
    errEl.textContent='⚠ '+e.message;
    return;
  }
  if(!Number.isInteger(y)){ errEl.textContent='⚠ 期限请填整年'; return; }
  var n=Math.round(y*12);
  var rows=schedule(P,annual,n,mode);
  var totalInt=0,totalPay=0;
  rows.forEach(function(x){totalInt+=x.i;totalPay+=x.p+x.i;});

  $('bigLabel').textContent=mode==='ei'?'每月月供':'首月月供';
  $('rMonthly').innerHTML=money(rows[0].m)+'<small>元</small>';
  $('rNote').textContent=(mode==='ei'
    ? '共 '+n+' 期，每期金额相同'
    : '共 '+n+' 期，每期递减约 '+money(rows[0].m-rows[Math.min(1,n-1)].m)+' 元')
    + (dp!=null?' · 总房价约 '+money((P/10000)+dp)+' 万':'');
  $('rPrincipal').textContent=yuan(P);
  $('rInterest').textContent=yuan(totalInt);
  $('rTotal').textContent=yuan(totalPay);
  $('rRatio').textContent=(totalInt/P*100).toFixed(1)+'%';
  $('rFirst').textContent=yuan(rows[0].m);
  $('rLast').textContent=yuan(rows[n-1].m);

  /* 按年汇总 */
  var html='',yr=0,yp=0,yi=0,idx=0;
  for(var i=0;i<n;i++){
    yp+=rows[i].p;yi+=rows[i].i;idx++;
    if(idx===12||i===n-1){
      yr++;
      html+='<tr><td>第 '+yr+' 年</td><td>'+money(yp+yi)+'</td><td>'+money(yp)
          +'</td><td>'+money(yi)+'</td><td>'+money(rows[i].b)+'</td></tr>';
      yp=0;yi=0;idx=0;
    }
  }
  tbody.innerHTML=html;

  last={P:P,annual:annual,y:y,mode:mode,total:totalPay,int:totalInt,
        m:rows[0].m,last:rows[n-1].m,n:n};
}

$('modeSeg').addEventListener('click',function(e){
  var b=e.target.closest('button[data-mode]');
  if(!b) return;
  mode=b.getAttribute('data-mode');
  Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){
    x.setAttribute('aria-pressed',String(x===b));
  });
  calc();
});
[amt,rate,years,first].forEach(function(el){
  el.addEventListener('change',calc);
  el.addEventListener('input',function(){
    clearTimeout(el._t);
    el._t=setTimeout(calc,320);
  });
});
$('btnCalc').addEventListener('click',function(){calc();toast('已重新计算');});

$('btnCopy').addEventListener('click',function(){
  if(!last){toast('先算一次');return;}
  var txt=[
    '【房贷】'+(last.mode==='ei'?'等额本息':'等额本金'),
    '贷款 '+money(last.P)+' 元 · 年利率 '+last.annual+'% · '+last.y+' 年',
    (last.mode==='ei'?'月供 ':'首月 ')+money(last.m)+' 元，末月 '+money(last.last)+' 元',
    '利息合计 '+money(last.int)+' 元',
    '还款总额 '+money(last.total)+' 元'
  ].join('\n');
  HS.copy(txt);toast('结果已复制');
});

calc();
})();
</script>
</body>
</html>
