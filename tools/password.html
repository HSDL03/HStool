<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随机密码生成 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pwlist{display:flex;flex-direction:column;gap:7px}
.pw{
  display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);
  border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);
}
.pw code{
  flex:1;min-width:0;font-family:var(--mono);font-size:14px;font-weight:700;
  word-break:break-all;letter-spacing:.02em;
}
.pw .cp{
  flex:none;font:inherit;font-size:11px;font-weight:800;letter-spacing:.05em;cursor:pointer;
  padding:5px 9px;color:var(--muted);background:var(--bg3);border:1px solid var(--bd);border-radius:6px;
}
.pw .cp:hover{color:var(--text);border-color:var(--ac)}
.meter{height:10px;border-radius:6px;background:var(--bg3);border:1px solid var(--bd);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s}
.kv{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:13.5px;flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv span{flex:none;width:82px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.kv b{font-family:var(--mono);font-weight:700;word-break:break-all}
.lenrow{display:flex;gap:10px;align-items:center}
.lenrow input[type=range]{flex:1;min-width:0;accent-color:var(--ac);height:26px}
.lenrow input[type=number]{width:84px;flex:none}
@media(max-width:640px){
  .lenrow{flex-wrap:wrap}
  .lenrow input[type=number]{width:100%}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="tool">
    <div class="page-head"><div><h1>🔑 随机密码生成</h1><p class="sub">浏览器本地随机 · 不上传、不联网、带熵评估</p></div></div>

    <div class="panel">
      <h2 class="panel-title">生成设置</h2>
      <div class="fld">
        <label for="lenRange">长度</label>
        <div class="lenrow">
          <input id="lenRange" type="range" min="4" max="64" step="1" value="16" aria-label="密码长度滑块">
          <input id="lenNum" type="number" min="4" max="64" step="1" value="16" aria-label="密码长度">
        </div>
      </div>
      <div class="fld">
        <label id="chartTitle">包含哪些字符</label>
        <div class="chips" role="group" aria-labelledby="chartTitle">
          <button class="chip active" type="button" data-set="lower" aria-pressed="true">小写 a-z</button>
          <button class="chip active" type="button" data-set="upper" aria-pressed="true">大写 A-Z</button>
          <button class="chip active" type="button" data-set="digit" aria-pressed="true">数字 0-9</button>
          <button class="chip" type="button" data-set="symbol" aria-pressed="false">符号 !@#$</button>
          <button class="chip" type="button" data-set="nosame" aria-pressed="false">排除易混 O0l1I</button>
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="btnGen" type="button">🎲 生成 5 个</button>
        <button class="btn" id="btnCopyAll" type="button">📋 复制全部</button>
      </div>
      <div class="err" id="err" style="color:var(--dgr);font-size:12.5px;margin-top:8px" hidden></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">结果</h2>
      <div class="pwlist" id="list"></div>
      <div class="meter"><i id="meterBar"></i></div>
      <div class="kv" style="margin-top:10px"><span>强度</span><b id="rStrength">—</b></div>
      <div class="kv"><span>信息熵</span><b id="rEntropy">—</b></div>
      <div class="kv"><span>字符池</span><b id="rPool">—</b></div>
    </div>

    <div class="panel">
      <div class="tip">
        💡 随机源是 <code>crypto.getRandomValues</code>（操作系统的密码学随机数），并对超出字符池整数倍的抽样做丢弃重取，
        保证每个字符等概率 —— <code>Math.random()</code> 是可预测的，别拿来生成密码。<br>
        熵 = 长度 × log₂(字符池大小)，60 位以上算强，80 位以上可以放心用。勾掉的字符集越少，池子越小，同样长度就越弱。
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast=HS.toast;

var SETS={
  lower:'abcdefghijklmnopqrstuvwxyz',
  upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  digit:'0123456789',
  symbol:'!@#$%^&*()-_=+[]{};:,.?'
};
var AMBIGUOUS='O0oIl1|`\'"';
var state={lower:true,upper:true,digit:true,symbol:false,nosame:false};

function pool(){
  var out='';
  ['lower','upper','digit','symbol'].forEach(function(k){
    if(state[k]) out+=SETS[k];
  });
  if(state.nosame){
    out=out.split('').filter(function(c){return AMBIGUOUS.indexOf(c)<0;}).join('');
  }
  // 去重（字符池里可能有重复符号）
  var seen={},res='';
  for(var i=0;i<out.length;i++){
    if(!seen[out[i]]){seen[out[i]]=1;res+=out[i];}
  }
  return res;
}

/* 无偏随机整数 [0,max) */
function randInt(max){
  var limit=Math.floor(4294967296/max)*max;
  var buf=new Uint32Array(1);
  for(var i=0;i<200;i++){
    crypto.getRandomValues(buf);
    if(buf[0]<limit) return buf[0]%max;
  }
  return buf[0]%max;
}

function genOne(chars,len){
  var s='';
  for(var i=0;i<len;i++) s+=chars.charAt(randInt(chars.length));
  return s;
}

function readLen(){
  var v=parseInt($('lenNum').value,10);
  if(isNaN(v)) return {err:'长度要填数字'};
  if(v<4||v>64) return {err:'长度范围是 4 ~ 64'};
  return {val:v};
}

function strengthOf(bits){
  if(bits<40) return {t:'弱 · 别用',p:22};
  if(bits<60) return {t:'一般 · 随便用用',p:48};
  if(bits<80) return {t:'较强',p:74};
  if(bits<110) return {t:'强',p:92};
  return {t:'非常强',p:100};
}

function render(){
  var chars=pool();
  if(chars.length<2){
    $('err').hidden=false;
    $('err').textContent='⚠ 至少勾一种字符集';
    $('list').innerHTML='';
    $('rStrength').textContent='—';$('rEntropy').textContent='—';$('rPool').textContent='—';
    $('meterBar').style.width='0';
    return;
  }
  var r=readLen();
  if(r.err){
    $('err').hidden=false;
    $('err').textContent='⚠ '+r.err;
    return;
  }
  $('err').hidden=true;
  var len=r.val;
  var html='';
  for(var i=0;i<5;i++){
    var pw=genOne(chars,len);
    html+='<div class="pw"><code>'+HS.esc(pw)+'</code>'
        + '<button class="cp" type="button" data-pw="'+HS.esc(pw)+'">复制</button></div>';
  }
  $('list').innerHTML=html;

  var bits=len*Math.log(chars.length)/Math.LN2;
  var st=strengthOf(bits);
  $('rStrength').textContent=st.t;
  $('rEntropy').textContent=bits.toFixed(1)+' 位（长度 '+len+' × log₂'+chars.length+'）';
  $('rPool').textContent=chars.length+' 个字符';
  $('meterBar').style.width=st.p+'%';
}

/* chip 切换 */
Array.prototype.forEach.call(document.querySelectorAll('.chip[data-set]'),function(btn){
  btn.addEventListener('click',function(){
    var k=btn.getAttribute('data-set');
    state[k]=!state[k];
    btn.setAttribute('aria-pressed',state[k]?'true':'false');
    btn.classList.toggle('active',state[k]);
    try{localStorage.setItem('hs-pw-set',JSON.stringify(state));}catch(e){}
    render();
  });
});

$('lenRange').addEventListener('input',function(){
  $('lenNum').value=$('lenRange').value;
  render();
});
$('lenNum').addEventListener('input',function(){
  var v=parseInt($('lenNum').value,10);
  if(!isNaN(v)&&v>=4&&v<=64) $('lenRange').value=String(v);
  render();
});
$('btnGen').addEventListener('click',render);
$('btnCopyAll').addEventListener('click',function(){
  var codes=document.querySelectorAll('#list .pw code');
  if(!codes.length){toast('还没有结果');return;}
  var arr=Array.prototype.map.call(codes,function(c){return c.textContent;});
  HS.copy(arr.join('\n'));
  toast('已复制 5 个密码');
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('.cp');
  if(!b) return;
  HS.copy(b.getAttribute('data-pw'));
  toast('已复制这个密码');
});

/* 恢复上次设置 */
try{
  var saved=JSON.parse(localStorage.getItem('hs-pw-set')||'null');
  if(saved&&typeof saved==='object'){
    ['lower','upper','digit','symbol','nosame'].forEach(function(k){
      if(typeof saved[k]==='boolean') state[k]=saved[k];
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-set]'),function(btn){
      var on=state[btn.getAttribute('data-set')];
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.classList.toggle('active',on);
    });
  }
}catch(e){}

render();
})();
</script>
</body>
</html>
