<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复利定投计算 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
.big{
  padding:14px 16px;background:var(--bg);border:2px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--bevel);margin-bottom:12px;
}
.big em{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.big b{font-family:var(--mono);font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big b small{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.big i{display:block;font-style:normal;margin-top:8px;font-size:12.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sched{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
table.sched th,table.sched td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd)}
table.sched th{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--bg3)}
table.sched th:first-child,table.sched td:first-child{text-align:left}
table.sched td{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.sched tbody tr:hover td{background:var(--bg3)}
.warn{margin-top:10px;font-size:12.5px;color:var(--dgr);min-height:18px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="tool">
    <div class="page-head"><div><h1>📈 复利定投计算</h1><p class="sub">一笔本金 + 每月定投，按年化收益滚出多少</p></div></div>

    <div class="panel">
      <h2 class="panel-title">投入与收益</h2>
      <div class="grid2">
        <div class="fld">
          <label for="init">初始本金（元）</label>
          <input id="init" type="number" inputmode="decimal" min="0" step="100" value="10000">
        </div>
        <div class="fld">
          <label for="monthly">每月定投（元）</label>
          <input id="monthly" type="number" inputmode="decimal" min="0" step="100" value="1000">
        </div>
      </div>
      <div class="grid2">
        <div class="fld">
          <label for="rate">年化收益（%）</label>
          <input id="rate" type="number" inputmode="decimal" min="-50" max="100" step="0.1" value="6">
        </div>
        <div class="fld">
          <label for="years">年数</label>
          <input id="years" type="number" inputmode="numeric" min="1" max="60" step="1" value="10">
        </div>
      </div>
      <div class="fld">
        <label for="timing">定投时点</label>
        <select id="timing">
          <option value="end">每月月末（常见）</option>
          <option value="begin">每月月初</option>
        </select>
      </div>
      <div class="row" style="margin-top:4px">
        <button class="btn primary" id="btnCalc" type="button">计算</button>
        <button class="btn" id="btnCopy" type="button">📋 复制结果</button>
      </div>
      <div class="warn" id="err"></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">结果</h2>
      <div class="big">
        <em>到期总额</em>
        <b id="rFinal">—<small>元</small></b>
        <i id="rNote">按月复利，收益只作参考</i>
      </div>
      <div class="kv"><span>累计投入</span><b id="rIn">—</b></div>
      <div class="kv"><span>其中投资收益</span><b id="rGain">—</b></div>
      <div class="kv"><span>收益 / 投入</span><b id="rRatio">—</b></div>
      <div class="kv"><span>若完全不投资（只存现金）</span><b id="rCash">—</b></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">逐年增长</h2>
      <div class="scroll">
        <table class="sched">
          <thead><tr><th>年末</th><th>累计投入</th><th>账户余额</th><th>收益</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="tip">
        💡 按月复利，年化收益 <code>r</code> 折算成月利率 <code>r/12</code>，定投在当月计入。
        <b>月末定投</b>比月初少赚一个月，长期差距不小。<br>
        这是理想模型：不含手续费、税费和收益波动。真实基金每年收益起落，
        用它做「大概能攒多少」的估算就够了，别当承诺。
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast=HS.toast;
var initEl=$('init'),monEl=$('monthly'),rateEl=$('rate'),yearEl=$('years'),timingEl=$('timing'),errEl=$('err');
var tbody=$('tbody');

function money(n){
  var neg=n<0; n=Math.abs(n);
  var s=n.toFixed(2),p=s.split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (neg?'-':'')+p.join('.');
}
function yuan(n){return money(n)+' 元';}

function numOf(el,label,min,max){
  var raw=String(el.value).trim();
  if(raw==='') throw new Error(label+'不能为空');
  if(!/^-?\d+(\.\d+)?$/.test(raw)) throw new Error(label+'只能填数字');
  var n=parseFloat(raw);
  if(n<min) throw new Error(label+'不能小于 '+min);
  if(n>max) throw new Error(label+'不能大于 '+max);
  return n;
}

var last=null;

function calc(){
  errEl.textContent='';
  var P,M,a,y;
  try{
    P=numOf(initEl,'初始本金',0,1e9);
    M=numOf(monEl,'每月定投',0,1e7);
    a=numOf(rateEl,'年化收益',-50,100);
    y=numOf(yearEl,'年数',1,60);
  }catch(e){ errEl.textContent='⚠ '+e.message; return; }
  if(!Number.isInteger(y)){ errEl.textContent='⚠ 年数请填整数'; return; }
  if(P===0&&M===0){ errEl.textContent='⚠ 本金和定投都是 0，算不出东西来'; return; }

  var r=a/100/12, begin=timingEl.value==='begin';
  var bal=P, invested=P, rows=[], html='';
  for(var i=1;i<=y*12;i++){
    if(begin){
      bal=(bal+M)*(1+r); invested+=M;
    }else{
      bal=bal*(1+r)+M; invested+=M;
    }
    if(i%12===0){
      rows.push({y:i/12,inv:invested,bal:bal});
      html+='<tr><td>第 '+(i/12)+' 年</td><td>'+money(invested)+'</td><td>'+money(bal)
          +'</td><td>'+money(bal-invested)+'</td></tr>';
    }
  }
  tbody.innerHTML=html;

  var gain=bal-invested;
  $('rFinal').innerHTML=money(bal)+'<small>元</small>';
  $('rIn').textContent=yuan(invested);
  $('rGain').textContent=yuan(gain);
  $('rRatio').textContent=invested>0?(gain/invested*100).toFixed(1)+'%':'—';
  $('rCash').textContent=yuan(invested)+'（本金不变）';
  $('rNote').textContent='共 '+(y*12)+' 个月 · 年化 '+a+'% · '+(begin?'月初':'月末')+'定投，按复利滚存';

  last={bal:bal,inv:invested,gain:gain,a:a,y:y,begin:begin,P:P,M:M};
}

$('btnCalc').addEventListener('click',function(){calc();toast('已重新计算');});
[initEl,monEl,rateEl,yearEl].forEach(function(el){
  el.addEventListener('change',calc);
  el.addEventListener('input',function(){
    clearTimeout(el._t);
    el._t=setTimeout(calc,300);
  });
});
timingEl.addEventListener('change',calc);

$('btnCopy').addEventListener('click',function(){
  if(!last){toast('先算一次');return;}
  HS.copy([
    '【复利定投】本金 '+money(last.P)+' 元，每月 '+money(last.M)+' 元，年化 '+last.a+'%，'+last.y+' 年',
    '累计投入 '+money(last.inv)+' 元',
    '到期总额 '+money(last.bal)+' 元',
    '投资收益 '+money(last.gain)+' 元（'+(last.gain/last.inv*100).toFixed(1)+'%）'
  ].join('\n'));
  toast('结果已复制');
});

calc();
})();
</script>
</body>
</html>
