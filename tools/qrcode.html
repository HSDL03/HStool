<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二维码生成器 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
/* 工具页共用排版：颜色/边框/圆角全部继承 core.css 的令牌 */
.wrap{max-width:920px;margin:0 auto;padding-top:26px}
.card{
  position:static;display:block;overflow:visible;transform:none;
  padding:18px;margin-bottom:16px;
  background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);
}
.card::before{display:none}
.card:hover{transform:none;border-color:var(--bd2);box-shadow:var(--bevel)}
[data-theme^="github-"] .card{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.card-title{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-title::before{content:"";width:8px;height:8px;background:var(--ac);box-shadow:var(--bevel);flex:none}
[data-theme^="github-"] .card-title::before{border-radius:50%;box-shadow:none}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fld textarea,.fld input,.fld select{
  font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);
  border:2px solid var(--bd2);border-radius:var(--r);outline:none;padding:8px 11px;
  box-shadow:var(--bevel);transition:border-color .15s,box-shadow .15s;
}
[data-theme^="github-"] .fld textarea,[data-theme^="github-"] .fld input,[data-theme^="github-"] .fld select{border-width:1px;box-shadow:none}
.fld textarea{resize:vertical;min-height:88px;line-height:1.65}
.fld textarea:focus,.fld input:focus,.fld select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tip{font-size:12.5px;color:var(--muted);line-height:1.7;padding:10px 12px;background:var(--bg3);border-left:3px solid var(--ac);border-radius:var(--r)}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px;background:#fff;border:2px solid var(--bd);border-radius:var(--r);min-height:260px;justify-content:center}
#qrCanvas{max-width:100%;height:auto;image-rendering:pixelated}
.qr-empty{color:#888;font-size:13px;text-align:center}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="page-head"><div><h1>📱 二维码生成器</h1><p class="sub">纯前端生成 · 支持中文 · 可下载 PNG</p></div></div>

  <div class="card">
    <h2 class="card-title">输入内容</h2>
    <div class="fld">
      <label>文本 / 链接 / 任意内容</label>
      <textarea id="qrText" placeholder="https://example.com&#10;或任意文字，支持中文…">https://github.com/HSDL03</textarea>
    </div>
    <div class="grid2">
      <div class="fld">
        <label>尺寸（像素）</label>
        <input id="qrSize" type="number" value="320" min="120" max="1024" step="20">
      </div>
      <div class="fld">
        <label>容错级别</label>
        <select id="qrLevel">
          <option value="L">L · 低（7%）</option>
          <option value="M" selected>M · 中（15%）</option>
          <option value="Q">Q · 较高（25%）</option>
          <option value="H">H · 高（30%）</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button class="btn pri" id="btnGen" type="button">✨ 生成二维码</button>
      <button class="btn" id="btnDownload" type="button" disabled>💾 下载 PNG</button>
      <button class="btn" id="btnClear" type="button">🗑 清空</button>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">预览</h2>
    <div class="qr-box" id="qrBox">
      <div class="qr-empty">点击「生成二维码」后在此显示</div>
      <canvas id="qrCanvas" style="display:none"></canvas>
    </div>
  </div>

  <div class="card">
    <div class="tip">
      💡 <strong>提示</strong>：二维码使用 CDN 库 <code>qrcode.js</code> 生成，完全在你的浏览器本地计算，内容不会上传到任何服务器。首次打开需要联网加载一次库文件。
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast = HS.toast;
var canvas=$('qrCanvas'),box=$('qrBox'),genBtn=$('btnGen'),dlBtn=$('btnDownload'),clrBtn=$('btnClear');
var textEl=$('qrText'),sizeEl=$('qrSize'),levelEl=$('qrLevel');
var hasQR=false;

function showEmpty(msg){
  box.innerHTML='<div class="qr-empty">'+msg+'</div>';
  hasQR=false;dlBtn.disabled=true;
}

function generate(){
  var text=(textEl.value||'').trim();
  if(!text){toast('请输入内容');textEl.focus();return;}
  if(typeof QRCode==='undefined'){
    toast('二维码库未加载，请检查网络');
    showEmpty('二维码库加载失败，请刷新重试');
    return;
  }
  var size=parseInt(sizeEl.value,10)||320;
  if(size<120)size=120;if(size>1024)size=1024;
  var level=(levelEl.value||'M').toUpperCase();

  /* 重建 canvas（因为可能被 empty 覆盖掉了） */
  box.innerHTML='';
  canvas=document.createElement('canvas');
  canvas.id='qrCanvas';
  box.appendChild(canvas);

  QRCode.toCanvas(canvas,text,{
    width:size,
    margin:2,
    errorCorrectionLevel:level,
    color:{dark:'#000000',light:'#ffffff'}
  },function(err){
    if(err){
      console.error(err);
      toast('生成失败：'+err.message);
      showEmpty('生成失败，请检查输入');
      return;
    }
    hasQR=true;
    dlBtn.disabled=false;
    toast('生成成功');
  });
}

function download(){
  if(!hasQR)return;
  var c=box.querySelector('canvas');
  if(!c)return;
  try{
    var url=c.toDataURL('image/png');
    var a=document.createElement('a');
    a.href=url;
    a.download='qrcode-'+Date.now()+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    toast('已下载');
  }catch(e){
    toast('下载失败：'+e.message);
  }
}

function clearAll(){
  textEl.value='';
  showEmpty('点击「生成二维码」后在此显示');
  textEl.focus();
}

genBtn.addEventListener('click',generate);
dlBtn.addEventListener('click',download);
clrBtn.addEventListener('click',clearAll);

textEl.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();generate();}
});

sizeEl.addEventListener('change',function(){if(hasQR)generate();});
levelEl.addEventListener('change',function(){if(hasQR)generate();});
})();
</script>
</body>
</html>
