<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC 名称随机器 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
/* 工具页共用排版：颜色/边框/圆角全部继承 core.css 的令牌 */
.wrap{max-width:920px;margin:0 auto;padding-top:26px}
.card{
  position:static;display:block;overflow:visible;transform:none;
  padding:18px;margin-bottom:16px;
  background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);
}
.card::before{display:none}
.card:hover{transform:none;border-color:var(--bd2);box-shadow:var(--bevel)}
[data-theme^="github-"] .card{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.card-title{display:flex;align-items:center;gap:8px;margin:0 0 13px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-title::before{content:"";width:8px;height:8px;background:var(--ac);box-shadow:var(--bevel);flex:none}
[data-theme^="github-"] .card-title::before{border-radius:50%;box-shadow:none}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld label{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fld textarea,.fld input,.fld select{
  font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);
  border:2px solid var(--bd2);border-radius:var(--r);outline:none;padding:8px 11px;
  box-shadow:var(--bevel);transition:border-color .15s,box-shadow .15s;
}
[data-theme^="github-"] .fld textarea,[data-theme^="github-"] .fld input,[data-theme^="github-"] .fld select{border-width:1px;box-shadow:none}
.fld textarea{resize:vertical;min-height:88px;line-height:1.65}
.fld textarea:focus,.fld input:focus,.fld select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tip{font-size:12.5px;color:var(--muted);line-height:1.7;padding:10px 12px;background:var(--bg3);border-left:3px solid var(--ac);border-radius:var(--r)}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px;background:#fff;border:2px solid var(--bd);border-radius:var(--r);min-height:260px;justify-content:center}
#qrCanvas{max-width:100%;height:auto;image-rendering:pixelated}
.qr-empty{color:#888;font-size:13px;text-align:center}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="page-head"><div><h1>🎲 MC 名称随机器</h1><p class="sub">模拟网易随机昵称 · 不相关词汇拼接</p></div></div>

  <div class="card">
    <h2 class="card-title">生成设置</h2>
    <div class="opt-row">
      <span class="opt active static">🟩 网易风（随机拼接）</span>
    </div>

    <div class="count-row">
      <label for="countInput">生成数量</label>
      <input class="count-input" id="countInput" type="number" value="10" min="1" max="10000" step="1">
      <div class="quick-btns">
        <button type="button" data-quick="1">1</button>
        <button type="button" data-quick="10">10</button>
        <button type="button" data-quick="50">50</button>
        <button type="button" data-quick="100">100</button>
        <button type="button" data-quick="1000">1000</button>
        <button type="button" data-quick="10000">10000</button>
      </div>
    </div>

    <div class="opt-row" id="suffixRow">
      <button class="opt active" data-suffix="0">不加后缀</button>
      <button class="opt" data-suffix="1">加数字</button>
      <button class="opt" data-suffix="2">加语气词</button>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="btn pri" id="btnGen" type="button">🎲 生成</button>
      <button class="btn" id="btnCopyAll" type="button">📋 全部复制</button>
      <button class="btn" id="btnClear" type="button">🗑 清空</button>
    </div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="card">
    <h2 class="card-title">结果 <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0">（点任意名字复制）</span></h2>
    <div class="list" id="list">
      <div class="empty">点上方「🎲 生成」开始</div>
    </div>
  </div>

  <div class="card">
    <div class="tip">
      💡 <strong>关于网易随机昵称</strong>：网易版随机昵称来自本地预置词库（<code>random_nickname_db</code>），把不相关的词随机拼接，生成类似「椰子味亡灵声优」「狂笑的蛇写作文」这种无厘头名字。<br>
      📏 <strong>网易昵称规则</strong>：长度 3–12 字符，1 个汉字算 1.5 字符，每月只能改 1 次。<br>
      ⚠️ <strong>数量提示</strong>：单次最多 10000 个，数量较大时浏览器生成需要 1–2 秒，请耐心等待。
    </div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast = HS.toast;
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function ri(n){return Math.floor(Math.random()*n);}

/* ═══════════════════════════════════════
   词库：按“不相关类别”划分，模拟网易风格
   ═══════════════════════════════════════ */

/* 感官 / 味道 / 质感 */
var SENSE=['椰子味','薄荷味','焦糖味','柠檬味','咖啡味','草莓味','巧克力味','奶油味','麻辣味','酸甜味','冰镇','热乎','酥脆','软糯','Q弹','拉丝','爆汁','流心','脆皮','焦香','清甜','微苦','咸香','香草','抹茶','芝士','海盐','黑糖','蜜桃','葡萄','西瓜','芒果','菠萝','荔枝','龙眼','榴莲','山竹','火龙果','百香果','杨枝甘露'];

/* 生物 / MC 角色 */
var MOB=['亡灵','苦力怕','末影人','僵尸','骷髅','蜘蛛','女巫','凋灵','恶魂','史莱姆','岩浆怪','幻翼','监守者','猪灵','疣猪兽','烈焰人','雪傀儡','铁傀儡','村民','流浪商人','掠夺者','卫道士','唤魔者','蝙蝠','鹦鹉','山羊','青蛙','美西螈','发光鱿鱼','悦灵','骆驼','嗅探兽','犰狳','旋风人','沼骸','铜傀儡','蛇','小蛇','蛇蛇','蛇精','蟒蛇','眼镜蛇','响尾蛇','白蛇'];

/* 职业 / 身份 */
var JOB=['声优','骑士','法师','矿工','铁匠','农民','渔夫','猎人','厨师','调酒师','面包师','侦探','海盗','船长','忍者','武士','弓箭手','炼金术士','图书管理员','牧羊人','制图师','皮匠','石匠','牧人','吟游诗人','占卜师','驯兽师','园艺师','钟表匠','酿酒师','写作文','写散文','写小说','写诗','写日记','写代码','打篮球','踢足球','打游戏'];

/* 状态 / 情绪 / 语气 */
var MOOD=['暴躁的','沉默的','快乐的','忧郁的','疯狂的','佛系的','暴躁','沉默','快乐','忧郁','疯狂','佛系','傲娇','腹黑','天然呆','中二','社恐','社牛','摸鱼','肝帝','欧皇','非酋','摆烂','内卷','躺平','暴富','emo','元气','慵懒','清醒','迷糊','兴奋','淡定','狂笑的','狂笑','大笑的','微笑的','偷笑的','冷笑的','傻笑的','张哥的','凯哥的','温柔的'];

/* 物件 / 食物 */
var THING=['芒果','椰子','菠萝','西瓜','柠檬','草莓','咖啡','奶茶','布丁','蛋糕','饼干','薯片','拉面','火锅','烧烤','煎饼','包子','饺子','汤圆','粽子','月饼','冰淇淋','棒棒糖','棉花糖','巧克力','奶酪','黄油','蜂蜜','果酱','番茄酱','篮球','足球','作文本','日记本','篮球梦想','足球梦想','世界霸主'];

/* 后缀语气词 */
var TAIL=['酱','君','桑','大人','殿下','阁下','本尊','在此','来啦','闪亮登场','降临','驾到','已上线','摸鱼中','肝爆了','躺平了','已黑化','无敌了','绝赞','小可爱','大可爱','永远的神','爷青回','人上人','求带飞','带飞全场','想睡觉','不想上班','在摸鱼'];

/* 纯汉字池（用于补长度） */
var HANZI='的一是不了在人有我他这个们中来上大为和国地到以说时要就出会可也你对生能而子那得于着下自之年过发后作里用道行所然家种事成方多经么去法学如都同现当没动面起看定天分还进好小部其些主样理心她本前开但因只从想实日军者意无力它与长把机十民第公此已工使情明性知全三又关点正业外将两高间由问很最重并物手应战向头文体政美相见被利什二等产或新己制身果加西斯月话合回特代内信表化老给世位次度门任常先海通教儿原东声提立及比员解水名真论处走义各入几口认条平系气题活尔更别打女变四神总何电数安少报才结反受目太量再感建务做接必场件计管期市直德资命山金指克许统区保至队形社便程展爱越张标术持完风效除质级府色款准精划器统争权规院按怎演青合识存近即且';

/* ═══════ 生成逻辑 ═══════ */

var state={suffix:0};

/* 网易风：从 2~3 个不同类别各抽一个词直接拼 */
function genNetease(){
  var pools=[SENSE,MOB,JOB,MOOD,THING];
  var n=Math.random()<0.5?2:3;
  var shuffled=pools.slice().sort(function(){return Math.random()-0.5;});
  var parts=[];
  for(var i=0;i<n;i++){
    parts.push(pick(shuffled[i]));
  }
  return parts.join('');
}

function applySuffix(name){
  if(state.suffix===0)return name;
  if(state.suffix===1)return name+ri(9999);
  return name+pick(TAIL);
}

/* 网易规则：1 汉字 = 1.5 字符，总长 3~12 字符 */
function trimToNeteaseLimit(name){
  function neteaseLen(s){
    var len=0;
    for(var i=0;i<s.length;i++){
      len += /[\u4e00-\u9fa5]/.test(s[i]) ? 1.5 : 1;
    }
    return len;
  }
  while(neteaseLen(name)>12 && name.length>1){
    name=name.slice(0,-1);
  }
  while(neteaseLen(name)<3){
    name+=HANZI[ri(HANZI.length)];
  }
  return name;
}

function genOne(){
  var name=genNetease();
  name=applySuffix(name);
  return trimToNeteaseLimit(name);
}

/* ═══════ UI ═══════ */
var listEl=$('list');
var summaryEl=$('summary');
var countInput=$('countInput');
var currentNames=[];
var genBtn=$('btnGen');

function escHtml(s){
  return String(s).replace(/[<>&"]/g,function(c){
    return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];
  });
}

function renderNames(names){
  currentNames=names;
  if(!names.length){
    listEl.innerHTML='<div class="empty">点上方「🎲 生成」开始</div>';
    summaryEl.textContent='';
    return;
  }
  /* 一次性字符串拼接，避免上万个 DOM 操作 */
  var buf=[];
  for(var i=0;i<names.length;i++){
    var n=names[i];
    buf.push(
      '<div class="name-row" data-name="'+escHtml(n)+'" title="点击复制">'
      + '<span class="name-idx">'+(i+1)+'</span>'
      + '<span class="name-text">'+escHtml(n)+'</span>'
      + '<span class="name-len">'+n.length+' 字</span>'
      + '<span class="name-copy">点击复制</span>'
      + '</div>'
    );
  }
  listEl.innerHTML=buf.join('');
  summaryEl.textContent='共 '+names.length+' 个';
}

/* 生成 N 个（用异步分块避免卡顿） */
function genMany(n,onDone){
  var out=[],seen={},guard=0,maxGuard=n*40;
  var chunk=2000;
  var produced=0;

  function step(){
    var end=Math.min(out.length+chunk,n);
    while(out.length<end && guard<maxGuard){
      guard++;
      var v=genOne();
      if(!seen[v]){seen[v]=1;out.push(v);}
    }
    produced=out.length;
    if(out.length>=n || guard>=maxGuard){
      onDone(out);
      return;
    }
    /* 每块之间让浏览器渲染一帧，避免长任务卡死 */
    if(window.requestAnimationFrame){
      requestAnimationFrame(step);
    }else{
      setTimeout(step,0);
    }
  }
  step();
}

/* 复制 */
function copy(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){cb&&cb(true);},function(){cb&&cb(fallback(text));});
  }else cb&&cb(fallback(text));
}
function fallback(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  var ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  return ok;
}

/* 事件 */
listEl.addEventListener('click',function(e){
  var row=e.target.closest('.name-row');if(!row)return;
  var name=row.getAttribute('data-name');
  copy(name,function(ok){toast(ok?'已复制：'+name:'复制失败');});
});

var suffixRow=$('suffixRow');
suffixRow.addEventListener('click',function(e){
  var btn=e.target.closest('.opt');if(!btn)return;
  var all=suffixRow.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++)all[i].classList.remove('active');
  btn.classList.add('active');
  state.suffix=parseInt(btn.getAttribute('data-suffix'),10)||0;
});

/* 快捷数量按钮 */
var quickBtns=document.querySelectorAll('.quick-btns [data-quick]');
for(var qi=0;qi<quickBtns.length;qi++){
  (function(btn){
    btn.addEventListener('click',function(){
      countInput.value=btn.getAttribute('data-quick');
      countInput.focus();
    });
  })(quickBtns[qi]);
}

/* 输入校验 */
function readCount(){
  var raw=parseInt(countInput.value,10);
  if(isNaN(raw))raw=10;
  if(raw<1)raw=1;
  if(raw>10000)raw=10000;
  countInput.value=String(raw);
  return raw;
}
countInput.addEventListener('blur',function(){readCount();});
countInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();genBtn.click();}
});

/* 生成按钮 */
genBtn.addEventListener('click',function(){
  var n=readCount();
  genBtn.disabled=true;
  var oldText=genBtn.textContent;
  genBtn.textContent='⏳ 生成中…';
  summaryEl.textContent='正在生成 '+n+' 个…';

  /* 用 setTimeout 让按钮状态先渲染出来 */
  setTimeout(function(){
    genMany(n,function(names){
      renderNames(names);
      genBtn.disabled=false;
      genBtn.textContent=oldText;
      toast('已生成 '+names.length+' 个');
    });
  },20);
});

$('btnCopyAll').addEventListener('click',function(){
  if(!currentNames.length){toast('还没有生成');return;}
  copy(currentNames.join('\n'),function(ok){
    toast(ok?('已复制全部 '+currentNames.length+' 个'):'复制失败');
  });
});

$('btnClear').addEventListener('click',function(){
  currentNames=[];
  listEl.innerHTML='<div class="empty">点上方「🎲 生成」开始</div>';
  summaryEl.textContent='';
  countInput.focus();
});

/* 首屏：默认生成 10 个 */
renderNames((function(){
  var out=[],seen={},guard=0;
  while(out.length<10 && guard<400){
    guard++;
    var v=genOne();
    if(!seen[v]){seen[v]=1;out.push(v);}
  }
  return out;
})());

})();
</script>
</body>
</html>
