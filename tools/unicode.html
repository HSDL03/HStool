<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicode 字符查询 · 红石的小站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
.charbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.charbox .glyph{
  font-size:56px;line-height:1;padding:10px 20px;min-width:96px;text-align:center;
  background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);
}
.charbox .meta{flex:1;min-width:150px}
.kv{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:13px;flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv span{flex:none;width:70px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.kv b{font-family:var(--mono);font-weight:700;word-break:break-all}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
table th,table td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
table th{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--bg3);white-space:nowrap}
table td{font-family:var(--mono);white-space:nowrap}
table td.g{font-size:15px;text-align:center;width:34px}
table tbody tr:hover td{background:var(--bg3)}
.warn{margin-top:9px;font-size:12.5px;color:var(--dgr);min-height:18px}
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<div class="wrap">
  <div class="tool">
    <div class="page-head"><div><h1>🔤 Unicode 字符查询</h1><p class="sub">字符、码点、UTF-8 字节互相查 · 排乱码用得上</p></div></div>

    <div class="panel">
      <h2 class="panel-title">查一个字符</h2>
      <div class="fld">
        <label for="one">输入字符 / U+4E2D / 0x4e2d / 十进制 20013</label>
        <input id="one" value="中" spellcheck="false" autocomplete="off">
      </div>
      <div class="charbox">
        <div class="glyph" id="g">中</div>
        <div class="meta">
          <div class="kv"><span>码点</span><b id="kCp">—</b></div>
          <div class="kv"><span>十进制</span><b id="kDec">—</b></div>
          <div class="kv"><span>UTF-8</span><b id="kU8">—</b></div>
          <div class="kv"><span>UTF-16</span><b id="kU16">—</b></div>
          <div class="kv"><span>HTML</span><b id="kHtml">—</b></div>
          <div class="kv"><span>CSS</span><b id="kCss">—</b></div>
        </div>
      </div>
      <div class="warn" id="warn1"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="btnCopyCp" type="button">📋 复制码点</button>
        <button class="btn" id="btnCopyEsc" type="button">📋 复制 HTML 实体</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="panel-title">整段文本拆开</h2>
      <div class="fld">
        <label for="txt">文本（最多 300 个不同字符）</label>
        <textarea id="txt" spellcheck="false" class="mono">红石 Redstone 🧱🎮</textarea>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>字</th><th>码点</th><th>十进制</th><th>UTF-8</th><th>次</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="btnCopyAll" type="button">📋 复制表格</button>
      </div>
      <div class="warn" id="warn2"></div>
    </div>

    <div class="panel">
      <div class="tip">
        💡 一个汉字在 UTF-8 里占 <code>3</code> 字节、UTF-16 占 2 字节；emoji 这类 4 字节字符在 UTF-16 里要拆成
        两个代理单元（<code>D83D DE00</code> 这种），在很多老系统里就是从这儿开始乱码的。<br>
        码点支持 <code>U+</code> 前缀、<code>0x</code> 前缀或直接写十进制；敲一个字符也行。空格和换行会用
        <code>␣</code> <code>↵</code> 标出来，免得看不见。
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var toast=HS.toast;
var oneEl=$('one'),txtEl=$('txt'),tbody=$('tbody');

var VIS={32:'␣',9:'⇥',10:'↵',13:'⏎',0:'␀'};

function hex4(cp){
  var s=cp.toString(16).toUpperCase();
  while(s.length<4) s='0'+s;
  return 'U+'+s;
}
function utf8(ch){
  var b=new TextEncoder().encode(ch),out=[];
  for(var i=0;i<b.length;i++) out.push(b[i].toString(16).toUpperCase().padStart(2,'0'));
  return out.join(' ');
}
function utf16(ch){
  var out=[];
  for(var i=0;i<ch.length;i++) out.push(ch.charCodeAt(i).toString(16).toUpperCase().padStart(4,'0'));
  return out.join(' ');
}
function display(ch){
  var cp=ch.codePointAt(0);
  if(VIS[cp]) return VIS[cp];
  if(cp<32||cp===127) return '·';
  return ch;
}

/* ── 单字符 ─────────────────────────────────────────── */
function parseOne(raw){
  var s=String(raw).trim();
  if(!s) return null;
  var m=s.match(/^U\+?([0-9a-f]{1,6})$/i) || s.match(/^0x([0-9a-f]{1,6})$/i);
  if(m) return parseInt(m[1],16);
  if(/^\d{1,7}$/.test(s)) return parseInt(s,10);
  var cp=s.codePointAt(0);
  return cp==null?null:cp;
}

function showOne(){
  var cp=parseOne(oneEl.value);
  $('warn1').textContent='';
  if(cp==null){
    $('g').textContent='?';
    ['kCp','kDec','kU8','kU16','kHtml','kCss'].forEach(function(id){$(id).textContent='—';});
    return;
  }
  if(cp>0x10FFFF||(cp>=0xD800&&cp<=0xDFFF)){
    $('warn1').textContent='⚠ 这个码点不合法（代理区或超出 U+10FFFF）';
    $('g').textContent='?';
    ['kCp','kDec','kU8','kU16','kHtml','kCss'].forEach(function(id){$(id).textContent='—';});
    return;
  }
  var ch=String.fromCodePoint(cp);
  $('g').textContent=display(ch);
  $('kCp').textContent=hex4(cp);
  $('kDec').textContent=String(cp);
  $('kU8').textContent=utf8(ch);
  $('kU16').textContent=utf16(ch);
  $('kHtml').textContent='&#'+cp+';';
  $('kCss').textContent='\\'+cp.toString(16).toLowerCase();
}

/* ── 整段文本 ───────────────────────────────────────── */
var rows=[];
function analyze(){
  var raw=txtEl.value||'';
  $('warn2').textContent='';
  var map={},order=[];
  var chars=Array.from(raw);
  for(var i=0;i<chars.length;i++){
    var c=chars[i];
    if(c==='\r') continue;
    if(map[c]===undefined){ map[c]=0; order.push(c); }
    map[c]++;
  }
  if(order.length>300){
    $('warn2').textContent='⚠ 不同字符太多（'+order.length+' 个），只列前 300 个';
    order=order.slice(0,300);
  }
  rows=order.map(function(c){
    var cp=c.codePointAt(0);
    return {ch:c,cp:cp,n:map[c]};
  });
  var html='';
  rows.forEach(function(r){
    html+='<tr><td class="g">'+esc(display(r.ch))+'</td><td>'+hex4(r.cp)
        +'</td><td>'+r.cp+'</td><td>'+utf8(r.ch)+'</td><td>'+r.n+'</td></tr>';
  });
  tbody.innerHTML=html||'<tr><td colspan="5" style="color:var(--muted)">上面输入点什么</td></tr>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

oneEl.addEventListener('input',showOne);
txtEl.addEventListener('input',function(){
  clearTimeout(txtEl._t);
  txtEl._t=setTimeout(analyze,260);
});

$('btnCopyCp').addEventListener('click',function(){
  var cp=parseOne(oneEl.value);
  if(cp==null){toast('先输入一个有效的字符或码点');return;}
  HS.copy(hex4(cp));toast('已复制 '+hex4(cp));
});
$('btnCopyEsc').addEventListener('click',function(){
  var cp=parseOne(oneEl.value);
  if(cp==null||cp>0x10FFFF){toast('先输入一个有效的字符或码点');return;}
  HS.copy('&#'+cp+';');toast('已复制 HTML 实体');
});
$('btnCopyAll').addEventListener('click',function(){
  if(!rows.length){toast('还没有可复制的内容');return;}
  var lines=['字符\t码点\t十进制\tUTF-8\t次数'];
  rows.forEach(function(r){
    lines.push(display(r.ch)+'\t'+hex4(r.cp)+'\t'+r.cp+'\t'+utf8(r.ch)+'\t'+r.n);
  });
  HS.copy(lines.join('\n'));toast('表格已复制（Tab 分隔，可直接粘进表格）');
});

showOne();
analyze();
})();
</script>
</body>
</html>
