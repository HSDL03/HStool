<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备份计分板 · 红石的小工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--dgr:#a02020;
  --ok:#2d7a2d;--warn:#b08800;--gold:#c8a227;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.10);--blob2:rgba(106,140,60,.07);--blob3:rgba(180,150,80,.06);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:400px;height:400px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 28s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 34s ease-in-out infinite}
.b3{width:320px;height:320px;background:var(--blob3);top:38%;left:52%;animation:drift3 40s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(60px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-70px,-60px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-60px,-70px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.5}

.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg,#56682c,#3d521f);border-bottom:2px solid #2a3a1a;color:#fff;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.topbar .logo-icon{font-size:16px;display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.topbar .logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.topbar .sp{flex:1}
.topbar .icon{display:grid;place-items:center;width:auto;min-width:30px;height:30px;padding:0 8px;flex:none;
  font-size:13px;font-family:inherit;font-weight:600;
  color:rgba(255,255,255,.9);background:transparent;border:none;border-radius:var(--r);cursor:pointer;
  transition:background .15s,color .15s;text-decoration:none;white-space:nowrap}
.topbar .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.topbar .icon.primary{background:linear-gradient(180deg,#a4d468,#7a9c3c);color:#1f1f1f;border:1px solid #3d521f;text-shadow:none}

.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;font-size:13px;font-family:inherit;font-weight:600;
  color:#1f1f1f;background:linear-gradient(180deg,#e8e2cc,#d4ceb8);border:1px solid #4a4a3a;border-radius:var(--r);
  cursor:pointer;box-shadow:var(--bevel);transition:filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:var(--bevel),0 0 8px rgba(142,196,74,.3)}
.btn:active:not(:disabled){box-shadow:var(--bevel-in)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:#fff;background:linear-gradient(180deg,#7a9c3c,#56682c)}
.btn.d{color:var(--dgr);background:transparent;box-shadow:none}
.btn.d:hover:not(:disabled){background:rgba(160,32,32,.08);filter:none;box-shadow:none}
.btn.gold{color:#1f1f1f;background:linear-gradient(180deg,#e8d68a,#c8a227);border-color:#7a6210}
.btn.sm{padding:4px 10px;font-size:12px}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:72px 20px 60px}

.page-head{margin:0 auto 20px;text-align:center;padding:14px 0}
.page-head h1{margin:0 0 6px;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em;
  background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head .sub{margin:0;font-size:13px;color:var(--muted)}

.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 16px}
.stat{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg2);border:2px solid var(--bd2);
  border-radius:2px;box-shadow:var(--bevel);font-size:12.5px;color:var(--muted)}
.stat strong{color:var(--ac);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.gold strong{color:var(--gold)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:10px 12px;margin:0 auto 14px;
  background:var(--bg2);border:2px solid var(--bd2);
  box-shadow:var(--bevel);border-radius:2px}
.toolbar .search{position:relative;flex:1;min-width:180px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.toolbar .search input{width:100%;height:32px;padding:0 10px 0 32px;font-size:13.5px;font-family:inherit;
  color:var(--text);background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);
  border-radius:2px;outline:none;transition:border-color .15s,box-shadow .15s}
.toolbar .search input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.toolbar .search input::placeholder{color:var(--muted)}
.toolbar .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;display:none;place-items:center;font-size:12px;font-family:inherit;color:var(--muted);
  background:transparent;border:none;border-radius:2px;cursor:pointer;transition:background .15s,color .15s}
.toolbar .search .clear:hover{background:var(--bg3);color:var(--text)}
.toolbar .search.has-value .clear{display:grid}

/* 云端状态横幅 */
.cloud-banner{
  margin:0 auto 14px;padding:8px 14px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border:2px solid var(--bd2);border-radius:2px;
  font-size:12.5px;
  background:var(--bg2);box-shadow:var(--bevel);
}
.cloud-banner.hidden{display:none}
.cloud-banner .cdot{width:10px;height:10px;flex:none;background:#8a8a8a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.cloud-banner.online .cdot{background:#a4d468;box-shadow:0 0 0 2px rgba(164,212,104,.35)}
.cloud-banner.offline .cdot{background:#e8a840;box-shadow:0 0 0 2px rgba(232,168,64,.3)}
.cloud-banner .sp{flex:1}
.cloud-banner code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;padding:1px 5px;
  background:var(--bg);border:1px solid var(--bd);border-radius:2px}

.image-panel{position:relative;margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);
  box-shadow:var(--bevel);border-radius:2px;overflow:hidden;min-height:140px;
  display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.image-panel:hover{border-color:var(--ac)}
.image-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:32px 20px;color:var(--muted);cursor:pointer;width:100%;height:100%;text-align:center;transition:background .15s}
.image-empty:hover{background:var(--bg3)}
.image-empty .ic{font-size:40px;opacity:.5;line-height:1;display:block}
.image-empty .txt{font-size:13.5px;line-height:1.5}
.image-empty .hint{font-size:11.5px;opacity:.7}
.image-display{display:none;max-width:100%;max-height:420px;object-fit:contain;cursor:zoom-in;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.image-display:hover{transform:scale(1.015)}
.image-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;
  font-size:14px;font-family:inherit;color:#fff;background:rgba(160,32,32,.85);border:2px solid rgba(0,0,0,.5);
  border-radius:2px;cursor:pointer;box-shadow:var(--bevel);transition:background .15s;z-index:2}
.image-remove:hover{background:rgba(200,40,40,1)}

.ocr-panel{margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);
  box-shadow:var(--bevel);border-radius:2px;overflow:hidden;display:none;animation:fadeIn .3s both}
.ocr-panel.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.ocr-head{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;font-size:12px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ocr-head .status-dot{width:10px;height:10px;flex:none;background:#8a8a8a;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);transition:background .2s}
.ocr-head .status-dot.busy{background:#d4a72c;animation:pulse 1s infinite}
.ocr-head .status-dot.ok{background:#a4d468;box-shadow:0 0 0 2px rgba(164,212,104,.4)}
.ocr-head .status-dot.warn{background:#e8a840}
.ocr-head .status-dot.bad{background:#e05050}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ocr-head .sp{flex:1}
.ocr-head .icon-x{width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-family:inherit;
  color:rgba(255,255,255,.85);background:transparent;border:none;border-radius:2px;cursor:pointer}
.ocr-head .icon-x:hover{background:rgba(0,0,0,.2);color:#fff}

.ocr-body{padding:12px 14px}
.ocr-status{font-size:13px;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ocr-status .badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  background:var(--acs);border:1px solid var(--ac);color:var(--ac)}
.ocr-status .badge.bad{background:rgba(160,32,32,.1);border-color:var(--dgr);color:var(--dgr)}
.ocr-status .badge.gold{background:linear-gradient(180deg,#e8d68a,#c8a227);border-color:#7a6210;color:#1f1f1f}
.ocr-progress{height:10px;background:var(--bg3);border:1px solid var(--bd);border-radius:2px;overflow:hidden;margin-bottom:10px}
.ocr-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7a9c3c,#a4d468);transition:width .2s}
.ocr-text{padding:10px 12px;background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);
  border-radius:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;
  max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.ocr-text mark{background:#d4a72c;color:#1f1f1f;padding:0 2px;border-radius:2px;font-weight:700}
.ocr-text mark.gold{background:linear-gradient(180deg,#e8d68a,#c8a227)}

.players-preview{margin-top:12px}
.pp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 10px;margin-bottom:8px;
  background:linear-gradient(180deg,#e8e2cc,#d4ceb8);
  border:1px solid var(--bd2);border-radius:2px;
  font-size:12px;font-weight:700;color:#2a3a1a}
.pp-head .sp{flex:1}
.pp-head .count{font-size:11px;padding:1px 8px;background:var(--acs);color:var(--ac);
  border:1px solid var(--ac);border-radius:2px}

.player-card{background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);
  border-radius:2px;padding:10px 12px;margin-bottom:8px;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both}
@keyframes cardIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.player-card .pc-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--bd);flex-wrap:wrap}
.player-card .pc-name{font-size:15px;font-weight:800;color:#2a3a1a;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-card .pc-name .idx{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);
  background:var(--acs);padding:1px 6px;margin-right:6px;border-radius:2px;letter-spacing:.04em}
.player-card .pc-add{flex:none;padding:4px 12px;font-size:11.5px;font-family:inherit;font-weight:700;
  color:#fff;background:linear-gradient(180deg,#7a9c3c,#56682c);border:1px solid #3d521f;border-radius:2px;
  cursor:pointer;box-shadow:var(--bevel);transition:filter .12s}
.player-card .pc-add:hover{filter:brightness(1.1)}
.player-card .pc-add:active{box-shadow:var(--bevel-in)}
.player-card .pc-add.added{background:linear-gradient(180deg,#a4d468,#7a9c3c);cursor:default;opacity:.7}
.player-card .pc-add.submitting{background:linear-gradient(180deg,#e8a840,#b08800);cursor:wait}
.player-card .pc-add.gold{background:linear-gradient(180deg,#e8d68a,#c8a227);color:#1f1f1f;border-color:#7a6210}
.player-card .pc-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:5px}
.pc-field{display:flex;align-items:center;gap:5px;padding:3px 6px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:2px;font-size:11.5px;overflow:hidden}
.pc-field .fname{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em;flex:none;text-transform:uppercase}
.pc-field .fval{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;
  color:var(--ac);text-align:right;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-field.missing .fval{color:var(--muted);font-style:italic;font-weight:400}
.pp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}

.ocr-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd)}

/* 管理员面板 */
.admin-panel{margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);
  box-shadow:var(--bevel);border-radius:2px;overflow:hidden;display:none;animation:fadeIn .3s both}
.admin-panel.show{display:block}
.admin-head{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:linear-gradient(180deg,#c8a227,#a07a10);color:#fff;font-size:12px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.admin-head .sp{flex:1}
.admin-head .cnt{font-size:11px;padding:1px 8px;background:rgba(255,255,255,.25);
  color:#fff;border-radius:2px;border:1px solid rgba(255,255,255,.35)}
.admin-body{padding:12px 14px}
.admin-pending-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}

.pending-card{background:var(--bg);border:2px solid var(--bd2);border-radius:2px;padding:10px 12px;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both}
.pending-card .pd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pending-card .pd-name{font-size:14px;font-weight:800;color:#2a3a1a;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending-card .pd-time{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pending-card .pd-score{font-size:13px;font-weight:800;color:var(--ac);
  background:var(--acs);padding:1px 8px;border:1px solid var(--ac);border-radius:2px;font-variant-numeric:tabular-nums}
.pending-card .pd-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:4px;margin-bottom:8px;padding:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:2px}
.pending-card .pd-fields .pd-f{display:flex;justify-content:space-between;gap:4px;font-size:10.5px}
.pending-card .pd-fields .pd-f .k{color:var(--muted);font-weight:600}
.pending-card .pd-fields .pd-f .v{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--ac)}
.pending-card .pd-acts{display:flex;gap:6px;flex-wrap:wrap}
.pending-card .pd-acts .btn{flex:none}

.board{background:linear-gradient(135deg,var(--bg2),var(--bg));border:2px solid var(--bd2);
  box-shadow:var(--bevel);border-radius:2px;overflow:hidden}
.board-head{display:grid;grid-template-columns:44px 1fr 110px 190px 40px;gap:0;padding:10px 12px;
  background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;font-size:11.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.3);border-bottom:2px solid #3d521f}
.board-head > div{display:flex;align-items:center}
.board-head .col-score,.board-head .col-acts{justify-content:center}
.board-body{display:flex;flex-direction:column}

.row{display:grid;grid-template-columns:44px 1fr 110px 190px 40px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--bd);transition:background .15s;
  animation:rowIn .3s cubic-bezier(.22,1,.36,1) both}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.row.top1{background:linear-gradient(90deg,rgba(200,162,39,.18),transparent 60%)}
.row.top2{background:linear-gradient(90deg,rgba(180,180,180,.15),transparent 60%)}
.row.top3{background:linear-gradient(90deg,rgba(190,120,60,.15),transparent 60%)}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.row .rank{font-weight:800;font-size:14px;color:var(--muted);text-align:center}
.row.top1 .rank{color:var(--gold)}
.row.top2 .rank{color:#8a8a8a}
.row.top3 .rank{color:#b8722c}
.row .name{font-size:14.5px;font-weight:700;color:#2a3a1a;padding:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;
  display:flex;align-items:center;gap:6px}
.row .name .name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name .fields-badge{flex:none;font-size:10px;font-weight:700;color:var(--ac);background:var(--acs);
  padding:1px 5px;border:1px solid var(--ac);border-radius:2px;cursor:help;letter-spacing:.03em}
.row .name mark{background:var(--gold);color:#1f1f1f;padding:0 2px;border-radius:2px}
.row .name-input{font:inherit;font-weight:700;font-size:14.5px;color:#2a3a1a;width:100%;padding:2px 6px;
  background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);border-radius:2px;outline:none}
.row .name-input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.row .score{font-size:20px;font-weight:800;color:var(--ac);text-align:center;font-variant-numeric:tabular-nums;
  cursor:pointer;padding:2px 4px;border-radius:2px;transition:background .15s}
.row .score:hover{background:var(--acs)}
.row .score.neg{color:var(--dgr)}
.row .score-input{font:inherit;font-weight:800;font-size:20px;color:var(--ac);width:100%;padding:1px 4px;
  text-align:center;background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);
  border-radius:2px;outline:none;font-variant-numeric:tabular-nums}
.row .score-input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.row .acts{display:flex;gap:3px;justify-content:center}

/* ============================================================

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function highlight(name, q){
  if(!q) return esc(name);
  var lower = name.toLowerCase();
  var qLower = q.toLowerCase();
  var idx = lower.indexOf(qLower);
  if(idx === -1) return esc(name);
  return esc(name.slice(0, idx)) + '<mark>' + esc(name.slice(idx, idx + q.length)) + '</mark>' + esc(name.slice(idx + q.length));
}

var toastTimer = null;
function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
}

function formatSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function formatTime(iso){
  try{
    var d = new Date(iso);
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }catch(e){ return ''; }
}

async function submitRequest(playerData){

    score: (playerData.nums[0] !== undefined) ? playerData.nums[0] : 0,

  };

  try{
    var res = await sb.from('pending_requests').insert([payload]).select();
    if(res.error) throw res.error;
    return true;
  }catch(e){
    console.warn('提交失败', e);
    alert('提交失败：' + (e.message || e));
    return false;
  }
}

/* 批准一个申请 */
async function approveRequest(req){
  if(!cloudReady || !isAdmin) return;
  try{
    /* 写入 approved_players（若同名已存在则更新） */
    var existing = await sb.from('approved_players').select('id').eq('name', req.name).maybeSingle();
    if(existing.data && existing.data.id){
      var upd = await sb.from('approved_players').update({
        score: req.score,
        fields: req.fields,
        approved_at: new Date().toISOString()
      }).eq('id', existing.data.id);
      if(upd.error) throw upd.error;
    } else {
      var ins = await sb.from('approved_players').insert([{
        name: req.name,
        score: req.score,
        fields: req.fields
      }]);
      if(ins.error) throw ins.error;
    }
    /* 从 pending 删除 */
    var del = await sb.from('pending_requests').delete().eq('id', req.id);
    if(del.error) throw del.error;

    toast('已批准「' + req.name + '」');
    await fetchApprovedPlayers();
    await fetchPendingList();
  }catch(e){
    console.warn('批准失败', e);
    alert('批准失败：' + (e.message || e));
  }
}

async function rejectRequest(req){
  if(!cloudReady || !isAdmin) return;
  if(!confirm('确定拒绝「' + req.name + '」的申请吗？')) return;
  try{
    var del = await sb.from('pending_requests').delete().eq('id', req.id);
    if(del.error) throw del.error;
    toast('已拒绝「' + req.name + '」');
    await fetchPendingList();

}

/* ============================================================
   OCR
   ============================================================ */
function setOCRDot(cls){ if(ocrDot) ocrDot.className = 'status-dot' + (cls ? ' ' + cls : ''); }
function openOCRPanel(){ if(ocrPanel) ocrPanel.classList.add('show'); }
function closeOCRPanel(){ if(ocrPanel) ocrPanel.classList.remove('show'); }
function updateOCRStatus(html){ if(ocrStatus) ocrStatus.innerHTML = html; }

function runOCR(dataUrl){
  if(!dataUrl) return;
  openOCRPanel();

  if(typeof Tesseract === 'undefined'){
    setOCRDot('bad');
    updateOCRStatus('<span class="badge bad">✕</span> 识别库未加载，请检查网络后刷新');
    return;
  }
  if(ocrState.running) return;
  ocrState.running = true;
  ocrState.text = '';
  ocrState.players = [];

  setOCRDot('busy');
  updateOCRStatus('<span class="badge">⏳</span> 正在加载识别引擎…');
  ocrProgressWrap.hidden = false;
  ocrProgressBar.style.width = '0%';
  ocrText.hidden = true;
  playersPreview.hidden = true;
  ocrActions.hidden = true;

  Tesseract.recognize(dataUrl, 'eng', {
    logger: function(m){
      if(!m) return;
      if(m.status === 'loading tesseract core') updateOCRStatus('<span class="badge">⏳</span> 加载核心…');
      else if(m.status === 'initializing tesseract') updateOCRStatus('<span class="badge">⏳</span> 初始化…');
      else if(m.status === 'loading language traineddata'){
        var p = Math.round((m.progress || 0) * 100);
        updateOCRStatus('<span class="badge">⏳</span> 下载语言包… ' + p + '%');
        ocrProgressBar.style.width = p + '%';
      } else if(m.status === 'initializing api') updateOCRStatus('<span class="badge">⏳</span> 准备识别…');
      else if(m.status === 'recognizing text'){
        var p2 = Math.round((m.progress || 0) * 100);
        updateOCRStatus('<span class="badge">⏳</span> 识别中… ' + p2 + '%');
        ocrProgressBar.style.width = p2 + '%';
      }
    }
  }).then(function(result){
    ocrState.running = false;
    var text = (result && result.data && result.data.text) || '';
    ocrState.text = text;
    processOCRResult(text);
  }).catch(function(err){
    ocrState.running = false;
    console.warn('OCR 失败', err);
    setOCRDot('bad');
    updateOCRStatus('<span class="badge bad">✕</span> 识别失败：' + esc(err.message || err));
    ocrProgressWrap.hidden = true;
  });
}

function processOCRResult(text){
  var normalized = String(text || '').replace(/\r/g, '').replace(/[ \t]+/g, ' ').trim();
  if(!normalized){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge">?</span> 没识别出任何文字，图片可能太模糊');
    ocrProgressWrap.hidden = true;
    return;
  }

  var kwPat = /tu\s*ber\s*b\s*f/i;
  var m = kwPat.exec(normalized);
  var highlighted;
  if(m){
    highlighted = esc(normalized.slice(0, m.index)) + '<mark class="gold">' + esc(normalized.slice(m.index, m.index + m[0].length)) + '</mark>' + esc(normalized.slice(m.index + m[0].length));
  } else {
    highlighted = esc(normalized);
  }
  ocrText.innerHTML = highlighted;
  ocrText.hidden = false;
  ocrProgressWrap.hidden = true;
  ocrActions.hidden = false;

  if(!m){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge bad">✕</span> 未检测到关键字 <strong>TuberBF</strong>');
    return;
  }

  var lines = normalized.split('\n');
  var kwIdx = -1;
  for(var i = 0; i < lines.length; i++){
    if(kwPat.test(lines[i])){ kwIdx = i; break; }
  }
  if(kwIdx === -1){ setOCRDot('warn'); updateOCRStatus('<span class="badge bad">✕</span> 找不到 TuberBF 行'); return; }

  var parsed = [];
  var end = Math.min(lines.length, kwIdx + 81);
  for(var j = kwIdx + 1; j < end; j++){
    var line = lines[j].trim();
    if(!line) continue;
    if(kwPat.test(line)) break;
    var p = parsePlayerLine(line);
    if(p){
      parsed.push({ name: p.name, nums: p.nums, submitting: false, submitted: false });
      if(parsed.length >= 60) break;
    }
  }
  ocrState.players = parsed;

  if(parsed.length === 0){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge gold">✓</span> 检测到 TuberBF，但下一行起没找到"名字 + 数字"结构');
    return;
  }

  setOCRDot('ok');
  updateOCRStatus('<span class="badge gold">✓</span> 解析出 <strong>' + parsed.length + '</strong> 个玩家 · 点「提交申请」送审');
  renderPlayersPreview();
}

function parsePlayerLine(line){
  var parts = line.split(/\s+/).filter(Boolean);
  if(parts.length < 3) return null;
  var nums = [];
  var i = parts.length - 1;
  while(i >= 0 && /^-?\d+$/.test(parts[i])){
    nums.unshift(parseInt(parts[i], 10));
    i--;
  }
  if(nums.length < 2) return null;
  var name = parts.slice(0, i + 1).join(' ').trim();
  if(!name) return null;
  if(name.length > 40) name = name.slice(0, 40);
  if(nums.length > FIELD_COUNT) nums = nums.slice(0, FIELD_COUNT);
  return { name: name, nums: nums };
}

playersPreview.addEventListener('click', async function(e){
  /* 单个提交 */
  var subBtn = e.target.closest('[data-submit]');
  if(subBtn){
    var idx = parseInt(subBtn.getAttribute('data-submit'), 10);
    var p = ocrState.players[idx];
    if(!p || p.submitted || p.submitting) return;

    if(!cloudReady){
      alert('未配置云端。请先按照说明配置 Supabase。');
      return;
    }
    p.submitting = true;
    renderPlayersPreview();
    var ok = await submitRequest(p);
    p.submitting = false;
    if(ok){
      p.submitted = true;
      toast('「' + p.name + '」已提交，等待管理员审核');
    }
    renderPlayersPreview();
    return;
  }

  /* 全部提交 */
  if(e.target.closest('#ppSubmitAll')){
    var todo = ocrState.players.filter(function(x){ return !x.submitted && !x.submitting; });
    if(todo.length === 0){ toast('都已经提交过了'); return; }
    if(!cloudReady){ alert('未配置云端。请先配置 Supabase。'); return; }
    if(!confirm('提交 ' + todo.length + ' 条申请？管理员审核通过后才会出现在计分板。')) return;

    var okCount = 0;
    for(var i = 0; i < todo.length; i++){
      var item = todo[i];
      item.submitting = true;
      renderPlayersPreview();
      var ok = await submitRequest(item);
      item.submitting = false;
      if(ok){ item.submitted = true; okCount++; }
      renderPlayersPreview();
    }
    toast('已提交 ' + okCount + '/' + todo.length + ' 条申请');
  }
});

ocrCopy.addEventListener('click', function(){
  var text = ocrState.text || '';
  if(!text){ toast('没有可复制的内容'); return; }
  try{
    navigator.clipboard.writeText(text).then(function(){ toast('已复制识别文字'); }).catch(function(){ fallbackCopy(text); });
  }catch(e){ fallbackCopy(text); }
});
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制识别文字'); }catch(e){ alert('复制失败'); }
  document.body.removeChild(ta);
}

function renderStats(){
  if(!statsBar) return;
  var total = players.length;
  var sum = 0, max = 0;
  players.forEach(function(p){ sum += p.score; if(p.score > max) max = p.score; });
  var avg = total > 0 ? Math.round(sum / total * 10) / 10 : 0;
  var maxP = null;
  players.forEach(function(p){ if(!maxP || p.score > maxP.score) maxP = p; });

  var html = '';
  html += '<div class="stat"><span>总人数</span><strong>' + total + '</strong></div>';
  if(total > 0){
    html += '<div class="stat"><span>tuber 总和</span><strong>' + sum + '</strong></div>';
    html += '<div class="stat"><span>平均</span><strong>' + avg + '</strong></div>';
    html += '<div class="stat gold"><span>👑 最高</span><strong>' + esc(maxP.name) + ' · ' + max + '</strong></div>';
  }
  statsBar.innerHTML = html;
}

function getTop3Ids(){
  var sorted = players.slice().sort(function(a, b){ return b.score - a.score; });
  var t = {};
  if(sorted[0]) t[sorted[0].id] = 1;
  if(sorted[1]) t[sorted[1].id] = 2;
  if(sorted[2]) t[sorted[2].id] = 3;
  return t;
}

function renderBoard(){
  if(!boardBody) return;

  if(players.length === 0){
    boardBody.innerHTML =
      '<div class="empty">' +
        '<span class="ic">📭</span>' +
        '<div class="lead">' +
          (cloudReady
            ? '还没有已批准的玩家<br>上传图片识别后提交申请，等待管理员审核'
            : '未配置云端 · 上传图片或手动添加玩家') +
        '</div>' +
      '</div>';
    return;
  }

  var q = searchQuery.trim().toLowerCase();
  var visible = players;
  if(q){
    visible = players.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1; });
  }
  if(visible.length === 0){
    boardBody.innerHTML =
      '<div class="empty"><span class="ic">🔍</span><div class="lead">没有匹配「' + esc(searchQuery) + '」的玩家</div></div>';
    return;
  }

  var topIds = q ? {} : getTop3Ids();

  var html = '';
  visible.forEach(function(p){
    var rank = players.indexOf(p) + 1;
    var rc = '';
    var tr = topIds[p.id];
    if(tr === 1) rc = 'top1';
    else if(tr === 2) rc = 'top2';
    else if(tr === 3) rc = 'top3';

    var sc = p.score < 0 ? ' neg' : '';
    var nameHtml = highlight(p.name, q);
    var badge = (p.fields && Object.keys(p.fields).length > 0)
      ? '<span class="fields-badge" data-fields="' + esc(p.id) + '" title="点击查看完整字段">13 项</span>'
      : '';

    html += '<div class="row ' + rc + '" data-id="' + esc(p.id) + '">';
    html += '<div class="rank">' + rank + '</div>';
    html += '<div class="name" data-action="edit-name" title="' + (isAdmin ? '点击编辑名字' : '') + '">';
    html += '<span class="name-txt">' + nameHtml + '</span>' + badge;
    html += '</div>';
    html += '<div class="score' + sc + '" data-action="edit-score" title="' + (isAdmin ? '点击编辑分数' : '') + '">' + p.score + '</div>';

    if(isAdmin){
      html += '<div class="acts">';
      html += '<button class="act minus" data-action="dec" title="减 1">−</button>';
      html += '<button class="act plus" data-action="inc" title="加 1">＋</button>';
      html += '<button class="act minus" data-action="dec5" title="减 5">−5</button>';
      html += '<button class="act plus" data-action="inc5" title="加 5">+5</button>';
      html += '</div>';
      html += '<button class="act del" data-action="del" title="删除">✕</button>';
    } else {
      html += '<div class="acts readonly"><span style="font-size:11px;color:var(--muted)">只读</span></div>';
      html += '<span></span>';
    }
    html += '</div>';
  });

  boardBody.innerHTML = html;
}

function findPlayer(id){
  for(var i = 0; i < players.length; i++) if(players[i].id === id) return players[i];
  return null;
}

function changeScore(id, delta){
  if(!isAdmin){ toast('只有管理员能修改'); return; }
  var p = findPlayer(id);
  if(!p) return;
  var newScore = p.score + delta;
  var newFields = Object.assign({}, p.fields || {});
  newFields.tuber = newScore;
  updatePlayer(id, { score: newScore, fields: newFields });
}

function deletePlayerConfirm(id){
  if(!isAdmin) return;

  if(!p) return;
  if(!confirm('确定删除「' + p.name + '」吗？此操作对所有人生效。')) return;
  removePlayer(id);
}

function editName(el, id){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p || !el) return;
  var nameTxt = el.querySelector('.name-txt');
  if(!nameTxt) return;

  var oldName = p.name;
  var input = document.createElement('input');
  input.type = 'text'; input.className = 'name-input'; input.value = oldName; input.maxLength = 40;
  nameTxt.innerHTML = ''; nameTxt.appendChild(input);
  input.focus(); input.select();

  var done = false;
  function finish(save){
    if(done) return; done = true;
    var n = input.value.trim();
    if(save && n && n !== oldName){
      updatePlayer(id, { name: n.slice(0, 40) });
    } else render();
  }
  input.addEventListener('blur', function(){ finish(true); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
}

function editScore(el, id){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p || !el) return;
  var oldVal = p.score;
  var input = document.createElement('input');
  input.type = 'number'; input.className = 'score-input'; input.value = oldVal;
  el.innerHTML = ''; el.appendChild(input);
  input.focus(); input.select();

  var done = false;
  function finish(save){
    if(done) return; done = true;
    if(save){
      var v = parseInt(input.value, 10);
      if(!isNaN(v)){
        var f = Object.assign({}, p.fields || {});
        f.tuber = v;
        updatePlayer(id, { score: v, fields: f });
        return;
      }
    }
    render();
  }
  input.addEventListener('blur', function(){ finish(true); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
}

/* ============================================================
   字段详情
   ============================================================ */
function openFieldsDetail(player){
  fieldsTitle.textContent = player.name + ' · 字段详情';
  var html = '';
  if(!player.fields || Object.keys(player.fields).length === 0){
    html = '<p style="color:var(--muted);text-align:center;padding:20px">没有字段数据</p>';
  } else {
    FIELD_DEFS.forEach(function(f){
      var v = player.fields[f.key];
      html += '<div class="field-row"><span class="fk">' + esc(f.label) + '</span><span class="fv">' + (v === undefined ? '—' : esc(v)) + '</span></div>';
    });
  }
  fieldsBody.innerHTML = html;
  fieldsOv.classList.add('show');
}
function closeFieldsDetail(){ fieldsOv.classList.remove('show'); }

fieldsOv.addEventListener('click', function(e){ if(e.target === fieldsOv) closeFieldsDetail(); });

/* ============================================================
   事件
   ============================================================ */
btnAdd.addEventListener('click', function(){

  newName.value = ''; newScore.value = '0';
});

boardBody.addEventListener('click', function(e){
  var badge = e.target.closest('[data-fields]');
  if(badge){
    e.stopPropagation();
    var fid = badge.getAttribute('data-fields');
    var fp = findPlayer(fid);
    if(fp) openFieldsDetail(fp);
    return;
  }
  var row = e.target.closest('.row');
  if(!row) return;
  var id = row.getAttribute('data-id');
  if(!id) return;
  var act = e.target.closest('[data-action]');
  if(!act) return;
  var a = act.getAttribute('data-action');
  if(a === 'inc') changeScore(id, 1);
  else if(a === 'dec') changeScore(id, -1);
  else if(a === 'inc5') changeScore(id, 5);
  else if(a === 'dec5') changeScore(id, -5);
  else if(a === 'del') deletePlayerConfirm(id);
  else if(a === 'edit-name') editName(act, id);
  else if(a === 'edit-score') editScore(act, id);
});

imageEmpty.addEventListener('click', function(){ imageInput.click(); });

loginSubmit.addEventListener('click', async function(){

async function applyAdminState(admin){

  btnLogin.style.display = isAdmin ? 'none' : 'grid';
  btnLogout.style.display = isAdmin ? 'grid' : 'none';
  addRow.classList.toggle('show', isAdmin);

/* ============================================================
   背景装饰
   ============================================================ */
var particleCtx = null, particles = [], particleRunning = true, pW = 0, pH = 0, pDpr = 1;
var themeColors = ['61,82,31','106,140,60','140,180,60','180,150,80'];

function readThemeColors(){
  var cs = getComputedStyle(document.documentElement);
  themeColors = [
    (cs.getPropertyValue('--p1') || '61,82,31').trim(),
    (cs.getPropertyValue('--p2') || '106,140,60').trim(),
    (cs.getPropertyValue('--p3') || '140,180,60').trim(),
    (cs.getPropertyValue('--p4') || '180,150,80').trim()
  ];
}

function initParticles(){
  var canvas = document.getElementById('particles');
  if(!canvas || !canvas.getContext) return;
  particleCtx = canvas.getContext('2d');
  pDpr = Math.min(window.devicePixelRatio || 1, 2);
  resizeCanvas();
  readThemeColors();
  var count = Math.max(10, Math.min(24, Math.floor((pW * pH) / 50000)));
  particles = [];
  for(var i = 0; i < count; i++){
    particles.push({
      x: Math.random() * pW, y: Math.random() * pH,
      size: 4 + Math.random() * 9,
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.014,
      alpha: 0.1 + Math.random() * 0.25,
      alphaPhase: Math.random() * Math.PI * 2,
      alphaSpeed: 0.008 + Math.random() * 0.016,
      hueIdx: Math.floor(Math.random() * 4),
      hueMix: Math.random(),
      glow: Math.random() < 0.15
    });
  }
  if(particleRunning) drawParticles();
}

function resizeCanvas(){
  var canvas = document.getElementById('particles'); if(!canvas) return;
  pW = window.innerWidth; pH = window.innerHeight;
  canvas.width = pW * pDpr; canvas.height = pH * pDpr;
  canvas.style.width = pW + 'px'; canvas.style.height = pH + 'px';
  if(particleCtx) particleCtx.setTransform(pDpr, 0, 0, pDpr, 0, 0);
}

function drawParticles(){
  if(!particleRunning || !particleCtx) return;
  particleCtx.clearRect(0, 0, pW, pH);
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.x < -40) p.x = pW + 40; else if(p.x > pW + 40) p.x = -40;
    if(p.y < -40) p.y = pH + 40; else if(p.y > pH + 40) p.y = -40;
    p.alphaPhase += p.alphaSpeed;
    var a = p.alpha * (0.55 + 0.45 * Math.sin(p.alphaPhase));
    a = Math.max(0.04, Math.min(0.5, a));
    var c1 = (themeColors[p.hueIdx] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var c2 = (themeColors[(p.hueIdx + 1) % 4] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var mix = p.hueMix;
    var r = Math.round(c1[0] * (1 - mix) + c2[0] * mix);
    var g = Math.round(c1[1] * (1 - mix) + c2[1] * mix);
    var b = Math.round(c1[2] * (1 - mix) + c2[2] * mix);
    particleCtx.save();
    particleCtx.translate(p.x, p.y);
    particleCtx.rotate(p.rot);
    if(p.glow){
      particleCtx.shadowBlur = 10;
      particleCtx.shadowColor = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.8) + ')';
    }
    var s = p.size, hs = s / 2, rad = Math.min(3, s / 3.5);
    var grad = particleCtx.createLinearGradient(-hs, -hs, hs, hs);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.3) + ')');
    particleCtx.fillStyle = grad;
    particleCtx.beginPath();
    if(particleCtx.roundRect) particleCtx.roundRect(-hs, -hs, s, s, rad);
    else particleCtx.rect(-hs, -hs, s, s);
    particleCtx.fill();
    particleCtx.strokeStyle = 'rgba(255,255,255,' + (a * 0.2) + ')';
    particleCtx.lineWidth = 0.5;
    particleCtx.stroke();
    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

/* ============================================================
   启动
   ============================================================ */
async function boot(){
  /* 恢复上次上传的图片 */
  try{
    var img = localStorage.getItem(K_IMAGE);
    if(img && img.indexOf('data:image/') === 0) boardImage = img;
  }catch(e){}
  updateImageUI();
  initParticles();

  /* 初始化云端 */
  initSupabase();
  updateCloudBanner();

  if(cloudReady){
    /* 监听登录状态 */
    sb.auth.onAuthStateChange(function(event, session){
      applyAdminState(!!(session && session.user));
    });
    /* 检查当前会话 */
    try{
      var s = await sb.auth.getSession();
      await applyAdminState(!!(s.data && s.data.session && s.data.session.user));
    }catch(e){
      await applyAdminState(false);
    }
    /* 拉取数据 */
    await fetchApprovedPlayers();
    /* Realtime 订阅 */
    setupRealtime();
  } else {
    /* 未配置云端：只渲染空表 */
    render();
    applyAdminState(false);
  }

  /* 如果有已保存的图片，自动识别 */
  if(boardImage){
    setTimeout(function(){ runOCR(boardImage); }, 400);
  }

  window.addEventListener('resize', function(){ resizeCanvas(); }, { passive: true });
  document.addEventListener('visibilitychange', function(){
    particleRunning = !document.hidden;
    if(particleRunning) drawParticles();
  });

  /* 快捷键 */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(lightbox.classList.contains('show')){ closeLightbox(); return; }
      if(fieldsOv.classList.contains('show')){ closeFieldsDetail(); return; }
      if(loginOv.classList.contains('show')){ closeLogin(); return; }
      if(document.activeElement === searchInput){ searchClear.click(); return; }
    }
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      searchInput.focus(); searchInput.select();
    }
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
