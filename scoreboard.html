<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备份计分板 · 红石的小工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;--bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--dgr:#a02020;--ok:#2d7a2d;--gold:#c8a227;--bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);--bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);--r:2px;--font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--blob1:rgba(61,82,31,.10);--blob2:rgba(106,140,60,.07);--blob3:rgba(180,150,80,.06);--grid:rgba(61,82,31,.04);--p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;--hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px)}
.b1{width:400px;height:400px;background:var(--blob1);top:-140px;left:-120px;animation:d1 28s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--blob2);bottom:-180px;right:-160px;animation:d2 34s ease-in-out infinite}
.b3{width:320px;height:320px;background:var(--blob3);top:38%;left:52%;animation:d3 40s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(60px,50px) scale(1.08);opacity:1}}
@keyframes d2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-70px,-60px) scale(1.05);opacity:.95}}
@keyframes d3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-60px,-70px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.5}
.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(180deg,#56682c,#3d521f);border-bottom:2px solid #2a3a1a;color:#fff;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.topbar .logo-icon{font-size:16px}
.topbar .sp{flex:1}
.topbar .icon{display:grid;place-items:center;height:30px;padding:0 10px;font-size:12.5px;font-family:inherit;font-weight:600;color:rgba(255,255,255,.9);background:transparent;border:none;border-radius:var(--r);cursor:pointer;text-decoration:none;white-space:nowrap}
.topbar .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.topbar .icon.gold{background:linear-gradient(180deg,#c8a227,#a07a10);color:#fff}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;font-size:13px;font-family:inherit;font-weight:600;color:#1f1f1f;background:linear-gradient(180deg,#e8e2cc,#d4ceb8);border:1px solid #4a4a3a;border-radius:var(--r);cursor:pointer;box-shadow:var(--bevel);transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){box-shadow:var(--bevel-in)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:#fff;background:linear-gradient(180deg,#7a9c3c,#56682c)}
.btn.d{color:var(--dgr);background:transparent;box-shadow:none}
.btn.d:hover:not(:disabled){background:rgba(160,32,32,.08);filter:none}
.btn.gold{color:#1f1f1f;background:linear-gradient(180deg,#e8d68a,#c8a227);border-color:#7a6210}
.btn.sm{padding:4px 10px;font-size:12px}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:72px 20px 60px}
.page-head{margin:0 auto 20px;text-align:center;padding:14px 0}
.page-head h1{margin:0 0 6px;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head .sub{margin:0;font-size:13px;color:var(--muted)}
.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 16px}
.stat{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg2);border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel);font-size:12.5px;color:var(--muted)}
.stat strong{color:var(--ac);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.gold strong{color:var(--gold)}
.banner{margin:0 auto 14px;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid var(--bd2);border-radius:2px;font-size:12.5px;background:var(--bg2);box-shadow:var(--bevel)}
.banner .cdot{width:10px;height:10px;flex:none;background:#a4d468;box-shadow:0 0 0 2px rgba(164,212,104,.35)}
.banner .cdot.warn{background:#e8a840;box-shadow:0 0 0 2px rgba(232,168,64,.3)}
.banner .cdot.bad{background:#e05050;box-shadow:0 0 0 2px rgba(224,80,80,.3)}
.banner .sp{flex:1}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px}
.toolbar .search{position:relative;flex:1;min-width:180px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.toolbar .search input{width:100%;height:32px;padding:0 10px 0 32px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);border-radius:2px;outline:none}
.toolbar .search input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.toolbar .search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;display:none;place-items:center;font-size:12px;color:var(--muted);background:transparent;border:none;border-radius:2px;cursor:pointer}
.toolbar .search .clear:hover{background:var(--bg3);color:var(--text)}
.toolbar .search.has-value .clear{display:grid}
.image-panel{position:relative;margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px;overflow:hidden;min-height:140px;display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.image-panel:hover{border-color:var(--ac)}
.image-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 20px;color:var(--muted);cursor:pointer;width:100%;height:100%;text-align:center}
.image-empty:hover{background:var(--bg3)}
.image-empty .ic{font-size:40px;opacity:.5;line-height:1;display:block}
.image-empty .txt{font-size:13.5px}
.image-empty .hint{font-size:11.5px;opacity:.7}
.image-display{display:none;max-width:100%;max-height:420px;object-fit:contain;cursor:zoom-in}
.image-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;font-size:14px;color:#fff;background:rgba(160,32,32,.85);border:2px solid rgba(0,0,0,.5);border-radius:2px;cursor:pointer;z-index:2}
.image-remove:hover{background:rgba(200,40,40,1)}
.ocr-panel{margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px;overflow:hidden;display:none}
.ocr-panel.show{display:block;animation:fi .3s both}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ocr-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ocr-head .status-dot{width:10px;height:10px;flex:none;background:#8a8a8a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.ocr-head .status-dot.busy{background:#d4a72c;animation:pl 1s infinite}
.ocr-head .status-dot.ok{background:#a4d468;box-shadow:0 0 0 2px rgba(164,212,104,.4)}
.ocr-head .status-dot.warn{background:#e8a840}
.ocr-head .status-dot.bad{background:#e05050}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
.ocr-head .sp{flex:1}
.ocr-head .icon-x{width:24px;height:24px;display:grid;place-items:center;font-size:12px;color:rgba(255,255,255,.85);background:transparent;border:none;border-radius:2px;cursor:pointer}
.ocr-head .icon-x:hover{background:rgba(0,0,0,.2);color:#fff}
.ocr-body{padding:12px 14px}
.ocr-status{font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ocr-status .badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;font-size:11px;font-weight:700;background:var(--acs);border:1px solid var(--ac);color:var(--ac)}
.ocr-status .badge.bad{background:rgba(160,32,32,.1);border-color:var(--dgr);color:var(--dgr)}
.ocr-status .badge.gold{background:linear-gradient(180deg,#e8d68a,#c8a227);border-color:#7a6210;color:#1f1f1f}
.ocr-progress{height:10px;background:var(--bg3);border:1px solid var(--bd);border-radius:2px;overflow:hidden;margin-bottom:10px}
.ocr-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7a9c3c,#a4d468);transition:width .2s}
.ocr-text{padding:10px 12px;background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);border-radius:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.65;max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.ocr-text mark{background:#d4a72c;color:#1f1f1f;padding:0 2px;border-radius:2px;font-weight:700}
.ocr-text mark.gold{background:linear-gradient(180deg,#e8d68a,#c8a227)}
.ocr-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.pp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;margin-top:12px;margin-bottom:8px;background:linear-gradient(180deg,#e8e2cc,#d4ceb8);border:1px solid var(--bd2);border-radius:2px;font-size:12px;font-weight:700;color:#2a3a1a}
.pp-head .count{font-size:11px;padding:1px 8px;background:var(--acs);color:var(--ac);border:1px solid var(--ac);border-radius:2px}
.pp-head .sp{flex:1}
.player-card{background:var(--bg);border:2px solid var(--bd2);box-shadow:var(--bevel-in);border-radius:2px;padding:10px 12px;margin-bottom:8px}
.player-card .pc-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px dashed var(--bd);flex-wrap:wrap}
.player-card .pc-name{font-size:15px;font-weight:800;color:#2a3a1a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;padding:2px 4px;border-radius:2px}
.player-card .pc-name:hover{background:var(--bg3)}
.player-card .pc-name .idx{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);background:var(--acs);padding:1px 6px;margin-right:6px;border-radius:2px}
.player-card .pc-add{flex:none;padding:4px 12px;font-size:11.5px;font-family:inherit;font-weight:700;color:#1f1f1f;background:linear-gradient(180deg,#e8d68a,#c8a227);border:1px solid #7a6210;border-radius:2px;cursor:pointer;box-shadow:var(--bevel)}
.player-card .pc-add:hover:not(:disabled){filter:brightness(1.08)}
.player-card .pc-add:active:not(:disabled){box-shadow:var(--bevel-in)}
.player-card .pc-add:disabled{opacity:.6;cursor:not-allowed}
.player-card .pc-add.done{background:linear-gradient(180deg,#a4d468,#7a9c3c)}
.player-card .pc-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:5px}
.pc-field{display:flex;align-items:center;gap:5px;padding:3px 6px;background:var(--bg2);border:1px solid var(--bd);border-radius:2px;font-size:11.5px;overflow:hidden;cursor:pointer;transition:background .15s}
.pc-field:hover{background:var(--acs);border-color:var(--ac)}
.pc-field .fname{font-size:10px;font-weight:700;color:var(--muted);flex:none;text-transform:uppercase}
.pc-field .fval{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--ac);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-field.missing .fval{color:var(--muted);font-style:italic;font-weight:400}
.pp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)}
.admin-panel{margin:0 auto 14px;background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px;overflow:hidden;display:none}
.admin-panel.show{display:block;animation:fi .3s both}
.admin-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,#c8a227,#a07a10);color:#fff;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.admin-head .sp{flex:1}
.admin-head .cnt{font-size:11px;padding:1px 8px;background:rgba(255,255,255,.25);color:#fff;border-radius:2px;border:1px solid rgba(255,255,255,.35)}
.admin-body{padding:12px 14px}
.admin-pending-list{display:flex;flex-direction:column;gap:8px;max-height:600px;overflow-y:auto}
.pending-card{background:var(--bg);border:2px solid var(--bd2);border-radius:2px;padding:10px 12px}
.pending-card .pd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pending-card .pd-name{font-size:14px;font-weight:800;color:#2a3a1a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending-card .pd-time{font-size:10.5px;color:var(--muted)}
.pending-card .pd-score{font-size:13px;font-weight:800;color:var(--ac);background:var(--acs);padding:1px 8px;border:1px solid var(--ac);border-radius:2px;font-variant-numeric:tabular-nums}
.pending-card .pd-img{display:block;max-width:100%;max-height:220px;border:2px solid var(--bd2);border-radius:2px;margin-bottom:8px;cursor:zoom-in}
.pending-card .pd-img:hover{border-color:var(--ac)}
.pending-card .pd-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;margin-bottom:8px;padding:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:2px}
.pending-card .pd-fields .pd-f{display:flex;justify-content:space-between;gap:4px;font-size:10.5px}
.pending-card .pd-fields .pd-f .k{color:var(--muted);font-weight:600}
.pending-card .pd-fields .pd-f .v{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.pending-card .pd-acts{display:flex;gap:6px;flex-wrap:wrap}
.board{background:linear-gradient(135deg,var(--bg2),var(--bg));border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px;overflow:hidden}
.board-head{display:grid;grid-template-columns:44px 1fr 130px 190px 40px;gap:0;padding:10px 12px;background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:1px 1px 0 rgba(0,0,0,.3);border-bottom:2px solid #3d521f}
.board-head>div{display:flex;align-items:center}
.board-head .col-score,.board-head .col-acts{justify-content:center}
.board-body{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:44px 1fr 130px 190px 40px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.row.top1{background:linear-gradient(90deg,rgba(200,162,39,.18),transparent 60%)}
.row.top2{background:linear-gradient(90deg,rgba(180,180,180,.15),transparent 60%)}
.row.top3{background:linear-gradient(90deg,rgba(190,120,60,.15),transparent 60%)}
.row .rank{font-weight:800;font-size:14px;color:var(--muted);text-align:center}
.row.top1 .rank{color:var(--gold)}
.row.top2 .rank{color:#8a8a8a}
.row.top3 .rank{color:#b8722c}
.row .name{font-size:14.5px;font-weight:700;color:#2a3a1a;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;display:flex;align-items:center;gap:6px}
.row .name .name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name .fields-badge{flex:none;font-size:10px;font-weight:700;color:var(--ac);background:var(--acs);padding:1px 5px;border:1px solid var(--ac);border-radius:2px;cursor:help}
.row .name mark{background:var(--gold);color:#1f1f1f;padding:0 2px;border-radius:2px}
.row .name-input{font:inherit;font-weight:700;font-size:14.5px;color:#2a3a1a;width:100%;padding:2px 6px;background:var(--bg);border:2px solid var(--bd2);border-radius:2px;outline:none}
.row .name-input:focus{border-color:var(--ac)}
.row .score{font-size:17px;font-weight:800;color:var(--ac);text-align:center;cursor:pointer;padding:2px 4px;border-radius:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.row .score:hover{background:var(--acs)}
.row .score.neg{color:var(--dgr)}
.row .score-input{font:inherit;font-weight:800;font-size:15px;color:var(--ac);width:100%;padding:1px 4px;text-align:center;background:var(--bg);border:2px solid var(--bd2);border-radius:2px;outline:none;font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:3px;justify-content:center}
.act{display:grid;place-items:center;width:26px;height:26px;font-size:13px;font-family:inherit;font-weight:700;color:#1f1f1f;background:linear-gradient(180deg,#e8e2cc,#d4ceb8);border:1px solid #4a4a3a;box-shadow:var(--bevel);border-radius:2px;cursor:pointer}
.act:hover{filter:brightness(1.1)}
.act:active{box-shadow:var(--bevel-in)}
.act.plus{background:linear-gradient(180deg,#a4d468,#7a9c3c);color:#fff}
.act.minus{background:linear-gradient(180deg,#e88a8a,#c04040);color:#fff}
.act.del{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.act.del:hover{color:var(--dgr);background:rgba(160,32,32,.08)}
.row .acts.readonly{opacity:.55;pointer-events:none}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:48px;opacity:.4;margin-bottom:10px;display:block}
.empty .lead{font-size:14px;line-height:1.8}
.add-row{display:flex;gap:8px;align-items:center;padding:12px;background:var(--bg2);border:2px solid var(--bd2);border-top:none;box-shadow:var(--bevel);border-radius:0 0 2px 2px;display:none}
.add-row.show{display:flex}
.add-row input{flex:1;height:34px;padding:0 10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);border:2px solid var(--bd2);border-radius:2px;outline:none}
.add-row input:focus{border-color:var(--ac)}
.add-row .num-input{width:80px;flex:none;text-align:center}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:150;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:440px;max-height:calc(100vh - 32px);background:var(--bg);border:2px solid var(--bd2);border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3);overflow:hidden;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.ov.show .pnl{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;border-bottom:2px solid #3d521f;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ph.gold{background:linear-gradient(180deg,#c8a227,#a07a10);border-bottom-color:#7a6210}

/* ★ 图片压缩：把大图缩到 800KB 以内，用于上传到 Supabase */
function compressImage(dataUrl, maxBytes){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var scale = 1;
      var maxDim = 1200;
      if(img.naturalWidth > maxDim || img.naturalHeight > maxDim){
        scale = Math.min(maxDim / img.naturalWidth, maxDim / img.naturalHeight);
      }
      var w = Math.round(img.naturalWidth * scale);
      var h = Math.round(img.naturalHeight * scale);
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      /* 逐步降低质量直到满足大小 */
      var quality = 0.85;
      var result = cv.toDataURL('image/jpeg', quality);
      while(result.length > maxBytes && quality > 0.3){
        quality -= 0.15;
        result = cv.toDataURL('image/jpeg', quality);
      }
      resolve(result);
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}

async function fetchApprovedPlayers(){
  if(!cloudReady) return;
  try{
    var res = await sb.from('approved_players').select('*').order('created_at',{ascending:false});
    if(res.error) throw res.error;
    players = (res.data||[]).map(function(p){
      return { id:p.id, name:p.name, score:String(p.score==null?'0':p.score), fields:p.fields||{}, image:p.image_data||'' };
    });
    /* 按数值大小排序 */
    players.sort(function(a,b){
      var an = parseFloat(a.score) || 0;
      var bn = parseFloat(b.score) || 0;
      return bn - an;
    });
    render();
  }catch(e){ toast('读取失败：'+(e.message||e)); }
}
async function fetchPendingList(){

async function submitRequest(p){
  if(!cloudReady){ toast('云端未连接'); return false; }

  /* 所有数值统一转成字符串，避免 integer 溢出 */
  var fields={};
  FIELD_DEFS.forEach(function(f,fi){ 
    if(p.nums[fi]!==undefined) fields[f.key] = String(p.nums[fi]); 
  });

  var payload = { 
    name: String(p.name), 
    score: (p.nums[0]!==undefined) ? String(p.nums[0]) : '0', 
    fields: fields
  };

  /* 压缩并带上原图 */
  if(boardImage){
    try{
      payload.image_data = await compressImage(boardImage, MAX_UPLOAD_IMAGE);
    }catch(e){ console.warn('图片压缩失败', e); }
  }

  try{
    var res = await sb.from('pending_requests').insert([payload]).select();
    if(res.error) throw res.error;
    return true;
  }catch(e){ console.warn('提交失败',e); alert('提交失败：'+(e.message||e)); return false; }
}
async function approveRequest(req){

    } else {

function invertImage(dataUrl){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var d = ctx.getImageData(0, 0, cv.width, cv.height);
      var a = d.data;
      for(var i = 0; i < a.length; i += 4){
        a[i] = 255 - a[i]; a[i+1] = 255 - a[i+1]; a[i+2] = 255 - a[i+2];
      }
      ctx.putImageData(d, 0, 0);
      var scale = Math.max(1, Math.min(2, 1500 / cv.width));
      if(scale > 1){
        var c2 = document.createElement('canvas');
        c2.width = Math.round(cv.width * scale);
        c2.height = Math.round(cv.height * scale);
        var x2 = c2.getContext('2d');
        x2.imageSmoothingEnabled = true;
        x2.drawImage(cv, 0, 0, c2.width, c2.height);
        resolve(c2.toDataURL('image/png'));
      } else resolve(cv.toDataURL('image/png'));
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}
function isDarkImage(dataUrl){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      var sw = Math.min(100, img.naturalWidth), sh = Math.min(100, img.naturalHeight);
      cv.width = sw; cv.height = sh;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, sw, sh);
      var d = ctx.getImageData(0, 0, sw, sh).data;
      var sum = 0, count = 0;
      for(var i = 0; i < d.length; i += 4){ sum += (d[i]+d[i+1]+d[i+2])/3; count++; }
      resolve(sum / count < 100);
    };
    img.onerror = function(){ resolve(false); };
    img.src = dataUrl;
  });
}

async function runOCR(dataUrl, forceInvert){
  if(!dataUrl) return;
  ocrPanel.classList.add('show');
  if(typeof Tesseract === 'undefined'){ setOCRDot('bad'); updateOCRStatus('<span class="badge bad">✕</span> 识别库加载失败'); return; }
  if(ocrState.running) return;
  ocrState.running=true; ocrState.text=''; ocrState.players=[];
  setOCRDot('busy');
  updateOCRStatus('<span class="badge">⏳</span> 预处理图片…');
  ocrProgressWrap.hidden=false; ocrProgressBar.style.width='0%';
  ocrText.hidden=true; playersPreview.innerHTML=''; ocrActions.hidden=true;

  var finalUrl = dataUrl;
  if(forceInvert){
    try{ finalUrl = await invertImage(dataUrl); }catch(e){}
  } else {
    try{
      if(await isDarkImage(dataUrl)){
        updateOCRStatus('<span class="badge">⏳</span> 检测到暗色图，反色处理…');
        finalUrl = await invertImage(dataUrl);
      }
    }catch(e){}
  }

  updateOCRStatus('<span class="badge">⏳</span> 加载识别引擎…');

  Tesseract.recognize(finalUrl, 'eng+chi_sim', {
    logger:function(m){
      if(!m) return;
      if(m.status==='loading tesseract core') updateOCRStatus('<span class="badge">⏳</span> 加载核心…');
      else if(m.status==='initializing tesseract') updateOCRStatus('<span class="badge">⏳</span> 初始化…');
      else if(m.status==='loading language traineddata'){
        var p=Math.round((m.progress||0)*100);
        updateOCRStatus('<span class="badge">⏳</span> 下载语言包… '+p+'%');
        ocrProgressBar.style.width=p+'%';
      } else if(m.status==='initializing api') updateOCRStatus('<span class="badge">⏳</span> 准备中…');
      else if(m.status==='recognizing text'){
        var p2=Math.round((m.progress||0)*100);
        updateOCRStatus('<span class="badge">⏳</span> 识别中… '+p2+'%');
        ocrProgressBar.style.width=p2+'%';
      }
    }
  }).then(function(result){
    ocrState.running=false;
    var text=(result && result.data && result.data.text) || '';
    ocrState.text=text;
    processOCR(text);
  }).catch(function(err){
    ocrState.running=false;
    setOCRDot('bad');
    updateOCRStatus('<span class="badge bad">✕</span> 识别失败：'+esc(err.message||err));
    ocrProgressWrap.hidden=true;
  });
}

function normalizeKeyword(str){
  return String(str||'').replace(/[\s\-_.·、,，|]/g,'').toLowerCase();
}
function hasTuber(str){
  var s = normalizeKeyword(str);
  if(!s) return false;
  if(s.indexOf('tuber')!==-1) return true;
  if(s.indexOf('tvber')!==-1) return true;
  if(s.indexOf('tnber')!==-1) return true;
  if(s.indexOf('tubar')!==-1) return true;
  if(s.indexOf('tuher')!==-1) return true;
  if(/\bt\w*ber/i.test(s)) return true;
  return false;
}
function fixDigit(str){
  return String(str)
    .replace(/[OoQ]/g,'0').replace(/[Il|!]/g,'1').replace(/[Zz]/g,'2')
    .replace(/S/g,'5').replace(/[Gg]/g,'6').replace(/B/g,'8')
    .replace(/[，、。：:]/g,'');
}

function processOCR(text){
  var norm = String(text||'').replace(/\r/g,'').trim();
  if(!norm){
    setOCRDot('warn'); updateOCRStatus('<span class="badge">?</span> 没识别出文字，试试点「🌓 反色重识」');
    ocrProgressWrap.hidden=true; ocrActions.hidden=false; return;
  }
  ocrText.innerHTML = esc(norm);
  ocrText.hidden=false;
  ocrProgressWrap.hidden=true;
  ocrActions.hidden=false;

  var lines = norm.split('\n');
  var kwIdx = -1;
  for(var i=0;i<lines.length;i++){ if(hasTuber(lines[i])){ kwIdx=i; break; } }
  if(kwIdx===-1){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge bad">✕</span> 未找到 <strong>Tuber</strong>（点「查看原始文字」）');
    return;
  }

  var hlLines = lines.slice();
  for(var k=0;k<hlLines.length;k++){
    if(hasTuber(hlLines[k])) hlLines[k] = '<mark class="gold">' + esc(hlLines[k]) + '</mark>';
    else hlLines[k] = esc(hlLines[k]);
  }
  ocrText.innerHTML = hlLines.join('\n');

  var parsed = [];
  var current = null;
  var i = kwIdx + 1;

  while(i < lines.length){
    var rawLine = lines[i]; i++;
    var line = rawLine.trim();
    if(!line) continue;
    if(hasTuber(line)) break;

    var fixedLine = fixDigit(line);
    if(/^-?\d+$/.test(fixedLine)){
      if(current && current.nums.length < FIELD_COUNT){
        current.nums.push(fixedLine);   /* ★ 存字符串 */
      }
      continue;
    }

    var m = line.match(/^(.*?)([0-9OoQIl|!ZzSGgB]+)\s*$/);
    if(m){
      var possibleName = m[1].trim();
      var numStr = fixDigit(m[2]);
      if(possibleName && /^-?\d+$/.test(numStr)){
        current = { name: possibleName, nums: [numStr], submitting:false, submitted:false };
        parsed.push(current);
        continue;
      }
    }

    if(!current || current.nums.length >= 3){
      current = { name: line, nums: [], submitting:false, submitted:false };
      parsed.push(current);
    }
  }

  ocrState.players = parsed;
  if(parsed.length === 0){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge gold">✓</span> 找到 Tuber，但下面没解析出玩家行');
    return;
  }
  var totalNums = parsed.reduce(function(s,p){return s+p.nums.length;},0);
  setOCRDot('ok');
  updateOCRStatus('<span class="badge gold">✓</span> 解析出 <strong>'+parsed.length+'</strong> 位玩家 · 共 <strong>'+totalNums+'</strong> 个数字 · 点数字可修改');
  renderPreview();
}

function renderPreview(){
  var list = ocrState.players;
  if(!list || !list.length){ playersPreview.innerHTML=''; return; }
  var html = '<div class="pp-head"><span>📋 解析结果</span><span class="count">'+list.length+' 位</span><span class="sp"></span></div>';

  list.forEach(function(p,i){
    html += '<div class="player-card">';
    html += '<div class="pc-head">';
    html += '<span class="pc-name" data-edit-name="'+i+'" title="点击修改名字"><span class="idx">#'+(i+1)+'</span>'+esc(p.name)+'</span>';
    if(p.submitted){ html += '<button class="pc-add done" disabled>✓ 已提交</button>'; }
    else if(p.submitting){ html += '<button class="pc-add" disabled>⏳ 提交中</button>'; }
    else { html += '<button class="pc-add" data-submit="'+i+'">📤 提交申请</button>'; }
    html += '</div>';
    html += '<div class="pc-fields">';
    FIELD_DEFS.forEach(function(f,fi){
      var v = p.nums[fi];
      html += '<div class="pc-field'+(v===undefined?' missing':'')+'" data-edit-num="'+i+','+fi+'" title="点击修改「'+esc(f.label)+'」">'
        + '<span class="fname">'+esc(f.label)+'</span>'
        + '<span class="fval">'+(v===undefined?'—':esc(v))+'</span>'
        + '</div>';
    });
    html += '</div></div>';
  });
  html += '<div class="pp-actions"><button class="btn p sm" id="ppSubmitAll">📤 全部提交申请</button></div>';
  playersPreview.innerHTML = html;
}

    var ok = await submitRequest(p);
    p.submitting = false;
    if(ok){ p.submitted = true; toast('「'+p.name+'」已提交'); }
    renderPreview(); return;
  }
  if(e.target.closest('#ppSubmitAll')){
    var todo = ocrState.players.filter(function(x){return !x.submitted && !x.submitting;});
    if(!todo.length){ toast('都已提交'); return; }
    if(!cloudReady){ alert('云端未连接'); return; }
    if(!confirm('提交 '+todo.length+' 条申请？')) return;
    var okc = 0;

      todo[k].submitting = false;
      if(ok2){ todo[k].submitted = true; okc++; }
      renderPreview();
    }
    toast('已提交 '+okc+'/'+todo.length+' 条');
  }
});

/* ★ 用 BigInt 做加减，避免大数精度丢失 */
function changeScore(id, delta){
  if(!isAdmin){ toast('需要管理员权限'); return; }
  var p = findPlayer(id); if(!p) return;
  var ns;
  try{
    ns = (BigInt(p.score || '0') + BigInt(delta)).toString();
  }catch(e){
    ns = String((parseFloat(p.score)||0) + delta);
  }
  var nf = Object.assign({}, p.fields||{}); nf.tuber = ns;
  updatePlayer(id, { score: ns, fields: nf });
}

function editName(el, id){
  if(!isAdmin) return;
  var p = findPlayer(id); if(!p) return;
  var nt = el.querySelector('.name-txt'); if(!nt) return;
  var inp = document.createElement('input');
  inp.type='text'; inp.className='name-input'; inp.value=p.name; inp.maxLength=40;
  nt.innerHTML=''; nt.appendChild(inp);
  inp.focus(); inp.select();
  var done=false;
  function fin(sv){
    if(done) return; done=true;
    if(sv){ var n = inp.value.trim(); if(n && n!==p.name){ updatePlayer(id,{name:n.slice(0,40)}); return; } }
    render();
  }
  inp.addEventListener('blur', function(){ fin(true); });
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); fin(true); }
    else if(e.key==='Escape'){ e.preventDefault(); fin(false); }
  });
}
function editScore(el, id){
  if(!isAdmin) return;
  var p = findPlayer(id); if(!p) return;
  var inp = document.createElement('input');
  inp.type='text'; inp.className='score-input'; inp.value=p.score;
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); inp.select();
  var done=false;
  function fin(sv){
    if(done) return; done=true;
    if(sv){
      var v = inp.value.trim() || '0';
      var nf = Object.assign({}, p.fields||{}); nf.tuber = v;
      updatePlayer(id, {score:v, fields:nf}); return;
    }
    render();
  }
  inp.addEventListener('blur', function(){ fin(true); });
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); fin(true); }
    else if(e.key==='Escape'){ e.preventDefault(); fin(false); }
  });
}

  loginSubmit.disabled=false; loginSubmit.textContent='登录';
});
btnLogout.addEventListener('click', async function(){
  if(!cloudReady) return;
  if(!confirm('退出管理员登录？')) return;
  await sb.auth.signOut();
});
async function applyAdminState(admin){
  isAdmin = !!admin;
  btnLogin.style.display = isAdmin ? 'none' : 'grid';
  btnLogout.style.display = isAdmin ? 'grid' : 'none';
  addRow.classList.toggle('show', isAdmin);
  adminPanel.classList.toggle('show', isAdmin);
  updateBanner(); render();
  if(isAdmin) await fetchPendingList();
  else { pendingList=[]; renderPending(); }
}
btnAdd.addEventListener('click', function(){ addPlayerCloud(newName.value, newScore.value); newName.value=''; newScore.value='0'; });
newName.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); btnAdd.click(); } });
newScore.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); btnAdd.click(); } });

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(lightbox.classList.contains('show')){ lightbox.classList.remove('show'); return; }
    if(fieldsOv.classList.contains('show')){ fieldsOv.classList.remove('show'); return; }
    if(loginOv.classList.contains('show')){ closeLogin(); return; }
    if(document.activeElement === searchInput){ searchClear.click(); return; }
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
    e.preventDefault(); searchInput.focus(); searchInput.select();
  }
});

var particleCtx=null, particles=[], pRun=true, pW=0, pH=0, pDpr=1;
var themeColors=['61,82,31','106,140,60','140,180,60','180,150,80'];
function initParticles(){
  var c = document.getElementById('particles'); if(!c || !c.getContext) return;
  particleCtx = c.getContext('2d');
  pDpr = Math.min(window.devicePixelRatio||1, 2);
  resizeCanvas();
  var cs = getComputedStyle(document.documentElement);
  themeColors = [
    (cs.getPropertyValue('--p1')||'61,82,31').trim(),
    (cs.getPropertyValue('--p2')||'106,140,60').trim(),
    (cs.getPropertyValue('--p3')||'140,180,60').trim(),
    (cs.getPropertyValue('--p4')||'180,150,80').trim()
  ];
  var count = Math.max(10, Math.min(24, Math.floor((pW*pH)/50000)));
  particles = [];
  for(var i=0;i<count;i++){
    particles.push({ x:Math.random()*pW, y:Math.random()*pH, size:4+Math.random()*9,
      vx:(Math.random()-0.5)*0.4, vy:(Math.random()-0.5)*0.4,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.014,
      alpha:0.1+Math.random()*0.25, alphaPhase:Math.random()*Math.PI*2,
      alphaSpeed:0.008+Math.random()*0.016,
      hueIdx:Math.floor(Math.random()*4), hueMix:Math.random(), glow:Math.random()<0.15 });
  }
  if(pRun) drawParticles();
}
function resizeCanvas(){
  var c=document.getElementById('particles'); if(!c) return;
  pW=window.innerWidth; pH=window.innerHeight;
  c.width=pW*pDpr; c.height=pH*pDpr;
  c.style.width=pW+'px'; c.style.height=pH+'px';
  if(particleCtx) particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}
function drawParticles(){
  if(!pRun || !particleCtx) return;
  particleCtx.clearRect(0,0,pW,pH);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if(p.x<-40) p.x=pW+40; else if(p.x>pW+40) p.x=-40;
    if(p.y<-40) p.y=pH+40; else if(p.y>pH+40) p.y=-40;
    p.alphaPhase+=p.alphaSpeed;
    var a = p.alpha*(0.55+0.45*Math.sin(p.alphaPhase));
    a = Math.max(0.04, Math.min(0.5, a));
    var c1=(themeColors[p.hueIdx]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var c2=(themeColors[(p.hueIdx+1)%4]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var mix = p.hueMix;
    var r=Math.round(c1[0]*(1-mix)+c2[0]*mix);
    var g=Math.round(c1[1]*(1-mix)+c2[1]*mix);
    var b=Math.round(c1[2]*(1-mix)+c2[2]*mix);
    particleCtx.save();
    particleCtx.translate(p.x,p.y); particleCtx.rotate(p.rot);
    if(p.glow){ particleCtx.shadowBlur=10; particleCtx.shadowColor='rgba('+r+','+g+','+b+','+(a*0.8)+')'; }
    var s=p.size, hs=s/2, rad=Math.min(3,s/3.5);
    var grad=particleCtx.createLinearGradient(-hs,-hs,hs,hs);
    grad.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');
    grad.addColorStop(1,'rgba('+r+','+g+','+b+','+(a*0.3)+')');
    particleCtx.fillStyle=grad;
    particleCtx.beginPath();
    if(particleCtx.roundRect) particleCtx.roundRect(-hs,-hs,s,s,rad);
    else particleCtx.rect(-hs,-hs,s,s);
    particleCtx.fill();
    particleCtx.strokeStyle='rgba(255,255,255,'+(a*0.2)+')';
    particleCtx.lineWidth=0.5; particleCtx.stroke();
    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

async function boot(){
  try{ var img = localStorage.getItem(K_IMAGE); if(img && img.indexOf('data:image/')===0) boardImage = img; }catch(e){}
  updateImageUI();
  initParticles();
  initSupabase();
  updateBanner();
  if(cloudReady){
    sb.auth.onAuthStateChange(function(event, session){ applyAdminState(!!(session && session.user)); });
    try{ var s = await sb.auth.getSession(); await applyAdminState(!!(s.data && s.data.session && s.data.session.user)); }
    catch(e){ await applyAdminState(false); }
    await fetchApprovedPlayers();
    setupRealtime();
  } else {
    render(); applyAdminState(false);
  }
  if(boardImage) setTimeout(function(){ runOCR(boardImage); }, 500);
  window.addEventListener('resize', resizeCanvas, {passive:true});
  document.addEventListener('visibilitychange', function(){ pRun = !document.hidden; if(pRun) drawParticles(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
