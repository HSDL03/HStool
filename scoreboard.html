<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备份计分板 · 红石的小工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
:root{
  --bg:#fffdf5;--bg2:#f4f0e0;--bg3:#e8e2cc;--text:#1f1f1f;--muted:#5c5c5c;
  --bd:#a8a89a;--bd2:#4a4a3a;--ac:#3d521f;--acs:#e0e8d0;--dgr:#a02020;
  --ok:#2d7a2d;--warn:#b08800;--gold:#c8a227;
  --sh:2px 2px 0 rgba(0,0,0,.2);--r:2px;
  --bevel:inset -1px -1px 0 rgba(0,0,0,.15),inset 1px 1px 0 rgba(255,255,255,.7);
  --bevel-in:inset 1px 1px 0 rgba(0,0,0,.15),inset -1px -1px 0 rgba(255,255,255,.7);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(61,82,31,.10);--blob2:rgba(106,140,60,.07);--blob3:rgba(180,150,80,.06);
  --grid:rgba(61,82,31,.04);
  --p1:61,82,31;--p2:106,140,60;--p3:140,180,60;--p4:180,150,80;
  --hero-grad:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
  --tile-accent:linear-gradient(135deg,#7a9c3c,#3d521f);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* 背景装饰 */
.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:400px;height:400px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 28s ease-in-out infinite}
.b2{width:460px;height:460px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 34s ease-in-out infinite}
.b3{width:320px;height:320px;background:var(--blob3);top:38%;left:52%;animation:drift3 40s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(60px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-70px,-60px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-60px,-70px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);
  mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:.5}

/* 顶栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg,#56682c,#3d521f);border-bottom:2px solid #2a3a1a;color:#fff;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar .logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.topbar .logo-icon{font-size:16px;display:inline-block;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.topbar .logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.topbar .sp{flex:1}
.topbar .icon{display:grid;place-items:center;width:30px;height:30px;flex:none;font-size:14px;font-family:inherit;
  color:rgba(255,255,255,.85);background:transparent;border:none;border-radius:var(--r);cursor:pointer;
  transition:background .15s,color .15s,transform .2s;text-decoration:none}
.topbar .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.topbar .icon:active{transform:scale(.92)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;font-size:13px;font-family:inherit;font-weight:600;
  color:#1f1f1f;background:linear-gradient(180deg,#e8e2cc,#d4ceb8);border:1px solid #4a4a3a;border-radius:var(--r);
  cursor:pointer;box-shadow:var(--bevel);transition:filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:var(--bevel),0 0 8px rgba(142,196,74,.3)}
.btn:active:not(:disabled){box-shadow:var(--bevel-in)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:#fff;background:linear-gradient(180deg,#7a9c3c,#56682c)}
.btn.d{color:var(--dgr);background:transparent;box-shadow:none}
.btn.d:hover:not(:disabled){background:rgba(160,32,32,.08);filter:none;box-shadow:none}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.gold{color:#1f1f1f;background:linear-gradient(180deg,#e8d68a,#c8a227);border-color:#7a6210}

/* 主体 */
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:72px 20px 60px}

/* 页头 */
.page-head{margin:0 auto 20px;text-align:center;padding:14px 0}
.page-head h1{margin:0 0 6px;font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em;
  background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-head .sub{margin:0;font-size:13px;color:var(--muted)}

/* 统计条 */
.stats-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 20px}
.stat{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--bg2);border:2px solid var(--bd2);
  border-radius:2px;box-shadow:var(--bevel);font-size:12.5px;color:var(--muted)}
.stat strong{color:var(--ac);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.gold strong{color:var(--gold)}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 auto 16px;padding:10px;
  background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel);border-radius:2px}
.toolbar .sep{width:1px;background:var(--bd);margin:0 4px;align-self:stretch}

/* 计分板表格 */
.board{
  background:linear-gradient(135deg,var(--bg2),var(--bg));
  border:2px solid var(--bd2);
  box-shadow:var(--bevel);
  border-radius:2px;
  overflow:hidden;
}
.board-head{
  display:grid;
  grid-template-columns:44px 1fr 110px 190px 40px;
  gap:0;padding:10px 12px;
  background:linear-gradient(180deg,#7a9c3c,#56682c);
  color:#fff;font-size:11.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  text-shadow:1px 1px 0 rgba(0,0,0,.3);
  border-bottom:2px solid #3d521f;
}
.board-head > div{display:flex;align-items:center}
.board-head .col-score,.board-head .col-acts{justify-content:center}
.board-body{display:flex;flex-direction:column}

.row{
  display:grid;
  grid-template-columns:44px 1fr 110px 190px 40px;
  align-items:center;
  padding:10px 12px;
  border-bottom:1px solid var(--bd);
  transition:background .15s;
  animation:rowIn .3s cubic-bezier(.22,1,.36,1) both;
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.row.top1{background:linear-gradient(90deg,rgba(200,162,39,.18),transparent 60%)}
.row.top2{background:linear-gradient(90deg,rgba(180,180,180,.15),transparent 60%)}
.row.top3{background:linear-gradient(90deg,rgba(190,120,60,.15),transparent 60%)}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.row .rank{font-weight:800;font-size:14px;color:var(--muted);text-align:center}
.row.top1 .rank{color:var(--gold)}
.row.top2 .rank{color:#8a8a8a}
.row.top3 .rank{color:#b8722c}

.row .name{
  font-size:14.5px;font-weight:700;color:#2a3a1a;
  padding:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:text;
}
.row .name-input{
  font:inherit;font-weight:700;font-size:14.5px;color:#2a3a1a;
  width:100%;padding:2px 6px;
  background:var(--bg);
  border:2px solid var(--bd2);
  box-shadow:var(--bevel-in);
  border-radius:2px;outline:none;
}
.row .name-input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}

.row .score{
  font-size:20px;font-weight:800;color:var(--ac);
  text-align:center;font-variant-numeric:tabular-nums;
  cursor:pointer;
  padding:2px 4px;
  border-radius:2px;
  transition:background .15s;
}
.row .score:hover{background:var(--acs)}
.row .score.neg{color:var(--dgr)}
.row .score-input{
  font:inherit;font-weight:800;font-size:20px;color:var(--ac);
  width:100%;padding:1px 4px;
  text-align:center;
  background:var(--bg);
  border:2px solid var(--bd2);
  box-shadow:var(--bevel-in);
  border-radius:2px;outline:none;
  font-variant-numeric:tabular-nums;
}
.row .score-input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}

.row .acts{display:flex;gap:3px;justify-content:center}
.act{
  display:grid;place-items:center;
  width:26px;height:26px;
  font-size:13px;font-family:inherit;font-weight:700;
  color:#1f1f1f;
  background:linear-gradient(180deg,#e8e2cc,#d4ceb8);
  border:1px solid #4a4a3a;
  box-shadow:var(--bevel);
  border-radius:2px;cursor:pointer;
  transition:filter .12s,box-shadow .12s,transform .12s;
}
.act:hover{filter:brightness(1.1)}
.act:active{box-shadow:var(--bevel-in);transform:translateY(1px)}
.act.plus{background:linear-gradient(180deg,#a4d468,#7a9c3c);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.act.minus{background:linear-gradient(180deg,#e88a8a,#c04040);color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.act.del{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.act.del:hover{color:var(--dgr);background:rgba(160,32,32,.08)}

/* 空状态 */
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .ic{font-size:48px;opacity:.4;margin-bottom:10px;display:block}
.empty .lead{font-size:14px;line-height:1.8}

/* 添加行 */
.add-row{
  display:flex;gap:8px;align-items:center;
  padding:12px;
  background:var(--bg2);
  border:2px solid var(--bd2);
  border-top:none;
  box-shadow:var(--bevel);
  border-radius:0 0 2px 2px;
}
.add-row input{
  flex:1;
  height:34px;
  padding:0 10px;
  font-size:14px;font-family:inherit;
  color:var(--text);
  background:var(--bg);
  border:2px solid var(--bd2);
  box-shadow:var(--bevel-in);
  border-radius:2px;
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.add-row input:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.add-row input::placeholder{color:var(--muted)}
.add-row .num-input{
  width:80px;flex:none;text-align:center;
}

/* 提示 */
.toast{position:fixed;left:50%;bottom:20px;max-width:calc(100vw - 32px);padding:8px 16px;font-size:13px;
  color:#e8ffd0;background:#2a3a1a;border:2px solid #4a4a3a;border-radius:2px;
  box-shadow:2px 2px 0 rgba(0,0,0,.4);
  opacity:0;transform:translateX(-50%) translateY(16px);
  transition:opacity .22s,transform .28s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 弹窗 */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:100;
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:520px;max-height:calc(100vh - 32px);
  background:var(--bg);border:2px solid var(--bd2);border-radius:2px;box-shadow:3px 3px 0 rgba(0,0,0,.3);
  overflow:hidden;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.ov.show .pnl{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:linear-gradient(180deg,#7a9c3c,#56682c);color:#fff;border-bottom:2px solid #3d521f;
  text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ph strong{font-size:14px}
.ph .sp{flex:1}
.ph .icon{display:grid;place-items:center;width:26px;height:26px;font-size:13px;font-family:inherit;
  color:rgba(255,255,255,.85);background:transparent;border:none;border-radius:2px;cursor:pointer}
.ph .icon:hover{background:rgba(0,0,0,.2);color:#fff}
.pb{padding:14px;overflow-y:auto;font-size:13.5px;line-height:1.65}
.pb p{margin:0 0 10px}
.pb .hint{padding:8px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:2px;font-size:12.5px;color:var(--muted);line-height:1.6}
.pb .warn{color:var(--dgr);font-weight:600}
.pb textarea{
  width:100%;height:180px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;
  color:var(--text);background:var(--bg2);border:2px solid var(--bd2);box-shadow:var(--bevel-in);
  border-radius:2px;outline:none;resize:none;
}
.pb textarea:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.pfoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--bd);background:var(--bg2)}
.pfoot .sp{flex:1}

/* 响应式 */
@media(max-width:760px){
  .board-head{grid-template-columns:36px 1fr 70px 140px 34px;padding:8px 10px;font-size:10.5px}
  .row{grid-template-columns:36px 1fr 70px 140px 34px;padding:8px 10px;gap:2px}
  .row .name{font-size:13.5px;padding:0 4px}
  .row .score{font-size:16px}
  .row .score-input{font-size:16px}
  .act{width:22px;height:22px;font-size:11px}
  .wrap{padding:60px 12px 40px}
}
@media(max-width:560px){
  .topbar .logo span:last-child{display:none}
  .board-head{grid-template-columns:28px 1fr 55px 118px 30px;padding:6px 8px;font-size:10px}
  .row{grid-template-columns:28px 1fr 55px 118px 30px;padding:6px 8px;gap:1px}
  .row .name{font-size:13px}
  .row .score{font-size:15px;padding:1px 2px}
  .act{width:20px;height:20px;font-size:10px}
  .row .acts{gap:2px}
  .toolbar{padding:8px;gap:4px}
  .btn{padding:4px 9px;font-size:12px}
}
@media print{.bg-decor,.topbar,.toolbar,.add-row,.act{display:none}.wrap{padding:0}.board{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg-decor" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid-bg"></div>
  <canvas id="particles"></canvas>
</div>

<!-- 顶栏 -->
<header class="topbar">
  <a class="logo" href="./index.html">
    <span class="logo-icon">🧰</span>
    <span>红石的小工具箱</span>
  </a>
  <span class="sp"></span>
  <a class="icon" href="./index.html" title="返回工具箱">🏠</a>
</header>

<div class="wrap">

  <div class="page-head">
    <h1>🏆 备份计分板</h1>
    <p class="sub">记录分数 · 一键导出备份 · 随时恢复</p>
  </div>

  <!-- 统计 -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- 工具条 -->
  <div class="toolbar">
    <button class="btn sm" id="btnSortDesc">📊 按分数降序</button>
    <button class="btn sm" id="btnSortAsc">📊 按分数升序</button>
    <button class="btn sm" id="btnSortName">🔤 按名字</button>
    <span class="sep"></span>
    <button class="btn sm gold" id="btnExport">💾 导出备份</button>
    <button class="btn sm" id="btnImport">📂 导入备份</button>
    <span class="sep"></span>
    <button class="btn sm" id="btnClearScores">🔄 分数清零</button>
    <button class="btn sm d" id="btnResetAll">🗑 全部清空</button>
  </div>

  <!-- 计分板 -->
  <div class="board">
    <div class="board-head">
      <div>#</div>
      <div>玩家 / 项目</div>
      <div class="col-score">分数</div>
      <div class="col-acts">操作</div>
      <div></div>
    </div>
    <div class="board-body" id="boardBody"></div>
  </div>

  <!-- 添加行 -->
  <div class="add-row">
    <input id="newName" type="text" placeholder="输入玩家名或项目名…（回车添加）" autocomplete="off" maxlength="40">
    <input id="newScore" class="num-input" type="number" placeholder="0" value="0">
    <button class="btn p" id="btnAdd">＋ 添加</button>
  </div>

</div>

<!-- 导出弹窗 -->
<div class="ov" id="exportOv">
  <div class="pnl">
    <div class="ph">
      <strong>💾 导出备份</strong>
      <span class="sp"></span>
      <button class="icon" id="exportClose">✕</button>
    </div>
    <div class="pb">
      <p>把下面的内容复制保存，或点「下载文件」保存为 <code>.json</code>：</p>
      <textarea id="exportText" readonly></textarea>
      <div class="hint" style="margin-top:10px">💡 备份内容包含所有玩家名和分数，导入时直接粘贴即可恢复。</div>
    </div>
    <div class="pfoot">
      <button class="btn d" id="exportDownload">⬇ 下载文件</button>
      <button class="btn" id="exportCopy">📋 复制</button>
      <span class="sp"></span>
      <button class="btn p" id="exportOk">关闭</button>
    </div>
  </div>
</div>

<!-- 导入弹窗 -->
<div class="ov" id="importOv">
  <div class="pnl">
    <div class="ph">
      <strong>📂 导入备份</strong>
      <span class="sp"></span>
      <button class="icon" id="importClose">✕</button>
    </div>
    <div class="pb">
      <p>粘贴之前导出的 JSON，或点「选择文件」：</p>
      <textarea id="importText" placeholder='粘贴备份内容，或点下面按钮选择文件…'></textarea>
      <div class="hint" style="margin-top:10px">⚠️ 导入会<strong>覆盖</strong>当前所有数据，请先导出备份。</div>
    </div>
    <div class="pfoot">
      <button class="btn" id="importFile">📁 选择文件</button>
      <span class="sp"></span>
      <button class="btn" id="importCancel">取消</button>
      <button class="btn p" id="importOk">确认导入</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var K_DATA = 'scoreboard-data';

/* ============================================================
   数据
   ============================================================ */
var players = [];  /* [{id, name, score}] */
var sortMode = 'none';  /* none | desc | asc | name */

function loadData(){
  try{
    var raw = localStorage.getItem(K_DATA);
    if(raw){
      var parsed = JSON.parse(raw);
      if(Array.isArray(parsed)){
        players = parsed.filter(function(p){
          return p && typeof p === 'object' && typeof p.name === 'string';
        }).map(function(p){
          return {
            id: String(p.id || genId()),
            name: String(p.name).slice(0, 40),
            score: Number.isFinite(Number(p.score)) ? Math.round(Number(p.score)) : 0
          };
        });
      }
    }
  }catch(e){
    console.warn('读取数据失败', e);
    players = [];
  }
}

function saveData(){
  try{
    localStorage.setItem(K_DATA, JSON.stringify(players));
    return true;
  }catch(e){
    console.warn('保存失败', e);
    return false;
  }
}

function genId(){
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ============================================================
   DOM
   ============================================================ */
function $(id){ return document.getElementById(id); }

var boardBody = $('boardBody');
var statsBar = $('statsBar');
var newName = $('newName');
var newScore = $('newScore');
var btnAdd = $('btnAdd');
var toastEl = $('toast');

var exportOv = $('exportOv');
var exportText = $('exportText');
var exportClose = $('exportClose');
var exportOk = $('exportOk');
var exportCopy = $('exportCopy');
var exportDownload = $('exportDownload');

var importOv = $('importOv');
var importText = $('importText');
var importClose = $('importClose');
var importCancel = $('importCancel');
var importOk = $('importOk');
var importFile = $('importFile');
var fileInput = $('fileInput');

/* ============================================================
   工具
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var toastTimer = null;
function toast(msg){
  if(!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
}

/* ============================================================
   渲染
   ============================================================ */
function getSortedPlayers(){
  var list = players.slice();
  if(sortMode === 'desc'){
    list.sort(function(a, b){ return b.score - a.score; });
  } else if(sortMode === 'asc'){
    list.sort(function(a, b){ return a.score - b.score; });
  } else if(sortMode === 'name'){
    list.sort(function(a, b){ return a.name.localeCompare(b.name, 'zh-CN'); });
  }
  return list;
}

function renderStats(){
  if(!statsBar) return;
  var total = players.length;
  var sum = 0, max = 0, min = 0;
  players.forEach(function(p){
    sum += p.score;
    if(p.score > max) max = p.score;
    if(p.score < min) min = p.score;
  });
  var avg = total > 0 ? Math.round(sum / total * 10) / 10 : 0;
  var maxPlayer = null;
  players.forEach(function(p){ if(!maxPlayer || p.score > maxPlayer.score) maxPlayer = p; });

  var html = '';
  html += '<div class="stat"><span>总人数</span><strong>' + total + '</strong></div>';
  if(total > 0){
    html += '<div class="stat"><span>总分</span><strong>' + sum + '</strong></div>';
    html += '<div class="stat"><span>平均分</span><strong>' + avg + '</strong></div>';
    html += '<div class="stat gold"><span>👑 最高分</span><strong>' + esc(maxPlayer.name) + ' · ' + max + '</strong></div>';
  }
  statsBar.innerHTML = html;
}

function renderBoard(){
  if(!boardBody) return;

  if(players.length === 0){
    boardBody.innerHTML =
      '<div class="empty">' +
        '<span class="ic">🏆</span>' +
        '<div class="lead">还没有任何玩家<br>在下面输入名字，点「＋ 添加」开始记分吧</div>' +
      '</div>';
    return;
  }

  var list = getSortedPlayers();
  var html = '';

  list.forEach(function(p, i){
    var rank = i + 1;
    var rankClass = '';
    if(sortMode === 'desc' || sortMode === 'none'){
      /* 只有按分数降序或默认时才标记前三 */
      var sorted = players.slice().sort(function(a, b){ return b.score - a.score; });
      if(sorted.length > 0 && sorted[0].id === p.id) rankClass = 'top1';
      else if(sorted.length > 1 && sorted[1].id === p.id) rankClass = 'top2';
      else if(sorted.length > 2 && sorted[2].id === p.id) rankClass = 'top3';
    }

    var scoreClass = p.score < 0 ? ' neg' : '';

    html +=
      '<div class="row ' + rankClass + '" data-id="' + esc(p.id) + '">' +
        '<div class="rank">' + rank + '</div>' +
        '<div class="name" data-action="edit-name" title="点击编辑名字">' + esc(p.name) + '</div>' +
        '<div class="score' + scoreClass + '" data-action="edit-score" title="点击编辑分数">' + p.score + '</div>' +
        '<div class="acts">' +
          '<button class="act minus" data-action="dec" title="减 1">−</button>' +
          '<button class="act plus" data-action="inc" title="加 1">＋</button>' +
          '<button class="act minus" data-action="dec5" title="减 5">−5</button>' +
          '<button class="act plus" data-action="inc5" title="加 5">+5</button>' +
        '</div>' +
        '<button class="act del" data-action="del" title="删除">✕</button>' +
      '</div>';
  });

  boardBody.innerHTML = html;
}

function render(){
  renderBoard();
  renderStats();
}

/* ============================================================
   操作
   ============================================================ */
function findPlayer(id){
  for(var i = 0; i < players.length; i++){
    if(players[i].id === id) return players[i];
  }
  return null;
}

function addPlayer(name, score){
  name = String(name || '').trim();
  if(!name){ toast('请输入名字'); return; }
  if(name.length > 40) name = name.slice(0, 40);
  score = Number.isFinite(Number(score)) ? Math.round(Number(score)) : 0;

  /* 重名检查 */
  for(var i = 0; i < players.length; i++){
    if(players[i].name === name){
      if(!confirm('已存在「' + name + '」，仍要添加吗？')) return;
      break;
    }
  }

  players.push({ id: genId(), name: name, score: score });
  saveData();
  render();
  toast('已添加「' + name + '」');
}

function changeScore(id, delta){
  var p = findPlayer(id);
  if(!p) return;
  p.score += delta;
  saveData();
  render();
}

function deletePlayer(id){
  var p = findPlayer(id);
  if(!p) return;
  if(!confirm('确定删除「' + p.name + '」吗？')) return;
  players = players.filter(function(x){ return x.id !== id; });
  saveData();
  render();
  toast('已删除「' + p.name + '」');
}

function editName(el, id){
  var p = findPlayer(id);
  if(!p || !el) return;
  var oldName = p.name;
  var input = document.createElement('input');
  input.type = 'text';
  input.className = 'name-input';
  input.value = oldName;
  input.maxLength = 40;
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  var done = false;
  function finish(save){
    if(done) return;
    done = true;
    var newName = input.value.trim();
    if(save && newName && newName !== oldName){
      p.name = newName.slice(0, 40);
      saveData();
      toast('已重命名');
    }
    render();
  }
  input.addEventListener('blur', function(){ finish(true); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
}

function editScore(el, id){
  var p = findPlayer(id);
  if(!p || !el) return;
  var oldVal = p.score;
  var input = document.createElement('input');
  input.type = 'number';
  input.className = 'score-input';
  input.value = oldVal;
  el.innerHTML = '';
  el.appendChild(input);
  input.focus();
  input.select();

  var done = false;
  function finish(save){
    if(done) return;
    done = true;
    if(save){
      var v = parseInt(input.value, 10);
      if(!isNaN(v)) p.score = v;
      saveData();
    }
    render();
  }
  input.addEventListener('blur', function(){ finish(true); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function openExport(){
  var data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    players: players
  };
  exportText.value = JSON.stringify(data, null, 2);
  exportOv.classList.add('show');
}
function closeExport(){
  exportOv.classList.remove('show');
}

function downloadBackup(){
  try{
    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      players: players
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'scoreboard-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('已下载备份文件');
  }catch(e){
    alert('下载失败：' + e.message);
  }
}

function openImport(){
  importText.value = '';
  importOv.classList.add('show');
}
function closeImport(){
  importOv.classList.remove('show');
}

function doImport(){
  var txt = (importText.value || '').trim();
  if(!txt){ toast('请先粘贴备份内容'); return; }

  var parsed;
  try{
    parsed = JSON.parse(txt);
  }catch(e){
    alert('解析失败：不是有效的 JSON\n' + e.message);
    return;
  }

  var list = null;
  if(Array.isArray(parsed)){
    list = parsed;
  }else if(parsed && Array.isArray(parsed.players)){
    list = parsed.players;
  }

  if(!list){ alert('格式不对：找不到 players 数组'); return; }

  var cleaned = [];
  var used = {};
  list.forEach(function(p){
    if(!p || typeof p !== 'object') return;
    if(typeof p.name !== 'string' || !p.name.trim()) return;
    var name = p.name.trim().slice(0, 40);
    var id = String(p.id || genId());
    /* id 冲突时重新生成 */
    while(used[id]) id = genId();
    used[id] = true;
    cleaned.push({
      id: id,
      name: name,
      score: Number.isFinite(Number(p.score)) ? Math.round(Number(p.score)) : 0
    });
  });

  if(cleaned.length === 0){ alert('没有有效的玩家数据'); return; }

  if(!confirm('导入将覆盖当前的 ' + players.length + ' 条数据，继续吗？')) return;

  players = cleaned;
  saveData();
  render();
  closeImport();
  toast('已导入 ' + cleaned.length + ' 条数据');
}

/* ============================================================
   事件
   ============================================================ */
btnAdd.addEventListener('click', function(){
  addPlayer(newName.value, newScore.value);
  newName.value = '';
  newScore.value = '0';
  newName.focus();
});

newName.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    btnAdd.click();
  }
});
newScore.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    btnAdd.click();
  }
});

/* 板内点击 */
boardBody.addEventListener('click', function(e){
  var row = e.target.closest('.row');
  if(!row) return;
  var id = row.getAttribute('data-id');
  if(!id) return;

  var act = e.target.closest('[data-action]');
  if(!act) return;
  var action = act.getAttribute('data-action');

  if(action === 'inc') changeScore(id, 1);
  else if(action === 'dec') changeScore(id, -1);
  else if(action === 'inc5') changeScore(id, 5);
  else if(action === 'dec5') changeScore(id, -5);
  else if(action === 'del') deletePlayer(id);
  else if(action === 'edit-name') editName(act, id);
  else if(action === 'edit-score') editScore(act, id);
});

/* 工具条 */
$('btnSortDesc').addEventListener('click', function(){ sortMode = 'desc'; render(); toast('已按分数降序'); });
$('btnSortAsc').addEventListener('click', function(){ sortMode = 'asc'; render(); toast('已按分数升序'); });
$('btnSortName').addEventListener('click', function(){ sortMode = 'name'; render(); toast('已按名字排序'); });

$('btnClearScores').addEventListener('click', function(){
  if(players.length === 0){ toast('还没有玩家'); return; }
  if(!confirm('把所有玩家分数归零？（玩家名保留）')) return;
  players.forEach(function(p){ p.score = 0; });
  saveData();
  render();
  toast('所有分数已归零');
});

$('btnResetAll').addEventListener('click', function(){
  if(players.length === 0){ toast('已经是空的了'); return; }
  if(!confirm('清空所有玩家和分数？此操作不可撤销。')) return;
  players = [];
  saveData();
  render();
  toast('已全部清空');
});

$('btnExport').addEventListener('click', openExport);
$('btnImport').addEventListener('click', openImport);

exportClose.addEventListener('click', closeExport);
exportOk.addEventListener('click', closeExport);
exportCopy.addEventListener('click', function(){
  exportText.select();
  try{
    document.execCommand('copy');
    toast('已复制到剪贴板');
  }catch(e){
    try{
      navigator.clipboard.writeText(exportText.value);
      toast('已复制到剪贴板');
    }catch(err){
      alert('复制失败，请手动选择复制');
    }
  }
});
exportDownload.addEventListener('click', downloadBackup);

importClose.addEventListener('click', closeImport);
importCancel.addEventListener('click', closeImport);
importOk.addEventListener('click', doImport);

importFile.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(){
  var f = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    importText.value = String(reader.result || '');
    toast('已读取文件，点「确认导入」');
  };
  reader.onerror = function(){ alert('读取文件失败'); };
  reader.readAsText(f, 'utf-8');
});

/* 弹窗遮罩关闭 */
[exportOv, importOv].forEach(function(ov){
  ov.addEventListener('click', function(e){
    if(e.target !== ov) return;
    if(ov === exportOv) closeExport();
    else if(ov === importOv) closeImport();
  });
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(exportOv.classList.contains('show')) closeExport();
    else if(importOv.classList.contains('show')) closeImport();
  }
});

/* ============================================================
   背景装饰
   ============================================================ */
var particleCtx = null, particles = [], particleRunning = true, pW = 0, pH = 0, pDpr = 1;
var themeColors = ['61,82,31','106,140,60','140,180,60','180,150,80'];

function readThemeColors(){
  var cs = getComputedStyle(document.documentElement);
  themeColors = [
    (cs.getPropertyValue('--p1') || '61,82,31').trim(),
    (cs.getPropertyValue('--p2') || '106,140,60').trim(),
    (cs.getPropertyValue('--p3') || '140,180,60').trim(),
    (cs.getPropertyValue('--p4') || '180,150,80').trim()
  ];
}

function initParticles(){
  var canvas = document.getElementById('particles');
  if(!canvas || !canvas.getContext) return;
  particleCtx = canvas.getContext('2d');
  pDpr = Math.min(window.devicePixelRatio || 1, 2);
  resizeCanvas();
  readThemeColors();
  var count = Math.max(10, Math.min(24, Math.floor((pW * pH) / 50000)));
  particles = [];
  for(var i = 0; i < count; i++){
    particles.push({
      x: Math.random() * pW,
      y: Math.random() * pH,
      size: 4 + Math.random() * 9,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.014,
      alpha: 0.1 + Math.random() * 0.25,
      alphaPhase: Math.random() * Math.PI * 2,
      alphaSpeed: 0.008 + Math.random() * 0.016,
      hueIdx: Math.floor(Math.random() * 4),
      hueMix: Math.random(),
      glow: Math.random() < 0.15
    });
  }
  if(particleRunning) drawParticles();
}

function resizeCanvas(){
  var canvas = document.getElementById('particles');
  if(!canvas) return;
  pW = window.innerWidth; pH = window.innerHeight;
  canvas.width = pW * pDpr; canvas.height = pH * pDpr;
  canvas.style.width = pW + 'px'; canvas.style.height = pH + 'px';
  if(particleCtx) particleCtx.setTransform(pDpr, 0, 0, pDpr, 0, 0);
}

function drawParticles(){
  if(!particleRunning || !particleCtx) return;
  particleCtx.clearRect(0, 0, pW, pH);
  for(var i = 0; i < particles.length; i++){
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if(p.x < -40) p.x = pW + 40; else if(p.x > pW + 40) p.x = -40;
    if(p.y < -40) p.y = pH + 40; else if(p.y > pH + 40) p.y = -40;

    p.alphaPhase += p.alphaSpeed;
    var a = p.alpha * (0.55 + 0.45 * Math.sin(p.alphaPhase));
    a = Math.max(0.04, Math.min(0.5, a));

    var c1 = (themeColors[p.hueIdx] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var c2 = (themeColors[(p.hueIdx + 1) % 4] || themeColors[0]).split(',').map(function(n){ return parseInt(n, 10) || 0; });
    var mix = p.hueMix;
    var r = Math.round(c1[0] * (1 - mix) + c2[0] * mix);
    var g = Math.round(c1[1] * (1 - mix) + c2[1] * mix);
    var b = Math.round(c1[2] * (1 - mix) + c2[2] * mix);

    particleCtx.save();
    particleCtx.translate(p.x, p.y);
    particleCtx.rotate(p.rot);

    if(p.glow){
      particleCtx.shadowBlur = 10;
      particleCtx.shadowColor = 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.8) + ')';
    }

    var s = p.size, hs = s / 2, rad = Math.min(3, s / 3.5);
    var grad = particleCtx.createLinearGradient(-hs, -hs, hs, hs);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',' + (a * 0.3) + ')');
    particleCtx.fillStyle = grad;

    particleCtx.beginPath();
    if(particleCtx.roundRect) particleCtx.roundRect(-hs, -hs, s, s, rad);
    else particleCtx.rect(-hs, -hs, s, s);
    particleCtx.fill();

    particleCtx.strokeStyle = 'rgba(255,255,255,' + (a * 0.2) + ')';
    particleCtx.lineWidth = 0.5;
    particleCtx.stroke();

    particleCtx.restore();
  }
  requestAnimationFrame(drawParticles);
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  loadData();
  render();
  initParticles();

  window.addEventListener('resize', function(){ resizeCanvas(); }, { passive: true });
  document.addEventListener('visibilitychange', function(){
    particleRunning = !document.hidden;
    if(particleRunning) drawParticles();
  });

  /* 首次进入聚焦输入框 */
  setTimeout(function(){ try{ newName.focus(); }catch(e){} }, 300);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
