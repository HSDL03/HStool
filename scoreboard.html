<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:#fff;font-family:"Segoe UI","Microsoft YaHei",sans-serif;
  background:#050714;overflow-x:hidden;
}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2}
body::before{
  background:
   radial-gradient(ellipse at 10% 55%,rgba(49,42,180,.35),transparent 35%),
   radial-gradient(ellipse at 90% 55%,rgba(20,73,180,.28),transparent 35%),
   radial-gradient(circle at 50% 40%,rgba(25,30,85,.2),transparent 45%);
}
body::after{
  z-index:-1;opacity:.55;
  background-image:
   radial-gradient(circle,rgba(105,120,255,.9) 1px,transparent 1px),
   radial-gradient(circle,rgba(255,255,255,.65) 1px,transparent 1px);
  background-size:170px 170px,260px 260px;
  background-position:20px 30px,100px 100px;
}

nav{
  height:72px;position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;padding:0 7%;
  background:rgba(5,7,20,.62);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08)
}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo .blue{color:#48baff}.logo .purple{color:#a66cff}
.star{display:inline-block;margin-right:12px;font-size:28px;color:#7d73ff;text-shadow:0 0 18px #7d73ff}
nav ul{list-style:none;display:flex;gap:42px}
nav a{color:#a7a9b7;text-decoration:none;font-size:16px;transition:.25s}
nav a:hover,nav a.active{color:#9d86ff}
nav a.active{position:relative}
nav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:2px;background:#8f78ff;box-shadow:0 0 10px #8f78ff}

.hero{min-height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;padding:105px 20px 55px}
.hero-inner{width:min(900px,100%)}
.avatar-wrap{width:330px;height:330px;margin:0 auto 45px;position:relative;border-radius:50%;display:grid;place-items:center}
.avatar-wrap::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid #526dff;box-shadow:0 0 16px #526dff,0 0 55px rgba(71,95,255,.65),inset 0 0 30px rgba(65,80,255,.2);
  animation:pulse 3s ease-in-out infinite
}
.avatar-wrap::after{
  content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(115,133,255,.18);
}
.avatar{width:300px;height:300px;border-radius:50%;object-fit:cover;object-position:50% 18%;position:relative;z-index:1}
@keyframes pulse{50%{box-shadow:0 0 25px #526dff,0 0 80px rgba(71,95,255,.85),inset 0 0 35px rgba(65,80,255,.25)}}

h1{font-size:clamp(42px,5.5vw,70px);line-height:1.15;margin-bottom:22px;font-weight:800}
h1 span{background:linear-gradient(90deg,#42baff,#a66cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{font-size:19px;color:#9b9dad;line-height:1.9;margin:auto;max-width:700px}
.buttons{display:flex;justify-content:center;gap:25px;margin-top:34px}
.btn{min-width:195px;padding:15px 28px;border-radius:30px;text-decoration:none;font-size:17px;font-weight:600;transition:.25s}
.btn.primary{color:#fff;background:linear-gradient(90deg,#39baff,#a65cff);box-shadow:0 8px 35px rgba(88,86,255,.28)}
.btn.secondary{color:#fff;border:1px solid #6f7fff;background:rgba(10,12,30,.3)}
.btn:hover{transform:translateY(-3px);filter:brightness(1.12)}

.scroll{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);color:#8891ff;font-size:27px;animation:bounce 1.8s infinite}
@keyframes bounce{50%{transform:translate(-50%,7px)}}


.contact-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(2,4,15,.72);
  backdrop-filter:blur(10px);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .25s ease,visibility .25s ease;
}
.contact-modal.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
.contact-box{
  width:min(440px,100%);
  padding:34px;
  text-align:center;
  border:1px solid rgba(125,115,255,.65);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(13,17,45,.96),rgba(7,9,25,.96));
  box-shadow:0 0 30px rgba(82,109,255,.3),0 20px 80px rgba(0,0,0,.45);
  transform:translateY(15px) scale(.97);
  transition:transform .25s ease;
}
.contact-modal.show .contact-box{
  transform:translateY(0) scale(1);
}
.contact-box h2{
  font-size:30px;
  margin-bottom:10px;
}
.contact-box p{
  color:#9b9dad;
  margin-bottom:20px;
}
.email{
  padding:15px 18px;
  border-radius:12px;
  background:rgba(75,92,190,.14);
  border:1px solid rgba(120,135,255,.28);
  color:#fff;
  font-size:20px;
  letter-spacing:.3px;
  user-select:all;
  margin-bottom:24px;
}
.close-btn{
  border:1px solid #6f7fff;
  border-radius:24px;
  padding:10px 28px;
  color:#fff;
  background:rgba(10,12,30,.5);
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}
.close-btn:hover{
  background:#526dff;
  transform:translateY(-2px);
}

@media(max-width:760px){
 nav{padding:0 20px}.logo{font-size:19px}.star{font-size:23px;margin-right:6px}
 nav ul{gap:14px}nav a{font-size:13px}nav a.active::after{bottom:-23px}
 .avatar-wrap{width:245px;height:245px;margin-bottom:35px}.avatar{width:220px;height:220px}
 h1{font-size:40px}.subtitle{font-size:16px}.buttons{flex-direction:column;align-items:center;gap:12px}.btn{width:220px}
}
@media(max-width:500px){nav ul{display:none}.hero{padding-top:90px}.avatar-wrap{width:220px;height:220px}.avatar{width:198px;height:198px}h1{font-size:34px}}
</style>
</head>
<body>
<nav>
  <div class="logo"><span class="star">✦</span><span class="blue">TERBYTE</span><span class="purple">-CONNEC</span></div>
  <ul>
    <li><a class="active" href="#home">首页</a></li>
    <li><a href="#about">关于我</a></li>
    <li><a href="#skills">技能</a></li>
    <li><a href="#projects">项目</a></li>
    <li><a href="#contact">联系</a></li>
  </ul>
</nav>

<main id="home" class="hero">
  <div class="hero-inner">
    <div class="avatar-wrap">
      <img class="avatar" src="avatar.png" alt="个人头像">
    </div>
    <h1>Jake <span>Ken</span></h1>
    <p class="subtitle">I am heike I am heike<br>No kill me! No kill me!</p>
    <div class="buttons">
      <a class="btn primary" href="https://project.konshion.com">查看我的项目　→</a>
      <a class="btn secondary" id="contactBtn" href="#contact">联系我</a>
    </div>
  </div>
  <div class="scroll">⌄</div>
</main>

<!-- 下面这些区域先留空，方便以后继续添加内容 -->
<section id="about"></section>
<section id="skills"></section>
<section id="projects"></section>
<section id="contact"></section>

<div class="contact-modal" id="contactModal" role="dialog" aria-modal="true" aria-labelledby="contactTitle">
  <div class="contact-box">
    <h2 id="contactTitle">联系我</h2>
    <p>你可以通过以下邮箱联系我：</p>
    <div class="email"><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="3e535b7e5551504d56575150105d5153">[email&#160;protected]</a></div>
    <button class="close-btn" id="closeContact" type="button">关闭</button>
  </div>
</div>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
const links=document.querySelectorAll('nav a');
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#home'&&y<300));
});

const contactBtn=document.getElementById('contactBtn');
const contactModal=document.getElementById('contactModal');
const closeContact=document.getElementById('closeContact');

contactBtn.addEventListener('click',()=>contactModal.classList.add('show'));
closeContact.addEventListener('click',()=>contactModal.classList.remove('show'));
contactModal.addEventListener('click',(e)=>{
  if(e.target===contactModal) contactModal.classList.remove('show');
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') contactModal.classList.remove('show');
});
</script>

</body>
</html>
