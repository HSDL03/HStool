<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>备份计分板 · 红石的小工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#fbfaf2;--bg2:#f4f0e0;
  --text:#1f1f1f;--muted:#6a6a5c;
  --bd:#c8c4b0;--bd2:#4a4a3a;
  --ac:#3d521f;--ac2:#7a9c3c;--acs:#e0e8d0;
  --dgr:#c04040;--ok:#2d7a2d;--gold:#c8a227;
  --r:6px;
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-h:0 6px 18px rgba(0,0,0,.10);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{
  background-image:
    radial-gradient(circle at 15% 15%, rgba(122,156,60,.10), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(61,82,31,.08), transparent 40%);
  min-height:100vh;
}

.topbar{position:sticky;top:0;z-index:50;height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;
  background:linear-gradient(180deg,#3d521f,#2c3e14);border-bottom:3px solid #1a2a0a;
  box-shadow:0 3px 12px rgba(0,0,0,.18);}
.topbar .logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#fff;text-decoration:none;letter-spacing:.02em;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.topbar .logo-icon{font-size:20px}
.topbar .sp{flex:1}
.topbar .icon{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;
  font-size:12.5px;font-family:inherit;font-weight:700;color:rgba(255,255,255,.92);
  background:rgba(0,0,0,.18);border:1px solid rgba(0,0,0,.3);border-radius:var(--r);
  cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .12s;}
.topbar .icon:hover{background:rgba(0,0,0,.32);color:#fff}
.topbar .icon:active{transform:translateY(1px)}
.topbar .icon.gold{background:linear-gradient(180deg,#e8d68a,#c8a227);color:#3a2a00;border-color:#7a6210;text-shadow:none}

.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}

.page-head{text-align:center;margin-bottom:24px}
.page-head h1{margin:0 0 6px;font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,#3d521f 0%,#7a9c3c 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-head .sub{margin:0;font-size:13.5px;color:var(--muted)}

.status-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;margin-bottom:18px;
  background:#fff;border:1px solid var(--bd);border-left:4px solid var(--ac2);border-radius:var(--r);
  box-shadow:var(--shadow);font-size:13px;}
.status-bar .dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--ac2);box-shadow:0 0 0 3px rgba(122,156,60,.2)}
.status-bar .dot.warn{background:#e8a840;box-shadow:0 0 0 3px rgba(232,168,64,.2)}
.status-bar .dot.bad{background:var(--dgr);box-shadow:0 0 0 3px rgba(192,64,64,.2)}
.status-bar .sp{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;font-family:inherit;font-weight:700;
  color:var(--text);background:linear-gradient(180deg,#fff,#f0ebd8);
  border:1px solid var(--bd);border-bottom-width:2px;border-bottom-color:#b8b09a;
  border-radius:var(--r);cursor:pointer;transition:background .15s,transform .12s,box-shadow .15s;}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#fff,#e8e2cc);transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:#fff;background:linear-gradient(180deg,#7a9c3c,#5a7a2c);border-color:#3d521f;border-bottom-color:#2a3a1a;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn.p:hover:not(:disabled){background:linear-gradient(180deg,#8aac4c,#6a8a3c)}
.btn.gold{color:#3a2a00;background:linear-gradient(180deg,#f0de92,#c8a227);border-color:#7a6210;border-bottom-color:#5a4208}
.btn.gold:hover:not(:disabled){background:linear-gradient(180deg,#f8e6a2,#d4ae2f)}
.btn.d{color:var(--dgr)}
.btn.d:hover:not(:disabled){background:linear-gradient(180deg,#fff,#f8e0e0)}
.btn.sm{padding:5px 11px;font-size:12px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;margin-bottom:18px;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);}
.toolbar .search{position:relative;flex:1;min-width:200px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.toolbar .search input{width:100%;height:38px;padding:0 12px 0 36px;font-size:13.5px;font-family:inherit;color:var(--text);
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);outline:none;
  transition:border-color .15s,box-shadow .15s;}
.toolbar .search input:focus{background:#fff;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(122,156,60,.18)}

.upload-zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:160px;padding:24px;margin-bottom:18px;background:#fff;border:2px dashed var(--bd);
  border-radius:var(--r);cursor:pointer;transition:all .2s;}
.upload-zone:hover{border-color:var(--ac2);background:#fafff5}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--bd);background:#1a1a1a;overflow:hidden}
.upload-zone .uz-icon{font-size:48px;opacity:.5;margin-bottom:10px}
.upload-zone .uz-title{font-size:15px;font-weight:700;margin-bottom:6px}
.upload-zone .uz-hint{font-size:12.5px;color:var(--muted)}
.upload-zone .uz-img{display:block;max-width:100%;max-height:480px;object-fit:contain;cursor:zoom-in}
.upload-zone .uz-remove{position:absolute;top:10px;right:10px;width:30px;height:30px;display:grid;place-items:center;
  font-size:14px;color:#fff;background:rgba(192,64,64,.9);border:2px solid rgba(0,0,0,.5);
  border-radius:50%;cursor:pointer;z-index:2;transition:background .15s,transform .12s;}
.upload-zone .uz-remove:hover{background:var(--dgr);transform:scale(1.1)}

/* ==================== 主计分板 —— 卡片布局 ==================== */
.board{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.board-card{
  position:relative;
  display:flex;
  gap:18px;
  padding:18px;
  background:#fff;
  border:4px solid #f0d040;
  border-radius:8px;
  box-shadow:0 3px 10px rgba(200,162,39,.15);
  transition:box-shadow .2s,transform .2s;
  animation:cardIn .35s cubic-bezier(.22,1,.36,1) both;
}
.board-card:hover{
  box-shadow:0 8px 24px rgba(200,162,39,.25);
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.board-card.top1{border-color:#ffd700;box-shadow:0 3px 12px rgba(255,215,0,.3)}
.board-card.top1:hover{box-shadow:0 8px 24px rgba(255,215,0,.4)}
.board-card.top2{border-color:#c0c8d0;box-shadow:0 3px 12px rgba(192,200,208,.3)}
.board-card.top3{border-color:#cd7f32;box-shadow:0 3px 12px rgba(205,127,50,.3)}

/* 左侧头像 */
.bc-avatar{
  flex:none;
  width:150px;
  min-height:220px;
  background:#d0d0d0;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#8a8a8a;
  font-size:56px;
  font-weight:900;
  letter-spacing:-.04em;
  position:relative;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.06);
}
.bc-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.bc-avatar .bc-avatar-empty{
  font-size:56px;
  color:#9a9a9a;
}

/* 右侧信息区 */
.bc-info{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* 玩家名行 */
.bc-name-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding-bottom:10px;
  border-bottom:2px dashed rgba(240,208,64,.5);
}
.bc-rank{
  flex:none;
  font-size:18px;
  font-weight:900;
  color:var(--muted);
  min-width:44px;
  text-align:center;
}
.board-card.top1 .bc-rank{color:#c8a227}
.board-card.top2 .bc-rank{color:#9a9a9a}
.board-card.top3 .bc-rank{color:#c08040}

.bc-name{
  flex:1;
  min-width:0;
  font-size:22px;
  font-weight:900;
  color:#2a3a1a;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  letter-spacing:-.01em;
  cursor:text;
  padding:2px 4px;
  border-radius:4px;
  transition:background .15s;
}
.bc-name:hover{background:var(--acs)}

.bc-actions{display:flex;gap:5px;flex:none}

/* 字段网格 */
.bc-fields{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
}

.bc-field{
  display:flex;
  align-items:center;
  gap:0;
  background:#e2e2e2;
  border-radius:5px;
  padding:3px;
  height:42px;
  cursor:pointer;
  transition:background .15s;
}
.bc-field:hover{background:#d8d8d8}

.bc-field .v{
  flex:1;
  height:100%;
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  background:linear-gradient(180deg,#5a8aff 0%,#2f5ee8 100%);
  color:#fff;
  border-radius:4px;
  padding:0 12px;
  font-family:var(--mono);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
}

.bc-field .k{
  font-size:10.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:rgba(255,255,255,.78);
  flex:none;
  text-shadow:0 1px 0 rgba(0,0,0,.2);
}

.bc-field .n{
  flex:1;
  text-align:right;
  font-size:15px;
  font-weight:800;
  color:#fff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 1px rgba(0,0,0,.25);
}

.bc-field.missing .v{
  background:linear-gradient(180deg,#b8b8b8,#909090);
  color:rgba(255,255,255,.7);
}
.bc-field.missing .n{font-style:italic;font-weight:600}

/* 空状态 */
.empty{padding:60px 20px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--r);
  border:1px solid var(--bd);box-shadow:var(--shadow);}
.empty .ic{font-size:56px;opacity:.35;display:block;margin-bottom:14px}
.empty .lead{font-size:14px;line-height:1.9}

/* ==================== OCR 面板 ==================== */
.ocr-panel{margin-bottom:18px;background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ocr-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(180deg,#7a9c3c,#5a7a2c);color:#fff;font-size:13px;font-weight:800;
  letter-spacing:.04em;text-shadow:1px 1px 0 rgba(0,0,0,.3);}
.ocr-head .dot{width:10px;height:10px;flex:none;border-radius:50%;background:#8a8a8a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.ocr-head .dot.busy{background:#d4a72c;animation:pulse 1s infinite}
.ocr-head .dot.ok{background:#a4d468;box-shadow:0 0 0 3px rgba(164,212,104,.35)}
.ocr-head .dot.warn{background:#e8a840}
.ocr-head .dot.bad{background:#e05050}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ocr-head .sp{flex:1}
.ocr-head .close{width:26px;height:26px;display:grid;place-items:center;font-size:13px;color:rgba(255,255,255,.85);
  background:transparent;border:none;border-radius:4px;cursor:pointer;}
.ocr-head .close:hover{background:rgba(0,0,0,.2);color:#fff}

.ocr-body{padding:16px}
.ocr-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;
  background:#e6f4ff;border:1px solid #b8dcf0;border-radius:var(--r);font-size:13px;color:#0b7bc4;}
.ocr-status.bad{background:#fff0f0;border-color:#f0c0c0;color:var(--dgr)}
.ocr-status .badge{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;font-weight:800;
  background:#fff;border:1px solid currentColor;border-radius:10px;}

.ocr-progress{height:6px;background:#e8e2cc;border-radius:3px;overflow:hidden;margin-bottom:12px}
.ocr-progress-bar{height:100%;width:0;background:linear-gradient(90deg,#7a9c3c,#a4d468);transition:width .25s;border-radius:3px}

.ocr-raw{padding:10px 14px;background:#fafaf5;border:1px solid var(--bd);border-radius:var(--r);
  font-family:var(--mono);font-size:12px;line-height:1.7;max-height:160px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-all;color:var(--muted);margin-bottom:12px;}
.ocr-raw mark{background:#d4a72c;color:#1f1f1f;padding:0 3px;border-radius:3px;font-weight:700}

.ocr-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--bd)}

/* 预览列表 */
.preview-list{display:flex;flex-direction:column;gap:14px;margin-top:16px}

/* ==================== 管理员面板 ==================== */
.admin-panel{margin-bottom:18px;background:#fff;border:1px solid var(--bd);border-left:4px solid var(--gold);
  border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.admin-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(180deg,#f8e6a2,#e8d68a);color:#3a2a00;font-size:13px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--gold);}
.admin-head .cnt{padding:2px 10px;font-size:11.5px;background:rgba(0,0,0,.12);border-radius:10px}
.admin-head .sp{flex:1}
.admin-head .mini{width:26px;height:26px;display:grid;place-items:center;font-size:13px;color:#3a2a00;
  background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.15);border-radius:4px;cursor:pointer;}
.admin-head .mini:hover{background:#fff}
.admin-body{padding:16px}
.admin-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

.pending-card{padding:14px;background:#fafaf5;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;transition:box-shadow .2s;}
.pending-card:last-child{margin-bottom:0}
.pending-card:hover{box-shadow:var(--shadow)}
.pd-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pd-name{flex:1;min-width:0;font-size:16px;font-weight:800;color:#2a3a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-time{font-size:11.5px;color:var(--muted)}
.pd-score{padding:3px 10px;font-size:12px;font-weight:800;font-family:var(--mono);color:#0b7bc4;
  background:#e6f4ff;border:1px solid #b8dcf0;border-radius:10px;font-variant-numeric:tabular-nums;}
.pd-img{display:block;width:100%;max-height:240px;object-fit:contain;background:#0a0a0a;border:1px solid var(--bd2);
  border-radius:var(--r);margin-bottom:12px;cursor:zoom-in;transition:filter .15s;}
.pd-img:hover{filter:brightness(1.08)}
.pd-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:10px;
  background:#fff;border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;}
.pd-f{display:flex;flex-direction:column;gap:2px;padding:6px 8px;background:#fafaf5;border-radius:4px}
.pd-f .k{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.pd-f .v{font-family:var(--mono);font-size:13px;font-weight:700;color:#0b7bc4;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-acts{display:flex;gap:8px;flex-wrap:wrap}

/* ==================== 弹窗 ==================== */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(20,30,10,.6);backdrop-filter:blur(4px);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:480px;max-height:calc(100vh - 40px);
  background:#fff;border:2px solid var(--bd2);border-radius:var(--r);box-shadow:0 12px 40px rgba(0,0,0,.35);
  overflow:hidden;transform:translateY(20px) scale(.97);transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.ov.show .pnl{transform:none}
.pnl.gold{border-color:var(--gold)}
.pnl.gold .ph{background:linear-gradient(180deg,#f8e6a2,#e8d68a);color:#3a2a00;text-shadow:none;border-bottom-color:var(--gold)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(180deg,#7a9c3c,#5a7a2c);
  color:#fff;font-size:14px;font-weight:800;text-shadow:1px 1px 0 rgba(0,0,0,.3);border-bottom:2px solid #3d521f;}
.ph .sp{flex:1}
.ph .close{width:28px;height:28px;display:grid;place-items:center;font-size:14px;color:rgba(255,255,255,.85);
  background:transparent;border:none;border-radius:4px;cursor:pointer;}
.ph .close:hover{background:rgba(0,0,0,.2);color:#fff}
.pb{padding:18px;overflow-y:auto}
.pb .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.pb .fld span{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pb .fld input{height:38px;padding:0 12px;font-size:14px;font-family:inherit;color:var(--text);
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);outline:none;}
.pb .fld input:focus{border-color:var(--ac2);box-shadow:0 0 0 3px rgba(122,156,60,.18)}
.pb .hint{padding:10px 12px;font-size:12px;line-height:1.65;color:var(--muted);background:var(--bg2);
  border:1px solid var(--bd);border-radius:var(--r);}
.field-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid #f0ebe0}
.field-row:last-child{border-bottom:none}
.field-row .fk{flex:none;width:110px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.field-row .fv{flex:1;text-align:right;font-family:var(--mono);font-size:15px;font-weight:800;color:#0b7bc4;font-variant-numeric:tabular-nums}
.pfoot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--bd);background:#fafaf5}
.pfoot .sp{flex:1}

.lightbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(0,0,0,.92);z-index:200;opacity:0;visibility:hidden;transition:opacity .2s;cursor:zoom-out;}
.lightbox.show{opacity:1;visibility:visible}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;animation:zoomIn .25s cubic-bezier(.34,1.56,.64,1) both}
@keyframes zoomIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.toast{position:fixed;left:50%;bottom:30px;max-width:calc(100vw - 40px);padding:12px 22px;font-size:13.5px;font-weight:700;
  color:#e8ffd0;background:linear-gradient(180deg,#3d521f,#2a3a1a);border:2px solid #1a2a0a;border-radius:var(--r);
  box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateX(-50%) translateY(20px);
  transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:210;
  text-shadow:1px 1px 0 rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  .wrap{padding:20px 14px 60px}
  .page-head h1{font-size:1.4rem}
  .board-card{flex-direction:column;gap:14px;padding:14px}
  .bc-avatar{width:100%;min-height:180px;height:180px}

function compressImage(dataUrl, maxBytes){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var maxDim = 1400;
      var scale = 1;
      if(img.naturalWidth > maxDim || img.naturalHeight > maxDim){
        scale = Math.min(maxDim/img.naturalWidth, maxDim/img.naturalHeight);
      }
      var w = Math.round(img.naturalWidth * scale);
      var h = Math.round(img.naturalHeight * scale);
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      var q = 0.9;
      var out = cv.toDataURL('image/jpeg', q);
      while(out.length > maxBytes && q > 0.3){ q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}

/* ============================================================ */
function preprocessImage(dataUrl){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var scale = Math.max(1, Math.min(2.2, 1400 / img.naturalWidth));
      var w = Math.round(img.naturalWidth * scale);
      var h = Math.round(img.naturalHeight * scale);
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(img, 0, 0, w, h);

      var imgData = ctx.getImageData(0, 0, w, h);
      var d = imgData.data;

      var sum = 0, cnt = 0;
      for(var i = 0; i < d.length; i += 64){ sum += (d[i]+d[i+1]+d[i+2])/3; cnt++; }
      var isDark = (sum / Math.max(1, cnt)) < 110;

      for(var j = 0; j < d.length; j += 4){
        var r = d[j], g = d[j+1], b = d[j+2];
        var bright = (r + g + b) / 3;
        var isBlue = (b > r + 25 && b > g + 15 && b > 90);
        var isWhite = (r > 180 && g > 180 && b > 180 && bright > 200);

        if(isDark){
          if(isBlue){ d[j] = 0; d[j+1] = 60; d[j+2] = 200; }
          else if(isWhite){ d[j] = 0; d[j+1] = 0; d[j+2] = 0; }
          else if(bright < 70){ d[j] = 255; d[j+1] = 255; d[j+2] = 255; }
          else { d[j] = 180; d[j+1] = 180; d[j+2] = 180; }
        } else {
          if(isBlue){ d[j] = 0; d[j+1] = 60; d[j+2] = 200; }
          else if(bright < 120){ d[j] = 0; d[j+1] = 0; d[j+2] = 0; }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      resolve({ dataUrl: cv.toDataURL('image/png'), imageData: imgData, width: w, height: h });
    };
    img.onerror = function(){ resolve(null); };
    img.src = dataUrl;
  });
}

function classifyWord(imageData, bbox){
  var W = imageData.width, H = imageData.height, d = imageData.data;
  var x0 = Math.max(0, Math.floor(bbox.x0)), y0 = Math.max(0, Math.floor(bbox.y0));
  var x1 = Math.min(W-1, Math.ceil(bbox.x1)), y1 = Math.min(H-1, Math.ceil(bbox.y1));

  var rSum=0, gSum=0, bSum=0, n=0;
  for(var y = y0; y <= y1; y += 1){
    for(var x = x0; x <= x1; x += 1){
      var idx = (y*W + x)*4;
      var r = d[idx], g = d[idx+1], b = d[idx+2];
      if(r > 220 && g > 220 && b > 220) continue;
      rSum += r; gSum += g; bSum += b; n++;
    }
  }
  if(n < 3) return 'other';
  var aR = rSum/n, aG = gSum/n, aB = bSum/n;
  if(aB > aR + 40 && aB > aG + 20 && aB > 120) return 'blue';
  if(aR < 100 && aG < 100 && aB < 100) return 'black';
  return 'other';
}

function groupIntoRows(words){
  if(!words.length) return [];
  var sorted = words.slice().sort(function(a, b){
    var ay = (a.bbox.y0 + a.bbox.y1) / 2;
    var by = (b.bbox.y0 + b.bbox.y1) / 2;
    return ay - by;
  });
  var rows = [];
  var cur = null;
  sorted.forEach(function(w){
    var yc = (w.bbox.y0 + w.bbox.y1) / 2;
    var hh = Math.max(6, w.bbox.y1 - w.bbox.y0);
    if(!cur){ cur = { yMin: w.bbox.y0, yMax: w.bbox.y1, items: [w] }; return; }
    var cyc = (cur.yMin + cur.yMax) / 2;
    if(Math.abs(yc - cyc) < hh * 0.7){
      cur.items.push(w);
      cur.yMin = Math.min(cur.yMin, w.bbox.y0);
      cur.yMax = Math.max(cur.yMax, w.bbox.y1);
    } else {
      rows.push(cur);
      cur = { yMin: w.bbox.y0, yMax: w.bbox.y1, items: [w] };
    }
  });
  if(cur) rows.push(cur);
  rows.forEach(function(r){ r.items.sort(function(a,b){ return a.bbox.x0 - b.bbox.x0; }); });
  return rows;
}

async function runOCR(dataUrl){
  if(!dataUrl) return;
  ocrPanel.style.display='block';
  if(typeof Tesseract === 'undefined'){
    setOCRDot('bad');
    updateOCRStatus('<span class="badge">✕</span> 识别库加载失败，请刷新', true);
    return;
  }
  if(ocrState.running) return;
  ocrState.running = true;
  ocrState.text = '';
  ocrState.players = [];

  setOCRDot('busy');
  updateOCRStatus('<span class="badge">⏳</span> 颜色分离预处理…');
  ocrProgressWrap.style.display='block';
  ocrProgressBar.style.width='0%';
  ocrRawBox.style.display='none';
  previewList.innerHTML='';
  ocrActions.style.display='none';

  var pre = await preprocessImage(dataUrl);
  if(!pre){
    ocrState.running = false;
    setOCRDot('bad');
    updateOCRStatus('<span class="badge">✕</span> 图片处理失败', true);
    return;
  }

  updateOCRStatus('<span class="badge">⏳</span> 加载识别引擎…');

  try{
    var result = await Tesseract.recognize(pre.dataUrl, 'eng+chi_sim', {
      logger: function(m){
        if(!m) return;
        if(m.status === 'loading tesseract core') updateOCRStatus('<span class="badge">⏳</span> 加载核心…');
        else if(m.status === 'initializing tesseract') updateOCRStatus('<span class="badge">⏳</span> 初始化…');
        else if(m.status === 'loading language traineddata'){
          var p = Math.round((m.progress||0)*100);
          updateOCRStatus('<span class="badge">⏳</span> 下载语言包… '+p+'%（首次较慢）');
          ocrProgressBar.style.width = p+'%';
        } else if(m.status === 'initializing api') updateOCRStatus('<span class="badge">⏳</span> 准备中…');
        else if(m.status === 'recognizing text'){
          var p2 = Math.round((m.progress||0)*100);
          updateOCRStatus('<span class="badge">⏳</span> 识别中… '+p2+'%');
          ocrProgressBar.style.width = p2+'%';
        }
      }
    });

    ocrState.running = false;
    ocrState.text = (result.data && result.data.text) || '';

    var words = [];
    if(result.data.words && result.data.words.length){
      words = result.data.words;
    } else if(result.data.lines){
      result.data.lines.forEach(function(line){
        if(line.words) line.words.forEach(function(w){ words.push(w); });
      });
    }

    var classified = [];
    words.forEach(function(w){
      if(!w.text || !w.text.trim()) return;
      if(!w.bbox) return;
      var cat = classifyWord(pre.imageData, w.bbox);
      classified.push({ text: w.text.trim(), bbox: w.bbox, category: cat });
    });

    var rows = groupIntoRows(classified);

    ocrState._debug = {
      totalWords: words.length,
      classified: classified,
      rows: rows.map(function(r){
        return r.items.map(function(w){ return w.category + ':' + w.text; }).join(' | ');
      })
    };

    processOCRWithColors(rows);

  }catch(err){
    ocrState.running = false;
    setOCRDot('bad');
    updateOCRStatus('<span class="badge">✕</span> 识别失败：'+esc(err.message||err), true);
    ocrProgressWrap.style.display='none';
  }
}

function hasTuber(str){
  var s = String(str||'').replace(/[\s\-_.·、,，|]/g,'').toLowerCase();
  if(!s) return false;
  if(s.indexOf('tuber') !== -1) return true;
  if(s.indexOf('tvber') !== -1) return true;
  if(s.indexOf('tnber') !== -1) return true;
  if(s.indexOf('tubar') !== -1) return true;
  if(s.indexOf('tuher') !== -1) return true;
  if(/\bt\w*ber/i.test(s)) return true;
  return false;
}

function fixDigit(str){
  return String(str)
    .replace(/[OoQ]/g,'0').replace(/[Il|!]/g,'1').replace(/[Zz]/g,'2')
    .replace(/S/g,'5').replace(/[Gg]/g,'6').replace(/B/g,'8')
    .replace(/[，、。：:]/g,'').replace(/\s+/g,'');
}

function processOCRWithColors(rows){
  var parsed = [];
  var current = null;

  function flush(){
    if(current && current.nums.length > 0) parsed.push(current);
    current = null;
  }

  rows.forEach(function(row){
    row.items.forEach(function(w){
      var text = w.text;
      if(!text) return;
      if(hasTuber(text)){ flush(); return; }

      if(w.category === 'blue'){
        var fixed = fixDigit(text);
        if(/^-?\d+$/.test(fixed)){
          if(!current){
            current = { name: '未命名玩家', nums: [], submitting:false, submitted:false };
          }
          if(current.nums.length < FIELD_COUNT){
            current.nums.push(fixed);
          }
        }
        return;
      }

      if(w.category === 'black' || w.category === 'other'){
        var nameTxt = text.replace(/[§$]/g,'').trim();
        if(!nameTxt) return;
        if(current && current.nums.length > 0){ flush(); }
        current = { name: nameTxt, nums: [], submitting:false, submitted:false };
      }
    });
  });

  flush();
  parsed = parsed.filter(function(p){ return p.nums.length > 0; });

  ocrState.players = parsed;

  if(ocrState.text){
    ocrRawBox.innerHTML = esc(ocrState.text).replace(/\n/g,'<br>');
    ocrRawBox.style.display = 'none';
  }
  ocrProgressWrap.style.display = 'none';
  ocrActions.style.display = 'flex';

  if(parsed.length === 0){
    setOCRDot('warn');
    updateOCRStatus('<span class="badge">!</span> 未解析出玩家数据，点「🎨 颜色诊断」查看详情', true);
    return;
  }

  var totalNums = parsed.reduce(function(s,p){return s+p.nums.length;},0);
  setOCRDot('ok');
  updateOCRStatus('<span class="badge">✓</span> 识别到 <strong>'+parsed.length+'</strong> 位玩家 · <strong>'+totalNums+'</strong> 个数值 · 点数字可修改');
  renderPreview();
}

function getTop3(){
  var s = players.slice().sort(function(a,b){ return bigOrFloat(b.score) > bigOrFloat(a.score) ? 1 : -1; });
  var t = {};
  if(s[0]) t[s[0].id]=1;
  if(s[1]) t[s[1].id]=2;
  if(s[2]) t[s[2].id]=3;
  return t;
}

function renderBoard(){
  if(players.length === 0){
    boardBody.innerHTML = '<div class="empty"><span class="ic">📭</span><div class="lead">还没有已批准的玩家<br>上传图片识别后提交申请，等待管理员审核</div></div>';
    return;
  }
  var q = searchQuery.trim().toLowerCase();
  var list = players;
  if(q) list = players.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1; });
  if(list.length === 0){
    boardBody.innerHTML = '<div class="empty"><span class="ic">🔍</span><div class="lead">没有匹配「'+esc(searchQuery)+'」的玩家</div></div>';
    return;
  }
  var top = q ? {} : getTop3();
  var html = '';
  list.forEach(function(p){
    var rank = players.indexOf(p) + 1;
    var rc = '';
    var tr = top[p.id];
    if(tr === 1) rc = 'top1';
    else if(tr === 2) rc = 'top2';
    else if(tr === 3) rc = 'top3';

    var medal = '';
    if(tr === 1) medal = '🥇';
    else if(tr === 2) medal = '🥈';
    else if(tr === 3) medal = '🥉';

    html += '<div class="board-card '+rc+'" data-id="'+esc(p.id)+'">';

    /* 左侧头像 */
    html += '<div class="bc-avatar">';
    if(p.image){
      html += '<img src="'+esc(p.image)+'" alt="">';
    } else {
      /* 显示玩家名首字 */
      var ch = (p.name || '?').trim().charAt(0) || '?';
      html += '<div class="bc-avatar-empty">'+esc(ch.toUpperCase())+'</div>';
    }
    html += '</div>';

    /* 右侧信息 */
    html += '<div class="bc-info">';

    /* 名字行 */
    html += '<div class="bc-name-row">';
    html += '<div class="bc-rank">' + (medal ? medal : '') + ' #' + rank + '</div>';
    html += '<div class="bc-name"'+(isAdmin?' data-action="edit-name"':'')+' title="'+(isAdmin?'点击修改':'')+'">'+esc(p.name)+'</div>';
    if(isAdmin){
      html += '<div class="bc-actions">';
      html += '<button class="btn sm" data-action="dec" title="减 1">−</button>';
      html += '<button class="btn sm" data-action="inc" title="加 1">＋</button>';
      html += '<button class="btn sm d" data-action="del" title="删除">✕</button>';
      html += '</div>';
    } else {
      html += '<div class="bc-actions"><button class="btn sm" data-action="view-fields">📋 详情</button></div>';
    }
    html += '</div>';

    /* 字段网格 */
    html += '<div class="bc-fields">';
    FIELD_DEFS.forEach(function(f, fi){
      var v = p.fields ? p.fields[f.key] : undefined;
      var cls = 'bc-field' + (v === undefined || v === '' ? ' missing' : '');
      html += '<div class="'+cls+'" data-field="'+esc(f.key)+'" data-action="'+(isAdmin?'edit-field':'noop')+'" title="'+(isAdmin?'点击修改「'+esc(f.label)+'」':'「'+esc(f.label)+'」')+'">';
      html += '<div class="v">';
      html += '<span class="k">'+esc(f.label)+'</span>';
      html += '<span class="n">' + (v===undefined||v===''?'—':esc(v)) + '</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>'; /* bc-fields */

    html += '</div>'; /* bc-info */
    html += '</div>'; /* board-card */
  });
  boardBody.innerHTML = html;
}

function render(){ renderBoard(); }

function findPlayer(id){
  for(var i=0; i<players.length; i++) if(players[i].id === id) return players[i];
  return null;
}

function changeScore(id, delta){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p) return;
  var cur = p.score || '0';
  var ns;
  try{ ns = (BigInt(cur) + BigInt(delta)).toString(); }
  catch(e){ ns = String((parseFloat(cur)||0) + delta); }
  var nf = Object.assign({}, p.fields || {});
  nf.tuber = ns;
  updatePlayer(id, { score: ns, fields: nf });
}

function deleteP(id){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p) return;
  if(!confirm('删除「'+p.name+'」？所有人都会看不到。')) return;
  removePlayer(id);
}

function editName(el, id){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p) return;
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.value = p.name;
  inp.maxLength = 40;
  inp.style.cssText = 'font:inherit;font-weight:800;font-size:20px;color:#2a3a1a;width:100%;padding:2px 8px;border:2px solid #7a9c3c;border-radius:4px;outline:none;background:#fff;';
  el.innerHTML = '';
  el.appendChild(inp);
  inp.focus(); inp.select();
  var done = false;
  function fin(sv){
    if(done) return; done = true;
    if(sv && inp.value.trim() && inp.value.trim() !== p.name){
      updatePlayer(id, { name: inp.value.trim().slice(0,40) });
      return;
    }
    render();
  }
  inp.addEventListener('blur', function(){ fin(true); });
  inp.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); fin(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); fin(false); }
  });
}

function editField(scope, fieldKey, id){
  if(!isAdmin) return;
  var p = findPlayer(id);
  if(!p) return;
  var cur = p.fields ? (p.fields[fieldKey] || '') : '';
  var nv = prompt('修改「' + fieldKey + '」：', cur);
  if(nv === null) return;
  nv = String(nv).trim();
  var nf = Object.assign({}, p.fields || {});
  nf[fieldKey] = nv;
  var patch = { fields: nf };
  /* 如果改的是 tuber，同步 score */
  if(fieldKey === 'tuber') patch.score = nv || '0';
  updatePlayer(id, patch);
}

  if(!p) return;

  var act = e.target.closest('[data-action]');

  var a = act.getAttribute('data-action');

  if(a === 'inc'){ changeScore(id, 1); return; }
  if(a === 'dec'){ changeScore(id, -1); return; }
  if(a === 'del'){ deleteP(id); return; }
  if(a === 'edit-name'){ editName(act, id); return; }
  if(a === 'edit-field'){
    var fk = act.getAttribute('data-field');
    if(fk) editField('card', fk, id);

  if(a === 'view-fields'){

});

  }
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    searchInput.focus(); searchInput.select();
  }
});

async function boot(){
  try{
    var img = localStorage.getItem(K_IMAGE);
    if(img && img.indexOf('data:image/') === 0) boardImage = img;
  }catch(e){}
  updateImageUI();
  initSupabase();
  updateBanner();

  if(cloudReady){
    sb.auth.onAuthStateChange(function(event, session){ applyAdminState(!!(session && session.user)); });
    try{
      var s = await sb.auth.getSession();
      await applyAdminState(!!(s.data && s.data.session && s.data.session.user));
    }catch(e){ await applyAdminState(false); }
    await fetchApprovedPlayers();
    setupRealtime();
  } else {
    render();
    applyAdminState(false);
  }

  if(boardImage) setTimeout(function(){ runOCR(boardImage); }, 500);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
</body>
</html>
