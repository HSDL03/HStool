<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A* 寻路演示 · 红石的小站</title>
<meta name="description" content="3D 的 A* 寻路可视化：画墙、铺水域和危险区，看算法一步步把开放列表铺满地图。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
  /* 页面是「一整块画布 + 浮层」，所以只借 core.css 的令牌与顶栏，布局自己来 */
  html,body{height:100%}
  body{overflow:hidden}

  #cv{
    position:fixed;left:0;right:0;top:var(--topbar-h,52px);bottom:0;
    width:100%;height:calc(100% - var(--topbar-h,52px));
    display:block;touch-action:none;background:var(--bg2);
  }

  /* 浮层：容器不吃事件，子元素各自吃，画布才能画 */
  .hud{position:fixed;inset:var(--topbar-h,52px) 0 0 0;z-index:20;pointer-events:none}
  .hud > *{pointer-events:auto}

  .hd{position:absolute;top:14px;left:16px;max-width:46vw;pointer-events:none}
  .hd h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;color:var(--text)}
  .hd p{margin:3px 0 0;font-size:11.5px;color:var(--faint);line-height:1.5}
  .hd kbd{
    display:inline-block;padding:0 4px;margin:0 1px;font-family:var(--mono);font-size:10.5px;
    border:1px solid var(--bd);border-radius:2px;background:var(--bg2);color:var(--muted);
  }

  /* ── 控制面板 ── */
  .pnl{
    position:absolute;top:14px;right:14px;width:226px;
    display:flex;flex-direction:column;gap:6px;
    padding:10px;background:var(--bg);
    border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--sh);
    transition:opacity .16s ease;
  }
  .row{display:flex;gap:6px}
  .btn{
    flex:1;min-width:0;padding:8px 6px;
    font-family:inherit;font-size:12px;font-weight:700;line-height:1;
    color:var(--text);background:var(--bg2);
    border:2px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel);
    cursor:pointer;white-space:nowrap;
    transition:background .12s,border-color .12s,color .12s,transform .06s;
  }
  .btn:hover{background:var(--bg3);border-color:var(--bd2)}
  .btn:active{transform:translateY(1px)}
  .btn.on,.btn.primary{background:var(--ac);border-color:var(--ac);color:var(--on-ac);box-shadow:none}
  .btn.primary:hover,.btn.on:hover{background:var(--ac);border-color:var(--ac);filter:brightness(1.08)}
  .btn.wide{flex:0 0 auto;padding:8px 10px}
  .btn:disabled{
    color:var(--faint);background:var(--bg2);border-color:var(--bd);
    box-shadow:none;cursor:not-allowed;opacity:.55;
  }
  .btn:disabled:hover{background:var(--bg2);border-color:var(--bd)}
  .btn:disabled:active{transform:none}

  .sliders{
    display:flex;flex-direction:column;gap:7px;
    margin-top:2px;padding-top:9px;border-top:1px dashed var(--bd);
  }
  .sliders label{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);cursor:pointer}
  .sliders span{flex:0 0 26px}
  .sliders input[type=range]{
    flex:1;min-width:0;height:14px;background:transparent;
    accent-color:var(--ac);cursor:pointer;
  }
  .sliders output{
    flex:0 0 26px;text-align:right;
    font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ac);
    font-variant-numeric:tabular-nums;
  }

  /* ── 底部数据条 ── */
  .stats{
    position:absolute;left:16px;bottom:16px;
    display:flex;gap:16px;padding:8px 13px;
    background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);
    box-shadow:var(--sh);
  }
  .stats div{display:flex;flex-direction:column;gap:1px;min-width:38px}
  .stats i{font-style:normal;font-size:10px;letter-spacing:.06em;color:var(--faint)}
  .stats b{font-family:var(--mono);font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
  #visited{color:var(--ac)}
  #pathcost{color:var(--warn)}

  .status{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    padding:6px 14px;font-size:12px;font-weight:700;
    background:var(--bg);border:2px solid var(--bd2);border-radius:999px;
    box-shadow:var(--sh);color:var(--muted);white-space:nowrap;pointer-events:none;
  }
  .status.ok{color:var(--ok);border-color:var(--ok)}
  .status.err{color:var(--dgr);border-color:var(--dgr)}

  /* ── 图例 ── */
  .legend{
    position:absolute;right:16px;bottom:16px;
    display:grid;grid-template-columns:auto auto;gap:4px 14px;
    font-size:11px;color:var(--faint);pointer-events:none;
  }
  .legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:2px;flex:none;box-shadow:var(--bevel)}

  /* ── 加载 / 报错 ── */
  #mask{
    position:fixed;inset:var(--topbar-h,52px) 0 0 0;z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bg);color:var(--faint);font-size:12.5px;
    transition:opacity .5s;
  }
  #mask.done{opacity:0;pointer-events:none}
  .spin{
    width:30px;height:30px;border-radius:50%;
    border:3px solid var(--bd-soft);border-top-color:var(--ac);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #mask .err{color:var(--dgr);font-size:14px;font-weight:800}
  #mask .tip{max-width:420px;padding:0 24px;text-align:center;line-height:1.8}

  /* ── 自定义抽屉 ── */
  .drawer{
    position:absolute;top:14px;right:14px;width:264px;max-height:calc(100% - 28px);
    display:flex;flex-direction:column;
    background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);
    box-shadow:var(--sh);overflow:hidden;
    opacity:0;transform:translateX(10px);pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;
  }
  .drawer.open{opacity:1;transform:none;pointer-events:auto}
  .drawer > header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd)}
  .drawer > header strong{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--text)}
  .dx{
    width:22px;height:22px;flex:none;display:grid;place-items:center;
    font:800 13px/1 system-ui,sans-serif;color:var(--muted);background:var(--bg2);
    border:2px solid var(--bd);border-radius:var(--r);cursor:pointer;
  }
  .dx:hover{color:var(--dgr);border-color:var(--dgr)}

  .dtabs{display:flex;gap:4px;padding:8px 10px 0}
  .dtab{
    flex:1;padding:5px 0;font-family:inherit;font-size:11px;font-weight:700;line-height:1;
    color:var(--muted);background:var(--bg2);border:2px solid var(--bd);
    border-radius:var(--r);cursor:pointer;
  }
  .dtab:hover{border-color:var(--bd2);color:var(--text)}
  .dtab.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}

  .dbody{display:none;flex:1;min-height:0;overflow-y:auto;padding:10px 12px 12px}
  .dbody.on{display:block}

  .dsec{margin:12px 0 6px;font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--faint)}
  .dbody > .dsec:first-child{margin-top:0}

  .crow{display:flex;align-items:center;gap:8px;min-height:22px;margin:4px 0;font-size:11px;color:var(--muted)}
  .crow > span{flex:0 0 58px;white-space:nowrap}
  .crow > .sp{flex:1}
  .crow input[type=range]{flex:1;min-width:0;height:14px;accent-color:var(--ac);cursor:pointer}
  .crow output{
    flex:0 0 38px;text-align:right;font-family:var(--mono);font-size:10.5px;font-weight:800;
    color:var(--ac);font-variant-numeric:tabular-nums;
  }

  .sw{
    flex:0 0 46px;padding:4px 0;font-family:inherit;font-size:11px;font-weight:700;line-height:1;
    color:var(--text);background:var(--bg2);border:2px solid var(--bd);
    border-radius:var(--r);cursor:pointer;
  }
  .sw.on{background:var(--ac);border-color:var(--ac);color:var(--on-ac)}

  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .cgrid .crow{margin:2px 0}
  .cgrid .crow > span{flex:1;overflow:hidden;text-overflow:ellipsis}
  .crow input[type=color]{
    width:26px;height:18px;flex:none;padding:0;border:2px solid var(--bd);
    border-radius:2px;background:var(--bg2);cursor:pointer;
  }
  .crow input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
  .crow input[type=color]::-webkit-color-swatch{border:none;border-radius:1px}

  .dfoot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--bd);background:var(--bg2)}
  .dfoot .btn{padding:5px 8px;font-size:11px;flex:0 0 auto}
  .dfoot span{font-size:10px;color:var(--faint)}

  /* ── 批量统计面板 ── */
  .batch{
    position:absolute;left:16px;bottom:70px;width:316px;
    display:flex;flex-direction:column;gap:8px;padding:10px 12px;
    background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);
    box-shadow:var(--sh);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .16s ease,transform .16s ease;
  }
  .batch.open{opacity:1;transform:none;pointer-events:auto}
  .batch > header{display:flex;align-items:center;gap:8px}
  .batch > header strong{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--text)}
  .batch > header .bsub{flex:1;font-size:10.5px;color:var(--faint);text-align:right;white-space:nowrap}
  .bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 8px}
  .bgrid div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .bgrid i{font-style:normal;font-size:9.5px;letter-spacing:.02em;color:var(--faint);white-space:nowrap}
  .bgrid b{
    font-family:var(--mono);font-size:13px;font-weight:800;color:var(--text);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  #bAvgV{color:var(--ac)}
  #bAvgP{color:var(--warn)}
  #bHist{width:100%;height:84px;display:block;border-top:1px dashed var(--bd);padding-top:6px}
  .bfoot{display:flex;gap:6px}
  .bfoot .btn{padding:6px 8px;font-size:11px}

  .pnl-toggle{display:none}

  @media(max-width:760px){
    .hd{top:10px;left:12px}
    .hd h1{font-size:14px}
    .hd p{display:none}
    .pnl{
      left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:46vh;overflow-y:auto;
    }
    /* 手机上默认收起，只留常用那一行 —— 画面才是主角 */
    .pnl-toggle{display:block;flex:0 0 auto;padding:8px 9px}
    .pnl.min > *:not(.row:first-child){display:none}
    .pnl.min > .row:first-child .pnl-toggle{display:block}
    .stats{
      left:12px;right:12px;top:calc(var(--topbar-h,52px) + 8px);bottom:auto;
      justify-content:space-between;gap:8px;padding:6px 10px;
    }
    .stats b{font-size:12.5px}
    .legend,.status{display:none}
    .drawer{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:66vh}
    .batch{left:10px;right:10px;bottom:10px;width:auto;max-height:58vh;overflow-y:auto}
    body.batch-open .pnl,body.batch-open .stats{opacity:0;pointer-events:none}
    body.drawer-open .pnl{opacity:0;pointer-events:none}
    body.drawer-open .stats{opacity:0}
  }
  @media(prefers-reduced-motion:reduce){
    .spin{animation-duration:3s}
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="../index.html" aria-label="回首页"><span class="ico">🧰</span><span class="txt">红石的小站</span></a>
  <span class="spacer"></span>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<canvas id="cv" aria-label="A* 寻路三维演示"></canvas>

<div class="hud">
  <div class="hd">
    <h1>A* 寻路</h1>
    <p>左键拖动绘制 · 右键拖动旋转 · 滚轮缩放<br>
       <kbd>空格</kbd>开始 <kbd>S</kbd>单步 <kbd>R</kbd>重置 <kbd>M</kbd>迷宫 <kbd>D</kbd>八向</p>
  </div>

  <section class="pnl" aria-label="控制">
    <div class="row">
      <button id="btnPlay" class="btn primary">开始</button>
      <button id="btnStep" class="btn" title="单步（S）">单步</button>
      <button id="btnReset" class="btn" title="重置（R）">重置</button>
      <button id="btnMore" class="btn pnl-toggle" aria-label="展开参数">参数</button>
    </div>
    <div class="row" id="brushes">
      <button class="btn on" data-mode="wall" title="墙壁：不可通行">墙</button>
      <button class="btn" data-mode="danger" title="危险区：代价 ×4">危险</button>
      <button class="btn" data-mode="water" title="水域：代价 ×8">水</button>
      <button class="btn" data-mode="erase" title="橡皮：恢复空地">擦</button>
    </div>
    <div class="row">
      <button id="btnMaze" class="btn" title="随机生成地形（M）">迷宫</button>
      <button id="btnSwap" class="btn" title="交换起点终点（X）">换起终</button>
      <button id="btnClear" class="btn" title="清空地形（C）">清空</button>
    </div>
    <div class="row">
      <button id="btnDiag" class="btn on" title="允许斜向移动（D）">八向</button>
      <button id="btnRotate" class="btn" title="相机自动旋转（F）">自转</button>
      <button id="btnView" class="btn" title="复位视角（V）">视角</button>
    </div>
    <div class="row">
      <button id="btnCustom" class="btn" title="配色 / 地板 / 相机都能调（O）">自定义…</button>
    </div>
    <div class="sliders">
      <label><span>列</span><input type="range" id="cols" min="16" max="60" step="1" value="36"><output id="colsV">36</output></label>
      <label><span>行</span><input type="range" id="rows" min="12" max="40" step="1" value="24"><output id="rowsV">24</output></label>
      <label><span>速度</span><input type="range" id="speed" min="1" max="160" step="1" value="26"><output id="speedV">26</output></label>
    </div>
  </section>

  <aside class="drawer" id="drawer" aria-label="自定义参数">
    <header>
      <strong>自定义</strong><span style="flex:1"></span>
      <button class="dx" id="drawerClose" aria-label="关闭">×</button>
    </header>
    <nav class="dtabs" role="tablist">
      <button class="dtab on" data-tab="look" role="tab">外观</button>
      <button class="dtab" data-tab="floor" role="tab">地板</button>
      <button class="dtab" data-tab="cam" role="tab">相机</button>
      <button class="dtab" data-tab="batch" role="tab">批量</button>
    </nav>
    <div class="dbody on" id="tab-look"></div>
    <div class="dbody" id="tab-floor"></div>
    <div class="dbody" id="tab-cam"></div>
    <div class="dbody" id="tab-batch"></div>
    <footer class="dfoot">
      <button class="btn" id="cfgReset">恢复默认</button>
      <span>改动自动保存</span>
    </footer>
  </aside>

  <div class="stats">
    <div><i>访问</i><b id="visited">0</b></div>
    <div><i>路径</i><b id="pathlen">–</b></div>
    <div><i>代价</i><b id="pathcost">–</b></div>
    <div><i>用时</i><b id="elapsed">0ms</b></div>
  </div>

  <div class="status" id="status">就绪</div>

  <aside class="batch" id="batchPanel" aria-label="批量统计">
    <header>
      <strong>批量统计</strong>
      <span class="bsub" id="bSub">未开始</span>
      <button class="dx" id="bClose" aria-label="关闭">×</button>
    </header>
    <div class="bgrid">
      <div><i>完成</i><b id="bDone">0</b></div>
      <div><i>成功</i><b id="bOk">0</b></div>
      <div><i>失败</i><b id="bFail">0</b></div>
      <div><i>吞吐</i><b id="bThr">–</b></div>
      <div><i>平均访问</i><b id="bAvgV">–</b></div>
      <div><i>中位访问</i><b id="bMedV">–</b></div>
      <div><i>最少/最多</i><b id="bMinMax">–</b></div>
      <div><i>平均路径</i><b id="bAvgP">–</b></div>
    </div>
    <canvas id="bHist" width="292" height="84"></canvas>
    <div class="bfoot">
      <button class="btn" id="bCsv" disabled>复制 CSV</button>
      <button class="btn" id="bStop" disabled>停止</button>
    </div>
  </aside>

  <div class="legend" id="legend"></div>
</div>

<div id="mask"><div class="spin"></div><div>正在点亮网格…</div></div>

<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/js/core.js"></script>
<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════════
   1. 常量
   ══════════════════════════════════════════════════════════════════ */
var CELL = 1, BOX = 0.86;                 // 格子间距 / 柱子边长
var T_EMPTY = 0, T_WALL = 1, T_DANGER = 2, T_WATER = 3;
var T_COST  = [1, 1, 4, 8];               // 每格的通行代价
var DIRS4 = [[1,0],[-1,0],[0,1],[0,-1]];
var DIRS8 = DIRS4.concat([[1,1],[1,-1],[-1,1],[-1,-1]]);
var HEIGHT = { empty:0.30, wall:2.10, danger:0.55, water:0.40, open:1.40, closed:0.90, path:2.00 };
var STIFF = 170, DAMP = 13;               // 高度弹簧
var SQRT2 = Math.SQRT2;

/* ── 可自定义参数：抽屉里改的全部落在这一个对象上，存 localStorage ── */
var DEFAULT_CFG = {
  /* 网格 */
  cols: 36, rows: 24, cell: 1, box: 0.86, speed: 26, diagonal: 1,
  /* 外观 */
  followTheme: 1, shadow: 1, pathPulse: 1,
  heights: { empty: 0.30, wall: 2.10, danger: 0.55, water: 0.40, open: 1.40, closed: 0.90, path: 2.00 },
  colors: {
    empty: '#d9d3bd', ground: '#efe9d6', wall: '#6f6a52', danger: '#c05a44', water: '#5b9bd0',
    open: '#8fb04a', closed: '#6b7cc4', path: '#d9a520', start: '#2e8b3d', end: '#c0392b'
  },
  /* 地板 */
  floorOn: 1, floorMargin: 0.9, floorTone: 1,
  gridOn: 1, gridAlpha: 0.26,
  offX: 0, offY: 0, offZ: 0,
  /* 相机 */
  fov: 42, phi: 0.98, lookY: 0.9, autoRot: 0.16,
  /* 批量 */
  batchN: 200, batchRand: 1, batchDensity: 26
};
var CFG = null, CFG_KEY = 'hs-astar-prefs';

function cloneCfg(o) { return JSON.parse(JSON.stringify(o)); }
function mergeCfg(dst, src) {
  for (var k in src) {
    if (!Object.prototype.hasOwnProperty.call(src, k)) continue;
    var v = src[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      if (!dst[k] || typeof dst[k] !== 'object') dst[k] = {};
      mergeCfg(dst[k], v);
    } else if (dst[k] === undefined || typeof v === typeof dst[k]) {
      dst[k] = v;
    }
  }
  return dst;
}
function loadCfg() {
  var c = cloneCfg(DEFAULT_CFG);
  if (window.innerWidth < 760) {
    c.cols = 18; c.rows = 20; c.phi = 0.62; c.lookY = -0.2; c.shadow = 0;
  }
  try {
    var raw = localStorage.getItem(CFG_KEY);
    if (raw) mergeCfg(c, JSON.parse(raw));
  } catch (e) {}
  return c;
}
var saveTimer = 0;
function saveCfg() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {}
  }, 220);
}
function syncHeights() {
  for (var k in HEIGHT) if (CFG.heights[k] != null) HEIGHT[k] = CFG.heights[k];
}
CFG = loadCfg();
CELL = CFG.cell;
BOX = CFG.box;
syncHeights();

var $ = function (id) { return document.getElementById(id); };
var canvas = $('cv');

/* ══════════════════════════════════════════════════════════════════
   2. 主题取色
   3D 场景不上死色，而是从 core.css 的令牌里取，这样切到「下界/樱花/海洋」
   时整个场景跟着换色，跟站里其它页面是一套皮。
   ══════════════════════════════════════════════════════════════════ */
function cssVar(name, fallback) {
  var v = getComputedStyle(document.documentElement).getPropertyValue(name);
  return (v && v.trim()) || fallback;
}
function C(hex) { return new THREE.Color().setStyle(hex); }
function mix(a, b, t) { return a.clone().lerp(b, t); }
function lum(c) { return c.r * 0.299 + c.g * 0.587 + c.b * 0.114; }

var PAL = null;

function buildPalette() {
  var bg  = C(cssVar('--bg',  '#fffdf5'));
  var bd2 = C(cssVar('--bd2', '#4a4a3a'));
  var ac  = C(cssVar('--ac',  '#3d521f'));
  var ac2 = C(cssVar('--ac2', '#7a9c3c'));
  var dgr = C(cssVar('--dgr', '#a02020'));
  var warn= C(cssVar('--warn','#b08800'));
  var dark = lum(bg) < 0.42;
  var white = C('#ffffff'), black = C('#000000');

  var P = { dark: dark, bg: bg };
  if (dark) {
    P.bg       = bg;
    P.ground   = mix(bg, black, 0.55);
    P.empty    = mix(bg, white, 0.20);
    P.wall     = mix(bg, white, 0.34);
    P.danger   = dgr.clone();
    P.water    = C('#2f6d9a');
    P.open     = ac.clone();
    P.closed   = C('#8b83d6');
    P.path     = warn.clone();
    P.grid     = mix(P.ground, white, 0.26);
    P.gridA    = 0.22;
    P.start    = C('#4cc76a');
    P.end      = C('#e8564a');
    P.fog      = 0.0085;
    P.hemiSky  = C('#6c8eb0'); P.hemiGnd = C('#0c1014'); P.hemiI = 0.70;
    P.dirCol   = C('#d8e8ff'); P.dirI = 0.85;
  } else {
    P.bg       = bg;
    P.ground   = mix(bg, bd2, 0.11);     // 地板浅、砖块深，格子才分得开
    P.empty    = mix(bg, bd2, 0.23);
    P.wall     = mix(bd2, bg, 0.06);
    P.danger   = mix(dgr, white, 0.26);
    P.water    = C('#4a90c8');
    P.open     = ac2.clone();
    P.closed   = C('#7f77c9');
    P.path     = mix(warn, white, 0.05);
    P.grid     = mix(P.ground, bd2, 0.30);
    P.gridA    = 0.30;
    P.start    = C('#2e8b3d');
    P.end      = C('#c0392b');
    P.fog      = 0.0060;
    P.hemiSky  = C('#ffffff'); P.hemiGnd = mix(bg, bd2, 0.3); P.hemiI = 0.50;
    P.dirCol   = C('#ffffff'); P.dirI = 0.58;
  }

  /* 自定义配色：直接覆盖上面按主题算出来的那一套；
     光照方向按「地板是深还是浅」重新挑，否则深色地板会一片死黑 */
  if (!CFG.followTheme) {
    var q = CFG.colors;
    P.empty = C(q.empty);   P.ground = C(q.ground);
    P.wall  = C(q.wall);    P.danger = C(q.danger);
    P.water = C(q.water);   P.open   = C(q.open);
    P.closed = C(q.closed); P.path   = C(q.path);
    P.start = C(q.start);   P.end    = C(q.end);
    P.dark = lum(P.ground) < 0.42;
    P.grid = mix(P.ground, P.wall, 0.5);
    P.hemiSky = P.dark ? C('#6c8eb0') : C('#ffffff');
    P.hemiGnd = P.dark ? C('#0c1014') : mix(P.ground, C('#000000'), 0.28);
    P.hemiI = P.dark ? 0.85 : 0.78;
    P.dirCol = P.dark ? C('#d8e8ff') : C('#ffffff');
    P.dirI = P.dark ? 0.55 : 0.45;
    P.fog = P.dark ? 0.0085 : 0.006;
  }
  /* 地板明度：单独给地板一个倍数，方便把地面压暗/提亮而不动柱子 */
  if (CFG.floorTone !== 1) P.ground = P.ground.clone().multiplyScalar(CFG.floorTone);

  return P;
}

/* ══════════════════════════════════════════════════════════════════
   3. 渲染器 / 场景 / 相机
   ══════════════════════════════════════════════════════════════════ */
var renderer, scene, camera, hemi, dirLight, board;
var ground, boardEdge = null, gridLines = null, cellMesh = null, startMesh, endMesh;

try {
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
} catch (e) {
  fail('这台设备没能创建 WebGL 上下文', e);
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
/* 不用阴影贴图：地板是带渐隐的透明面，shadow map 在这种尺度下容易整体糊黑，
   而且每一步都要多渲一遍 864 根柱子。改用下面程序生成的软投影。 */

scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(42, 1, 0.1, 600);

/* 地板 + 柱子 + 起终点全挂在 board 下：
   「地板的位置」就是挪这个 group，取景、拾取、阴影全跟着走 */
board = new THREE.Group();
scene.add(board);

hemi = new THREE.HemisphereLight(0xffffff, 0x999999, 0.8);
scene.add(hemi);
dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
dirLight.position.set(14, 30, 10);
scene.add(dirLight);
scene.add(dirLight.target);

/* 地板贴图：中间实、外圈渐隐，跟背景自然接上（纯色大平面太生硬） */
function makeFloorTexture() {
  var S = 256, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  var g = cv.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, S, S);
  var grd = g.createRadialGradient(S / 2, S / 2, S * 0.16, S / 2, S / 2, S * 0.50);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.72, 'rgba(255,255,255,0.96)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.globalCompositeOperation = 'destination-in';
  g.fillStyle = grd;
  g.fillRect(0, 0, S, S);
  var tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

/* 地面：一块柔边薄板，颜色跟着配色走（默认 1×1，按棋盘尺寸缩放） */
ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshLambertMaterial({
    color: 0xffffff, map: makeFloorTexture(), transparent: true, depthWrite: false
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
board.add(ground);

/* 起终点：小球 + 一圈光环 */
function makeMarker(radius, ringColor) {
  var g = new THREE.Group();
  var ball = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 20, 14),
    new THREE.MeshLambertMaterial({ color: 0xffffff })
  );
  var ring = new THREE.Mesh(
    new THREE.RingGeometry(radius * 1.45, radius * 1.75, 36),
    new THREE.MeshBasicMaterial({ color: ringColor, transparent: true, opacity: 0.42, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -radius * 0.6;
  g.add(ball); g.add(ring);
  g.userData.ball = ball; g.userData.ring = ring;
  board.add(g);
  return g;
}
startMesh = makeMarker(0.3, 0x2e8b3d);
endMesh   = makeMarker(0.3, 0xc0392b);

/* ══════════════════════════════════════════════════════════════════
   4. 轨道相机（自己写，省一个 vendor 依赖）
   左键归画笔，所以旋转只认右键 / 双指。
   ══════════════════════════════════════════════════════════════════ */
var cam = { theta: 0.62, phi: 0.98, dist: 46, tTheta: 0.62, tPhi: 0.98, tDist: 46 };
var autoRotate = false;
var autoFit = true;          // 用户没手动缩放前，跟着窗口大小自动取景

/* 视角绕的是「棋盘中心」，所以地板挪到哪儿，相机就跟到哪儿 */
function camCenter() {
  return { x: CFG.offX, y: CFG.offY + CFG.lookY, z: CFG.offZ };
}
function placeCameraAt(d) {
  var c = camCenter();
  var sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  camera.position.set(
    c.x + d * sp * Math.sin(cam.theta),
    c.y + d * cp,
    c.z + d * sp * Math.cos(cam.theta)
  );
  camera.lookAt(c.x, c.y, c.z);
}
function applyCamera() { placeCameraAt(cam.dist); }

/* 地板（整块棋盘）的位置：挪 group，顺手把阴影光源也搬过去，
   否则地板挪远了影子就掉出阴影相机的范围 */
function applyBoardPos() {
  board.position.set(CFG.offX, CFG.offY, CFG.offZ);
  var s = Math.max(cols, rows) * CELL * 0.9 + 6;
  /* 光源放在「左后上方」：影子会朝右前（相机这一侧）投出来，
     否则影子全躲在柱子背后，等于白开 */
  dirLight.position.set(CFG.offX - s * 0.62, CFG.offY + s * 0.95, CFG.offZ - s * 0.50);
  dirLight.target.position.set(CFG.offX, CFG.offY, CFG.offZ);
  dirLight.target.updateMatrixWorld();
  var c = dirLight.shadow.camera;
  c.left = -s; c.right = s; c.top = s; c.bottom = -s;
  c.near = 1; c.far = s * 4 + 40;
  c.updateProjectionMatrix();
}

/* 取景：把网格的 8 个角投影到屏幕，二分出一个刚好装得下的距离。
   外接球那套在竖屏上会把网格切掉，直接投影才准。 */
var fitPts = [];
function refreshFitPts() {
  var hw = (cols - 1) / 2 * CELL + CELL * 0.6, hh = (rows - 1) / 2 * CELL + CELL * 0.6;
  var top = Math.max(2.2, HEIGHT.wall + 0.3);
  var ox = CFG.offX, oy = CFG.offY, oz = CFG.offZ;
  fitPts = [];
  [[-hw, -hh], [hw, -hh], [-hw, hh], [hw, hh]].forEach(function (p) {
    fitPts.push([ox + p[0], oy, oz + p[1]]);
    fitPts.push([ox + p[0], oy + top, oz + p[1]]);
  });
}
var _fv = new THREE.Vector3();
function boardFits(d, limit) {
  placeCameraAt(d);
  camera.updateMatrixWorld();
  for (var i = 0; i < fitPts.length; i++) {
    var p = fitPts[i];
    _fv.set(p[0], p[1], p[2]).project(camera);
    if (Math.abs(_fv.x) > limit || Math.abs(_fv.y) > limit) return false;
  }
  return true;
}
function fitDistance() {
  refreshFitPts();
  /* 竖屏时画面高、网格扁，留边可以小一点，让网格占满宽度 */
  var limit = window.innerWidth < 760 ? 0.97 : 0.88;
  var lo = 8, hi = 320;
  if (!boardFits(hi, limit)) return hi;
  for (var i = 0; i < 20; i++) {
    var mid = (lo + hi) / 2;
    if (boardFits(mid, limit)) hi = mid; else lo = mid;
  }
  return hi * 1.01;
}
/* ══════════════════════════════════════════════════════════════════
   5. 网格数据
   ══════════════════════════════════════════════════════════════════ */
var cols = 36, rows = 24;
var nodes = [];
var startIdx = 0, endIdx = 0;
var dummy = new THREE.Object3D();

function idx(x, y) { return y * cols + x; }
function worldX(x) { return (x - (cols - 1) / 2) * CELL; }
function worldZ(y) { return (y - (rows - 1) / 2) * CELL; }

function createNode(x, y) {
  return {
    x: x, y: y, wx: worldX(x), wz: worldZ(y),
    terrain: T_EMPTY,
    isOpen: false, isClosed: false, isPath: false,
    g: Infinity, h: 0, f: Infinity, parent: null,
    hCur: HEIGHT.empty, hTarget: HEIGHT.empty, hDrawn: -1, hVel: 0,
    color: new THREE.Color(), colorTarget: new THREE.Color(),
    cDrawn: new THREE.Color(-1, -1, -1)
  };
}

function buildNodes() {
  nodes = new Array(cols * rows);
  for (var y = 0; y < rows; y++)
    for (var x = 0; x < cols; x++)
      nodes[y * cols + x] = createNode(x, y);
}

function defaultStartEnd() {
  startIdx = idx(Math.max(1, Math.round(cols * 0.1)), Math.floor(rows / 2));
  endIdx   = idx(Math.min(cols - 2, Math.round(cols * 0.9)), Math.floor(rows / 2));
}

/* 网格线：每次重建网格时重画 */
function halfSpan() {
  return {
    w: (cols - 1) / 2 * CELL + CELL * 0.5,
    h: (rows - 1) / 2 * CELL + CELL * 0.5
  };
}
function buildGridLines() {
  if (gridLines) { board.remove(gridLines); gridLines.geometry.dispose(); gridLines.material.dispose(); }
  var hs = halfSpan(), hw = hs.w, hh = hs.h;
  var pts = [], i;
  for (i = 0; i < cols; i++) {
    var x = -hw + i * CELL;
    pts.push(x, 0, -hh, x, 0, hh);
  }
  for (i = 0; i < rows; i++) {
    var z = -hh + i * CELL;
    pts.push(-hw, 0, z, hw, 0, z);
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  var mat = new THREE.LineBasicMaterial({
    color: (PAL ? PAL.grid : new THREE.Color(0x888888)).getHex(), transparent: true,
    opacity: CFG.gridAlpha, depthWrite: false
  });
  gridLines = new THREE.LineSegments(geo, mat);
  gridLines.position.y = 0.004;
  gridLines.visible = !!CFG.gridOn;
  board.add(gridLines);
}

/* 棋盘外框：一圈细线，边上有收口，画面才不散 */
function buildBoardEdge() {
  if (boardEdge) { board.remove(boardEdge); boardEdge.geometry.dispose(); boardEdge.material.dispose(); }
  var hs = halfSpan(), hw = hs.w + CELL * 0.16, hh = hs.h + CELL * 0.16;
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(
    [-hw, 0, -hh, hw, 0, -hh, hw, 0, hh, -hw, 0, hh], 3
  ));
  var mat = new THREE.LineBasicMaterial({
    color: (PAL ? PAL.grid : new THREE.Color(0x888888)).getHex(), transparent: true,
    opacity: 0.55, depthWrite: false
  });
  boardEdge = new THREE.LineLoop(geo, mat);
  boardEdge.position.y = 0.006;
  boardEdge.visible = !!CFG.gridOn;
  board.add(boardEdge);
}

/* 地板尺寸/显隐：地板比棋盘略微外扩一点，视觉上才"托得住" */
function applyFloor() {
  var hs = halfSpan();
  var pad = CFG.floorMargin * CELL;
  var w = hs.w * 2 + pad * 2 + CELL * 0.6;
  var h = hs.h * 2 + pad * 2 + CELL * 0.6;
  ground.scale.set(w, h, 1);
  ground.visible = !!CFG.floorOn;
  if (gridLines) gridLines.visible = !!CFG.gridOn;
  if (boardEdge) boardEdge.visible = !!CFG.gridOn;
}

/* 柱子：一个 InstancedMesh 画完，颜色存 instanceColor */
function buildCellMesh() {
  if (cellMesh) {
    board.remove(cellMesh);
    cellMesh.geometry.dispose();
    cellMesh.material.dispose();
  }
  var geo = new THREE.BoxGeometry(1, 1, 1);
  geo.translate(0, 0.5, 0);                     // 底面贴地，缩放时向上长

  /* 柱身竖直渐变（底暗顶亮）：同一个材质、顶点色烘焙进去，
     跟 instanceColor 相乘，所以每根柱子都自带一点"体积感" */
  var pos = geo.attributes.position, vc = new Float32Array(pos.count * 3);
  for (var vi = 0; vi < pos.count; vi++) {
    var t = Math.min(1, Math.max(0, pos.getY(vi)));
    var br = 0.74 + 0.26 * t;
    vc[vi * 3] = br; vc[vi * 3 + 1] = br; vc[vi * 3 + 2] = br;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(vc, 3));

  var mat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true });

  cellMesh = new THREE.InstancedMesh(geo, mat, cols * rows);
  cellMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  cellMesh.frustumCulled = false;
  var white = new THREE.Color(1, 1, 1);
  for (var i = 0; i < cols * rows; i++) cellMesh.setColorAt(i, white);
  cellMesh.instanceColor.needsUpdate = true;
  cellMesh.castShadow = false;
  cellMesh.receiveShadow = false;
  board.add(cellMesh);
  for (var k = 0; k < nodes.length; k++) { nodes[k].hDrawn = -1; nodes[k].cDrawn.setRGB(-1, -1, -1); }
  buildShadowLayer();
  buildCaps();
  drawInstances();
}

/* ══════════════════════════════════════════════════════════════════
   5.1 顶面贴花：墙 = 砖缝，危险区 = 警示斜条，路径 = 暖色亮面。
   柱子是同一个 InstancedMesh，没法逐根换材质，所以另开三个
   InstancedMesh 专门画「顶盖」，只画需要的格子。
   ══════════════════════════════════════════════════════════════════ */
var caps = null;

function capTexture(kind) {
  var S = 64, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  var g = cv.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, S, S);

  if (kind === 'wall') {
    /* 砖缝：一条横缝 + 交错竖缝，压在墙顶就像码好的石砖 */
    g.strokeStyle = 'rgba(0,0,0,0.30)';
    g.lineWidth = 2;
    for (var y = 0; y <= S; y += 16) {
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(S, y + 0.5); g.stroke();
    }
    for (var r = 0; r < 4; r++) {
      var off = (r % 2) ? 16 : 0;
      for (var x = off; x <= S; x += 32) {
        g.beginPath(); g.moveTo(x + 0.5, r * 16); g.lineTo(x + 0.5, r * 16 + 16); g.stroke();
      }
    }
    /* 砖面再加一点点颗粒，别太平 */
    g.fillStyle = 'rgba(0,0,0,0.05)';
    for (var i = 0; i < 90; i++) {
      g.fillRect((i * 37) % S, (i * 61) % S, 2, 2);
    }
  } else {
    /* 警示斜条：白条会被 PAL.danger 染色，缝是暗的 */
    g.save();
    g.translate(S / 2, S / 2);
    g.rotate(-Math.PI / 4);
    g.fillStyle = 'rgba(0,0,0,0.34)';
    for (var k = -S; k < S; k += 20) g.fillRect(k, -S, 9, S * 2);
    g.restore();
  }

  var tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.anisotropy = 4;
  return tex;
}

function capGeometry() {
  var g = new THREE.PlaneGeometry(1, 1);
  g.rotateX(-Math.PI / 2);
  return g;
}

/* ── 软投影：贴在地板上的径向渐隐圆斑 ──
   柱子越高影子越大、越往外偏，靠这个把"体积"读出来。
   不用 shadow map 是因为地板是透明渐隐面，那个尺度下很容易整片糊黑。 */
var shadowLayer = null, shadowTex = null;
function makeShadowTexture() {
  var S = 128, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  var g = cv.getContext('2d');
  g.fillStyle = '#000000';
  g.fillRect(0, 0, S, S);
  var grd = g.createRadialGradient(S / 2, S / 2, S * 0.06, S / 2, S / 2, S / 2);
  grd.addColorStop(0, '#ffffff');
  grd.addColorStop(0.42, '#b9b9b9');
  grd.addColorStop(1, '#000000');
  g.fillStyle = grd;
  g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();
  var t = new THREE.CanvasTexture(cv);
  t.minFilter = THREE.LinearFilter;
  return t;
}
function buildShadowLayer() {
  if (shadowLayer) {
    board.remove(shadowLayer);
    shadowLayer.geometry.dispose();
    shadowLayer.material.dispose();
  }
  if (!shadowTex) shadowTex = makeShadowTexture();
  var m = new THREE.MeshBasicMaterial({
    color: 0x000000, alphaMap: shadowTex, transparent: true, opacity: 0.30, depthWrite: false
  });
  shadowLayer = new THREE.InstancedMesh(capGeometry(), m, nodes.length);
  shadowLayer.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  shadowLayer.frustumCulled = false;
  shadowLayer.renderOrder = -1;
  shadowLayer.visible = !!CFG.shadow;
  board.add(shadowLayer);
}

function buildCaps() {
  if (caps) {
    ['wall', 'danger', 'path'].forEach(function (k) {
      if (!caps[k]) return;
      board.remove(caps[k]);
      caps[k].geometry.dispose();
      caps[k].material.dispose();
    });
    caps = null;
  }
  var n = nodes.length;
  caps = {
    wall: new THREE.InstancedMesh(capGeometry(), new THREE.MeshLambertMaterial({ map: capTexture('wall') }), n),
    danger: new THREE.InstancedMesh(capGeometry(), new THREE.MeshLambertMaterial({ map: capTexture('danger') }), n),
    path: new THREE.InstancedMesh(capGeometry(), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.92 }), n)
  };
  ['wall', 'danger', 'path'].forEach(function (k) {
    var m = caps[k];
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled = false;
    m.count = 0;
    m.castShadow = false;
    m.renderOrder = 1;
    board.add(m);
  });
  for (var i = 0; i < nodes.length; i++) { nodes[i].capKind = -1; nodes[i].capH = -1; }
  syncCapColors();
}

function syncCapColors() {
  if (!caps || !PAL) return;
  caps.wall.material.color.copy(PAL.wall).offsetHSL(0, 0, 0.10);
  caps.path.material.color.copy(PAL.path).offsetHSL(0, 0, 0.06);
  caps.danger.material.color.copy(PAL.danger);
}

function capKindOf(n) {
  if (n.terrain === T_WALL) return 1;
  if (n.isPath) return 2;
  if (n.terrain === T_DANGER) return 3;
  return 0;
}

/* 只有「顶盖内容真的变了」才重写一遍，静置时零开销 */
function drawCaps() {
  if (!caps) return;
  var need = false, i, n, k;
  for (i = 0; i < nodes.length; i++) {
    n = nodes[i]; k = capKindOf(n);
    if (n.capKind !== k || Math.abs(n.capH - n.hCur) > 0.0015) { need = true; break; }
  }
  if (!need) return;

  var cw = 0, cd = 0, cp = 0;
  for (i = 0; i < nodes.length; i++) {
    n = nodes[i]; k = capKindOf(n);
    n.capKind = k; n.capH = n.hCur;
    if (!k) continue;
    dummy.position.set(n.wx, n.hCur + 0.008, n.wz);
    dummy.scale.set(BOX * 0.995, 1, BOX * 0.995);
    dummy.updateMatrix();
    if (k === 1) dummy.matrix.toArray(caps.wall.instanceMatrix.array, (cw++) * 16);
    else if (k === 2) dummy.matrix.toArray(caps.path.instanceMatrix.array, (cp++) * 16);
    else dummy.matrix.toArray(caps.danger.instanceMatrix.array, (cd++) * 16);
  }
  /* 影子：跟高度一起变，朝光源反方向（右上后方）偏 */
  if (shadowLayer) {
    for (i = 0; i < nodes.length; i++) {
      n = nodes[i];
      var sh = n.hCur;
      /* 平贴着的空地砖不画影子（影子比砖还大，会糊成一片灰雾），
         只有立起来的东西才需要"落地感" */
      var vis = sh > 0.42 ? 1 : 0;
      var sz = (BOX * 0.92 + sh * 0.66) * vis;
      dummy.position.set(n.wx + sh * 0.20, 0.004, n.wz + sh * 0.16);
      dummy.scale.set(sz, 1, sz);
      dummy.updateMatrix();
      dummy.matrix.toArray(shadowLayer.instanceMatrix.array, i * 16);
    }
    shadowLayer.instanceMatrix.needsUpdate = true;
  }

  caps.wall.count = cw;
  caps.danger.count = cd;
  caps.path.count = cp;
  caps.wall.instanceMatrix.needsUpdate = true;
  caps.danger.instanceMatrix.needsUpdate = true;
  caps.path.instanceMatrix.needsUpdate = true;
}

/* ══════════════════════════════════════════════════════════════════
   6. 每个格子的目标高度 / 颜色
   ══════════════════════════════════════════════════════════════════ */
function computeTarget(n, t) {
  var h, c;
  if (n.terrain === T_WALL) {
    h = HEIGHT.wall; c = PAL.wall;
  } else if (n.isPath) {
    h = HEIGHT.path + (CFG.pathPulse ? Math.sin(t * 2.6 + (n.x + n.y) * 0.4) * 0.10 : 0);
    c = PAL.path;
  } else if (n.isClosed) {
    h = HEIGHT.closed; c = PAL.closed;
  } else if (n.isOpen) {
    h = HEIGHT.open; c = PAL.open;
  } else if (n.terrain === T_DANGER) {
    h = HEIGHT.danger + Math.sin(t * 2 + n.x * 0.5 + n.y * 0.4) * 0.04;
    c = PAL.danger;
  } else if (n.terrain === T_WATER) {
    h = HEIGHT.water; c = PAL.water;
  } else {
    h = HEIGHT.empty; c = PAL.empty;
  }
  n.hTarget = h;
  n.colorTarget.copy(c);
}

/* ══════════════════════════════════════════════════════════════════
   7. A*（二叉堆 + 惰性删除）
   ══════════════════════════════════════════════════════════════════ */
function MinHeap() { this.d = []; }
MinHeap.prototype.size = function () { return this.d.length; };
MinHeap.prototype.push = function (item) {
  var d = this.d; d.push(item);
  var i = d.length - 1;
  while (i > 0) {
    var p = (i - 1) >> 1;
    if (d[p].f <= d[i].f) break;
    var t = d[p]; d[p] = d[i]; d[i] = t; i = p;
  }
};
MinHeap.prototype.pop = function () {
  var d = this.d;
  if (!d.length) return null;
  var top = d[0], last = d.pop();
  if (d.length) {
    d[0] = last;
    var i = 0, n = d.length;
    for (;;) {
      var l = 2 * i + 1, r = l + 1, m = i;
      if (l < n && d[l].f < d[m].f) m = l;
      if (r < n && d[r].f < d[m].f) m = r;
      if (m === i) break;
      var t = d[m]; d[m] = d[i]; d[i] = t; i = m;
    }
  }
  return top;
};

var allowDiagonal = true;

function heuristic(a, b) {
  var dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  if (!allowDiagonal) return dx + dy;
  return (dx + dy) + (SQRT2 - 2) * Math.min(dx, dy);
}

function neighborsOf(n) {
  var out = [], dirs = allowDiagonal ? DIRS8 : DIRS4;
  for (var i = 0; i < dirs.length; i++) {
    var dx = dirs[i][0], dy = dirs[i][1];
    var nx = n.x + dx, ny = n.y + dy;
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
    var nb = nodes[idx(nx, ny)];
    if (nb.terrain === T_WALL) continue;
    /* 斜向不许"切墙角" */
    if (dx !== 0 && dy !== 0) {
      if (nodes[idx(n.x + dx, n.y)].terrain === T_WALL) continue;
      if (nodes[idx(n.x, n.y + dy)].terrain === T_WALL) continue;
    }
    out.push(nb);
  }
  return out;
}

function* searchAstar() {
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    n.g = Infinity; n.h = 0; n.f = Infinity;
    n.parent = null; n.isOpen = false; n.isClosed = false; n.isPath = false;
  }
  pathList = []; pathCost = null; visitedCount = 0;

  var start = nodes[startIdx], end = nodes[endIdx];
  if (start === end) { yield { type: 'done', path: [start], cost: 0 }; return; }
  if (start.terrain === T_WALL || end.terrain === T_WALL) { yield { type: 'fail' }; return; }

  start.g = 0; start.h = heuristic(start, end); start.f = start.h; start.isOpen = true;
  var heap = new MinHeap();
  heap.push({ node: start, f: start.f });
  var visits = 0, guard = 0;

  while (heap.size() > 0) {
    if (++guard > 400000) { yield { type: 'fail' }; return; }
    var top = heap.pop(), cur = top.node;
    if (cur.isClosed) continue;
    if (top.f > cur.f + 1e-9) continue;       // 过期条目

    cur.isOpen = false; cur.isClosed = true;
    visitedCount = ++visits;
    yield { type: 'progress' };

    if (cur === end) {
      var path = [], p = cur;
      while (p) { path.push(p); p = p.parent; }
      path.reverse();
      yield { type: 'done', path: path, cost: cur.g };
      return;
    }

    var nbs = neighborsOf(cur);
    for (var k = 0; k < nbs.length; k++) {
      var nb = nbs[k];
      if (nb.isClosed) continue;
      var diag = (nb.x !== cur.x && nb.y !== cur.y);
      var step = T_COST[nb.terrain] * (diag ? SQRT2 : 1);
      var tg = cur.g + step;
      if (tg < nb.g - 1e-9) {
        nb.parent = cur; nb.g = tg;
        nb.h = heuristic(nb, end); nb.f = nb.g + nb.h;
        nb.isOpen = true;
        heap.push({ node: nb, f: nb.f });
      }
    }
  }
  yield { type: 'fail' };
}

/* ══════════════════════════════════════════════════════════════════
   8. 状态
   ══════════════════════════════════════════════════════════════════ */
var pathList = [], pathCost = null, visitedCount = 0, elapsed = 0;
var running = false, finished = false, searchGen = null, searchAcc = 0;
var speed = 26, brushMode = 'wall', dragMode = null, lastPaint = null;

var colsEl2 = $('cols'), rowsEl2 = $('rows'), colsV2 = $('colsV'), rowsV2 = $('rowsV');
var elVisited = $('visited'), elPathLen = $('pathlen'),
    elPathCost = $('pathcost'), elElapsed = $('elapsed'), elStatus = $('status');
var btnPlay = $('btnPlay');

function setStatus(text, kind) {
  elStatus.textContent = text;
  elStatus.className = 'status' + (kind ? ' ' + kind : '');
}
function updateStats() {
  elVisited.textContent = visitedCount;
  elPathLen.textContent = pathList.length > 1 ? pathList.length - 1 : '–';
  elPathCost.textContent = (pathCost != null && isFinite(pathCost))
    ? (Math.round(pathCost * 100) / 100) : '–';
  elElapsed.textContent = elapsed < 1000
    ? Math.round(elapsed) + 'ms' : (elapsed / 1000).toFixed(2) + 's';
}
function syncPlayBtn() {
  btnPlay.textContent = running ? '暂停' : finished ? '重播' : searchGen ? '继续' : '开始';
}

function resetSearch() {
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    n.g = Infinity; n.h = 0; n.f = Infinity;
    n.parent = null; n.isOpen = false; n.isClosed = false; n.isPath = false;
  }
  searchGen = null; running = false; finished = false; searchAcc = 0;
  visitedCount = 0; elapsed = 0; pathList = []; pathCost = null;
  updateStats(); syncPlayBtn();
}

/* 推进一步；返回 false 表示搜索结束 */
function stepOnce() {
  if (!searchGen) return false;
  var r = searchGen.next();
  if (r.done) { searchGen = null; return false; }
  var v = r.value;
  if (v.type === 'done') {
    pathList = v.path; pathCost = v.cost;
    for (var i = 0; i < v.path.length; i++) v.path[i].isPath = true;
    finished = true; running = false; searchGen = null;
    var d = 0, w = 0;
    for (var j = 0; j < v.path.length; j++) {
      if (v.path[j].terrain === T_DANGER) d++;
      else if (v.path[j].terrain === T_WATER) w++;
    }
    var extra = (d ? ' · 危险 ' + d : '') + (w ? ' · 水域 ' + w : '');
    setStatus('到达 · 代价 ' + (Math.round(v.cost * 100) / 100) + extra, 'ok');
    syncPlayBtn();
  } else if (v.type === 'fail') {
    finished = true; running = false; searchGen = null;
    setStatus('走不通', 'err');
    syncPlayBtn();
  }
  updateStats();
  return true;
}

/* ══════════════════════════════════════════════════════════════════
   9. 交互：画笔 / 拖动起终点 / 相机
   ══════════════════════════════════════════════════════════════════ */
var raycaster = new THREE.Raycaster();
var pointerNDC = new THREE.Vector2();
var groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
var hitPt = new THREE.Vector3();

function pickNode(clientX, clientY) {
  var rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  groundPlane.constant = -CFG.offY;      // 地板被抬高时，拾取面也得跟着抬
  if (!raycaster.ray.intersectPlane(groundPlane, hitPt)) return null;
  var x = Math.round((hitPt.x - CFG.offX) / CELL + (cols - 1) / 2);
  var y = Math.round((hitPt.z - CFG.offZ) / CELL + (rows - 1) / 2);
  if (x < 0 || y < 0 || x >= cols || y >= rows) return null;
  return nodes[idx(x, y)];
}

function setTerrain(n, mode) {
  if (!n || n === nodes[startIdx] || n === nodes[endIdx]) return false;
  var t = mode === 'wall' ? T_WALL : mode === 'danger' ? T_DANGER : mode === 'water' ? T_WATER : T_EMPTY;
  if (n.terrain === t) return false;
  n.terrain = t;
  return true;
}
function paintLine(a, b, mode) {
  var x0 = a.x, y0 = a.y, x1 = b.x, y1 = b.y;
  var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  var err = dx - dy, changed = false, guard = 0;
  while (guard++ < 400) {
    if (setTerrain(nodes[idx(x0, y0)], mode)) changed = true;
    if (x0 === x1 && y0 === y1) break;
    var e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
  return changed;
}

var pointers = new Map();
var gesture = null;

canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

canvas.addEventListener('pointerdown', function (e) {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  /* 双指 = 旋转 + 缩放 */
  if (e.pointerType === 'touch') canvas.setPointerCapture(e.pointerId);
  if (pointers.size === 2) {
    var p = Array.from(pointers.values());
    gesture = {
      d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y),
      cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2
    };
    dragMode = null; lastPaint = null;
    return;
  }
  if (pointers.size > 2) return;

  /* 右键 = 转视角，中键 = 平移（挪的就是地板） */
  if (e.button === 2 || e.button === 1) {
    dragMode = e.button === 1 ? 'pan' : 'orbit';
    gesture = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    return;
  }
  if (e.button !== 0) return;

  var n = pickNode(e.clientX, e.clientY);
  if (!n) return;
  canvas.setPointerCapture(e.pointerId);

  if (n === nodes[startIdx])      dragMode = 'start';
  else if (n === nodes[endIdx])   dragMode = 'goal';
  else {
    dragMode = brushMode;
    lastPaint = n;
    if (setTerrain(n, dragMode)) { resetSearch(); setStatus('绘制中…'); }
  }
  e.preventDefault();
});

canvas.addEventListener('pointermove', function (e) {
  if (pointers.has(e.pointerId)) {
    var rec = pointers.get(e.pointerId);
    rec.x = e.clientX; rec.y = e.clientY;
  }

  /* 双指手势 */
  if (gesture && pointers.size === 2 && gesture.d != null) {
    var p = Array.from(pointers.values());
    var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
    var cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;
    if (gesture.d > 0) { autoFit = false; cam.tDist = clampDist(cam.tDist * (gesture.d / Math.max(20, d))); }
    cam.tTheta -= (cx - gesture.cx) * 0.006;
    cam.tPhi = clampPhi(cam.tPhi - (cy - gesture.cy) * 0.004);
    gesture.d = d; gesture.cx = cx; gesture.cy = cy;
    return;
  }

  /* 中键平移：整块棋盘跟着鼠标走 */
  if (dragMode === 'pan' && gesture && e.buttons) {
    panBy(e.clientX - gesture.x, e.clientY - gesture.y);
    gesture.x = e.clientX; gesture.y = e.clientY;
    return;
  }

  /* 右键转视角 */
  if (dragMode === 'orbit' && gesture && e.buttons) {
    cam.tTheta -= (e.clientX - gesture.x) * 0.006;
    /* phi 是「从 +Y 起算的极角」：往下拖 -> phi 变小 -> 机位抬高、更俯视，
       跟原版（往下拖看头顶）一致。之前写反了 */
    cam.tPhi = clampPhi(cam.tPhi - (e.clientY - gesture.y) * 0.004);
    gesture.x = e.clientX; gesture.y = e.clientY;
    return;
  }

  if (!dragMode) return;
  var n = pickNode(e.clientX, e.clientY);
  if (!n) return;

  if (dragMode === 'start') {
    if (n === nodes[endIdx] || n.terrain === T_WALL) return;
    startIdx = idx(n.x, n.y); resetSearch(); setStatus('起点已移动');
    return;
  }
  if (dragMode === 'goal') {
    if (n === nodes[startIdx] || n.terrain === T_WALL) return;
    endIdx = idx(n.x, n.y); resetSearch(); setStatus('终点已移动');
    return;
  }
  var changed;
  if (lastPaint && lastPaint !== n) changed = paintLine(lastPaint, n, dragMode);
  else changed = setTerrain(n, dragMode);
  lastPaint = n;
  if (changed) { resetSearch(); setStatus('绘制中…'); }
});

function endPointer(e) {
  if (e && e.pointerId != null) pointers.delete(e.pointerId);
  if (pointers.size < 2) gesture = null;
  if (pointers.size === 0) { dragMode = null; lastPaint = null; }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', function () { pointers.clear(); gesture = null; dragMode = null; });

canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  autoFit = false;
  cam.tDist = clampDist(cam.tDist * Math.exp(e.deltaY * 0.0012));
}, { passive: false });

function clampDist(d) {
  var span = Math.max(cols, rows) * CELL;
  return Math.max(span * 0.32, Math.min(span * 3.4, d));
}
function clampPhi(p) { return Math.max(0.12, Math.min(1.52, p)); }
function clampNum(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* 平移：按屏幕像素换算成世界位移，落在相机的右/上两个轴上 */
var _pr = new THREE.Vector3(), _pu = new THREE.Vector3();
function panBy(dx, dy) {
  var h = canvas.clientHeight || 1;
  var scale = 2 * cam.dist * Math.tan(camera.fov * Math.PI / 360) / h;
  _pr.setFromMatrixColumn(camera.matrixWorld, 0);
  _pu.setFromMatrixColumn(camera.matrixWorld, 1);
  CFG.offX = clampNum(CFG.offX + (_pr.x * dx - _pu.x * dy) * scale, -40, 40);
  CFG.offY = clampNum(CFG.offY + (_pr.y * dx - _pu.y * dy) * scale, -12, 12);
  CFG.offZ = clampNum(CFG.offZ + (_pr.z * dx - _pu.z * dy) * scale, -40, 40);
  applyBoardPos();
  syncCfgUI();
  saveCfg();
}

/* ══════════════════════════════════════════════════════════════════
   10. 控件
   ══════════════════════════════════════════════════════════════════ */
var brushBtns = Array.prototype.slice.call(document.querySelectorAll('#brushes .btn'));
brushBtns.forEach(function (b) {
  b.addEventListener('click', function () {
    brushMode = b.dataset.mode;
    brushBtns.forEach(function (x) { x.classList.toggle('on', x === b); });
  });
});

/* ══════════════════════════════════════════════════════════════════
   10.1 生效函数：抽屉里改一个值 -> 调一个这里的小函数
   ══════════════════════════════════════════════════════════════════ */
function forceRedraw() {
  for (var i = 0; i < nodes.length; i++) { nodes[i].hDrawn = -1; nodes[i].cDrawn.setRGB(-1, -1, -1); }
}
function refreshWorld() {
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].wx = worldX(nodes[i].x);
    nodes[i].wz = worldZ(nodes[i].y);
  }
  forceRedraw();
}

function applyCellSize() {
  CELL = CFG.cell;
  refreshWorld();
  applyFloor();
  buildGridLines();
  buildBoardEdge();
  applyBoardPos();
  if (autoFit) { cam.tDist = fitDistance(); }
}

function applyShadow() {
  if (shadowLayer) shadowLayer.visible = !!CFG.shadow;
}

function applyFov() {
  camera.fov = CFG.fov;
  camera.updateProjectionMatrix();
}

function resetView() {
  var phone = window.innerWidth < 760;
  CFG.offX = 0; CFG.offY = 0; CFG.offZ = 0;
  CFG.lookY = phone ? -0.2 : 0.9;
  CFG.phi = phone ? 0.62 : 0.98;
  CFG.fov = 42;
  applyFov();
  cam.phi = cam.tPhi = CFG.phi;
  applyBoardPos();
  autoFit = true;
  cam.tDist = fitDistance();
  cam.dist = cam.tDist;
  applyCamera();
  syncCfgUI();
  saveCfg();
  setStatus('视角已复位');
}

/* ══════════════════════════════════════════════════════════════════
   10.2 自定义抽屉：所有参数都由这几行小工具生成
   ══════════════════════════════════════════════════════════════════ */
var CTRL = {};
function regCtrl(key, fn) { (CTRL[key] = CTRL[key] || []).push(fn); }
function syncCfgUI() {
  if (!CTRL) return;
  for (var k in CTRL) {
    var fs = CTRL[k];
    for (var i = 0; i < fs.length; i++) fs[i]();
  }
}

function elx(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function addSec(host, t) { host.appendChild(elx('div', 'dsec', t)); }

function addRange(host, o) {
  var row = elx('label', 'crow');
  row.appendChild(elx('span', null, o.label));
  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = o.min; inp.max = o.max; inp.step = o.step;
  inp.value = o.get();
  var out = elx('output', null, o.fmt ? o.fmt(o.get()) : o.get());
  row.appendChild(inp); row.appendChild(out);

  function commit() {
    var v = parseFloat(inp.value);
    out.textContent = o.fmt ? o.fmt(v) : v;
    o.set(v);
    saveCfg();
  }
  inp.addEventListener('input', function () {
    out.textContent = o.fmt ? o.fmt(parseFloat(inp.value)) : inp.value;
    if (o.live) commit();
  });
  inp.addEventListener('change', commit);

  host.appendChild(row);
  regCtrl(o.key, function () {
    var v = o.get();
    inp.value = v;
    out.textContent = o.fmt ? o.fmt(v) : v;
  });
}

function addSwitch(host, o) {
  var row = elx('div', 'crow');
  row.appendChild(elx('span', null, o.label));
  row.appendChild(elx('i', 'sp'));
  var b = elx('button', 'sw' + (o.get() ? ' on' : ''), o.get() ? '开' : '关');
  function paint() {
    var v = !!o.get();
    b.textContent = v ? '开' : '关';
    b.classList.toggle('on', v);
  }
  b.addEventListener('click', function () { o.set(!o.get()); paint(); o.after && o.after(); saveCfg(); });
  row.appendChild(b);
  host.appendChild(row);
  regCtrl(o.key, paint);
}

function addBtn(host, label, fn) {
  var row = elx('div', 'row');
  row.style.marginTop = '8px';
  var b = elx('button', 'btn', label);
  b.style.cssText = 'flex:1;font-size:11px;padding:6px 4px';
  b.addEventListener('click', fn);
  row.appendChild(b);
  host.appendChild(row);
  return b;
}

/* 配色：点一下色块就进"自定义配色"，其余颜色从当前主题里继承过来，
   这样只改一个颜色时，其它颜色不会突然全变 */
function seedColorsFromPalette() {
  var map = {
    empty: PAL.empty, ground: PAL.ground, wall: PAL.wall, danger: PAL.danger, water: PAL.water,
    open: PAL.open, closed: PAL.closed, path: PAL.path, start: PAL.start, end: PAL.end
  };
  for (var k in map) CFG.colors[k] = '#' + map[k].getHexString();
}

function addColors(host, keys) {
  var grid = elx('div', 'cgrid');
  keys.forEach(function (it) {
    var row = elx('label', 'crow');
    row.appendChild(elx('span', null, it[1]));
    var inp = document.createElement('input');
    inp.type = 'color';
    inp.value = CFG.colors[it[0]];
    inp.addEventListener('input', function () {
      if (CFG.followTheme) {
        seedColorsFromPalette();
        CFG.followTheme = 0;
      }
      CFG.colors[it[0]] = inp.value;
      applyPalette();
      syncCfgUI();
      saveCfg();
    });
    row.appendChild(inp);
    grid.appendChild(row);
    regCtrl('colors.' + it[0], function () { inp.value = CFG.colors[it[0]]; });
  });
  host.appendChild(grid);
}

/* ══════════════════════════════════════════════════════════════════
   10.4 批量模拟：1~1000 局同时推进
   每一局都有自己的 g / parent / 状态 和二叉堆，按时间片轮流往前走，
   所以是「同时在跑」而不是一局跑完再跑下一局。
   ══════════════════════════════════════════════════════════════════ */
var batch = null, batchRAF = 0;

function batchPush(r, id, f) {
  var ids = r.hi, fs = r.hf, i = ids.length;
  ids.push(id); fs.push(f);
  while (i > 0) {
    var p = (i - 1) >> 1;
    if (fs[p] <= fs[i]) break;
    var ti = ids[p]; ids[p] = ids[i]; ids[i] = ti;
    var tf = fs[p]; fs[p] = fs[i]; fs[i] = tf;
    i = p;
  }
}
function batchPop(r) {
  var ids = r.hi, fs = r.hf, len = ids.length;
  if (!len) return -1;
  var top = ids[0];
  var li = ids.pop(), lf = fs.pop();
  if (len > 1) {
    ids[0] = li; fs[0] = lf;
    var i = 0, n = ids.length;
    for (;;) {
      var l = i * 2 + 1, rr = l + 1, m = i;
      if (l < n && fs[l] < fs[m]) m = l;
      if (rr < n && fs[rr] < fs[m]) m = rr;
      if (m === i) break;
      var ti = ids[m]; ids[m] = ids[i]; ids[i] = ti;
      var tf = fs[m]; fs[m] = fs[i]; fs[i] = tf;
      i = m;
    }
  }
  return top;
}
function batchH(x, y, ex, ey, diag) {
  var dx = Math.abs(x - ex), dy = Math.abs(y - ey);
  if (!diag) return dx + dy;
  return (dx + dy) + (SQRT2 - 2) * Math.min(dx, dy);
}

function makeRun(terr, s, e, diag, cols) {
  var n = terr.length;
  var g = new Float32Array(n);
  for (var i = 0; i < n; i++) g[i] = Infinity;
  /* par 必须填 -1：Int32Array 默认是 0，回溯长度时会绕在 0 号格上死循环 */
  var par = new Int32Array(n);
  par.fill(-1);
  var r = {
    terr: terr, s: s, e: e, diag: diag,
    g: g, par: par, st: new Uint8Array(n),
    hi: [], hf: [],
    done: false, counted: false, ok: false,
    visited: 0, cost: 0, pathLen: 0
  };
  var sx = s % cols, sy = (s - sx) / cols;
  var ex = e % cols, ey = (e - ex) / cols;
  r.g[s] = 0;
  batchPush(r, s, batchH(sx, sy, ex, ey, diag));
  return r;
}

/* 推进一局，最多 budget 次扩展；返回实际扩展数 */
function advanceRun(r, cols, rows, budget) {
  var terr = r.terr, g = r.g, par = r.par, st = r.st;
  var ex0 = r.e % cols, ey0 = (r.e - (r.e % cols)) / cols;
  var diag = r.diag, cnt = 0;

  while (cnt < budget) {
    var cur = batchPop(r);
    if (cur < 0) { r.done = true; r.ok = false; return cnt; }
    if (st[cur] === 2) continue;
    st[cur] = 2;
    r.visited++;
    cnt++;

    if (cur === r.e) {
      var len = 0, p = cur;
      while (p !== -1) { len++; p = par[p]; }
      r.done = true; r.ok = true;
      r.cost = g[cur]; r.pathLen = len - 1;
      return cnt;
    }

    var cx = cur % cols, cy = (cur - cx) / cols;
    var base = cy * cols;
    for (var d = 0; d < (diag ? 8 : 4); d++) {
      var dx = DIRS8[d][0], dy = DIRS8[d][1];
      var nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      var ni = ny * cols + nx;
      if (terr[ni] === T_WALL) continue;
      if (dx && dy) {
        if (terr[base + nx] === T_WALL) continue;
        if (terr[ny * cols + cx] === T_WALL) continue;
      }
      if (st[ni] === 2) continue;
      var step = T_COST[terr[ni]] * (dx && dy ? SQRT2 : 1);
      var tg = g[cur] + step;
      if (tg < g[ni] - 1e-9) {
        par[ni] = cur;
        g[ni] = tg;
        batchPush(r, ni, tg + batchH(nx, ny, ex0, ey0, diag));
      }
    }
  }
  return cnt;
}

function snapshotTerrain() {
  var t = new Uint8Array(nodes.length);
  for (var i = 0; i < nodes.length; i++) t[i] = nodes[i].terrain;
  return t;
}

function randomTerrain(len, density, s, e, cols, rows) {
  var t = new Uint8Array(len), i;
  for (i = 0; i < len; i++) {
    var r = Math.random();
    if (r < density) t[i] = T_WALL;
    else if (r < density * 1.30) t[i] = T_DANGER;
    else if (r < density * 1.55) t[i] = T_WATER;
    else t[i] = T_EMPTY;
  }
  /* 起点终点和它们周围留出来，不然一堆局从第一步就走不动 */
  [s, e].forEach(function (k) {
    t[k] = T_EMPTY;
    var kx = k % cols, ky = (k - kx) / cols;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
      var nx = kx + d[0], ny = ky + d[1];
      if (nx >= 0 && ny >= 0 && nx < cols && ny < rows) t[ny * cols + nx] = T_EMPTY;
    });
  });
  return t;
}

function openBatchPanel(open) {
  $('batchPanel').classList.toggle('open', open);
  document.body.classList.toggle('batch-open', open);
}

function startBatch(count, useRand, density) {
  count = Math.max(1, Math.min(1000, Math.round(count || 1)));
  var base = snapshotTerrain();
  var runs = [], i;
  for (i = 0; i < count; i++) {
    var terr = useRand
      ? randomTerrain(base.length, Math.max(0.02, density || 0.2), startIdx, endIdx, cols, rows)
      : base;
    runs.push(makeRun(terr, startIdx, endIdx, allowDiagonal, cols));
  }
  batch = {
    runs: runs, total: count, finished: 0, ok: 0, fail: 0,
    expanded: 0, t0: performance.now(), dur: 0, active: true,
    lastUi: 0, rand: !!useRand
  };
  openBatchPanel(true);
  $('bStop').disabled = false;
  $('bCsv').disabled = false;
  $('bSub').textContent = '运行中…';
  updateBatchUI();
  setStatus('批量模拟 ' + count + ' 局…');
  if (!batchRAF) batchRAF = requestAnimationFrame(batchTick);
}

function stopBatch(msg) {
  if (!batch) return;
  batch.active = false;
  if (batchRAF) { cancelAnimationFrame(batchRAF); batchRAF = 0; }
  batch.dur = performance.now() - batch.t0;
  $('bStop').disabled = true;
  $('bSub').textContent = msg || '已停止';
  updateBatchUI();
}

/* 时间片：每帧最多占 10ms，剩下的让给渲染 */
function batchTick() {
  batchRAF = 0;
  if (!batch || !batch.active) return;
  var t0 = performance.now();
  var runs = batch.runs, n = runs.length, guard = 0;

  while (performance.now() - t0 < 10) {
    var progressed = false;
    for (var i = 0; i < n; i++) {
      var r = runs[i];
      if (r.done) continue;
      progressed = true;
      batch.expanded += advanceRun(r, cols, rows, 16);
      if (r.done && !r.counted) {
        r.counted = true;
        batch.finished++;
        if (r.ok) batch.ok++; else batch.fail++;
      }
    }
    if (!progressed) break;
    if (++guard > 4000) break;
  }

  var now = performance.now();
  if (now - batch.lastUi > 110 || batch.finished === batch.total) {
    batch.lastUi = now;
    updateBatchUI();
  }
  if (batch.finished === batch.total) {
    batch.active = false;
    batch.dur = now - batch.t0;
    $('bStop').disabled = true;
    $('bSub').textContent = '完成 · ' + Math.round(batch.dur) + 'ms';
    updateBatchUI();
    setStatus('批量完成：' + batch.total + ' 局');
    return;
  }
  batchRAF = requestAnimationFrame(batchTick);
}

function batchCollect() {
  var vs = [], ps = [], cs = [], i, r;
  for (i = 0; i < batch.runs.length; i++) {
    r = batch.runs[i];
    if (r.done && r.ok) { vs.push(r.visited); ps.push(r.pathLen); cs.push(r.cost); }
  }
  return { vs: vs, ps: ps, cs: cs };
}
function medianOf(a) {
  if (!a.length) return 0;
  var b = a.slice().sort(function (x, y) { return x - y; });
  var m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}
function avgOf(a) {
  if (!a.length) return 0;
  var s = 0;
  for (var i = 0; i < a.length; i++) s += a[i];
  return s / a.length;
}

function updateBatchUI() {
  if (!batch) return;
  var c = batchCollect();
  $('bDone').textContent = batch.finished + '/' + batch.total;
  $('bOk').textContent = batch.ok;
  $('bFail').textContent = batch.fail;

  var ms = Math.max(1, performance.now() - batch.t0);
  var thr = batch.expanded / ms * 1000;
  $('bThr').textContent = thr >= 1000
    ? (thr / 1000).toFixed(1) + 'k/s' : Math.round(thr) + '/s';

  $('bAvgV').textContent = c.vs.length ? Math.round(avgOf(c.vs)) : '–';
  $('bMedV').textContent = c.vs.length ? Math.round(medianOf(c.vs)) : '–';
  $('bMinMax').textContent = c.vs.length
    ? Math.min.apply(null, c.vs) + '/' + Math.max.apply(null, c.vs) : '–';
  $('bAvgP').textContent = c.ps.length ? (Math.round(avgOf(c.ps) * 10) / 10) : '–';

  if (batch.active) {
    $('bSub').textContent = '运行中 ' + Math.round(batch.finished / batch.total * 100) + '%';
  }
  drawBatchHist(c.vs);
}

function drawBatchHist(vs) {
  var cv = $('bHist');
  if (!cv) return;
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = cv.clientWidth || 292, H = 84;
  if (cv.width !== Math.round(W * dpr)) {
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  var g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  var css = getComputedStyle(document.documentElement);
  var ac = (css.getPropertyValue('--ac') || '#3d521f').trim();
  var bd = (css.getPropertyValue('--bd') || '#a8a89a').trim();
  var faint = (css.getPropertyValue('--faint') || '#888').trim();

  g.font = '9px ui-monospace,Menlo,Consolas,monospace';
  g.textBaseline = 'top';

  if (!vs.length) {
    g.fillStyle = faint;
    g.fillText('还没有完成的局', 4, H / 2 - 4);
    return;
  }
  var min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  if (max === min) max = min + 1;

  var B = 14, bins = new Array(B), i;
  for (i = 0; i < B; i++) bins[i] = 0;
  for (i = 0; i < vs.length; i++) {
    var k = Math.min(B - 1, Math.floor((vs[i] - min) / (max - min) * B));
    bins[k]++;
  }
  var mx = Math.max.apply(null, bins) || 1;

  var padX = 2, top = 12, bot = 14;
  var bw = (W - padX * 2) / B;
  for (i = 0; i < B; i++) {
    var hgt = (H - top - bot) * (bins[i] / mx);
    if (!hgt && !bins[i]) { g.fillStyle = bd; g.globalAlpha = 0.25; hgt = 1; }
    else { g.fillStyle = ac; g.globalAlpha = bins[i] ? 0.85 : 0.25; }
    g.fillRect(padX + i * bw + 0.5, H - bot - hgt, Math.max(1, bw - 1.5), Math.max(1, hgt));
  }
  g.globalAlpha = 1;

  g.fillStyle = bd;
  g.fillRect(padX, H - bot, W - padX * 2, 1);

  g.fillStyle = faint;
  g.fillText(String(min), padX, H - bot + 3);
  var rl = String(max), rw = g.measureText(rl).width;
  g.fillText(rl, W - padX - rw, H - bot + 3);
  g.fillStyle = faint;
  g.fillText('访问节点数分布 · 共 ' + vs.length + ' 局', padX, 1);
}

function batchCSV() {
  if (!batch) return '';
  var lines = ['run,ok,visited,pathLen,cost'];
  for (var i = 0; i < batch.runs.length; i++) {
    var r = batch.runs[i];
    lines.push([i + 1, r.done ? (r.ok ? 1 : 0) : -1, r.visited,
      r.ok ? r.pathLen : '', r.ok ? Math.round(r.cost * 100) / 100 : ''].join(','));
  }
  return lines.join('\n');
}

var colsEl = $('cols'), rowsEl = $('rows'), speedEl = $('speed');

window.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.code === 'Escape') { setDrawer(false); return; }
  var map = {
    Space: 'btnPlay', KeyS: 'btnStep', KeyR: 'btnReset',
    KeyC: 'btnClear', KeyM: 'btnMaze', KeyX: 'btnSwap',
    KeyD: 'btnDiag', KeyF: 'btnRotate', KeyV: 'btnView'
  };
  if (e.code === 'KeyB') {
    e.preventDefault();
    startBatch(CFG.batchN, !!CFG.batchRand, CFG.batchDensity / 100);
    return;
  }
  if (e.code === 'KeyO') {
    e.preventDefault();
    setDrawer(!$('drawer').classList.contains('open'));
    return;
  }
  var id = map[e.code];
  if (id) { e.preventDefault(); $(id).click(); }
});

/* ══════════════════════════════════════════════════════════════════
   11. 重建网格
   ══════════════════════════════════════════════════════════════════ */
function rebuild(c, r) {
  c = Math.max(16, Math.min(60, Math.round(c)));
  r = Math.max(12, Math.min(40, Math.round(r)));
  if (c === cols && r === rows) return;

  /* 起终点按比例落到新网格上，地形用最近邻采样保留形状 */
  var sX = cols > 1 ? nodes[startIdx].x / (cols - 1) : 0.1;
  var sY = rows > 1 ? nodes[startIdx].y / (rows - 1) : 0.5;
  var eX = cols > 1 ? nodes[endIdx].x / (cols - 1) : 0.9;
  var eY = rows > 1 ? nodes[endIdx].y / (rows - 1) : 0.5;
  var old = nodes, oc = cols, or = rows;

  cols = c; rows = r;
  buildNodes();
  for (var y = 0; y < rows; y++) {
    for (var x = 0; x < cols; x++) {
      var ox = Math.round(x / Math.max(1, cols - 1) * (oc - 1));
      var oy = Math.round(y / Math.max(1, rows - 1) * (or - 1));
      nodes[idx(x, y)].terrain = old[oy * oc + ox].terrain;
    }
  }
  var cl = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  startIdx = idx(cl(Math.round(sX * (cols - 1)), 0, cols - 1), cl(Math.round(sY * (rows - 1)), 0, rows - 1));
  endIdx   = idx(cl(Math.round(eX * (cols - 1)), 0, cols - 1), cl(Math.round(eY * (rows - 1)), 0, rows - 1));
  if (startIdx === endIdx) endIdx = idx((endIdx % cols + 1) % cols, Math.floor(endIdx / cols));
  nodes[startIdx].terrain = T_EMPTY;
  nodes[endIdx].terrain = T_EMPTY;

  buildCellMesh();
  buildGridLines();
  buildBoardEdge();
  applyFloor();
  applyBoardPos();
  autoFit = true;
  cam.tDist = fitDistance();
  colsEl.value = cols; rowsEl.value = rows;
  colsV.textContent = cols; rowsV.textContent = rows;
  CFG.cols = cols; CFG.rows = rows;
  syncCfgUI();
  saveCfg();

  resetSearch();
  setStatus('网格 ' + cols + ' × ' + rows);
}

/* ══════════════════════════════════════════════════════════════════
   12. 主题切换
   ══════════════════════════════════════════════════════════════════ */
/* 背景：上浅下深的一点点渐变，比纯色平铺耐看，也不会抢柱子的对比 */
var bgTex = null;
function buildBgTexture() {
  var cv = document.createElement('canvas');
  cv.width = 4; cv.height = 256;
  var g = cv.getContext('2d');
  var top = PAL.bg.clone().offsetHSL(0, 0, PAL.dark ? 0.05 : 0.035);
  var bot = PAL.bg.clone().offsetHSL(0, 0, PAL.dark ? -0.04 : -0.022);
  var grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, '#' + top.getHexString());
  grd.addColorStop(1, '#' + bot.getHexString());
  g.fillStyle = grd;
  g.fillRect(0, 0, 4, 256);
  var t = new THREE.CanvasTexture(cv);
  t.minFilter = THREE.LinearFilter;
  return t;
}

/* 换配色：只更新颜色，不重建几何（拖色板的时候要跟手） */
function applyPalette() {
  PAL = buildPalette();
  if (bgTex) bgTex.dispose();
  bgTex = buildBgTexture();
  scene.background = bgTex;
  scene.fog = new THREE.FogExp2(PAL.bg.getHex(), PAL.fog);
  ground.material.color.copy(PAL.ground);
  hemi.color.copy(PAL.hemiSky); hemi.groundColor.copy(PAL.hemiGnd); hemi.intensity = PAL.hemiI;
  dirLight.color.copy(PAL.dirCol); dirLight.intensity = PAL.dirI;
  startMesh.userData.ball.material.color.copy(PAL.start);
  startMesh.userData.ring.material.color.copy(PAL.start);
  endMesh.userData.ball.material.color.copy(PAL.end);
  endMesh.userData.ring.material.color.copy(PAL.end);
  if (gridLines) gridLines.material.color.copy(PAL.grid);
  if (boardEdge) boardEdge.material.color.copy(PAL.grid);
  syncCapColors();
  for (var i = 0; i < nodes.length; i++) {
    computeTarget(nodes[i], 0);
    nodes[i].cDrawn.setRGB(-1, -1, -1);
  }
  renderLegend();
}

/* 把所有配置重新套一遍（恢复默认时用） */
function applyAllCfg() {
  PAL = buildPalette();
  CELL = CFG.cell;
  BOX = CFG.box;
  syncHeights();
  allowDiagonal = !!CFG.diagonal;
  $('btnDiag').classList.toggle('on', allowDiagonal);
  applyFov();
  cam.phi = cam.tPhi = CFG.phi;
  speed = CFG.speed;
  $('speed').value = speed;
  $('speedV').textContent = speed;

  applyFloor();
  buildGridLines();
  buildBoardEdge();
  applyBoardPos();
  applyPalette();
  applyShadow();

  if (cols !== CFG.cols || rows !== CFG.rows) {
    rebuild(CFG.cols, CFG.rows);
  } else {
    refreshWorld();
    autoFit = true;
    cam.tDist = fitDistance();
    syncCfgUI();
    saveCfg();
  }
}

function renderLegend() {
  var items = [
    ['墙', PAL.wall], ['危险 ×4', PAL.danger], ['水 ×8', PAL.water],
    ['开放', PAL.open], ['关闭', PAL.closed], ['路径', PAL.path]
  ];
  $('legend').innerHTML = items.map(function (it) {
    return '<span><i class="dot" style="background:' + '#' + it[1].getHexString() + '"></i>' + it[0] + '</span>';
  }).join('');
}

var themeTimer = null;
new MutationObserver(function () {
  clearTimeout(themeTimer);
  themeTimer = setTimeout(applyPalette, 60);
}).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ══════════════════════════════════════════════════════════════════
   13. 主循环
   柱子每帧只写「有变化」的实例，静止时几乎零开销。
   ══════════════════════════════════════════════════════════════════ */
var clock = new THREE.Clock();
var animT = 0;

function drawInstances() {
  var mChanged = false, cChanged = false;
  var m = cellMesh.instanceMatrix.array, cs = cellMesh.instanceColor.array;

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];

    if (Math.abs(n.hCur - n.hDrawn) > 0.0012) {
      dummy.position.set(n.wx, 0, n.wz);
      dummy.scale.set(BOX, Math.max(0.02, n.hCur), BOX);
      dummy.updateMatrix();
      dummy.matrix.toArray(m, i * 16);
      n.hDrawn = n.hCur;
      mChanged = true;
    }
    var k = i * 3;
    if (Math.abs(n.color.r - n.cDrawn.r) > 0.002 ||
        Math.abs(n.color.g - n.cDrawn.g) > 0.002 ||
        Math.abs(n.color.b - n.cDrawn.b) > 0.002) {
      cs[k] = n.color.r; cs[k + 1] = n.color.g; cs[k + 2] = n.color.b;
      n.cDrawn.copy(n.color);
      cChanged = true;
    }
  }
  if (mChanged) cellMesh.instanceMatrix.needsUpdate = true;
  if (cChanged) cellMesh.instanceColor.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  animT += dt;

  /* 搜索推进 */
  if (running && searchGen) {
    elapsed += dt * 1000;
    searchAcc += dt * 1000;
    var step = 1000 / speed, guard = 0;
    while (searchAcc >= step && guard++ < 200) {
      searchAcc -= step;
      if (!stepOnce()) break;
    }
  }

  /* 高度弹簧 + 颜色过渡 */
  var ck = 1 - Math.exp(-9 * dt);
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    computeTarget(n, animT);
    n.hVel += (n.hTarget - n.hCur) * STIFF * dt;
    n.hVel *= Math.exp(-DAMP * dt);
    n.hCur += n.hVel * dt;
    if (n.hCur < 0.02) { n.hCur = 0.02; n.hVel = 0; }
    n.color.lerp(n.colorTarget, ck);
  }

  /* 起终点轻浮 */
  var s = nodes[startIdx], e = nodes[endIdx];
  var bob = Math.sin(animT * 1.9) * 0.07;
  startMesh.position.set(s.wx, s.hCur + 0.34 + bob, s.wz);
  startMesh.userData.ball.scale.setScalar(1 + Math.sin(animT * 1.9) * 0.06);
  startMesh.userData.ring.rotation.z = animT * 0.5;
  endMesh.position.set(e.wx, e.hCur + 0.34 - bob, e.wz);
  endMesh.userData.ball.scale.setScalar(1 + Math.sin(animT * 1.9 + 1.6) * 0.06);
  endMesh.userData.ring.rotation.z = -animT * 0.5;

  /* 相机阻尼 */
  if (autoRotate) cam.tTheta += dt * Math.max(0.02, CFG.autoRot || 0.16);
  var k = 1 - Math.exp(-10 * dt);
  cam.theta += (cam.tTheta - cam.theta) * k;
  cam.phi   += (cam.tPhi - cam.phi) * k;
  cam.dist  += (cam.tDist - cam.dist) * k;
  applyCamera();

  drawCaps();
  drawInstances();
  renderer.render(scene, camera);

  if (loading) hideMask();
}

/* ══════════════════════════════════════════════════════════════════
   14. 启动
   ══════════════════════════════════════════════════════════════════ */
var loading = true;
function hideMask() {
  loading = false;
  var m = $('mask');
  if (!m) return;
  m.classList.add('done');
  setTimeout(function () { if (m.parentNode) m.parentNode.removeChild(m); }, 600);
}
function fail(title, err) {
  var m = $('mask');
  if (!m) return;
  m.innerHTML = '<div class="err">' + title + '</div><div class="tip">' +
    (err && err.message ? String(err.message) : '请换一个支持 WebGL 的浏览器再试。') + '</div>';
}

function sizeToViewport() {
  var w = canvas.clientWidth || window.innerWidth;
  var h = canvas.clientHeight || (window.innerHeight - 52);
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (autoFit) cam.tDist = fitDistance();
}
window.addEventListener('resize', sizeToViewport);

function boot() {
  if (!window.THREE) { fail('3D 引擎没加载出来', { message: 'assets/vendor/three.min.js 没取到' }); return; }

  /* 配置在脚本开头就载入了，这里只是把它铺到各处 */
  PAL = buildPalette();          // 网格线/外框都要用它取色，必须最先算好
  cols = CFG.cols; rows = CFG.rows;
  speed = CFG.speed;
  allowDiagonal = !!CFG.diagonal;
  $('btnDiag').classList.toggle('on', allowDiagonal);
  applyFov();
  cam.phi = cam.tPhi = CFG.phi;

  /* 手机屏幕窄：面板默认收起，格子少一点才看得清 */
  if (window.innerWidth < 760) document.querySelector('.pnl').classList.add('min');

  buildNodes();
  defaultStartEnd();

  /* 初始地形：撒一点危险区和水域，让人一进门就有的看 */
  for (var i = 0; i < nodes.length; i++) {
    if (Math.random() < 0.06) {
      nodes[i].terrain = Math.random() < 0.62 ? T_DANGER : T_WATER;
    }
  }
  nodes[startIdx].terrain = T_EMPTY;
  nodes[endIdx].terrain = T_EMPTY;

  sizeToViewport();
  buildCellMesh();
  buildGridLines();
  buildBoardEdge();
  applyFloor();
  applyBoardPos();
  applyPalette();          // 场景配色 + 图例
  applyShadow();

  cam.tDist = fitDistance();
  cam.dist = cam.tDist;
  applyCamera();

  for (var j = 0; j < nodes.length; j++) {
    computeTarget(nodes[j], 0);
    nodes[j].hCur = nodes[j].hTarget;
    nodes[j].color.copy(nodes[j].colorTarget);
  }

  colsEl.value = cols; rowsEl.value = rows; speedEl.value = speed;
  colsV.textContent = cols; rowsV.textContent = rows; speedV.textContent = speed;

  buildDrawer();
  syncCfgUI();
  resetSearch();
  setStatus('就绪');
  renderer.render(scene, camera);   // 先画一帧，遮罩才谈得上"淡出"
  requestAnimationFrame(animate);
}

try { boot(); } catch (err) { console.error(err); fail('初始化失败', err); }

/* 方便自动化测试/控制台调参的最小句柄，不影响正常使用 */
window.ASTAR = {
  info: function () {
    var t = { wall: 0, danger: 0, water: 0 };
    for (var i = 0; i < nodes.length; i++) {
      var k = nodes[i].terrain;
      if (k === T_WALL) t.wall++; else if (k === T_DANGER) t.danger++; else if (k === T_WATER) t.water++;
    }
    return {
      cols: cols, rows: rows, start: startIdx, end: endIdx,
      running: running, finished: finished, visited: visitedCount,
      pathLen: pathList.length, terrain: t, cam: { theta: cam.tTheta, phi: cam.tPhi, dist: cam.tDist }
    };
  },
  cellAt: function (x, y) { var n = nodes[idx(x, y)]; return n ? n.terrain : -1; },
  brush: function (m) { brushMode = m; },
  cfg: function () { return cloneCfg(CFG); },
  setCfg: function (patch) { mergeCfg(CFG, patch); applyAllCfg(); syncCfgUI(); saveCfg(); },
  setOff: function (x, y, z) {
    CFG.offX = x; CFG.offY = y; CFG.offZ = z;
    applyBoardPos(); syncCfgUI(); saveCfg();
  },
  board: function () {
    var p = board.position;
    return { x: p.x, y: p.y, z: p.z, floorOn: !!CFG.floorOn, floorY: ground.position.y,
             grid: !!CFG.gridOn, cell: CELL, box: BOX };
  },
  drawer: function (open) { setDrawer(open); },
  batchStart: function (n, rand, dens) { startBatch(n, rand, dens); },
  batchStats: function () {
    if (!batch) return null;
    var c = batchCollect();
    return {
      total: batch.total, finished: batch.finished, ok: batch.ok, fail: batch.fail,
      active: batch.active, expanded: batch.expanded, ms: Math.round(performance.now() - batch.t0),
      avgVisited: c.vs.length ? Math.round(avgOf(c.vs)) : 0,
      medianVisited: c.vs.length ? Math.round(medianOf(c.vs)) : 0,
      avgPath: c.ps.length ? Math.round(avgOf(c.ps) * 10) / 10 : 0,
      minVisited: c.vs.length ? Math.min.apply(null, c.vs) : 0,
      maxVisited: c.vs.length ? Math.max.apply(null, c.vs) : 0
    };
  },
  batchCSV: function () { return batchCSV(); },
  pal: function () {
    var o = {};
    ['empty', 'ground', 'wall', 'danger', 'water', 'open', 'closed', 'path', 'grid'].forEach(function (k) {
      o[k] = '#' + PAL[k].getHexString();
    });
    o.hemiI = PAL.hemiI; o.dirI = PAL.dirI;
    return o;
  },
  obj: function () { return { renderer: renderer, scene: scene, camera: camera, dirLight: dirLight, ground: ground, cellMesh: cellMesh, board: board }; },
  dbg: function () {
    return {
      shadowOn: shadowLayer ? shadowLayer.visible : null,
      shadowCount: shadowLayer ? shadowLayer.count : null,
      cellCast: cellMesh ? cellMesh.castShadow : null,
      lightPos: dirLight.position.toArray().map(function (v) { return Math.round(v * 10) / 10; })
    };
  }
};

})();
