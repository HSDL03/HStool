<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石答辩 Wiki · 红石的小站</title>
<meta name="description" content="红石的答辩 Wiki —— 按大板块 / 板块 / 分类整理的条目式知识库，支持全文搜索、目录跳转与阅读进度。">
<meta name="theme-color" content="#3d521f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<script>
(function(){try{
  var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');
  var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
  if(t==='auto'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'mc-night':'mc-wiki';}
  if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<link rel="stylesheet" href="./assets/css/core.css">
<style>
/* ── Wiki 阅读器 ─────────────────────────────────────────────── */
:root{--sb-w:266px}
body{padding-top:var(--topbar-h,52px)}

#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:var(--ac);box-shadow:0 0 8px rgba(var(--p1),.6);transition:width .1s linear;pointer-events:none}

.layout{position:relative;z-index:2;display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto;padding:0 20px 60px;align-items:start}

/* 侧栏 */
.side{
  position:sticky;top:calc(var(--topbar-h,52px) + 16px);
  max-height:calc(100vh - var(--topbar-h,52px) - 32px);
  display:flex;flex-direction:column;margin:16px 0 0;
  background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);
  box-shadow:var(--bevel);overflow:hidden;
}
[data-theme^="github-"] .side{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.side-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--bd);flex:none}
.side-head .t{flex:1;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.side-body{flex:1;min-height:0;overflow-y:auto;padding:7px}
.side-foot{flex:none;padding:7px;border-top:1px solid var(--bd);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-foot .btn{height:28px;padding:0 6px;font-size:11.5px}

/* 树 */
.tree{display:flex;flex-direction:column;gap:2px}
.node>.th{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:var(--r);cursor:pointer;user-select:none;transition:background .12s;font-size:12.5px}
.node>.th:hover{background:var(--bg3)}
.node .arw{width:11px;flex:none;display:grid;place-items:center;font-size:8px;color:var(--muted);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.node.open>.th .arw{transform:rotate(90deg)}
.node .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.node .ct{font-size:9.5px;padding:0 5px;color:var(--muted);background:var(--bg);border-radius:8px;font-variant-numeric:tabular-nums;flex:none}
.node>.tb{overflow:hidden;max-height:0;transition:max-height .3s cubic-bezier(.22,1,.36,1)}
.node.open>.tb{max-height:4000px}
.node.lv-ch>.th{font-size:13px;font-weight:800;background:var(--bg);border:1px solid var(--bd);box-shadow:var(--bevel)}
.node.lv-ch>.tb{padding:3px 0 3px 8px}
.node.lv-se>.tb{padding:2px 0 3px 10px}
.node.lv-se>.th{font-size:12px}
.node.lv-se>.th .lb::before{content:"§";margin-right:3px;color:var(--ac);font-weight:900}
.node.lv-ca>.tb{padding:1px 0 3px 12px}
.node.lv-ca>.th{font-size:11.5px;font-weight:600;color:var(--muted)}
.node.lv-ca>.th .lb::before{content:"#";margin-right:2px;color:var(--ac);opacity:.7}
.art-link{
  display:block;padding:3px 8px;margin:1px 0;font-size:12.5px;color:var(--muted);
  border-radius:var(--r);border-left:2px solid transparent;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .14s;
}
.art-link:hover{color:var(--text);background:var(--bg3)}
.art-link.on{color:var(--ac);background:var(--acs);border-left-color:var(--ac);font-weight:700}

/* 内容区 */
.main{min-width:0;padding:22px 0 0 26px}
.wiki-hero{text-align:center;padding:10px 0 22px}
.wiki-hero h1{
  margin:0 0 10px;font-size:clamp(1.9rem,4vw,2.8rem);font-weight:900;letter-spacing:-.035em;line-height:1.1;
  background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.wiki-hero p{margin:0 auto;max-width:520px;font-size:13.5px;color:var(--muted);line-height:1.7}
.wiki-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.wstat{min-width:82px;padding:9px 14px;text-align:center;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel)}
[data-theme^="github-"] .wstat{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.wstat b{display:block;font-size:18px;font-weight:900;color:var(--ac);line-height:1.2}
.wstat span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px;margin-top:22px}
.ch-card{
  display:flex;align-items:center;gap:11px;padding:13px 15px;text-align:left;width:100%;
  background:linear-gradient(135deg,var(--bg2),var(--bg));border:2px solid var(--bd2);
  border-radius:var(--r);box-shadow:var(--bevel);cursor:pointer;color:inherit;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s,box-shadow .22s;
}
[data-theme^="github-"] .ch-card{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.ch-card:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:var(--bevel),0 12px 26px rgba(0,0,0,.14)}
.ch-ico{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel)}
[data-theme^="github-"] .ch-ico{border-width:1px;border-radius:9px}
.ch-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ch-name{display:block;font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.ch-sub{display:block;font-size:11px;color:var(--muted)}

/* 文章 */
.crumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);margin-bottom:10px}
.crumb b{color:var(--ac);font-weight:700}
.crumb .sep{opacity:.5}
.art-title{margin:0 0 8px;font-size:clamp(1.55rem,3.4vw,2.1rem);font-weight:900;letter-spacing:-.025em;line-height:1.2}
.art-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding-bottom:14px;border-bottom:2px solid var(--bd-soft)}
.art-tools{margin-left:auto;display:flex;gap:5px}
.art-tools .btn{height:28px;padding:0 9px;font-size:11.5px}

.art-layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:30px;align-items:start}
.art-body{min-width:0}
.toc{
  position:sticky;top:calc(var(--topbar-h,52px) + 16px);
  padding:11px 12px;background:var(--bg2);border:2px solid var(--bd);
  border-radius:var(--r);font-size:12px;
}
[data-theme^="github-"] .toc{border-width:1px;border-radius:var(--r-lg)}
.toc .th{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.toc a{display:block;padding:2px 0 2px 8px;color:var(--muted);border-left:2px solid transparent;font-size:12px;line-height:1.45;transition:all .14s}
.toc a:hover{color:var(--ac);border-left-color:var(--ac)}
.toc a.lv3{padding-left:20px;font-size:11.5px;opacity:.85}
.toc a.on{color:var(--ac);border-left-color:var(--ac);font-weight:700;background:var(--acs)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px;padding-top:18px;border-top:2px solid var(--bd-soft)}
.pg{
  display:flex;flex-direction:column;gap:3px;padding:11px 14px;text-decoration:none;color:inherit;
  background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);box-shadow:var(--bevel);
  transition:all .2s;min-width:0;
}
[data-theme^="github-"] .pg{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.pg:hover{border-color:var(--ac);transform:translateY(-2px)}
.pg .lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pg .tt{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.next{text-align:right;grid-column:2}
.pg.empty{visibility:hidden}

.search-res{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sr-item{
  display:block;padding:11px 14px;text-decoration:none;color:inherit;
  background:var(--bg2);border:2px solid var(--bd);border-radius:var(--r);transition:all .18s;
}
[data-theme^="github-"] .sr-item{border-width:1px;border-radius:var(--r-lg)}
.sr-item:hover{border-color:var(--ac);transform:translateX(2px)}
.sr-title{font-size:14px;font-weight:800;margin-bottom:2px}
.sr-path{font-size:11px;color:var(--faint);margin-bottom:4px}
.sr-snip{font-size:12.5px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-snip mark{background:var(--acs);color:var(--ac);font-weight:700;padding:0 1px}

/* 字号 */
body[data-fs="s"] .prose{font-size:14px}
body[data-fs="l"] .prose{font-size:16.5px}

/* 移动端抽屉 */
@media(max-width:1000px){
  .layout{grid-template-columns:1fr;padding:0 14px 50px}
  .side{
    position:fixed;top:var(--topbar-h,52px);left:0;bottom:0;width:280px;margin:0;
    z-index:70;border-radius:0;max-height:none;border-left:none;border-top:none;border-bottom:none;
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.22,1,.36,1);
  }
  body.sb-open .side{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.3)}
  .main{padding:16px 0 0}
  .art-layout{grid-template-columns:1fr}
  .toc{display:none}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.2s}
  body.sb-open .scrim{opacity:1;visibility:visible}
}
@media(min-width:1001px){#menuBtn{display:none}.scrim{display:none}}
@media(max-width:640px){
  .pager{grid-template-columns:1fr}
  .pg.next{grid-column:1;text-align:left}
  .wiki-stats .wstat{min-width:70px;padding:7px 10px}
}
</style>
</head>
<body>
<div id="progress"></div>
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar" id="topbar">
  <button class="iconbtn" id="menuBtn" title="目录 (Ctrl+B)" aria-label="展开目录">☰</button>
  <a class="brand" href="./wiki.html" aria-label="Wiki 首页">
    <span class="ico">📚</span><span class="txt">红石的答辩 Wiki</span>
  </a>
  <span class="spacer"></span>
  <div class="searchbox">
    <span class="sico">⌕</span>
    <input id="q" type="search" placeholder="全文搜索…（按 / 聚焦）" autocomplete="off" aria-label="搜索条目">
    <span class="kbd-hint"><span class="kbd">Ctrl</span><span class="kbd">K</span></span>
  </div>
  <button class="iconbtn" id="fsBtn" title="调整字号" aria-label="调整字号">A</button>
  <button class="iconbtn" id="btnHome" title="回首页" aria-label="回首页">🧰</button>
  <button class="iconbtn" id="btnAdmin" title="编辑数据（管理后台）" aria-label="编辑数据">✏️</button>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>
<div class="scrim" id="scrim"></div>

<div class="layout">
  <aside class="side" id="side" aria-label="条目目录">
    <div class="side-head">
      <span class="t">目录</span>
      <button class="iconbtn" id="btnRandom" title="随便看一条" style="width:24px;height:24px;font-size:12px;color:var(--muted)">🎲</button>
      <button class="iconbtn" id="sideClose" title="收起" style="width:24px;height:24px;font-size:11px;color:var(--muted)">◀</button>
    </div>
    <div class="side-body"><nav class="tree" id="tree"></nav></div>
    <div class="side-foot">
      <button class="btn" id="btnExpand">全部展开</button>
      <button class="btn" id="btnCollapse">全部收起</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div id="viewHome">
      <section class="wiki-hero">
        <h1>红石的答辩 Wiki</h1>
        <p>把零散的笔记塞进大板块 → 板块 → 分类里，需要的时候随手翻。</p>
        <div class="wiki-stats">
          <div class="wstat"><b id="nArt">–</b><span>条目</span></div>
          <div class="wstat"><b id="nCh">–</b><span>大板块</span></div>
          <div class="wstat"><b id="nSe">–</b><span>板块</span></div>
          <div class="wstat"><b id="nCa">–</b><span>分类</span></div>
        </div>
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="btn primary" id="btnRandom2">🎲 随便看一条</button>
          <button class="btn" id="btnAdmin2">✏️ 去管理数据</button>
        </div>
      </section>
      <div class="sec-title">按大板块浏览</div>
      <div class="chapter-grid" id="chapterGrid"></div>
    </div>

    <div id="viewArticle" hidden>
      <div class="crumb" id="crumb"></div>
      <h1 class="art-title" id="artTitle"></h1>
      <div class="art-meta" id="artMeta"></div>
      <div class="art-layout">
        <article class="art-body">
          <div class="prose" id="artBody"></div>
          <nav class="pager" id="pager"></nav>
        </article>
        <aside class="toc" id="toc" hidden></aside>
      </div>
    </div>

    <div id="viewSearch" hidden>
      <div class="page-head">
        <div>
          <h1 style="font-size:1.5rem">搜索结果</h1>
          <p class="sub" id="searchInfo">—</p>
        </div>
      </div>
      <div class="search-res" id="searchRes"></div>
    </div>

    <div id="viewLoading">
      <div class="skel" style="height:44px;max-width:320px;margin:10px auto 18px"></div>
      <div class="skel" style="height:16px;max-width:420px;margin:0 auto 26px"></div>
      <div class="grid">
        <div class="skel skel-card"></div><div class="skel skel-card"></div>
        <div class="skel skel-card"></div><div class="skel skel-card"></div>
      </div>
    </div>
  </main>
</div>

<footer class="foot">
  <div class="fl">
    <span>📚 红石的答辩 Wiki</span>
    <a href="./index.html">回首页</a>
    <a href="./download.html">下载站</a>
    <a href="https://github.com/HSDL03/HStool" target="_blank" rel="noopener">数据仓库</a>
  </div>
  <div class="fr"><span>数据 <span id="dataState">加载中</span></span></div>
</footer>

<script src="./assets/js/core.js"></script>
<script>
(function () {
  'use strict';
  var GH = 'HSDL03/HStool';
  var K_TREE = 'hs-wiki-tree';
  var K_FS = 'hs-wiki-fs';

  var ARTICLES = [];
  var TREE = { chapters: [] };
  var treeOpen = HS.store.json(K_TREE, {});
  var curId = null;
  var query = '';

  var $ = HS.$;

  /* ── 数据规范化 ── */
  function norm(raw) {
    var out = [], used = {};
    (raw || []).forEach(function (r, i) {
      if (!r || typeof r !== 'object') return;
      var title = (typeof r.title === 'string' && r.title.trim()) ? r.title.trim() : ('未命名 ' + (i + 1));
      var id = String(r.id || '').trim();
      if (!id || used[id]) {
        var base = title.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '') || 'entry';
        id = base;
        var n = 2;
        while (used[id]) { id = base + '-' + n; n++; }
      }
      used[id] = 1;
      out.push({
        id: id,
        title: title,
        chapter: (typeof r.chapter === 'string' && r.chapter.trim()) ? r.chapter.trim() : '未分类大板块',
        section: (typeof r.section === 'string' && r.section.trim()) ? r.section.trim() : '未分类板块',
        category: (typeof r.category === 'string' && r.category.trim()) ? r.category.trim() : '未分类',
        content: typeof r.content === 'string' ? r.content : ''
      });
    });
    return out;
  }

  function buildTree() {
    var map = {};
    ARTICLES.forEach(function (a) {
      var ch = map[a.chapter] || (map[a.chapter] = { name: a.chapter, count: 0, sections: {} });
      var se = ch.sections[a.section] || (ch.sections[a.section] = { name: a.section, count: 0, cats: {} });
      var ca = se.cats[a.category] || (se.cats[a.category] = { name: a.category, items: [] });
      ca.items.push(a);
      ch.count++; se.count++;
    });
    TREE.chapters = Object.keys(map).map(function (k) {
      var ch = map[k];
      ch.sectionsArr = Object.keys(ch.sections).map(function (sk) {
        var se = ch.sections[sk];
        se.catsArr = Object.keys(se.cats).map(function (ck) { return se.cats[ck]; });
        return se;
      });
      return ch;
    });
  }

  function treeKey(k) { return k; }
  function isOpen(key, dflt) {
    return treeOpen.hasOwnProperty(key) ? !!treeOpen[key] : !!dflt;
  }
  function setOpen(key, v) {
    treeOpen[key] = v;
    HS.store.setJson(K_TREE, treeOpen);
  }

  function renderTree() {
    var html = '';
    TREE.chapters.forEach(function (ch) {
      var kc = 'ch:' + ch.name;
      var openC = isOpen(kc, true);
      html += '<div class="node lv-ch' + (openC ? ' open' : '') + '" data-key="' + HS.esc(kc) + '">' +
        '<div class="th" data-toggle="' + HS.esc(kc) + '">' +
        '<span class="arw">▸</span><span class="lb">' + HS.esc(ch.name) + '</span>' +
        '<span class="ct">' + ch.count + '</span></div><div class="tb">';
      ch.sectionsArr.forEach(function (se) {
        var ks = 'se:' + ch.name + '/' + se.name;
        var openS = isOpen(ks, true);
        html += '<div class="node lv-se' + (openS ? ' open' : '') + '" data-key="' + HS.esc(ks) + '">' +
          '<div class="th" data-toggle="' + HS.esc(ks) + '">' +
          '<span class="arw">▸</span><span class="lb">' + HS.esc(se.name) + '</span>' +
          '<span class="ct">' + se.count + '</span></div><div class="tb">';
        se.catsArr.forEach(function (ca) {
          var ka = 'ca:' + ch.name + '/' + se.name + '/' + ca.name;
          var openA = isOpen(ka, true);
          html += '<div class="node lv-ca' + (openA ? ' open' : '') + '" data-key="' + HS.esc(ka) + '">' +
            '<div class="th" data-toggle="' + HS.esc(ka) + '">' +
            '<span class="arw">▸</span><span class="lb">' + HS.esc(ca.name) + '</span>' +
            '<span class="ct">' + ca.items.length + '</span></div><div class="tb">';
          ca.items.forEach(function (a) {
            html += '<a class="art-link' + (a.id === curId ? ' on' : '') + '" href="#/' + encodeURIComponent(a.id) + '"' +
              ' title="' + HS.esc(a.title) + '">' + HS.esc(a.title) + '</a>';
          });
          html += '</div></div>';
        });
        html += '</div></div>';
      });
      html += '</div></div>';
    });
    if (!HTMLHasContent(html)) {
      html = '<div class="empty" style="padding:26px 12px"><span class="ic">📭</span><div class="t">还没有条目</div><div class="s">去管理后台新建第一条</div></div>';
    }
    $('#tree').innerHTML = html;
  }
  function HTMLHasContent(h) { return h && h.indexOf('art-link') > -1; }

  /* ── 首页 ── */
  function renderHome() {
    curId = null;
    $('#viewArticle').hidden = true;
    $('#viewSearch').hidden = true;
    $('#viewHome').hidden = false;
    $('#progress').style.width = '0';
    var chCount = TREE.chapters.length;
    var seCount = 0, caCount = 0;
    TREE.chapters.forEach(function (c) {
      seCount += c.sectionsArr.length;
      c.sectionsArr.forEach(function (s) { caCount += s.catsArr.length; });
    });
    $('#nArt').textContent = ARTICLES.length;
    $('#nCh').textContent = chCount;
    $('#nSe').textContent = seCount;
    $('#nCa').textContent = caCount;

    var icons = ['🧱', '📦', '🌿', '⚙️', '🔮', '🍀', '🗺️', '🎒', '🏗️', '🪓'];
    $('#chapterGrid').innerHTML = TREE.chapters.map(function (ch, i) {
      var first = ch.sectionsArr[0] && ch.sectionsArr[0].catsArr[0] && ch.sectionsArr[0].catsArr[0].items[0];
      return '<button class="ch-card" data-go="' + HS.esc(first ? first.id : '') + '">' +
        '<span class="ch-ico">' + icons[i % icons.length] + '</span>' +
        '<span class="ch-info"><span class="ch-name">' + HS.esc(ch.name) + '</span>' +
        '<span class="ch-sub">' + ch.sectionsArr.length + ' 个板块 · ' + ch.count + ' 条</span></span>' +
        '<span class="carrow">→</span></button>';
    }).join('') || '<div class="empty" style="grid-column:1/-1"><span class="ic">📭</span><div class="t">还没有内容</div><div class="s">去管理后台添加第一条 Wiki 数据</div></div>';
    renderTree();
  }

  /* ── 文章 ── */
  function findArticle(id) {
    for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i];
    return null;
  }

  function renderArticle(id) {
    var a = findArticle(id);
    if (!a) { location.hash = '#/'; return; }
    curId = id;
    $('#viewHome').hidden = true;
    $('#viewSearch').hidden = true;
    $('#viewArticle').hidden = false;

    $('#crumb').innerHTML =
      '<a href="#/">首页</a><span class="sep">/</span>' +
      '<span>' + HS.esc(a.chapter) + '</span><span class="sep">/</span>' +
      '<span>' + HS.esc(a.section) + '</span><span class="sep">/</span>' +
      '<b>' + HS.esc(a.category) + '</b>';
    $('#artTitle').textContent = a.title;

    var words = a.content.replace(/<[^>]+>/g, '').trim().length;
    var readMin = Math.max(1, Math.round(words / 320));
    $('#artMeta').innerHTML =
      '<span class="badge">' + HS.esc(a.chapter) + '</span>' +
      '<span class="badge muted">§ ' + HS.esc(a.section) + '</span>' +
      '<span class="badge muted"># ' + HS.esc(a.category) + '</span>' +
      '<span class="faint" style="font-size:11.5px">约 ' + readMin + ' 分钟读完 · ' + words + ' 字</span>' +
      '<span class="art-tools">' +
      '<button class="btn" id="btnCopyLink" title="复制本条链接">🔗 链接</button>' +
      '<button class="btn" id="btnEditThis" title="在管理后台编辑">✏️ 编辑</button>' +
      '</span>';

    var body = $('#artBody');
    body.innerHTML = a.content || '<p class="muted">（这条还没有内容）</p>';

    // 标题锚点 + 目录
    var heads = body.querySelectorAll('h1,h2,h3');
    var tocHtml = '';
    Array.prototype.forEach.call(heads, function (h, i) {
      var hid = 'h-' + i;
      h.id = hid;
      if (h.tagName === 'H3') tocHtml += '<a class="lv3" href="#' + hid + '" data-toc="' + hid + '">' + HS.esc(h.textContent) + '</a>';
      else if (h.tagName === 'H2') tocHtml += '<a href="#' + hid + '" data-toc="' + hid + '">' + HS.esc(h.textContent) + '</a>';
    });
    var toc = $('#toc');
    if (tocHtml) { toc.innerHTML = '<div class="th">本页目录</div>' + tocHtml; toc.hidden = false; }
    else { toc.hidden = true; }

    // 上/下篇
    var idx = ARTICLES.indexOf(a);
    var prev = ARTICLES[idx - 1], next = ARTICLES[idx + 1];
    $('#pager').innerHTML =
      (prev ? '<a class="pg prev" href="#/' + encodeURIComponent(prev.id) + '"><span class="lbl">← 上一篇</span><span class="tt">' + HS.esc(prev.title) + '</span></a>' : '<span class="pg empty"></span>') +
      (next ? '<a class="pg next" href="#/' + encodeURIComponent(next.id) + '"><span class="lbl">下一篇 →</span><span class="tt">' + HS.esc(next.title) + '</span></a>' : '<span class="pg empty"></span>');

    $('#btnCopyLink').addEventListener('click', function () {
      var url = location.origin + location.pathname + '#/' + encodeURIComponent(id);
      copy(url).then(function () { HS.toast('链接已复制', { icon: '🔗' }); })
        .catch(function () { HS.toast('复制失败', { icon: '⚠️' }); });
    });
    $('#btnEditThis').addEventListener('click', function () {
      HS.toast('在管理后台的「Wiki」标签页编辑：' + a.title, { icon: '✏️', duration: 3000 });
      setTimeout(function () { location.href = './admin.html'; }, 900);
    });

    renderTree();
    window.scrollTo({ top: 0, behavior: HS.reduced ? 'auto' : 'smooth' });
    setupTocSpy();
    document.title = a.title + ' · 红石答辩 Wiki';
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (res, rej) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
      document.body.removeChild(ta);
    });
  }

  /* ── 目录高亮 ── */
  var spyIO = null;
  function setupTocSpy() {
    if (spyIO) spyIO.disconnect();
    var body = $('#artBody');
    var links = HS.$$('.toc a');
    if (!links.length || !('IntersectionObserver' in window)) return;
    spyIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle('on', l.getAttribute('data-toc') === en.target.id); });
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    HS.$$('h2[id],h3[id]', body).forEach(function (h) { spyIO.observe(h); });
  }

  /* ── 搜索 ── */
  function plain(html) { return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
  function snippet(text, q) {
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return HS.esc(text.slice(0, 110)) + (text.length > 110 ? '…' : '');
    var start = Math.max(0, i - 40);
    var seg = HS.esc(text.slice(start, start + 140));
    return (start > 0 ? '…' : '') + seg.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>') + '…';
  }
  function renderSearch(q) {
    query = q;
    $('#viewHome').hidden = true;
    $('#viewArticle').hidden = true;
    $('#viewSearch').hidden = false;
    var res = ARTICLES.map(function (a) {
      var text = plain(a.content);
      var inTitle = a.title.toLowerCase().indexOf(q.toLowerCase()) > -1;
      var inMeta = (a.chapter + a.section + a.category).toLowerCase().indexOf(q.toLowerCase()) > -1;
      var inBody = text.toLowerCase().indexOf(q.toLowerCase()) > -1;
      if (!inTitle && !inMeta && !inBody) return null;
      return { a: a, score: (inTitle ? 3 : 0) + (inMeta ? 1 : 0) + (inBody ? 1 : 0), text: text };
    }).filter(Boolean).sort(function (x, y) { return y.score - x.score; });

    $('#searchInfo').textContent = '“' + q + '” 命中 ' + res.length + ' 条';
    $('#searchRes').innerHTML = res.length ? res.map(function (r) {
      return '<a class="sr-item" href="#/' + encodeURIComponent(r.a.id) + '">' +
        '<div class="sr-title">' + HS.esc(r.a.title) + '</div>' +
        '<div class="sr-path">' + HS.esc(r.a.chapter) + ' › ' + HS.esc(r.a.section) + ' › ' + HS.esc(r.a.category) + '</div>' +
        '<div class="sr-snip">' + snippet(r.text, q) + '</div></a>';
    }).join('') : '<div class="empty"><span class="ic">🔍</span><div class="t">没有找到相关条目</div><div class="s">换个关键词试试</div></div>';
    renderTree();
  }

  /* ── 路由 ── */
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (!h) { renderHome(); document.title = '红石答辩 Wiki · 红石的小站'; return; }
    if (h.indexOf('h-') === 0) return; // 目录锚点
    renderArticle(h);
  }

  /* ── 进度条 ── */
  function updateProgress() {
    if ($('#viewArticle').hidden) { $('#progress').style.width = '0'; return; }
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    $('#progress').style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
  var rafPend = false;
  window.addEventListener('scroll', function () {
    if (rafPend) return;
    rafPend = true;
    requestAnimationFrame(function () { rafPend = false; updateProgress(); });
  }, { passive: true });

  /* ── 侧栏交互 ── */
  $('#tree').addEventListener('click', function (e) {
    var th = e.target.closest('[data-toggle]');
    if (th) {
      var key = th.getAttribute('data-toggle');
      var node = th.parentNode;
      var open = node.classList.toggle('open');
      setOpen(key, open);
      return;
    }
    var link = e.target.closest('.art-link');
    if (link && window.innerWidth <= 1000) document.body.classList.remove('sb-open');
  });
  $('#btnExpand').addEventListener('click', function () {
    HS.$$('#tree .node').forEach(function (n) { n.classList.add('open'); setOpen(n.getAttribute('data-key'), true); });
  });
  $('#btnCollapse').addEventListener('click', function () {
    HS.$$('#tree .node').forEach(function (n) { n.classList.remove('open'); setOpen(n.getAttribute('data-key'), false); });
  });
  $('#menuBtn').addEventListener('click', function () { document.body.classList.toggle('sb-open'); });
  $('#sideClose').addEventListener('click', function () { document.body.classList.remove('sb-open'); });
  $('#scrim').addEventListener('click', function () { document.body.classList.remove('sb-open'); });

  function randomArticle() {
    if (!ARTICLES.length) { HS.toast('还没有条目', { icon: '📭' }); return; }
    var a = ARTICLES[Math.floor(Math.random() * ARTICLES.length)];
    location.hash = '#/' + encodeURIComponent(a.id);
  }
  $('#btnRandom').addEventListener('click', randomArticle);
  $('#btnRandom2').addEventListener('click', randomArticle);
  $('#chapterGrid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]');
    if (b && b.getAttribute('data-go')) location.hash = '#/' + encodeURIComponent(b.getAttribute('data-go'));
  });
  $('#btnHome').addEventListener('click', function () { location.href = './index.html'; });
  $('#btnAdmin').addEventListener('click', function () { location.href = './admin.html'; });
  $('#btnAdmin2').addEventListener('click', function () { location.href = './admin.html'; });

  /* 字号 */
  var fsList = ['s', 'm', 'l'];
  var fs = HS.store.get(K_FS, 'm');
  function applyFs(v) {
    fs = v; HS.store.set(K_FS, v);
    document.body.setAttribute('data-fs', v);
    $('#fsBtn').textContent = ({ s: 'A', m: 'A', l: 'A' })[v];
    $('#fsBtn').style.fontSize = ({ s: '11px', m: '13px', l: '15px' })[v];
  }
  $('#fsBtn').addEventListener('click', function () {
    var i = fsList.indexOf(fs);
    applyFs(fsList[(i + 1) % fsList.length]);
    HS.toast('字号：' + ({ s: '小', m: '中', l: '大' })[fs]);
  });

  /* 搜索框 */
  var qEl = $('#q');
  var searchTimer = null;
  qEl.addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(searchTimer);
    if (!v) { route(); return; }
    searchTimer = setTimeout(function () { renderSearch(v); }, 120);
  });

  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
      e.preventDefault(); document.body.classList.toggle('sb-open');
    }
    if (e.key === 'Escape') {
      if (document.activeElement === qEl) { qEl.value = ''; qEl.blur(); route(); }
      document.body.classList.remove('sb-open');
    }
  });

  /* ── 启动 ── */
  applyFs(fs);
  window.addEventListener('hashchange', route);

  HS.fetchJSON('wiki-data.json', { remote: GH })
    .then(function (data) {
      ARTICLES = norm(data);
      buildTree();
      $('#viewLoading').hidden = true;
      $('#dataState').textContent = '已同步';
      route();
      HS.palette.init({
        actions: [
          { icon: '🎲', title: '随机条目', desc: '随便翻一条看看', run: randomArticle },
          { icon: '🎨', title: '切换风格', desc: '打开主题选择器', run: function () { HS.theme.open(); } },
          { icon: '🧰', title: '回工具台', desc: '红石的小站首页', run: function () { location.href = './index.html'; } }
        ],
        source: function () {
          return ARTICLES.map(function (a) {
            return { icon: '📄', title: a.title, desc: a.chapter + ' › ' + a.section, group: 'Wiki 条目', href: '#/' + encodeURIComponent(a.id) };
          });
        }
      });
    })
    .catch(function () {
      $('#viewLoading').innerHTML = '<div class="empty"><span class="ic">⚠️</span><div class="t">Wiki 数据加载失败</div>' +
        '<div class="s">请检查网络，或稍后刷新重试</div>' +
        '<button class="btn sm" onclick="location.reload()" style="margin-top:12px">🔄 重试</button></div>';
      $('#dataState').textContent = '离线模式';
    });

  HS.status.mount('wiki-data.json');
})();
</script>
</body>
</html>
