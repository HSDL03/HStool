<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载站 · 红石的小站</title>
<meta name="description" content="红石的小站下载站 —— GitHub Releases 与手动补录资源，支持按分类筛选、排序、复制直链。">
<meta name="theme-color" content="#3d521f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📥</text></svg>">
<script>
(function(){try{
  var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');
  var ok=['mc-wiki','mc-night','mc-nether','mc-end','sakura','ocean','github-light','github-dark'];
  if(t==='auto'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'mc-night':'mc-wiki';}
  if(t&&ok.indexOf(t)>-1)document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
/* ── 下载站专属 ─────────────────────────────────────────── */
.dl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 20px;max-width:700px}
.dstat{
  padding:11px 10px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);
  box-shadow:var(--bevel);transition:transform .22s cubic-bezier(.34,1.56,.64,1),border-color .22s;
}
[data-theme^="github-"] .dstat{border-width:1px;box-shadow:var(--sh-1);border-radius:var(--r-lg)}
.dstat:hover{transform:translateY(-3px);border-color:var(--ac)}
.dstat b{display:block;font-size:19px;font-weight:900;color:var(--ac);line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dstat span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}

.filters{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.filters .label{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}

/* 文件卡片 */
.file{position:relative}
.file .card-body{align-items:flex-start}
.file .cico{font-size:23px}
.file .cname{display:flex;align-items:center;gap:6px;min-width:0}
.file .cname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.file .cname .ext{
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 5px;color:var(--muted);background:var(--bg3);
  border:1px solid var(--bd-soft);border-radius:2px;flex:none;
}
.file .cmeta{gap:6px}
.file .metaitem{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.file .acts{display:flex;gap:4px;flex:none;align-self:center;margin-left:4px}
.file .act{
  width:30px;height:30px;display:grid;place-items:center;font-size:13px;
  color:var(--muted);background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r);cursor:pointer;transition:all .16s;
}
.file .act:hover{color:var(--ac);border-color:var(--ac);transform:translateY(-1px)}
.file .act.dl{color:var(--ac);border-color:var(--ac);background:var(--acs)}
.file.offline{opacity:.72;filter:grayscale(.4)}
.file.offline:hover{opacity:1;filter:none}
.file .rib{
  position:absolute;top:0;right:0;padding:1px 7px;font-size:9px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--on-ac);background:var(--ac);
  z-index:2;
}
[data-theme^="github-"] .file .rib{border-radius:0 var(--r-lg) 0 var(--r-lg)}

.skel-row{display:flex;flex-direction:column;gap:9px}
.skel-row .skel-card{border:1px solid var(--bd);opacity:.7}

@media(max-width:640px){
  .dl-stats{grid-template-columns:repeat(2,1fr)}
  .file .acts{margin-left:0}
  .file .act{width:28px;height:28px}
}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar" id="topbar">
  <a class="brand" href="../index.html" aria-label="回首页">
    <span class="ico">📥</span><span class="txt">下载站</span>
  </a>
  <span class="spacer"></span>
  <div class="searchbox">
    <span class="sico">⌕</span>
    <input id="q" type="search" placeholder="搜索资源…（按 / 聚焦）" autocomplete="off" aria-label="搜索资源">
    <span class="kbd-hint"><span class="kbd">Ctrl</span><span class="kbd">K</span></span>
  </div>
  <button class="iconbtn" id="btnPalette" data-sm-hide title="命令面板 (Ctrl+K)" aria-label="命令面板">⌘</button>
  <button class="iconbtn" id="btnReload" title="刷新 Releases" aria-label="刷新">🔄</button>
  <button class="iconbtn" data-act="theme" title="切换风格" aria-label="切换风格">🎨</button>
</header>

<div class="decor" aria-hidden="true"></div>

<main class="wrap" id="main">
  <div class="page-head">
    <div>
      <h1>📥 下载站</h1>
      <p class="sub">资源来自 GitHub Releases 与手动补录 —— 点卡片直接下载，或复制直链分享。</p>
    </div>
    <div class="actions">
      <button class="btn sm" id="btnHome">🧰 回工具台</button>
    </div>
  </div>

  <div class="dl-stats">
    <div class="dstat"><b id="statFiles">–</b><span>个资源</span></div>
    <div class="dstat"><b id="statSize">–</b><span>总体积</span></div>
    <div class="dstat"><b id="statTags">–</b><span>个分类</span></div>
    <div class="dstat"><b id="statDl">–</b><span>累计下载</span></div>
  </div>

  <div class="filters">
    <div class="toolbar" style="margin:0" id="tagChips"></div>
    <div class="row">
      <span class="label">排序</span>
      <select class="select" id="sortSel" aria-label="排序方式">
        <option value="default">默认顺序</option>
        <option value="new">最新在前</option>
        <option value="size">体积从大到小</option>
        <option value="name">按名称</option>
        <option value="hot">下载最多</option>
      </select>
      <div class="segmented" id="viewSwitch" role="group" aria-label="视图切换">
        <button type="button" data-view="grid" aria-pressed="true" title="网格">▦</button>
        <button type="button" data-view="list" aria-pressed="false" title="列表">☰</button>
      </div>
      <span class="spacer"></span>
      <span class="faint" style="font-size:11.5px" id="resultInfo"></span>
    </div>
  </div>

  <div class="sec-title">全部资源 <span class="count" id="listCount">0</span></div>
  <div class="grid" id="grid"></div>

  <div class="empty" id="emptyBox" hidden>
    <span class="ic">📭</span>
    <div class="t" id="emptyTitle">还没有资源</div>
    <div class="s" id="emptySub">去 GitHub 发一个 Release 就能自动出现在这里</div>
    <button class="btn sm" id="btnRetry" style="margin-top:12px" hidden>🔄 重试</button>
  </div>
</main>

<footer class="foot">
  <div class="fl">
    <span>📥 下载站</span>
    <a href="../index.html">回首页</a>
    <a href="./wiki.html">Wiki</a>
    <a href="https://github.com/HSDL03/HStool/releases" target="_blank" rel="noopener">GitHub Releases</a>
  </div>
  <div class="fr">
    <span>数据 <span id="dataState">加载中</span></span>
    <span>© <span data-year>2026</span></span>
  </div>
</footer>

<script src="../assets/js/core.js"></script>
<script>
(function () {
  'use strict';
  var GH_OWNER = 'HSDL03', GH_REPO = 'HStool', GH_BRANCH = 'main';
  var REPO = GH_OWNER + '/' + GH_REPO;
  var DATA_FILE = '../data/download-data.json';
  var RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/' + GH_BRANCH + '/';
  var CDN_BASE = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + GH_BRANCH + '/';
  var RELEASES_API = 'https://api.github.com/repos/' + REPO + '/releases';
  var TTL = 5 * 60 * 1000;

  var FILES = [];
  var state = {
    q: '', tag: '全部', sort: 'default', error: null, loading: true,
    view: HS.store.get('hs-view', 'grid')
  };

  /* ── Releases ── */
  function fetchAllReleases() {
    var all = [];
    function page(n) {
      return fetch(RELEASES_API + '?per_page=100&page=' + n, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (list) {
          if (!Array.isArray(list) || !list.length) return all;
          all = all.concat(list);
          return list.length < 100 ? all : page(n + 1);
        });
    }
    return page(1);
  }
  function fetchReleasesCached(force) {
    var key = 'hs-dl-releases-v2';
    if (!force) {
      try {
        var raw = sessionStorage.getItem(key);
        if (raw) {
          var o = JSON.parse(raw);
          if (o && o.t && (Date.now() - o.t) < TTL) return Promise.resolve(o.data);
        }
      } catch (e) { }
    }
    return fetchAllReleases().then(function (list) {
      try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), data: list })); } catch (e) { }
      return list;
    });
  }

  function guessIcon(name) {
    var ext = (String(name || '').split('.').pop() || '').toLowerCase();
    var map = {
      zip: '🗜', rar: '🗜', '7z': '🗜', tar: '🗜', gz: '🗜', mcstructure: '🏗',
      exe: '⚙', msi: '⚙', dmg: '💿', apk: '📱', jar: '☕',
      png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', webp: '🖼',
      mp3: '🎵', wav: '🎵', flac: '🎵', mp4: '🎬', mkv: '🎬',
      pdf: '📄', txt: '📝', md: '📝', doc: '📄', docx: '📄',
      xls: '📊', xlsx: '📊', csv: '📊', json: '📋', js: '📜', py: '🐍'
    };
    return map[ext] || '📦';
  }
  function parseSize(str) {
    if (!str) return 0;
    if (typeof str === 'number') return str;
    var m = String(str).match(/([\d.]+)\s*(B|KB|MB|GB|TB)?/i);
    if (!m) return 0;
    var v = parseFloat(m[1]) || 0;
    var mult = { B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1099511627776 }[(m[2] || 'B').toUpperCase()] || 1;
    return Math.round(v * mult);
  }
  function resolveUrl(u) {
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^\/\//.test(u)) return 'https:' + u;
    if (/^(mailto:|tel:)/i.test(u)) return u;
    if (u.charAt(0) === '/' || u.charAt(0) === '.') return u;
    return u;
  }

  function parseReleases(releases) {
    var out = [];
    (releases || []).forEach(function (r) {
      if (!r || r.draft) return;
      (r.assets || []).forEach(function (a) {
        var desc = r.body ? String(r.body).replace(/\r?\n/g, ' ').slice(0, 110) : '';
        out.push({
          releaseTag: r.tag_name, releaseName: r.name || r.tag_name, fileName: a.name,
          name: a.name, desc: desc, tag: '未分类', version: r.tag_name,
          size: a.size || 0, date: String(a.updated_at || r.published_at || '').slice(0, 10),
          url: a.browser_download_url, icon: guessIcon(a.name),
          offline: false, hidden: false, downloadCount: a.download_count || 0, auto: true
        });
      });
    });
    return out;
  }
  function mergeReleases(auto, manual) {
    var overrides = {}, standalone = [];
    (manual || []).forEach(function (m) {
      if (!m || typeof m !== 'object') return;
      if (m.releaseTag && m.fileName) overrides[m.releaseTag + '|' + m.fileName] = m;
      else if (m.name || m.url) standalone.push(m);
    });
    var merged = [];
    auto.forEach(function (a) {
      var ov = overrides[a.releaseTag + '|' + a.fileName];
      if (!ov) { merged.push(a); return; }
      if (ov.hidden) return;
      merged.push({
        releaseTag: a.releaseTag, releaseName: a.releaseName, fileName: a.fileName,
        name: ov.name || a.name,
        desc: (typeof ov.desc === 'string') ? ov.desc : a.desc,
        tag: ov.tag || a.tag, version: ov.version || a.version, icon: ov.icon || a.icon,
        url: a.url, size: a.size, date: a.date,
        offline: !!ov.offline, hidden: false, downloadCount: a.downloadCount, auto: true
      });
    });
    standalone.forEach(function (m) {
      if (m.hidden) return;
      var sz = parseSize(m.size);
      merged.push({
        releaseTag: '', releaseName: '', fileName: '',
        name: m.name || '未命名', desc: m.desc || '',
        tag: m.tag || '未分类', version: m.version || '', icon: m.icon || guessIcon(m.name || ''),
        url: m.url || '', size: sz || 0, date: HS.fmt.date(m.date),
        offline: !!m.offline, hidden: false, downloadCount: 0, auto: false
      });
    });
    return merged;
  }

  /* ── 加载 ── */
  function loadData(force) {
    state.loading = true; state.error = null;
    render();
    Promise.all([
      fetchReleasesCached(force).catch(function (e) { return { __err: e }; }),
      HS.fetchJSON(DATA_FILE, { remote: REPO }).catch(function () { return []; })
    ]).then(function (res) {
      var relRaw = res[0], manual = Array.isArray(res[1]) ? res[1] : [];
      var relErr = relRaw && relRaw.__err;
      var auto = relErr ? [] : parseReleases(relRaw);
      FILES = mergeReleases(auto, manual);
      state.loading = false;
      if (relErr && FILES.length === 0) state.error = '无法加载 Releases：' + (relErr.message || '网络异常');
      document.getElementById('dataState').textContent = relErr ? '部分离线' : '已同步';
      render();
      if (force) HS.toast(FILES.length + ' 个资源已更新', { icon: '✓' });
    }).catch(function (err) {
      FILES = []; state.loading = false; state.error = err.message || '加载失败';
      document.getElementById('dataState').textContent = '离线模式';
      render();
    });
  }

  /* ── 渲染 ── */
  function renderStats() {
    var bytes = 0, dl = 0, tags = {};
    FILES.forEach(function (f) {
      bytes += f.size || 0;
      dl += f.downloadCount || 0;
      tags[f.tag || '未分类'] = 1;
    });
    document.getElementById('statFiles').textContent = FILES.length;
    document.getElementById('statSize').textContent = HS.fmt.size(bytes) || '0 B';
    document.getElementById('statTags').textContent = Object.keys(tags).length;
    document.getElementById('statDl').textContent = dl > 9999 ? (dl / 1000).toFixed(1) + 'k' : dl;
  }

  function renderChips() {
    var counts = {}, total = 0;
    FILES.forEach(function (f) {
      var t = f.tag || '未分类';
      counts[t] = (counts[t] || 0) + 1; total++;
    });
    if (state.tag !== '全部' && !counts[state.tag]) state.tag = '全部';
    var h = '<span class="label">分类</span>' +
      '<button class="chip' + (state.tag === '全部' ? ' active' : '') + '" data-tag="全部">全部 <span class="n">' + total + '</span></button>';
    Object.keys(counts).sort(function (a, b) { return a.localeCompare(b, 'zh'); }).forEach(function (t) {
      h += '<button class="chip' + (state.tag === t ? ' active' : '') + '" data-tag="' + HS.esc(t) + '">' +
        HS.esc(t) + ' <span class="n">' + counts[t] + '</span></button>';
    });
    document.getElementById('tagChips').innerHTML = h;
  }

  function fileHTML(f, i, isNew) {
    var ext = (String(f.name || '').split('.').pop() || '').toUpperCase();
    if (ext.length > 6) ext = '';
    var href = f.offline || !f.url ? '' : resolveUrl(f.url);
    var meta = [];
    if (f.version) meta.push('<span class="metaitem">🏷 ' + HS.esc(f.version) + '</span>');
    if (f.size) meta.push('<span class="metaitem">' + HS.fmt.size(f.size) + '</span>');
    if (f.date) meta.push('<span class="metaitem">📅 ' + HS.esc(HS.fmt.date(f.date)) + '</span>');
    if (f.downloadCount) meta.push('<span class="metaitem">⬇ ' + f.downloadCount + '</span>');

    return '<div class="card file reveal' + (f.offline ? ' offline' : '') + '" data-fid="' + i + '" style="transition-delay:' + Math.min(i * 20, 260) + 'ms">' +
      (isNew ? '<span class="rib">NEW</span>' : '') +
      (f.offline ? '<span class="rib" style="background:var(--muted)">暂不可用</span>' : '') +
      '<span class="glow"></span>' +
      '<div class="card-body">' +
      '<div class="cico">' + HS.esc(f.icon || '📦') + '</div>' +
      '<div class="cinfo">' +
      '<div class="cname"><span class="nm" title="' + HS.esc(f.name) + '">' + HS.esc(f.name) + '</span>' + (ext ? '<span class="ext">' + HS.esc(ext) + '</span>' : '') + '</div>' +
      (f.desc ? '<div class="cdesc" title="' + HS.esc(f.desc) + '">' + HS.esc(f.desc) + '</div>' : '') +
      '<div class="cmeta"><span class="badge">' + HS.esc(f.tag || '未分类') + '</span>' + meta.join('') + '</div>' +
      '</div>' +
      '<div class="acts">' +
      '<button class="act" data-copy="' + i + '" title="复制下载直链" aria-label="复制直链">⧉</button>' +
      (href
        ? '<a class="act dl" href="' + HS.esc(href) + '" download target="_blank" rel="noopener" title="下载" aria-label="下载" data-idx="' + i + '">⬇</a>'
        : '<span class="act" style="opacity:.4;cursor:not-allowed" title="暂不可用">⬇</span>') +
      '</div></div></div>';
  }

  function render() {
    var grid = document.getElementById('grid');
    var emptyBox = document.getElementById('emptyBox');
    var count = document.getElementById('listCount');

    renderStats();
    renderChips();
    document.querySelectorAll('#viewSwitch button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view') === state.view ? 'true' : 'false');
    });
    grid.className = 'grid' + (state.view === 'list' ? ' list' : '');

    if (state.loading) {
      count.textContent = '—';
      emptyBox.hidden = true;
      grid.innerHTML = '<div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div>' +
        '<div class="skel skel-card"></div><div class="skel skel-card"></div><div class="skel skel-card"></div>';
      return;
    }

    var q = state.q.trim().toLowerCase();
    var list = FILES.filter(function (f) {
      if (state.tag !== '全部' && (f.tag || '未分类') !== state.tag) return false;
      if (q) {
        var hay = (f.name + ' ' + (f.desc || '') + ' ' + (f.tag || '') + ' ' + (f.version || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    list = list.slice();
    if (state.sort === 'new') list.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    else if (state.sort === 'size') list.sort(function (a, b) { return (b.size || 0) - (a.size || 0); });
    else if (state.sort === 'name') list.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    else if (state.sort === 'hot') list.sort(function (a, b) { return (b.downloadCount || 0) - (a.downloadCount || 0); });

    count.textContent = list.length;
    document.getElementById('resultInfo').textContent =
      (q || state.tag !== '全部') ? '筛选出 ' + list.length + ' / ' + FILES.length + ' 个' : '共 ' + FILES.length + ' 个资源';

    if (!list.length) {
      grid.innerHTML = '';
      emptyBox.hidden = false;
      var isEmptyData = FILES.length === 0;
      document.getElementById('emptyTitle').textContent = isEmptyData
        ? (state.error ? '数据加载失败' : '还没有资源')
        : '没有匹配的资源';
      document.getElementById('emptySub').textContent = isEmptyData
        ? (state.error || '去 GitHub 发一个 Release 就能自动出现在这里')
        : '换个关键词或者分类试试';
      document.getElementById('btnRetry').hidden = !isEmptyData;
      return;
    }
    emptyBox.hidden = true;
    var newest = null;
    list.forEach(function (f) { if (f.date && (!newest || f.date > newest)) newest = f.date; });
    grid.innerHTML = list.map(function (f, i) {
      return fileHTML(f, i, !!f.date && f.date === newest && i === 0);
    }).join('');
    bindFx(grid, list);
    HS.reveal();
  }

  function bindFx(grid, list) {
    grid.querySelectorAll('.file').forEach(function (c) {
      var glow = c.querySelector('.glow');
      if (glow) {
        c.addEventListener('mousemove', function (e) {
          var r = c.getBoundingClientRect();
          glow.style.left = (e.clientX - r.left) + 'px';
          glow.style.top = (e.clientY - r.top) + 'px';
        });
      }
    });
    grid.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var f = list[Number(btn.getAttribute('data-copy'))];
        if (!f) return;
        var url = f.url ? new URL(resolveUrl(f.url), location.href).href : '';
        if (!url) { HS.toast('这个资源没有可用直链', { icon: '⚠️' }); return; }
        copyText(url).then(function () {
          HS.toast('直链已复制', { icon: '✓' });
        }).catch(function () {
          HS.toast('复制失败，请手动复制', { icon: '⚠️' });
        });
      });
    });
    grid.querySelectorAll('[data-idx]').forEach(function (a) {
      a.addEventListener('click', function () { /* 让浏览器原生下载 */ });
    });
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  /* ── 事件 ── */
  document.getElementById('tagChips').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tag]');
    if (!b) return;
    state.tag = b.getAttribute('data-tag');
    render();
  });
  document.getElementById('sortSel').addEventListener('change', function (e) {
    state.sort = e.target.value;
    render();
  });
  document.getElementById('viewSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    if (!b) return;
    state.view = b.getAttribute('data-view');
    HS.store.set('hs-view', state.view);
    render();
  });
  document.getElementById('btnReload').addEventListener('click', function () {
    var btn = this;
    btn.classList.add('spinning');
    loadData(true);
    setTimeout(function () { btn.classList.remove('spinning'); }, 900);
  });
  document.getElementById('btnRetry').addEventListener('click', function () { loadData(true); });
  document.getElementById('btnHome').addEventListener('click', function () { location.href = '../index.html'; });
  document.getElementById('btnPalette').addEventListener('click', function () { HS.palette.open(); });

  var qEl = document.getElementById('q');
  qEl.addEventListener('input', function () { state.q = this.value; render(); });
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
      e.preventDefault(); qEl.focus(); qEl.select();
    }
    if (e.key === 'Escape' && document.activeElement === qEl) {
      qEl.value = ''; state.q = ''; qEl.blur(); render();
    }
  });

  /* ── 命令面板 ── */
  HS.palette.init({
    actions: [
      { icon: '🔄', title: '刷新资源列表', desc: '重新拉取 GitHub Releases', run: function () { loadData(true); } },
      { icon: '🎨', title: '切换风格', desc: '打开主题选择器', run: function () { HS.theme.open(); } },
      { icon: '🧰', title: '回工具台', desc: '红石的小站首页', run: function () { location.href = '../index.html'; } },
      { icon: '📚', title: '打开 Wiki', desc: '个人知识库', run: function () { location.href = './wiki.html'; } }
    ],
    source: function () {
      return FILES.map(function (f) {
        return {
          icon: f.icon || '📦', title: f.name, desc: (f.tag || '') + ' · ' + (HS.fmt.size(f.size) || '未知大小'),
          group: '资源', keywords: f.tag + ' ' + (f.desc || ''), href: f.url ? resolveUrl(f.url) : ''
        };
      });
    }
  });

  loadData(false);
  HS.status.mount(DATA_FILE);
})();
</script>
</body>
</html>
