<!DOCTYPE html>
<html lang="zh-CN" data-theme="mc-wiki">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红石Wiki · 红石的小站</title>
<meta name="description" content="红石Wiki —— 按大板块 / 板块 / 分类整理的条目式知识库，支持全文搜索、目录跳转与阅读进度。">
<meta name="theme-color" content="#3d521f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<script>try{var t=localStorage.getItem('hs-theme')||localStorage.getItem('wiki-theme');if(t==='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'mc-night':'mc-wiki';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="../assets/css/core.css">
<style>
/* ═══════════════════════════════════════════════════════════
   Wiki 版式：参考 MediaWiki（zh.minecraft.wiki）的结构
   顶部条 / 左侧固定导航 + 目录 / 内容区 / 信息框 / 分类栏 / 页脚
   ═══════════════════════════════════════════════════════════ */
:root{--mw-side:248px;--mw-gap:26px;--mw-max:1180px}

body{padding-top:56px;background:var(--bg)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:var(--ac);transition:width .1s linear;pointer-events:none}

/* ── 顶部条 ── */
.mw-head{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:60;
  display:flex;align-items:center;gap:10px;padding:0 16px;
  background:var(--topbar-bg);color:var(--topbar-fg);
  border-bottom:2px solid var(--topbar-bd);
}
[data-theme^="github-"] .mw-head{border-bottom-width:1px}
.mw-head.scrolled{box-shadow:0 3px 12px rgba(0,0,0,.16)}
.mw-logo{display:flex;align-items:center;gap:9px;flex:none;color:inherit;text-decoration:none}
.mw-logo .mark{
  width:34px;height:34px;display:grid;place-items:center;font-size:19px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-radius:var(--r);
}
[data-theme^="github-"] .mw-logo .mark{background:var(--bg2);border-color:var(--bd);color:var(--text)}
.mw-logo .txt{display:flex;flex-direction:column;line-height:1.15}
.mw-logo .txt b{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
[data-theme^="mc-"] .mw-logo .txt b{text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.mw-logo .txt i{font-size:10px;font-style:normal;letter-spacing:.1em;opacity:.72;text-transform:uppercase}

.mw-search{flex:1 1 320px;max-width:520px;position:relative;display:flex;align-items:center}
.mw-search .sico{position:absolute;left:10px;font-size:13px;opacity:.65;pointer-events:none}
.mw-search input{
  width:100%;height:34px;padding:0 12px 0 30px;font-family:inherit;font-size:13.5px;
  color:var(--text);background:var(--bg);border:2px solid var(--topbar-bd);
  border-radius:var(--r);outline:none;transition:box-shadow .15s,border-color .15s;
  box-shadow:var(--bevel-in);
}
[data-theme^="github-"] .mw-search input{border-width:1px;box-shadow:none;background:var(--bg2);border-color:var(--bd)}
.mw-search input::placeholder{color:var(--faint)}
.mw-search input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}

.mw-tools{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.mw-tools .tbtn{
  display:inline-flex;align-items:center;gap:5px;height:30px;min-width:30px;padding:0 8px;
  font-family:inherit;font-size:12px;font-weight:700;color:inherit;
  background:transparent;border:1px solid transparent;border-radius:var(--r);
  cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;
}
.mw-tools .tbtn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.22)}
[data-theme^="github-"] .mw-tools .tbtn:hover{background:var(--bg3);border-color:var(--bd)}

/* ── 主体 ── */
.mw-body{
  position:relative;z-index:2;max-width:var(--mw-max);margin:0 auto;
  display:grid;grid-template-columns:var(--mw-side) minmax(0,1fr);gap:var(--mw-gap);
  padding:0 20px 40px;align-items:start;
}

/* ── 左侧栏 ── */
.mw-side{
  position:sticky;top:72px;max-height:calc(100vh - 88px);overflow-y:auto;
  padding:16px 0 20px;font-size:13px;
}
.side-block{margin-bottom:18px}
.side-block h3{
  margin:0 0 7px;padding-bottom:5px;font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border-bottom:1px solid var(--bd);
}
.tree{display:flex;flex-direction:column}
.node>.th{
  display:flex;align-items:center;gap:5px;padding:3.5px 6px;border-radius:var(--r);
  cursor:pointer;user-select:none;font-size:12.5px;color:var(--text);transition:background .12s;
}
.node>.th:hover{background:var(--bg2)}
.node .arw{width:10px;flex:none;font-size:8px;color:var(--faint);transition:transform .2s;display:grid;place-items:center}
.node.open>.th .arw{transform:rotate(90deg)}
.node .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.node .ct{flex:none;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.node>.tb{overflow:hidden;max-height:0;transition:max-height .28s cubic-bezier(.22,1,.36,1)}
.node.open>.tb{max-height:3000px}
.node.lv-ch>.th{font-weight:800}
.node.lv-ch>.tb{padding-left:9px}
.node.lv-se>.tb{padding-left:11px}
.node.lv-se>.th{font-size:12.5px}
.node.lv-ca>.th{font-size:12px;color:var(--muted)}
.node.lv-ca>.tb{padding-left:13px}
.art-link{
  display:block;padding:2.5px 8px;font-size:12.5px;color:var(--muted);
  border-left:2px solid transparent;text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .12s;
}
.art-link:hover{color:var(--ac);background:var(--bg2)}
.art-link.on{color:var(--ac);border-left-color:var(--ac);background:var(--acs);font-weight:700}

/* 目录（放在侧栏，学 Vector 2022） */
#toc a{
  display:block;padding:3px 8px;font-size:12.5px;color:var(--muted);
  border-left:2px solid transparent;text-decoration:none;line-height:1.45;transition:all .12s;
}
#toc a:hover{color:var(--ac);border-left-color:var(--ac)}
#toc a.lv3{padding-left:19px;font-size:11.5px;opacity:.88}
#toc a.on{color:var(--ac);border-left-color:var(--ac);font-weight:700;background:var(--acs)}
.side-acts{display:flex;flex-wrap:wrap;gap:4px}
.side-acts a,.side-acts button{
  flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:5px 8px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--muted);
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  text-decoration:none;cursor:pointer;transition:all .14s;
}
.side-acts a:hover,.side-acts button:hover{color:var(--ac);border-color:var(--ac);background:var(--acs)}

/* ── 内容区 ── */
.mw-content{min-width:0;padding-top:14px}
.mw-title{
  margin:0 0 4px;font-size:clamp(1.7rem,3.4vw,2.3rem);font-weight:800;
  line-height:1.2;letter-spacing:-.02em;color:var(--text);
  border-bottom:2px solid var(--bd);padding-bottom:8px;
}
.mw-subline{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:0 0 16px;font-size:12px;color:var(--faint);
}
.mw-subline .sep{opacity:.5}

/* 页签（阅读 / 编辑等） */
.mw-tabs{display:flex;gap:2px;margin:0 0 14px;border-bottom:1px solid var(--bd);font-size:12.5px}
.mw-tabs span,.mw-tabs a{
  padding:6px 11px;font-weight:700;color:var(--muted);text-decoration:none;
  border:1px solid transparent;border-bottom:none;border-radius:3px 3px 0 0;
}
.mw-tabs .on{background:var(--bg);border-color:var(--bd);color:var(--ac);margin-bottom:-1px;border-bottom:1px solid var(--bg)}
.mw-tabs a:hover{color:var(--ac)}

/* 信息框 */
.infobox{
  float:right;width:290px;margin:0 0 16px 20px;
  font-size:12.5px;line-height:1.55;
  background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r);overflow:hidden;
}
[data-theme^="mc-"] .infobox{border:2px solid var(--bd2);box-shadow:var(--bevel)}
.infobox .ib-head{
  padding:7px 11px;font-weight:800;font-size:13px;text-align:center;
  background:var(--bg2);border-bottom:1px solid var(--bd);
}
.infobox .ib-body{padding:0}
.infobox .row{display:flex;gap:10px;padding:5px 11px;border-bottom:1px solid var(--bd-soft)}
.infobox .row:last-child{border-bottom:none}
.infobox .k{flex:none;width:64px;color:var(--muted);font-weight:600}
.infobox .v{flex:1;min-width:0;word-break:break-word}
.infobox .v a{color:var(--ac);text-decoration:none}
.infobox .v a:hover{text-decoration:underline}

/* 正文 */
.prose{font-size:14.5px;line-height:1.75;color:var(--text)}
.prose h2{
  margin:1.5em 0 .55em;padding-bottom:.25em;font-size:1.35em;font-weight:700;
  border-bottom:1px solid var(--bd);letter-spacing:-.01em;scroll-margin-top:70px;
}
.prose h3{margin:1.2em 0 .45em;font-size:1.13em;font-weight:700;color:var(--text);scroll-margin-top:70px}
.prose h4{margin:1em 0 .4em;font-size:1em;font-weight:700;color:var(--muted)}
.prose p{margin:0 0 .95em}
.prose a{color:var(--ac);text-decoration:none;border-bottom:none}
.prose a:hover{text-decoration:underline}
.prose ul,.prose ol{margin:0 0 .95em;padding-left:1.6em}
.prose li{margin:.2em 0}
.prose li::marker{color:var(--ac)}
.prose blockquote{margin:1em 0;padding:.55em .9em;border-left:3px solid var(--bd);background:var(--bg2);color:var(--muted)}
.prose img{border:1px solid var(--bd);border-radius:var(--r);margin:.5em 0}
.prose table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13px;border:1px solid var(--bd)}
.prose th,.prose td{padding:6px 9px;border:1px solid var(--bd)}
.prose th{background:var(--bg2);font-weight:700}
.prose hr{margin:1.6em 0;border:none;border-top:1px solid var(--bd)}

/* 分类栏 */
.mw-cats{
  margin:26px 0 0;padding:9px 12px;font-size:12.5px;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
}
.mw-cats .lb{font-weight:800;color:var(--muted);margin-right:6px}
.mw-cats a{color:var(--ac);text-decoration:none}
.mw-cats a:hover{text-decoration:underline}
.mw-cats .sep{color:var(--faint);margin:0 4px}

/* 上一篇 / 下一篇 */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 0}
.pg{
  display:flex;flex-direction:column;gap:2px;padding:9px 12px;text-decoration:none;color:inherit;
  background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);transition:all .16s;min-width:0;
}
.pg:hover{border-color:var(--ac);background:var(--acs)}
.pg .lbl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pg .tt{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.next{text-align:right;grid-column:2}
.pg.empty{visibility:hidden}

/* 首页 */
.lead{font-size:14.5px;line-height:1.8;color:var(--text);margin:0 0 18px}
.lead b{font-weight:800}
.stat-inline{color:var(--muted);font-size:13px;margin:0 0 18px}
.stat-inline b{color:var(--ac);font-weight:800;font-variant-numeric:tabular-nums}
.portal{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin:6px 0 4px}
.portal .col h4{
  margin:0 0 6px;padding-bottom:4px;font-size:13px;font-weight:800;
  border-bottom:1px solid var(--bd);
}
.portal ul{margin:0;padding-left:1.3em;font-size:13px;line-height:1.9}
.portal a{color:var(--ac);text-decoration:none}
.portal a:hover{text-decoration:underline}
.portal .num{color:var(--faint);font-size:11px}

/* 搜索结果 */
.sr-item{display:block;padding:9px 0;border-bottom:1px solid var(--bd-soft);text-decoration:none;color:inherit}
.sr-item:hover .sr-title{text-decoration:underline}
.sr-title{font-size:14.5px;font-weight:700;color:var(--ac)}
.sr-path{font-size:11.5px;color:var(--faint);margin:1px 0 3px}
.sr-snip{font-size:13px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sr-snip mark{background:var(--acs);color:var(--ac);font-weight:700;padding:0 1px}

/* 页脚 */
.mw-foot{
  max-width:var(--mw-max);margin:0 auto;padding:14px 20px 40px;
  border-top:1px solid var(--bd);font-size:12px;color:var(--faint);
  display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
}
.mw-foot a{color:var(--muted);text-decoration:none}
.mw-foot a:hover{color:var(--ac);text-decoration:underline}
.mw-foot .r{margin-left:auto;font-family:var(--mono);font-size:11px}

/* 字号档位 */
body[data-fs="s"] .prose{font-size:13.5px}
body[data-fs="l"] .prose{font-size:16px}

/* 遮罩与移动端 */
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.2s}
@media(max-width:980px){
  .mw-body{grid-template-columns:1fr;padding:0 14px 30px}
  .mw-side{
    position:fixed;top:56px;left:0;bottom:0;width:272px;max-height:none;z-index:58;
    padding:14px;background:var(--bg2);border-right:1px solid var(--bd);
    transform:translateX(-102%);transition:transform .26s cubic-bezier(.22,1,.36,1);overflow-y:auto;
  }
  body.sb-open .mw-side{transform:none;box-shadow:6px 0 26px rgba(0,0,0,.3)}
  body.sb-open .scrim{opacity:1;visibility:visible}
  .mw-content{padding-top:12px}
  .infobox{float:none;width:100%;margin:0 0 16px}
  .portal{grid-template-columns:1fr}
  #menuBtn{display:inline-flex}
}
@media(min-width:981px){#menuBtn{display:none}}
@media(max-width:640px){
  .mw-head{padding:0 8px;gap:6px}
  .mw-logo .txt{display:none}          /* 窄屏只留图标，把宽度让给搜索框 */
  .mw-search{flex:1 1 auto;max-width:none}
  .mw-tools .tbtn .lbl{display:none}
  #fsBtn{display:none}
  .mw-tools .tbtn{min-width:28px;padding:0 5px}
  .mw-title{font-size:1.55rem}
  .pager{grid-template-columns:1fr}
  .pg.next{grid-column:1;text-align:left}
}
</style>
</head>
<body>
<div id="progress"></div>

<header class="mw-head" id="topbar">
  <button class="tbtn" id="menuBtn" title="目录" aria-label="展开导航"
    style="background:transparent;border:1px solid transparent;color:inherit;width:34px;justify-content:center">☰</button>
  <a class="mw-logo" href="./wiki.html" aria-label="红石Wiki 首页">
    <span class="mark">🧱</span>
    <span class="txt"><b>红石Wiki</b><i>红石的小站</i></span>
  </a>
  <div class="mw-search">
    <span class="sico">⌕</span>
    <input id="q" type="search" placeholder="搜索条目…" autocomplete="off" aria-label="搜索条目">
  </div>
  <div class="mw-tools">
    <button class="tbtn" id="fsBtn" title="字号"><span class="lbl">字号</span> Aa</button>
    <button class="tbtn" data-act="theme" title="切换风格">🎨</button>
    <a class="tbtn" href="./admin.html" title="编辑数据">✏️</a>
    <a class="tbtn" href="../index.html" title="回工具箱">🧰</a>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="mw-body">
  <aside class="mw-side" id="side" aria-label="站点导航">
    <div class="side-block">
      <h3>导航</h3>
      <nav class="tree" id="tree"></nav>
    </div>
    <div class="side-block" id="tocBlock" hidden>
      <h3>本页目录</h3>
      <div id="toc"></div>
    </div>
    <div class="side-block">
      <h3>工具</h3>
      <div class="side-acts">
        <button type="button" id="btnRandom">🎲 随机条目</button>
        <button type="button" id="btnCollapse">⇤ 全部收起</button>
        <a href="../index.html">🧰 回工具箱</a>
        <a href="./admin.html">✏️ 编辑</a>
      </div>
    </div>
  </aside>

  <main class="mw-content" id="main">

    <!-- 首页 -->
    <section id="viewHome">
      <h1 class="mw-title">红石Wiki</h1>
      <div class="mw-subline">
        <span>来自红石的小站</span><span class="sep">·</span>
        <span>条目式个人知识库</span>
      </div>
      <p class="lead">这里把零散的笔记按 <b>大板块 → 板块 → 分类</b> 三层归置。左侧是完整目录，右侧搜索框可以全文检索，条目内还有目录跳转。</p>
      <p class="stat-inline">
        现有 <b id="nArt">–</b> 个条目，<b id="nCh">–</b> 个大板块，<b id="nSe">–</b> 个板块，<b id="nCa">–</b> 个分类。
      </p>
      <h2 style="margin:1.2em 0 .5em;padding-bottom:.25em;font-size:1.3em;font-weight:700;border-bottom:1px solid var(--bd)">按大板块浏览</h2>
      <div class="portal" id="portal"></div>
    </section>

    <!-- 条目 -->
    <section id="viewArticle" hidden>
      <div class="mw-tabs">
        <span class="on">条目</span>
        <a href="./admin.html" title="在管理后台编辑">编辑</a>
      </div>
      <h1 class="mw-title" id="artTitle"></h1>
      <div class="mw-subline" id="artMeta"></div>
      <article class="prose" id="artBody"></article>
      <div class="mw-cats" id="artCats"></div>
      <nav class="pager" id="pager"></nav>
    </section>

    <!-- 搜索 -->
    <section id="viewSearch" hidden>
      <h1 class="mw-title">搜索结果</h1>
      <div class="mw-subline" id="searchInfo"></div>
      <div id="searchRes"></div>
    </section>

    <!-- 加载占位 -->
    <section id="viewLoading">
      <div class="skel" style="height:38px;max-width:260px;margin-bottom:10px"></div>
      <div class="skel" style="height:14px;max-width:420px;margin-bottom:22px"></div>
      <div class="skel" style="height:120px"></div>
    </section>
  </main>
</div>

<footer class="mw-foot">
  <span>本页内容由「红石的小站」整理，数据存放于 GitHub 仓库。</span>
  <a href="./admin.html">编辑</a>
  <a href="../index.html">首页</a>
  <a href="./download.html">下载站</a>
  <span class="r">数据 <span id="dataState">加载中</span></span>
</footer>

<script src="../assets/js/core.js"></script>
<script>
(function () {
  'use strict';
  var K_TREE = 'hs-wiki-tree';
  var K_FS = 'hs-wiki-fs';

  var ARTICLES = [];
  var TREE = { chapters: [] };
  var treeOpen = HS.store.json(K_TREE, {});
  var curId = null;
  var query = '';
  var $ = HS.$;

  /* ── 规范化 ── */
  function norm(raw) {
    var out = [], used = {};
    (raw || []).forEach(function (r, i) {
      if (!r || typeof r !== 'object') return;
      var title = (typeof r.title === 'string' && r.title.trim()) ? r.title.trim() : ('未命名 ' + (i + 1));
      var id = String(r.id || '').trim();
      if (!id || used[id]) {
        var base = title.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '') || 'entry';
        id = base;
        var n = 2;
        while (used[id]) { id = base + '-' + n; n++; }
      }
      used[id] = 1;
      out.push({
        id: id,
        title: title,
        chapter: (typeof r.chapter === 'string' && r.chapter.trim()) ? r.chapter.trim() : '未分类大板块',
        section: (typeof r.section === 'string' && r.section.trim()) ? r.section.trim() : '未分类板块',
        category: (typeof r.category === 'string' && r.category.trim()) ? r.category.trim() : '未分类',
        content: typeof r.content === 'string' ? r.content : ''
      });
    });
    return out;
  }

  function buildTree() {
    var map = {};
    ARTICLES.forEach(function (a) {
      var ch = map[a.chapter] || (map[a.chapter] = { name: a.chapter, count: 0, sections: {} });
      var se = ch.sections[a.section] || (ch.sections[a.section] = { name: a.section, count: 0, cats: {} });
      var ca = se.cats[a.category] || (se.cats[a.category] = { name: a.category, items: [] });
      ca.items.push(a);
      ch.count++; se.count++;
    });
    TREE.chapters = Object.keys(map).map(function (k) {
      var ch = map[k];
      ch.sectionsArr = Object.keys(ch.sections).map(function (sk) {
        var se = ch.sections[sk];
        se.catsArr = Object.keys(se.cats).map(function (ck) { return se.cats[ck]; });
        return se;
      });
      return ch;
    });
  }

  function isOpen(key, dflt) { return treeOpen.hasOwnProperty(key) ? !!treeOpen[key] : !!dflt; }
  function setOpen(key, v) { treeOpen[key] = v; HS.store.setJson(K_TREE, treeOpen); }

  function renderTree() {
    var html = '';
    TREE.chapters.forEach(function (ch) {
      var kc = 'ch:' + ch.name, openC = isOpen(kc, true);
      html += '<div class="node lv-ch' + (openC ? ' open' : '') + '" data-key="' + HS.esc(kc) + '">' +
        '<div class="th" data-toggle="' + HS.esc(kc) + '"><span class="arw">▸</span>' +
        '<span class="lb">' + HS.esc(ch.name) + '</span><span class="ct">' + ch.count + '</span></div><div class="tb">';
      ch.sectionsArr.forEach(function (se) {
        var ks = 'se:' + ch.name + '/' + se.name, openS = isOpen(ks, true);
        html += '<div class="node lv-se' + (openS ? ' open' : '') + '" data-key="' + HS.esc(ks) + '">' +
          '<div class="th" data-toggle="' + HS.esc(ks) + '"><span class="arw">▸</span>' +
          '<span class="lb">' + HS.esc(se.name) + '</span><span class="ct">' + se.count + '</span></div><div class="tb">';
        se.catsArr.forEach(function (ca) {
          var ka = 'ca:' + ch.name + '/' + se.name + '/' + ca.name, openA = isOpen(ka, true);
          html += '<div class="node lv-ca' + (openA ? ' open' : '') + '" data-key="' + HS.esc(ka) + '">' +
            '<div class="th" data-toggle="' + HS.esc(ka) + '"><span class="arw">▸</span>' +
            '<span class="lb">' + HS.esc(ca.name) + '</span><span class="ct">' + ca.items.length + '</span></div><div class="tb">';
          ca.items.forEach(function (a) {
            html += '<a class="art-link' + (a.id === curId ? ' on' : '') + '" href="#/' + encodeURIComponent(a.id) + '">' +
              HS.esc(a.title) + '</a>';
          });
          html += '</div></div>';
        });
        html += '</div></div>';
      });
      html += '</div></div>';
    });
    if (!html) {
      html = '<div class="empty" style="padding:18px 10px"><span class="ic">📭</span><div class="t">还没有条目</div></div>';
    }
    $('#tree').innerHTML = html;
  }

  /* ── 首页 ── */
  function renderHome() {
    curId = null;
    $('#viewArticle').hidden = true;
    $('#viewSearch').hidden = true;
    $('#viewHome').hidden = false;
    $('#tocBlock').hidden = true;
    $('#progress').style.width = '0';
    var seCount = 0, caCount = 0;
    TREE.chapters.forEach(function (c) {
      seCount += c.sectionsArr.length;
      c.sectionsArr.forEach(function (s) { caCount += s.catsArr.length; });
    });
    $('#nArt').textContent = ARTICLES.length;
    $('#nCh').textContent = TREE.chapters.length;
    $('#nSe').textContent = seCount;
    $('#nCa').textContent = caCount;

    /* 两栏门户列表，学 MC Wiki 首页的链接列表 */
    var cols = ['', ''];
    TREE.chapters.forEach(function (ch, i) {
      var items = '';
      ch.sectionsArr.forEach(function (se) {
        se.catsArr.forEach(function (ca) {
          ca.items.forEach(function (a) {
            items += '<li><a href="#/' + encodeURIComponent(a.id) + '">' + HS.esc(a.title) + '</a>' +
              ' <span class="num">· ' + HS.esc(se.name) + '</span></li>';
          });
        });
      });
      cols[i % 2] += '<div class="col"><h4>' + HS.esc(ch.name) + ' <span class="num">（' + ch.count + '）</span></h4>' +
        '<ul>' + (items || '<li class="num">暂无条目</li>') + '</ul></div>';
    });
    $('#portal').innerHTML = cols[0] || cols[1] ? cols[0] + cols[1] :
      '<div class="empty" style="grid-column:1/-1"><span class="ic">📭</span><div class="t">还没有内容</div><div class="s">去管理后台添加第一条 Wiki 数据</div></div>';
    renderTree();
    document.title = '红石Wiki · 红石的小站';
  }

  function findArticle(id) {
    for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].id === id) return ARTICLES[i];
    return null;
  }

  /* ── 条目 ── */
  function renderArticle(id) {
    var a = findArticle(id);
    if (!a) { location.hash = '#/'; return; }
    curId = id;
    $('#viewHome').hidden = true;
    $('#viewSearch').hidden = true;
    $('#viewArticle').hidden = false;

    $('#artTitle').textContent = a.title;

    var words = a.content.replace(/<[^>]+>/g, '').trim().length;
    var readMin = Math.max(1, Math.round(words / 320));
    $('#artMeta').innerHTML =
      '<span>' + HS.esc(a.chapter) + '</span><span class="sep">›</span>' +
      '<span>' + HS.esc(a.section) + '</span><span class="sep">›</span>' +
      '<span>' + HS.esc(a.category) + '</span><span class="sep">·</span>' +
      '<span>' + words + ' 字 · 约 ' + readMin + ' 分钟</span>' +
      '<span style="margin-left:auto;display:flex;gap:10px">' +
      '<a href="javascript:void 0" id="btnCopyLink" style="color:var(--ac);text-decoration:none">复制链接</a>' +
      '<a href="./admin.html" style="color:var(--ac);text-decoration:none">编辑</a></span>';

    var body = $('#artBody');
    body.innerHTML = a.content || '<p class="muted">（这条还没有内容）</p>';

    /* 信息框 */
    var heads = body.querySelectorAll('h1,h2,h3');
    var tocHtml = '';
    Array.prototype.forEach.call(heads, function (h, i) {
      var hid = 'h-' + i;
      h.id = hid;
      if (h.tagName === 'H3') tocHtml += '<a class="lv3" href="#' + hid + '" data-toc="' + hid + '">' + HS.esc(h.textContent) + '</a>';
      else if (h.tagName === 'H2') tocHtml += '<a href="#' + hid + '" data-toc="' + hid + '">' + HS.esc(h.textContent) + '</a>';
    });

    var ib = document.createElement('div');
    ib.className = 'infobox';
    ib.innerHTML =
      '<div class="ib-head">' + HS.esc(a.title) + '</div>' +
      '<div class="ib-body">' +
      '<div class="row"><span class="k">大板块</span><span class="v">' + HS.esc(a.chapter) + '</span></div>' +
      '<div class="row"><span class="k">板块</span><span class="v">' + HS.esc(a.section) + '</span></div>' +
      '<div class="row"><span class="k">分类</span><span class="v">' + HS.esc(a.category) + '</span></div>' +
      '<div class="row"><span class="k">字数</span><span class="v">' + words + ' 字</span></div>' +
      '<div class="row"><span class="k">阅读</span><span class="v">约 ' + readMin + ' 分钟</span></div>' +
      '</div>';
    body.insertBefore(ib, body.firstChild);

    /* 侧栏目录 */
    var toc = $('#toc');
    if (tocHtml) {
      toc.innerHTML = tocHtml;
      $('#tocBlock').hidden = false;
    } else {
      $('#tocBlock').hidden = true;
    }

    /* 分类栏 */
    var idx = ARTICLES.indexOf(a);
    $('#artCats').innerHTML = '<span class="lb">分类：</span>' +
      '<a href="#/">' + HS.esc(a.category) + '</a><span class="sep">|</span>' +
      '<a href="#/">' + HS.esc(a.chapter) + '</a><span class="sep">|</span>' +
      '<a href="#/">' + HS.esc(a.section) + '</a>';

    /* 上一篇 / 下一篇 */
    var prev = ARTICLES[idx - 1], next = ARTICLES[idx + 1];
    $('#pager').innerHTML =
      (prev ? '<a class="pg prev" href="#/' + encodeURIComponent(prev.id) + '"><span class="lbl">← 上一篇</span><span class="tt">' + HS.esc(prev.title) + '</span></a>' : '<span class="pg empty"></span>') +
      (next ? '<a class="pg next" href="#/' + encodeURIComponent(next.id) + '"><span class="lbl">下一篇 →</span><span class="tt">' + HS.esc(next.title) + '</span></a>' : '<span class="pg empty"></span>');

    var cl = $('#btnCopyLink');
    if (cl) cl.addEventListener('click', function (e) {
      e.preventDefault();
      HS.copy(location.origin + location.pathname + '#/' + encodeURIComponent(id))
        .then(function () { HS.toast('链接已复制', { icon: '🔗' }); })
        .catch(function () { HS.toast('复制失败', { icon: '⚠️' }); });
    });

    renderTree();
    window.scrollTo({ top: 0, behavior: HS.reduced ? 'auto' : 'smooth' });
    setupTocSpy();
    document.title = a.title + ' · 红石Wiki';
  }

  /* ── 目录高亮 ── */
  var spyIO = null;
  function setupTocSpy() {
    if (spyIO) spyIO.disconnect();
    var links = HS.$$('#toc a');
    if (!links.length || !('IntersectionObserver' in window)) return;
    spyIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle('on', l.getAttribute('data-toc') === en.target.id); });
      });
    }, { rootMargin: '-15% 0px -70% 0px' });
    HS.$$('#artBody h2[id],#artBody h3[id]').forEach(function (h) { spyIO.observe(h); });
  }

  /* ── 搜索 ── */
  function plain(html) { return String(html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
  function snippet(text, q) {
    var i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return HS.esc(text.slice(0, 120)) + (text.length > 120 ? '…' : '');
    var start = Math.max(0, i - 45);
    var seg = HS.esc(text.slice(start, start + 150));
    return (start > 0 ? '…' : '') +
      seg.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>') + '…';
  }
  function renderSearch(q) {
    query = q;
    $('#viewHome').hidden = true;
    $('#viewArticle').hidden = true;
    $('#viewSearch').hidden = false;
    $('#tocBlock').hidden = true;
    var res = ARTICLES.map(function (a) {
      var text = plain(a.content);
      var inTitle = a.title.toLowerCase().indexOf(q.toLowerCase()) > -1;
      var inMeta = (a.chapter + a.section + a.category).toLowerCase().indexOf(q.toLowerCase()) > -1;
      var inBody = text.toLowerCase().indexOf(q.toLowerCase()) > -1;
      if (!inTitle && !inMeta && !inBody) return null;
      return { a: a, score: (inTitle ? 3 : 0) + (inMeta ? 1 : 0) + (inBody ? 1 : 0), text: text };
    }).filter(Boolean).sort(function (x, y) { return y.score - x.score; });

    $('#searchInfo').textContent = '“' + q + '” 命中 ' + res.length + ' 条';
    $('#searchRes').innerHTML = res.length ? res.map(function (r) {
      return '<a class="sr-item" href="#/' + encodeURIComponent(r.a.id) + '">' +
        '<div class="sr-title">' + HS.esc(r.a.title) + '</div>' +
        '<div class="sr-path">' + HS.esc(r.a.chapter) + ' › ' + HS.esc(r.a.section) + ' › ' + HS.esc(r.a.category) + '</div>' +
        '<div class="sr-snip">' + snippet(r.text, q) + '</div></a>';
    }).join('') : '<div class="empty"><span class="ic">🔍</span><div class="t">没有找到相关条目</div><div class="s">换个关键词试试</div></div>';
    renderTree();
  }

  /* ── 路由 ── */
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (!h) { renderHome(); return; }
    if (/^h-\d+$/.test(h)) return;   // 目录锚点
    renderArticle(h);
  }

  /* ── 阅读进度 ── */
  function updateProgress() {
    if ($('#viewArticle').hidden) { $('#progress').style.width = '0'; return; }
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    $('#progress').style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
  var rafPend = false;
  window.addEventListener('scroll', function () {
    if (rafPend) return;
    rafPend = true;
    requestAnimationFrame(function () {
      rafPend = false;
      updateProgress();
      var top = document.getElementById('topbar');
      if (top) top.classList.toggle('scrolled', window.scrollY > 4);
    });
  }, { passive: true });

  /* ── 交互 ── */
  $('#tree').addEventListener('click', function (e) {
    var th = e.target.closest('[data-toggle]');
    if (th) {
      var key = th.getAttribute('data-toggle');
      var node = th.parentNode;
      setOpen(key, node.classList.toggle('open'));
      return;
    }
    if (e.target.closest('.art-link') && window.innerWidth <= 980) document.body.classList.remove('sb-open');
  });
  $('#toc').addEventListener('click', function (e) {
    if (e.target.closest('a') && window.innerWidth <= 980) document.body.classList.remove('sb-open');
  });
  $('#btnCollapse').addEventListener('click', function () {
    HS.$$('#tree .node').forEach(function (n) { n.classList.remove('open'); setOpen(n.getAttribute('data-key'), false); });
  });
  $('#menuBtn').addEventListener('click', function () { document.body.classList.toggle('sb-open'); });
  $('#scrim').addEventListener('click', function () { document.body.classList.remove('sb-open'); });

  function randomArticle() {
    if (!ARTICLES.length) { HS.toast('还没有条目', { icon: '📭' }); return; }
    var a = ARTICLES[Math.floor(Math.random() * ARTICLES.length)];
    location.hash = '#/' + encodeURIComponent(a.id);
  }
  $('#btnRandom').addEventListener('click', randomArticle);

  /* 字号 */
  var fsList = ['s', 'm', 'l'];
  var fs = HS.store.get(K_FS, 'm');
  function applyFs(v) {
    fs = v;
    HS.store.set(K_FS, v);
    document.body.setAttribute('data-fs', v);
    $('#fsBtn').style.opacity = v === 'm' ? '' : '1';
  }
  $('#fsBtn').addEventListener('click', function () {
    var i = fsList.indexOf(fs);
    applyFs(fsList[(i + 1) % fsList.length]);
    HS.toast('字号：' + ({ s: '小', m: '中', l: '大' })[fs]);
  });

  /* 搜索框 */
  var qEl = $('#q');
  var searchTimer = null;
  qEl.addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(searchTimer);
    if (!v) { route(); return; }
    searchTimer = setTimeout(function () { renderSearch(v); }, 120);
  });

  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement.tagName;
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
      e.preventDefault(); document.body.classList.toggle('sb-open');
    }
    if (e.key === 'Escape') {
      if (document.activeElement === qEl) { qEl.value = ''; qEl.blur(); route(); }
      document.body.classList.remove('sb-open');
    }
  });

  /* ── 启动 ── */
  applyFs(fs);
  window.addEventListener('hashchange', route);

  HS.data('wiki-data')
    .then(function (data) {
      ARTICLES = norm(data);
      buildTree();
      $('#viewLoading').hidden = true;
      $('#dataState').textContent = '已同步';
      route();
      HS.palette.init({
        actions: [{ icon: '🎲', title: '随机条目', desc: '随便翻一条看看', run: randomArticle }],
        source: function () {
          return ARTICLES.map(function (a) {
            return { icon: '📄', title: a.title, desc: a.chapter + ' › ' + a.section, group: 'Wiki 条目', href: '#/' + encodeURIComponent(a.id) };
          });
        }
      });
    })
    .catch(function () {
      $('#viewLoading').innerHTML = '<div class="empty"><span class="ic">⚠️</span><div class="t">Wiki 数据加载失败</div>' +
        '<div class="s">请检查网络，或稍后刷新重试</div>' +
        '<button class="btn sm" onclick="location.reload()" style="margin-top:12px">🔄 重试</button></div>';
      $('#dataState').textContent = '离线模式';
    });

  HS.status.mount(HS.dataURL('wiki-data'));
})();
</script>
</body>
</html>
