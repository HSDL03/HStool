<!DOCTYPE html>
<html lang="zh-CN" data-theme="cn-red">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>国庆福利</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<script>
(function(){try{document.documentElement.setAttribute('data-theme','cn-red');localStorage.setItem('wiki-theme','cn-red');}catch(e){}})();
</script>
<style>
:root,[data-theme="cn-red"]{
  --bg:#fff8f0;--bg2:#ffefe0;--bg3:#ffdcc8;--text:#2a0a08;--muted:#8a4a40;
  --bd:#e0a898;--bd2:#8a2018;--ac:#c8102e;--acs:#ffe0e0;
  --ok:#2d7a2d;--warn:#b08800;--dgr:#a02020;
  --r:2px;
  --bevel:inset -1px -1px 0 rgba(138,32,24,.15),inset 1px 1px 0 rgba(255,255,255,.8);
  --bevel-in:inset 1px 1px 0 rgba(138,32,24,.15),inset -1px -1px 0 rgba(255,255,255,.8);
  --font:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --blob1:rgba(200,16,46,.13);--blob2:rgba(255,80,60,.09);--blob3:rgba(255,180,120,.07);
  --grid:rgba(200,16,46,.04);
  --p1:200,16,46;--p2:255,80,60;--p3:255,180,120;--p4:180,30,20;
  --hero-grad:linear-gradient(135deg,#c8102e 0%,#ff5040 100%);
  --topbar-bg:linear-gradient(180deg,#e0202e,#a01020);
  --topbar-fg:#fff;--topbar-bd:#6a0810;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);transition:background-color .3s}
body{margin:0;padding-top:46px;background:transparent;color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:none;min-height:100vh}
body.touch-mode{cursor:auto}
body.touch-mode .cursor-follow{display:none!important}

.topbar{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--topbar-bg);color:var(--topbar-fg);border-bottom:2px solid var(--topbar-bd);z-index:50;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--topbar-fg);text-decoration:none;white-space:nowrap;cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.logo-icon{display:inline-block;font-size:16px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover .logo-icon{transform:rotate(-8deg) scale(1.08)}
.sp{flex:1}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;background:rgba(255,255,255,.15);border:none;border-radius:999px;font-family:inherit;font-size:12px;color:inherit;cursor:pointer;max-width:280px;overflow:hidden}
.user-chip:hover{background:rgba(255,255,255,.28)}
.user-chip .uc-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .uc-points{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;background:rgba(255,222,0,.9);color:#6a0810;border-radius:999px;font-weight:800;font-size:11px;font-variant-numeric:tabular-nums}
.user-chip .uc-level{display:inline-flex;align-items:center;padding:1px 8px;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;font-weight:800;font-size:11px;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.user-chip .uc-auto{display:inline-flex;align-items:center;padding:1px 6px;background:rgba(74,222,128,.9);color:#0f2a17;border-radius:999px;font-weight:800;font-size:10px}
.icon{display:grid;place-items:center;width:30px;height:30px;flex:none;font-size:14px;font-family:inherit;color:rgba(255,255,255,.85);background:transparent;border:none;border-radius:var(--r);cursor:pointer;transition:background .15s,color .15s,transform .2s}
.icon:hover{background:rgba(0,0,0,.2);color:#fff}
.icon:active{transform:scale(.92)}

.bg-decor{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform,opacity}
.b1{width:420px;height:420px;background:var(--blob1);top:-140px;left:-120px;animation:drift1 30s ease-in-out infinite}
.b2{width:480px;height:480px;background:var(--blob2);bottom:-180px;right:-160px;animation:drift2 36s ease-in-out infinite}
.b3{width:340px;height:340px;background:var(--blob3);top:38%;left:52%;animation:drift3 42s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);opacity:.85}50%{transform:translate(50px,50px) scale(1.08);opacity:1}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(-60px,-50px) scale(1.05);opacity:.95}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);opacity:.7}50%{transform:translate(-50%,-60px) scale(1.1);opacity:.9}}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 20%,transparent 75%)}
#particles{position:absolute;inset:0;width:100%;height:100%;display:block}

.cursor-follow{position:fixed;pointer-events:none;z-index:9999;width:22px;height:22px;transform:translate(-50%,-50%);opacity:0;transition:opacity .25s;mix-blend-mode:difference;will-change:left,top}
.cursor-follow::before,.cursor-follow::after{content:"";position:absolute;background:#fff}
.cursor-follow::before{left:50%;top:0;width:2px;height:22px;margin-left:-1px}
.cursor-follow::after{top:50%;left:0;height:2px;width:22px;margin-top:-1px}
.cursor-follow .cf-core{position:absolute;left:50%;top:50%;width:4px;height:4px;margin-left:-2px;margin-top:-2px;background:#fff}
body:hover .cursor-follow{opacity:.55}
.cursor-follow.hovering{transform:translate(-50%,-50%) rotate(45deg) scale(1.3);opacity:.9}
.cursor-follow.clicking{transform:translate(-50%,-50%) rotate(45deg) scale(0.75);opacity:1}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:32px 20px 80px}
.main-grid{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}

.shop-panel{position:sticky;top:70px;padding:0;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);overflow:hidden}
.shop-head{padding:10px 14px;background:linear-gradient(180deg,#e0202e,#a01020);color:#fff;font-size:13.5px;font-weight:800;text-shadow:1px 1px 0 rgba(0,0,0,.3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.shop-head .shop-points{font-size:11.5px;padding:2px 8px;background:rgba(255,222,0,.9);color:#6a0810;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums}
.shop-list{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.shop-empty{padding:24px 12px;text-align:center;font-size:12.5px;color:var(--muted)}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);transition:all .2s;font-family:inherit;color:inherit;cursor:pointer;text-align:left}
.shop-item:hover{border-color:var(--ac);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.06)}
.shop-item.cant-afford .shop-price{color:var(--dgr)}
.shop-icon{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:20px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r)}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:13.5px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.shop-desc{font-size:11px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;display:block}
.shop-price{flex:none;font-size:12.5px;font-weight:900;color:var(--ac);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:2px}
.shop-price::before{content:"⭐";font-size:11px}

.main-col{min-width:0}
.hero{text-align:center;padding:8px 0 20px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;margin-bottom:14px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
.hero-badge .dot{width:8px;height:8px;background:var(--ac);box-shadow:0 0 0 3px var(--acs);position:relative;animation:badgePulse 2s ease-out infinite}
@keyframes badgePulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.hero h1{margin:0 0 10px;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;line-height:1.12;letter-spacing:-.03em;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hero h1 .char{display:inline-block;opacity:0;transform:translateY(24px) rotate(-12deg) scale(.85);animation:charIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes charIn{60%{opacity:1}to{opacity:1;transform:none}}
.hero-sub{margin:0 auto;max-width:520px;font-size:13.5px;color:var(--muted);line-height:1.6}

.boost-display{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
.boost-num{font-size:clamp(2.8rem,6vw,4.4rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;background:var(--hero-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;transform-origin:center}
.boost-num.bump{animation:numBump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes numBump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.boost-label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* 升级面板 */
.upgrade-panel{margin:0 auto 18px;max-width:560px;padding:14px 16px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);display:flex;flex-direction:column;gap:10px}
.upgrade-panel[hidden]{display:none!important}
.up-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.up-lv{display:inline-flex;align-items:baseline;gap:6px;padding:4px 12px;background:var(--hero-grad);color:#fff;border-radius:999px;font-weight:900;text-shadow:1px 1px 0 rgba(0,0,0,.35);box-shadow:0 2px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.up-lv .lv-big{font-size:16px;letter-spacing:-.02em}
.up-lv .lv-max{font-size:11px;opacity:.75;font-weight:700}
.up-lv.pulse{animation:ldPulse .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes ldPulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.up-stats{font-size:12px;color:var(--muted);line-height:1.5;flex:1;min-width:0}
.up-stats b{color:var(--ac);font-weight:800}
.up-stats .p{color:var(--ok)}
.up-action{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#e0202e,#a01020);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.3);box-shadow:var(--bevel);transition:all .15s}
.up-action:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
.up-action:active:not(:disabled){transform:scale(.98)}
.up-action:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.up-action .up-action-price{display:inline-flex;align-items:center;gap:3px;padding:2px 10px;background:rgba(255,222,0,.9);color:#6a0810;border-radius:999px;font-weight:900;font-size:12.5px;text-shadow:none;font-variant-numeric:tabular-nums}
.up-action.purchased{background:linear-gradient(135deg,#2d7a2d,#1f5a1f)}
.up-action.purchased .up-action-price{background:rgba(255,255,255,.35);color:#fff}

.progress-section{width:100%;margin-bottom:22px}
.progress-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg2);border:2px dashed var(--bd2);border-radius:var(--r)}
.progress-card{padding:18px 22px 16px;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel)}
.progress-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.progress-title{font-size:12.5px;font-weight:800;color:var(--text);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.progress-zoom-btns{display:inline-flex;gap:3px;margin-left:4px}
.progress-zoom-btns button{width:22px;height:22px;display:grid;place-items:center;font-family:inherit;font-size:14px;font-weight:800;color:var(--ac);background:var(--bg);border:1px solid var(--bd2);border-radius:3px;cursor:pointer;transition:all .15s;padding:0}
.progress-zoom-btns button:hover{background:var(--acs)}
.progress-zoom-btns button:active{transform:scale(.92)}
.progress-zoom-btns button:disabled{opacity:.35;cursor:not-allowed}
.progress-zoom-info{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-count{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.progress-count .progress-current{color:var(--ac)}

.progress-zoom-viewport{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab;scrollbar-width:thin}
.progress-zoom-viewport.dragging{cursor:grabbing}
.progress-zoom-viewport::-webkit-scrollbar{height:8px}
.progress-zoom-viewport::-webkit-scrollbar-track{background:var(--bg3);border-radius:4px}
.progress-zoom-viewport::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.progress-zoom-content{position:relative;min-width:100%;transition:width .2s ease;will-change:width}

.progress-bar-labels{position:relative;height:38px;margin-bottom:4px}
.milestone-label{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 6px;background:var(--bg2);border:1px solid var(--bd);border-radius:3px;font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:1.15;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.milestone-label .ml-name{color:var(--text);font-weight:800;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.milestone-label .ml-value{font-size:9px;opacity:.7;font-variant-numeric:tabular-nums}
.milestone-label.done{border-color:var(--ok);background:#e8f5e8;box-shadow:0 0 8px rgba(45,122,45,.25)}
.milestone-label.done .ml-name{color:var(--ok)}
.milestone-label.done .ml-value{color:var(--ok);opacity:1}
.milestone-label.done .ml-name::after{content:" ✓";font-weight:900}

.progress-bar-wrap{position:relative;height:26px}
.progress-bar-track{position:absolute;inset:0;background:var(--bg3);border-radius:var(--r);box-shadow:inset 0 0 0 2px var(--bd2);overflow:hidden}
.progress-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#e0202e 0%,#ff5040 50%,#ffde00 100%);border-radius:1px;transition:width .8s cubic-bezier(.34,1.56,.64,1);will-change:width}
.progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.4) 50%,transparent 100%);background-size:200% 100%;animation:progressShine 2s linear infinite}
@keyframes progressShine{0%{background-position:200% 0}100%{background-position:-200% 0}}

.progress-bar-marks{position:absolute;inset:0;pointer-events:none}
.minor-tick{position:absolute;top:50%;width:1px;height:8px;margin-top:-4px;background:rgba(138,32,24,.22);transform:translateX(-.5px)}
.minor-tick.major{height:14px;margin-top:-7px;background:rgba(138,32,24,.35)}
.milestone-tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(138,32,24,.28);transform:translateX(-1px);z-index:1;transition:background .3s}
.milestone-tick.done{background:rgba(255,255,255,.85);box-shadow:0 0 6px rgba(255,255,255,.5)}
.milestone-dot{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);background:var(--bg2);border:2px solid var(--bd2);border-radius:50%;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:2;box-shadow:0 0 0 2px var(--bg2)}
.milestone-dot.done{background:#1a7f37;border-color:#0f5a23;box-shadow:0 0 0 2px var(--bg2),0 0 12px rgba(26,127,55,.7)}

.progress-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted);gap:12px}
.progress-footer .progress-percent{font-weight:900;color:var(--ac);font-variant-numeric:tabular-nums;font-size:16px;flex:none}
.progress-footer .progress-remain{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.progress-footer .progress-remain strong{color:var(--ac);font-weight:800}
.progress-footer.all-done .progress-percent{color:var(--ok)}
.progress-footer.all-done .progress-remain strong{color:var(--ok)}

.action-area{display:flex;align-items:center;justify-content:center;padding:0 0 32px}
.action-btn{position:relative;display:inline-flex;align-items:center;gap:14px;padding:18px 48px;font-family:inherit;font-size:18px;font-weight:900;letter-spacing:.04em;color:#fff;background:linear-gradient(135deg,#e0202e 0%,#c8102e 50%,#a01020 100%);border:3px solid var(--bd2);border-radius:var(--r);cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.35);overflow:hidden;isolation:isolate;box-shadow:3px 3px 0 rgba(0,0,0,.3),0 0 24px rgba(200,16,46,.45);transition:border-color .25s,color .25s,filter .25s}
.action-btn .pulse-ring{position:absolute;inset:-3px;border:2px solid var(--ac);border-radius:var(--r);pointer-events:none;animation:pulseRingOut 2.4s ease-out infinite;z-index:-1}
.action-btn .pulse-ring.delay{animation-delay:1.2s}
.action-btn.cooling .pulse-ring{animation-play-state:paused;opacity:0}
@keyframes pulseRingOut{0%{transform:scale(1);opacity:.85}80%{opacity:0}100%{transform:scale(1.55);opacity:0}}
.action-btn::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,240,180,.7) 48%,rgba(255,222,0,.9) 50%,rgba(255,240,180,.7) 52%,transparent 70%);transform:translateX(-140%) skewX(-12deg);pointer-events:none;z-index:2;opacity:0}
.action-btn:hover:not(.cooling)::after{opacity:1;animation:shineSweep .85s cubic-bezier(.22,1,.36,1) forwards}
@keyframes shineSweep{0%{transform:translateX(-140%) skewX(-12deg)}100%{transform:translateX(140%) skewX(-12deg)}}
.action-btn .card-glow{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,0,.55) 0%,rgba(255,120,80,.25) 35%,transparent 70%);pointer-events:none;opacity:0;transition:opacity .35s;transform:translate(-50%,-50%);z-index:0}
.action-btn .cooldown-mask{position:absolute;inset:0;border-radius:calc(var(--r) - 1px);background:conic-gradient(transparent var(--cd,0deg),rgba(0,0,0,.62) var(--cd,0deg));opacity:0;transition:opacity .18s;pointer-events:none;z-index:6}
.action-btn.cooling .cooldown-mask{opacity:1}
.action-btn .btn-icon{position:relative;z-index:3;font-size:22px;line-height:1;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.action-btn:hover:not(.cooling) .btn-icon{transform:rotate(-12deg) scale(1.18)}
.action-btn .btn-text{position:relative;z-index:3}
.action-btn:hover:not(.cooling){border-color:#ffde00;box-shadow:3px 3px 0 rgba(0,0,0,.35),0 0 48px rgba(255,222,0,.65)}
.action-btn.cooling{cursor:not-allowed;filter:saturate(.75) brightness(.88)}
.action-btn.auto-running{box-shadow:3px 3px 0 rgba(0,0,0,.35),0 0 0 3px rgba(74,222,128,.4),0 0 32px rgba(74,222,128,.6)}
.card-ripple{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,0,.7) 0%,rgba(255,150,80,.35) 40%,rgba(255,222,0,0) 72%);transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:4;animation:cardRipple .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes cardRipple{0%{transform:translate(-50%,-50%) scale(0);opacity:.95}100%{transform:translate(-50%,-50%) scale(28);opacity:0}}
.card-ring{position:absolute;width:22px;height:22px;border:2px solid #ffde00;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:5;box-shadow:0 0 18px rgba(255,222,0,.85);animation:cardRing .72s cubic-bezier(.22,1,.36,1) forwards}
@keyframes cardRing{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
.action-btn .btn-inner{position:relative;z-index:3;display:flex;align-items:center;gap:14px;--press:1;transform:scale(var(--press));transition:transform .34s cubic-bezier(.34,1.56,.64,1);transform-origin:center}

.feed-panel{padding:0;background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:var(--bevel);overflow:hidden;margin-top:20px}
.feed-head{padding:10px 14px;background:linear-gradient(180deg,#e0202e,#a01020);color:#fff;font-size:13px;font-weight:800;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.feed-list{padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.feed-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);font-size:12.5px}
.feed-item .fi-icon{flex:none;font-size:16px;line-height:1}
.feed-item .fi-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-item .fi-user{font-weight:800;color:var(--ac)}
.feed-item .fi-game{font-weight:800;color:var(--ok)}
.feed-item .fi-time{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed-empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:100;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.show{opacity:1;visibility:visible}
.pnl{display:flex;flex-direction:column;width:100%;max-width:420px;max-height:calc(100vh - 32px);background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);box-shadow:3px 3px 0 rgba(0,0,0,.3);overflow:hidden;transform:translateY(16px) scale(.97);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.ov.show .pnl{transform:none}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid #6a0810;color:#fff;background:linear-gradient(180deg,#e0202e,#a01020);text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.ph strong{font-size:14px}
.ph .sp{flex:1}
.ph .icon{color:inherit}
.pb{padding:18px;overflow-y:auto}
.pf{padding:12px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--bd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--text);background:var(--bg);border:2px solid var(--bd2);border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn:hover:not(:disabled){background:var(--bg3)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{color:#fff;background:linear-gradient(135deg,#e0202e,#a01020);text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.btn.p:hover:not(:disabled){filter:brightness(1.08)}
.btn.d{color:var(--dgr);border-color:var(--dgr)}

.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld input{height:40px;padding:0 12px;font-family:inherit;font-size:15px;font-weight:600;color:var(--text);background:var(--bg2);border:2px solid var(--bd2);border-radius:var(--r);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.auth-tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin-bottom:14px}
.auth-tab{flex:1;padding:8px;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.auth-tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.auth-status{min-height:20px;font-size:12px;color:var(--muted);margin:4px 0 10px;text-align:left}
.auth-status.err{color:var(--dgr);font-weight:700}
.auth-status.ok{color:var(--ok);font-weight:700}

.theme-body{padding:14px;overflow-y:auto}

.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.theme-name{font-size:12.5px;font-weight:700}
.theme-desc{font-size:10.5px;color:var(--muted);margin-top:-3px}

.toast{position:fixed;left:50%;bottom:24px;max-width:calc(100vw - 32px);padding:10px 20px;font-size:13.5px;font-weight:700;color:#ffe0e0;background:#6a0810;border:2px solid #c8102e;border-radius:2px;box-shadow:2px 2px 0 rgba(0,0,0,.4);opacity:0;transform:translateX(-50%) translateY(20px);transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.status-pill{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--bg2);border:2px solid var(--bd2);border-radius:2px;box-shadow:var(--bevel);cursor:pointer;user-select:none;opacity:.85}
.status-pill:hover{opacity:1;transform:translateY(-2px);color:var(--text);border-color:var(--ac)}
.status-pill .sp-dot{width:8px;height:8px;background:var(--ok);box-shadow:0 0 0 2px rgba(45,122,45,.15)}
.status-pill.busy .sp-dot{background:var(--ac);box-shadow:0 0 0 2px var(--acs);animation:spPulse 1s infinite}
.status-pill.err .sp-dot{background:var(--dgr);box-shadow:0 0 0 2px rgba(160,32,32,.2)}
.status-pill .sp-text{white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:0}
.status-pill .sp-sep{opacity:.35;margin:0 6px}
.status-pill .sp-lat{color:var(--ac);font-weight:700;min-width:44px;text-align:left}
.status-pill.err .sp-lat{color:var(--dgr)}
@keyframes spPulse{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:900px){
  .main-grid{grid-template-columns:1fr;gap:18px}
  .shop-panel{position:static;top:auto}

  .up-action{font-size:12.5px;padding:8px 12px}
}
@media print{.status-pill,.bg-decor,.topbar,.ov,.toast,.cursor-follow,.action-btn{display:none}body{padding-top:0;cursor:auto}}
@media (prefers-reduced-motion:reduce){

  body{cursor:auto!important}
  .cursor-follow{display:none!important}
  .action-btn .pulse-ring{display:none}
}

(function(){

var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4ZHlyYWpic2pmdGR1ZXN2b3NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzkyMzksImV4cCI6MjEwNjA1NTIzOX0.ZEC7EohRqr0YCxqACBRTVI3-TGNFWUGxq-aH_yqIhig';
var T_BOOST='welfare_boost';

var COOLDOWN_MS=1000;

/* 等级机制 */
var MAX_LEVEL=1000;
var UPGRADE_BASE_PRICE=50;
var UPGRADE_MULTIPLIER=1.1;
var AUTO_CLICK_PRICE=120;
var AUTO_CLICK_INTERVAL=2000;

/* GitHub 存储的数据 */

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad2(n){return n<10?'0'+n:''+n;}
function fmtTime(ts){var d=new Date(ts);return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());}
function fmtRelTime(ts){
  var diff=Date.now()-Number(ts);
  if(diff<60000)return '刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+' 分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+' 小时前';

}
function loadJsonFromGitHub(filename){
  return fetch(RAW_BASE+filename+'?_='+Date.now(),{cache:'no-store'})

      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    });
}
var storage={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  del:function(k){try{localStorage.removeItem(k);return true;}catch(e){return false;}}
};

var toastEl=$('toast'),toastTimer=null;
function toast(msg){
  if(!toastEl)return;
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2400);

function hashPwd(pwd){
  return new Promise(function(resolve,reject){
    try{
      var buf=new TextEncoder().encode(String(pwd)+'::welfare_salt_v1');
      crypto.subtle.digest('SHA-256',buf).then(function(hash){
        var arr=new Uint8Array(hash);
        var hex='';
        for(var i=0;i<arr.length;i++)hex+=('0'+arr[i].toString(16)).slice(-2);
        resolve(hex);
      }).catch(reject);
    }catch(e){reject(e);}
  });
}

/* 等级归一化 */
function normalizeLevel(v){
  var n = parseInt(v, 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > MAX_LEVEL) n = MAX_LEVEL;
  return n;
}

/* 升级价格：从 level 升到 level+1 */
var _priceList = [0, UPGRADE_BASE_PRICE];
function upgradePrice(level){
  if(level >= MAX_LEVEL) return Infinity;
  while(_priceList.length <= level){
    var last = _priceList[_priceList.length - 1];
    _priceList.push(Math.ceil(last * UPGRADE_MULTIPLIER));
  }
  return _priceList[level];
}

var currentUser=null;
function loadUserSession(){
  try{
    var raw=storage.get('welfare-user');
    if(!raw)return;
    var o=JSON.parse(raw);
    if(o&&o.username){
      currentUser={
        username:o.username,
        points:Number(o.points)||0,
        clickLevel:normalizeLevel(o.clickLevel),
        autoClickUnlocked:!!o.autoClickUnlocked
      };
    }
  }catch(e){}
}
function saveUserSession(){
  if(!currentUser){storage.del('welfare-user');return;}
  storage.set('welfare-user',JSON.stringify(currentUser));
}
function renderUserChip(){
  var chip=$('userChip'),btn=$('authBtn');
  if(currentUser){
    var lv = normalizeLevel(currentUser.clickLevel);
    chip.style.display='';
    btn.style.display='none';
    $('ucName').textContent=currentUser.username;
    $('ucLevel').textContent='Lv.'+lv;
    $('ucPointsNum').textContent=String(currentUser.points);
    $('ucAuto').hidden = !currentUser.autoClickUnlocked;
    $('shopPoints').textContent='⭐ '+currentUser.points;
  }else{
    chip.style.display='none';
    btn.style.display='';
    $('shopPoints').textContent='⭐ 未登录';
  }
  renderUpgradePanel();
  renderShop();
}

/* 升级面板渲染 */
function renderUpgradePanel(){
  var panel=$('upgradePanel');
  if(!panel)return;
  if(!currentUser){panel.hidden=true;return;}
  panel.hidden=false;

  var lv = normalizeLevel(currentUser.clickLevel);
  var price = upgradePrice(lv);

  $('upLevel').textContent = String(lv);
  $('upGain').textContent = String(lv);
  $('upGainP').textContent = String(lv);

  var btn = $('upgradeBtn');
  var priceEl = $('upPrice');
  if(lv >= MAX_LEVEL){
    btn.disabled = true;
    priceEl.textContent = '已满级';
  }else{
    priceEl.textContent = String(price);
    btn.disabled = currentUser.points < price;
  }

  var autoBtn = $('autoBtn');
  var autoLabel = $('autoBtnLabel');
  var autoPrice = $('autoBtnPrice');
  if(currentUser.autoClickUnlocked){
    autoLabel.textContent = '🤖 自动点击已开启';
    autoPrice.textContent = '运行中';
    autoBtn.classList.add('purchased');
    autoBtn.disabled = true;

var zoomLevel=1;
var ZOOM_MIN=1,ZOOM_MAX=5,ZOOM_STEP=0.3;

function applyZoom(){
  var content=$('progressZoomContent');
  var info=$('progressZoomInfo');
  var minus=$('progressZoomMinus');
  var plus=$('progressZoomPlus');
  if(!content)return;
  content.style.width=(zoomLevel*100)+'%';
  if(info)info.textContent=Math.round(zoomLevel*100)+'%';
  if(minus)minus.disabled=zoomLevel<=ZOOM_MIN+0.01;
  if(plus)plus.disabled=zoomLevel>=ZOOM_MAX-0.01;
}
function setupZoomControls(){
  var minus=$('progressZoomMinus'),plus=$('progressZoomPlus');
  if(minus)minus.addEventListener('click',function(){zoomLevel=Math.max(ZOOM_MIN,zoomLevel-ZOOM_STEP);applyZoom();});
  if(plus)plus.addEventListener('click',function(){zoomLevel=Math.min(ZOOM_MAX,zoomLevel+ZOOM_STEP);applyZoom();});
}
function setupWheelZoom(){
  var vp=$('progressZoomViewport');if(!vp)return;
  vp.addEventListener('wheel',function(e){
    e.preventDefault();
    var dir=e.deltaY<0?1:-1;
    var oldZoom=zoomLevel;
    zoomLevel=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoomLevel+dir*0.15));
    if(zoomLevel!==oldZoom){
      var rect=vp.getBoundingClientRect();
      var mx=(e.clientX-rect.left+vp.scrollLeft)/vp.scrollWidth;
      applyZoom();
      requestAnimationFrame(function(){
        vp.scrollLeft=mx*vp.scrollWidth-(e.clientX-rect.left);
      });
    }
  },{passive:false});
}
function setupTouchZoom(){
  var vp=$('progressZoomViewport');if(!vp)return;
  var pinchStartDist=0,pinchStartZoom=1,dragging=false,dragStartX=0,dragStartScroll=0;
  vp.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      pinchStartDist=Math.sqrt(dx*dx+dy*dy);
      pinchStartZoom=zoomLevel;
      dragging=false;
    }else if(e.touches.length===1){
      dragging=true;dragStartX=e.touches[0].clientX;dragStartScroll=vp.scrollLeft;
      vp.classList.add('dragging');
    }
  },{passive:true});
  vp.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&pinchStartDist>0){
      e.preventDefault();
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      var dist=Math.sqrt(dx*dx+dy*dy);
      zoomLevel=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,pinchStartZoom*(dist/pinchStartDist)));
      applyZoom();
    }else if(dragging&&e.touches.length===1){
      vp.scrollLeft=dragStartScroll-(e.touches[0].clientX-dragStartX);
    }
  },{passive:false});
  vp.addEventListener('touchend',function(e){
    if(e.touches.length<2)pinchStartDist=0;
    if(e.touches.length===0){dragging=false;vp.classList.remove('dragging');}
  },{passive:true});
}

  var maxTarget=parseInt(targets[targets.length-1].value,10)||1;
  if(maxTarget<1)maxTarget=1;

  var nextTarget=null;
  for(var i=0;i<targets.length;i++){
    var tv=parseInt(targets[i].value,10)||0;
    if(tv>0&&totalBoost<tv){nextTarget=targets[i];break;}

  var minorTicksHtml='';

  });

    +'<div class="progress-header">'
    +  '<span class="progress-title">助力进度'
    +    '<span class="progress-zoom-btns">'

    +      '<button type="button" id="progressZoomPlus" title="放大">+</button>'
    +    '</span>'
    +    '<span class="progress-zoom-info" id="progressZoomInfo">100%</span>'
    +  '</span>'
    +  '<span class="progress-count"><span class="progress-current">'+totalBoost+'</span> / '+maxTarget+'</span>'
    +'</div>'
    +'<div class="progress-zoom-viewport" id="progressZoomViewport">'
    +  '<div class="progress-zoom-content" id="progressZoomContent">'
    +    '<div class="progress-bar-labels">'+labelsHtml+'</div>'
    +    '<div class="progress-bar-wrap">'
    +      '<div class="progress-bar-track"><div class="progress-fill" style="width:'+overallPct+'%"></div></div>'
    +      '<div class="progress-bar-marks">'+minorTicksHtml+marksHtml+'</div>'
    +    '</div>'
    +  '</div>'
    +'</div>'
    +'<div class="progress-footer'+footerCls+'">'

    +  '<span class="progress-remain">'+footerText+'</span>'

  zoomLevel=prevZoom;

/* 求助力总和：用 rpc sum(amount) */
function fetchTotalBoost(){
  if(!sb)return Promise.resolve(0);
  return sb.rpc('welfare_boost_total').then(function(res){
    if(res.error){
      /* 回退：如果 rpc 不存在，用 count */
      console.warn('[ful] rpc 失败，回退到 count', res.error);
      return sb.from(T_BOOST).select('*',{count:'exact',head:true}).then(function(r){
        return typeof r.count === 'number' ? r.count : 0;
      });
    }
    var data = res.data;
    if(Array.isArray(data) && data.length > 0){
      var row = data[0];
      if(typeof row === 'object' && row !== null){
        return Number(row.total) || 0;
      }
      return Number(row) || 0;
    }
    return 0;
  }).catch(function(){return 0;});
}

/* 冷却 */
function startCooldown(){
  cooling=true;
  if(actionBtn)actionBtn.classList.add('cooling');
  var mask=actionBtn?actionBtn.querySelector('.cooldown-mask'):null;
  var startAt=performance.now();
  function tick(now){
    var p=Math.min(1,(now-startAt)/COOLDOWN_MS);
    if(mask)mask.style.setProperty('--cd',(p*360).toFixed(1)+'deg');
    if(p<1){requestAnimationFrame(tick);}
    else{
      cooling=false;
      if(actionBtn)actionBtn.classList.remove('cooling');
      if(mask)mask.style.setProperty('--cd','0deg');
    }
  }
  requestAnimationFrame(tick);
}

/* 助力 */
function doBoost(){
  if(cooling)return;
  if(!sb){toast('连接未初始化');return;}

  var lv = currentUser ? normalizeLevel(currentUser.clickLevel) : 1;
  var boostGain = lv;

  startCooldown();

  totalBoost += boostGain;
  boostLoaded = true;
  renderBoost();
  renderProgress();
  bumpNumber();

  /* 10% 概率暴击获得个人点 */
  var gainedPoints = 0;
  if(currentUser && Math.random() < POINT_CRIT_RATE){
    gainedPoints = lv;
    currentUser.points += gainedPoints;
    saveUserSession();
    renderUserChip();
  }

  /* 写记录 */
  sb.from(T_BOOST).insert({
    uid: currentUser ? currentUser.username : ('guest_' + Date.now()),
    amount: boostGain,
    created_at: Date.now()
  }).then(function(res){
    if(res.error){
      /* 回滚 */
      totalBoost = Math.max(0, totalBoost - boostGain);
      if(currentUser && gainedPoints > 0){
        currentUser.points = Math.max(0, currentUser.points - gainedPoints);
        saveUserSession();
        renderUserChip();
      }
      renderBoost();
      renderProgress();
      spSetErr();
      toast('助力失败');
      return;
    }
    spSetOK();

    /* 更新用户点数 */
    if(currentUser && gainedPoints > 0){
      sb.from(T_USERS).update({points: currentUser.points}).eq('username', currentUser.username).then(function(r){
        if(r.error)console.warn('[ful] 更新点数失败', r.error);
      });
    }

    /* 提示 */
    if(currentUser){
      if(gainedPoints > 0){
        toast('💪 +' + boostGain + ' 助力 · 暴击 +' + gainedPoints + ' 个人点！');
      }else{
        toast('💪 +' + boostGain + ' 助力');
      }
    }else{
      toast('感谢助力 +' + boostGain);
    }

    setTimeout(refreshAll, 400);
  }).catch(function(){
    totalBoost = Math.max(0, totalBoost - boostGain);
    if(currentUser && gainedPoints > 0){
      currentUser.points = Math.max(0, currentUser.points - gainedPoints);
      saveUserSession();
      renderUserChip();
    }
    renderBoost();
    renderProgress();
    toast('助力失败：网络异常');
  });
}

/* 升级 */
function doUpgrade(){
  if(!currentUser){toast('请先登录');openAuth();return;}
  var lv = normalizeLevel(currentUser.clickLevel);
  if(lv >= MAX_LEVEL){toast('已满级');return;}
  var price = upgradePrice(lv);
  if(currentUser.points < price){toast('个人点不足（需要 ' + price + '）');return;}

  var newPoints = currentUser.points - price;
  var newLevel = lv + 1;

  $('upgradeBtn').disabled = true;

  sb.from(T_USERS).update({
    points: newPoints,
    click_level: newLevel
  }).eq('username', currentUser.username).then(function(res){
    if(res.error){
      toast('升级失败：' + res.error.message);
      renderUpgradePanel();
      return;
    }
    currentUser.points = newPoints;
    currentUser.clickLevel = newLevel;
    saveUserSession();
    renderUserChip();
    toast('🎉 升级到 Lv.' + newLevel);
    var badge = $('upLvBadge');
    if(badge){
      badge.classList.remove('pulse');
      void badge.offsetWidth;
      badge.classList.add('pulse');
    }
  }).catch(function(err){
    toast('升级失败：' + (err.message || '网络异常'));
    renderUpgradePanel();
  });
}

/* 解锁自动点击 */
function doUnlockAuto(){
  if(!currentUser){toast('请先登录');openAuth();return;}
  if(currentUser.autoClickUnlocked){toast('已解锁');return;}
  if(currentUser.points < AUTO_CLICK_PRICE){toast('个人点不足（需要 ' + AUTO_CLICK_PRICE + '）');return;}

  var newPoints = currentUser.points - AUTO_CLICK_PRICE;
  $('autoBtn').disabled = true;

  sb.from(T_USERS).update({
    points: newPoints,
    auto_click_unlocked: true
  }).eq('username', currentUser.username).then(function(res){
    if(res.error){
      toast('解锁失败：' + res.error.message);
      renderUpgradePanel();
      return;
    }
    currentUser.points = newPoints;
    currentUser.autoClickUnlocked = true;
    saveUserSession();
    renderUserChip();
    startAutoClick();
    toast('🚀 已解锁自动点击！每 2 秒自动助力一次');
  }).catch(function(err){
    toast('解锁失败：' + (err.message || '网络异常'));
    renderUpgradePanel();
  });
}

/* 自动点击循环 */
function startAutoClick(){
  if(autoClickTimer)return;
  if(!currentUser || !currentUser.autoClickUnlocked)return;
  if(actionBtn) actionBtn.classList.add('auto-running');
  autoClickTimer = setInterval(function(){
    if(document.hidden)return;
    if(cooling)return;
    if(!currentUser || !currentUser.autoClickUnlocked){
      stopAutoClick();
      return;
    }
    doBoost();
  }, AUTO_CLICK_INTERVAL);
}
function stopAutoClick(){
  if(autoClickTimer){clearInterval(autoClickTimer);autoClickTimer=null;}
  if(actionBtn) actionBtn.classList.remove('auto-running');
}

/* 订阅 */
var chan=null;
function subscribeAll(){
  if(!sb||chan)return;
  chan=sb.channel('welfare-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:T_BOOST},function(payload){
      var row=payload.new;if(!row)return;
      var amt = Number(row.amount) || 1;
      totalBoost += amt;
      boostLoaded=true;
      renderBoost();renderProgress();bumpNumber();
    })
    .on('postgres_changes',{event:'*',schema:'public',table:T_ORDERS},function(){refreshAll();})
    .on('postgres_changes',{event:'*',schema:'public',table:T_USERS},function(payload){
      var row=payload.new;
      if(row&&currentUser&&row.username===currentUser.username){
        currentUser.points=Number(row.points)||0;
        currentUser.clickLevel=normalizeLevel(row.click_level);
        currentUser.autoClickUnlocked=!!row.auto_click_unlocked;
        saveUserSession();
        renderUserChip();
        if(currentUser.autoClickUnlocked) startAutoClick();
        else stopAutoClick();
      }
    })
    .subscribe(function(status){
      if(status==='SUBSCRIBED'){spSetOK();}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        setTimeout(function(){
          try{if(chan)sb.removeChannel(chan);}catch(e){}
          chan=null;subscribeAll();
        },5000);
      }
    });
}

  ring.className='card-ring';ring.style.left=relX+'px';ring.style.top=relY+'px';
  el.appendChild(ring);
  setTimeout(function(){if(ring.parentNode)ring.parentNode.removeChild(ring);},760);
  inner.style.setProperty('--press','0.93');
  clearTimeout(el.__pressT1);clearTimeout(el.__pressT2);
  el.__pressT1=setTimeout(function(){
    inner.style.setProperty('--press','1.06');
    el.__pressT2=setTimeout(function(){inner.style.setProperty('--press','1');},200);
  },100);
}

function onGlobalMouseMove(e){
  mouseX=e.clientX;mouseY=e.clientY;
  speedRing.tx=e.clientX;speedRing.ty=e.clientY;
  if(speedRing.cx<-1000){speedRing.cx=e.clientX;speedRing.cy=e.clientY;}
  if(matchMedia('(hover: none)').matches)return;
  if(boxesDirty)refreshCardBoxes();
  for(var i=0;i<cardBoxes.length;i++){
    var box=cardBoxes[i],el=box.el;
    var inside=(mouseX>box.left&&mouseX<box.right&&mouseY>box.top&&mouseY<box.bottom);
    if(inside){
      var rx=((mouseY-box.cy)/box.halfH)*-4;
      var ry=((mouseX-box.cx)/box.halfW)*4;
      el.style.setProperty('--rx',rx.toFixed(2)+'deg');
      el.style.setProperty('--ry',ry.toFixed(2)+'deg');
      el.style.setProperty('--sc','1.03');
      if(box.glow){box.glow.style.left=(mouseX-box.left)+'px';box.glow.style.top=(mouseY-box.top)+'px';box.glow.style.opacity='1';}
    }else{
      el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');
      el.style.setProperty('--sc','1');
      if(box.glow)box.glow.style.opacity='0';
    }
  }
}
function onGlobalMouseLeave(){
  for(var i=0;i<cardBoxes.length;i++){
    var el=cardBoxes[i].el;
    el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg');
    el.style.setProperty('--sc','1');
    if(cardBoxes[i].glow)cardBoxes[i].glow.style.opacity='0';
  }
}

document.addEventListener('mousedown',function(e){
  if(e.button!==0)return;
  if(matchMedia('(hover: none)').matches)return;
  if(boxesDirty)refreshCardBoxes();
  for(var i=0;i<cardBoxes.length;i++){
    var box=cardBoxes[i];
    if(e.clientX>=box.left&&e.clientX<=box.right&&e.clientY>=box.top&&e.clientY<=box.bottom){
      playClickAnimation(box,e.clientX,e.clientY);
      var cf=$('cursorFollow');
      if(cf){cf.classList.add('clicking');setTimeout(function(){cf.classList.remove('clicking');},160);}
      break;
    }
  }
});

function bindCursorFollow(){
  var cf=$('cursorFollow');if(!cf)return;
  if(matchMedia('(hover: none)').matches){document.body.classList.add('touch-mode');return;}
  var cx=window.innerWidth/2,cy=window.innerHeight/2,tx=cx,ty=cy;
  document.addEventListener('mousemove',function(e){tx=e.clientX;ty=e.clientY;});
  function loop(){cx+=(tx-cx)*0.22;cy+=(ty-cy)*0.22;cf.style.left=cx+'px';cf.style.top=cy+'px';requestAnimationFrame(loop);}
  loop();
  document.addEventListener('mouseleave',function(){cf.style.opacity='0';});
  document.addEventListener('mouseenter',function(){cf.style.opacity='';});
}

function splitHeroTitle(){
  var h1=$('heroTitle');if(!h1)return;
  var text=h1.textContent.trim();
  h1.textContent='';
  for(var i=0;i<text.length;i++){
    var span=document.createElement('span');
    span.className='char';
    span.textContent=text[i];
    span.style.animationDelay=(0.15+i*0.05)+'s';
    h1.appendChild(span);
  }
}

var particleCtx=null,particles=[],particleRunning=true,pW=0,pH=0,pDpr=1;
var themeColors=['200,16,46','255,80,60','255,180,120','180,30,20'];
var ATTRACT_RADIUS=160,ATTRACT_STRENGTH=0.10;

function readThemeColors(){
  var cs=getComputedStyle(document.documentElement);
  themeColors=[
    (cs.getPropertyValue('--p1')||'200,16,46').trim(),
    (cs.getPropertyValue('--p2')||'255,80,60').trim(),
    (cs.getPropertyValue('--p3')||'255,180,120').trim(),
    (cs.getPropertyValue('--p4')||'180,30,20').trim()
  ];
}
function initParticles(){
  var canvas=$('particles');if(!canvas||!canvas.getContext)return;
  particleCtx=canvas.getContext('2d');
  pDpr=Math.min(window.devicePixelRatio||1,2);
  resizeCanvas();readThemeColors();
  var count=Math.max(18,Math.min(40,Math.floor((pW*pH)/32000)));
  particles=[];
  for(var i=0;i<count;i++){
    particles.push({
      x:Math.random()*pW,y:Math.random()*pH,size:4+Math.random()*10,
      vx:(Math.random()-0.5)*0.42,vy:(Math.random()-0.5)*0.42,bx:0,by:0,
      rot:Math.random()*Math.PI*2,vr:(Math.random()-0.5)*0.014,
      alpha:0.12+Math.random()*0.28,alphaPhase:Math.random()*Math.PI*2,alphaSpeed:0.008+Math.random()*0.016,
      hueIdx:Math.floor(Math.random()*4),hueMix:Math.random(),glow:Math.random()<0.25
    });
  }
  if(particleRunning)drawParticles();
}
function resizeCanvas(){
  var canvas=$('particles');if(!canvas)return;
  pW=window.innerWidth;pH=window.innerHeight;
  canvas.width=pW*pDpr;canvas.height=pH*pDpr;
  canvas.style.width=pW+'px';canvas.style.height=pH+'px';
  if(particleCtx)particleCtx.setTransform(pDpr,0,0,pDpr,0,0);
}
function drawSquare(ctx,s,hs,r,g,b,a){
  var rad=Math.min(3,s/3.5);
  var grad=ctx.createLinearGradient(-hs,-hs,hs,hs);
  grad.addColorStop(0,'rgba('+r+','+g+','+b+','+a+')');
  grad.addColorStop(1,'rgba('+r+','+g+','+b+','+(a*0.3)+')');
  ctx.fillStyle=grad;ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(-hs,-hs,s,s,rad);else ctx.rect(-hs,-hs,s,s);
  ctx.fill();
}
function updateSpeedRing(){
  if(speedRing.cx<-1000&&speedRing.tx<-1000)return;
  var dx=speedRing.tx-speedRing.cx,dy=speedRing.ty-speedRing.cy;
  speedRing.cx+=dx*0.18;speedRing.cy+=dy*0.18;
  var dist=Math.sqrt(dx*dx+dy*dy);
  speedRing.speed=speedRing.speed*0.88+dist*0.12;
  speedRing.rot+=speedRing.speed*0.045;
  var t=Math.min(1,Math.max(0,(speedRing.speed-3)/25));
  speedRing.visible+=(t-speedRing.visible)*0.12;
}
function drawSpeedRing(ctx){
  if(speedRing.visible<0.02||speedRing.cx<-1000)return;
  var p1=themeColors[0]||'200,16,46';
  var n=12,radius=18+Math.min(speedRing.speed*1.1,22);
  var baseAlpha=speedRing.visible*0.9,rot=speedRing.rot;
  for(var i=0;i<n;i++){
    var angle=rot+(i/n)*Math.PI*2;
    var x=speedRing.cx+Math.cos(angle)*radius;
    var y=speedRing.cy+Math.sin(angle)*radius;
    var t=i/n;
    ctx.beginPath();ctx.arc(x,y,1.8+t*2.4,0,Math.PI*2);
    ctx.fillStyle='rgba('+p1+','+(baseAlpha*(0.2+0.8*t)).toFixed(3)+')';
    ctx.fill();
  }
}
function drawParticles(){
  if(!particleRunning||!particleCtx)return;
  if(boxesDirty)refreshCardBoxes();
  particleCtx.clearRect(0,0,pW,pH);
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var dxm=mouseX-p.x,dym=mouseY-p.y;
    var d2=dxm*dxm+dym*dym;
    if(d2<ATTRACT_RADIUS*ATTRACT_RADIUS&&d2>1){
      var dist=Math.sqrt(d2);
      var force=(1-dist/ATTRACT_RADIUS)*ATTRACT_STRENGTH;
      p.bx+=(dxm/dist)*force;p.by+=(dym/dist)*force;
    }
    p.bx*=0.93;p.by*=0.93;
    p.x+=p.vx+p.bx;p.y+=p.vy+p.by;p.rot+=p.vr;
    if(p.x<-60)p.x=pW+60;else if(p.x>pW+60)p.x=-60;
    if(p.y<-60)p.y=pH+60;else if(p.y>pH+60)p.y=-60;
    p.alphaPhase+=p.alphaSpeed;
    var a=p.alpha*(0.55+0.45*Math.sin(p.alphaPhase));
    a=Math.max(0.05,Math.min(0.6,a));
    var c1=(themeColors[p.hueIdx]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var c2=(themeColors[(p.hueIdx+1)%4]||themeColors[0]).split(',').map(function(n){return parseInt(n,10)||0;});
    var mix=p.hueMix;
    var r=Math.round(c1[0]*(1-mix)+c2[0]*mix);
    var g=Math.round(c1[1]*(1-mix)+c2[1]*mix);
    var b=Math.round(c1[2]*(1-mix)+c2[2]*mix);
    particleCtx.save();
    particleCtx.translate(p.x,p.y);particleCtx.rotate(p.rot);
    if(p.glow){particleCtx.shadowBlur=12;particleCtx.shadowColor='rgba('+r+','+g+','+b+','+(a*0.85)+')';}
    drawSquare(particleCtx,p.size,p.size/2,r,g,b,a);
    particleCtx.restore();
  }
  updateSpeedRing();
  drawSpeedRing(particleCtx);
  requestAnimationFrame(drawParticles);
}

var topbarEl=$('topbar'),rafPend=false;
function onScroll(){
  if(rafPend)return;rafPend=true;
  requestAnimationFrame(function(){
    var top=window.pageYOffset||document.documentElement.scrollTop||0;
    if(topbarEl)topbarEl.classList.toggle('scrolled',top>4);
    rafPend=false;
  });
}
var pinging=false;
function pingLatency(){
  var t0=Date.now();
  return fetch(SUPABASE_URL+'/rest/v1/'+T_BOOST+'?select=id&limit=1',{
    method:'HEAD',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},
    cache:'no-store'
  }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return Date.now()-t0;}).catch(function(){return -1;});
}
function doPing(){
  if(pinging||document.hidden)return;
  pinging=true;
  pingLatency().then(function(lat){pinging=false;spSetLat(lat);});
}

/* 认证 */
var authMode='login';
function setAuthStatus(text,cls){
  var el=$('authStatus');if(!el)return;
  el.textContent=text||'';el.className='auth-status'+(cls?' '+cls:'');
}
function openAuth(){
  if(currentUser){openAcct();return;}
  authMode='login';
  switchAuthMode('login');
  $('authName').value='';$('authPwd').value='';setAuthStatus('');
  $('authOv').classList.add('show');
  setTimeout(function(){try{$('authName').focus();}catch(e){}},80);
}
function closeAuth(){$('authOv').classList.remove('show');}
function switchAuthMode(m){
  authMode=m;
  $('tabLogin').classList.toggle('active',m==='login');
  $('tabRegister').classList.toggle('active',m==='register');
  $('authSubmit').textContent=m==='login'?'登录':'注册';
  setAuthStatus('');
}
function doAuth(){
  var name=($('authName').value||'').trim();
  var pwd=$('authPwd').value||'';
  if(!name){setAuthStatus('请输入用户名','err');return;}
  if(name.length>20){setAuthStatus('用户名最多 20 字','err');return;}
  if(!pwd||pwd.length<4){setAuthStatus('密码至少 4 位','err');return;}
  $('authSubmit').disabled=true;
  setAuthStatus('处理中…','');
  hashPwd(pwd).then(function(hash){
    if(authMode==='register'){
      sb.from(T_USERS).select('id').eq('username',name).maybeSingle().then(function(res){
        if(res.error){$('authSubmit').disabled=false;setAuthStatus('网络异常','err');return;}
        if(res.data){$('authSubmit').disabled=false;setAuthStatus('用户名已存在','err');return;}
        sb.from(T_USERS).insert({
          username:name,
          password_hash:hash,
          points:0,
          click_level:1,
          auto_click_unlocked:false,
          created_at:Date.now(),
          last_login:Date.now()
        }).then(function(ins){
          if(ins.error){$('authSubmit').disabled=false;setAuthStatus('注册失败：'+(ins.error.code==='23505'?'用户名已被占用':'网络错误'),'err');return;}
          currentUser={username:name,points:0,clickLevel:1,autoClickUnlocked:false};
          saveUserSession();renderUserChip();
          $('authSubmit').disabled=false;
          setAuthStatus('注册成功 ✓','ok');
          toast('欢迎，'+name);
          setTimeout(closeAuth,600);
        });
      });
    }else{
      sb.from(T_USERS).select('username,password_hash,points,click_level,auto_click_unlocked').eq('username',name).maybeSingle().then(function(res){
        if(res.error){$('authSubmit').disabled=false;setAuthStatus('网络异常','err');return;}
        if(!res.data){$('authSubmit').disabled=false;setAuthStatus('用户不存在','err');return;}
        if(res.data.password_hash!==hash){$('authSubmit').disabled=false;setAuthStatus('密码错误','err');return;}
        currentUser={
          username:res.data.username,
          points:Number(res.data.points)||0,
          clickLevel:normalizeLevel(res.data.click_level),
          autoClickUnlocked:!!res.data.auto_click_unlocked
        };
        saveUserSession();
        sb.from(T_USERS).update({last_login:Date.now()}).eq('username',name).then(function(){});
        renderUserChip();
        if(currentUser.autoClickUnlocked) startAutoClick();
        $('authSubmit').disabled=false;
        setAuthStatus('登录成功 ✓','ok');
        toast('欢迎回来，'+name);
        setTimeout(closeAuth,600);
      });
    }
  }).catch(function(){
    $('authSubmit').disabled=false;
    setAuthStatus('加密失败，请更换浏览器','err');
  });
}

function openAcct(){
  if(!currentUser)return;
  var lv = normalizeLevel(currentUser.clickLevel);
  $('acctName').textContent=currentUser.username;
  $('acctPoints').textContent=String(currentUser.points);
  $('acctLevel').textContent='Lv.'+lv+' · 每次 +'+lv+' 助力';
  $('acctAuto').textContent=currentUser.autoClickUnlocked?'已解锁 🤖':'未解锁';
  $('acctOv').classList.add('show');
}
function closeAcct(){$('acctOv').classList.remove('show');}
function doLogout(){
  stopAutoClick();
  currentUser=null;
  saveUserSession();
  renderUserChip();
  closeAcct();
  toast('已退出登录');
}

var buyingItem=null;
function openBuy(item){
  if(!currentUser){toast('请先登录');openAuth();return;}
  var price=parseInt(item.price,10)||0;
  if(currentUser.points<price){toast('个人点不足（需要 '+price+'）');return;}
  buyingItem=item;
  $('buyItemName').textContent=item.name;
  $('buyItemPrice').textContent=price;
  $('buyGameName').value='';
  $('buyStatus').textContent='';
  $('buyStatus').className='auth-status';
  $('buyOv').classList.add('show');
  setTimeout(function(){try{$('buyGameName').focus();}catch(e){}},80);
}
function closeBuy(){$('buyOv').classList.remove('show');buyingItem=null;}

function doBuy(){
  if(!buyingItem||!currentUser)return;
  var gameName=($('buyGameName').value||'').trim();
  if(!gameName){$('buyStatus').textContent='请输入游戏名';$('buyStatus').className='auth-status err';return;}
  if(gameName.length>30){$('buyStatus').textContent='游戏名过长';$('buyStatus').className='auth-status err';return;}
  var price=parseInt(buyingItem.price,10)||0;
  if(currentUser.points<price){$('buyStatus').textContent='个人点不足';$('buyStatus').className='auth-status err';return;}

  $('buyConfirm').disabled=true;
  $('buyStatus').textContent='处理中…';
  $('buyStatus').className='auth-status';

  var newPoints=currentUser.points-price;
  sb.from(T_USERS).update({points:newPoints}).eq('username',currentUser.username).then(function(res){
    if(res.error){
      $('buyConfirm').disabled=false;
      $('buyStatus').textContent='扣点失败：'+res.error.message;
      $('buyStatus').className='auth-status err';
      return;
    }
    currentUser.points=newPoints;
    saveUserSession();renderUserChip();
    sb.from(T_ORDERS).insert({
      username:currentUser.username,
      game_name:gameName,
      shop_id:String(buyingItem.id),
      shop_name:buyingItem.name,
      shop_icon:buyingItem.icon||'🎁',
      price:price,
      status:'pending',
      created_at:Date.now()
    }).then(function(ins){
      $('buyConfirm').disabled=false;
      if(ins.error){
        $('buyStatus').textContent='订单提交失败：'+ins.error.message;
        $('buyStatus').className='auth-status err';
        return;
      }
      $('buyStatus').textContent='购买成功 ✓ 等待管理员发放';
      $('buyStatus').className='auth-status ok';
      toast('购买成功，等待管理员发放');
      setTimeout(function(){closeBuy();refreshAll();},900);
    });
  }).catch(function(){
    $('buyConfirm').disabled=false;
    $('buyStatus').textContent='网络异常';
    $('buyStatus').className='auth-status err';
  });
}

function bind(){
  $('themeBtn').addEventListener('click',openTheme);
  $('themeClose').addEventListener('click',closeTheme);
  $('themeOv').addEventListener('click',function(e){if(e.target===this)closeTheme();});
  $('themeGrid').addEventListener('click',function(e){
    var card=e.target.closest('[data-theme-val]');if(!card)return;
    toast('🔒 主题已锁定为中国红');
  });

  $('authBtn').addEventListener('click',openAuth);
  $('userChip').addEventListener('click',openAcct);
  $('authClose').addEventListener('click',closeAuth);
  $('authCancel').addEventListener('click',closeAuth);
  $('authOv').addEventListener('click',function(e){if(e.target===this)closeAuth();});
  $('tabLogin').addEventListener('click',function(){switchAuthMode('login');});
  $('tabRegister').addEventListener('click',function(){switchAuthMode('register');});
  $('authSubmit').addEventListener('click',doAuth);
  $('authPwd').addEventListener('keydown',function(e){if(e.key==='Enter')doAuth();});

  $('acctClose').addEventListener('click',closeAcct);
  $('acctCancel').addEventListener('click',closeAcct);
  $('acctLogout').addEventListener('click',doLogout);
  $('acctOv').addEventListener('click',function(e){if(e.target===this)closeAcct();});

  $('buyClose').addEventListener('click',closeBuy);
  $('buyCancel').addEventListener('click',closeBuy);
  $('buyConfirm').addEventListener('click',doBuy);
  $('buyOv').addEventListener('click',function(e){if(e.target===this)closeBuy();});

  $('upgradeBtn').addEventListener('click',doUpgrade);
  $('autoBtn').addEventListener('click',doUnlockAuto);

  $('shopList').addEventListener('click',function(e){
    var item=e.target.closest('[data-shop-id]');
    if(!item)return;
    openBuy({
      id:item.getAttribute('data-shop-id'),
      name:item.getAttribute('data-shop-name'),
      icon:item.getAttribute('data-shop-icon'),
      price:parseInt(item.getAttribute('data-shop-price'),10)||0
    });
  });

  actionBtn.addEventListener('click',function(e){
    if(e.defaultPrevented)return;
    if(cooling)return;
    doBoost();
  });

  spPill.addEventListener('click',function(){doPing();refreshAll();refreshUser();});

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(themeOv.classList.contains('show'))closeTheme();
      else if($('authOv').classList.contains('show'))closeAuth();
      else if($('acctOv').classList.contains('show'))closeAcct();
      else if($('buyOv').classList.contains('show'))closeBuy();
    }
  });

  document.addEventListener('mousemove',onGlobalMouseMove,{passive:true});
  document.addEventListener('mouseleave',onGlobalMouseLeave);
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',function(){resizeCanvas();boxesDirty=true;},{passive:true});
  document.addEventListener('visibilitychange',function(){
    particleRunning=!document.hidden;
    if(particleRunning){drawParticles();doPing();refreshAll();}
  });
}

function boot(){
  loadUserSession();
  buildThemeGrid();
  initParticles();
  splitHeroTitle();
  bindCursorFollow();
  bind();
  onScroll();
  renderUserChip();
  applyZoom();

  if(currentUser && currentUser.autoClickUnlocked) startAutoClick();

  if(spTime)spTime.textContent=fmtTime(Date.now());
  setInterval(function(){if(spTime)spTime.textContent=fmtTime(Date.now());},1000);
  doPing();
  setInterval(doPing,3000);

  refreshAll();
  refreshUser();
  subscribeAll();
  startGitHubPolling();
  setTimeout(function(){boxesDirty=true;},300);
  setInterval(refreshAll,30000);
  setInterval(refreshUser,15000);
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
