<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fff;--panel:#f7f8fa;--card:#fff;--text:#16191d;--dim:#697386;
  --line:#e6e8ec;--accent:#3b6ef6;--accent-soft:#eef3ff;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
html[data-theme=dark]{
  --bg:#0e1116;--panel:#151a21;--card:#1a2029;--text:#e7eaf0;--dim:#8a94a6;
  --line:#242b36;--accent:#5b8cff;--accent-soft:#1a2438;
  --sh:0 1px 3px rgba(0,0,0,.5);
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

/* ---------- 顶栏 ---------- */
header{
  flex:none;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg);z-index:40;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:6px;display:block;
  background:linear-gradient(135deg,var(--accent),#8b5cf6)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{padding:4px 14px;border-radius:6px;font-size:13.5px;color:var(--dim);transition:.15s}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--sh);font-weight:600}
.search{flex:1;max-width:420px;position:relative}
.search input{
  width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);outline:none;transition:.15s;font-size:14px;
}
.search input:focus{border-color:var(--accent);background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;
  color:var(--dim);transition:.15s;flex:none}
.icon-btn:hover{background:var(--panel);color:var(--text)}
#menuBtn{display:none}

/* ---------- 布局 ---------- */
.layout{flex:1;display:flex;min-height:0}
aside{
  width:258px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:14px 10px;
}
main{flex:1;overflow-y:auto;padding:32px 36px}
.mask{position:fixed;inset:56px 0 0;background:rgba(0,0,0,.45);z-index:30;
  opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}

/* ---------- 侧边栏 ---------- */
.nav-group{margin-bottom:8px}
.nav-group>h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--dim);padding:8px 10px 4px;font-weight:600}
.nav-item{
  display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;
  font-size:14px;color:var(--dim);transition:.12s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.empty{color:var(--dim);font-size:13px;padding:12px 10px}

/* ---------- 文章 ---------- */
.article{max-width:820px;margin:0 auto}
.article h1{font-size:28px;margin-bottom:6px;letter-spacing:-.01em}
.article .sub{color:var(--dim);font-size:13px;margin-bottom:26px}
.article h2{font-size:19px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.article h3{font-size:16px;margin:20px 0 8px}
.article p{margin:10px 0}
.article ul,.article ol{margin:10px 0 10px 22px}
.article li{margin:4px 0}
.article code{background:var(--panel);border:1px solid var(--line);padding:1px 6px;
  border-radius:5px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.article pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;overflow-x:auto;margin:14px 0}
.article pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.6}
.article table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
.article th,.article td{border:1px solid var(--line);padding:8px 12px;text-align:left}
.article th{background:var(--panel);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;
  padding-top:20px;border-top:1px solid var(--line)}
.pager button{font-size:13.5px;color:var(--accent);padding:6px 12px;border-radius:8px;transition:.15s}
.pager button:hover{background:var(--accent-soft)}
.pager button:disabled{color:var(--dim);opacity:.5;cursor:default;background:none}

/* ---------- 下载站 ---------- */
.dl-head h1{font-size:26px;letter-spacing:-.01em}
.dl-head p{color:var(--dim);font-size:13.5px;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:20px 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{padding:5px 13px;border-radius:99px;font-size:13px;color:var(--dim);
  border:1px solid var(--line);background:var(--card);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select{padding:6px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);outline:none;font-size:13px;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.dl-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;display:flex;gap:14px;transition:.18s;box-shadow:var(--sh);
}
.dl-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.dl-icon{width:46px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:14px;color:#fff;letter-spacing:-.5px}
.dl-body{flex:1;min-width:0}
.dl-title{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-title span{font-size:11px;font-weight:600;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);padding:1px 6px;border-radius:5px;flex:none}
.dl-desc{font-size:13px;color:var(--dim);margin:5px 0 9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dl-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim)}
.dl-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.btn-dl{padding:7px 16px;border-radius:8px;background:var(--accent);color:#fff;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.15s}
.btn-dl:hover{opacity:.88}
.btn-dl:disabled{opacity:.6;cursor:default}
.sha-btn{font-size:11px;color:var(--dim);border:1px solid var(--line);
  padding:2px 7px;border-radius:5px;transition:.15s;white-space:nowrap}
.sha-btn:hover{color:var(--accent);border-color:var(--accent)}
.no-result{text-align:center;color:var(--dim);padding:60px 0;font-size:14px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:99px;
  font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.28s;z-index:100}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  #menuBtn{display:grid}
  .logo span{display:none}
  aside{position:fixed;top:56px;bottom:0;left:0;z-index:35;
    transform:translateX(-100%);transition:.25s;box-shadow:var(--sh)}
  aside.open{transform:none}
  main{padding:20px 18px}
  .grid{grid-template-columns:1fr}
  .search{max-width:none}
}
</style>
</head>

<p>一个零依赖的单文件知识库模板，把 HTML、CSS、JavaScript 全部塞进一个文件里，复制即可运行，也可以直接丢到 GitHub Pages、Vercel、Netlify 上。</p>
<h2>三个核心模块</h2>

<p>语义化标签让浏览器、搜索引擎和读屏软件都能理解页面结构，而不是只看到一堆 <code>div</code>。</p>
<h2>常用标签对照</h2>

<p>把选择器拆成四元组 <code>(a, b, c, d)</code>，从左到右比较，数值大的胜出。</p>
<table>
<tr><th>位置</th><th>来源</th><th>示例</th></tr>
<tr><td>a</td><td>行内样式</td><td><code>style="..."</code></td></tr>

<tr><td>d</td><td>元素 / 伪元素</td><td><code>div</code>、<code>::before</code></td></tr>
</table>
<h2>容易被忽略的点</h2>
<ul>
<li><code>:not()</code> 本身不计权重，但括号里的选择器照常计算。</li>
<li><code>!important</code> 不属于权重体系，它会直接跳到最高优先级。</li>
<li>权重相同时，后出现的规则覆盖先出现的。</li>
</ul>`
  },

    id: 'js-typeof', title: 'typeof 的历史遗留', cat: 'JavaScript', updated: '2024-01-16',
    body: `<h2>那个著名的 bug</h2>
<pre><code>typeof null        // "object"
typeof undefined   // "undefined"
typeof []          // "object"
typeof function(){} // "function"</code></pre>
<p><code>typeof null === "object"</code> 是 1995 年实现时的疏漏：当时用低位标记类型，对象的标记是 <code>000</code>，而 <code>null</code> 被表示为全零指针，于是被误判。这个 bug 因为兼容性原因一直保留至今。</p>
<h2>更可靠的判断方式</h2>
<pre><code>Object.prototype.toString.call([])      // "[object Array]"
Array.isArray([])                       // true
value === null                          // 判断 null 用全等</code></pre>`
  },
  {
    id: 'http-status', title: 'HTTP 状态码速查', cat: '网络', updated: '2024-01-18',
    body: `<h2>按语义分五类</h2>
<table>
<tr><th>区间</th><th>含义</th><th>常见例子</th></tr>
<tr><td>1xx</td><td>信息响应</td><td>101 Switching Protocols</td></tr>
<tr><td>2xx</td><td>成功</td><td>200 OK、204 No Content</td></tr>
<tr><td>3xx</td><td>重定向</td><td>301 永久、302 临时、304 未修改</td></tr>
<tr><td>4xx</td><td>客户端错误</td><td>400、401、403、404、429</td></tr>
<tr><td>5xx</td><td>服务端错误</td><td>500、502、503、504</td></tr>
</table>
<h2>301 和 302 怎么选</h2>
<p>域名永久迁移用 301，搜索引擎会转移权重；临时维护、A/B 测试用 302，不会影响原有排名。选错会导致 SEO 权重流失，且 301 会被浏览器长期缓存，改回来很麻烦。</p>`
  }

   ========================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtHits(n){
  return n >= 10000 ? (n / 10000).toFixed(1) + ' 万' : String(n);
}
let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}
function closeDrawer(){
  sideEl.classList.remove('open');
  $('#mask').classList.remove('on');
}

/* =========================================================
   路由
   ========================================================= */
function route(){
  const parts = location.hash.slice(1).split('/').filter(Boolean);
  if (parts[0] === 'downloads') {
    state.view = 'downloads';
  } else {
    state.view = 'wiki';
    if (parts[1] && articles.some(a => a.id === parts[1])) {
      state.articleId = parts[1];
    }
  }
  render();
}
function go(view, id){
  const target = view === 'downloads'
    ? '#/downloads'
    : '#/wiki/' + (id || state.articleId);
  if (location.hash === target) route();
  else location.hash = target;
}

/* =========================================================
   渲染：顶栏
   ========================================================= */
function renderHeader(){
  $('#segWiki').classList.toggle('on', state.view === 'wiki');
  $('#segDl').classList.toggle('on', state.view === 'downloads');
  const inp = $('#searchInput');
  inp.value = state.q;
  inp.placeholder = state.view === 'wiki' ? '搜索文章…' : '搜索软件…';

  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = dark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
}

/* =========================================================
   渲染：侧边栏
   ========================================================= */
function renderSidebar(){
  const q = state.q.trim().toLowerCase();

  if (state.view === 'wiki') {
    const groups = {};
    articles.forEach(a => {
      if (q && !(a.title.toLowerCase().includes(q) || a.body.toLowerCase().includes(q))) return;
      (groups[a.cat] = groups[a.cat] || []).push(a);
    });
    const keys = Object.keys(groups);
    if (!keys.length) {
      sideEl.innerHTML = '<div class="empty">没有匹配的文章</div>';
      return;
    }
    sideEl.innerHTML = keys.map(cat => `
      <div class="nav-group">
        <h4>${esc(cat)}</h4>
        ${groups[cat].map(a => `
          <button class="nav-item ${a.id === state.articleId ? 'on' : ''}"
                  data-article="${a.id}">${esc(a.title)}</button>
        `).join('')}
      </div>
    `).join('');
  } else {
    const cats = ['全部', ...new Set(downloads.map(d => d.cat))];
    const plats = ['全部', ...new Set(downloads.map(d => d.platform))];
    sideEl.innerHTML = `
      <div class="nav-group">
        <h4>分类</h4>
        ${cats.map(c => `<button class="nav-item ${c === state.cat ? 'on' : ''}"
          data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
      <div class="nav-group">
        <h4>平台</h4>
        ${plats.map(p => `<button class="nav-item ${p === state.platform ? 'on' : ''}"
          data-platform="${esc(p)}">${esc(p)}</button>`).join('')}
      </div>`;
  }
}

/* =========================================================
   渲染：内容区
   ========================================================= */
function renderMain(){
  if (state.view === 'wiki') renderArticle();
  else renderDownloads();
}

function renderArticle(){
  const idx = articles.findIndex(a => a.id === state.articleId);
  const a = articles[idx];
  if (!a) return;
  const prev = articles[idx - 1];
  const next = articles[idx + 1];

  mainEl.innerHTML = `
    <article class="article">
      <h1>${esc(a.title)}</h1>
      <div class="sub">${esc(a.cat)} · 更新于 ${esc(a.updated)}</div>
      ${a.body}
      <div class="pager">
        <button id="prevBtn" ${prev ? '' : 'disabled'}>← ${prev ? esc(prev.title) : '没有了'}</button>
        <button id="nextBtn" ${next ? '' : 'disabled'}>${next ? esc(next.title) : '没有了'} →</button>
      </div>
    </article>`;
  mainEl.scrollTop = 0;

  if (prev) $('#prevBtn').onclick = () => go('wiki', prev.id);
  if (next) $('#nextBtn').onclick = () => go('wiki', next.id);
}

function filteredDownloads(){
  const q = state.q.trim().toLowerCase();
  let list = downloads.filter(d => {
    if (state.cat !== '全部' && d.cat !== state.cat) return false;
    if (state.platform !== '全部' && d.platform !== state.platform) return false;
    if (q && !(d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q))) return false;
    return true;
  });
  const sorters = {
    hits: (a, b) => b.hits - a.hits,
    newest: (a, b) => b.updated.localeCompare(a.updated),
    name: (a, b) => a.name.localeCompare(b.name, 'zh')
  };
  return list.sort(sorters[state.sort]);
}

function renderDownloads(){
  const list = filteredDownloads();
  const cats = ['全部', ...new Set(downloads.map(d => d.cat))];
  const plats = ['全部', ...new Set(downloads.map(d => d.platform))];

  mainEl.innerHTML = `
    <div class="dl-head">
      <h1>下载站</h1>
      <p>共 ${downloads.length} 个资源，当前筛选出 ${list.length} 个</p>
    </div>
    <div class="toolbar">
      <div class="chips">
        ${cats.map(c => `<button class="chip ${c === state.cat ? 'on' : ''}"
          data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
      </div>
      <select id="platSel">
        ${plats.map(p => `<option value="${esc(p)}" ${p === state.platform ? 'selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <select id="sortSel">
        <option value="hits"   ${state.sort === 'hits'   ? 'selected' : ''}>按热度</option>
        <option value="newest" ${state.sort === 'newest' ? 'selected' : ''}>按更新</option>
        <option value="name"   ${state.sort === 'name'   ? 'selected' : ''}>按名称</option>
      </select>
    </div>
    ${list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>`
                  : '<div class="no-result">没有符合条件的资源，换个筛选条件试试</div>'}
  `;
  mainEl.scrollTop = 0;
}

function cardHTML(d){
  return `
    <div class="dl-card">
      <div class="dl-icon" style="background:${d.color}">${esc(d.short)}</div>
      <div class="dl-body">
        <div class="dl-title">${esc(d.name)}<span>v${esc(d.version)}</span></div>
        <p class="dl-desc">${esc(d.desc)}</p>
        <div class="dl-meta">
          <span>${esc(d.platform)}</span>
          <span>${esc(d.size)}</span>
          <span>${esc(d.updated)}</span>
          <span>${fmtHits(d.hits)}次下载</span>
        </div>
      </div>
      <div class="dl-actions">
        <button class="btn-dl" data-dl="${d.id}">下载</button>
        <button class="sha-btn" data-sha="${d.id}" title="复制 SHA256">SHA256</button>
      </div>
    </div>`;
}

/* =========================================================
   事件
   ========================================================= */
// 路由
window.addEventListener('hashchange', route);

// 顶栏视图切换
$('#segWiki').onclick = () => go('wiki');
$('#segDl').onclick   = () => go('downloads');

// 主题
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch(e){}
  renderHeader();
};

// 搜索
$('#searchInput').addEventListener('input', e => {
  state.q = e.target.value;
  renderSidebar();
  if (state.view === 'downloads') renderMain();
});

// 快捷键：/ 聚焦搜索，Esc 清空
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#searchInput')) {
    e.preventDefault(); $('#searchInput').focus();
  } else if (e.key === 'Escape') {
    state.q = ''; $('#searchInput').value = '';
    renderSidebar();
    if (state.view === 'downloads') renderMain();
    $('#searchInput').blur();
  }
});

// 侧边栏点击（事件委托）
sideEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.article) {
    closeDrawer();
    go('wiki', btn.dataset.article);
  } else if (btn.dataset.cat) {
    state.cat = btn.dataset.cat;
    closeDrawer(); renderSidebar(); renderMain();
  } else if (btn.dataset.platform) {
    state.platform = btn.dataset.platform;
    closeDrawer(); renderSidebar(); renderMain();
  }
});

// 内容区点击（事件委托）
mainEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) { state.cat = chip.dataset.cat; renderSidebar(); renderMain(); return; }

  const sha = e.target.closest('[data-sha]');
  if (sha) {
    e.stopPropagation();
    const d = downloads.find(x => x.id === sha.dataset.sha);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(d.sha256)
        .then(() => toast('SHA256 已复制到剪贴板'))
        .catch(() => toast('复制失败，请手动选择'));
    } else {
      toast('当前环境不支持剪贴板 API');
    }
    return;
  }

  const dl = e.target.closest('[data-dl]');
  if (dl) {
    const d = downloads.find(x => x.id === dl.dataset.dl);
    dl.disabled = true;
    dl.textContent = '准备中…';
    setTimeout(() => {
      window.open(d.url, '_blank', 'noopener');
      d.hits++;
      renderMain();
      toast('已开始下载 ' + d.name);
    }, 500);
  }
});

// 下拉筛选
mainEl.addEventListener('change', e => {
  if (e.target.id === 'platSel') { state.platform = e.target.value; renderSidebar(); renderMain(); }
  if (e.target.id === 'sortSel') { state.sort = e.target.value; renderMain(); }
});

// 移动端抽屉
$('#menuBtn').onclick = () => {
  const open = sideEl.classList.toggle('open');
  $('#mask').classList.toggle('on', open);
};
$('#mask').onclick = closeDrawer;

/* =========================================================
   启动
   ========================================================= */
if (!location.hash) location.hash = '#/wiki/' + articles[0].id;
route();
</script>
</body>
</html>
